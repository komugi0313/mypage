<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>命式作成ソフト（プロトタイプ）</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--line:#e4e0d6;--ink:#2b2723;--muted:#8a8377;--accent:#7a5c3e;--soft:#f0ebe2;
 --moku:#3f7a4e;--ka:#c0453b;--do:#b8892f;--kin:#8f8f98;--sui:#3d6ea8;--good:#3f7a4e;--warn:#c0453b;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.55}
.wrap{max-width:940px;margin:0 auto;padding:18px 14px 70px}
h1{font-size:19px;margin:6px 0 2px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:800;font-size:14px;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:inherit}
.row-check{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:13px}
.row-check input{width:auto}
.btn{margin-top:14px;width:100%;padding:12px;border:0;border-radius:11px;background:var(--accent);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
.btn.sub2{background:#6b6257}
.btn:active{opacity:.85}
h2{font-size:15px;margin:2px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--soft)}
.note{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
.meishiki th,.meishiki td{border:1px solid var(--line);padding:8px 6px;text-align:center;vertical-align:middle}
.meishiki th{background:var(--soft);font-size:12px;color:var(--muted);font-weight:700;width:22%}
.meishiki .rh{background:var(--soft);font-size:11.5px;color:var(--muted);font-weight:700;width:12%}
.gz{font-size:22px;font-weight:800;letter-spacing:1px}
.ten{font-size:12px;color:var(--accent);font-weight:700}
.zoukan{font-size:11.5px;line-height:1.5}
.zoukan b{font-weight:800}
.el-木{color:var(--moku)}.el-火{color:var(--ka)}.el-土{color:var(--do)}.el-金{color:var(--kin)}.el-水{color:var(--sui)}
.gogyo{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center}
.gcell{border:1px solid var(--line);border-radius:10px;padding:8px 4px}
.gcell .n{font-size:20px;font-weight:800}.gcell .l{font-size:12px;font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--soft);margin-top:6px;overflow:hidden}.bar>i{display:block;height:100%}
.ladder{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.lstep{flex:0 0 auto;min-width:78px;border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;background:#fff}
.lstep.now{border-color:var(--accent);box-shadow:0 0 0 2px rgba(122,92,62,.15)}
.lstep .age{font-size:11px;color:var(--muted)}.lstep .lgz{font-size:16px;font-weight:800;margin:2px 0}
.lstep .lten{font-size:11px;color:var(--accent);font-weight:700}.lstep .lter{font-size:10.5px;color:var(--muted)}
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px}
.ycell{border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;font-size:11.5px;background:#fff}
.ycell.now{border-color:var(--accent);background:#fbf7f0}
.ycell .yy{font-weight:800;font-size:12px}.ycell .ygz{font-size:13px;font-weight:700}.ycell .yten{font-size:10.5px;color:var(--accent)}
.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;margin:2px 4px 2px 0}
.tag{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12.5px;margin:3px 5px 3px 0}
.tag b{font-weight:800}
.tag.rel{background:#fbf7f0}.tag.warn{border-color:#e6c3bd;background:#fbeeec}
.score{font-size:34px;font-weight:800;color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini th,.mini td{border:1px solid var(--line);padding:5px 3px;text-align:center;font-size:12px}
.mini th{background:var(--soft);font-size:10.5px;color:var(--muted)}
.mini .mgz{font-size:16px;font-weight:800}.mini .mten{font-size:10px;color:var(--accent)}
.hist{display:flex;flex-wrap:wrap;gap:8px}
.histItem{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12.5px;background:#fff;cursor:pointer;display:flex;align-items:center;gap:8px}
.histItem b{font-weight:800}
.histItem .del{color:var(--warn);font-weight:800;cursor:pointer;padding:0 2px}
.hidden{display:none}
@media(max-width:560px){.two{grid-template-columns:1fr}}
@media print{.noprint{display:none}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
  <h1>命式作成ソフト <span class="note">（プロトタイプ）</span></h1>
  <p class="sub">真太陽時・四柱・通変星・蔵干・十二運・五行・大運・年運・空亡・節入り・神殺・干支関係、そして2人の相性まで。</p>

  <div class="tabs noprint">
    <button class="tab on" id="tabSolo">1人（命式）</button>
    <button class="tab" id="tabPair">2人（相性）</button>
  </div>

  <!-- 1人 -->
  <div class="card noprint" id="soloForm">
    <div class="form">
      <div><label>生年月日</label><input type="date" id="bd" value="1990-06-15"></div>
      <div><label>出生時間</label><input type="time" id="bt" value="10:30"><div class="row-check"><input type="checkbox" id="tu"><label for="tu" style="margin:0">時間不明</label></div></div>
      <div><label>性別</label><select id="sex"><option value="female">女性</option><option value="male">男性</option></select></div>
      <div><label>出生地</label><select id="place"></select></div>
      <div id="manualWrap" class="hidden"><label>経度／標準子午線</label><div style="display:flex;gap:6px"><input type="number" id="lon" step="0.01" placeholder="経度139.69"><input type="number" id="mer" step="1" value="135"></div></div>
      <div><label>名前（保存用・任意）</label><input type="text" id="pname" placeholder="例）自分"></div>
    </div>
    <button class="btn" id="go">命式を作成する</button>
    <div style="display:flex;gap:8px"><button class="btn sub2" id="save" style="flex:1">この命式を保存</button></div>
    <p class="note" id="err" style="color:var(--warn);margin:10px 0 0"></p>
  </div>

  <!-- 2人 -->
  <div class="card noprint hidden" id="pairForm">
    <div class="two">
      <div>
        <div class="pill">お一人目</div>
        <div style="margin-top:8px"><label>生年月日</label><input type="date" id="Abd" value="2006-05-27"></div>
        <div style="margin-top:8px"><label>出生時間</label><input type="time" id="Abt" value="12:00"><div class="row-check"><input type="checkbox" id="Atu" checked><label for="Atu" style="margin:0">時間不明</label></div></div>
        <div style="margin-top:8px"><label>性別</label><select id="Asex"><option value="female">女性</option><option value="male">男性</option></select></div>
      </div>
      <div>
        <div class="pill">お二人目</div>
        <div style="margin-top:8px"><label>生年月日</label><input type="date" id="Bbd" value="2007-10-02"></div>
        <div style="margin-top:8px"><label>出生時間</label><input type="time" id="Bbt" value="12:00"><div class="row-check"><input type="checkbox" id="Btu" checked><label for="Btu" style="margin:0">時間不明</label></div></div>
        <div style="margin-top:8px"><label>性別</label><select id="Bsex"><option value="male">男性</option><option value="female">女性</option></select></div>
      </div>
    </div>
    <button class="btn" id="goPair">相性を見る</button>
    <p class="note" id="errP" style="color:var(--warn);margin:10px 0 0"></p>
  </div>

  <div class="card noprint" id="histCard"><h2>保存した命式（履歴）</h2><div class="hist" id="hist"></div><p class="note" id="histEmpty">まだ保存された命式はありません。</p></div>

  <div id="out"></div>
</div>

<script src="./pro-bazi.js"></script>
<script src="./pro-adapter.js"></script>
<script>
var CITIES={"東京":[139.69,135],"札幌":[141.35,135],"仙台":[140.87,135],"名古屋":[136.91,135],"大阪":[135.50,135],"京都":[135.77,135],"広島":[132.46,135],"福岡":[130.40,135],"那覇":[127.68,135],"ソウル":[126.98,135],"台北":[121.56,120],"上海":[121.47,120],"北京":[116.40,120],"バンコク":[100.50,105],"ジャカルタ":[106.85,105],"ロサンゼルス":[-118.24,-120],"ニューヨーク":[-74.00,-75],"ロンドン":[-0.13,0],"（経度を手入力）":["manual",0]};
var STEMS=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"],BR=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
var STEM_EL={甲:"木",乙:"木",丙:"火",丁:"火",戊:"土",己:"土",庚:"金",辛:"金",壬:"水",癸:"水"};
var BR_EL={子:"水",丑:"土",寅:"木",卯:"木",辰:"土",巳:"火",午:"火",未:"土",申:"金",酉:"金",戌:"土",亥:"水"};
var EL_ORDER=["木","火","土","金","水"];
/* 韓国語→日本語 12節気（月の節） */
var SETSU_JP={"입춘":"立春","경칩":"啓蟄","청명":"清明","입하":"立夏","망종":"芒種","소서":"小暑","입추":"立秋","백로":"白露","한로":"寒露","입동":"立冬","대설":"大雪","소한":"小寒"};
/* 神殺の日本語ひとこと */
var STAR_JP={"天乙貴人":"最強の助け・人徳","太極貴人":"探究・信仰・研究","福星貴人":"衣食住の安泰","文昌貴人":"学問・文才","天厨貴人":"食に恵まれる","天官貴人":"地位・出世","金与禄":"結婚・財の安定","暗禄":"陰の援助","咸池":"桃花・色気","紅艶":"強い色気・魅力","驛馬":"移動・変化・旅","羊刃":"強い刃の気・激しさ","飛刃":"隠れた鋭さ","魁罡":"強烈な意志・カリスマ","禄馬":"才能＋機動力","将星":"リーダー・中心","華蓋":"芸術・孤高・信仰","日刃":"自らに立つ刃・強さ","天德貴人":"天の加護","月德貴人":"静かな加護","天德合":"縁による加護","月德合":"和による加護","隔角":"孤立・すきま風","妨害殺":"妨げ・邪魔","囚獄":"束縛・停滞","劫殺":"急な損失に注意","亡神":"喪失・うっかり","血刃":"ケガに注意"};
var REL_JP={"干合":"強い引き合い","六合":"結びつき・仲良し","三合":"強い調和","半会":"前進の勢い","方合":"一極集中","冲":"衝突・変化の軸","刑":"摩擦・調整","破":"小さなほころび","害":"見えないすれ違い"};

function two(n){return (n<10?"0":"")+n;}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function elc(el){return '<span class="el-'+el+'">'+el+'</span>';}
function elS(stem){var e=STEM_EL[stem]||"";return '<span class="el-'+e+'">'+esc(stem)+'</span>';}
function elB(br){var e=BR_EL[br]||"";return '<span class="el-'+e+'">'+esc(br)+'</span>';}
function elGz(gz){return elS(gz[0])+elB(gz[1]);}

(function initPlaces(){var sel=document.getElementById("place");Object.keys(CITIES).forEach(function(c){var o=document.createElement("option");o.value=c;o.textContent=c;sel.appendChild(o);});sel.value="東京";sel.onchange=function(){document.getElementById("manualWrap").classList.toggle("hidden",CITIES[sel.value][0]!=="manual");};})();
document.getElementById("tu").onchange=function(){document.getElementById("bt").disabled=this.checked;};
document.getElementById("go").onclick=runSolo;
document.getElementById("save").onclick=saveCurrent;
document.getElementById("goPair").onclick=runPair;
document.getElementById("tabSolo").onclick=function(){setTab("solo");};
document.getElementById("tabPair").onclick=function(){setTab("pair");};
function setTab(t){
  document.getElementById("tabSolo").classList.toggle("on",t==="solo");
  document.getElementById("tabPair").classList.toggle("on",t==="pair");
  document.getElementById("soloForm").classList.toggle("hidden",t!=="solo");
  document.getElementById("histCard").classList.toggle("hidden",t!=="solo");
  document.getElementById("pairForm").classList.toggle("hidden",t!=="pair");
  document.getElementById("out").innerHTML="";
  if(t==="pair") runPair(); else runSolo();
}

function readSolo(){
  var bd=document.getElementById("bd").value; if(!bd) throw "生年月日を入力してください";
  var P=bd.split("-"),y=+P[0],mo=+P[1],d=+P[2];
  var tu=document.getElementById("tu").checked,hh=12,mi=0;
  if(!tu){var bt=document.getElementById("bt").value||"12:00";hh=+bt.split(":")[0];mi=+bt.split(":")[1];}
  var sex=document.getElementById("sex").value;
  var pc=document.getElementById("place").value,cc=CITIES[pc],place=null,lonShown="";
  if(cc[0]==="manual"){var lon=parseFloat(document.getElementById("lon").value),mer=parseFloat(document.getElementById("mer").value||"135");if(!isNaN(lon)){place={lon:lon,mer:isNaN(mer)?135:mer};lonShown="経度"+lon+"°／標準"+place.mer+"°";}}
  else{place={lon:cc[0],mer:cc[1]};lonShown=pc+"（経度"+cc[0]+"°）";}
  return {y:y,mo:mo,d:d,hh:hh,mi:mi,tu:tu,sex:sex,place:place,lonShown:lonShown,name:document.getElementById("pname").value||""};
}

function runSolo(){
  var err=document.getElementById("err");err.textContent="";
  try{
    var i=readSolo();
    var p=window.PersonBazi(i.y,i.mo,i.d,i.hh,i.mi,i.tu,i.sex,(!i.tu&&i.place)?i.place:null);
    if(!p||!p.ok){err.textContent="計算エラー: "+(p&&p.error||"unknown");return;}
    renderSolo(p,i);
  }catch(e){err.textContent="エラー: "+(e&&e.message||e);}
}

function setsuInfo(c){
  var b=c.birth||{};var name=SETSU_JP[b.setsuName]||b.setsuName||"-";
  var out={name:name,elapsed:"",entry:""};
  if(typeof b.setsuMin==="number"){var m=b.setsuMin;var dd=Math.floor(m/1440),hh=Math.floor((m%1440)/60),mm=m%60;out.elapsed=dd+"日"+hh+"時間"+mm+"分";
    if(b.clock){var t=new Date(b.clock.replace(" ","T"));if(!isNaN(t)){t.setMinutes(t.getMinutes()-m);out.entry=t.getFullYear()+"-"+two(t.getMonth()+1)+"-"+two(t.getDate())+" "+two(t.getHours())+":"+two(t.getMinutes());}}}
  return out;
}

function renderSolo(p,inp){
  var c=p.pro,out=document.getElementById("out"),H="";
  var pil=p.pillars.slice();
  var corr;
  if(inp.tu) corr="出生時間：<b>不明</b>（時柱は算出せず、年月日で構成）";
  else{var mmin=inp.place?Math.round((inp.place.lon-inp.place.mer)*4):0;corr="入力 "+two(inp.hh)+":"+two(inp.mi)+"（"+esc(inp.lonShown||"補正なし")+"）"+(inp.place?"／経度差 "+(mmin>=0?"+":"")+mmin+"分＋均時差を適用し四柱を確定":"");}
  var kb=(window.kuboX?window.kuboX(c):[]).join("");
  H+='<div class="card"><h2>基本情報・真太陽時</h2>'
    +'<p class="note" style="margin:0 0 6px">'+esc(inp.y)+'年'+esc(inp.mo)+'月'+esc(inp.d)+'日 ／ '+(inp.sex==="male"?"男性":"女性")+(inp.name?'（'+esc(inp.name)+'）':'')+'</p>'
    +'<p class="note" style="margin:0">'+corr+'</p>'
    +'<div style="margin-top:8px"><span class="pill">日主 '+elS(c.dayMaster.stem)+'（'+elc(c.dayMaster.element)+'）</span><span class="pill">'+esc(p.sType)+'</span><span class="pill">空亡 '+esc(kb)+'</span></div></div>';

  // 節入り
  var si=setsuInfo(c);
  H+='<div class="card"><h2>節入り（24節気）</h2><p style="margin:0">生まれた月の節：<b style="font-size:16px">'+esc(si.name)+'</b>'
    +(si.entry?'<br><span class="note">節入り日時：'+esc(si.entry)+'</span>':'')
    +(si.elapsed?'<br><span class="note">節入りからの経過：'+esc(si.elapsed)+'（この経過が大運の起運計算に使われます）</span>':'')+'</p></div>';

  // 命式
  H+='<div class="card"><h2>命式（四柱）</h2><table class="meishiki"><tr><th></th><th>年柱</th><th>月柱</th><th>日柱</th><th>時柱</th></tr>';
  H+='<tr><td class="rh">天干<br>(通変星)</td>'+cell4(pil,function(x){return '<div class="gz">'+elS(x.stem)+'</div><div class="ten">'+esc(x.tenStar||"日主")+'</div>';},inp.tu)+'</tr>';
  H+='<tr><td class="rh">地支</td>'+cell4(pil,function(x){return '<div class="gz">'+elB(x.branch)+'</div>';},inp.tu)+'</tr>';
  H+='<tr><td class="rh">蔵干<br>(通変星)</td>'+cell4(pil,function(x){return '<div class="zoukan">'+(x.hiddenStems||[]).map(function(h){return '<b>'+elS(h.stem)+'</b> '+esc(h.role)+' '+esc(h.tenStar||"");}).join("<br>")+'</div>';},inp.tu)+'</tr>';
  H+='<tr><td class="rh">十二運</td>'+cell4(pil,function(x){return esc(x.terrain||"-");},inp.tu)+'</tr>';
  H+='</table></div>';

  // 五行
  var five=p.five||{},tot=0;EL_ORDER.forEach(function(e){tot+=five[e]||0;});tot=tot||1;
  H+='<div class="card"><h2>五行バランス</h2><div class="gogyo">';
  EL_ORDER.forEach(function(e){var n=five[e]||0;H+='<div class="gcell"><div class="l el-'+e+'">'+e+'</div><div class="n">'+n+'</div><div class="bar"><i class="el-'+e+'" style="width:'+Math.round(n/tot*100)+'%;background:currentColor"></i></div></div>';});
  H+='</div><p class="note" style="margin:8px 0 0">喜神：'+favList(p.fav,"喜")+' ／ 忌神：'+favList(p.fav,"忌")+'</p></div>';

  // 干支関係
  var rels=window.natalRelationsX?window.natalRelationsX(c):[];
  H+='<div class="card"><h2>干支関係（三合・方合・冲・刑・害・破・合）</h2>';
  if(rels.length){ H+=rels.map(function(r){var warn=/冲|刑|害|破/.test(r.kind);return '<span class="tag '+(warn?"warn":"rel")+'"><b>'+esc(r.kind)+'</b> '+(r.branches||[]).map(elB).join("")+'<span class="note"> '+(REL_JP[r.kind]||"")+'</span></span>';}).join(""); }
  else H+='<p class="note" style="margin:0">目立つ干支関係はありません（対立も強い偏りも少ない安定型）。</p>';
  H+='</div>';

  // 神殺
  var ss=window.shinsatsuHits?window.shinsatsuHits(c):[];
  H+='<div class="card"><h2>神殺・吉凶星</h2>';
  if(ss.length){ H+=ss.map(function(s){var nm=s.split("(")[0].replace(/^年/,"");var g=STAR_JP[nm]||"";return '<span class="tag"><b>'+esc(s)+'</b>'+(g?'<span class="note"> '+esc(g)+'</span>':'')+'</span>';}).join(""); }
  else H+='<p class="note" style="margin:0">該当する神殺はありません。</p>';
  H+='<p class="note" style="margin:8px 0 0">「(年○)」は年支からも成立するもの。</p></div>';

  // 大運
  var now=c.now||{},di=now.daeunIndex,sf=c.startFortune||{};
  H+='<div class="card"><h2>大運（起運：'+esc(sf.years!=null?sf.years+"歳"+(sf.months||0)+"ヶ月":"-")+' ／ '+(sf.forward?"順行":"逆行")+'）</h2><div class="ladder">';
  (c.decadeFortunes||[]).forEach(function(dd,i){var a=(dd.startAge!=null?dd.startAge:dd.age);H+='<div class="lstep'+(i===di?" now":"")+'"><div class="age">'+esc(a)+'〜'+esc(a+9)+'歳</div><div class="lgz">'+elGz(dd.ganzhi)+'</div><div class="lten">'+esc(dd.tenStar||"")+'</div><div class="lter">'+esc(dd.terrain||"")+'</div></div>';});
  H+='</div></div>';

  // 年運
  var cy=now.year;
  H+='<div class="card"><h2>年運</h2><div class="years">';
  (c.annualFortunes||[]).forEach(function(a){H+='<div class="ycell'+(a.year===cy?" now":"")+'"><div class="yy">'+esc(a.year)+'</div><div class="ygz">'+elGz(a.ganzhi)+'</div><div class="yten">'+esc(a.tenStar||"")+'</div></div>';});
  H+='</div><p class="note" style="margin:8px 0 0">枠付き＝今年（'+esc(cy||"-")+'）。年運の切替は立春が基準です。</p></div>';

  H+='<div class="card noprint"><button class="btn sub2" onclick="window.print()">この命式を印刷／PDF保存</button></div>';
  out.innerHTML=H;out.scrollIntoView({behavior:"smooth",block:"start"});
}

function cell4(pil,fn,tu){var h="";for(var i=0;i<4;i++){var x=pil[i];if(i===3&&(tu||!x)){h+='<td class="note">—</td>';continue;}h+='<td>'+fn(x)+'</td>';}return h;}
function favList(fav,mark){if(!fav)return"-";var a=EL_ORDER.filter(function(e){return fav[e]===mark;});return a.length?a.map(elc).join("・"):"-";}

/* ===== 2人 相性 ===== */
function readPerson(pre){
  var bd=document.getElementById(pre+"bd").value; if(!bd) throw "生年月日を入力してください";
  var P=bd.split("-"),y=+P[0],mo=+P[1],d=+P[2];
  var tu=document.getElementById(pre+"tu").checked,hh=12,mi=0;
  if(!tu){var bt=document.getElementById(pre+"bt").value||"12:00";hh=+bt.split(":")[0];mi=+bt.split(":")[1];}
  var sex=document.getElementById(pre+"sex").value;
  return {y:y,mo:mo,d:d,hh:hh,mi:mi,tu:tu,sex:sex};
}
function runPair(){
  var err=document.getElementById("errP");err.textContent="";
  try{
    var a=readPerson("A"),b=readPerson("B");
    var pa=window.PersonBazi(a.y,a.mo,a.d,a.hh,a.mi,a.tu,a.sex);
    var pb=window.PersonBazi(b.y,b.mo,b.d,b.hh,b.mi,b.tu,b.sex);
    if(!pa.ok||!pb.ok){err.textContent="計算エラー";return;}
    renderPair(pa,pb,a,b);
  }catch(e){err.textContent="エラー: "+(e&&e.message||e);}
}
function miniChart(p,tu){
  var pil=p.pillars.slice();
  var h='<table class="mini"><tr><th>年</th><th>月</th><th>日</th><th>時</th></tr><tr>';
  for(var i=0;i<4;i++){var x=pil[i];if(i===3&&(tu||!x)){h+='<td>—</td>';continue;}h+='<td><div class="mgz">'+elGz(x.ganzhi)+'</div><div class="mten">'+esc(x.tenStar||"日主")+'</div></td>';}
  h+='</tr></table>';return h;
}
function renderPair(pa,pb,a,b){
  var cd=window.compatData?window.compatData(pa.pro,pb.pro):null;
  var out=document.getElementById("out"),H="";
  H+='<div class="card"><h2>相性 総合</h2>';
  if(cd){
    H+='<div style="text-align:center"><div class="score">'+esc(cd.score)+'<span style="font-size:16px">点</span></div><p class="note" style="margin:0">'+(cd.good?"とても良い縁が出ています":"補い合える関係です")+'</p></div>';
  }
  H+='<div class="two" style="margin-top:12px">'
    +'<div><div class="pill">お一人目 '+elS(pa.pro.dayMaster.stem)+'（'+elc(pa.pro.dayMaster.element)+'）</div>'+miniChart(pa,a.tu)+'</div>'
    +'<div><div class="pill">お二人目 '+elS(pb.pro.dayMaster.stem)+'（'+elc(pb.pro.dayMaster.element)+'）</div>'+miniChart(pb,b.tu)+'</div></div></div>';

  if(cd){
    H+='<div class="card"><h2>二人の縁（干支・十神）</h2>';
    var good=[],warn=[];
    if(cd.kangou) good.push('<span class="tag rel"><b>干合</b><span class="note"> 日主どうしが強く引き合う</span></span>');
    (cd.seiritsu||[]).forEach(function(s){good.push('<span class="tag rel"><b>'+esc(s.kind)+'('+esc(s.el)+')</b><span class="note"> 二人で完成＝最強の絆</span></span>');});
    (cd.hankai||[]).forEach(function(s){good.push('<span class="tag rel"><b>半会('+esc(s.el)+')</b><span class="note"> 前進の勢い</span></span>');});
    (cd.rikugouAll||[]).forEach(function(pr){good.push('<span class="tag rel"><b>六合</b> '+pr.map(elB).join("")+'<span class="note"> 結びつき</span></span>');});
    if(cd.chong) warn.push('<span class="tag warn"><b>冲</b><span class="note"> 刺激・変化の軸</span></span>');
    if(cd.kei) warn.push('<span class="tag warn"><b>刑</b><span class="note"> 摩擦・調整</span></span>');
    if(cd.ha) warn.push('<span class="tag warn"><b>破</b><span class="note"> 小さなほころび</span></span>');
    if(cd.gai) warn.push('<span class="tag warn"><b>害</b><span class="note"> すれ違い注意</span></span>');
    H+='<p style="margin:0 0 6px"><b>相手からあなたへの十神：</b>'+esc(cd.tenBtoA||"-")+' ／ <b>あなたから相手へ：</b>'+esc(cd.tenAtoB||"-")+'</p>';
    H+='<div style="margin-top:6px"><div class="note" style="margin-bottom:3px">良い縁</div>'+(good.length?good.join(""):'<span class="note">特筆すべき吉の結びは控えめですが、これは「縁が無い」という意味ではありません。</span>')+'</div>';
    if(warn.length) H+='<div style="margin-top:10px"><div class="note" style="margin-bottom:3px">気をつける流れ</div>'+warn.join("")+'</div>';
    H+='<p class="note" style="margin:10px 0 0">五行の流れ：'+elc(cd.aEl)+'（一人目）と '+elc(cd.bEl)+'（二人目）。相生・相剋の関係が二人のリズムを作ります。</p>';
    H+='</div>';
  } else H+='<div class="card"><p class="note">相性データを取得できませんでした。</p></div>';
  H+='<div class="card noprint"><button class="btn sub2" onclick="window.print()">相性結果を印刷／PDF保存</button></div>';
  out.innerHTML=H;out.scrollIntoView({behavior:"smooth",block:"start"});
}

/* ===== 保存・履歴（localStorage） ===== */
var HKEY="ms_history_v1";
function loadHist(){try{return JSON.parse(localStorage.getItem(HKEY)||"[]");}catch(e){return [];}}
function saveHist(a){try{localStorage.setItem(HKEY,JSON.stringify(a));}catch(e){}}
function saveCurrent(){
  try{
    var i=readSolo();
    var arr=loadHist();
    arr.unshift({id:Date.now(),name:i.name||(i.y+"/"+i.mo+"/"+i.d),y:i.y,mo:i.mo,d:i.d,hh:i.hh,mi:i.mi,tu:i.tu,sex:i.sex,place:document.getElementById("place").value});
    if(arr.length>40)arr=arr.slice(0,40);
    saveHist(arr);renderHist();
  }catch(e){document.getElementById("err").textContent="保存エラー: "+(e&&e.message||e);}
}
function renderHist(){
  var arr=loadHist(),box=document.getElementById("hist"),empty=document.getElementById("histEmpty");
  empty.style.display=arr.length?"none":"";
  box.innerHTML=arr.map(function(it){return '<div class="histItem" data-id="'+it.id+'"><b>'+esc(it.name)+'</b><span class="note">'+esc(it.y)+'/'+esc(it.mo)+'/'+esc(it.d)+(it.tu?" 時刻不明":" "+two(it.hh)+":"+two(it.mi))+'</span><span class="del" data-del="'+it.id+'">×</span></div>';}).join("");
  box.querySelectorAll(".histItem").forEach(function(el){el.onclick=function(e){if(e.target.getAttribute("data-del")){var id=+e.target.getAttribute("data-del");saveHist(loadHist().filter(function(x){return x.id!==id;}));renderHist();return;}applyHist(+el.getAttribute("data-id"));};});
}
function applyHist(id){
  var it=loadHist().filter(function(x){return x.id===id;})[0];if(!it)return;
  document.getElementById("bd").value=it.y+"-"+two(it.mo)+"-"+two(it.d);
  document.getElementById("tu").checked=!!it.tu;document.getElementById("bt").disabled=!!it.tu;
  if(!it.tu)document.getElementById("bt").value=two(it.hh)+":"+two(it.mi);
  document.getElementById("sex").value=it.sex;
  if(it.place&&CITIES[it.place]){document.getElementById("place").value=it.place;document.getElementById("manualWrap").classList.toggle("hidden",CITIES[it.place][0]!=="manual");}
  document.getElementById("pname").value=it.name||"";
  runSolo();
}

renderHist();
runSolo();
</script>
