<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>命式作成ソフト（プロトタイプ）</title>
<style>
:root{--bg:#f2f3f8;--card:#fff;--line:#dcdee8;--ink:#20233a;--muted:#7c80a0;--accent:#3b3f7a;--soft:#eceef6;--sub:#5a5e86;
 --moku:#3f7a4e;--ka:#c0453b;--do:#b8892f;--kin:#8f8f98;--sui:#3d6ea8;--good:#3f7a4e;--warn:#c0453b;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.55}
.wrap{max-width:940px;margin:0 auto;padding:18px 14px 70px}
h1{font-size:19px;margin:6px 0 2px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:800;font-size:14px;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:inherit}
.row-check{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:13px}
.row-check input{width:auto}
input[type=date],input[type=time]{min-height:44px}
input[type=time]:disabled{opacity:.4}
.tgl{margin-top:8px;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}
.tgl.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn{margin-top:14px;width:100%;padding:12px;border:0;border-radius:11px;background:var(--accent);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
.btn.sub2{background:var(--sub)}
.swatches{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 14px}
.sw{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);transition:transform .1s}
.sw.on{box-shadow:0 0 0 2px var(--accent);transform:scale(1.12)}
.dsel{display:flex;gap:6px}
.dsel select{min-height:44px}
.btn:active{opacity:.85}
h2{font-size:15px;margin:2px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--soft)}
.note{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
.meishiki th,.meishiki td{border:1px solid var(--line);padding:8px 6px;text-align:center;vertical-align:middle}
.meishiki th{background:var(--soft);font-size:12px;color:var(--muted);font-weight:700;width:22%}
.meishiki .rh{background:var(--soft);font-size:11.5px;color:var(--muted);font-weight:700;width:12%}
.gz{font-size:22px;font-weight:800;letter-spacing:1px}
.ten{font-size:12px;color:var(--accent);font-weight:700}
.zoukan{font-size:11.5px;line-height:1.5}
.zoukan b{font-weight:800}
.el-木{color:var(--moku)}.el-火{color:var(--ka)}.el-土{color:var(--do)}.el-金{color:var(--kin)}.el-水{color:var(--sui)}
.gogyo{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center}
.gcell{border:1px solid var(--line);border-radius:10px;padding:8px 4px}
.gcell .n{font-size:20px;font-weight:800}.gcell .l{font-size:12px;font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--soft);margin-top:6px;overflow:hidden}.bar>i{display:block;height:100%}
.ladder{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.lstep{flex:0 0 auto;min-width:78px;border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;background:#fff}
.lstep.now{border-color:var(--accent);box-shadow:0 0 0 2px rgba(122,92,62,.15)}
.lstep .age{font-size:11px;color:var(--muted)}.lstep .lgz{font-size:16px;font-weight:800;margin:2px 0}
.lstep .lten{font-size:11px;color:var(--accent);font-weight:700}.lstep .lter{font-size:10.5px;color:var(--muted)}
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px}
.ycell{border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;font-size:11.5px;background:#fff}
.ycell.now{border-color:var(--accent);background:#fbf7f0}
.ycell .yy{font-weight:800;font-size:12px}.ycell .ygz{font-size:13px;font-weight:700}.ycell .yten{font-size:10.5px;color:var(--accent)}
.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;margin:2px 4px 2px 0}
.tag{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12.5px;margin:3px 5px 3px 0}
.tag b{font-weight:800}
.tag.rel{background:#fbf7f0}.tag.warn{border-color:#e6c3bd;background:#fbeeec}
.score{font-size:34px;font-weight:800;color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini th,.mini td{border:1px solid var(--line);padding:5px 3px;text-align:center;font-size:12px}
.mini th{background:var(--soft);font-size:10.5px;color:var(--muted)}
.mini .mgz{font-size:16px;font-weight:800}.mini .mten{font-size:10px;color:var(--accent)}
.hist{display:flex;flex-wrap:wrap;gap:8px}
.histItem{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12.5px;background:#fff;cursor:pointer;display:flex;align-items:center;gap:8px}
.histItem b{font-weight:800}
.histItem .del{color:var(--warn);font-weight:800;cursor:pointer;padding:0 2px}
.hidden{display:none}
@media(max-width:560px){.two{grid-template-columns:1fr}}
@media print{.noprint{display:none}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
  <h1>命式作成ソフト <span class="note">（プロトタイプ）</span></h1>
  <p class="sub">真太陽時・四柱・通変星・蔵干・十二運・五行・大運・年運・空亡・節入り・神殺・干支関係、そして2人の相性まで。</p>

  <div class="swatches noprint" id="swatches"></div>
  <div class="tabs noprint">
    <button class="tab on" id="tabSolo">1人（命式）</button>
    <button class="tab" id="tabPair">2人（相性）</button>
  </div>

  <!-- 1人 -->
  <div class="card noprint" id="soloForm">
    <div class="form">
      <div><label>生年月日</label><div class="dsel"><select id="by"></select><select id="bm"></select><select id="bdd"></select></div></div>
      <div><label>出生時間</label><div class="dsel"><select id="bh"></select><select id="bmin"></select></div><input type="checkbox" id="tu" hidden><button type="button" class="tgl" id="tuBtn">🕐 時刻がわからない</button></div>
      <div><label>性別</label><select id="sex"><option value="female">女性</option><option value="male">男性</option></select></div>
      <div><label>出生地</label><select id="place"></select></div>
      <div id="manualWrap" class="hidden"><label>経度／標準子午線</label><div style="display:flex;gap:6px"><input type="number" id="lon" step="0.01" placeholder="経度139.69"><input type="number" id="mer" step="1" value="135"></div></div>
      <div><label>名前（保存用・任意）</label><input type="text" id="pname" placeholder="例）自分"></div>
    </div>
    <button class="btn" id="go">命式を作成する</button>
    <div style="display:flex;gap:8px"><button class="btn sub2" id="save" style="flex:1">この命式を保存</button></div>
    <details style="margin-top:12px"><summary style="cursor:pointer;font-size:13px;color:var(--muted);font-weight:700">🤖 AI鑑定の設定（任意・キーが必要）</summary>
      <div style="margin-top:8px"><label>Gemini APIキー（この端末にのみ保存）</label><input type="password" id="gkey" placeholder="AIza..." autocomplete="off"></div>
      <div style="margin-top:8px"><label>モデル</label><select id="gmodel"><option value="gemini-2.5-flash">gemini-2.5-flash（推奨）</option><option value="gemini-3.6-flash">gemini-3.6-flash</option><option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite（最安）</option></select></div>
      <p class="note" style="margin:6px 0 0">キーは端末内(localStorage)のみ・外部送信はGoogleへの鑑定リクエストのみ。テスト後は再発行推奨。</p>
    </details>
    <p class="note" id="err" style="color:var(--warn);margin:10px 0 0"></p>
  </div>

  <!-- 2人 -->
  <div class="card noprint hidden" id="pairForm">
    <div class="two">
      <div>
        <div class="pill">お一人目</div>
        <div style="margin-top:8px"><label>生年月日</label><div class="dsel"><select id="Aby"></select><select id="Abm"></select><select id="Abdd"></select></div></div>
        <div style="margin-top:8px"><label>出生時間</label><div class="dsel"><select id="Abh"></select><select id="Abmin"></select></div><input type="checkbox" id="Atu" checked hidden><button type="button" class="tgl" id="AtuBtn">🕐 時刻がわからない</button></div>
        <div style="margin-top:8px"><label>性別</label><select id="Asex"><option value="female">女性</option><option value="male">男性</option></select></div>
      </div>
      <div>
        <div class="pill">お二人目</div>
        <div style="margin-top:8px"><label>生年月日</label><div class="dsel"><select id="Bby"></select><select id="Bbm"></select><select id="Bbdd"></select></div></div>
        <div style="margin-top:8px"><label>出生時間</label><div class="dsel"><select id="Bbh"></select><select id="Bbmin"></select></div><input type="checkbox" id="Btu" checked hidden><button type="button" class="tgl" id="BtuBtn">🕐 時刻がわからない</button></div>
        <div style="margin-top:8px"><label>性別</label><select id="Bsex"><option value="male">男性</option><option value="female">女性</option></select></div>
      </div>
    </div>
    <button class="btn" id="goPair">相性を見る</button>
    <p class="note" id="errP" style="color:var(--warn);margin:10px 0 0"></p>
  </div>

  <div class="card noprint" id="histCard"><h2>保存した命式（履歴）</h2><div class="hist" id="hist"></div><p class="note" id="histEmpty">まだ保存された命式はありません。</p></div>

  <div id="out"></div>
</div>

<script src="./pro-bazi.js"></script>
<script src="./pro-adapter.js"></script>
<script>

"韓国":[["ソウル",126.98],["釜山（プサン）",129.08],["仁川（インチョン）",126.71],["大邱（テグ）",128.60],["大田（テジョン）",127.38],["光州（クァンジュ）",126.85],["蔚山（ウルサン）",129.31],["水原（スウォン）",127.03],["城南（ソンナム）",127.14],["高陽（コヤン）",126.83],["龍仁（ヨンイン）",127.18],["清州（チョンジュ）",127.49],["全州（チョンジュ）",127.15],["天安（チョナン）",127.11],["江陵（カンヌン）",128.90],["春川（チュンチョン）",127.73],["浦項（ポハン）",129.34],["済州（チェジュ）",126.53]]};
var PLON={}; Object.keys(PLACES).forEach(function(g){PLACES[g].forEach(function(x){PLON[x[0]]=x[1];});});
var MANUAL_OPT="（経度を手入力）";
var MSTEM_EL={甲:"木",乙:"木",丙:"火",丁:"火",戊:"土",己:"土",庚:"金",辛:"金",壬:"水",癸:"水"};

var EL_ORDER=["木","火","土","金","水"];

/* 神殺の日本語ひとこと */
var STAR_JP={"天乙貴人":"最強の助け・人徳","太極貴人":"探究・信仰・研究","福星貴人":"衣食住の安泰","文昌貴人":"学問・文才","天厨貴人":"食に恵まれる","天官貴人":"地位・出世","金与禄":"結婚・財の安定","暗禄":"陰の援助","咸池":"桃花・色気","紅艶":"強い色気・魅力","驛馬":"移動・変化・旅","羊刃":"強い刃の気・激しさ","飛刃":"隠れた鋭さ","魁罡":"強烈な意志・カリスマ","禄馬":"才能＋機動力","将星":"リーダー・中心","華蓋":"芸術・孤高・信仰","日刃":"自らに立つ刃・強さ","天德貴人":"天の加護","月德貴人":"静かな加護","天德合":"縁による加護","月德合":"和による加護","隔角":"孤立・すきま風","妨害殺":"妨げ・邪魔","囚獄":"束縛・停滞","劫殺":"急な損失に注意","亡神":"喪失・うっかり","血刃":"ケガに注意"};
var REL_JP={"干合":"強い引き合い","六合":"結びつき・仲良し","三合":"強い調和","半会":"前進の勢い","方合":"一極集中","冲":"衝突・変化の軸","刑":"摩擦・調整","破":"小さなほころび","害":"見えないすれ違い"};
/* 解析用テンプレ（ルールベース／AIなし） */
var EL_NATURE={木:"成長・向上心・優しさ。伸びたい気持ちが強く、面倒見もよいタイプ。",火:"情熱・表現・華やかさ。明るく人を照らし、感情がまっすぐ。",土:"安定・信頼・面倒見。地に足がつき、コツコツ積み上げる。",金:"決断・けじめ・美意識。筋を通し、白黒はっきりさせる。",水:"知恵・柔軟・共感。流れを読み、しなやかに立ち回る。"};
var TEN_THEME={比肩:"自立心とマイペース。自分の軸で動く",劫財:"行動力と勝負勘。仲間と動くと強い",食神:"のびのびした才能。楽しみながら形にする",傷官:"鋭い感性と表現力。完璧主義な一面も",偏財:"フットワークと商才。人脈と機会に恵まれる",正財:"堅実・誠実。コツコツ貯め、信頼を築く",偏官:"度胸と行動力。プレッシャーに強い",正官:"まじめ・責任感・秩序。きちんと者",偏印:"独自の発想と直感。探究心が深い",印綬:"学びと知性。人に支えられ、育てる力"};

function two(n){return (n<10?"0":"")+n;}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function mdLite(s){var t=esc(s);
  t=t.replace(/^\s*#{1,6}\s*(.+)$/gm,'<b style="display:block;margin:12px 0 4px;color:var(--accent)">$1</b>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  t=t.replace(/^\s*[-・]\s+/gm,'・').replace(/^\s*---+\s*$/gm,'<hr style="border:0;border-top:1px solid var(--line);margin:10px 0">');
  return t.replace(/\n/g,'<br>');}
function elc(el){return '<span class="el-'+el+'">'+el+'</span>';}
function elS(stem){var e=MSTEM_EL[stem]||"";return '<span class="el-'+e+'">'+esc(stem)+'</span>';}
function elB(br){var e=MBR_EL[br]||"";return '<span class="el-'+e+'">'+esc(br)+'</span>';}
function elGz(gz){return elS(gz[0])+elB(gz[1]);}

(function initPlaces(){var sel=document.getElementById("place");
  Object.keys(PLACES).forEach(function(g){var og=document.createElement("optgroup");og.label=g;PLACES[g].forEach(function(x){var o=document.createElement("option");o.value=x[0];o.textContent=x[0];og.appendChild(o);});sel.appendChild(og);});
  var mo=document.createElement("option");mo.value=MANUAL_OPT;mo.textContent=MANUAL_OPT;sel.appendChild(mo);
  sel.value="東京";
  sel.onchange=function(){document.getElementById("manualWrap").classList.toggle("hidden",sel.value!==MANUAL_OPT);};
})();
function wireToggle(btnId,cbId,timeIds){var btn=document.getElementById(btnId),cb=document.getElementById(cbId);if(!btn||!cb)return;
  function sync(){var on=cb.checked;btn.classList.toggle("on",on);btn.textContent=on?"🕐 時刻不明（時柱なし）":"🕐 時刻がわからない";(timeIds||[]).forEach(function(id){var e=document.getElementById(id);if(e)e.disabled=on;});}
  btn.onclick=function(){cb.checked=!cb.checked;sync();};sync();}
/* 生年月日・時刻＝ドロップダウン選択式 */
function fillSel(id,from,to,val,suf,desc){var s=document.getElementById(id);if(!s)return;var arr=[],i;for(i=from;i<=to;i++)arr.push(i);if(desc)arr.reverse();s.innerHTML=arr.map(function(n){return '<option value="'+n+'"'+(n===val?' selected':'')+'>'+n+suf+'</option>';}).join("");}
function initDates(){var Y=new Date().getFullYear();
  [["by",1920,Y,1990,"年",1],["bm",1,12,6,"月",0],["bdd",1,31,15,"日",0],["bh",0,23,10,"時",0],["bmin",0,59,30,"分",0]].forEach(function(a){fillSel(a[0],a[1],a[2],a[3],a[4],a[5]);});
  [["Aby",1920,Y,2006,"年",1],["Abm",1,12,5,"月",0],["Abdd",1,31,27,"日",0],["Abh",0,23,12,"時",0],["Abmin",0,59,0,"分",0]].forEach(function(a){fillSel(a[0],a[1],a[2],a[3],a[4],a[5]);});
  [["Bby",1920,Y,2007,"年",1],["Bbm",1,12,10,"月",0],["Bbdd",1,31,2,"日",0],["Bbh",0,23,12,"時",0],["Bbmin",0,59,0,"分",0]].forEach(function(a){fillSel(a[0],a[1],a[2],a[3],a[4],a[5]);});
}
/* テーマ（5色から選択・既定＝藍紺） */

function setTab(t){

  document.getElementById("soloForm").classList.toggle("hidden",t!=="solo");

function readSolo(){
  var y=+document.getElementById("by").value,mo=+document.getElementById("bm").value,d=+document.getElementById("bdd").value;
  var tu=document.getElementById("tu").checked,hh=12,mi=0;
  if(!tu){hh=+document.getElementById("bh").value;mi=+document.getElementById("bmin").value;}
  var sex=document.getElementById("sex").value;
  var pc=document.getElementById("place").value,place=null,lonShown="";
  if(pc===MANUAL_OPT){var lon=parseFloat(document.getElementById("lon").value),mer=parseFloat(document.getElementById("mer").value||"135");if(!isNaN(lon)){place={lon:lon,mer:isNaN(mer)?135:mer};lonShown="経度"+lon+"°／標準"+place.mer+"°";}}
  else if(PLON[pc]!=null){place={lon:PLON[pc],mer:135};lonShown=pc+"（経度"+PLON[pc]+"°）";}
  return {y:y,mo:mo,d:d,hh:hh,mi:mi,tu:tu,sex:sex,place:place,lonShown:lonShown,name:document.getElementById("pname").value||""};
}

function runSolo(){
  var err=document.getElementById("err");err.textContent="";
  try{
    var i=readSolo();
    var p=window.PersonBazi(i.y,i.mo,i.d,i.hh,i.mi,i.tu,i.sex,(!i.tu&&i.place)?i.place:null);
    if(!p||!p.ok){err.textContent="計算エラー: "+(p&&p.error||"unknown");return;}
    renderSolo(p,i);
  }catch(e){err.textContent="エラー: "+(e&&e.message||e);}
}

function setsuInfo(c){
  var b=c.birth||{};var name=SETSU_JP[b.setsuName]||b.setsuName||"-";
  var out={name:name,elapsed:"",entry:""};
  if(typeof b.setsuMin==="number"){var m=b.setsuMin;var dd=Math.floor(m/1440),hh=Math.floor((m%1440)/60),mm=m%60;out.elapsed=dd+"日"+hh+"時間"+mm+"分";
    if(b.clock){var t=new Date(b.clock.replace(" ","T"));if(!isNaN(t)){t.setMinutes(t.getMinutes()-m);out.entry=t.getFullYear()+"-"+two(t.getMonth()+1)+"-"+two(t.getDate())+" "+two(t.getHours())+":"+two(t.getMinutes());}}}
  return out;
}

/* ルールベース解析：エンジンの構造化データ(fullProfile/tenGodBias等)を日本語文へ */
function analyzeSolo(p){
  var c=p.pro, fp=window.fullProfile?window.fullProfile(c):null, tb=window.tenGodBias?window.tenGodBias(c):null;
  var el=c.dayMaster.element, L=[];
  // 性格の核
  var genmei=(fp&&fp.genmei)||"", gTheme=TEN_THEME[genmei]||"";
  L.push('<p style="margin:0 0 8px"><b>◆ 性格の核</b><br>日主は'+elc(el)+'（'+esc(c.dayMaster.stem)+'）。'+esc(EL_NATURE[el]||"")
    +(gTheme?'<br>中心となる星は<b>'+esc(genmei)+'</b>＝'+esc(gTheme)+'。':'')
    +'<br>身の強弱は<b>'+esc(p.sType)+'</b>。'+(p.sType.indexOf("強")>=0?'自我とエネルギーが強く、自分で切り開くタイプ。':(p.sType.indexOf("弱")>=0?'繊細で周囲と調和しながら力を発揮するタイプ。':'バランス型で状況に応じて動けるタイプ。'))+'</p>');
  // 通変星の偏り
  if(tb){ var t=tb.type==="balanced"?"バランス型（多才で適応力が高い）":(tb.maxGroup?("<b>"+tb.maxGroup+"</b>が強め＝そのテーマが人生の主役"):"");
    L.push('<p style="margin:0 0 8px"><b>◆ エネルギーの偏り</b><br>'+t+'。'+(tb.missing&&tb.missing.length?'弱いのは'+tb.missing.join("・")+'（そこは人に頼る・意識して補うテーマ）。':'')+'</p>'); }
  // 五行の強み・弱み・開運
  var five=p.five||{}, strong=[],weak=[]; EL_ORDER.forEach(function(e){ if((five[e]||0)>=3)strong.push(e); if((five[e]||0)===0)weak.push(e); });
  L.push('<p style="margin:0 0 8px"><b>◆ 五行の傾向</b><br>'+(strong.length?'強い：'+strong.map(elc).join("・")+'（持ち味・出やすい面）。':'')+(weak.length?'　欠け：'+weak.map(elc).join("・")+'（意識して取り入れたい面）。':'')+(!strong.length&&!weak.length?'大きな偏りは少なく安定型。':'')+'</p>');
  // 開運（喜神）
  var favs=EL_ORDER.filter(function(e){return p.fav&&p.fav[e]==="喜";});
  if(favs.length){ L.push('<p style="margin:0 0 8px"><b>◆ 開運のヒント（喜神：'+favs.map(elc).join("・")+'）</b><br>'+favs.map(function(e){var k=EL_LUCK[e];return k?('・'+elc(e)+'：色「'+k.色+'」／方角「'+k.方+'」／'+k.行):"";}).filter(Boolean).join("<br>")+'</p>'); }
  // 運の流れ
  if(fp){ var cur=fp.cur, ty=fp.ty, ny=fp.ny;
    function flow(o,head,extra){ if(!o)return""; var t=o.tenStar||""; return head+'：<b>'+elGz(o.ganzhi||"")+(t?'（'+esc(t)+'）':'')+'</b>'+(extra||"")+(TEN_THEME[t]?' ＝ '+esc(TEN_THEME[t]):"")+'。<br>'; }
    L.push('<p style="margin:0 0 8px"><b>◆ 運の流れ</b><br>'
      +flow(cur,'今の10年（大運）',cur?' '+esc(cur.startAge)+'〜'+esc(cur.endAge)+'歳':'')
      +flow(ty,'今年'+(ty&&ty.year?'（'+esc(ty.year)+'）':''))
      +flow(ny,'来年'+(ny&&ny.year?'（'+esc(ny.year)+'）':''))+'</p>'); }
  // 神殺
  var ss=(window.shinsatsuHits?window.shinsatsuHits(c):[]).slice(0,4);
  if(ss.length){ L.push('<p style="margin:0"><b>◆ 目立つ星</b><br>'+ss.map(function(s){var nm=s.split("(")[0].replace(/^年/,"");return esc(nm)+'（'+esc(STAR_JP[nm]||"")+'）';}).join("／")+'</p>'); }
  L.push('<p class="note" style="margin:8px 0 0">※この解析は計算結果からの自動要約です。より深く自然な鑑定は下の「AIで詳しく鑑定」から。</p>');
  return L.join("");
}

function cell4(pil,fn,tu){var h="";for(var i=0;i<4;i++){var x=pil[i];if(i===3&&(tu||!x)){h+='<td class="note">—</td>';continue;}h+='<td>'+fn(x)+'</td>';}return h;}
function favList(fav,mark){if(!fav)return"-";var a=EL_ORDER.filter(function(e){return fav[e]===mark;});return a.length?a.map(elc).join("・"):"-";}

/* ===== 2人 相性 ===== */
function readPerson(pre){
  var g=function(s){return document.getElementById(pre+s);};
  var y=+g("by").value,mo=+g("bm").value,d=+g("bdd").value;
  var tu=g("tu").checked,hh=12,mi=0;
  if(!tu){hh=+g("bh").value;mi=+g("bmin").value;}
  var sex=g("sex").value;
  return {y:y,mo:mo,d:d,hh:hh,mi:mi,tu:tu,sex:sex};
}
function runPair(){
  var err=document.getElementById("errP");err.textContent="";
  try{
    var a=readPerson("A"),b=readPerson("B");
    var pa=window.PersonBazi(a.y,a.mo,a.d,a.hh,a.mi,a.tu,a.sex);
    var pb=window.PersonBazi(b.y,b.mo,b.d,b.hh,b.mi,b.tu,b.sex);
    if(!pa.ok||!pb.ok){err.textContent="計算エラー";return;}
    renderPair(pa,pb,a,b);
  }catch(e){err.textContent="エラー: "+(e&&e.message||e);}
}
function miniChart(p,tu){
  var pil=p.pillars.slice();
  var h='<table class="mini"><tr><th>年</th><th>月</th><th>日</th><th>時</th></tr><tr>';
  for(var i=0;i<4;i++){var x=pil[i];if(i===3&&(tu||!x)){h+='<td>—</td>';continue;}h+='<td><div class="mgz">'+elGz(x.ganzhi)+'</div><div class="mten">'+esc(x.tenStar||"日主")+'</div></td>';}
  h+='</tr></table>';return h;
}
function renderPair(pa,pb,a,b){
  var cd=window.compatData?window.compatData(pa.pro,pb.pro):null;
  var out=document.getElementById("out"),H="";
  H+='<div class="card"><h2>相性 総合</h2>';
  if(cd){
    H+='<div style="text-align:center"><div class="score">'+esc(cd.score)+'<span style="font-size:16px">点</span></div><p class="note" style="margin:0">'+(cd.good?"とても良い縁が出ています":"補い合える関係です")+'</p></div>';
  }
  H+='<div class="two" style="margin-top:12px">'
    +'<div><div class="pill">お一人目 '+elS(pa.pro.dayMaster.stem)+'（'+elc(pa.pro.dayMaster.element)+'）</div>'+miniChart(pa,a.tu)+'</div>'
    +'<div><div class="pill">お二人目 '+elS(pb.pro.dayMaster.stem)+'（'+elc(pb.pro.dayMaster.element)+'）</div>'+miniChart(pb,b.tu)+'</div></div></div>';

  if(cd){
    H+='<div class="card"><h2>二人の縁（干支・十神）</h2>';
    var good=[],warn=[];
    if(cd.kangou) good.push('<span class="tag rel"><b>干合</b><span class="note"> 日主どうしが強く引き合う</span></span>');
    (cd.seiritsu||[]).forEach(function(s){good.push('<span class="tag rel"><b>'+esc(s.kind)+'('+esc(s.el)+')</b><span class="note"> 二人で完成＝最強の絆</span></span>');});
    (cd.hankai||[]).forEach(function(s){good.push('<span class="tag rel"><b>半会('+esc(s.el)+')</b><span class="note"> 前進の勢い</span></span>');});
    (cd.rikugouAll||[]).forEach(function(pr){good.push('<span class="tag rel"><b>六合</b> '+pr.map(elB).join("")+'<span class="note"> 結びつき</span></span>');});
    if(cd.chong) warn.push('<span class="tag warn"><b>冲</b><span class="note"> 刺激・変化の軸</span></span>');
    if(cd.kei) warn.push('<span class="tag warn"><b>刑</b><span class="note"> 摩擦・調整</span></span>');
    if(cd.ha) warn.push('<span class="tag warn"><b>破</b><span class="note"> 小さなほころび</span></span>');
    if(cd.gai) warn.push('<span class="tag warn"><b>害</b><span class="note"> すれ違い注意</span></span>');
    H+='<p style="margin:0 0 6px"><b>相手からあなたへの十神：</b>'+esc(cd.tenBtoA||"-")+' ／ <b>あなたから相手へ：</b>'+esc(cd.tenAtoB||"-")+'</p>';
    H+='<div style="margin-top:6px"><div class="note" style="margin-bottom:3px">良い縁</div>'+(good.length?good.join(""):'<span class="note">特筆すべき吉の結びは控えめですが、これは「縁が無い」という意味ではありません。</span>')+'</div>';
    if(warn.length) H+='<div style="margin-top:10px"><div class="note" style="margin-bottom:3px">気をつける流れ</div>'+warn.join("")+'</div>';
    H+='<p class="note" style="margin:10px 0 0">五行の流れ：'+elc(cd.aEl)+'（一人目）と '+elc(cd.bEl)+'（二人目）。相生・相剋の関係が二人のリズムを作ります。</p>';
    H+='</div>';
  } else H+='<div class="card"><p class="note">相性データを取得できませんでした。</p></div>';
  // AI相性鑑定（辛口・詳細）
  H+='<div class="card"><h2>AI相性鑑定 <span class="note" style="font-weight:400">v3・自動生成</span></h2><div id="aiPair" class="note">「相性を見る」で、二人の特性・惹かれ合う所・強み/魅力・合わない所・攻略法・仲直り法・仲良くなる/すれ違う時期・ラブラブな過ごし方まで自動鑑定します。</div>'
    +'<button class="btn" id="aiPairBtn" style="margin-top:10px">🤖 AIで相性を鑑定する（手動）</button></div>';
  H+='<div class="card noprint"><button class="btn sub2" onclick="window.print()">相性結果を印刷／PDF保存</button></div>';
  out.innerHTML=H;out.scrollIntoView({behavior:"smooth",block:"start"});
  var pb2=document.getElementById("aiPairBtn"); if(pb2) pb2.onclick=function(){aiCompat(pa.pro,pb.pro,pb2);};
  if(window._msAutoAI){ window._msAutoAI=false; if(msCanAI()) aiCompat(pa.pro,pb.pro,pb2); }
}

/* 相性の根拠テキストをcompatDataから生成 */
function compatText(cd){
  if(!cd) return "";
  var L=[];
  L.push("総合点:"+cd.score+"（"+(cd.good?"良い":"補完的")+"）");
  L.push("日主: 一人目"+cd.aS+"("+cd.aEl+") / 二人目"+cd.bS+"("+cd.bEl+")");
  L.push("干合(日主どうしの強い引き合い):"+(cd.kangou?"あり":"なし"));
  if(cd.seiritsu&&cd.seiritsu.length) L.push("二人で完成する三合/方合:"+cd.seiritsu.map(function(s){return s.kind+"("+s.el+")";}).join("、"));
  if(cd.hankai&&cd.hankai.length) L.push("半会:"+cd.hankai.map(function(s){return s.el;}).join("、"));
  if(cd.rikugouAll&&cd.rikugouAll.length) L.push("六合(結びつき):"+cd.rikugouAll.map(function(p){return p.join("");}).join("、"));
  var w=[]; if(cd.chong)w.push("冲(衝突)"); if(cd.kei)w.push("刑(摩擦)"); if(cd.ha)w.push("破(ほころび)"); if(cd.gai)w.push("害(すれ違い)");
  L.push("注意の関係:"+(w.length?w.join("、"):"目立つものなし"));
  L.push("十神: 相手→自分="+(cd.tenBtoA||"-")+" / 自分→相手="+(cd.tenAtoB||"-"));
  return L.join("\n");
}
/* AI相性鑑定：二人のrichGrounding＋関係データを根拠に、辛口で */
function aiCompat(cA,cB,btn){
  var key=msKey(), model=(document.getElementById("gmodel")||{}).value||"gemini-2.5-flash";
  var box=document.getElementById("aiPair"); if(!box) return;
  var served=/^https?:$/.test(location.protocol);
  if(!key && !served){ box.className="note"; box.innerHTML='<span style="color:var(--warn)">この端末で試すにはAPIキーが必要です（1人タブの「AI鑑定の設定」）。本番サイト設置ならキー不要。</span>'; return; }
  if(key){ try{ localStorage.setItem("ms_gkey",key); }catch(e){} }
  var gA=window.richGrounding?window.richGrounding(cA):"", gB=window.richGrounding?window.richGrounding(cB):"";
  var cd=window.compatData?window.compatData(cA,cB):null;
  var sys="あなたは四柱推命の相性鑑定士『Nico』です。以下の【二人のデータ】と【関係データ】だけを根拠に、日本語で具体的に、そして正直で辛口に相性を鑑定してください（甘やかさず、課題もはっきり指摘する。ただし人格否定や『別れろ』等の断定はしない）。専門用語は避け日常語に。必ず次の見出しを【すべて】この順で##見出しで立てる（1つも省略しない）：\\n## お相手それぞれの特性\\n（一人目・二人目それぞれの性格と、二人が相手からどう見えるかを短く鋭く）\\n## 相性の核\\n（結論を辛口で。何が噛み合い何が噛み合わないか）\\n## 惹かれ合うところ\\n（お互いのどこに強く惹かれるのか、その理由を具体的に）\\n## 二人の強み・魅力\\n（周りから見た二人の良さ、この二人だから輝く点）\\n## 合わないところ・火種\\n（辛口で遠慮なく。放置するとどうなるかも）\\n## 攻略法\\n（相手の心をつかむ接し方・響く言葉・NGな態度を、一人目・二人目それぞれに）\\n## 喧嘩したときの仲直り法\\n（この二人がこじれやすいパターンと、具体的な仲直りの手順・かける言葉）\\n## 仲良くなる時期・すれ違う時期\\n（二人の年運データを根拠に『◯年ごろ＝近づく／◯年ごろ＝ぶつかりやすい』と具体的な年で。理由も）\\n## ラブラブな過ごし方\\n（この二人におすすめのデート・過ごし方・距離の縮め方を具体的に楽しく）\\n## 二人ならではのプラス\\n（一緒にいることで生まれる可能性・未来を前向きに）\\n辛口だが忖度なし、恋愛・攻略・過ごし方の項は温かく。全体2000〜3000字。\\n【二人のデータ】\\n<一人目>\\n"+gA+"\\n<二人目>\\n"+gB+"\\n【関係データ】\\n"+compatText(cd);
  var gc={temperature:0.95}; if(/gemini-3/.test(model)){ gc.maxOutputTokens=6000; } else { gc.thinkingConfig={thinkingBudget:0}; gc.maxOutputTokens=6000; }
  var body={systemInstruction:{parts:[{text:sys}]},contents:[{role:"user",parts:[{text:"この二人の相性を辛口で鑑定してください。"}]}],generationConfig:gc};
  var url,headers;
  if(key){ url="https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent?key="+encodeURIComponent(key); headers={"Content-Type":"application/json"}; }
  else { url="/api/gemini"; headers={"Content-Type":"application/json","x-pk-device":msDevId(),"x-pk-deep":"1"}; }
  box.className="note"; box.innerHTML='<span class="note">鑑定中… 🔮（数十秒かかることがあります）</span>'; if(btn) btn.disabled=true;
  fetch(url,{method:"POST",headers:headers,body:JSON.stringify(body)})
   .then(function(r){return r.text().then(function(t){return {ok:r.ok,status:r.status,t:t};});})
   .then(function(res){ if(btn) btn.disabled=false;
     if(!res.ok){ box.innerHTML='<span style="color:var(--warn)">エラー('+res.status+')：'+(res.status===429?"混み合っています。少し待って再試行を。":res.status===400||res.status===403?"キー/設定に問題があるか、地域制限の可能性。":"接続に失敗しました。")+'</span>'; return; }
     var j; try{j=JSON.parse(res.t);}catch(e){ box.innerHTML='<span style="color:var(--warn)">応答の解析に失敗しました。</span>'; return; }
     var cand=j.candidates&&j.candidates[0], txt=cand&&cand.content&&cand.content.parts?cand.content.parts.map(function(x){return x.text||"";}).join(""):"";
     if(!txt){ var fr=cand&&cand.finishReason; box.innerHTML='<span style="color:var(--warn)">鑑定文が生成されませんでした'+(fr?'（'+esc(fr)+'）':'')+'。もう一度お試しください。</span>'; return; }
     var trunc=cand&&cand.finishReason==="MAX_TOKENS";
     box.className=""; box.innerHTML='<div style="font-size:15px;line-height:1.9;color:var(--ink)">'+mdLite(txt)+'</div>'+(trunc?'<p class="note" style="color:var(--warn);margin:8px 0 0">※上限で途中までの表示です。</p>':'');
   })
   .catch(function(){ if(btn) btn.disabled=false; box.innerHTML='<span style="color:var(--warn)">通信エラー。ネット接続をご確認ください。</span>'; });
}

/* ===== 保存・履歴（localStorage） ===== */
var HKEY="ms_history_v1";
function loadHist(){try{return JSON.parse(localStorage.getItem(HKEY)||"[]");}catch(e){return [];}}
function saveHist(a){try{localStorage.setItem(HKEY,JSON.stringify(a));}catch(e){}}
function saveCurrent(){
  try{
    var i=readSolo();
    var arr=loadHist();
    arr.unshift({id:Date.now(),name:i.name||(i.y+"/"+i.mo+"/"+i.d),y:i.y,mo:i.mo,d:i.d,hh:i.hh,mi:i.mi,tu:i.tu,sex:i.sex,place:document.getElementById("place").value});
    if(arr.length>40)arr=arr.slice(0,40);
    saveHist(arr);renderHist();
  }catch(e){document.getElementById("err").textContent="保存エラー: "+(e&&e.message||e);}
}
function renderHist(){
  var arr=loadHist(),box=document.getElementById("hist"),empty=document.getElementById("histEmpty");
  empty.style.display=arr.length?"none":"";
  box.innerHTML=arr.map(function(it){return '<div class="histItem" data-id="'+it.id+'"><b>'+esc(it.name)+'</b><span class="note">'+esc(it.y)+'/'+esc(it.mo)+'/'+esc(it.d)+(it.tu?" 時刻不明":" "+two(it.hh)+":"+two(it.mi))+'</span><span class="del" data-del="'+it.id+'">×</span></div>';}).join("");
  box.querySelectorAll(".histItem").forEach(function(el){el.onclick=function(e){if(e.target.getAttribute("data-del")){var id=+e.target.getAttribute("data-del");saveHist(loadHist().filter(function(x){return x.id!==id;}));renderHist();return;}applyHist(+el.getAttribute("data-id"));};});
}
function applyHist(id){
  var it=loadHist().filter(function(x){return x.id===id;})[0];if(!it)return;
  function setv(id,v){var s=document.getElementById(id);if(s)s.value=v;}
  setv("by",it.y);setv("bm",it.mo);setv("bdd",it.d);
  document.getElementById("tu").checked=!!it.tu;
  if(!it.tu){setv("bh",it.hh);setv("bmin",it.mi);}
  wireToggle("tuBtn","tu",["bh","bmin"]);
  document.getElementById("sex").value=it.sex;
  if(it.place&&(PLON[it.place]!=null||it.place===MANUAL_OPT)){document.getElementById("place").value=it.place;document.getElementById("manualWrap").classList.toggle("hidden",it.place!==MANUAL_OPT);}
  document.getElementById("pname").value=it.name||"";
  window._msAutoAI=true; runSolo();
}
