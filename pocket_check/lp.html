<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* Warm, clean life-coach palette. NOT LINE green, NOT occult dark. */
  --bg:#FBFAF6;             /* warm off-white, softer than pure #fff */
  --bg-2:#F3F1E9;           /* clay / raised */
  --bg-3:#EAE6D9;           /* deeper clay */
  --ink:#15181F;            /* deep, but not black — warmer */
  --ink-2:#3E434F;          /* body */
  --ink-3:#757A87;          /* caption */
  --line:#DDD7C6;           /* soft rope line */
  --line-2:#C9C2AE;
  --accent:#4E8060;         /* sage green — calm, natural, not LINE */
  --accent-2:#345C42;
  --accent-soft:#E8F0EB;
  --peach:#E2A583;          /* warm secondary for chat bubble */
  --peach-soft:#F9E6D4;
  --cream:#F5EACB;          /* highlight cream */
  --coral:#E2896B;          /* bright point accent (coral/peach) */
  --coral-d:#C96A4B;
  --coral-ink:#B0522F;      /* readable coral for small text */
  --coral-soft:#F7E3DA;
}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  font-family:'Zen Kaku Gothic New','Noto Sans JP',system-ui,sans-serif;
  color:var(--ink);background:var(--bg);
  font-weight:500;line-height:1.85;
  font-feature-settings:"palt";
  word-break:normal;overflow-wrap:break-word;
  text-wrap:pretty;   /* 行末の1文字だけの泣き別れ（孤立文字）を防ぐ */
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
/* 文・見出し・キャプションは2行以上が均等に割れるbalanceで、行末1文字の孤立を確実に防止 */
.hook p,.hook h2,.lead,.vs-lead,.vs-close,.cmp-note,.plan-sub,.langs-cap,.road-foot,.cta-note,.proof .sub,
.road-desc,.f-desc,.pv-b,.assure .at,.assure .ad,.nico-msg,.how-mech,.bubble,.plan .pd,.c .cd,.pv-lead,h1,h2{ text-wrap:balance }
:lang(ja) .nw, :lang(ko) .nw{ white-space:nowrap }
:lang(ja) h1,:lang(ja) h2,:lang(ja) .m1,:lang(ja) .f-title,
:lang(ko) h1,:lang(ko) h2,:lang(zh) h1,:lang(zh) h2,:lang(zt) h1,:lang(zt) h2{ word-break:keep-all; overflow-wrap:anywhere }
.brm{display:none}
@media(max-width:480px){ .brm{display:inline} }

.serif{ font-family:'Zen Old Mincho','Noto Serif JP',serif; font-weight:500 }
.numeral{ font-family:'Fraunces','Zen Old Mincho',serif; font-feature-settings:"lnum" 1,"tnum" 1; font-weight:500 }

.wrap{ max-width:520px; margin:0 auto; padding:16px 22px 40px; position:relative }

/* --- top bar --- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 2px 4px;
}
.brand{
  display:flex;align-items:center;gap:10px;white-space:nowrap;
  font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:20.5px;letter-spacing:.005em;color:var(--ink);
}
.brand .mark{
  width:34px;height:34px;border-radius:11px;background:var(--accent);
  display:grid;place-items:center;overflow:hidden;
  box-shadow:0 3px 9px rgba(78,128,96,.28);
}
.brand .mark img{ width:27px;height:27px;display:block }
.brand em{ font-family:'Zen Old Mincho',serif; font-style:normal; font-weight:700; color:var(--accent-2);
  background:linear-gradient(180deg,transparent 62%,var(--cream) 62%); padding:0 3px; border-radius:2px }
.lang-sel{
  font-family:inherit;font-size:12px;color:var(--ink-2);
  border:1px solid var(--line);border-radius:999px;
  padding:8px 30px 8px 14px;background:#fff;
  -webkit-appearance:none;appearance:none;letter-spacing:.02em;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%234E525E' fill='none' stroke-width='1.5' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;
  outline:none;cursor:pointer;
}

/* --- HERO --- */
.hero{
  margin-top:22px;padding:36px 26px 32px;
  background: linear-gradient(180deg, var(--peach-soft) 0%, var(--bg) 60%, var(--bg) 100%);
  border-radius:32px;
  position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%, rgba(226,165,131,.72), rgba(226,165,131,0) 65%);
  pointer-events:none;
}
.hero::after{
  content:'';position:absolute;left:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, rgba(91,140,107,.18), rgba(91,140,107,0) 65%);
  pointer-events:none;
}
.hero-inner{position:relative;z-index:1}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11px;font-weight:700;letter-spacing:.14em;
  color:var(--accent-2);
  background:#fff;border:1px solid var(--line);
  padding:6px 14px;border-radius:999px;
  margin-bottom:22px;
}
.eyebrow::before{
  content:'';width:7px;height:7px;border-radius:50%;background:#e8404f;
  box-shadow:0 0 0 0 rgba(232,64,79,.5);
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{ 0%{opacity:1;transform:scale(1);box-shadow:0 0 0 0 rgba(232,64,79,.5)} 70%{opacity:.85;transform:scale(1);box-shadow:0 0 0 6px rgba(232,64,79,0)} 100%{opacity:1;transform:scale(1);box-shadow:0 0 0 0 rgba(232,64,79,0)} }
.hero h1{
  font-family:'Zen Old Mincho',serif;font-weight:600;
  font-size:clamp(26px,7vw,32px);line-height:1.45;letter-spacing:.005em;color:var(--ink);
}
:lang(ja) .hero h1{ font-size:clamp(21px,6.6vw,30px) }
.hero h1 .hl{
  color:var(--accent-2);font-weight:800;
  background:linear-gradient(180deg,transparent 50%,var(--cream) 50%);
  padding:0 3px;border-radius:4px;
}
.hero .lede{
  font-size:14px;line-height:1.95;color:var(--ink-2);
  margin-top:18px;
}
.hero .lede b{ color:var(--ink);font-weight:800; background:linear-gradient(180deg,transparent 54%,var(--cream) 54%);padding:0 3px;border-radius:4px }
.hero-owl{
  margin-top:22px;display:flex;justify-content:center;align-items:end;gap:14px;
  position:relative;
}
.hero-owl img{
  width:84px;height:84px;max-width:100%;
  filter: drop-shadow(0 12px 20px rgba(232,180,151,.5));
}
.hero-owl .bubble{
  background:#fff;border:1px solid var(--line);
  padding:13px 17px;border-radius:22px;
  font-size:13px;color:var(--ink);line-height:1.6;
  box-shadow:0 6px 20px rgba(29,32,41,.05);
  max-width:220px;margin-bottom:8px;position:relative;
}
/* フクロウの方を向いた、きれいな三角のしっぽ（枠線つき吹き出し） */
.hero-owl .bubble::before{
  content:'';position:absolute;left:-11px;top:50%;transform:translateY(-50%);
  width:0;height:0;border:9px solid transparent;border-right:10px solid var(--line);
}
.hero-owl .bubble::after{
  content:'';position:absolute;left:-9px;top:50%;transform:translateY(-50%);
  width:0;height:0;border:8px solid transparent;border-right:9px solid #fff;
}

/* --- proof strip (3 icon + one-liner) --- */
.proof{
  margin-top:20px;padding:18px 14px;
  background:#fff;border:1px solid var(--line);border-radius:20px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:0;
}
.proof .col{
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:8px;padding:4px 8px;text-align:center;
}
.proof .col:not(:last-child){ border-right:1px solid var(--line) }
.proof .ic{
  width:34px;height:34px;border-radius:12px;
  display:grid;place-items:center;color:var(--accent-2);background:var(--accent-soft);
}
.proof .col:nth-child(2) .ic{ background:var(--cream);color:#8C6F30 }
.proof .col:nth-child(3) .ic{ background:var(--peach-soft);color:#B26A48 }
.proof .ic svg{ width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round }
.proof .lab{
  font-size:12px;color:var(--ink);font-weight:700;line-height:1.4;letter-spacing:.01em;
}
.proof .sub{
  font-size:10.5px;color:var(--ink-3);font-weight:500;line-height:1.5;margin-top:2px;
}

/* --- PROMISE: precise · personal · lifelong companion --- */
.promise{ margin-top:34px }
.promise-eyebrow{
  font-size:11px;color:var(--coral-ink);letter-spacing:.16em;text-transform:uppercase;
  font-weight:800;margin-bottom:11px;text-align:center;
}
.promise-h{
  font-family:'Zen Old Mincho',serif;font-weight:600;
  font-size:clamp(20px,5.5vw,25px);line-height:1.62;color:var(--ink);text-align:center;
  text-wrap:balance;letter-spacing:.005em;
}
.promise-h .hl{ background:linear-gradient(180deg,transparent 60%,var(--cream) 60%);color:var(--accent-2) }
:lang(ja) .promise-h .hl,:lang(ko) .promise-h .hl,:lang(zh) .promise-h .hl,:lang(zt) .promise-h .hl{ white-space:nowrap }
:lang(ja) .promise-h,:lang(zh) .promise-h,:lang(zt) .promise-h,:lang(ko) .promise-h{ font-size:clamp(19px,5vw,23px);letter-spacing:0 }
.promise-grid{ margin-top:22px;display:flex;flex-direction:column;gap:12px }
.pm{
  display:flex;align-items:flex-start;gap:14px;
  background:#fff;border:1px solid var(--line);border-radius:18px;
  padding:16px 18px 16px 20px;position:relative;overflow:hidden;
}
.pm::before{ content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent) }
.pm:nth-child(2)::before{ background:var(--coral) }
.pm:nth-child(3)::before{ background:var(--peach) }
.pm-ic{
  width:44px;height:44px;flex:0 0 auto;border-radius:14px;
  display:grid;place-items:center;color:var(--accent-2);background:var(--accent-soft);
}
.pm:nth-child(2) .pm-ic{ background:var(--coral-soft);color:var(--coral-ink) }
.pm:nth-child(3) .pm-ic{ background:var(--peach-soft);color:#B26A48 }
.pm-ic svg{ width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round }
.pm-body{ flex:1;min-width:0 }
.pm-t{ font-size:14.5px;font-weight:800;color:var(--ink);line-height:1.4;letter-spacing:.01em }
.pm-d{ font-size:12px;color:var(--ink-2);line-height:1.78;margin-top:4px }

/* --- languages --- */
.langs{ margin-top:36px }
.langs-title{
  font-size:11.5px;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase;
  margin-bottom:14px;display:flex;align-items:center;gap:10px;
}
.langs-title::before{content:'';width:16px;height:1px;background:var(--line-2)}
.langs-title::after{content:'';flex:1;height:1px;background:var(--line-2)}
.langs-row{
  display:grid;grid-template-columns:repeat(2,1fr);gap:8px;
}
.lchip{
  display:flex;align-items:center;gap:9px;
  padding:11px 14px;font-size:12.5px;font-weight:500;color:var(--ink);
  cursor:pointer;font-family:inherit;background:#fff;
  border:1px solid var(--line);border-radius:14px;
  text-align:left;letter-spacing:.01em;
  transition:all .2s ease;
}
.lchip:hover{ border-color:var(--line-2); background:var(--bg-2) }
.lchip .fl{
  display:inline-flex;width:22px;height:15px;border-radius:3px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(29,32,41,.08);flex:0 0 auto;
}
.lchip .fl svg{ width:100%;height:100%;display:block }
.lchip.on{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-2); font-weight:700 }
.lchip.on::after{
  content:'✓';margin-left:auto;color:var(--accent);font-size:14px;font-weight:900;
}
.langs-cap{
  font-size:11px;color:var(--ink-3);margin-top:12px;line-height:1.7;text-align:center;
}

/* --- section framework --- */
.sec{ margin-top:56px }
.sec-eyebrow{
  font-size:11px;color:var(--coral-ink);letter-spacing:.16em;text-transform:uppercase;
  font-weight:800;margin-bottom:10px;
}
.sec h2{
  font-family:'Zen Old Mincho',serif;font-weight:600;
  font-size:clamp(22px,5.8vw,26px);line-height:1.55;color:var(--ink);letter-spacing:.005em;
  text-wrap:balance;
}
.sec h2 .hl{
  background:linear-gradient(180deg,transparent 54%,var(--cream) 54%);
  color:var(--ink);font-weight:800;padding:0 3px;border-radius:4px;
}
.sec .lead{ font-size:13.5px;color:var(--ink-2);line-height:2;margin-top:14px }

/* --- rhythm: tinted band + dark focal hook --- */
.sec.band{
  background:var(--bg-2);
  margin-left:-22px;margin-right:-22px;
  padding:40px 22px;border-radius:26px;
  border:1px solid var(--line);
}
.hook{
  margin:60px -22px;padding:46px 26px 40px;
  background:linear-gradient(158deg,var(--accent-2) 0%,#25402f 100%);
  border-radius:28px;text-align:center;color:#fff;
  position:relative;overflow:hidden;
}
.hook::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 85% 0%,rgba(245,234,203,.18),transparent 55%);
}
.hook h2{
  position:relative;font-family:'Zen Old Mincho',serif;font-weight:600;
  font-size:clamp(21px,5.6vw,26px);line-height:1.62;color:#fff;
  letter-spacing:.005em;text-wrap:balance;
}
.hook h2 .hl{ background:linear-gradient(180deg,transparent 56%,rgba(231,169,129,.62) 56%);color:#fff;border-radius:3px }
/* CJKは強調句が語中で改行して崩れないように（トリセツ等）— 欧文は語数が多く溢れるため対象外 */
:lang(ja) .hook h2 .hl,:lang(zh) .hook h2 .hl,:lang(zt) .hook h2 .hl,:lang(ko) .hook h2 .hl{ white-space:nowrap }
:lang(ja) .hook h2,:lang(zh) .hook h2,:lang(zt) .hook h2,:lang(ko) .hook h2{ font-size:clamp(19px,5.1vw,24px);letter-spacing:0;text-wrap:normal }
.hook p{ position:relative;margin-top:13px;font-size:13px;line-height:1.95;color:rgba(255,255,255,.84) }
.hook .cta2{
  position:relative;display:inline-flex;align-items:center;gap:8px;margin-top:24px;
  background:#fff;color:var(--accent-2);font-family:inherit;font-weight:900;font-size:15px;
  padding:15px 30px;border-radius:999px;text-decoration:none;
  box-shadow:0 12px 26px rgba(0,0,0,.22);transition:transform .15s ease,box-shadow .15s ease;
}
.hook .cta2:hover{ transform:translateY(-1px);box-shadow:0 16px 30px rgba(0,0,0,.28) }

/* --- features (chat-native cards) --- */
.feat{ margin-top:24px;display:flex;flex-direction:column;gap:12px }
.road-grid{ margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:10px }
.road-grid.road-2{ grid-template-columns:1fr }
.road-top{ display:flex;align-items:center;gap:10px }
.road-desc{ margin:8px 0 0;font-size:12.5px;line-height:1.85;color:var(--ink-2) }
.road-item{ background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px }
.road-name{ font-weight:800;font-size:14.5px;color:var(--ink) }
.road-tag{ align-self:flex-start;font-size:10.5px;font-weight:800;letter-spacing:.04em;color:var(--coral-ink);background:var(--coral-soft);border-radius:999px;padding:3px 9px }
.road-foot{ margin-top:14px;font-size:11.5px;line-height:1.8;color:var(--ink-3);text-align:center }
.lp-share-wrap{ text-align:center;margin-top:20px }
.lp-share{ display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--accent);background:#fff;color:var(--accent-2);border-radius:999px;padding:11px 22px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer }
.lp-share::before{ content:'\2197';font-weight:900 }
.f{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;
  display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;
  transition:transform .2s ease, box-shadow .2s ease;
}
.f:hover{ box-shadow:0 8px 24px rgba(29,32,41,.05); transform:translateY(-1px) }
.f-ic{
  width:44px;height:44px;border-radius:14px;background:var(--accent-soft);
  display:grid;place-items:center;color:var(--accent-2);
}
.f:nth-child(2) .f-ic{ background:var(--peach-soft);color:#B26A48 }
.f:nth-child(3) .f-ic{ background:#EAF0F5;color:#42708F }
.f:nth-child(4) .f-ic{ background:#F1EAF5;color:#7A5A99 }
.f:nth-child(5) .f-ic{ background:var(--cream);color:#8C6F30 }
.f:nth-child(6) .f-ic{ background:#F5E7EA;color:#A85166 }
.f-ic svg{ width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round }
.f-title{ font-weight:700;font-size:15px;line-height:1.55;color:var(--ink) }
.f-desc{ font-size:12.5px;line-height:1.95;color:var(--ink-2);margin-top:6px }

/* --- capabilities showcase --- */
.caps{ margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:12px }
@media(max-width:560px){ .caps{ grid-template-columns:1fr } }
.cap{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;
  display:grid;grid-template-columns:40px 1fr;gap:13px;align-items:start;
  transition:transform .2s ease, box-shadow .2s ease;
}
.cap:hover{ box-shadow:0 8px 24px rgba(29,32,41,.05); transform:translateY(-1px) }
.cap-ic{ width:40px;height:40px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent-2) }
.cap-ic svg{ width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round }
.cap:nth-child(1) .cap-ic{ background:var(--peach-soft);color:#B26A48 }
.cap:nth-child(2) .cap-ic{ background:var(--cream);color:#8C6F30 }
.cap:nth-child(3) .cap-ic{ background:#F1EAF5;color:#7A5A99 }
.cap:nth-child(4) .cap-ic{ background:#EAF0F5;color:#42708F }
.cap:nth-child(5) .cap-ic{ background:var(--accent-soft);color:var(--accent-2) }
.cap:nth-child(6) .cap-ic{ background:#F5E7EA;color:#A85166 }
.cap-t{ font-weight:800;font-size:14.5px;line-height:1.5;color:var(--ink) }
.cap-d{ font-size:12px;line-height:1.85;color:var(--ink-2);margin-top:6px }

/* --- comparison --- */
.cmp{
  margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:22px;
  padding:22px 18px;display:grid;grid-template-columns:1fr auto 1fr;gap:0;align-items:center;
  position:relative;
}
.cmp .c{padding:6px 4px;text-align:center}
.cmp .cn{font-size:11px;color:var(--ink-3);letter-spacing:.08em;font-weight:700;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.cmp .cp{
  font-family:'Fraunces','Zen Old Mincho',serif;font-weight:500;
  font-feature-settings:"lnum" 1,"tnum" 1;
  font-size:clamp(19px,6.2vw,28px);line-height:1;margin:10px 0 6px;white-space:nowrap;
}
.cmp .c.old .cp{ color:var(--ink-3);position:relative;display:inline-block }
.cmp .c.old .cp::after{
  content:'';position:absolute;left:-6px;right:-6px;top:50%;height:1.5px;margin-top:-1px;
  background:var(--ink-3);transform:rotate(-8deg);transform-origin:center;opacity:.6;
}
.cmp .c.new .cp{ color:var(--accent-2) }
.cmp .cd{ font-size:11px;line-height:1.6;color:var(--ink-3) }
.cmp .sep{
  width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:16px;font-weight:900;
}
.cmp-note{ font-size:11px;color:var(--ink-3);margin-top:12px;line-height:1.7;text-align:center }

/* --- chat preview (hero of the page) --- */
.pv{
  margin-top:22px;background:var(--bg-2);border-radius:22px;overflow:hidden;
  border:2.5px solid var(--accent);box-shadow:0 12px 34px rgba(29,32,41,.09);
}
.pv-head{
  display:flex;align-items:center;gap:12px;padding:14px 18px;
  background:#fff;border-bottom:1px solid var(--line);
}
.pv-head .av{
  width:40px;height:40px;border-radius:50%;background:var(--peach-soft);
  display:grid;place-items:center;overflow:hidden;position:relative;
}
.pv-head .av img{ width:32px;height:32px }
.pv-head .nm{ font-weight:900;font-size:14px;color:var(--ink) }
.pv-head .st{
  font-size:10.5px;color:#d63c53;font-weight:700;margin-top:1px;
  display:flex;align-items:center;gap:5px;letter-spacing:.02em;
}
.pv-head .st::before{
  content:'';flex:none;width:8px;height:8px;border-radius:50%;background:#e8404f;
  animation:onblink 1.1s ease-in-out infinite;
}
@keyframes onblink{ 0%,100%{opacity:1} 50%{opacity:.2} }
.pv-msgs{ padding:18px 16px 22px;display:flex;flex-direction:column;gap:10px }
.pv-time{
  align-self:center;font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;
  padding:2px 10px;background:#fff;border-radius:999px;margin:2px 0;
}
.pv-b{ max-width:82%;padding:11px 14px;font-size:13px;line-height:1.75;border-radius:18px }
.pv-b.me{
  align-self:flex-end;background:var(--accent);color:#fff;
  border-bottom-right-radius:6px;
}
.pv-b.ai{
  align-self:flex-start;background:#fff;color:var(--ink);
  border:1px solid var(--line);border-bottom-left-radius:6px;
}
.pv-b.ai .who{
  display:block;font-size:10.5px;color:var(--accent-2);font-weight:900;
  margin-bottom:4px;letter-spacing:.02em;
}
.pv-typing{
  align-self:flex-start;background:#fff;border:1px solid var(--line);
  padding:12px 16px;border-radius:18px 18px 18px 6px;
  display:inline-flex;gap:4px;
}
.pv-typing i{
  width:6px;height:6px;border-radius:50%;background:var(--ink-3);
  animation:bounce 1.4s ease-in-out infinite;
}
.pv-typing i:nth-child(2){animation-delay:.2s}
.pv-typing i:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

/* --- plans --- */
.plans{ margin-top:24px;display:flex;flex-direction:column;gap:12px }
.plan{
  background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px 20px;
  display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:baseline;
  position:relative;transition:all .2s ease;
}
.plan.best{
  background:linear-gradient(180deg,#fff,#FEFCF5);
  border:2px solid var(--accent);
  box-shadow: 0 12px 28px rgba(91,140,107,.15);
  padding:26px 22px 22px;
}
.plan .pbadge{
  display:inline-block;font-size:10.5px;font-weight:900;letter-spacing:.06em;
  color:var(--accent-2);background:var(--accent-soft);
  padding:4px 11px;border-radius:999px;margin-bottom:8px;
}
.plan.best .pbadge{ background:linear-gradient(145deg,var(--coral),var(--coral-d));color:#fff }
.plan .pn{ font-weight:900;font-size:16px;color:var(--ink) }
.plan .pp{
  font-family:'Fraunces',serif;font-weight:500;
  font-feature-settings:"lnum" 1,"tnum" 1;
  font-size:26px;line-height:1;color:var(--ink);white-space:nowrap;
  text-align:right;
}
.plan.best .pp{ color:var(--accent-2) }
.plan .pp small{
  display:block;font-family:'Zen Kaku Gothic New',sans-serif;
  font-size:11px;color:var(--ink-3);font-weight:500;letter-spacing:.03em;margin-top:5px;
}
.plan .pd{
  font-size:12.5px;color:var(--ink-2);line-height:1.85;grid-column:1/-1;margin-top:8px;
}
.plan-sub{ font-size:12.5px;color:var(--ink-3);margin-top:16px;line-height:1.85;text-align:center }

/* --- CTA --- */
.cta-wrap{ margin-top:36px }
.cta{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:20px;border:0;cursor:pointer;text-decoration:none;
  font-family:inherit;font-weight:900;font-size:16px;color:#fff;
  background:linear-gradient(180deg,var(--accent) 0%, var(--accent-2) 100%);
  border-radius:18px;letter-spacing:.05em;
  box-shadow: 0 12px 26px rgba(63,106,78,.28);
  transition: transform .15s ease, box-shadow .2s ease;
}
.cta:hover{ transform:translateY(-1px); box-shadow: 0 16px 32px rgba(63,106,78,.35) }
.cta:active{ transform:translateY(0) }
/* 上部CTA：緑ではなくブランドのテラコッタ系で差別化 */
.cta-top{ margin-top:20px }
.cta.alt{ background:linear-gradient(180deg,#E7A981 0%,#C26340 100%); box-shadow:0 12px 26px rgba(194,99,64,.30) }
.cta.alt:hover{ box-shadow:0 16px 32px rgba(194,99,64,.40) }
.cta-badges{ display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px }
.cta-badges span{ display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:800;color:#7A5A16;background:var(--cream);border:1.5px solid #DFC072;border-radius:999px;padding:9px 4px;white-space:nowrap }
.cta-badges span::before{ content:'✓';font-weight:900;color:#C8952B }
.cta-note{
  font-size:12px;color:var(--ink-2);text-align:center;margin-top:14px;line-height:1.9;
}
.cta-note b{color:var(--ink);font-weight:700}

/* --- FAQ / assurance --- */
.assure{
  margin-top:28px;padding:20px;background:var(--bg-2);border-radius:18px;
  display:flex;gap:12px;
}
.assure svg{ width:24px;height:24px;flex:0 0 auto;color:var(--accent-2);stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round }
.assure .at{ font-weight:700;font-size:13px;color:var(--ink) }
.assure .ad{ font-size:11.5px;color:var(--ink-2);line-height:1.85;margin-top:4px }

/* --- footer --- */
.legal{
  text-align:center;font-size:11px;margin-top:28px;color:var(--ink-3);line-height:2;
}
.legal a{ color:var(--ink-3);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px }
.legal .sep{ margin:0 6px;color:var(--line-2) }
.foot{
  text-align:center;font-size:10.5px;color:var(--ink-3);margin-top:16px;line-height:1.95;
}
.foot .credit{
  display:inline-block;font-family:'Fraunces',serif;font-size:11px;
  color:var(--accent-2);letter-spacing:.06em;margin-bottom:10px;font-weight:500;
}

/* --- reveal --- */
[data-r]{ opacity:0; transform:translateY(10px); transition:opacity .7s ease, transform .7s ease }
[data-r].on{ opacity:1; transform:none }
.nico-card{background:#fff;border:1px solid var(--line,#E6E2D5);border-radius:22px;padding:22px 20px;margin-top:16px}
.nico-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.nico-face{flex:none;width:72px;height:72px;border-radius:999px;background:#FBEEE2;display:grid;place-items:center;overflow:visible;filter:drop-shadow(0 6px 12px rgba(232,180,151,.4))}
.nico-face img{width:78%;height:78%;object-fit:contain;display:block}
.nico-name{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:16px;color:var(--ink,#1D2029)}
.nico-cred{font-size:11.5px;line-height:1.7;color:var(--ink-3,#8A8E99);margin-top:2px}
.nico-msg{font-size:13px;line-height:2.0;color:var(--ink-2,#4E525E);margin:0}
.nico-msg b{background:linear-gradient(180deg,transparent 62%,#F8EFD8 62%);font-weight:700;color:var(--ink,#1D2029)}
.how-card{background:#fff;border:1px solid var(--line,#E6E2D5);border-radius:22px;padding:20px;margin-top:14px}
.how-mech{font-size:13px;line-height:2.0;color:var(--ink-2,#4E525E);margin:0}
.how-mech b{background:linear-gradient(180deg,transparent 62%,#F8EFD8 62%);font-weight:700;color:var(--ink,#1D2029)}
.how-steps{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.stp{display:flex;gap:13px;align-items:flex-start;background:#fff;border:1px solid var(--line,#E6E2D5);border-radius:18px;padding:16px 18px}
.stp .no{flex:none;width:30px;height:30px;border-radius:10px;background:linear-gradient(145deg,var(--coral),var(--coral-d));color:#fff;font-weight:900;font-size:14px;display:grid;place-items:center;font-family:'Fraunces',serif;box-shadow:0 3px 8px rgba(201,106,75,.28)}
.stp .st{font-weight:700;font-size:13.5px;color:var(--ink,#1D2029);line-height:1.6}
.stp .sd{font-size:12px;line-height:1.85;color:var(--ink-3,#8A8E99);margin-top:2px}
.vs-table{display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1px solid var(--line,#E6E2D5);border-radius:20px;overflow:hidden;margin-top:14px}
.vs-h{padding:13px 14px;font-weight:900;font-size:12.5px;text-align:center;background:#F1EDE3;color:var(--ink-3,#757A87);border-bottom:2px solid var(--line-2,#C9C2AE);letter-spacing:.02em}
.vs-h2{background:var(--accent,#4E8060);color:#fff;border-bottom-color:var(--accent-2,#345C42)}
.vs-h2::before{content:'✦ '}
.vs-c{padding:14px 15px;font-size:12px;line-height:1.85;color:var(--ink-2,#4E525E);border-bottom:1px solid var(--line,#E6E2D5);border-right:1px solid var(--line,#E6E2D5);
  word-break:auto-phrase;overflow-wrap:anywhere;text-wrap:pretty}
/* 四柱推命＝アプリの手法。緑の帯で視線を縦に誘導し「これが私たち」を際立たせる */
.vs-c2{border-right:0;background:var(--accent-soft,#E8F0EB);color:var(--ink,#1D2029);font-weight:600;box-shadow:inset 3px 0 0 var(--accent,#4E8060)}
.vs-c2 b{color:var(--accent-2,#345C42);font-weight:800}
.vs-table .vs-c:nth-last-child(-n+2){border-bottom:0}
.vs-close{font-size:13px;line-height:1.95;color:var(--ink-2,#4E525E);margin:14px 2px 0}
/* 長文の“ダラダラ”防止：要点は緑の太字、締めはクリームのマーカーで色にメリハリ */
.vs-close b,.lead b{color:var(--accent-2,#345C42);font-weight:700}
.vs-close .hl,.lead .hl{background:linear-gradient(180deg,transparent 60%,var(--cream,#F5EACB) 60%);color:var(--ink,#1D2029);font-weight:700;padding:0 1px;border-radius:2px}
</style>
</head>

  nicoMsg:'Tứ Trụ là trí tuệ phương Đông nghìn năm, đọc cẩm nang sử dụng cuộc đời từ ngày giờ sinh của bạn. <b>Vì sao lại đúng đến vậy?</b> Bị cuốn hút bởi điều kỳ diệu ấy, tôi đã dành nhiều năm nghiên cứu thế giới này — Kinh Dịch, Cửu Tinh, xem tướng tay, luận tên. <b>Tất cả những gì học được, tôi dồn vào Pocket Kantei — dành riêng cho bạn.</b><br><br>Lời giải ở đây không bao giờ là văn mẫu. <b>Chỉ đọc lá số của bạn, giải thích rõ ràng kèm căn cứ.</b> 365 ngày, sáng sớm hay nửa đêm — khi buồn, khi bế tắc, khi có tin vui, hãy kể cho Nico nghe. Tôi sẽ đồng hành cùng cuộc sống hạnh phúc của bạn với lời giải logic, rõ ràng.',

  howLead:'Tứ Trụ (BaZi) là thuật phương Đông nghìn năm tuổi: năm, tháng, ngày, giờ sinh trở thành «bốn trụ» hé lộ bản chất và dòng chảy vận mệnh của bạn. Bốn trụ hợp lại thành «lá số» — như cẩm nang sử dụng của riêng bạn, định hình ngay khoảnh khắc bạn chào đời. Không biết giờ sinh? Rất nhiều người cũng vậy — chỉ với ngày sinh vẫn xem được trọn vẹn, bạn cứ yên tâm.',
  howMech:'Bên trong Pocket Kantei, một bộ máy tính toán chuyên dụng <b>tính chính xác lá số, đại vận 10 năm và vận từng năm của bạn</b> (hiệu chỉnh cả lệch giờ nơi sinh, đến từng phút). Dữ liệu chắc chắn ấy được giải nghĩa qua logic đúc kết từ chuyên môn của Nico, rồi gửi đến bạn bằng lời chat gần gũi. <b>Không có gì là đoán mò — nên mọi câu trả lời đều nhất quán, có căn cứ, và chỉ dành cho bạn.</b>',
