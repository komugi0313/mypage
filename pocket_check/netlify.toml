# チャットは /api/gemini → サーバーレス関数へ（APIキーはブラウザに出さない）
[build]
  functions = "functions"
[[redirects]]
  from = "/api/gemini"
  to = "/.netlify/functions/gemini"
  status = 200
# アプリ内課金のレシート検証（購入・復元）
[[redirects]]
  from = "/api/verify-purchase"
  to = "/.netlify/functions/verify-purchase"
  status = 200
