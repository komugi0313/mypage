<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方角の書き方</title><style>
:root{--bg:#fffaf6;--ink:#3d2f29;--line:#eadfd6;--acc:#b94a6f}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 system-ui,"Hiragino Sans",sans-serif}
main{max-width:420px;margin:0 auto;padding:16px}h1{font-size:18px}h2{font-size:15px;border-left:4px solid var(--acc);padding-left:8px;margin-top:22px}
.grid{width:100%;border-collapse:separate;border-spacing:6px}.c{width:50%;vertical-align:top;background:#fff;border:1.5px solid #f2c9a2;border-radius:10px;padding:7px 9px;font-size:11.5px;font-weight:700}
.l{font-size:9.5px;color:#c27a3c;font-weight:800;margin-bottom:1px;letter-spacing:.03em}.s{display:block;font-size:9.5px;color:#a39890;font-weight:600}
.en{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}.en b{color:#9a6cc4}.tag{display:inline-block;font-size:12px;background:#f3e9f8;border-radius:6px;padding:1px 6px;margin-bottom:4px}
</style></head><body><main>
<h1>方角の書き方（モック）</h1>
<h2>いま</h2>
<table class="grid"><tr><td class="c"><div class="l">ラッキーカラー</div>ネイビー</td><td class="c"><div class="l">ラッキー方角</div>北東</td></tr></table>
<h2>案A：方角の下に小さく「自宅から見て」</h2>
<table class="grid"><tr><td class="c"><div class="l">ラッキーカラー</div>ネイビー</td><td class="c"><div class="l">ラッキー方角</div>北東<span class="s">自宅から見て</span></td></tr></table>
<h2>案B：見出しに入れる</h2>
<table class="grid"><tr><td class="c"><div class="l">ラッキーカラー</div>ネイビー</td><td class="c"><div class="l">ラッキー方角（自宅から）</div>北東</td></tr></table>
<h2>ご縁の欄の文（案A・案B どちらでも）</h2>
<div class="en"><div class="tag">いま</div><br>良いご縁に出会いやすいのは <b>北東</b> の方角。<b>近所の神社</b> や <b>パン屋</b> あたりで…</div>
<p></p>
<div class="en"><div class="tag">直したあと</div><br>良いご縁に出会いやすいのは、自宅から見て <b>北東</b> の方角。<b>近所の神社</b> や <b>パン屋</b> あたりで…</div>
<p style="font-size:12px;color:#8a7b72">文字だけのメール（テキスト版）は「方角：北東（自宅から見て）」にします。</p>
</main></body></html>
