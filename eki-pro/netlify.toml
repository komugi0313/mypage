# 易 EKI Pro：オンライン鑑定のサーバー中継（APIキーはサーバー側だけに置き、ブラウザに出さない）
# ※要設定：Netlify → Site settings → Environment variables → GEMINI_API_KEY（Gemini APIキー）
# ※関数（functions）を含むため、デプロイは Git 連携または Netlify CLI で行う（ドラッグ＆ドロップでは関数が動かない）
[build]
  functions = "functions"

[[redirects]]
  from = "/api/gemini"
  to = "/.netlify/functions/gemini"
  status = 200
