<title>わんこころ ミント8案</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Dela+Gothic+One&family=Kosugi+Maru&family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Aの色（ミント・水色・方眼・スレート）を土台に、B〜Eの雰囲気を2案ずつ混ぜた8案 */
:root{--bg:#F5F5F2;--fg:#2B2B30;--muted:#64646E;--line:#DDDDD6;
  --ui:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  /* Aの色 */
  --m-bg:#E9F1F4;--m-paper:#EEF2FB;--m-grid:#D4DCEC;--m-mint:#8AC3CF;--m-mint-l:#CFE7EC;--m-teal:#357385;--m-teal-m:#5E8FA6;--m-slate:#555A6B;--m-ink:#2F3A45;--m-paw:#7FC0D2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#18181B;--fg:#EEEEF0;--muted:#A6A6B0;--line:#33333A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#18181B;--fg:#EEEEF0;--muted:#A6A6B0;--line:#33333A;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px}
.page{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
.intro h1{font-family:"Mochiy Pop One",var(--ui);font-weight:400;font-size:1.5rem;margin:0 0 8px;text-wrap:balance}
.intro p{margin:0;color:var(--muted);font-size:.95rem}
.swatch{display:flex;gap:6px;margin-top:10px}
.swatch i{width:28px;height:28px;border-radius:8px;border:1px solid var(--line)}
.pat{display:flex;flex-direction:column;gap:12px}
.pat-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pat-h b{font-family:"Mochiy Pop One",var(--ui);font-weight:400;font-size:1.6rem}
.pat-h span{font-weight:800}
.pat-h em{font-style:normal;font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.pat > p{margin:0;color:var(--muted);font-size:.9rem}
.screen{border-radius:28px;overflow:hidden;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.08);color:var(--m-ink);background:var(--m-bg);font-family:"M PLUS Rounded 1c",sans-serif}
.dog{display:block}
.dogs{display:flex;justify-content:center;align-items:flex-end}
.dogs svg{width:25%;max-width:92px;height:auto;margin:0 -6px}
.sticker svg{filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 3px 4px rgba(0,0,0,.12))}
.body{padding:20px;display:flex;flex-direction:column;gap:16px}
.q{font-size:1.15rem;text-align:center;margin:0;font-weight:800}
.opts{display:flex;flex-direction:column;gap:12px}
.opts button{font:inherit;min-height:56px;cursor:pointer;width:100%;font-weight:800;color:var(--m-ink)}
.mini{display:flex;gap:12px;align-items:center;background:#FFFFFF;border-radius:18px;padding:12px}
.mini svg{width:72px;height:72px;flex:0 0 auto}
.mini small{display:block;font-size:.75rem}
.mini b{display:block;font-size:1.3rem;line-height:1.3;color:var(--m-teal)}
.grid{background-color:var(--m-paper);background-image:linear-gradient(var(--m-grid) 2px,transparent 2px),linear-gradient(90deg,var(--m-grid) 2px,transparent 2px);background-size:30px 30px}
.pawband{background-color:var(--m-mint-l);background-image:radial-gradient(circle at 30% 30%,#B3D9E1 3px,transparent 3.5px),radial-gradient(circle at 70% 70%,#B3D9E1 3px,transparent 3.5px);background-size:28px 28px}
.pop{font-family:"Mochiy Pop One",sans-serif;font-weight:400}
.outline{text-shadow:3px 3px 0 #FFFFFF,-3px -3px 0 #FFFFFF,3px -3px 0 #FFFFFF,-3px 3px 0 #FFFFFF,0 3px 0 #FFFFFF,3px 0 0 #FFFFFF,0 6px 0 var(--m-mint)}

/* 1：A×B ぽってりバブル */
.p1 .hero{background:#A9D3DC;padding:18px 14px 0;text-align:center;position:relative;background-image:radial-gradient(#C2E1E8 2px,transparent 2.4px);background-size:20px 20px}
.p1 .bubble{display:inline-block;background:#FFFFFF;border-radius:999px;padding:8px 22px 6px;box-shadow:0 5px 0 var(--m-teal-m)}
.p1 .bubble small{display:block;font-weight:800;font-size:.75rem;color:var(--m-slate)}
.p1 .bubble b{font-size:2rem;line-height:1.25;color:var(--m-teal)}
.p1 .bubble b em{font-style:normal;color:var(--m-slate)}
.p1 .start{display:block;margin:0 auto;background:#FFFFFF;border:4px solid var(--m-teal);color:var(--m-teal);border-radius:999px;font-size:1.3rem;padding:4px 40px;min-height:56px;cursor:pointer}
.p1 .opts button{background:#FFFFFF;border:3px solid var(--m-mint);border-radius:999px;box-shadow:0 4px 0 var(--m-mint)}
.p1 .mini{border:3px solid var(--m-mint)}
.p1 .deco{position:absolute;top:12px;right:14px;font-size:1.5rem}

/* 2：A×B 方眼のぽってり文字 */
.p2 .hero{margin:14px;border-radius:24px;border:3px solid var(--m-mint);padding:18px 12px 4px;text-align:center;position:relative}
.p2 .hero h2{margin:0;font-size:2.3rem;line-height:1.25;color:var(--m-teal)}
.p2 .hero small{display:block;font-weight:800;color:var(--m-slate)}
.p2 .deco{position:absolute;font-size:1.3rem}
.p2 .opts button{background:var(--m-mint);border:0;border-radius:18px;box-shadow:inset 0 -6px 0 rgba(53,115,133,.35)}
.p2 .mini{border:2px dashed var(--m-mint)}

/* 3：A×C ミントの肉球帯 */
.p3 .hero{background:var(--m-mint);padding:12px}
.p3 .row{border-radius:14px;padding:8px 6px 0}
.p3 .title{text-align:center;padding:12px 0}
.p3 .title small{display:block;color:#FFFFFF;font-size:.95rem;text-shadow:0 2px 0 var(--m-teal)}
.p3 .title b{color:#FFFFFF;font-size:1.9rem;line-height:1.3;text-shadow:0 3px 0 var(--m-teal)}
.p3 .title b em{font-style:normal;display:inline-block;background:var(--m-slate);color:#FFFFFF;border-radius:10px;padding:0 6px;text-shadow:none;box-shadow:0 0 0 3px #FFFFFF}
.p3 .opts button{background:var(--m-mint);border:0;border-radius:16px;font-family:"Mochiy Pop One",sans-serif;font-weight:400;box-shadow:inset 0 -5px 0 rgba(0,0,0,.1)}
.p3 .mini{border:3px solid var(--m-mint)}

/* 4：A×C 方眼の絵本 */
.p4 .hero{margin:14px;border-radius:22px;border:3px solid var(--m-mint);overflow:hidden}
.p4 .top{padding:14px 12px 6px;text-align:center}
.p4 .top small{font-weight:800;color:var(--m-slate)}
.p4 .top b{display:block;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:2.4rem;line-height:1.2;color:var(--m-slate)}
.p4 .top b em{font-style:normal;color:var(--m-teal)}
.p4 .row{padding:6px 6px 0;border-top:3px solid var(--m-mint)}
.p4 .opts button{background:#FFFFFF;border:3px solid var(--m-teal-m);border-radius:10px}
.p4 .mini{border:3px solid var(--m-mint)}

/* 5：A×D ミントのギンガム */
.p5{background-color:#F4FAFB!important;background-image:linear-gradient(rgba(138,195,207,.3) 50%,transparent 50%),linear-gradient(90deg,rgba(138,195,207,.3) 50%,transparent 50%);background-size:24px 24px}
.p5 .hero{padding:22px 16px 6px;text-align:center}
.p5 .ribbon{display:inline-block;background:var(--m-teal);color:#FFFFFF;padding:4px 18px;border-radius:6px;font-size:.85rem;transform:rotate(-2deg)}
.p5 .logo{font-size:2.3rem;line-height:1.25;color:var(--m-slate);margin:8px 0 4px}
.p5 .card{background:#FFFFFF;border-radius:24px;padding:18px;border:3px solid var(--m-slate);display:flex;flex-direction:column;gap:14px;box-shadow:6px 6px 0 var(--m-mint)}
.p5 .num{color:var(--m-teal);text-align:center;font-size:.9rem}
.p5 .opts button{background:var(--m-mint-l);border:2px solid var(--m-slate);border-radius:14px;text-align:left;padding:8px 16px;display:flex;gap:10px;align-items:center}
.p5 .opts button i{font-style:normal;font-family:"Mochiy Pop One",sans-serif;background:var(--m-slate);color:#FFFFFF;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;flex:0 0 auto;font-size:.85rem}
.p5 .mini{border:3px solid var(--m-slate)}

/* 6：A×D チェックのワッペン */
.p6 .hero{padding:20px 14px 0;text-align:center;background-color:var(--m-mint-l);background-image:linear-gradient(rgba(255,255,255,.55) 50%,transparent 50%),linear-gradient(90deg,rgba(255,255,255,.55) 50%,transparent 50%);background-size:20px 20px}
.p6 .patch{display:inline-block;background:#FFFFFF;border:3px dashed var(--m-teal-m);outline:4px solid #FFFFFF;border-radius:20px;padding:8px 18px}
.p6 .patch small{display:block;font-weight:800;color:var(--m-teal);font-size:.8rem}
.p6 .patch b{font-size:2rem;line-height:1.25;color:var(--m-slate)}
.p6 .opts button{background:#FFFFFF;border:2px solid var(--m-slate);border-radius:14px;box-shadow:4px 4px 0 var(--m-mint)}
.p6 .mini{border:2px dashed var(--m-teal-m)}

/* 7：A×E ミントの北欧 */
.p7{font-family:"Zen Maru Gothic",sans-serif!important}
.p7 .hero{background:var(--m-mint-l);padding:26px 18px 0;text-align:center;border-radius:0 0 50% 50% / 0 0 34px 34px}
.p7 .hero small{display:block;font-weight:700;letter-spacing:.2em;font-size:.8rem;color:var(--m-teal)}
.p7 .hero h2{font-weight:900;font-size:2.3rem;margin:4px 0 6px;color:var(--m-slate);letter-spacing:.06em}
.p7 .opts button{font-family:"Zen Maru Gothic",sans-serif;background:#FFFFFF;border:1.5px solid var(--m-teal-m);border-radius:999px;font-weight:700}
.p7 .mini{border:1.5px solid var(--m-mint)}

/* 8：A×E 方眼のアーチ窓 */
.p8{font-family:"Zen Maru Gothic",sans-serif!important;background-color:#F7FAFB!important;background-image:linear-gradient(#E3EBF3 1px,transparent 1px),linear-gradient(90deg,#E3EBF3 1px,transparent 1px);background-size:22px 22px}
.p8 .hero{padding:22px 18px 0;text-align:center}
.p8 .arch{background:var(--m-mint);border-radius:999px 999px 24px 24px;padding:26px 10px 0;margin:0 auto;max-width:300px}
.p8 .arch small{display:block;font-weight:700;color:var(--m-ink);letter-spacing:.15em;font-size:.8rem}
.p8 .arch h2{margin:2px 0 6px;font-weight:900;font-size:2rem;color:#FFFFFF;text-shadow:0 2px 0 var(--m-teal)}
.p8 .opts button{font-family:"Zen Maru Gothic",sans-serif;background:transparent;border:0;border-bottom:2px solid var(--m-mint);border-radius:0;font-weight:700;text-align:left;padding:8px 4px}
.p8 .opts button::before{content:"○ ";color:var(--m-teal-m)}
.p8 .mini{border:1.5px solid var(--m-mint)}

button:focus-visible{outline:3px solid #2F55C8;outline-offset:2px}
.note{color:var(--muted);font-size:.85rem;margin:0}
</style>

<div class="page">
  <div class="intro">
    <h1>Aのミントを土台にした8案</h1>
    <p>色はすべてAのミント・水色・方眼・スレート（濃いグレー）。そこにB〜Eの雰囲気を2案ずつ混ぜました。</p>
    <div class="swatch" aria-label="使っている色"><i style="background:#E9F1F4"></i><i style="background:#CFE7EC"></i><i style="background:#8AC3CF"></i><i style="background:#5E8FA6"></i><i style="background:#357385"></i><i style="background:#555A6B"></i></div>
  </div>
  <div id="list" class="page" style="gap:40px"></div>
  <p class="note">どの案でも、答えを押すとすぐ次の質問に進みます。</p>
</div>
