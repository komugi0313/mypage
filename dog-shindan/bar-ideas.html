<title>性格バー見せ方見本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* 本サイトと同じ色・書体。今の形と A〜E 案の性格バーを、同じデータ（こむぎ・コッカー）で縦にならべてくらべる */
:root{
  --bg:#E9F1F4; --card:#FFFFFF; --mint:#8AC3CF; --mint-l:#CFE7EC; --track:#EEF3F5;
  --teal:#357385; --ink:#2F3A45; --muted:#5A6672; --ball:#F3C63F;
  --c0:#E07A5F; --c0d:#B5513A; --c1:#3D9970; --c1d:#2A7353; --c2:#4A7FC1; --c2d:#2F5F9E;
  --c3:#E0A100; --c3d:#8F6600; --c4:#D16BA5; --c4d:#A8447F; --c5:#7B6CC4; --c5d:#5A4BA6;
  --pop:"Mochiy Pop One","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1B2529;--card:#24323A;--mint:#4E8592;--mint-l:#2E4A52;--track:#2E3D44;--teal:#8FD0DE;--ink:#E8EEF1;--muted:#A9B7BE;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1B2529;--card:#24323A;--mint:#4E8592;--mint-l:#2E4A52;--track:#2E3D44;--teal:#8FD0DE;--ink:#E8EEF1;--muted:#A9B7BE;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;margin:0}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px}
h1,h2{font-family:var(--pop);font-weight:400;margin:0;line-height:1.4;text-wrap:balance}
p{margin:0}
.top h1{color:var(--teal);font-size:1.35rem}
.top p{font-size:.88rem;color:var(--muted);font-weight:800}
.idea{background:var(--card);border:3px solid var(--mint);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.idea.now{border-style:dashed}
.idea>header{display:flex;gap:10px;align-items:flex-start}
.num{flex:0 0 auto;min-width:34px;height:34px;border-radius:999px;background:var(--teal);color:var(--card);font-family:var(--pop);display:grid;place-items:center;padding:0 8px;font-size:.9rem}
.idea h2{font-size:1.08rem;color:var(--teal)}
.why{font-size:.85rem;color:var(--muted)}
.rec{display:inline-block;background:var(--ball);color:#2F3A45;border-radius:999px;font-size:.7rem;font-weight:800;padding:0 8px;margin-left:6px;vertical-align:2px}
.bars{display:flex;flex-direction:column;gap:16px}
.bar .tp{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bar .lead{font-family:var(--pop);font-size:1rem}
.bar .nm{font-size:.82rem;color:var(--muted)}
.track{position:relative;height:14px;border-radius:999px;background:var(--track);margin-top:8px}
.fill{position:absolute;top:0;bottom:0;border-radius:999px}
.dot{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;border:4px solid #FFFFFF;transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(0,0,0,.25);z-index:2}
.avg{position:absolute;top:-6px;bottom:-6px;width:4px;border-radius:2px;background:var(--ink);opacity:.5;transform:translateX(-50%)}
.face{position:absolute;bottom:6px;width:34px;height:34px;transform:translateX(-50%);z-index:1}
.face img{width:100%;height:100%;object-fit:contain}
.face::after{content:"";position:absolute;left:50%;bottom:-8px;width:2px;height:10px;background:var(--muted);transform:translateX(-50%);opacity:.6}
.ends{display:flex;justify-content:space-between;font-size:.78rem;font-weight:800;color:var(--muted);margin-top:4px}
.diff{font-size:.85rem;font-weight:800;margin-top:6px;display:flex;gap:6px;align-items:center}
.diff img{width:20px;height:20px;object-fit:contain}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;font-weight:800;background:var(--bg);border-radius:12px;padding:8px 12px;align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border-radius:50%;display:inline-block;background:var(--c0);border:2px solid #FFFFFF;box-shadow:0 0 0 1px var(--mint)}
.legend b{width:4px;height:16px;border-radius:2px;background:var(--ink);opacity:.5;display:inline-block}
.legend img{width:22px;height:22px;object-fit:contain}
.arrow{position:absolute;top:50%;height:4px;transform:translateY(-50%);border-radius:2px;z-index:1}
.arrow::after{content:"";position:absolute;top:50%;width:0;height:0;border:7px solid transparent;transform:translateY(-50%)}
.arrow.r::after{right:-10px;border-left-color:inherit;border-left-color:currentColor}
.arrow.l::after{left:-10px;border-right-color:currentColor}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs span{border:2px solid var(--mint);border-radius:999px;padding:2px 12px;font-size:.82rem;font-weight:800;background:var(--card);color:var(--teal);display:inline-flex;gap:6px;align-items:center}
.tabs span img{width:20px;height:20px;object-fit:contain}
.tabs span.on{background:var(--teal);color:#FFFFFF;border-color:var(--teal)}
.foot{font-size:.85rem;color:var(--muted);text-align:center}
</style>

<div class="wrap">
  <div class="top">
    <h1>性格バーの見せ方 見本</h1>
    <p>例：こむぎ（体はアメリカン・コッカー）。どの見本も同じデータです。</p>
  </div>

  <div id="list"></div>
  <p class="foot">気に入った番号を教えてください（組み合わせもできます）。</p>
</div>

<script>
// こむぎの値（左側の性格の強さ 0〜100）と、ふつうのコッカーの平均
var AX=[["人なつっこさ","すぐ仲よし","じっくり"],["ワン友","犬が好き","人がいちばん"],["好奇心","探検家","安心派"],["元気","パワフル","おっとり"],["甘え","べったり","マイペース"],["物おじしなさ","のびのび","繊細"]];
var ME=[83,50,50,34,83,34], AVG=[66,58,58,54,62,56];
var NOUN=[["人なつっこい","じっくり屋さん"],["ワン友好き","人好き"],["冒険家","安心派"],["元気","おっとり"],["甘えんぼ","マイペース"],["のびのび","こわがり"]];
var C=["c0","c1","c2","c3","c4","c5"], DOG="img/cocker.webp";
function head(v,i){var l=v>=50,pc=l?v:100-v;return '<div class="tp"><span class="lead" style="color:var(--'+C[i]+'d)">'+pc+'% '+(l?AX[i][1]:AX[i][2])+'</span><span class="nm">'+AX[i][0]+'</span></div>'}
function fill(v,i){var pos=100-v;return v>=50?'<span class="fill" style="background:var(--'+C[i]+');opacity:.35;left:'+pos+'%;right:50%"></span>':'<span class="fill" style="background:var(--'+C[i]+');opacity:.35;left:50%;right:'+(100-pos)+'%"></span>'}
function ends(i){return '<div class="ends"><span>'+AX[i][1]+'</span><span>'+AX[i][2]+'</span></div>'}
function diffText(i){var d=ME[i]-AVG[i],a=Math.abs(d);if(a<12)return "";var w=NOUN[i][d>0?0:1];return (a>=20?"ふつうのコッカーより、ずっと":"ふつうのコッカーより、少し")+w}
function bar(i,opt){var v=ME[i],pos=100-v,ap=100-AVG[i],h='<div class="bar">'+head(v,i)+'<div class="track"'+(opt.face?' style="margin-top:46px"':'')+'>'+fill(v,i);
  if(opt.line)h+='<span class="avg" style="left:'+ap+'%"></span>';
  if(opt.face)h+='<span class="face" style="left:'+ap+'%"><img src="'+DOG+'" alt="ふつうのコッカー"></span>';
  if(opt.arrow&&Math.abs(v-AVG[i])>=8){var a=Math.min(pos,ap),b=Math.max(pos,ap);h+='<span class="arrow '+(pos<ap?'l':'r')+'" style="left:'+a+'%;width:'+(b-a)+'%;background:var(--'+C[i]+');color:var(--'+C[i]+')"></span>'}
  h+='<span class="dot" style="left:'+pos+'%;background:var(--'+C[i]+')"></span></div>'+ends(i);
  if(opt.diff){var t=diffText(i);if(t)h+='<p class="diff" style="color:var(--'+C[i]+'d)">'+(opt.face?'<img src="'+DOG+'" alt="">':'')+t+'</p>'}
  return h+'</div>'}
function bars(opt){var h='<div class="bars">';for(var i=0;i<6;i++)h+=bar(i,opt);return h+'</div>'}
var L=[
 {n:"今",t:"今の形",w:"グレーの線がふつうのコッカーの平均。下の説明を読むとわかります。",now:1,body:bars({line:1})+'<p class="why">細い線は、コッカーの平均です。線から遠いところほど、こむぎの個性です。</p>'},
 {n:"A",t:"凡例を上に置く",w:"バーの上に、2つの印の意味を先に出します。",body:'<div class="legend"><span><i></i>こむぎ</span><span><b></b>ふつうのコッカー</span></div>'+bars({line:1})},
 {n:"B",t:"線を、犬種の小さな顔にかえる",w:"グレーの線のかわりに、コッカーの顔をバーの上に置きます。色の丸がこむぎです。",rec:1,body:'<div class="legend"><span><i></i>こむぎ</span><span><img src="'+DOG+'" alt="">ふつうのコッカー</span></div>'+bars({face:1})},
 {n:"C",t:"ちがいを一言で出す",w:"差が大きいバーにだけ、下に一言を出します。",rec:1,body:bars({line:1,diff:1})},
 {n:"B＋C",t:"顔とひとことを合わせる",w:"コッカーの顔で基準がわかり、差が大きいところだけ言葉が出ます。",rec:1,body:'<div class="legend"><span><i></i>こむぎ</span><span><img src="'+DOG+'" alt="">ふつうのコッカー</span></div>'+bars({face:1,diff:1})},
 {n:"D",t:"ちがいを矢印で見せる",w:"平均からこむぎまで矢印を引きます。差が大きいほど矢印が長くなります。",body:'<div class="legend"><span><i></i>こむぎ</span><span><b></b>ふつうのコッカー</span></div>'+bars({line:1,arrow:1})},
 {n:"E",t:"くらべる相手を切りかえる",w:"上のボタンで、自分の犬種・心の犬種・全体の平均を切りかえます（見本はコッカーを選んだ状態）。",body:'<div class="tabs"><span class="on"><img src="'+DOG+'" alt="">コッカー</span><span><img src="img/chihuahua.webp" alt="">心の犬種：チワワ</span><span>全体の平均</span></div>'+bars({face:1})}
];
document.getElementById("list").outerHTML=L.map(function(x){return '<section class="idea'+(x.now?' now':'')+'"><header><span class="num">'+x.n+'</span><div><h2>'+x.t+(x.rec&&x.n==="B＋C"?'<span class="rec">★おすすめ</span>':'')+'</h2><p class="why">'+x.w+'</p></div></header>'+x.body+'</section>'}).join("");
</script>
