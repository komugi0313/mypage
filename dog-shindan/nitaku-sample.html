<title>ワンちゃん究極の二択</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* 1列のカード。1問ずつ、左右2つのボタンから選ぶ。選ぶと「○○派」が出る（サイト本体と同じ水色×ティール） */
:root{--bg:#E9F1F4;--card:#FFFFFF;--ink:#2F3A45;--mute:#5A6672;--teal:#357385;--mint:#8AC3CF;--sky:#E4F1F4;--a:#E9F4F0;--b:#FDF1E4;--aon:#2E7D6A;--bon:#B8662A;--yellow:#FFF8D6;
--f-disp:"Mochiy Pop One","M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;--f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15202A;--card:#1E2B36;--ink:#EEF3F5;--mute:#B4C1CA;--teal:#8CCFDF;--mint:#3E6E7B;--sky:#223441;--a:#1F3A35;--b:#3A2C1E;--aon:#5FC2A8;--bon:#E9A166;--yellow:#3A3420;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15202A;--card:#1E2B36;--ink:#EEF3F5;--mute:#B4C1CA;--teal:#8CCFDF;--mint:#3E6E7B;--sky:#223441;--a:#1F3A35;--b:#3A2C1E;--aon:#5FC2A8;--bon:#E9A166;--yellow:#3A3420;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;line-height:1.65}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--f-disp);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:1.5rem;color:var(--teal)}
h2{font-size:1.1rem;margin-top:10px}
.lead{margin:0;color:var(--mute);font-weight:800;font-size:.9rem}
.q{background:var(--card);border-radius:22px;padding:16px 14px;display:flex;flex-direction:column;gap:10px}
.qt{margin:0;font-weight:800;font-size:.95rem;text-align:center;color:var(--mute)}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.vs{align-self:center;font-family:var(--f-disp);color:var(--teal);font-size:.85rem}
.opt{border:2.5px solid transparent;border-radius:18px;padding:12px 10px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);display:flex;flex-direction:column;gap:4px;min-width:0;min-height:44px}
.opt b{font-weight:800;font-size:.95rem;line-height:1.45}
.opt small{font-size:.78rem;color:var(--mute);line-height:1.5}
.opt.a{background:var(--a)}.opt.b{background:var(--b)}
.opt.a.on{border-color:var(--aon)}.opt.b.on{border-color:var(--bon)}
.q.done .opt:not(.on){opacity:.55}
.opt:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.res{margin:0;text-align:center;font-weight:800;font-size:.9rem;min-height:1.6em}
.res em{font-style:normal;font-family:var(--f-disp);font-weight:400}
.res.a em{color:var(--aon)}.res.b em{color:var(--bon)}
.note{background:var(--yellow);border-radius:16px;padding:12px 14px;font-size:.86rem;display:flex;flex-direction:column;gap:6px}
.note p{margin:0}
.note b{color:var(--teal)}
@media (max-width:420px){.pair{grid-template-columns:1fr;}.vs{justify-self:center}}
</style>
<div class="wrap">
  <h1>ワンちゃん究極の二択</h1>
  <p class="lead">見本です。飼い主さんが答える、うちの子との暮らしの二択。押すと「○○派」が出ます。</p>
  <div id="list"></div>
  <div class="note">
    <p><b>使いみちの案</b></p>
    <p>① 毎朝のメールの2問に。AかBで答えられるので、返事が1文字ですみます。次の日のメールで「みんなの答え」を出せます。</p>
    <p>② 診断のあとのおまけに。気質の犬種ごとに「○○気質の子の飼い主さんは、7割がソファ派」のようにくらべられます。</p>
    <p>みんなの答えの割合は、答えを集めはじめてから出します。この見本では、数字は出していません。</p>
  </div>
</div>
<script>
var CAT=[
 ["もしも魔法が使えたら",[
  ["うちの子の気持ちが、1日だけ全部わかる","何を考えているのか、答え合わせができる","自分の「だいすき」が、1日だけ全部伝わる","どれだけ大切に思っているか、まるごと届く","答え合わせ派","伝えたい派"],
  ["お留守番中のうちの子が見えるメガネ","会社でも、寝顔やおもちゃ遊びをこっそり見守れる","どこでもいっしょに入れる魔法のリード","カフェも電車も旅館も、いつでもとなりに","見守り派","いっしょ派"],
  ["シャンプーが大好きになる魔法","お風呂の日が、ごきげんタイムに変わる","つめ切りが大好きになる魔法","「はい、どうぞ」と前足を出してくれる","シャンプー派","つめ切り派"],
  ["うちの子の1日の日記が読める","どこで何を見て、何がうれしかったか全部わかる","うちの子が見ている夢をのぞける","寝言の「ムニャ」の正体がわかる","日記派","夢派"]]],
 ["ふだんの暮らし",[
  ["毎朝、顔をペロペロして起こしてくれる","目覚まし時計より正確","毎晩、足元でいっしょに寝てくれる","足がぽかぽか。ただし寝返りはできない","おはよう派","おやすみ派"],
  ["ソファを毎日占領される","気づけば自分は床でくつろいでいる","ベッドの真ん中を毎晩占領される","朝起きると、はじっこで丸くなっている自分","ソファ派","ベッド派"],
  ["呼べばすぐ来るけど、クールな子","来てくれるけど、なでるのは3秒まで","呼んでも来ないけど、甘えんぼな子","来ないのに、気づくと背中にくっついている","クール派","甘えんぼ派"],
  ["写真はいつもブレブレ","元気すぎて、ピントが合ったことがない","カメラを向けると必ずそっぽ","正面からの写真は、1枚もない","ブレブレ派","そっぽ派"]]],
 ["お散歩・おでかけ",[
  ["毎日、同じ道のお散歩","安心のいつものコース。顔なじみのワン友にも会える","毎回、知らない道を探検","毎日が冒険。ただし帰り道は少し迷う","いつもの道派","探検派"],
  ["ワン友が100匹","どこへ行っても「あ、○○ちゃんだ！」","大親友が1匹","会えば、しっぽがちぎれそうなほど大よろこび","100匹派","大親友派"],
  ["夏の朝5時のお散歩","涼しいけれど、早起きはつらい","冬の夜7時のお散歩","空気はきりっと冷たいけれど、星がきれい","夏の朝派","冬の夜派"],
  ["にぎやかなドッグカフェ","ワンちゃんメニューと、たくさんのお友だち","だれもいない広い原っぱ","思いきり走り回れて、ひとりじめ","カフェ派","原っぱ派"]]]
];
var h="";CAT.forEach(function(c,ci){h+='<h2>'+c[0]+'</h2>';c[1].forEach(function(q,qi){var id=ci+"-"+qi;
 h+='<div class="q" data-id="'+id+'"><p class="qt">どっちがいい？</p><div class="pair">'+
 '<button type="button" class="opt a" data-s="a"><b>'+q[0]+'</b><small>'+q[1]+'</small></button><span class="vs">or</span>'+
 '<button type="button" class="opt b" data-s="b"><b>'+q[2]+'</b><small>'+q[3]+'</small></button></div><p class="res" aria-live="polite"></p></div>'})});
var L=document.getElementById("list");L.innerHTML=h;L.style.display="flex";L.style.flexDirection="column";L.style.gap="12px";
L.addEventListener("click",function(e){var b=e.target.closest(".opt");if(!b)return;var q=b.closest(".q"),id=q.dataset.id.split("-"),d=CAT[+id[0]][1][+id[1]],s=b.dataset.s;
 [].forEach.call(q.querySelectorAll(".opt"),function(x){x.classList.toggle("on",x===b)});q.classList.add("done");
 var r=q.querySelector(".res");r.className="res "+s;r.innerHTML='あなたは <em>'+(s==="a"?d[4]:d[5])+'</em>'});
</script>
