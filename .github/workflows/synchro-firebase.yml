# シンクロ（synchro/）を Firebase Hosting に公開する（究極の二択・ワンソナと同じしくみ）
# main に PR をマージすると、synchro/ に変更があったときだけ自動で公開する。
# 必要なもの：この倉庫の Settings → Secrets に FIREBASE_SERVICE_ACCOUNT_16TYPEPLUS（究極の二択と同じ鍵）
#           Firebase の Hosting に「kokoro-synchro」というサイトを足しておくこと（synchro/.firebaserc）
name: シンクロを Firebase に公開

on:
  push:
    branches: [main]
    paths:
      - 'synchro/**'
      - '.github/workflows/synchro-firebase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_16TYPEPLUS }}
          projectId: typeplus-69c66
          channelId: live
          target: synchro
          entryPoint: ./synchro
