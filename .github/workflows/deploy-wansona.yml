name: Deploy 44Wansonalities

on:
  push:
    branches: [main]
    paths:
      - "dog-shindan/index.html"
      - "dog-shindan/lp.html"
      - "dog-shindan/privacy.html"
      - "dog-shindan/img/**"
      - "dog-shindan/icon/**"
      - "dog-shindan/lp/**"
      - "dog-shindan/firebase.json"
      - "dog-shindan/tools/build_site.py"
  workflow_dispatch:

concurrency:
  group: deploy-wansona
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 dog-shindan/tools/build_site.py
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_16TYPEPLUS }}
          projectId: typeplus-69c66
          channelId: live
          entryPoint: ./dog-shindan
