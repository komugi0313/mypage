# アイ・シンク（isync/）を Firebase Hosting に公開する（究極の二択・ワンソナと同じしくみ）
# main に PR をマージすると、isync/ に変更があったときだけ自動で公開する。
# 必要なもの：この倉庫の Settings → Secrets に FIREBASE_SERVICE_ACCOUNT_16TYPEPLUS（究極の二択と同じ鍵）
#           Firebase の Hosting に「isync-futari」というサイトを足しておくこと（isync/.firebaserc）
name: アイ・シンクを Firebase に公開

on:
  push:
    branches: [main]
    paths:
      - 'isync/**'
      - '.github/workflows/isync-firebase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_16TYPEPLUS }}
          projectId: typeplus-69c66
          channelId: live
          target: isync
          entryPoint: ./isync
