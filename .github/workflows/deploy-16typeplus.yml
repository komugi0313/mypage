name: Deploy 16TYPE+

on:
  push:
    branches: [main]
    paths:
      - "16typeplus/site/**"
      - "16typeplus/firebase.json"
  workflow_dispatch:

concurrency:
  group: deploy-16typeplus
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_16TYPEPLUS }}
          projectId: typeplus-69c66
          channelId: live
          entryPoint: ./16typeplus
