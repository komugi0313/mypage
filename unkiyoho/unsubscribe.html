<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>配信停止 ── 私だけの運気予報</title>
<link rel="icon" type="image/png" href="favicon-tenki.png">
<link rel="apple-touch-icon" href="favicon-tenki-180.png">
<meta name="description" content="私だけの運気予報 メール配信の停止。ログイン不要・ワンクリックで停止できます。">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=optional" rel="stylesheet">
<style>
  :root{--ink:#25304a;--muted:#5c667e;--muted-2:#94a0b5;--coral:#ff7e5f;--coral-d:#ef5f3c;--gold:#cf8f33;--ok:#2f9e6f;--line:rgba(40,60,100,.18);--line-strong:rgba(239,95,60,.4);--serif:'Shippori Mincho B1',serif;--sans:'Zen Kaku Gothic New',sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);color:var(--ink);background:#8fc2ec;line-height:1.85;min-height:100vh;}
  .bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(460px 240px at 50% 112%,rgba(255,255,255,.5),transparent 62%),linear-gradient(180deg,#2f68b0 0%,#4a86c8 26%,#7fb2e2 52%,#b7daf1 78%,#e8f3fc 100%);}
  .wrap{max-width:460px;margin:0 auto;padding:40px 20px 90px;}
  .card{background:#fff;border-radius:20px;padding:28px 22px 24px;box-shadow:0 26px 60px -22px rgba(30,60,110,.45);text-align:center;}
  .ic{width:60px;height:60px;margin:4px auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;}
  .ic.stop{background:linear-gradient(135deg,var(--muted-2),#7c8698);color:#fff;}
  .ic.on{background:linear-gradient(135deg,var(--ok),#54c493);color:#fff;}
  h1{font-family:var(--serif);font-weight:800;font-size:21px;color:var(--ink);}
  .sub{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.9;}
  .mail{display:inline-block;background:#f6f8fc;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;margin-top:12px;color:var(--ink);}
  .mail b{color:var(--coral-d);}
  .btn{margin-top:22px;width:100%;border:none;cursor:pointer;border-radius:12px;padding:15px;font-family:var(--serif);font-weight:800;font-size:15px;letter-spacing:.06em;color:#fff;background:linear-gradient(135deg,var(--coral),var(--coral-d));box-shadow:0 16px 34px -12px rgba(239,95,60,.5);}
  .btn.ghost{background:#fff;color:var(--coral-d);border:1.5px solid var(--line-strong);box-shadow:none;}
  .links{margin-top:18px;display:flex;flex-direction:column;gap:10px;}
  .links a{color:#2f6fb5;font-size:12.5px;font-weight:700;text-decoration:underline;text-underline-offset:2px;}
  .note{font-size:11.5px;color:var(--muted-2);margin-top:16px;line-height:1.8;}
  .foot{text-align:center;color:rgba(255,255,255,.85);font-size:11px;margin-top:22px;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <div class="card">
    <!-- 停止完了 -->
    <div id="stopped">
      <div class="ic stop">✔</div>
      <h1>メール配信を停止しました</h1>
      <div class="sub">毎朝の運気予報メールの配信を停止しました。<br>手続きは以上です（ログイン不要）。</div>
      <div class="mail" id="mailRow" hidden>対象：<b id="mailAddr"></b></div>
      <div class="note">「私だけの運気予報」はずっと完全無料です。<br>また受け取りたくなったら、いつでも再開できます。</div>
      <button class="btn ghost" onclick="resume()">やっぱり毎朝の配信を受け取る</button>
      <div class="links">
        <a href="mypage.html">マイページで他の設定を見る</a>
        <a href="index.html">運気予報TOPへ</a>
      </div>
    </div>
    <!-- 再開完了 -->
    <div id="resumed" hidden>
      <div class="ic on">☀</div>
      <h1>配信を再開しました</h1>
      <div class="sub">明日の朝から、また運気予報メールをお届けします。</div>
      <div class="links" style="margin-top:22px;">
        <a href="mypage.html">マイページへ</a>
        <a href="index.html">運気予報TOPへ</a>
      </div>
    </div>
  </div>
  <div class="foot">送信者：72k株式会社 ／ お問い合わせ：info@72k.ai</div>
</div>

<!-- 認証設定：本番ではエンジニアがサーバーAPIのURLをここに設定する（空なら開発モード） -->
<script>window.UNKIYOHO_AUTH_API_BASE = "";</script>
<script>
/* 配信停止は「ログイン不要・ワンクリック」。
   本番：メールのリンクは受信者ごとの解除トークン付きURL（例 unsubscribe.html?token=XXXX）にし、
        このページで token をサーバーへ送って確実に停止する（GET一発で停止＝法令対応）。
   開発：token/email を見て、ブラウザ内の配信フラグを OFF にする（サーバー未接続）。 */
(function(){
  var qs=new URLSearchParams(location.search);
  var email=(qs.get("email")||"").trim();
  var API=(window.UNKIYOHO_AUTH_API_BASE||"").replace(/\/+$/,"");
  if(email){var el=document.getElementById("mailAddr");el.textContent=email;document.getElementById("mailRow").hidden=false;}
  // 配信フラグを OFF（マイページのトグルと共有）
  try{localStorage.setItem("unkiyoho_mail_opt","off");}catch(e){}
  // 本番：トークンをサーバーへ（ログイン不要のワンクリック停止）
  if(API){var token=qs.get("token");if(token){fetch(API+"/mail/unsubscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:token})}).catch(function(){});}}
})();
function resume(){
  try{localStorage.setItem("unkiyoho_mail_opt","on");}catch(e){}
  var API=(window.UNKIYOHO_AUTH_API_BASE||"").replace(/\/+$/,"");
  if(API){var qs=new URLSearchParams(location.search);var token=qs.get("token");if(token){fetch(API+"/mail/resubscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:token})}).catch(function(){});}}
  document.getElementById("stopped").hidden=true;
  document.getElementById("resumed").hidden=false;
  window.scrollTo(0,0);
}
</script>
</body>
</html>
