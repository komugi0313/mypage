<!doctype html><html lang="ja"><head><meta charset="utf-8">
<!-- ぴたっとシンクロのアイコンの元（1024×1024）。角まで絵で埋めた正方形（iPhone・Android が自分で丸く切る）。
     作り直すときは、この画面を 1024×1024 で撮って icon-1024.png にし、512・192・180（apple-touch-icon）・32（favicon）に縮める -->
<style>
html,body{margin:0;width:1024px;height:1024px}
body{background:#22253A;display:grid;place-items:center;overflow:hidden}
.c{position:relative;width:760px;height:560px}
.c i{position:absolute;width:360px;height:360px;border-radius:50%;mix-blend-mode:screen}
.c i:nth-child(1){left:20px;top:0;background:#6B6EF0}
.c i:nth-child(2){left:380px;top:0;background:#FF7A5C}
.c i:nth-child(3){left:200px;top:200px;background:#3FBF8A}
</style></head><body><div class="c"><i></i><i></i><i></i></div></body></html>
