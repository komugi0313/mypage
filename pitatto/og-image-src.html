<!doctype html><html lang="ja"><head><meta charset="utf-8">
<!-- シェアしたときの画像の元（1200×630）。作り直すときはこの画面を撮って og-image.png にし、index.html の og:image の ?v= を1つ上げる -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px}
body{background:#F3F5F8;font-family:"Zen Kaku Gothic New",sans-serif;color:#22253A;display:grid;grid-template-columns:1fr 520px;align-items:center;gap:30px;padding:0 60px;box-sizing:border-box}
.logo{position:relative;width:170px;height:120px;margin-bottom:24px}
.logo i{position:absolute;width:78px;height:78px;border-radius:50%;mix-blend-mode:multiply}
.logo i:nth-child(1){left:0;top:0;background:#4B4FC9}.logo i:nth-child(2){left:78px;top:0;background:#C2452D}.logo i:nth-child(3){left:39px;top:42px;background:#2F7D5B}
h1{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:92px;line-height:1.1;margin:0}
p{font-size:34px;font-weight:700;margin:22px 0 0;color:#3A3E57;line-height:1.5}
.card{background:#fff;border:2px solid #D9DDE7;border-radius:28px;padding:30px;display:flex;flex-direction:column;gap:14px}
.tag{align-self:flex-start;background:#B4366A;color:#fff;font-weight:700;font-size:22px;padding:4px 16px;border-radius:99px}
.q{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:40px}
.o{border:2px solid #D9DDE7;border-radius:18px;padding:14px 18px;font-size:27px;font-weight:700;display:flex;gap:14px;white-space:nowrap;align-items:center}
.o b{width:44px;height:44px;border-radius:50%;background:#F3F5F8;border:2px solid #D9DDE7;display:grid;place-items:center;font-size:22px}
.o.m{border-style:dashed;justify-content:center;color:#5A5F78;font-size:24px}
</style></head><body>
<div><div class="logo"><i></i><i></i><i></i></div><h1>ぴたっと<br>シンクロ</h1><p>2択に答えて、答え合わせ。<br>恋人・友だち・家族と。</p></div>
<div class="card"><span class="tag">恋愛・連絡</span><div class="q">LINEは？</div>
<div class="o"><b>A</b>毎日やりとりしたい</div><div class="o"><b>B</b>用があるときだけでいい</div><div class="o m">こだわらない</div></div>
</body></html>
