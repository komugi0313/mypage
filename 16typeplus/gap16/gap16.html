<div class="page">
  <h1>ギャップ16タイプ（見本）</h1>
  <p class="lead">生まれつきの「グループ」と、今の「グループ」の組み合わせで16タイプ。MBTIと同じ文字を使うので、自分の4文字から型がすぐわかります。</p>
  <section class="card">
    <h2>4つのグループ</h2>
    <div class="grp" id="grp"></div>
    <p class="fine">例：生まれつき ESFP（冒険家 SP）→ 今 ESFJ（守り人 SJ）＝「SP→SJ 時間厳守ノラ猫」。</p>
  </section>
  <section class="card">
    <h2>16タイプ早見表</h2>
    <div class="map" id="map"></div>
    <p class="fine">縦が生まれつき、横が今。点線は生まれつきと今が同じグループの4タイプ。赤い枠が下の見本です。</p>
  </section>
  <div class="tabs" role="tablist" id="tabs"></div>
  <section class="card" id="sheet"></section>

</div>

const cache={};
async function show(i){const s=T.samples[i];T.samples.forEach((_,j)=>$("tab"+j).setAttribute("aria-selected",i===j));

const PAL={NT:"#7A5EA8",NF:"#3F9A72",SJ:"#3E7FA6",SP:"#C29A3A",ink:"#1F2733",muted:"#5E6A7A",soft:"#EEF1F5",rule:"#E2E6EC",plus:"#C2553F"};
const SANS='"IBM Plex Sans JP","Hiragino Sans",sans-serif',MONO='"IBM Plex Mono",monospace';
const loadImg=src=>new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=src;});
async function fonts(){try{await Promise.all(["700 40px "+SANS,"500 40px "+SANS,"600 40px "+MONO].map(f=>document.fonts.load(f,"あ漢A→")));}catch(e){}}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function wrap(c,t,w){const out=[];let cur="";const NG="、。」』）！？ー…";for(const ch of t){if(c.measureText(cur+ch).width>w&&cur&&!NG.includes(ch)){out.push(cur);cur="";}cur+=ch;}if(cur)out.push(cur);return out;}
function codeDraw(c,k,x,y,size,align){const [b,n]=k.split(">");c.font="600 "+size+"px "+MONO;const wb=c.measureText(b).width+size*.6,wa=size*1.2,wn=c.measureText(n).width+size*.6,tw=wb+wa+wn;let sx=align==="center"?x-tw/2:x;
 [[b,wb],[null,wa],[n,wn]].forEach(([t,w])=>{if(t){c.fillStyle=PAL[t];rr(c,sx,y-size*1.05,w,size*1.4,size*.25);c.fill();c.fillStyle="#fff";c.textAlign="center";c.fillText(t,sx+w/2,y);}else{c.fillStyle=PAL.muted;c.textAlign="center";c.fillText("→",sx+w/2,y);}sx+=w;});c.textAlign="left";}
async function cloud(s){await fonts();const W=1080,H=1350,cv=document.createElement("canvas");cv.width=W;cv.height=H;const c=cv.getContext("2d");
 const [b,n]=s.k.split(">");c.fillStyle="#FFFFFF";c.fillRect(0,0,W,H);
 const cx=W/2,cy=H/2-20,boxW=400,boxH=500,placed=[[cx-boxW/2,cy-boxH/2,boxW,boxH]];
 const im=await loadImg(IMG[s.img]);if(im)c.drawImage(im,cx-170,cy-230,340,340);
 codeDraw(c,s.k,cx,cy+160,34,"center");c.font="700 50px "+SANS;c.fillStyle=PAL.ink;c.textAlign="center";c.fillText(T.names[s.k],cx,cy+232);c.textAlign="left";
 const SZ={3:78,2:56,1:38},hit=(r)=>placed.some(p=>r[0]<p[0]+p[2]&&r[0]+r[2]>p[0]&&r[1]<p[1]+p[3]&&r[1]+r[3]>p[1]);
 const words=s.words.slice().sort((a,b2)=>b2[1]-a[1]);
 words.forEach(([w,wt],i)=>{const fs=SZ[wt];c.font="700 "+fs+"px "+SANS;const tw=c.measureText(w).width,th=fs*1.25;
  for(let t=0;t<12000;t++){const a=t*0.12+i*1.7,r=30+t*0.18,x=cx+Math.cos(a)*r*1.0-tw/2,y=cy+Math.sin(a)*r*1.3-th/2;
   const rect=[x-6,y-2,tw+12,th+4];if(x<40||y<40||x+tw>W-40||y+th>H-100)continue;if(hit(rect))continue;
   placed.push(rect);c.fillStyle=i%3===0?PAL[b]:i%3===1?PAL[n]:PAL.ink;c.textBaseline="top";c.fillText(w,x,y);c.textBaseline="alphabetic";break;}});
 c.font="600 30px "+MONO;c.fillStyle=PAL.ink;c.textAlign="center";c.fillText("16TYPE+  ギャップ16タイプ",W/2,H-50);c.textAlign="left";
 return cv.toDataURL("image/png");}
async function sheet(s){await fonts();const W=1080,H=1860,cv=document.createElement("canvas");cv.width=W;cv.height=H;const c=cv.getContext("2d");
 const [b,n]=s.k.split(">");c.fillStyle="#FFFFFF";c.fillRect(0,0,W,H);
 c.fillStyle=PAL[b];c.fillRect(0,0,W/2,14);c.fillStyle=PAL[n];c.fillRect(W/2,0,W/2,14);
 const im=await loadImg(IMG[s.img]);if(im)c.drawImage(im,W-380,50,320,320);
 c.font="600 26px "+MONO;c.fillStyle=PAL.muted;c.fillText("16TYPE+",70,95);
 codeDraw(c,s.k,70,190,46,"left");c.font="700 66px "+SANS;c.fillStyle=PAL.ink;
