<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>キャラクターパレード</title>
<style>
/* ===== キャラクターが横に流れる列（そのまま別のページに貼れる部品） ===== */
:root{--paper:#F8F3EA;--rule:#E7DDCC;--muted:#7A6F63}
body{margin:0;padding:40px 16px;background:#F6F1E7;font-family:system-ui,sans-serif}
.box{max-width:640px;margin:0 auto;background:#FFFCF5;border:1px solid var(--rule);border-radius:18px;overflow:hidden}
.box p{margin:0;padding:22px 20px;font-size:15px;line-height:1.8}

.parade{overflow:hidden;border-top:1px solid var(--rule);background:var(--paper);
  /* 左右の端をふわっと消す */
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.ptrack{display:flex;width:max-content;padding:10px 0 6px;animation:parade 70s linear infinite}
.ptrack figure{margin:0 2px;width:100px;text-align:center;flex:none}
.ptrack img{width:100px;height:100px;display:block}
.ptrack figcaption{font-weight:600;font-size:12px;color:var(--muted);letter-spacing:.04em}
/* 同じ列を2回並べて、半分だけ動かす → つなぎ目なく流れ続ける */
@keyframes parade{to{transform:translateX(-50%)}}
/* 動きを減らす設定の人には止めて、指で横にスクロールできるようにする */
@media (prefers-reduced-motion:reduce){.ptrack{animation:none}.parade{overflow-x:auto}}
/* マウスを乗せたら一時停止（お好みで） */
.parade:hover .ptrack{animation-play-state:paused}
</style>
</head>
<body>
<div class="box">
  <p>キャラクターが横に流れる列の見本です。<br>流れる速さは <code>70s</code>（1周の秒数）で変えられます。</p>
  <div class="parade" aria-hidden="true"><div class="ptrack" id="parade"></div></div>
</div>
<script>
/* 絵の置き場所とタイプの並び。別の診断で使うときは、ここを差し替える */
const BASE="../../characters/web/";
const LIST="INTJ INTP ENTJ ENTP INFJ INFP ENFJ ENFP ISTJ ISFJ ESTJ ESFJ ISTP ISFP ESTP ESFP".split(" ");
const one=LIST.map(t=>'<figure><img src="'+BASE+t+'_s.webp" alt="" loading="lazy" width="100" height="100"><figcaption>'+t+'</figcaption></figure>').join("");
document.getElementById("parade").innerHTML=one+one; /* 2回並べるのがポイント */
</script>
</body>
</html>
