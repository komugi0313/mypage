<title>生まれつきの5文字 めくり見本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: input card, then the reveal card — five face-down tiles that turn over one by one, each with its reason; then the comparison with today's type. */
:root{--bg:#F6F7F9;--surface:#FFFFFF;--ink:#1F2733;--muted:#5E6A7A;--rule:#E2E6EC;--soft:#EEF1F5;--plus:#C2553F;
 --ei:#3E7FA6;--sn:#C29A3A;--tf:#3F9A72;--jp:#7A5EA8;--at:#C2553F;--back:#2B3442;
 --sans:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12161C;--surface:#1A2028;--ink:#E7EBF0;--muted:#9AA5B4;--rule:#2B333E;--soft:#222934;--plus:#E27B64;--ei:#6AA9CF;--sn:#DDB65A;--tf:#62BE94;--jp:#A68BD3;--at:#E27B64;--back:#3A4556;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161C;--surface:#1A2028;--ink:#E7EBF0;--muted:#9AA5B4;--rule:#2B333E;--soft:#222934;--plus:#E27B64;--ei:#6AA9CF;--sn:#DDB65A;--tf:#62BE94;--jp:#A68BD3;--at:#E27B64;--back:#3A4556;color-scheme:dark}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.8;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:560px;margin:0 auto;padding-block:0 56px;display:flex;flex-direction:column;gap:16px;word-break:keep-all;overflow-wrap:anywhere}
.page *{text-wrap-style:pretty}
.bar{display:flex;align-items:baseline;gap:10px;padding-block:14px;border-bottom:1px solid var(--rule)}
.logo{font-family:var(--mono);font-weight:600;font-size:20px}.logo em{font-style:normal;color:var(--plus)}.bar small{font-size:11px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);text-align:center;margin:0}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:20px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.lbl{font-weight:700;font-size:14px;display:block;margin:0 0 8px}
.date{display:flex;gap:8px;margin-bottom:18px}.date select{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 6px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink)}
.pick{display:grid;grid-template-columns:repeat(4,1fr) .9fr;gap:6px;margin-bottom:18px}
.seg{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:10px;overflow:hidden;box-shadow:0 2px 0 var(--rule)}
.seg button{font-family:var(--mono);font-weight:600;font-size:18px;border:0;background:var(--surface);color:var(--ink);padding:7px 0;cursor:pointer;line-height:1.2}
.seg button+button{border-top:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--c);color:#fff}
.seg.at button{font-size:15px}
.btn{display:block;width:100%;padding:14px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--surface);font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.btn.sub{background:var(--surface);color:var(--ink);border-color:var(--rule)}
button:focus-visible,select:focus-visible{outline:2px solid var(--ei);outline-offset:2px}

/* reveal */
.reveal{text-align:center}
.story{font-size:clamp(18px,5.4vw,22px);line-height:1.6;margin:4px 0 16px;min-height:3.2em;text-wrap-style:balance}
.story .ln{display:inline-block}.story .c{font-family:var(--mono);white-space:nowrap}.story .b{color:var(--plus)}
.rowlbl{display:flex;gap:6px;align-items:baseline;font-size:12px;color:var(--muted);margin:0 0 6px;text-align:left}.rowlbl b{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr) .85fr;gap:8px;perspective:800px}
.ft{position:relative;aspect-ratio:1/1.15;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.3,1.2)}
.ft[data-open="1"]{transform:rotateY(180deg);cursor:default}
.ft .f,.ft .k{position:absolute;inset:0;border-radius:12px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ft .k{background:var(--back);color:#fff;font-family:var(--mono);font-weight:600;font-size:clamp(18px,6vw,26px);
 background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px);background-size:8px 8px}
.ft .k small{position:absolute;bottom:6px;left:0;right:0;font-family:var(--sans);font-size:10px;font-weight:500;opacity:.75}
.ft .f{transform:rotateY(180deg);border:2px dashed var(--c);color:var(--ink);font-family:var(--mono);font-weight:600;font-size:clamp(22px,7.5vw,32px);background:var(--surface)}
.ft .f.strong{border-style:solid;background:var(--c);color:#fff}
.axl{display:grid;grid-template-columns:repeat(4,1fr) .85fr;gap:8px;font-size:10.5px;color:var(--muted);margin-top:4px;white-space:nowrap}
.hint{font-size:13px;color:var(--muted);margin:12px 0 0}
.reasons{display:flex;flex-direction:column;gap:10px;margin-top:16px;text-align:left}
.rs{border-left:4px solid var(--c);background:var(--soft);border-radius:0 12px 12px 0;padding:10px 12px;animation:in .45s ease both}
.rs .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rs .h b{font-family:var(--mono);font-size:18px;color:var(--c)}
.rs .h span{font-weight:700;font-size:14px}
.rs .h small{font-size:11px;color:var(--muted);margin-left:auto}
.rs p{margin:2px 0 0;font-size:14px}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cmp{margin-top:18px;text-align:left}
.nowrow{display:grid;grid-template-columns:repeat(4,1fr) .85fr;gap:8px}
.arw{display:grid;grid-template-columns:repeat(4,1fr) .85fr;gap:8px;text-align:center;font-size:14px;color:var(--rule);margin:2px 0}
.arw .c{color:var(--c);font-weight:700}
.nt{aspect-ratio:1/1.15;border-radius:12px;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:clamp(20px,7vw,30px);background:var(--soft);color:var(--ink)}
.nt.c{background:var(--c);color:#fff}.nt.none{background:none;border:2px dashed var(--rule);color:var(--muted)}
.sum{margin:14px 0 0;text-align:center;font-size:14.5px}.sum b{color:var(--plus)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px;justify-content:center}
.legend i{display:inline-block;width:14px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
@media (prefers-reduced-motion:reduce){.ft{transition:none}.rs{animation:none}}
</style>
<div class="page">
  <header class="bar"><span class="logo">16TYPE<em>+</em></span><small>16タイププラス</small></header>
  <p class="note">見本：タイルを1枚ずつめくって、生まれつきの5文字と、その理由を見る形（実際に計算します）</p>

  <section class="card" id="form">
    <span class="lbl">① 生年月日</span>
    <div class="date"><select id="y" aria-label="年"></select><select id="m" aria-label="月"></select><select id="d" aria-label="日"></select></div>
    <span class="lbl">② 今のあなたの16タイプ</span>
    <div class="pick" id="pick"></div>
    <button class="btn" id="go" type="button">生まれつきの5文字をめくる</button>
  </section>

  <section class="card reveal" id="rev" hidden aria-live="polite">
    <p class="eyebrow">生まれつきの5文字</p>
    <h1 class="story" id="story">タイルをタップして、1枚ずつめくってください</h1>
    <p class="rowlbl"><b>生まれつき</b>本当の自分</p>
    <div class="tiles" id="tiles"></div>
    <div class="axl"><span>エネルギー</span><span>見方</span><span>判断</span><span>行動</span><span>構え</span></div>
    <div class="legend"><span><i style="background:var(--ei)"></i>はっきり出ている文字</span><span><i style="border:2px dashed var(--muted)"></i>どちらにも近い文字</span></div>
    <p class="hint" id="hint">あと5枚</p>
    <div class="reasons" id="reasons"></div>
    <div class="cmp" id="cmp" hidden>
      <div class="arw" id="arw"></div>
      <p class="rowlbl"><b>いま</b>今の自分（16タイプ）</p>
      <div class="nowrow" id="nowrow"></div>
      <p class="sum" id="sum"></p>
    </div>
    <div style="height:14px"></div>
    <button class="btn sub" id="again" type="button">生年月日を変えてもう一度</button>
  </section>
</div>

  EI:G(["食神","傷官","偏財","正財"])-G(["比肩","劫財","偏印","印綬"]),ex:G(["食神","傷官"]),en:G(["偏財","正財"]),in_:G(["偏印","印綬"]),self:G(["比肩","劫財"]),
  SN:(el[2]+el[3])-(el[0]+el[4]),TF:(el[3]+el[4])-(el[0]+el[1])-temp*0.5,JP:G(["正官","正財","印綬","比肩"])-G(["偏官","偏財","偏印","傷官","劫財"])};}
const AX=[{k:"EI",a:"E",b:"I",c:"--ei",n:"エネルギー"},{k:"SN",a:"S",b:"N",c:"--sn",n:"ものの見方"},{k:"TF",a:"T",b:"F",c:"--tf",n:"判断のしかた"},{k:"JP",a:"J",b:"P",c:"--jp",n:"行動のしかた"}];
const WORD={E:"外向型",I:"内向型",S:"現実型",N:"直感型",T:"思考型",F:"感情型",J:"計画型",P:"柔軟型",A:"自己主張型",T2:"慎重型"};
function reason(k,L,c){
 if(k==="EI")return L==="E"?(c.ex>=c.en?"思ったことを外に出す「表現の星」が強い命式。気持ちや考えを、言葉や行動にして外へ出すほど元気になります。":"人やモノと関わる「縁の星」が強い命式。人と会い、外の世界と関わるほど力が出ます。")
  :(c.in_>=c.self?"学んだことを内にためる「学びの星」が強い命式。ひとりで考え、吸収する時間に力がたまります。":"自分の軸を守る「自分の星」が強い命式。人に合わせるより、自分のペースで力を出す人です。");
 if(k==="SN")return L==="S"?"「支える力」「決める力」が強い命式。目に見えるもの、確かなものを土台に考える人です。":"「伸びる力」「めぐる力」が強い命式。まだ形のない可能性や、つながりを感じ取る人です。";
 if(k==="TF")return L==="T"?(c.temp<0?"涼しい季節の気が強い命式。熱くなる場面でも、一歩引いて冷静に筋道を見られます。":"「決める力」「めぐる力」が強い命式。気持ちより先に、筋道と理屈で考えます。")
  :(c.temp>0?"あたたかい季節の気が強い命式。人の気持ちに自然と寄り添い、思いやりで決める人です。":"「伸びる力」「燃える力」が強い命式。理屈より、気持ちや思いを大事にして決めます。");
 if(k==="JP")return L==="J"?"決まった形を守り、着実に積み上げる星が多い命式。見通しが立つと力を出せます。":"変化や自由に強い星が多い命式。状況に合わせて、柔軟に動けるほど力を出せます。";
 return L==="A"?"自分を支える力が強い命式。人の評価にゆれにくく、自分の判断で進めます。":"まわりの影響を受け取りやすい命式。そのぶん空気をよく読み、慎重に動けます。";}
function birth(y,m,d){const c=chart(y,m,d);const out=AX.map(A=>{const v=c[A.k]-MC.med[A.k]+1e-6;const L=v>0?A.a:A.b;const half=v>0?(MC.q[A.k][1]-MC.med[A.k]):(MC.med[A.k]-MC.q[A.k][0]);const strong=Math.abs(v)>=half*0.6;return {k:A.k,L,strong,c:A.c,why:reason(A.k,L,c),name:A.n};});
 out.push({k:"AT",L:c.strong?"A":"T",strong:true,c:"--at",why:reason("AT",c.strong?"A":"T",c),name:"心の構え"});return out;}
const $=id=>document.getElementById(id);

["y","m","d"].forEach(id=>$(id).addEventListener("change",e=>{st[id]=+e.target.value;fillDate();}));
const pk=$("pick");AX.forEach((A,i)=>{const g=document.createElement("div");g.className="seg";g.style.setProperty("--c","var("+A.c+")");
 [A.a,A.b].forEach(l=>{const b=document.createElement("button");b.type="button";b.textContent=l;b.setAttribute("aria-pressed",st.t[i]===l);b.onclick=()=>{st.t[i]=l;[...g.children].forEach(x=>x.setAttribute("aria-pressed",x===b));};g.appendChild(b);});pk.appendChild(g);});
{const g=document.createElement("div");g.className="seg at";g.style.setProperty("--c","var(--at)");["A","T","?"].forEach(l=>{const b=document.createElement("button");b.type="button";b.textContent=l;b.setAttribute("aria-label",l==="?"?"A/T わからない":l);b.setAttribute("aria-pressed",l==="?");b.onclick=()=>{st.at=l==="?"?null:l;[...g.children].forEach(x=>x.setAttribute("aria-pressed",x===b));};g.appendChild(b);});pk.appendChild(g);}

 $("tiles").innerHTML=B.map((x,i)=>'<button class="ft" type="button" data-i="'+i+'" style="--c:var('+x.c+')" aria-label="'+x.name+'のタイルをめくる"><span class="k">?<small>'+(i+1)+'</small></span><span class="f'+(x.strong?" strong":"")+'">'+x.L+'</span></button>').join("");
 document.querySelectorAll(".ft").forEach(t=>t.onclick=()=>flip(t));$("rev").scrollIntoView({behavior:"smooth"});};
function flip(t){if(t.dataset.open)return;t.dataset.open="1";const x=B[+t.dataset.i];opened++;
 const w=x.k==="AT"?(x.L==="A"?WORD.A:WORD.T2):WORD[x.L];
 const div=document.createElement("div");div.className="rs";div.style.setProperty("--c","var("+x.c+")");div.innerHTML='<div class="h"><b>'+x.L+'</b><span>'+w+'</span><small>'+x.name+(x.strong?"・はっきり":"・どちらにも近い")+'</small></div><p>'+x.why+'</p>';$("reasons").appendChild(div);
 $("hint").textContent=opened<5?"あと"+(5-opened)+"枚":"";if(opened===5)done();}
function done(){const born=B.slice(0,4).map(x=>x.L).join(""),bAT=B[4].L;const now=st.t.join(""),nAT=st.at;
 // ギャップは無理に作らない：どちらにも近い文字は、今のタイプに合わせる

 const cols=B.map(x=>x.c);$("arw").innerHTML=diff.concat([atD]).map((d,i)=>'<span class="'+(d?"c":"")+'" style="--c:var('+cols[i]+')">'+(d?"↓":"｜")+'</span>').join("");
 $("nowrow").innerHTML=now.split("").map((l,i)=>'<span class="nt'+(diff[i]?" c":"")+'" style="--c:var('+cols[i]+')">'+l+'</span>').join("")+'<span class="nt'+(nAT?(atD?" c":""):" none")+'" style="--c:var(--at)">'+(nAT||"?")+'</span>';
 $("sum").innerHTML=(dn===0?"生まれつきと今が、<b>ぴったり同じ</b>です。":"変わったのは <b>"+dn+"文字</b>。")+(soft?"<br><small style=\"color:var(--muted)\">どちらにも近い文字（"+soft+"つ）は、今のタイプに合わせています。</small>":"");
 $("cmp").hidden=false;}
$("again").onclick=()=>{$("rev").hidden=true;$("form").hidden=false;$("form").scrollIntoView({behavior:"smooth"});};
fillDate();BX.start(document.querySelector(".page"));
