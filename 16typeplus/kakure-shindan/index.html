@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
/* 日本語の泣き別れ（変な位置での改行）を防ぐ */
html{-webkit-text-size-adjust:100%}
body{word-break:auto-phrase;line-break:strict;overflow-wrap:break-word}
.inner p,.inner div,.inner span,.inner td,.inner th,.inner h1,.inner h2,.inner h3,.inner button,.inner label{text-wrap:pretty}
/* 長い段落は文節折返しをやめて、右側に余白を残さず行を詰める */
.card.block p,.qnote,.gap-intro,.gap-foot,.about-box p,.pres .pcore,.pres .pnote,.aj-s,
.ad-copy,.mdl-lead,.stp div,.src p,.tn-t,.closing-lead,.tf-copy,.bline,.ura,.honne p{
  word-break:normal;text-wrap:wrap}
/* 短い強調句は途中で折り返さない */
.nb,.lead em,.bar-note b{white-space:nowrap}
/* .inner の text-wrap:pretty が span.nb の nowrap を上書きするのを防ぐ */
.inner .nb,.inner .lead em,.inner .bar-note b{text-wrap:nowrap}
.blockhead .tag{white-space:nowrap}
:root{--tiff:#FF2E9A;--tiff-d:#FF66B5;--tiff2:#FFE83D;--pale:#1d1830;
  --cyan:#3DF5FF;--purple:#B36BFF;
  --text:#F3EFFA;--muted:#B3A9C8;--white:#15121f;--gold:#FFE83D;--line:rgba(255,255,255,.14)}
body{color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif}
.wrap{position:relative;min-height:100vh;width:100%;
  background:linear-gradient(180deg,#0b0910 0%,#16101f 50%,#0b0910 100%);
  color:var(--text);font-family:'Zen Kaku Gothic New',sans-serif;overflow:hidden}
.stars{position:absolute;inset:0;pointer-events:none;
  background-image:
   radial-gradient(520px 520px at 12% 4%,rgba(255,46,154,.16),transparent 70%),
   radial-gradient(440px 440px at 92% 16%,rgba(255,232,61,.1),transparent 70%),
   radial-gradient(420px 420px at 72% 98%,rgba(255,46,154,.14),transparent 70%)}
.dots{position:absolute;inset:0;pointer-events:none;opacity:.22;
  background-image:radial-gradient(rgba(255,255,255,.6) 1.4px, transparent 1.6px);background-size:24px 24px}
.sprk{position:absolute;pointer-events:none;color:#FFE83D;text-shadow:0 0 9px rgba(255,232,61,.95);
  animation:twinkle 3.2s ease-in-out infinite}
.sprk.s1{top:8%;left:9%;font-size:16px;animation-delay:0s}
.sprk.s2{top:15%;right:12%;font-size:12px;animation-delay:.7s}
.sprk.s3{top:34%;left:16%;font-size:10px;animation-delay:1.4s}
.sprk.s4{top:26%;right:8%;font-size:18px;animation-delay:.3s}
.sprk.s5{top:48%;right:18%;font-size:11px;animation-delay:1.1s}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:.95;transform:scale(1.15)}}
.inner{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:30px 18px 48px;animation:fade .6s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.head{text-align:center;margin-bottom:26px}
.kicker{letter-spacing:.16em;font-size:12.5px;color:var(--tiff-d);margin-bottom:10px;font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif}
.presub{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:clamp(18px,5.6vw,23px);color:var(--tiff-d);letter-spacing:.08em;line-height:1.3;margin:0 0 14px}
.head h1{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:800;font-size:clamp(29px,9vw,42px);line-height:1.15;letter-spacing:.08em;
  background:linear-gradient(100deg,var(--tiff-d),var(--tiff) 60%,var(--tiff2));
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:0 0 22px rgba(255,46,154,.55)}
.tagline{margin-top:16px;font-size:10.5px;letter-spacing:.34em;color:var(--tiff-d);padding-left:.34em}
.lead{margin-top:16px;font-size:13.5px;line-height:2;color:var(--text)}
.lead em{font-style:normal;color:var(--tiff-d);font-weight:700;font-size:16px}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin-bottom:18px;
  box-shadow:0 12px 32px rgba(0,0,0,.16)}
.card h2{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-size:18px;font-weight:700;letter-spacing:.05em;
  display:flex;align-items:center;gap:10px;color:var(--text);padding-bottom:13px;border-bottom:1.5px dashed var(--line)}
.no{display:inline-grid;place-items:center;position:relative;width:32px;height:32px;border-radius:50%;
  background:linear-gradient(180deg,#241d36,var(--pale));border:1.5px solid var(--line);font-size:17px;line-height:1;
  box-shadow:0 3px 7px rgba(0,0,0,.10)}
.prog{margin-left:auto;font-size:12px;color:var(--tiff-d);letter-spacing:.1em}
.dates{display:flex;gap:10px;margin-top:18px}
.dates label{flex:1;display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#241d36,var(--pale));border:1.5px solid var(--line);border-radius:16px;padding:5px 12px;box-shadow:inset 0 2px 6px rgba(0,0,0,.06)}
.dates select{flex:1;background:transparent;border:0;color:var(--text);font-family:inherit;font-size:16px;padding:8px 2px;outline:none;appearance:none;cursor:pointer}
.dates select option{background:#1d1830;color:#F3EFFA}
.dates span{font-size:12px;color:var(--muted)}
.boundary{font-size:11.5px;color:var(--muted);margin-top:16px;line-height:1.7}
.boundary b{color:var(--tiff-d)}
.qnote{font-size:12px;color:var(--muted);line-height:1.7;margin:12px 0 6px}
.qlist{display:flex;flex-direction:column;gap:16px;margin-top:8px}
.q{position:relative;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:16px;padding:15px 15px 14px}
.q:first-child{margin-top:0;padding-top:2px}
.q:not(:first-child)::before{content:"";position:absolute;top:0;left:7%;right:7%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#B6FF3D 22%,#B6FF3D 78%,transparent);box-shadow:0 0 7px #B6FF3D,0 0 16px rgba(182,255,61,.5)}
.q:not(:first-child)::after{content:"✦";position:absolute;top:0;left:50%;transform:translate(-50%,-50%);width:18px;text-align:center;font-size:12px;line-height:1;color:#DAFF8C;text-shadow:0 0 6px #B6FF3D,0 0 13px rgba(182,255,61,.75)}
.qn{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-size:clamp(14px,3.9vw,15.5px);font-weight:700;line-height:1.55;color:var(--text);margin:0 0 12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.qnum{display:table;font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-size:11px;font-weight:700;color:var(--tiff-d);background:rgba(255,46,154,.14);letter-spacing:.08em;padding:2px 9px;border-radius:999px;margin:0 0 7px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;font-family:inherit;font-size:13.5px;line-height:1.5;color:var(--text);background:#1a1626;
  border:1px solid rgba(255,46,154,.18);border-radius:14px;padding:11px 14px;cursor:pointer;transition:.16s}
.opt:hover{border-color:var(--tiff)}
.opt.sel{background:linear-gradient(100deg,rgba(255,46,154,.16),rgba(255,232,61,.18));border-color:var(--tiff);color:var(--tiff-d);font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,46,154,.35)}
.cta{display:block;width:100%;font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-size:17px;letter-spacing:.18em;font-weight:800;color:#14111e;
  cursor:pointer;background:linear-gradient(180deg,var(--tiff2),var(--tiff));border:0;border-radius:999px;padding:18px;margin-top:6px;
  box-shadow:0 10px 26px rgba(255,46,154,.34),inset 0 2px 0 rgba(255,255,255,.4);transition:.18s}
.cta:hover{transform:translateY(-1px);box-shadow:0 14px 32px rgba(255,46,154,.45)}
.cta:disabled{background:#241f33;color:#6b6385;cursor:not-allowed;box-shadow:none;transform:none;letter-spacing:.1em}
.cta.ghost{background:transparent;color:var(--tiff-d);border:1px solid var(--tiff);box-shadow:none;font-size:15px}
.foot{text-align:center;font-size:11.5px;color:var(--text);margin-top:16px;line-height:1.85}
.pplink{color:var(--muted);text-decoration:underline}
.produce{display:block;font-size:9.5px;letter-spacing:.12em;color:var(--muted);opacity:.75;margin-top:5px}
.result{animation:fade .7s ease both}
.hero-emoji{display:grid;place-items:center;width:min(132px,36vw);height:min(132px,36vw);margin:0 auto 2px;
  background:radial-gradient(circle at 50% 52%,rgba(255,46,154,.2),rgba(255,232,61,.06) 45%,transparent 70%);
  animation:pop .6s cubic-bezier(.2,1.3,.4,1) both}

.hero-emoji .emo-img{width:100%;height:100%;max-width:100%;object-fit:contain;margin:0 auto;display:block}
.hero-kicker{font-size:11.5px;letter-spacing:.16em;color:var(--muted)}
.hero-nick{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:900;
  font-size:clamp(19px,6vw,31px);line-height:1.3;margin:2px 0 4px;letter-spacing:0;
  background:linear-gradient(100deg,var(--tiff-d),var(--tiff2));-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px rgba(255,46,154,.5))}
.hero-sub{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:700;
  font-size:clamp(13px,3.8vw,15px);color:var(--tiff-d);margin:1px 0 3px;text-shadow:0 0 10px rgba(255,46,154,.4)}
.hero-type{font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:12px}
.hero-x{margin:0 7px;color:var(--muted);font-weight:400}
.scorehero{text-align:center;margin:2px 0 26px;padding:20px 18px 22px;border-radius:24px;background:rgba(255,255,255,.04);border:1px solid rgba(255,46,154,.45);box-shadow:0 0 26px rgba(255,46,154,.25),0 14px 36px rgba(0,0,0,.55);animation:pop .6s cubic-bezier(.2,1.3,.4,1) both}
.score-label{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-size:14px;letter-spacing:.2em;color:var(--tiff-d);margin-bottom:2px}
.score-num{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:clamp(62px,20vw,92px);line-height:1;letter-spacing:.02em;
  background:linear-gradient(180deg,#FF2E9A,#FFE83D);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(255,232,61,.45);
  animation:boop .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes boop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.score-meter{width:160px;height:12px;margin:14px auto 0;border-radius:999px;background:var(--pale);border:1px solid var(--line);overflow:hidden}
.score-meter-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--tiff2),var(--tiff));box-shadow:0 0 8px rgba(255,46,154,.45);transition:width .8s ease}
.score-unit{font-size:clamp(26px,8vw,40px);margin-left:4px}
.score-comment{margin-top:9px;font-size:14px;font-weight:700;color:var(--text)}
.rhead{text-align:center;padding:14px 0 4px;margin-bottom:22px}
.emoji{display:inline-grid;place-items:center;width:min(172px,46vw);height:min(172px,46vw);border-radius:50%;font-size:86px;line-height:1;
  background:radial-gradient(circle at 50% 52%,rgba(255,46,154,.18),rgba(255,232,61,.06) 45%,transparent 70%);
  animation:pop .6s cubic-bezier(.2,1.3,.4,1) both, wobble 3.6s ease-in-out 1s infinite}
@keyframes wobble{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes pop{from{opacity:0;transform:scale(.5) rotate(-8deg)}to{opacity:1;transform:none}}
.futatsuna{margin-top:14px;font-size:13px;letter-spacing:.18em;color:var(--tiff-d)}
.rname{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:800;font-size:clamp(24px,7vw,32px);line-height:1.25;margin-top:6px;letter-spacing:.04em;
  background:linear-gradient(180deg,var(--tiff),var(--tiff-d) 85%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 18px rgba(255,46,154,.45)}
.badges{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:16px}
.badge{font-size:11.5px;letter-spacing:.08em;padding:5px 12px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.badge.b-sunao{border-color:rgba(255,232,61,.7);color:var(--gold);font-weight:700}
.badge.b-ten{border-color:rgba(61,245,255,.6);color:var(--cyan);font-weight:700}
.badge.gold{border-color:var(--tiff);color:#14111e;background:linear-gradient(180deg,var(--tiff2),var(--tiff));font-weight:700}
.blockhead{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;padding-bottom:11px;border-bottom:1.5px dashed var(--line)}
.blockhead h3{flex:1 1 auto;min-width:0;text-align:center}
@media (max-width:379px){.blockhead h3{font-size:16px;letter-spacing:0}.blockhead .tag{font-size:9.5px;padding:2px 7px}}
.blockhead .tag{flex:0 0 auto;align-self:center}
.cta.share{margin-bottom:10px}
.share-hint{text-align:center;font-size:12px;color:var(--muted);margin:2px 0 16px}
.card h3{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-size:16px;font-weight:700;letter-spacing:.05em;color:var(--text);line-height:1.45}
.card h3:before{content:"♡";color:var(--tiff);font-size:13px;margin-right:7px;vertical-align:1px}
.tag{margin-top:2px}
.tag{margin-left:auto;font-size:10.5px;letter-spacing:.1em;color:var(--tiff-d);border:1px solid var(--line);border-radius:14px;padding:3px 10px;white-space:nowrap}
.card.block p{font-size:14px;line-height:1.95;color:var(--text)}
.bar-row{margin:22px 0}
.bar-head{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin-bottom:9px}
.bar-head .on{color:var(--tiff-d);font-weight:700}
.bar-track{display:flex;gap:4px;height:16px}
.seg{background:linear-gradient(90deg,var(--tiff),var(--tiff2));border-radius:8px;transition:width .6s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.seg.dim{background:#2a2540;opacity:1}
.bar-note{font-size:11px;color:var(--muted);margin-top:9px;letter-spacing:.02em}
.bar-note b{color:var(--text)}
.bar-note .ink{color:var(--tiff-d)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tags-label{font-size:11.5px;font-weight:700;color:var(--tiff-d);letter-spacing:.06em;margin:20px 0 10px;padding-left:9px;border-left:3px solid var(--tiff);line-height:1.5}
.tags-label small{display:block;font-weight:400;color:var(--muted);font-size:10.5px;letter-spacing:.02em;margin-top:1px}
.chip{font-size:11px;color:var(--text);background:linear-gradient(180deg,#241d36,var(--pale));border:1px solid var(--line);border-radius:999px;padding:4px 11px;letter-spacing:.02em;line-height:1.5;box-shadow:0 2px 5px rgba(0,0,0,.07)}
.blist{margin-top:2px}
.bline{font-size:13.5px;line-height:1.9;margin-bottom:9px;padding-left:16px;position:relative;color:var(--text)}
.bline:last-child{margin-bottom:0}
.bline:before{content:"✦";position:absolute;left:0;top:3px;color:var(--tiff);font-size:10px}
.kuchi{margin-top:2px}
.kline{font-size:15px;line-height:1.7;margin-bottom:10px;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--text);font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:700}
.kline:last-child{margin-bottom:0}
.kline:before{content:"“";color:var(--tiff2);font-weight:800;margin-right:1px}
.kline:after{content:"”";color:var(--tiff2);font-weight:800;margin-left:1px}
.colorbox{display:flex;align-items:center;gap:14px;margin-top:2px}
.swatch{flex:0 0 auto;width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.25)}
.colorname{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:800;font-size:17px;color:var(--text);margin-bottom:3px}
.colorline{font-size:13px;line-height:1.8;color:var(--muted)}
.ura{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:700;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-top:2px}
.compat{display:flex;align-items:center;gap:14px;margin-top:2px}
.compat-emoji{flex:0 0 auto;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,rgba(255,46,154,.20),rgba(255,232,61,.06) 55%,transparent 75%)}
.compat-img{width:66px;height:66px;object-fit:contain;display:block}
.compat-name{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:800;font-size:18px;color:var(--tiff-d);margin-bottom:3px}
.compat-why{font-size:13px;line-height:1.85;color:var(--text)}
.compat-sub{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:2px 0 8px}
.compat+.compat-sub{margin-top:16px}

.bars-wrap{margin-top:18px}
.dvdr{display:flex;align-items:center;justify-content:center;gap:12px;margin:-2px 0 16px}
.dvdr:before,.dvdr:after{content:"";height:1.5px;width:42px;border-radius:2px}
.dvdr:before{background:linear-gradient(90deg,transparent,var(--tiff2))}
.dvdr:after{background:linear-gradient(90deg,var(--tiff2),transparent)}
.dvdr span{color:var(--tiff);font-size:13px;letter-spacing:.25em}
.closing{text-align:center;margin:32px 4px 6px;padding-top:28px;border-top:1px solid var(--line)}
.closing-lead{font-size:13.5px;line-height:2;color:var(--text);max-width:30em;margin:0 auto 14px}
.closing-main{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:800;font-size:23px;letter-spacing:.05em;
  background:linear-gradient(90deg,var(--tiff-d),var(--tiff) 60%,var(--tiff-d));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 18px rgba(255,46,154,.45)}
.gapcard{border-color:var(--tiff);box-shadow:0 0 0 1px rgba(255,46,154,.15),0 12px 30px rgba(255,46,154,.16)}
.gapcard h3{color:var(--tiff-d);margin-bottom:14px}
.gap-hero{display:inline-block;font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:800;font-size:19px;color:var(--tiff-d);letter-spacing:.03em;line-height:1.55;margin:2px 0 16px;background:linear-gradient(transparent 58%,rgba(255,46,154,.28) 58%);padding:0 6px}
.gap-intro{font-size:13px;line-height:1.95;color:var(--text);margin-bottom:18px}
.gap-intro b{color:var(--tiff-d);font-weight:700}
.gap-foot{font-size:13.5px;line-height:1.95;color:var(--text);margin-top:16px;padding-top:14px;border-top:1px dashed rgba(255,46,154,.3)}
.gap-foot b,.gap-foot em{font-weight:700;font-style:normal}
.gapline{font-size:14px;line-height:1.95;margin-bottom:12px;padding-left:16px;position:relative;color:var(--text)}
.gapline:last-child{margin-bottom:0}
.gapline:before{content:"✦";position:absolute;left:0;top:1px;color:var(--tiff);font-size:11px}
.emoji .emo{display:block;transform:translate(-1px,-4px)}
.emo-img{width:156px;height:156px;object-fit:contain;display:block;position:relative;z-index:1;filter:drop-shadow(0 3px 7px rgba(0,0,0,.55))}
.emoji::before{content:"";position:absolute;inset:-28px;border-radius:50%;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(255,46,154,.24),rgba(255,232,61,.08) 40%,transparent 68%)}
.emoji::after{content:"";position:absolute;inset:-16px;border-radius:50%;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% 6%,#fff 0 2.4px,rgba(255,255,255,.55) 4px,transparent 7px),radial-gradient(circle at 84% 18%,var(--tiff2) 0 2.6px,rgba(255,232,61,.55) 4.2px,transparent 7.2px),radial-gradient(circle at 95% 50%,#fff 0 2.2px,rgba(255,255,255,.55) 3.8px,transparent 6.8px),radial-gradient(circle at 84% 82%,var(--tiff) 0 2.6px,rgba(255,46,154,.55) 4.2px,transparent 7.2px),radial-gradient(circle at 50% 94%,#fff 0 2.4px,rgba(255,255,255,.55) 4px,transparent 7px),radial-gradient(circle at 16% 82%,#8fe6ff 0 2.6px,rgba(143,230,255,.55) 4.2px,transparent 7.2px),radial-gradient(circle at 5% 50%,#fff 0 2.2px,rgba(255,255,255,.55) 3.8px,transparent 6.8px),radial-gradient(circle at 16% 18%,var(--tiff2) 0 2.6px,rgba(255,232,61,.55) 4.2px,transparent 7.2px);animation:sparkle 2.8s ease-in-out infinite}
@keyframes sparkle{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes breathe{0%,100%{opacity:.68;transform:scale(.95)}50%{opacity:1;transform:scale(1.07)}}
@keyframes breathe2{0%,100%{opacity:.5}50%{opacity:.95}}
.gap-headline{font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px;letter-spacing:.02em}
.cmp{display:flex;flex-direction:column;gap:10px;margin-bottom:4px}
.cmp-row{border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:#191525}
.cmp-row.chg{border-color:var(--tiff);background:linear-gradient(180deg,#2a1b2e,#211526);box-shadow:inset 0 0 0 1px rgba(255,46,154,.18)}
.cmp-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cmp-label{font-size:12px;font-weight:700;color:var(--text);letter-spacing:.04em}
.cmp-tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.cmp-tag.on{color:#14111e;background:linear-gradient(180deg,var(--tiff2),var(--tiff));border-color:var(--tiff);font-weight:700}
.cmp-ba{display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.6}
.cmp-old{color:var(--muted)}
.cmp-arrow{color:var(--tiff);font-weight:700;font-size:12px}
.cmp-now{color:var(--text);font-weight:700}
.cmp-row.chg .cmp-now{color:var(--tiff-d)}

html,body{margin:0;padding:0;background:#0b0910;-webkit-text-size-adjust:100%}
.sitefoot{margin-top:22px;padding-top:16px;border-top:1px dashed var(--line);font-size:10.5px;line-height:1.95;color:var(--text);text-align:center}

/* キャッチコピー */
.copyline{margin:12px auto 0;font-size:13px;font-weight:700;line-height:2;color:var(--gold);text-shadow:0 0 12px rgba(255,232,61,.35)}

/* 16タイプ直接入力 */
.typein-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.tb{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:14px;letter-spacing:.04em;
  color:var(--text);background:#1a1626;border:1px solid var(--line);border-radius:12px;padding:10px 0;cursor:pointer;transition:border-color .15s}
.tb:hover{border-color:var(--tiff)}
.tb.sel{background:linear-gradient(100deg,rgba(255,46,154,.16),rgba(255,232,61,.18));border-color:var(--tiff);color:var(--tiff-d);box-shadow:inset 0 0 0 1px rgba(255,46,154,.35)}
.cta.mini{font-size:15px;padding:13px;margin-top:14px}

/* 変身レベル */
.catlvl{margin-top:7px;font-size:13px;font-weight:700;color:var(--muted)}
.catlvl .lvstars{font-size:16px;color:var(--gold);letter-spacing:.14em;text-shadow:0 0 10px rgba(255,232,61,.55);margin-left:4px}

/* ほぼ中間マーク */
.midtag{font-size:10px;font-weight:700;color:#14111e;background:linear-gradient(180deg,var(--tiff2),#ffd23f);border-radius:999px;padding:1px 8px;white-space:nowrap}
.bar-close-note{margin-top:10px;font-size:11.5px;line-height:1.8;color:var(--muted)}
.direct-note{margin-top:6px;font-size:12px;line-height:1.9;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}

/* ギャップ比較表 */
.cmpt-wrap{overflow-x:auto;margin-top:10px}
.cmpt{width:100%;border-collapse:collapse;font-size:11.5px;line-height:1.6;table-layout:fixed}
.cmpt th,.cmpt td{border:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top;word-break:break-word}
.cmpt th{background:rgba(255,255,255,.06);font-size:10.5px;font-weight:700;color:var(--muted)}
.cmpt th:nth-child(1),.cmpt td:nth-child(1){width:21%}
.cmpt th:nth-child(2),.cmpt td:nth-child(2),.cmpt th:nth-child(3),.cmpt td:nth-child(3){width:25%;text-align:center}
.cmpt th:nth-child(4),.cmpt td:nth-child(4){width:29%;text-align:center}
.cmpt td.axl{font-weight:700;color:var(--text)}
.cmpt td.old{color:var(--muted)}
.cmpt td.now{color:var(--text)}
.cmpt tr.chg td.now{color:var(--tiff-d);font-weight:700}
.cmpt td.vd{font-weight:700;color:var(--muted);text-align:center}
.cmpt tr.chg td.vd{color:#14111e;background:linear-gradient(180deg,var(--tiff2),#ffd23f)}

/* ── ネオン仕上げ ───────────────── */
.card{position:relative;background:linear-gradient(180deg,rgba(33,26,52,.88),rgba(21,18,31,.92));
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 0 0 1px rgba(255,46,154,.10),0 0 24px rgba(255,46,154,.10),0 14px 34px rgba(0,0,0,.42)}
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,46,154,.55),rgba(179,107,255,.35) 40%,rgba(61,245,255,.35) 70%,rgba(255,232,61,.5));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55}
.card h2{text-shadow:0 0 14px rgba(255,46,154,.45)}
.head h1{filter:drop-shadow(0 0 16px rgba(255,46,154,.45))}
.kicker{text-shadow:0 0 12px rgba(255,102,181,.7)}
.tagline{text-shadow:0 0 10px rgba(255,102,181,.6)}
.opt{background:linear-gradient(180deg,rgba(38,30,58,.9),rgba(26,22,38,.9));transition:.18s}
.opt:hover{border-color:var(--tiff);box-shadow:0 0 14px rgba(255,46,154,.35)}
.opt.sel{box-shadow:0 0 18px rgba(255,46,154,.5),inset 0 0 0 1px rgba(255,46,154,.45)}
.tb:hover{box-shadow:0 0 14px rgba(61,245,255,.45);border-color:var(--cyan)}
.tb.sel{box-shadow:0 0 18px rgba(255,46,154,.5),inset 0 0 0 1px rgba(255,46,154,.4)}
.cta{position:relative;box-shadow:0 0 22px rgba(255,46,154,.5),0 10px 26px rgba(255,46,154,.34),inset 0 2px 0 rgba(255,255,255,.45)}
.cta:not(:disabled){animation:neonPulse 2.6s ease-in-out infinite}
@keyframes neonPulse{0%,100%{box-shadow:0 0 20px rgba(255,46,154,.42),0 10px 26px rgba(255,46,154,.3),inset 0 2px 0 rgba(255,255,255,.45)}
  50%{box-shadow:0 0 34px rgba(255,46,154,.7),0 12px 30px rgba(255,46,154,.42),inset 0 2px 0 rgba(255,255,255,.5)}}
.scorehero{background:radial-gradient(120% 120% at 50% 0%,rgba(255,46,154,.16),rgba(179,107,255,.06) 45%,rgba(255,255,255,.03) 70%);
  border-color:rgba(255,46,154,.55);box-shadow:0 0 34px rgba(255,46,154,.34),0 0 70px rgba(179,107,255,.16),0 14px 36px rgba(0,0,0,.55)}
.score-num{filter:drop-shadow(0 0 18px rgba(255,232,61,.5))}
.score-meter{width:min(200px,62%);box-shadow:inset 0 0 8px rgba(0,0,0,.6)}
.score-meter-fill{box-shadow:0 0 14px rgba(255,46,154,.8)}
.emo-img{filter:drop-shadow(0 0 18px rgba(255,46,154,.45)) drop-shadow(0 0 34px rgba(61,245,255,.18))}
.rname{filter:drop-shadow(0 0 14px rgba(255,46,154,.5))}
.badge{box-shadow:0 0 10px rgba(255,46,154,.18)}
.badge.gold{box-shadow:0 0 16px rgba(255,232,61,.45)}
.chip{transition:.15s}
.chip:hover{box-shadow:0 0 10px rgba(61,245,255,.4)}
.dvdr span{text-shadow:0 0 12px rgba(255,102,181,.8)}
.tfcard{box-shadow:0 0 26px rgba(255,232,61,.22),0 0 60px rgba(179,107,255,.12),0 12px 30px rgba(0,0,0,.5)}
.tf-tentai{filter:drop-shadow(0 0 12px rgba(255,232,61,.7))}
.midtag{box-shadow:0 0 12px rgba(255,232,61,.5)}
.cmpt tr.chg td.vd{box-shadow:inset 0 0 12px rgba(255,180,0,.35)}
.sprk{filter:drop-shadow(0 0 6px rgba(255,232,61,.9))}

.qnote-ex{display:inline-block;font-size:11px;font-weight:700;color:var(--cyan);background:rgba(61,245,255,.09);
  border:1px solid rgba(61,245,255,.4);border-radius:999px;padding:1px 8px;white-space:nowrap}

/* 設問の「たとえば？」ふきだし */
.ex-btn{display:inline-block;margin:0 0 10px;font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;
  font-size:11.5px;font-weight:700;color:var(--cyan);background:rgba(61,245,255,.09);
  border:1px solid rgba(61,245,255,.45);border-radius:999px;padding:5px 13px;cursor:pointer;transition:.15s}
.ex-btn:hover{background:rgba(61,245,255,.18);box-shadow:0 0 14px rgba(61,245,255,.45)}
.ex-bal{position:relative;margin:0 0 12px;padding:11px 13px;border-radius:14px;font-size:12.5px;line-height:1.85;
  color:var(--text);background:linear-gradient(180deg,rgba(61,245,255,.13),rgba(61,245,255,.06));
  border:1px solid rgba(61,245,255,.45);box-shadow:0 0 16px rgba(61,245,255,.16);
  animation:bal .26s cubic-bezier(.2,1.3,.4,1) both}
.ex-bal::before{content:"";position:absolute;top:-7px;left:22px;width:12px;height:12px;
  background:rgba(61,245,255,.13);border-left:1px solid rgba(61,245,255,.45);border-top:1px solid rgba(61,245,255,.45);
  transform:rotate(45deg)}
@keyframes bal{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}

/* 天体の説明ポップアップ */
.help-btn{display:inline-block;margin-top:10px;font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;
  font-size:12.5px;font-weight:700;color:var(--gold);background:rgba(255,232,61,.10);
  border:1px solid rgba(255,232,61,.55);border-radius:999px;padding:7px 16px;cursor:pointer;
  box-shadow:0 0 12px rgba(255,232,61,.25);transition:.16s}
.help-btn:hover{background:rgba(255,232,61,.2);box-shadow:0 0 18px rgba(255,232,61,.5)}
.ovl{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(6,4,12,.82);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);padding:16px}
.ovl.on{display:flex;animation:fade .25s ease both}
.mdl{position:relative;width:100%;max-width:460px;max-height:86vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,rgba(36,28,58,.98),rgba(19,16,29,.99));
  border:1px solid rgba(255,232,61,.45);border-radius:22px;padding:22px 18px 18px;
  box-shadow:0 0 34px rgba(255,46,154,.3),0 0 70px rgba(179,107,255,.18),0 20px 50px rgba(0,0,0,.6);
  animation:pop .32s cubic-bezier(.2,1.3,.4,1) both}
.mdl h4{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-size:20px;font-weight:900;color:var(--gold);
  text-align:center;text-shadow:0 0 16px rgba(255,232,61,.5);margin-bottom:6px}
.mdl-lead{font-size:12.5px;line-height:1.95;color:var(--muted);text-align:center;margin-bottom:14px}
.mdl-axis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.mdl-axis div{border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-size:11.5px;line-height:1.7;color:var(--text)}
.mdl-axis b{display:block;font-size:12.5px;color:var(--tiff-d);margin-bottom:2px}
.tn{border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px;background:rgba(255,255,255,.03)}
.tn.me{border-color:rgba(255,46,154,.6);box-shadow:0 0 16px rgba(255,46,154,.25)}
.tn-h{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.tn-e{font-size:26px;line-height:1;filter:drop-shadow(0 0 5px rgba(255,255,255,.6)) drop-shadow(0 0 12px rgba(179,107,255,.7))}
.tn-n{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-size:16px;font-weight:900;color:var(--text)}
.tn-j{font-size:10.5px;font-weight:700;color:#14111e;background:linear-gradient(180deg,var(--tiff2),#ffd23f);border-radius:999px;padding:2px 8px}
.tn-mine{font-size:10.5px;font-weight:700;color:#14111e;background:linear-gradient(180deg,var(--tiff-d),var(--tiff));border-radius:999px;padding:2px 8px}
.tn-t{font-size:12.5px;line-height:1.9;color:var(--text)}
.tn-t em{font-style:normal;color:var(--tiff-d);font-weight:700}
.mdl-note{font-size:11px;line-height:1.85;color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.stp{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px;background:rgba(255,255,255,.03);font-size:12.5px;line-height:1.9;color:var(--text)}
.stp-n{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:14px;color:#14111e;background:linear-gradient(180deg,var(--tiff2),var(--tiff));box-shadow:0 0 12px rgba(255,46,154,.45)}
.stp b{display:block;font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-size:14px;color:var(--tiff-d);margin-bottom:2px}
.stp em,.mdl-fin b{font-style:normal;color:var(--gold);font-weight:700}
.src{margin-top:12px;padding:13px 14px;border:1px solid rgba(61,245,255,.4);border-radius:14px;background:rgba(61,245,255,.05);
  font-size:12.5px;line-height:1.9;color:var(--text);box-shadow:0 0 16px rgba(61,245,255,.12)}
.src-h{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-size:14px;font-weight:900;color:var(--cyan);
  margin-bottom:6px;text-shadow:0 0 12px rgba(61,245,255,.5)}
.src p+p{margin-top:8px}
.src em{font-style:normal;color:var(--gold);font-weight:700}
.src-l{list-style:none;margin:9px 0;padding:0;display:grid;gap:5px}
.src-l li{font-size:11.5px;line-height:1.6;color:var(--muted);padding:6px 9px;border-radius:9px;background:rgba(255,255,255,.04)}
.src-l b{display:inline-block;min-width:6.6em;color:var(--text);font-size:11.5px}
.mdl-fin{font-size:12.5px;line-height:1.95;color:var(--text);margin-top:12px;padding:12px 13px;border-radius:14px;
  background:radial-gradient(120% 120% at 50% 0%,rgba(255,46,154,.12),rgba(255,255,255,.03));border:1px solid rgba(255,46,154,.35)}
.mdl-x{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,255,255,.06);color:var(--text);font-size:19px;line-height:1;cursor:pointer}
.mdl-x:hover{border-color:var(--tiff);color:var(--tiff-d)}
.mdl-close{display:block;width:100%;margin-top:14px;font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;
  font-size:15px;font-weight:800;letter-spacing:.12em;color:#14111e;cursor:pointer;
  background:linear-gradient(180deg,var(--tiff2),var(--tiff));border:0;border-radius:999px;padding:14px;
  box-shadow:0 0 18px rgba(255,46,154,.45)}

/* セクション別アクセント色（ピンク一色を避けてメリハリ） */
:root{--green:#57E39A;--blue:#6AA8FF}
.ac-cyan h3:before{color:var(--cyan)}
.ac-cyan .blockhead h3{color:var(--cyan);text-shadow:0 0 12px rgba(61,245,255,.4)}
.ac-cyan .tag{color:var(--cyan);border-color:rgba(61,245,255,.5)}
.ac-cyan::before{background:linear-gradient(135deg,rgba(61,245,255,.5),rgba(61,245,255,.15))!important}
.ac-purple h3:before{color:var(--purple)}
.ac-purple .blockhead h3{color:#CBA0FF;text-shadow:0 0 12px rgba(179,107,255,.4)}
.ac-purple .tag{color:#CBA0FF;border-color:rgba(179,107,255,.5)}
.ac-purple::before{background:linear-gradient(135deg,rgba(179,107,255,.5),rgba(179,107,255,.15))!important}
.ac-green h3:before{color:var(--green)}
.ac-green .blockhead h3{color:var(--green);text-shadow:0 0 12px rgba(87,227,154,.4)}
.ac-green .tag{color:var(--green);border-color:rgba(87,227,154,.5)}
.ac-green::before{background:linear-gradient(135deg,rgba(87,227,154,.5),rgba(87,227,154,.15))!important}
.ac-blue h3:before{color:var(--blue)}
.ac-blue .blockhead h3{color:var(--blue);text-shadow:0 0 12px rgba(106,168,255,.4)}
.ac-blue .tag{color:var(--blue);border-color:rgba(106,168,255,.5)}
.ac-blue::before{background:linear-gradient(135deg,rgba(106,168,255,.5),rgba(106,168,255,.15))!important}
.ac-gold h3:before{color:var(--gold)}
.ac-gold .blockhead h3{color:var(--gold);text-shadow:0 0 12px rgba(255,232,61,.4)}
.ac-gold .tag{color:var(--gold);border-color:rgba(255,232,61,.55)}
.ac-gold::before{background:linear-gradient(135deg,rgba(255,232,61,.5),rgba(255,232,61,.15))!important}

/* 主要文の強調 */
.c-gap{color:var(--gold);font-weight:900;text-shadow:0 0 10px rgba(255,232,61,.5)}
.qnote .c-gap,.fnote .c-gap{color:var(--gold)}
.key{display:block;font-size:13px;line-height:1.95;font-weight:700}
/* サブタイトル「16タイプ＋」：ぷくっとしたキャンディ文字 */
.subplus{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:900;
  font-size:clamp(20px,5.8vw,26px);letter-spacing:.1em;color:#fff;margin:4px 0 8px;
  text-shadow:2.5px 0 0 var(--tiff),-2.5px 0 0 var(--tiff),0 2.5px 0 var(--tiff),0 -2.5px 0 var(--tiff),
    1.8px 1.8px 0 var(--tiff),-1.8px 1.8px 0 var(--tiff),1.8px -1.8px 0 var(--tiff),-1.8px -1.8px 0 var(--tiff),
    0 5px 0 #A11663,0 8px 18px rgba(255,46,154,.55)}
.subplus-p{color:var(--gold);
  text-shadow:2.5px 0 0 #B8860B,-2.5px 0 0 #B8860B,0 2.5px 0 #B8860B,0 -2.5px 0 #B8860B,
    1.8px 1.8px 0 #B8860B,-1.8px 1.8px 0 #B8860B,1.8px -1.8px 0 #B8860B,-1.8px -1.8px 0 #B8860B,
    0 5px 0 #7A5A07,0 8px 18px rgba(255,232,61,.55)}

/* タイプの呼び名・特徴を出すボタンと情報ボックス
   （黄色一色にならないよう、ボタンはピンク・箱は中間色・行はいまの顔=ピンク／素の顔=金） */
.nick-btn{margin-top:8px;border-color:rgba(255,46,154,.5);color:var(--tiff-d)}
.nickinfo{margin:8px auto 4px;max-width:340px;border:1px solid var(--line);border-radius:12px;
  padding:10px 13px;background:rgba(255,255,255,.04);text-align:left;animation:fade .25s ease both}
.ni-n.ni-ima{color:var(--tiff-d);text-shadow:0 0 10px rgba(255,46,154,.35)}
.ni-n.ni-sunao{color:var(--gold);text-shadow:0 0 10px rgba(255,232,61,.35)}
.ni-row+.ni-row{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.ni-l{font-size:10.5px;font-weight:700;margin-right:7px}
.ni-t{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:14.5px;color:var(--text);margin-right:7px}
.ni-n{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:13px;color:var(--gold);text-shadow:0 0 10px rgba(255,232,61,.4)}
.ni-tr{display:block;font-size:11.5px;line-height:1.75;color:var(--muted);margin-top:3px}

/* タイプコード横の二つ名表示 */
.type-nick{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-size:12.5px;font-weight:800;
  margin:0 0 10px;letter-spacing:.02em}
.fc small{display:block;font-size:9px;font-weight:700;color:inherit;opacity:.8;letter-spacing:0;line-height:1.3;margin-top:1px}
.tfc-nick{display:block;font-size:12px;font-weight:800;margin-top:3px;color:var(--cyan);opacity:.9;text-shadow:0 0 8px rgba(61,245,255,.3)}

/* ① 取扱説明書 */
.tline{font-size:13px;line-height:1.9;margin-bottom:9px;padding-left:16px;position:relative;color:var(--text);word-break:normal;text-wrap:wrap}
.tline:before{content:"♡";position:absolute;left:0;top:2px;color:var(--cyan);font-size:11px}
.tline-gap{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);color:var(--gold)}
.tline-gap:before{content:"✦";color:var(--gold)}
/* トリセツの名前入力（任意） */
.tori-namebox{margin:10px 0 2px;text-align:center}
.tori-name{width:min(240px,80%);padding:10px 14px;border-radius:999px;border:1px solid rgba(255,46,154,.45);
  background:rgba(255,255,255,.05);color:var(--text);font-size:14px;text-align:center;outline:none;
  font-family:'Zen Kaku Gothic New',sans-serif}
.tori-name:focus{border-color:var(--tiff);box-shadow:0 0 12px rgba(255,46,154,.35)}
.tori-name::placeholder{color:var(--muted);opacity:.7}
.tori-namenote{font-size:10.5px;line-height:1.7;color:var(--muted);margin-top:5px}
/* トリセツの「友だちに送ってね」誘導 */
.tori-cta{font-size:13px;line-height:1.9;text-align:center;color:var(--text);
  margin:14px 0 4px;padding:11px 13px;border-radius:12px;
  border:1px dashed rgba(255,46,154,.45);background:rgba(255,46,154,.06);word-break:normal;text-wrap:wrap}
.tori-cta b{color:var(--tiff-d)}
/* ② 言っちゃダメな一言 */
.ng{border:1px solid var(--line);border-left:3px solid #FF5A7A;border-radius:12px;
  padding:10px 13px;margin:9px 0;background:rgba(255,90,122,.06)}
.ng-w{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:14px;color:#FF8FA5}
.ng-y{font-size:12px;line-height:1.85;color:var(--text);margin-top:3px;word-break:normal;text-wrap:wrap}
/* ③ なつき度メーター */
.natsuki{margin-top:4px;font-size:10.5px;letter-spacing:.06em;color:var(--muted)}
.natsuki .nk-h{color:var(--tiff-d);margin-left:5px;letter-spacing:2.5px;text-shadow:0 0 8px rgba(255,46,154,.4)}
.natsuki .nk-tip{display:block;font-size:9.5px;letter-spacing:.05em;color:var(--muted);opacity:.8;margin-top:1px}

/* トップの960とおりバッジ */
.badge960{display:inline-block;margin:2px auto 6px;padding:6px 15px;border-radius:999px;
  border:1px solid rgba(255,232,61,.5);font-size:12px;letter-spacing:.05em;color:var(--text);
  background:rgba(255,232,61,.07);box-shadow:0 0 16px rgba(255,232,61,.18)}
.badge960 b{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:900;
  font-size:14.5px;color:var(--gold);text-shadow:0 0 12px rgba(255,232,61,.55)}
/* 説明内の960とおり強調 */
.big960{font-size:1.2em;font-weight:900;color:var(--gold);text-shadow:0 0 12px rgba(255,232,61,.6)}
/* 相棒の特別メッセージ（1.66告知）：金色で目立たせる */
.chara-say.say-166{border-color:rgba(255,232,61,.65);color:var(--gold);font-weight:800;
  background:linear-gradient(180deg,rgba(255,232,61,.16),rgba(255,46,154,.1));
  box-shadow:0 0 20px rgba(255,232,61,.45)}
.chara-say.say-166::before{background:rgba(255,232,61,.16);
  border-left:1px solid rgba(255,232,61,.65);border-top:1px solid rgba(255,232,61,.65)}
.say-166 .say-tag{color:var(--tiff-d)}

/* タイプをタップしたときだけ出る呼び名と特徴 */
.tbinfo{margin-top:10px;border:1px solid rgba(255,46,154,.45);border-radius:12px;padding:11px 13px;
  background:rgba(255,46,154,.07);animation:fade .25s ease both}
.tbi-t{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:15px;color:var(--tiff-d);margin-right:8px}
.tbi-n{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:14px;color:var(--gold);text-shadow:0 0 10px rgba(255,232,61,.4)}
.tbi-tr{display:block;font-size:12.5px;line-height:1.8;color:var(--text);margin-top:4px}
.tbi-note{display:block;font-size:10.5px;line-height:1.7;color:var(--muted);margin-top:5px}

/* 「本当の自分を生きてない気がする」処方箋カード */
.rx-lead{font-size:13px;line-height:1.95;color:var(--text);margin-bottom:12px;word-break:normal;text-wrap:wrap}
.rx-h{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:13.5px;
  color:var(--gold);margin-bottom:7px;text-shadow:0 0 10px rgba(255,232,61,.35)}
.rxs{display:grid;gap:7px}
.rxline{position:relative;font-size:12.5px;line-height:1.85;color:var(--text);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 32px;background:rgba(255,255,255,.03);
  word-break:normal;text-wrap:wrap}
.rxline:before{content:"♡";position:absolute;left:12px;top:10px;color:var(--tiff-d);font-size:12px}
.rx-fin{font-size:13px;line-height:1.95;color:var(--text);margin-top:12px;padding-top:11px;
  border-top:1px dashed var(--line);word-break:normal;text-wrap:wrap}

/* 素の顔の特性・適職 */
.tok{margin-top:14px}
.tok-h{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:13.5px;
  color:var(--gold);margin-bottom:5px;text-shadow:0 0 10px rgba(255,232,61,.35)}
.tok-t{font-size:12.5px;line-height:1.95;color:var(--text);word-break:normal;text-wrap:wrap}
.jtags{margin:4px 0 8px}
.jchip{border-color:rgba(255,232,61,.45);color:var(--gold)}
.jchip-p{border-color:rgba(255,46,154,.5);color:var(--tiff-d)}
.tok-h.tok-ima{color:var(--tiff-d);text-shadow:0 0 10px rgba(255,46,154,.4)}
.tok-note{font-size:11px;line-height:1.8;color:var(--muted);margin-top:6px}

/* 「で、この差はなにに使えるの？」カード */
.gu-card{border-color:rgba(255,232,61,.5);box-shadow:0 0 0 1px rgba(255,232,61,.12),0 12px 30px rgba(255,232,61,.1)}
.gu-card .blockhead h3{color:var(--gold)}
.gu-lead{font-size:13.5px;line-height:1.95;color:var(--text);margin-bottom:12px;word-break:normal;text-wrap:wrap}
.gu{border:1px solid var(--line);border-left:3px solid var(--tiff);border-radius:12px;padding:11px 13px;margin:10px 0;background:rgba(255,255,255,.03)}
.gu-h{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:13.5px;color:var(--tiff-d);margin-bottom:4px}
.gu-t{font-size:12.5px;line-height:1.9;color:var(--text);word-break:normal;text-wrap:wrap}
.gu-keep{font-size:13px;line-height:1.95;color:var(--text);margin-top:12px;word-break:normal;text-wrap:wrap}
.gu-fin{font-size:13px;line-height:1.95;color:var(--text);margin-top:10px;word-break:normal;text-wrap:wrap}
.gu-166{font-size:12.5px;line-height:1.95;color:var(--text);margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);word-break:normal;text-wrap:wrap}

/* 3つの顔：色で見分ける */
.c-yoso{color:#C79BFF}
.c-cyan{color:var(--cyan)}
.neoncyan{color:var(--cyan);text-shadow:0 0 10px rgba(61,245,255,.5)}
.c-sunao{color:var(--gold)}
.c-ima{color:var(--tiff-d)}
.faces{border-color:rgba(255,255,255,.22)}
.frow{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:8px;
  padding:10px 11px;border-radius:12px;border:1px solid var(--line);margin-bottom:7px;font-size:12px}
.frow .fl{font-weight:700;font-size:11.5px;white-space:nowrap}
.frow .fc{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:15px;letter-spacing:.03em}
.frow .fd{color:var(--muted);font-size:11px;line-height:1.5}
.frow.yoso{border-color:rgba(179,107,255,.45);background:rgba(179,107,255,.07)}
.frow.yoso .fl,.frow.yoso .fc{color:#C79BFF}
.frow.sunao{border-color:rgba(255,232,61,.45);background:rgba(255,232,61,.06)}
.frow.sunao .fl,.frow.sunao .fc{color:var(--gold)}
.frow.ima{border-color:rgba(255,46,154,.6);background:rgba(255,46,154,.1);box-shadow:0 0 14px rgba(255,46,154,.25)}
.frow.ima .fl,.frow.ima .fc{color:var(--tiff-d)}
.fmain{font-size:10px;font-weight:900;color:#14111e;background:linear-gradient(180deg,var(--tiff-d),var(--tiff));
  border-radius:999px;padding:2px 8px;white-space:nowrap}
.fnote{margin-top:9px;font-size:11.5px;line-height:1.85;color:var(--muted)}
@media (max-width:359px){.frow{grid-template-columns:auto auto 1fr;gap:6px}.frow .fmain{grid-column:1/-1;justify-self:end}}

/* ① 結果発表の「ため」演出 */
.reveal{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:78vh;text-align:center;animation:fade .4s ease both}
.rv-ring{display:grid;place-items:center;width:min(190px,52vw);height:min(190px,52vw);border-radius:50%;
  background:radial-gradient(circle at 50% 52%,rgba(255,46,154,.28),rgba(179,107,255,.1) 48%,transparent 72%);
  box-shadow:0 0 40px rgba(255,46,154,.35),inset 0 0 30px rgba(255,232,61,.12);
  animation:rvPulse 1.5s ease-in-out infinite}
@keyframes rvPulse{0%,100%{transform:scale(.96);opacity:.85}50%{transform:scale(1.04);opacity:1}}
.rv-img{width:74%;height:74%;object-fit:contain;filter:drop-shadow(0 0 16px rgba(255,46,154,.5)) blur(5px) brightness(.55);
  animation:rvFocus 1.9s ease-out forwards}
@keyframes rvFocus{0%{filter:blur(11px) brightness(.4);opacity:.5}70%{filter:blur(3px) brightness(.8);opacity:.85}100%{filter:blur(0) brightness(1);opacity:1}}
.rv-t{margin-top:22px;font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:800;
  font-size:clamp(16px,4.6vw,20px);color:var(--tiff-d);text-shadow:0 0 14px rgba(255,46,154,.5)}
.rv-dots{display:flex;gap:8px;margin-top:14px}
.rv-dots span{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px rgba(255,232,61,.8);animation:rvDot 1.1s ease-in-out infinite}
.rv-dots span:nth-child(2){animation-delay:.16s}.rv-dots span:nth-child(3){animation-delay:.32s}
@keyframes rvDot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-6px)}}

/* ③-2 この診断ってなに？（読みたい人だけ開く） */
.about-wrap{margin:0 0 18px;text-align:center}
.about-box{text-align:left;margin-top:10px;border:1px solid rgba(255,232,61,.42);border-radius:16px;
  padding:16px 15px 14px;background:rgba(255,255,255,.03);box-shadow:0 0 20px rgba(255,232,61,.1);
  animation:fade .3s ease both}
.about-box h5{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-size:14.5px;font-weight:900;
  color:var(--gold);line-height:1.6;margin:14px 0 5px;text-shadow:0 0 12px rgba(255,232,61,.35)}
.about-box h5:first-child{margin-top:0}
.about-box h5 br{display:none}
@media (max-width:374px){.about-box h5 br{display:block}}
.about-box p{font-size:12.5px;line-height:1.95;color:var(--text)}
.about-box em{font-style:normal;color:var(--gold);font-weight:700}
.about-box .mdl-close{margin-top:14px}

/* ④ キャラのひとこと */
.chara-say{display:inline-block;position:relative;margin:6px auto 0;padding:9px 14px;border-radius:14px;
  font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:13px;color:var(--text);
  background:linear-gradient(180deg,rgba(255,46,154,.16),rgba(255,255,255,.05));border:1px solid rgba(255,46,154,.5);
  box-shadow:0 0 16px rgba(255,46,154,.3);animation:bal .3s cubic-bezier(.2,1.3,.4,1) both}
.chara-say::before{content:"";position:absolute;top:-6px;left:50%;margin-left:-6px;width:11px;height:11px;
  background:rgba(255,46,154,.16);border-left:1px solid rgba(255,46,154,.5);border-top:1px solid rgba(255,46,154,.5);transform:rotate(45deg)}
.hero-emoji{cursor:pointer}
.hero-emoji.bounce{animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}
/* ④-2 タップしてね ヒント（初回タップで消える） */
.hero-emoji.hint .emo-img{animation:emoPika 1.5s ease-in-out infinite}
@keyframes emoPika{0%,100%{filter:drop-shadow(0 0 5px rgba(255,232,61,.3))}50%{filter:drop-shadow(0 0 20px rgba(255,232,61,.95))}}
.tap-hint{display:inline-block;margin:4px auto 0;padding:6px 15px;border-radius:999px;cursor:pointer;
  font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-size:12.5px;font-weight:800;letter-spacing:.08em;
  color:#14111e;background:linear-gradient(180deg,var(--gold),#ffd23f);
  animation:hintPika 1.5s ease-in-out infinite}
@keyframes hintPika{0%,100%{box-shadow:0 0 8px rgba(255,232,61,.35);transform:scale(1)}
  50%{box-shadow:0 0 24px rgba(255,232,61,.95);transform:scale(1.07)}}
/* タップ後は光る帯をやめて、控えめな一行だけにする */
.tap-hint.soft{font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 6px;
  color:var(--muted);background:none;box-shadow:none;animation:none}
/* 吹き出しの中の「なんの言葉か」ラベル */
.say-tag{display:block;font-size:9.5px;font-weight:700;letter-spacing:.08em;
  color:var(--muted);margin-bottom:3px}
/* ④-3 近日リリースのお知らせポップ */
.ad-soon{display:block;width:fit-content;margin:0 auto 8px;padding:5px 16px;border-radius:999px;
  font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-size:12px;font-weight:800;letter-spacing:.18em;
  color:#14111e;background:linear-gradient(180deg,var(--gold),#ffd23f);
  animation:hintPika 1.8s ease-in-out infinite}
.ad-item{border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:12px;background:rgba(255,255,255,.03)}
.ad-item .ad-img{display:block;width:100%;height:auto;border-radius:12px}
.ad-crop{overflow:hidden;border-radius:12px;aspect-ratio:1200/540}
.ad-crop .ad-img{height:100%;object-fit:cover;object-position:top;border-radius:0}
.ad-name{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-size:15px;font-weight:900;
  color:var(--gold);text-align:center;margin:10px 0 3px;text-shadow:0 0 12px rgba(255,232,61,.45)}
.ad-copy{font-size:12.5px;line-height:1.9;color:var(--text);text-align:center}
.ad-copy b{color:var(--tiff-d)}
.ad-free{display:inline-block;margin-left:6px;padding:1px 9px;border-radius:999px;font-size:11px;font-weight:800;
  color:#14111e;background:linear-gradient(180deg,var(--tiff2),#ffd23f);vertical-align:1px}
.ad-note{font-size:11.5px;line-height:1.9;color:var(--muted);text-align:center;margin-top:12px}
.ad-cal{margin-top:10px;border:1px solid rgba(255,255,255,.18)}
.ad-cap{font-size:11px;line-height:1.75;color:var(--muted);text-align:center;margin-top:7px}
.ad-name .ad-free{margin-left:2px}

/* ⑤ あるあるチェック */
.arus{display:grid;gap:7px;margin-top:6px}
.aru{display:flex;align-items:flex-start;gap:9px;text-align:left;font-family:inherit;font-size:13px;line-height:1.6;
  color:var(--text);background:linear-gradient(180deg,rgba(38,30,58,.85),rgba(26,22,38,.85));
  border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;transition:.15s}
.aru:hover{border-color:var(--tiff)}
.aru.on{background:linear-gradient(100deg,rgba(255,46,154,.16),rgba(255,232,61,.14));border-color:var(--tiff);
  color:var(--tiff-d);font-weight:700;box-shadow:0 0 14px rgba(255,46,154,.3)}
.arubox{flex:none;font-size:15px;line-height:1.4;color:var(--gold)}
.aru-judge{margin-top:12px;padding:14px 14px;border-radius:16px;animation:pop .4s cubic-bezier(.2,1.3,.4,1) both}
.aru-judge.j-hi{border:1px solid rgba(255,46,154,.55);background:radial-gradient(120% 120% at 50% 0%,rgba(255,46,154,.14),rgba(255,255,255,.03));box-shadow:0 0 18px rgba(255,46,154,.28)}
.aru-judge.j-mid{border:1px solid rgba(255,232,61,.5);background:radial-gradient(120% 120% at 50% 0%,rgba(255,232,61,.1),rgba(255,255,255,.03))}
.aru-judge.j-rare{border:1px solid rgba(179,107,255,.6);background:radial-gradient(120% 120% at 50% 0%,rgba(179,107,255,.16),rgba(255,255,255,.03));box-shadow:0 0 20px rgba(179,107,255,.3)}
.aj-t{font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:clamp(16px,4.6vw,19px);
  text-align:center;color:var(--gold);text-shadow:0 0 12px rgba(255,232,61,.4)}
.j-rare .aj-t{color:#CBA0FF;text-shadow:0 0 12px rgba(179,107,255,.5)}
.aj-s{margin-top:6px;font-size:12.5px;line-height:1.9;color:var(--text);text-align:center}

.aruscore{margin-top:12px;text-align:center;font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;
  font-size:14px;font-weight:700;color:var(--text)}
.aruscore b{font-size:20px;color:var(--gold);text-shadow:0 0 12px rgba(255,232,61,.6)}

/* デバイス別の最適化 */
@media (max-width:359px){
  .inner{padding:22px 12px 40px}
  .card{padding:16px 13px;border-radius:14px}
  .q{padding:13px 12px 12px}
  .typein-grid{gap:6px}
  .tb{font-size:13px;padding:9px 0}
}
@media (min-width:768px){
  .inner{max-width:600px;padding:44px 24px 64px}
  .card{padding:24px 22px}
  .typein-grid{gap:9px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* LINE登録ボタン */
.line-btn{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:12px;
  font-family:'Zen Maru Gothic','Zen Kaku Gothic New',sans-serif;font-size:15px;font-weight:800;letter-spacing:.06em;
  color:#fff;text-decoration:none;background:linear-gradient(180deg,#08CF63,#06B252);
  border-radius:999px;padding:15px;box-shadow:0 0 20px rgba(8,207,99,.45),inset 0 2px 0 rgba(255,255,255,.25);
  transition:.16s;animation:neonPulseG 2.6s ease-in-out infinite}
.line-btn:hover{transform:translateY(-1px)}
@keyframes neonPulseG{0%,100%{box-shadow:0 0 16px rgba(8,207,99,.4),inset 0 2px 0 rgba(255,255,255,.25)}
  50%{box-shadow:0 0 30px rgba(8,207,99,.65),inset 0 2px 0 rgba(255,255,255,.3)}}
.line-ic{font-size:10.5px;font-weight:900;background:rgba(255,255,255,.22);border-radius:6px;padding:2px 6px;letter-spacing:.04em}
.line-note{margin-top:8px;font-size:11px;color:var(--muted);text-align:center}

/* キャラの1.66予告 */
.chara-teaser{margin:8px 0 10px;font-size:11.5px;line-height:1.9;color:var(--muted)}
.chara-teaser b{color:var(--tiff-d)}

/* 天体タイプカード */
.tfcard{text-align:center;padding:20px 16px 18px;border-color:rgba(255,232,61,.5);box-shadow:0 0 22px rgba(255,232,61,.14),0 12px 30px rgba(0,0,0,.5)}

/* 生まれ持った4軸を生年月日から導出（生まれた日ごとに全60通り） */
function innateOf(s, b, g) {
  const ei = s % 2 === 0 ? "E" : "I";
  const sn = (s >= 4) ? "S" : "N";   // 土・金・水=現実 ／ 木・火=直感（水は現実側）
  const tf = [0,1,4,8,9,11].indexOf(b) >= 0 ? "T" : "F";
  const jp = GROUP[g].jp;
  return { ei, sn, tf, jp };
}

/* 生まれ持った傾向の「濃さ」(50〜100)。同じタイプでも生まれた日で濃淡が変わる。
   ギャップ度を細かい数値で出すために使う。 */
const STR_EI = [95,78,92,74,80,70,86,76,90,72];          // 日干ごと
const STR_SN = [80,72,86,78,88,82,90,84,84,76];          // 日干ごと
const STR_TF = [85,72,82,86,70,80,92,76,88,90,74,78];    // 日支ごと
const STR_JP = { "長生":70,"沐浴":75,"冠帯":80,"建禄":88,"帝旺":92,"衰":72,
                 "病":68,"死":74,"墓":82,"絶":78,"胎":66,"養":70 };
function strengthOf(s, b, unsei) {
  return { EI: STR_EI[s], SN: STR_SN[s], TF: STR_TF[b], JP: STR_JP[unsei] };
}

function natalOf(y, m, d) {
  const days = Math.floor(Date.UTC(y, m - 1, d) / 86400000);
  const num = (((days + 17) % 60) + 60) % 60 + 1;
  const s = (num - 1) % 10, b = (num - 1) % 12;
  const unsei = unseiOf(s, b);
  const cr = CREATURE[unsei];
  const inn = innateOf(s, b, cr.g);
  const kanshi = STEMS[s] + BRANCHES[b];
  return { num, s, b, unsei, cr, name: kanshi, kanshi, inn,
           str: strengthOf(s, b, unsei),
           innType: inn.ei + inn.sn + inn.tf + inn.jp };
}

function compute(y, m, d, answers, directType, tb) {
  const NT = natalOf(y, m, d);
  const num = NT.num, unsei = NT.unsei, cr = NT.cr, name = NT.name;
  const g = cr.g, inn = NT.inn, innateJP = inn.jp;

  let D, bars = null, type;
  if (directType) {
    // 16Pなどで出たタイプをそのまま「いまの顔」として使う
    D = { EI:{letter:directType[0], close:false}, SN:{letter:directType[1], close:false},
          TF:{letter:directType[2], close:false}, JP:{letter:directType[3], close:false} };
    type = directType;
  } else {
    // タグ採点（位置非依存）
    const sc = { EI:[0,0], SN:[0,0], TF:[0,0], JP:[0,0] };
    answers.forEach((ai, i) => {
      if (ai == null) return;
      const q = Q[i], A = AXES[q.ax], v = SCALE[ai].v;
      if (q.p === A.p1) { sc[q.ax][0] += v; sc[q.ax][1] += (4 - v); }
      else { sc[q.ax][1] += v; sc[q.ax][0] += (4 - v); }
    });
    // 追加2択（ほぼ中間の軸のみ）：選んだ極に+3点
    if (tb) tb.forEach((t) => {
      const A = AXES[t.ax];
      if (t.p === A.p1) sc[t.ax][0] += 3; else sc[t.ax][1] += 3;
    });
    const tieFor = { EI: inn.ei, SN: inn.sn, TF: inn.tf, JP: inn.jp };
    const decide = (ax) => {
      const [a, bb] = sc[ax], A = AXES[ax], tot = a + bb || 1;
      const diff = a - bb;
      const letter = diff > 0 ? A.p1 : diff < 0 ? A.p2 : tieFor[ax];
      return { letter, pct1: Math.round(a / tot * 100), close: Math.abs(diff) <= 4 };
    };
    D = { EI:decide("EI"), SN:decide("SN"), TF:decide("TF"), JP:decide("JP") };
    type = D.EI.letter + D.SN.letter + D.TF.letter + D.JP.letter;

    bars = ["EI","SN","TF","JP"].map((k) => {
      const A = AXES[k], dd = D[k], win = dd.letter;
      return { l1:A.L.l, w1:A.L.w, l2:A.R.l, w2:A.R.w, pct1:dd.pct1, win, p1:A.p1,
               close:dd.close, innate: k === "JP" ? innateJP : null };
    });
  }

  const isE = D.EI.letter==="E", isN = D.SN.letter==="N", isF = D.TF.letter==="F";
  const mJP = D.JP.letter;

  // 生まれつきの4軸 と 今(診断)の4軸 を直接くらべる
  const WORD = {
    E:'<b class="c-sunao">人といて充電</b>するタイプ', I:'<b class="c-sunao">ひとりで充電</b>するタイプ',
    S:'<b class="c-sunao">現実・事実</b>で考えるタイプ', N:'<b class="c-sunao">ひらめき・直感</b>で考えるタイプ',
    T:'<b class="c-sunao">スジ・ロジック</b>で決めるタイプ', F:'<b class="c-sunao">気持ち・共感</b>で決めるタイプ',
    J:'<b class="c-sunao">計画を立てて進む</b>タイプ', P:'<b class="c-sunao">流れに乗って動く</b>タイプ',
  };
  const AXLABEL = { EI:"充電", SN:"見方", TF:"決め方", JP:"動き方" };
  const WORD_S = {
    E:"外向き", I:"内向き",
    S:"現実派", N:"直感派",
    T:"論理派", F:"共感派",
    J:"計画派", P:"自由派",
  };
  const cmp = ["EI","SN","TF","JP"].map((k)=>{
    const oldP = inn[k.toLowerCase()], nowP = D[k].letter;
    return { label:AXLABEL[k], oldW:WORD_S[oldP], nowW:WORD_S[nowP], changed: oldP!==nowP };
  });
  const changedN = cmp.filter(c=>c.changed).length;

  // 「この差はなにに使える？」──変わった軸ごとの意味と処方箋
  const gapUse = ["EI","SN","TF","JP"].map((k)=>{
    const o = inn[k.toLowerCase()], nw = D[k].letter;
    return o !== nw ? GAP_USE[o + nw] : null;
  }).filter(Boolean);
  const keptAxes = cmp.filter(c=>!c.changed).map(c=>c.label);
  const rx = [RX[inn.ei], RX[inn.sn], RX[inn.tf], RX[inn.jp]];
  const guLead = changedN === 0
    ? '4つの軸すべてが生まれつきのまま——じつはこれ、<b class="c-sunao">いちばん贅沢な結果</b>です。素の顔といまの顔が一致している人は<b class="c-ima">判断がブレず、消耗しにくい</b>。迷ったときは、自分の直感に従ってOKという“お墨つき”です。'
    : changedN >= 3
    ? 'ほぼ別人級の変身は、それだけ<b class="c-ima">環境に適応してきた証拠</b>。ただし装備が重いぶん、気づかない疲れがたまりやすい。下の軸ごとの「疲れの正体と処方箋」で、上手に脱いで休んでください。'
    : 'あなたは素の顔の上に、環境で身につけた<b class="c-ima">装備</b>を重ねて生きています。変わった軸は、がんばって獲得した力であると同時に、<b class="c-sunao">疲れの出やすいポイント</b>。理由と処方箋がこちら。';

  /* ギャップ度：変わった軸1つにつき約25%。
     「どれくらい大きく変わったか」で 20〜25% の幅がつく。
     変わらなかった軸は0点なので、全部そのままなら必ず0%になる。 */
  const dist = ["EI","SN","TF","JP"].map((k) => {
    const A = AXES[k], innP = inn[k.toLowerCase()];
    if (D[k].letter === innP) return 0;                          // 変わっていない軸は0
    const sN = Math.max(0, Math.min(1, (NT.str[k] - 60) / 35));  // 生まれ持った濃さ 0〜1
    let mix;
    if (bars) {                                                  // 24問モード：どれだけ振り切ったか
      const p1 = D[k].pct1;
      const nowPos = (innP === A.p1) ? p1 : 100 - p1;
      mix = Math.max(0, Math.min(1, (50 - nowPos) / 50));
    } else {                                                     // タイプ入力モード：濃さから
      mix = sN;
    }
    return 20 + 5 * mix;
  });
  const gapPct = Math.round(dist.reduce((a,b)=>a+b,0));
  const starN = gapPct >= 80 ? 4 : gapPct >= 60 ? 3 : gapPct >= 40 ? 2 : gapPct >= 20 ? 1 : 0;
  const gapStars = "★★★★".slice(0, starN) + "☆☆☆☆".slice(0, 4 - starN);
  const catLabel = starN === 0 ? "変身ゼロ。生まれたまんまで生きてる人"
    : starN === 1 ? "ちょっとだけ変身中"
    : starN === 2 ? "ほどよく変身中"
    : starN === 3 ? "かなり変身中"
    : "ほぼ別人レベルの大変身";
  const gapComment = changedN === 0 ? "ほぼそのまま！生まれつきの自分を生きている"
    : changedN === 1 ? "ちょっとギャップあり。1か所が後から変化"
    : changedN === 2 ? "ほどよくギャップあり。2か所が変化"
    : changedN === 3 ? "ギャップ大きめ。3か所が変化"
    : "ほぼ正反対！？4か所すべて変化";
  const gapHeadline = changedN === 0
    ? '4つの軸ぜんぶ、<b class="c-sunao">生まれた頃のまま</b>。ほとんどブレていません。'
    : '4つの軸のうち <b class="c-ima">' + changedN + 'つ</b> が、生まれた頃から<b class="c-ima">変わりました</b>。';
  const closeLead = changedN >= 3
    ? 'ギャップが大きいぶん、知らないうちに、どこかで自分に無理してきたのかも。それも、いろんな環境で<b class="c-ima">がんばってきた証拠</b>です。だからこそ、たまには<b class="c-sunao">“本来のあなた”に戻る時間</b>も大切に。'
    : changedN >= 1
    ? '生まれつきの自分と、今の自分が、<b class="c-ima">いいバランスでミックス</b>されています。無理しすぎず、ときどき<b class="c-sunao">心の声</b>も聞いてあげてくださいね。'
    : '生まれつきのあなたのまま、<b class="c-sunao">まっすぐ生きられている証拠</b>。その調子で、これからも自分らしく。';

  const use = mJP === "J"
    ? '今のあなたは、<b class="c-ima">計画を立てて進めるほど力が出る</b>タイプ。<b class="c-sunao">「どこを目指すか」を先に決める</b>と、迷わず動けます。逆に、ゴールがあいまいなまま走らされると疲れやすいので注意。'
    : '今のあなたは、<b class="c-ima">流れに合わせて動くほど力が出る</b>タイプ。きっちり予定で縛るより、<b class="c-sunao">余白を残しておく</b>とのびのびできます。臨機応変さが、あなたの武器です。';

  const bornLines = [WORD[inn.ei], WORD[inn.sn], WORD[inn.tf], WORD[inn.jp]];

  const nowLines = [
    isE ? '人と関わる中でこそ元気が出る、<b class="neoncyan">外向型</b>に育った' : '一人の時間でじっくり充電する、<b class="neoncyan">内向型</b>に育った',
    isN ? '目の前より「この先」を読む、<b class="neoncyan">直感タイプ</b>' : '事実と現実を一つずつ積み上げる、<b class="neoncyan">現実タイプ</b>',
    isF ? '最後は<b class="neoncyan">人の気持ち</b>を大切にして決める、情の人' : '感情に流されず、<b class="neoncyan">筋とロジック</b>で判断するタイプ',

function wireInput(){
  var sy=document.getElementById('sy'),sm=document.getElementById('sm'),sd=document.getElementById('sd');
  function refreshDays(){var mx=dmax(state.y,state.m);if(state.d>mx)state.d=mx;if(sd){sd.innerHTML=rng(mx,1).map(function(v){return optTag(v,state.d);}).join('');sd.value=state.d;}}
  if(sy)sy.onchange=function(){state.y=+sy.value;refreshDays();saveBday();};
  if(sm)sm.onchange=function(){state.m=+sm.value;refreshDays();saveBday();};
  if(sd)sd.onchange=function(){state.d=+sd.value;saveBday();};
  var exb=mount.querySelectorAll('.ex-btn');
  for(var e=0;e<exb.length;e++){(function(b){b.onclick=function(){
    var bal=document.getElementById('ex'+b.dataset.x), open=!bal.hasAttribute('hidden');
    if(open){ bal.setAttribute('hidden',''); b.setAttribute('aria-expanded','false'); b.textContent='💭 たとえば？'; }
    else{ bal.removeAttribute('hidden'); b.setAttribute('aria-expanded','true'); b.textContent='💭 とじる'; }
  };})(exb[e]);}
  var opts=mount.querySelectorAll('.opt');
  for(var k=0;k<opts.length;k++){(function(b){b.onclick=function(){
    var i=+b.dataset.i, oi=+b.dataset.oi;
    state.answers[i]=oi;
    var bs=document.getElementById('q'+i).querySelectorAll('.opt');
    for(var j=0;j<bs.length;j++){ bs[j].classList.toggle('sel', (+bs[j].dataset.oi)===oi); }
    refreshProgress();
    var nx=document.getElementById(i<Q.length-1?('q'+(i+1)):'runBtn');
    if(nx)nx.scrollIntoView({behavior:'smooth',block:'center'});
  };})(opts[k]);}
  var run=document.getElementById('runBtn');
  if(run)run.onclick=function(){ if(run.disabled)return;
    var close=closeAxesOf(state.answers);
    if(close.length){ renderTiebreak(close); }
    else{ revealThen(compute(state.y,state.m,state.d,state.answers)); }
  };
  var tbs=mount.querySelectorAll('.tb');
  for(var t=0;t<tbs.length;t++){(function(b){b.onclick=function(){
    state.directType=(state.directType===b.dataset.t)?null:b.dataset.t;
    for(var j=0;j<tbs.length;j++){ tbs[j].classList.toggle('sel', tbs[j].dataset.t===state.directType); }
    var tr=document.getElementById('typeRunBtn');
    if(tr){ tr.disabled=!state.directType; tr.textContent=state.directType?'✦ '+state.directType+' と素の顔をくらべる ✦':'↑ タイプを選んでください'; }
    var ti=document.getElementById('tbInfo');
    if(ti){
      if(state.directType && TYPE_INFO[state.directType]){
        var inf=TYPE_INFO[state.directType];
        ti.innerHTML='<b class="tbi-t">'+state.directType+'</b><span class="tbi-n">“'+inf.n+'”タイプ</span>'+
          '<span class="tbi-tr">'+inf.tr.join('・')+'</span>';
        ti.style.display='block';
      } else ti.style.display='none';
    }
  };})(tbs[t]);}
  var trun=document.getElementById('typeRunBtn');
  if(trun)trun.onclick=function(){ if(!trun.disabled&&state.directType) revealThen(compute(state.y,state.m,state.d,null,state.directType)); };
  var atg=document.getElementById('aboutTgl'), abx=document.getElementById('aboutBox');
  if(atg&&abx){
    atg.onclick=function(){ abx.style.display = abx.style.display==='none' ? 'block' : 'none'; };
    var acl=document.getElementById('aboutClose');
    if(acl)acl.onclick=function(){ abx.style.display='none'; atg.scrollIntoView({behavior:'smooth',block:'center'}); };
  }
}
function closeAxesOf(answers){
  var sc={EI:[0,0],SN:[0,0],TF:[0,0],JP:[0,0]};
  answers.forEach(function(ai,i){ if(ai==null)return;
    var q=Q[i],A=AXES[q.ax],v=SCALE[ai].v;
    if(q.p===A.p1){sc[q.ax][0]+=v;sc[q.ax][1]+=4-v;}else{sc[q.ax][1]+=v;sc[q.ax][0]+=4-v;}
  });
  return ["EI","SN","TF","JP"].filter(function(k){return Math.abs(sc[k][0]-sc[k][1])<=4;});
}

    (function(){ var no=0; return close.map(function(k){
      return '<section class="card"><h2><span class="no">⚖️</span>'+AXL[k]+'</h2>'+TB[k].map(function(t,qi){

    5:'とっておきのセリフが解放された…！'
  };
  var nkKey='kg_nk_'+R.num;
  function nkLoad(){
    try{
      var o=JSON.parse(localStorage.getItem(nkKey)||'null');
      if(o) return {t:+o.t||0, days:+o.days||0, last:o.last||'', today:+o.today||0};
      // 旧形式（タップ数のみ）からの引きつぎ
      var old=+localStorage.getItem('kg_taps_'+R.num)||0;
      return {t:Math.min(old,30), days:old>0?1:0, last:'', today:0};
    }catch(e){ return {t:0,days:0,last:'',today:0}; }
  }
  function nkSave(){ try{ localStorage.setItem(nkKey, JSON.stringify(NKS)); }catch(e){} }
  var NKS=nkLoad();
  function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  function nkTap(){
    var td=todayStr();
    if(NKS.last!==td){ NKS.last=td; NKS.today=0; NKS.days++; }
    if(NKS.today<30){ NKS.today++; NKS.t++; }   // 1日30タップまでしか育たない
    nkSave();
  }
  function lvOf(nk){
    if(nk.t>=360&&nk.days>=14) return 5;
    if(nk.t>=180&&nk.days>=7) return 4;
    if(nk.t>=90&&nk.days>=3) return 3;
    if(nk.t>=30) return 2;
    return 1;
  }
  var unlocked4=false, unlocked5=false;
  function unlockFor(lv){
    if(lv>=4&&!unlocked4){ unlocked4=true; NK_BONUS4.forEach(function(t){all.push(t);}); }
    if(lv>=5&&!unlocked5){ unlocked5=true; NK_BONUS5.forEach(function(t){all.push(t);}); }
  }
  unlockFor(lvOf(NKS));
  var nkBar=document.getElementById('natsukiBar');
  function drawNk(){
    if(!nkBar) return;
    var lv=lvOf(NKS);
    nkBar.innerHTML='なつき度 Lv.'+lv+'「'+NK_NAME[lv-1]+'」<span class="nk-h">'+
      '♥♥♥♥♥'.slice(0,lv)+'♡♡♡♡♡'.slice(0,5-lv)+'</span>'+
      (lv<3?'<span class="nk-tip">まいにち会いに来ると、なついていくよ</span>':'');
  }
  drawNk();
  function nextIdx(){
    if(!deck.length){
      deck=all.map(function(_,i){return i;});
      for(var i=deck.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=deck[i];deck[i]=deck[j];deck[j]=t;}
      if(deck.length>1 && deck[0]===last) deck.push(deck.shift());
    }
    last=deck.shift();
    return last;
  }
  function speak(){
    var old=mount.querySelector('.chara-say'); if(old) old.parentNode.removeChild(old);
    var say=document.createElement('div');
    var n=taps+1;
    var prevLv=lvOf(NKS); nkTap(); var lv=lvOf(NKS);
    if(lv>prevLv) unlockFor(lv);
    if((n===3||n===7||n===12) && R.charaTeaser){
      // 3・7・12回目は相棒の特別メッセージ（目立つ配色）
      say.className='chara-say say-166';
      say.innerHTML='<span class="say-tag">♡ 相棒からひとこと</span>'+R.charaTeaser;
    }else if(lv>prevLv){
      // なつき度レベルアップのお知らせ
      say.className='chara-say say-166';
      say.innerHTML='<span class="say-tag">♡ なつき度UP</span>なつき度が Lv.'+lv+'「'+NK_NAME[lv-1]+'」になったよ！'+
        (NK_LVMSG[lv]?'<br>'+NK_LVMSG[lv]:'');
    }else{
      var idx=nextIdx();
      if(!heard[idx]){ heard[idx]=1; heardN++; }
      var tag = idx < nK ? '💬 '+R.type+'さんの口ぐせ' : '♡ 相棒からひとこと';
      say.className='chara-say';
      say.innerHTML='<span class="say-tag">'+tag+'</span>'+all[idx];
    }
    img.parentNode.insertBefore(say, img.nextSibling);
    img.classList.remove('bounce'); void img.offsetWidth; img.classList.add('bounce');
    taps++;
    drawNk();
    if(hint){
      hint.classList.add('soft');
      hint.textContent = heardN >= all.length ? 'ぜんぶ聞いたよ♡' : '▶ タップで、つぎのひとこと';
    }
    if(taps===4) openAdPop(1);
    else if(taps===8) openAdPop(1);
    else if(taps===13) openAdPop(2);
  }
  img.onclick=speak;
  if(hint) hint.onclick=speak;
}
function wirePartner(R){
  var py=document.getElementById('py'),pm=document.getElementById('pm'),pd=document.getElementById('pd');
  function refreshP(){var mx=dmax(state.py,state.pm);if(state.pd>mx)state.pd=mx;if(pd){pd.innerHTML=rng(mx,1).map(function(v){return optTag(v,state.pd);}).join('');pd.value=state.pd;}}
  if(py)py.onchange=function(){state.py=+py.value;refreshP();};
  if(pm)pm.onchange=function(){state.pm=+pm.value;refreshP();};
  if(pd)pd.onchange=function(){state.pd=+pd.value;};
  var pb=document.getElementById('pRunBtn');
  if(pb)pb.onclick=function(){
    var P=natalOf(state.py,state.pm,state.pd);
    var pc=pairComment(R.kanshi,P.kanshi,R.inn,P.inn);
    var box=document.getElementById('pres');
    if(box)box.innerHTML='<div class="pbox"><div class="phead">'+
      '<img class="pimg" src="'+mimg(P.num)+'" onerror="this.style.display=\'none\'">'+
      '<div><div class="pname">'+P.innType+'-'+P.cr.g+'</div><div class="pkanshi">あの人の素の顔 '+P.innType+'（'+NICK[P.innType]+'）・'+P.cr.g+TENTAI[P.cr.g].e+'</div></div></div>'+
      '<p class="pcore">この子の名前と物語は、<b class="c-ima">1.66 奇跡の相性診断</b>で。〔近日公開〕</p>'+
      '<div class="ptitle">あなた（'+R.innType+'-'+R.tentai+'）との“素の顔”相性：'+pc.t+'</div>'+
      '<p class="pwhy">'+pc.w+'</p>'+
      '<p class="pnote">※ “素の顔”どうし（生まれつき同士）の相性です。いまの顔との相性はまた別のお楽しみ。</p></div>';
  };
}
window.addEventListener('DOMContentLoaded',function(){mount=document.getElementById('screen');renderInput(false);});
