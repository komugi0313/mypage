: ["[[本:人を動かして大きな結果を出したい人なのに]]、[[今:今は自分の手でできる範囲で満足している]]。", "[[今:口を出さないと決めているのに]]、[[本:作業が非効率な人を見ると無言で道具を取り上げてしまう]]。"]}, "ENTJ>ISFP": {"karai": "[[今:争いごとには興味ないと言うけど]]、[[本:負けず嫌いは一ミリも治っていない]]。", "name": "野心をお休み中の自由人", "atari": ["[[今:ゆるく趣味を楽しむつもりが]]、[[本:気づけばその趣味の集まりで仕切り役になっている]]。", "[[今:人と比べないと決めてSNSを見る時間を減らしたのに]]、[[本:友だちの昇進の話だけは妙に耳に残る]]。"]}, "ENTJ>ESTP": {"karai": "[[今:行き当たりばったりに見えて]]、[[本:本人の中では全部「想定内」ということになっている]]。", "name": "計画より先に動く将軍", "atari": ["[[本:長期戦略を立ててから攻めたい人なのに]]、[[今:今は現場で決めたほうが勝てると知ってしまった]]。", "[[今:その場のノリで始めた遊びでも]]、[[本:気づけばルールを作って勝ち負けを決めている]]。"]}, "ENTJ>ESFP": {"karai": "[[今:ノリで生きているふりをしているけど]]、[[本:目立つポジションは毎回ちゃんと取りにいく]]。", "name": "盛り上げ上手な野心家", "atari": ["[[今:パーティーで誰より楽しそうにしながら]]、[[本:終わる頃には次の企画の主催者に決まっている]]。", "[[今:仕事相手を「一緒にいて楽しいか」で選ぶようになったけど]]、[[本:選んだ人はだいたい仕事もできる]]。"]}}, "PS": {"INTJ": {"catch": "話す前に結論出てるタイプ。静かに先を読み、道筋を描く人です。", "overview": "あなたは、まわりが話し合いを始めるころには、もう頭の中で答えの形が見えている人です。物事を「この先どうなるか」という長い目で眺め、ムダの少ない道筋を組み立てるのが得意です。動かされるのは、納得できる理由と、自分で考えて決められる自由。人に言われたからではなく、筋が通っていると感じたときに一番力が出ます。口数は多くないので、まわりからは「クールで近寄りにくい」と見られることもあります。けれど、困ったときに頼ると、驚くほど的確な答えを返してくれる人。その静かな頼もしさに、信頼を寄せている人は少なくありません。", "strengths": ["先を読んで準備できる｜目の前のことだけでなく、半年後や一年後まで想像して動けます。トラブルが起きる前に手を打てるので、計画が安定します。", "ひとりで深く考え抜く力｜答えが出るまで粘り強く考え続けられます。人の意見に流されず、自分の頭で確かめてから決めるので判断がぶれにくいです。", "ムダを見つけて整える｜「この手順、なくてもいいのでは」と気づくのが早い人です。仕組みを見直して、みんなの手間を減らすことができます。", "ひとりでも進める芯の強さ｜まわりの賛成がそろわなくても、正しいと思ったことは静かにやり抜きます。その姿勢が、結果的に人を引っぱることもあります。"], "pitfalls": ["説明を省いてしまう｜頭の中では答えがつながっているため、途中の考えを話さずに結論だけ伝えがちです。理由をひとこと添えるだけで、ぐっと伝わりやすくなります。", "人の非効率にいらだつ｜ムダが見えすぎるぶん、気持ちで動く人を遠回りに感じることがあります。相手には相手の大事な順番がある、と思えると心が軽くなります。", "ひとりで抱えこむ｜自分でやったほうが早いと感じ、頼むのを後回しにしがちです。小さな作業から人に任せてみると、負担が分かれて余裕が生まれます。"], "relationships": "友だちは多くなくてかまわない、と考えるタイプです。そのかわり、一度信頼した相手とは長く深い付き合いになります。グループのLINEではあまり発言しなくても、個別に相談されると真剣に考えて答えます。職場や部活では、話し合いが行き詰まったときに核心をつく一言を出す役回り。相性がいいのは、ひとりの時間を尊重してくれて、遠回しにせず率直に話せる人です。", "love": "好きになるまでに時間がかかりますが、一度「この人だ」と思うと、とても誠実に向き合います。派手な言葉より、相手の悩みを一緒に考えたり、将来の話を真剣にしたりすることで気持ちを表します。大事にするのは、お互いの考えを尊重できる関係。すれ違いやすいのは、気持ちを言葉にするのが少ない点です。「うれしい」「ありがとう」を声に出すだけで、相手の安心感は大きく変わります。", "work": "目標がはっきりしていて、進め方をある程度まかせてもらえる環境で力が出ます。調べて、考えて、計画を形にする役割で評価されやすく、「あの人に聞けば筋道が見える」と頼られる存在になりがちです。一方で、理由の分からないルールが多い職場や、決まらない会議が続く環境では疲れやすくなります。集中できる時間を確保するだけで、成果がぐっと上がるタイプです。", "jobs": ["経営企画・事業戦略", "システム設計・エンジニア", "研究職", "データアナリスト", "建築・都市計画"], "growth": "考えた結論を伝えるとき、「なぜそう思ったか」を一文だけ添えてみてください。それだけで、まわりの納得度が大きく変わります。また、一日のどこかで、誰かの話を最後までさえぎらずに聞く時間をつくるのもおすすめです。自分にない見方に出会うことで、あなたの計画はさらに強くなります。", "A": "自己主張型のときは、自分の判断に迷いが少なく、決めたら一直線に進みます。反対意見にもあまり動じず、落ち着いて計画を前に進められます。人前でも堂々と考えを伝えられるのが強みです。", "T": "慎重型のときは、計画の穴がないか何度も見直す、念入りさが光ります。「もっと良くできるはず」という思いが向上心につながり、細かな部分まで質を高められます。不安を感じたら、一度紙に書き出すと楽になります。"}, "INTP": {"catch": "気づけば検索沼タイプ。「なんでだろう」を楽しめる人です。", "overview": "あなたは、ふとした疑問を見つけると、気づけば何時間も調べ続けてしまう人です。「なぜそうなるのか」「本当にそうなのか」と仕組みを知りたくなる気持ちが、いちばんの原動力。答えを覚えるより、自分で納得できるまで考えることに喜びを感じます。ひとりで考える時間があると元気になり、頭の中ではいつもいくつものアイデアが同時に動いています。まわりからは「マイペースで不思議な人」と見られがちですが、話してみると知識の幅が広く、意外な角度から面白い答えを出してくれる人。その自由な発想が、行き詰まった場の空気を変えることもあります。", "strengths": ["仕組みを見抜く力｜複雑な話でも、要になる部分を見つけて整理できます。「つまりこういうことだよね」と、ものごとの骨組みを示すのが得意です。", "思いこみにとらわれない｜「みんながそう言うから」で決めず、本当に正しいかを自分で確かめます。そのおかげで、見落とされていた問題に気づけます。", "好きなことへの深い集中｜興味のあるテーマには驚くほど没頭できます。調べたことがつながり、気づけば誰よりも詳しくなっていることも多いです。", "落ち着いた公平さ｜意見がぶつかったときも、感情に流されず、それぞれの言い分を冷静に比べられます。立場に関係なく、筋の通った考えを大切にします。"], "pitfalls": ["考えすぎて動けない｜可能性をいくつも思いつくため、「もっといい方法があるかも」と決めきれなくなります。仮の締切を自分で決めると、一歩目が出やすくなります。", "気持ちの話が苦手｜理屈で考えるのが自然なので、相手が共感してほしいだけのときに解決策を出してしまいがちです。まず「大変だったね」と受け止めると伝わります。", "興味が移りやすい｜新しい疑問に心がひかれ、途中のものがたまりやすくなります。やりかけのものを一つだけ書き出しておくと、終わらせる流れがつくれます。"], "relationships": "大人数でにぎやかに過ごすより、少人数で好きな話を深く語り合うほうが楽しいタイプです。友だちには、ちょっとした疑問を投げかけて話を広げる存在。職場や学校では、困ったときに「調べてみたよ」と頼りになる知識を出してくれる人として信頼されます。相性がいいのは、急に考えこんでも気にせず、あなたの話に「それ面白いね」と乗ってくれる人です。", "love": "好きな人のことも「もっと知りたい」と思うところから恋が始まります。相手の考え方や好きなものに興味をもち、話しこむうちに距離が縮まるタイプです。大事にするのは、お互いが自由でいられる関係。すれ違いやすいのは、連絡がつい後回しになったり、気持ちを言葉にしなかったりする点です。短くても「今日こんなことがあったよ」と送るだけで、相手は安心できます。", "work": "自分のペースで考えられ、新しいことを試せる環境で力が出ます。原因を調べる、仕組みを組み立てる、新しいやり方を考えるといった役割で評価されやすいです。一方で、決まった手順をくり返すだけの作業や、意味の見えない報告が多い環境では疲れやすくなります。「なぜこれをやるのか」が分かると、驚くほど集中できるタイプです。", "jobs": ["プログラマー", "研究者", "データサイエンティスト", "ゲームプランナー", "技術ライター"], "growth": "考えていることを、完成する前に誰かに話してみてください。半分できた段階で見せると、思わぬヒントがもらえます。また、調べものを始める前に「30分だけ」とタイマーをかけるのもおすすめです。深く潜る楽しさはそのままに、やるべきことにも戻ってこられるようになります。", "A": "自己主張型のときは、自分の考えに自信をもち、思いついたアイデアを気軽に口に出せます。失敗をあまり引きずらず、試しながら考えを深めていけます。新しいことにも身軽に挑戦できるのが強みです。", "T": "慎重型のときは、自分の考えに抜けがないか、何度も確かめる丁寧さが光ります。そのぶん、出てくる答えは精度が高く、信頼されやすいです。迷ったときは、完璧より「今わかる範囲」で出してみると楽になります。"}, "ENTJ": {"catch": "じゃあ私が決めるタイプ。迷う場を前に進める、頼れる人です。", "overview": "あなたは、みんなが迷って話が止まったとき、「じゃあこうしよう」と道を示せる人です。目標を見つけると、そこまでの段取りを一気に組み立て、人と力を集めて形にしていきます。動かされるのは、成長や成果が目に見えること。昨日より今日、少しでも前に進んでいる手ごたえがあると、どんどん力がわいてきます。まわりからは「しっかり者」「頼れるリーダー」と見られることが多く、自然とまとめ役を任されがちです。ときに厳しく見えることもありますが、それは本気で良い結果を出したいという気持ちの表れ。背中を見て「この人についていけば大丈夫」と感じる人も多いはずです。", "strengths": ["決めて場を動かす力｜選択肢が多くて迷う場面でも、判断の基準を示して決めることができます。止まっていた話が、あなたの一言で一気に動き出します。", "段取りを組む上手さ｜大きな目標を、今日やること・来週やることへと分けるのが得意です。誰が何をすればいいかが明確になり、チームが動きやすくなります。", "高い目標を楽しめる｜難しい課題ほど燃えるタイプです。「どうせ無理」と思われていたことも、工夫を重ねて実現に近づけていけます。", "はっきり伝える率直さ｜あいまいにせず、必要なことをまっすぐ言葉にできます。何を期待されているかが分かりやすく、まわりも安心して動けます。"], "pitfalls": ["ペースを人に求めすぎる｜自分のスピードが基準になり、まわりも同じように動けると思いがちです。相手の状況を一度聞いてから頼むと、協力が得やすくなります。", "結果を急いで休めない｜前に進むことが好きなぶん、休むことに罪悪感を覚えがちです。休みも計画の一部として予定に入れると、長く走り続けられます。", "言葉が強く届いてしまう｜はっきり言うつもりが、相手には厳しく聞こえることがあります。指摘の前に、良かった点をひとつ伝えると受け止めてもらいやすいです。"], "relationships": "友だちの間では、旅行の計画や集まりの段取りを自然と引き受ける存在です。「行き先どうする？」で止まったLINEも、あなたが候補を出すとすぐに決まります。職場や部活では、目標に向かってみんなをまとめる役。相性がいいのは、意見をはっきり返してくれる人や、あなたの勢いを面白がってくれる人です。ときどき相手の話をじっくり聞く時間をもつと、信頼がさらに深まります。", "love": "好きな人には、まっすぐ気持ちを伝えるタイプです。デートの計画を立てたり、相手の目標を応援したりと、行動で愛情を示します。大事にするのは、お互いが成長し合える関係。すれ違いやすいのは、相手の悩みにすぐ解決策を出してしまう点です。ときには答えを出さずに「そうなんだ」と聞くだけにすると、相手は心から安心できます。弱さを見せてもらえることも、大切な信頼の証です。", "work": "目標がはっきりしていて、裁量をもって動ける環境で大きな力を発揮します。プロジェクトをまとめる、チームを率いる、新しい仕組みをつくるといった役割で評価されやすいです。一方で、決定に時間がかかる組織や、成果が見えにくい仕事が続くと疲れやすくなります。結果を出すほど任される範囲が広がり、さらに力を発揮できるタイプです。", "jobs": ["経営者・起業家", "プロジェクトマネージャー", "コンサルタント", "営業マネージャー", "弁護士"], "growth": "会議や話し合いの最後に、「ほかに意見ある？」と一言たずねる習慣をつけてみてください。静かな人の意見が、思わぬ突破口になることがあります。また、週に一度は予定を入れない時間をつくるのもおすすめです。立ち止まる時間が、次の大きな一歩を生みます。", "A": "自己主張型のときは、決断が早く、プレッシャーのかかる場面でも堂々と人を引っぱれます。失敗しても切り替えが早く、すぐに次の手を考えられます。自信に満ちた姿が、まわりを勇気づけます。", "T": "慎重型のときは、高い目標を掲げつつ、細かいリスクにもよく気づく堅実さが光ります。「もっと良くできる」という思いが、チームの質を引き上げます。完璧を求めすぎたら、できたことを数えてみると楽になります。"}, "ENTP": {"catch": "逆にさ、が口ぐせタイプ。当たり前をひっくり返す発想の人です。", "overview": "あなたは、みんなが「そういうものだ」と思っていることに、「逆にさ、こうしたらどう？」と別の角度を持ちこめる人です。新しいアイデアを考えたり、人と意見を交わしたりするのが大好きで、話しながらどんどん発想が広がっていきます。動かされるのは、「面白そう」というワクワク感。まだ誰もやっていないことや、正解の決まっていない問題ほど燃えるタイプです。まわりからは「頭の回転が速い」「話していて飽きない人」と見られることが多いでしょう。ときに議論好きに見えても、それは相手を言い負かしたいからではなく、一緒にもっと良い答えを見つけたいから。場を明るく動かす存在です。", "strengths": ["発想の切り替えが速い｜一つの問題に対して、いくつもの見方や解決策を思いつけます。行き詰まった場面でも、新しい道を見つけ出すのが得意です。", "話して考えを広げる力｜人との会話の中で、アイデアがどんどん育っていきます。雑談から生まれた思いつきが、大きな企画につながることもあります。", "変化を楽しめる柔軟さ｜予定が変わったり、想定外のことが起きたりしても、むしろ面白がれます。新しい環境にもすぐなじめる身軽さがあります。", "物おじしない行動力｜偉い人や初対面の人にも、気負わず話しかけられます。人と人をつなげて、新しい流れを生み出すことができます。"], "pitfalls": ["始めるのは得意、続けるのは苦手｜新しいことへの興味が強いぶん、地道な仕上げの段階で飽きがちです。仕上げが得意な人と組むと、アイデアが形になりやすくなります。", "議論が熱くなりすぎる｜意見を交わすのが楽しくて、相手が疲れていることに気づきにくいときがあります。「どう思う？」と相手の番をつくると、会話が心地よく続きます。", "予定を詰めこみすぎる｜面白そうな誘いに次々と乗ってしまい、気づけば手一杯になりがちです。返事をする前に一晩おくと、本当にやりたいことを選べます。"], "relationships": "友だちが多く、どんなグループにもすっと入れるタイプです。飲み会や休日の集まりでは、話題をふって場を盛り上げる存在。LINEでも、ちょっとした思いつきを送って会話を広げます。職場や学校では、新しい企画やアイデアを出す役として頼られがち。相性がいいのは、あなたの話を面白がりつつ、ときには反論もしてくれる人です。言い合いを楽しめる関係ほど、長く続きます。", "love": "話していて楽しい人、知らない世界を見せてくれる人に惹かれます。好きになると、面白いデートを企画したり、新しい場所に誘ったりと、二人の時間を刺激的にしようとします。大事にするのは、一緒に成長できて、退屈しない関係。すれ違いやすいのは、冗談や議論が相手を傷つけてしまうときです。真剣な話のときは、まず相手の気持ちに寄りそう一言を意識すると、信頼が深まります。", "work": "新しいことに挑戦でき、アイデアを自由に出せる環境で力が出ます。企画を立ち上げる、問題の新しい解決策を考える、人を巻きこんで動かすといった役割で評価されやすいです。一方で、毎日同じ作業をくり返す仕事や、細かいルールに縛られる環境では疲れやすくなります。変化の多い現場ほど、あなたの柔軟さが生きてきます。", "jobs": ["新規事業・企画職", "起業家", "マーケター", "広告プランナー", "ジャーナリスト"], "growth": "思いついたアイデアは、すぐに広げる前に「最初の一歩だけ」を決めて書き出してみてください。形にする道筋が見えて、実現しやすくなります。また、一日の終わりに「今日やりきったこと」を一つ振り返るのもおすすめです。小さな完成を重ねることで、あなたの発想はもっと遠くまで届きます。", "A": "自己主張型のときは、アイデアを思いついた瞬間に行動へ移せる大胆さがあります。人前でも自分の考えを楽しそうに語れ、まわりを巻きこむ力が強まります。失敗しても笑って次に進めるのが魅力です。", "T": "慎重型のときは、ひらめきに加えて「本当にうまくいくか」を確かめる冷静さが光ります。人の反応にも敏感で、相手に合わせた伝え方ができます。気になることが増えたら、一つずつ試すと気持ちが楽になります。"}, "INFJ": {"catch": "言わなくても気づくタイプ。人の心の小さな揺れを、そっと受けとめる人", "overview": "相手の表情や声のトーン、LINEの返信の間など、ほんの小さな変化に気づける人です。言葉にされていない気持ちを想像するのが自然にできるので、「なんでわかったの？」と驚かれることもよくあります。心の中には「こうあったらいいな」という静かな理想があり、それに近づくことに大きなやりがいを感じます。人と関わるのは好きですが、たくさんの人の中にいると気持ちを吸いこみすぎて疲れやすいので、ひとりで考えを整える時間が欠かせません。まわりからは、穏やかで聞き上手、でも芯がしっかりしている人に見えています。表に出す言葉は少なめでも、頭の中ではずっと先まで考えていることが多いタイプです。", "strengths": ["空気の変化にすぐ気づく｜場の雰囲気や相手の元気のなさを早めに感じとれます。困っている人が声を上げる前に、さりげなく手を差しのべられます。", "話をじっくり聞ける｜相手の話をさえぎらず、気持ちごと受けとめて聞けます。「この人には話せる」と思われ、深い相談を任されやすい人です。", "先を見通して考える｜目の前の出来事から、この先どうなりそうかを想像するのが得意です。小さな違和感から、問題を早めに防げることがあります。", "大切なことにぶれない｜自分が大事にしたい価値観がはっきりしています。流されそうな場面でも、静かに自分の考えを守り続けられます。"], "pitfalls": ["人の気持ちを背負いすぎる｜相手の気持ちがわかる分、自分のことのように抱えこみがちです。「これは相手の問題」と心の中で線を引くと、少し楽になります。", "限界まで我慢してしまう｜波風を立てたくなくて、小さな不満をため続けやすいです。ためすぎる前に「ちょっと気になってて」と軽く伝える練習をすると、関係も自分も守れます。", "理想が高くなりやすい｜頭の中の理想がはっきりしている分、現実とのずれに落ちこみやすいです。「今日は六割できたら十分」と、ゴールを小さく区切ると続けやすくなります。"], "relationships": "友だちは多くなくても、深く長く付き合える関係を大切にします。グループでは聞き役や相談役になりやすく、「話すと落ち着く」と頼られます。職場や部活では、全体の雰囲気を見ながら、浮いている人や困っている人をそっとフォローする存在です。相性がいいのは、ゆっくり本音で話せる相手や、こちらの沈黙を気まずく思わない人です。会う頻度より、会ったときの話の深さで満たされるタイプなので、無理に予定を詰めこまないほうが関係が長続きします。", "love": "すぐに好きになるより、話すうちに「この人の考え方、いいな」と心が動いていくタイプです。一度大切に思うと、相手の小さな変化にも気づき、言葉より行動で深い愛情を示します。大事にしたいのは、心から安心して本音を話せること。すれ違いやすいのは、相手の気持ちを先回りして想像しすぎて、自分の希望を言わずにのみこんでしまうときです。「察してほしい」を少しだけ言葉にすると、二人の距離がぐっと縮まります。", "work": "意味を感じられる仕事や、人の役に立っている実感がある環境で力が出ます。ひとりで集中して考える時間と、少人数で深く話し合える場があると理想的です。相手のニーズをくみとる企画、相談対応、文章や資料づくりなどで評価されやすいでしょう。一方で、数字だけを追い続ける職場や、雑談や会議が絶え間なく続く環境では、気づかないうちに疲れがたまります。週に一度でも、静かに振り返る時間を確保すると調子を保ちやすくなります。", "jobs": ["カウンセラー・相談員", "編集者・ライター", "人事・採用担当", "UXリサーチャー", "保育士・教員"], "growth": "まわりを優先するあまり、自分の気持ちが後回しになりやすいタイプです。寝る前に「今日うれしかったこと」と「ちょっとモヤッとしたこと」を一行ずつメモしてみてください。自分の気持ちに名前がつくと、人に伝えるのも楽になります。また、頼まれごとにはすぐ返事をせず「少し考えてから返すね」と一呼吸おくだけで、無理な引き受けが減ります。", "A": "自己主張型のときは、自分の判断を信じて落ち着いて行動できます。人の気持ちに寄りそいながらも、必要な場面では「私はこう思う」とはっきり伝えられるので、相談役としても頼もしい存在です。", "T": "慎重型のときは、相手の反応や自分の言動をていねいに振り返ります。人の痛みに特に敏感で、言葉選びがとてもやさしいのが魅力です。気にしすぎたら「十分気をつかえた」と自分をねぎらいましょう。"}, "INFP": {"catch": "頭の中が映画館タイプ。自分らしさと、やさしい想像力を大切にする人", "overview": "通学や通勤の電車の中、ふとした休日の午後に、頭の中でいろいろな物語や「もしも」の場面が始まる人です。好きな音楽や本、景色に心を動かされやすく、感じたことをじっくり味わうのが得意です。自分の中に「これだけは大事にしたい」という気持ちがあり、それに合わないことには、たとえ周りがやっていても乗り気になれません。人に対してはとてもやさしく、相手の立場になって考えようとします。まわりからは、おだやかで控えめ、でも話してみると独特の感性やユーモアがあって面白い人に見えています。表には出しにくいだけで、内側にはとても豊かで熱い気持ちを持っています。", "strengths": ["感じる力がとても豊か｜小さな出来事や言葉にも心が動き、その良さを味わえます。人が見落としがちな美しさや面白さに気づける感性があります。", "人の痛みに寄りそえる｜つらい思いをしている人の気持ちを、自分のことのように想像できます。否定せずに受けとめるので、そばにいるだけで安心されます。", "自分の言葉で表現できる｜文章やイラスト、音楽など、気持ちを形にするのが得意です。言いにくいことも、自分なりの表現でやさしく伝えられます。", "好きなことへの深い集中｜心から好きだと思えることには、時間を忘れて打ちこめます。その熱量が、オリジナルな作品やアイデアにつながります。"], "pitfalls": ["考えすぎて動けなくなる｜頭の中で想像がふくらみすぎて、最初の一歩が重くなりがちです。「五分だけやってみる」と小さく始めると、気持ちが自然に乗ってきます。", "本音をしまいこみやすい｜相手を傷つけたくなくて、自分の意見を言わずに終わることがあります。メモやLINEで先に気持ちを整理してから伝えると、話しやすくなります。", "自分を責めやすい｜理想が高くやさしい分、うまくいかないと「自分のせいだ」と思いこみがちです。友だちにかけるような言葉を、自分にもかけてあげると心が軽くなります。"], "relationships": "大人数でわいわいするより、気の合う人と少人数でゆっくり話すほうが心地よいタイプです。初対面では控えめでも、打ちとけると好きなものの話で盛り上がり、意外な一面を見せます。職場や学校では、争いを好まず、ぎくしゃくした場をやわらげる役回りになりがちです。相性がいいのは、こちらのペースを急かさず、感性や価値観をおもしろがってくれる人。違いを否定しない相手とは、長く深い信頼関係を築けます。", "love": "ドラマのような特別なつながりに憧れ、心の奥まで通じ合える相手を求めます。好きになると、相手の好きな曲を聴いたり、ちょっとした言葉を大切に覚えていたりと、愛情がとても細やかです。大事にしたいのは、ありのままの自分を受け入れてもらえる安心感。すれ違いやすいのは、頭の中で相手を理想化しすぎたり、不満を言えずに一人で悩んでしまったりするときです。小さな気持ちから言葉にしていくと、関係がより確かなものになります。", "work": "自分の価値観に合う仕事や、誰かの役に立っている実感がある環境で、ぐっと力が出ます。ある程度自由に進め方を選べて、ひとりで集中できる時間があると理想的です。文章、デザイン、企画など、感性や想像力を生かせる役割で評価されやすいでしょう。一方で、細かいルールに縛られ続ける環境や、競争やノルマばかりが強調される職場では、やる気が下がりやすくなります。仕事の中に「好き」を一つ見つけると続けやすくなります。", "jobs": ["ライター・小説家", "イラストレーター・デザイナー", "心理職・福祉職", "図書館司書", "動画・映像クリエイター"], "growth": "豊かな想像力を、少しずつ現実の形にしていくのが成長のカギです。思いついたアイデアや感じたことを、スマホのメモに一日一つ書きためてみてください。あとで読み返すと、自分が大事にしているものが見えてきます。また、やりたいことは「今週は調べるだけ」のように小さな段階に分けると、考えすぎずに動き出せます。", "A": "自己主張型のときは、自分の感性や選択に自信を持ちやすく、落ちこんでも立ち直りが早めです。周りの声に左右されすぎず、「私はこれが好き」と堂々と表現できるので、作品や考えが人に届きやすくなります。", "T": "慎重型のときは、気持ちの揺れを深く感じとり、それを表現の豊かさにつなげられます。人の気持ちへの配慮もいっそう細やかです。不安になったら、できたことを書き出して、自分のやさしさを認めてあげましょう。"}, "ENFJ": {"catch": "つい世話やいちゃうタイプ。まわりの人の良さを引き出し、場を温める人", "overview": "誰かが困っていると、頼まれる前に「手伝おうか？」と声をかけてしまう人です。人の気持ちや場の空気を読むのが上手で、グループの中で浮いている人がいれば自然と話しかけ、輪に入れようとします。人の成長や笑顔を見ることが何よりの喜びで、相手の良いところを見つけて伝えるのも得意です。みんなが同じ方向を向いて進むことに価値を感じ、文化祭や職場のプロジェクトでは、気づけばまとめ役になっていることも多いでしょう。まわりからは、明るく面倒見がよく、一緒にいると前向きになれる人に見えています。その分、自分の疲れには気づきにくいところもあります。", "strengths": ["人の良さを見つけて伝える｜相手が気づいていない長所を見つけ、言葉にして伝えられます。その一言が、誰かの自信や一歩につながります。", "みんなをまとめる力｜バラバラな意見を聞きながら、全員が納得しやすい方向へ導けます。チームに一体感を生むのが得意です。", "気持ちのこもった言葉｜話し方に熱意と思いやりがあり、人の心を動かせます。スピーチや説明の場面でも、聞く人を前向きにさせられます。", "すぐに手を差しのべる｜困っている人に気づくと、迷わず行動に移せます。そのやさしさと行動力が、まわりからの厚い信頼につながっています。"], "pitfalls": ["自分のことが後回しになる｜人の役に立ちたい気持ちが強く、頼まれごとを次々に引き受けがちです。予定表に「自分のための時間」を先に入れておくと、無理が減ります。", "期待に応えすぎてしまう｜相手の期待を感じとれる分、がっかりさせたくなくて頑張りすぎます。「できないことはできない」と伝えても、信頼は簡単には崩れません。", "相手のためが行きすぎる｜良かれと思ったアドバイスが、相手には重く感じられることがあります。まず「どうしてほしい？」と聞いてから動くと、気持ちがすれ違いにくくなります。"], "relationships": "友だちが多く、いろいろなグループの橋渡し役になりやすいタイプです。誕生日や記念日をしっかり覚えていて、サプライズを企画するのも好きでしょう。職場や部活では、新しく来た人に声をかけたり、空気が重いときに場を和ませたりする存在です。相性がいいのは、感謝を素直に伝えてくれる人や、こちらが弱音を吐いたときに受けとめてくれる人。支えるだけでなく、支えてもらえる関係だと長く心地よく続きます。", "love": "好きな人ができると、相手のことを一生懸命考え、喜ぶ顔が見たくてあれこれ尽くすタイプです。相手の夢や悩みにも真剣に向き合い、「一緒に成長していける関係」を大切にします。大事にしたいのは、気持ちを言葉で伝え合えること。すれ違いやすいのは、尽くしすぎて疲れてしまったり、相手の反応が薄いと不安になったりするときです。ときには甘える側に回って、してほしいことを素直に伝えると、関係がより対等で温かいものになります。", "work": "人と関わりながら、誰かの成長や笑顔に貢献できる環境で力が出ます。チームで目標を共有し、一緒に進んでいく職場が向いています。リーダーや教育係、調整役など、人をつなげて動かす役割で評価されやすいでしょう。一方で、ひとりきりで黙々と作業が続く環境や、人間関係がぎすぎすした職場では、エネルギーが消耗しやすくなります。仕事の成果に加えて「ありがとう」が感じられる場で、いちばん輝けるタイプです。", "jobs": ["教師・講師", "人事・研修担当", "キャリアアドバイザー", "広報・PR", "イベントプランナー"], "growth": "人を支える力が大きい分、自分の心の残量を意識することが大切です。一日の終わりに「今日は自分のために何をしたか」を一つ思い出してみてください。何もなければ、明日はお茶を一杯ゆっくり飲むなど、小さなことで大丈夫です。また、頼まれたときに一度「確認してから返事するね」と言う習慣をつけると、抱えこみすぎを防げます。", "A": "自己主張型のときは、自分の考えに自信を持ち、迷わず人を引っぱっていけます。失敗しても切りかえが早く、明るさで場を前に進められます。人前に立つ場面でも落ち着いて、のびのびと力を出せるタイプです。", "T": "慎重型のときは、一人ひとりの反応にいっそう細かく気を配れます。相手を傷つけないよう言葉を選ぶ思いやりが魅力です。人の評価が気になったら、自分がしてきた良いことを思い出して、心を休めましょう。"}, "ENFP": {"catch": "ときめき最優先タイプ。ワクワクを見つけて、まわりにも広げていく人", "overview": "新しいお店、初めての場所、まだ誰も試していないアイデア。そんな「おもしろそう！」に出会うと、目がきらっと輝く人です。思いついたことをすぐ話したくなり、雑談の中から次々とアイデアがふくらんでいきます。人への関心も強く、初対面の人とも自然と打ちとけて、相手の好きなものや考えを知るのを楽しめます。ルールや決まった手順より、「どうしたらもっと楽しくなるか」を大切にするので、場の空気をぱっと明るくする力があります。まわりからは、元気で人懐っこく、一緒にいると世界が広がる人に見えています。にぎやかな印象の一方で、実は人の気持ちに敏感で、繊細な一面も持っています。", "strengths": ["アイデアがあふれ出る｜一つの話題から、いくつもの新しい発想をつなげられます。会議や企画の場で、思いがけない切り口を出せるのが強みです。", "誰とでもすぐ打ちとける｜初対面でも壁をつくらず、相手の話を楽しそうに聞けます。人と人をつなげる、ハブのような存在になれます。", "まわりをやる気にさせる｜楽しそうに話す姿が、自然と周りの人を巻きこみます。「やってみようかな」という空気を生み出すのが得意です。", "人の可能性を信じられる｜相手の良いところや伸びしろに気づき、心から応援できます。その前向きな言葉が、誰かの背中をそっと押します。"], "pitfalls": ["興味が次々に移る｜新しいことにときめく分、始めたことが途中で止まりがちです。終わらせたいことを一つだけ選び、小さなゴールを決めると最後まで進みやすくなります。", "予定を詰めこみすぎる｜誘いもやりたいことも断れず、気づけば手帳がいっぱいになります。週に一日「何も入れない日」を先に決めておくと、気持ちに余裕が戻ります。", "細かい作業で疲れやすい｜同じ作業のくり返しや事務手続きは、どうしても後回しにしがちです。音楽をかける、時間を区切るなど、小さな工夫で楽しみを足すと進めやすくなります。"], "relationships": "友だちの輪が広く、いろいろなタイプの人と仲良くなれます。思いついたら「今から会えない？」とLINEを送るような行動力もあり、遊びの企画役になることも多いでしょう。職場や学校では、ムードメーカーとして場を明るくし、意見が出にくいときに話のきっかけをつくります。相性がいいのは、こちらのアイデアをおもしろがって聞いてくれる人や、ほどよく現実的な視点をくれる人。気持ちを素直に伝え合える関係で、いちばん自分らしくいられます。", "love": "ときめきや「この人といると楽しい」という感覚から恋が始まりやすいタイプです。好きになると、一緒に行きたい場所ややりたいことが次々に浮かび、相手との時間を全力で楽しみます。大事にしたいのは、気持ちを素直に表現し合えることと、お互いの自由を尊重できること。すれ違いやすいのは、関係が落ち着いて刺激が減ったときや、相手の気持ちを読みすぎて不安になるときです。日常の中に小さな楽しみを一緒につくると、関係が長く続きます。", "work": "新しいことに挑戦でき、アイデアや人とのつながりを生かせる環境で力が出ます。自由度が高く、いろいろな人と関われる職場が向いています。企画や立ち上げ、発信、人と人をつなぐ役割などで評価されやすいでしょう。一方で、毎日同じ手順のくり返しや、細かい管理が厳しい環境では、やる気がしぼみやすくなります。苦手な作業は得意な人と分担したり、ツールに任せたりすると、自分の強みにもっと時間を使えます。", "jobs": ["企画・マーケティング", "広告・コピーライター", "イベント・旅行プランナー", "起業家・新規事業担当", "インフルエンサー・配信者"], "growth": "あふれるアイデアを、形にするところまで運ぶ力をつけるのが成長のポイントです。やりたいことを思いついたら、まず「最初の一歩」を一行で書き出し、その日のうちに一つだけ手をつけてみてください。また、月に一度、始めたことを振り返って「続けるもの」と「手放すもの」を選ぶと、エネルギーを大切なことに集中できます。", "A": "自己主張型のときは、思いついたことを迷わず行動に移せる行動派です。失敗しても「次いこう！」と切りかえが早く、周りを明るく引っぱっていけます。新しい環境にもすぐなじみ、チャンスを楽しみながらつかめるタイプです。", "T": "慎重型のときは、明るさの中に人への細やかな気づかいを持っています。周りの反応をよく見ているので、相手に合わせた言葉をかけられます。気にしすぎて疲れたら、ひとりで好きなことをする時間で元気を取り戻しましょう。"}, "ISTJ": {"catch": "約束と手順を守り抜く、静かで頼れる仕事人", "overview": "「締切より早く出すタイプ」のあなたは、決めたことをきちんとやり切る人です。提出物は前日までに仕上げ、待ち合わせには少し早めに着いています。派手なアピールはしませんが、任されたことは最後まで手を抜きません。判断の土台にするのは、これまでの経験や確かな事実です。思いつきより「前にうまくいったやり方」を信じます。口数が多いほうではないので、初めは少し近寄りがたく見えるかもしれません。でも付き合いが長くなるほど、「あの人に頼めば大丈夫」と思われる存在になります。ひとりで集中できる時間があると、いちばん力が出ます。", "strengths": ["約束を必ず守る誠実さ｜言ったことは実行し、期限も守ります。小さな約束の積み重ねで、まわりから深く信頼されます。", "抜けやもれに気づく目｜書類の数字の違いや、手順の飛ばしにすぐ気づきます。ミスを未然に防ぐ、チームの守り役です。", "コツコツ続ける力｜毎日の勉強や記録など、地味な作業も淡々と続けられます。気づけば大きな成果になっています。", "落ち着いた判断力｜トラブルのときも慌てず、事実を確かめてから動きます。その冷静さがまわりを安心させます。"], "pitfalls": ["急な変更に疲れやすい｜段取りを大切にしているぶん、直前の予定変更で心が乱れがちです。「変わるかも」と最初から予備の案を持っておくと楽になります。", "気持ちを言葉にしにくい｜感謝や不満を胸にしまいがちで、誤解されることがあります。短くていいので「助かった」と口に出すだけで関係が温まります。", "ひとりで抱えこみやすい｜人に頼むより自分でやるほうが確実だと思いやすいです。全部を背負わず、一部だけでも任せると負担がぐっと減ります。"], "relationships": "友だちの数は多くなくても、長く続く関係を大切にします。久しぶりに会っても変わらない、安定した付き合いが心地よいタイプです。職場や部活では、決まりごとを守り、頼まれた役目をきちんと果たします。にぎやかな場が続くと疲れるので、少人数でゆっくり話せる相手と相性がよいです。約束を大事にしてくれる人や、こちらのペースを急かさない人とは、自然と信頼が深まります。", "love": "好きになるまでに時間がかかりますが、一度心を決めたらまっすぐです。言葉で愛情を伝えるより、記念日を覚えていたり、送り迎えをしたりと、行動で示します。パートナーには誠実さと安心感を求めます。すれ違いやすいのは、気持ちを言わないせいで「冷たい」と感じさせてしまうときです。LINEの返信が短くても、ひと言「楽しかった」を添えると、思いがちゃんと届きます。", "work": "ルールや手順がはっきりしていて、自分の担当範囲が決まっている環境で力を発揮します。正確さが求められる仕事や、期限までに確実に仕上げる役割で高く評価されます。資料のチェックや進み具合の管理を任されると安心して取り組めます。反対に、方針がころころ変わる職場や、準備なしで即興を求められる場面では疲れやすいです。前もって情報を集める時間をもらえると、本来の力が出ます。", "jobs": ["経理・会計", "公務員（行政職）", "品質管理", "システム保守・運用", "薬剤師"], "growth": "あなたの確かさは大きな財産です。そのうえで、少しだけ「いつもと違う」を取り入れてみましょう。たとえば週に一度、通ったことのない道で帰る、初めての店でランチを選ぶなど、小さな変化で十分です。また、1日の終わりに、誰かに感謝をひと言伝えてみてください。気持ちを言葉にする練習が、人間関係をぐっと楽にしてくれます。", "A": "自己主張型のときは、自分のやり方に自信を持ち、迷わず進めます。ミスをしても必要以上に落ちこまず、次の手順を淡々と考えられます。まわりにも安定した印象を与え、まとめ役を任されやすいです。", "T": "慎重型のときは、念には念を入れて確認するので、細かなミスがほとんどありません。「これで本当に大丈夫か」と考えるぶん、準備の質がとても高いです。ときどき、ここまでで十分と自分に言ってあげると楽になります。"}, "ISFJ": {"catch": "そっと気づいて先に動く、思いやりの縁の下", "overview": "「気づいたら動いてるタイプ」のあなたは、まわりの困りごとに自然と気づける人です。飲み物が足りなければ補充し、元気のない人がいれば声をかけます。それを「やってあげた」とは思わず、当たり前のこととしてこなします。大切にしているのは、身近な人が安心して過ごせることです。一度覚えた相手の好みや予定は、長く覚えています。控えめで目立つことは好みませんが、いなくなると「あの人のおかげだった」と気づかれる存在です。決まった流れの中で、丁寧に物事を進めるのが得意です。静かな時間で心を整えると、またやさしく動けます。", "strengths": ["先回りできる気配り｜相手の表情や声の小さな変化に気づきます。言われる前に手を差しのべられるので、深く感謝されます。", "丁寧で確実な仕事ぶり｜一つひとつの作業をおろそかにせず、最後まで心をこめて仕上げます。安心して任せられる人です。", "相手をよく覚えている｜誕生日や好きな食べ物、前に話したことを覚えています。その記憶が、相手を大切にする力になります。", "場をやわらげる穏やかさ｜ピリッとした空気の中でも、おだやかな言葉で緊張をほどきます。そばにいるだけでほっとされます。"], "pitfalls": ["頼まれると断れない｜相手をがっかりさせたくない思いが強く、無理を引き受けがちです。「確認して返事するね」と一度間をおくと、自分を守れます。", "自分の疲れに気づきにくい｜人のことを優先するあまり、自分の休みが後回しになります。予定表に「何もしない時間」を先に書きこむと楽になります。", "気持ちをため込みやすい｜波風を立てたくなくて、モヤモヤを言わずに我慢しがちです。信頼できる人に小出しに話すと、心が軽くなります。"], "relationships": "友だちには、さりげない気づかいで寄り添います。体調を崩した人にメッセージを送ったり、旅行の持ち物リストを用意したりと、支え役になることが多いです。職場や学校でも、困っている人を放っておけません。相性がよいのは、あなたのやさしさに「ありがとう」を返してくれる人です。一方的に頼られる関係より、お互いに気づかい合える関係のほうが、長く心地よく続きます。", "love": "好きな人のことは、細かいところまでよく見ています。体調を気づかったり、好みの差し入れを用意したりと、日々の小さな行動で愛情を伝えます。大切にするのは、安心して一緒にいられる穏やかな関係です。すれ違いやすいのは、相手に合わせすぎて本音を言えなくなるときです。「私はこうしたい」と小さな希望から伝えてみると、パートナーとの距離がもっと近づきます。", "work": "人の役に立っている実感があり、手順がある程度決まっている環境で力を発揮します。丁寧な対応や、裏方としての支えが高く評価されやすいです。困っている人を手助けする役割や、正確さが必要な事務にも向いています。反対に、競争が激しい職場や、冷たい言葉が飛びかう環境では心がすり減りやすいです。感謝が言葉で交わされる職場を選ぶと、長く気持ちよく働けます。", "jobs": ["看護師", "保育士", "医療事務", "図書館司書", "総務・人事"], "growth": "あなたのやさしさは、まず自分にも向けてよいものです。今日から、頼まれごとにすぐ「いいよ」と言う前に、一呼吸おいて自分の予定と気持ちを確かめてみましょう。また、寝る前に「今日自分がよくやったこと」を一つ書き出してみてください。人のために動けた自分を認めることで、心に余裕が生まれます。", "A": "自己主張型のときは、人を支えながらも自分のペースを保てます。頼まれごとも、できる範囲を見きわめて引き受けられます。気配りが自然体なので、まわりも気をつかわずに甘えられます。", "T": "慎重型のときは、相手の気持ちを深く想像するぶん、気づかいがとても細やかです。「迷惑じゃないかな」と考えるやさしさが、信頼につながります。自分にも同じだけのやさしさを向けると、ぐっと楽になります。"}, "ESTJ": {"catch": "段取りを組んでみんなを前に進める、頼もしい進行役", "overview": "「まず予定表つくるタイプ」のあなたは、物事をきちんと形にしていく人です。旅行が決まればすぐに日程と予算を組み、グループ作業では役割分担を決めます。ぼんやりした状態が苦手で、「いつまでに、誰が、何をするか」をはっきりさせたくなります。頼りにするのは、確かな事実とこれまでの実績です。言うべきことははっきり言うので、まわりからは頼もしいリーダーに見えます。少し厳しく感じられることもありますが、それは物事をうまく進めたいという責任感の表れです。人と協力しながら、目に見える成果を出すときにいちばん輝きます。", "strengths": ["先を見通す段取り力｜目標から逆算して、やるべきことを順番に並べられます。まわりが迷わず動ける道すじをつくります。", "決める力と実行力｜話し合いが長引いても、要点をまとめて結論を出します。決めたらすぐ動くので、物事が前に進みます。", "最後までやり抜く責任感｜任された役目は最後までやり遂げます。困難があっても投げ出さない姿勢が、周囲の信頼を集めます。", "わかりやすい伝え方｜あいまいな表現を避け、要点をはっきり伝えます。指示や説明が明確で、相手が動きやすくなります。"], "pitfalls": ["言い方が強く伝わりやすい｜効率を考えて率直に言うぶん、相手がきつく感じることがあります。用件の前に「ありがとう」をひと言添えると、ぐっと伝わりやすくなります。", "自分のやり方にこだわりがち｜うまくいった方法を信じているため、別の案を後回しにしやすいです。まず相手の案を最後まで聞くと、新しい発見があります。", "休むのが後回しになる｜やることが見えていると、つい動き続けてしまいます。休日の予定に「休む」を一つの予定として入れておくと、疲れをためずにすみます。"], "relationships": "友だちの中では、集まりの日程を決めたり、店を予約したりと、自然とまとめ役になります。面倒見がよく、困っている人には具体的な解決策を出して助けます。職場や部活でも、ルールを守り、全体の流れを整える存在です。相性がよいのは、約束を守り、はっきり話してくれる人です。気持ちを大切にするタイプの人とは、相手の話を聞く時間を意識してとると、よい関係が築けます。", "love": "好きな人には、誠実で頼れる姿を見せます。デートの計画を立てたり、困りごとを一緒に解決したりと、行動で大切にします。パートナーとは、お互いに約束を守れる、信頼できる関係を望みます。すれ違いやすいのは、相手が話を聞いてほしいだけなのに、つい解決策を伝えてしまうときです。「そうだったんだね」とまず受け止めると、気持ちがぐっと通い合います。", "work": "目標と役割がはっきりしていて、成果が目に見える環境で力を発揮します。チームをまとめる立場や、進み具合を管理する役割で高く評価されやすいです。決まりを整えたり、仕組みを改善したりするのも得意です。反対に、方針があいまいなまま進む職場や、決定に時間がかかりすぎる環境ではストレスがたまりやすいです。自分に決める権限が少しでもあると、のびのび働けます。", "jobs": ["営業マネージャー", "プロジェクト管理", "店長", "銀行員", "警察官・消防士"], "growth": "あなたの推進力は、まわりを前へ運ぶ大きな力です。今日から、会議や話し合いで自分の意見を言う前に、相手に「どう思う？」とひと言聞いてみましょう。また、週に一度、予定を入れない時間をつくってみてください。立ち止まる時間が、次の判断をさらに確かなものにしてくれます。", "A": "自己主張型のときは、迷いが少なく、判断がとても速いです。プレッシャーのかかる場面でも堂々とふるまえるので、まわりを引っぱる力が強く出ます。失敗しても切り替えが早いのも特徴です。", "T": "慎重型のときは、計画の穴やリスクを先回りして確認します。「本当にこれでいいか」と見直すぶん、計画の完成度が高いです。まわりの反応にも気を配れるので、やわらかいまとめ役として信頼されます。"}, "ESFJ": {"catch": "みんなの笑顔のために動く、場をつなぐまとめ役", "overview": "「気づけば幹事タイプ」のあなたは、人と人をつなぐのが自然とできる人です。飲み会や誕生日のお祝いでは、いつのまにか日程調整や店選びを引き受けています。大切にしているのは、その場にいるみんなが楽しく、居心地よく過ごせることです。輪に入れていない人がいれば声をかけ、話題をふって場をあたためます。相手の気持ちや場の空気に敏感で、礼儀や思いやりを大事にします。まわりからは明るく親しみやすい人に見え、相談相手として頼られることも多いです。人から「ありがとう」と言われることが、何よりのエネルギーになり、また次も頑張ろうと思えます。", "strengths": ["人と人をつなぐ力｜初対面どうしの間に入り、共通の話題を見つけて打ちとけさせます。あなたがいると輪が広がります。", "場の空気を読む力｜誰が疲れているか、誰が話したそうかに気づきます。全員が心地よく過ごせるよう自然に調整できます。", "行動につながる思いやり｜気持ちだけで終わらせず、差し入れや連絡など形にして伝えます。そのやさしさが相手の心に残ります。", "まとめて進める力｜イベントの準備や係の仕事で、役割と予定を整えて最後まで進めます。安心して任せられる世話役です。"], "pitfalls": ["人の評価が気になりやすい｜みんなに喜んでほしい思いが強く、反応が薄いと不安になりがちです。「自分は十分やった」と自分で区切りをつけると楽になります。", "頑張りすぎてしまう｜幹事や世話役を重ねて引き受け、気づけば疲れきっていることがあります。ときには「今回は参加だけ」と役を譲ってみましょう。", "ぶつかるのを避けがち｜場の空気を守りたくて、反対意見を飲みこみやすいです。「私はこう思う」とやわらかく伝えれば、関係はむしろ深まります。"], "relationships": "友だちが多く、グループのLINEでもよく声をかける存在です。久しぶりの人にも気軽に連絡でき、人の輪を保つ役目を自然と担います。職場や学校では、新しく来た人に声をかけたり、行事を盛り上げたりします。相性がよいのは、気持ちを言葉で返してくれる人です。反応が少ないタイプの人とは、相手なりの感謝の示し方があると知っておくと、すれ違いが減ります。", "love": "好きな人には、まめに連絡をとり、喜ぶことを考えて行動します。記念日のサプライズや、手料理のおもてなしも得意です。大切にするのは、気持ちを伝え合い、お互いを思いやれる関係です。すれ違いやすいのは、自分ばかり尽くしていると感じて、さみしくなるときです。してほしいことを素直に言葉にすると、パートナーも応えやすくなり、関係がより安定します。", "work": "人と協力しながら進める仕事や、相手の役に立っている実感がある環境で力を発揮します。チームの雰囲気づくりや、お客さまへの細やかな対応で高く評価されやすいです。行事の運営や調整役もよく任されます。反対に、ひとりで黙々と作業が続く環境や、人間関係がぎすぎすした職場では元気がなくなりやすいです。感謝を伝え合う文化のある職場を選ぶと、長く輝けます。", "jobs": ["ホテル・接客スタッフ", "教員", "ブライダルプランナー", "人事・採用担当", "介護福祉士"], "growth": "あなたの温かさは、まわりの人を元気にする力です。今日から、誰かの頼みを引き受ける前に「自分は今、余裕があるかな」と心の中で確かめてみましょう。また、週に一度は、自分だけが楽しむための予定を入れてみてください。自分を満たす時間があるほど、人へのやさしさも長続きします。", "A": "自己主張型のときは、人の反応に振り回されすぎず、自分の判断で場を進められます。自信をもって声をかけられるので、リーダーとしても頼られます。明るさが安定していて、まわりに安心感を与えます。", "T": "慎重型のときは、相手の気持ちを細かく想像し、気配りがいっそう行き届きます。「喜んでもらえるかな」と考え抜くぶん、準備がとても丁寧です。完璧でなくても十分伝わっていると知ると、心が軽くなります。"}, "ISTP": {"catch": "説明書より先に手が出る、静かな仕組み好き", "overview": "新しい家電やアプリを手にしたら、説明書を読む前にまず触ってみる。ISTPは、そんな「やってみて分かる」を大切にする人です。物ごとがどう動いているのかを知るのが好きで、うまくいかないときほど集中力が上がります。口数は多くないことが多く、まわりからは「クールで落ち着いた人」と見られがちです。でも内側では、目の前のことを静かに観察し、どこを直せばよくなるかをずっと考えています。細かい決まりに縛られるより、自分のやり方で自由に動けるときに力が出ます。トラブルが起きても慌てず、さっと手を動かして片づけるので、いざというときに頼りにされる存在です。ひとりの時間で元気を取り戻し、好きなことには驚くほど深くのめり込みます。", "strengths": ["いざという時に動じない｜予定が崩れても、まず落ち着いて状況を見ます。慌てずに次の一手を選べるので、まわりも安心できます。", "手を動かして覚えるのが早い｜道具やソフトの使い方を、触りながらどんどん身につけます。実際にやってみることで、理解が深まるタイプです。", "ムダを見つけて直せる｜「ここを変えれば早くなる」に気づくのが得意です。手順や道具を少し工夫して、作業をぐっと楽にします。", "自分の力で何とかする｜人に頼る前に、まず自分で調べて試します。ひとりで任されても、最後まで粘り強く形にできます。"], "pitfalls": ["気持ちを言葉にしにくい｜考えが頭の中で完結しやすいため、まわりに伝わらないことがあります。「今こう思ってる」と一言だけ添えると、誤解がぐっと減ります。", "興味が切れると手が止まる｜仕組みが分かった時点で満足しやすいからです。最後の仕上げだけは「ここまでやる」と先に決めておくと、やり残しが防げます。", "急に距離をとってしまう｜ひとりの時間が足りなくなると、黙って離れたくなります。「少し休むね」と伝えてから離れると、相手も安心して待てます。"], "relationships": "友だちとは、ベタベタせずに気楽な距離で付き合うのが心地よいタイプです。毎日LINEでやりとりするより、たまに会って一緒に何かをする時間を大切にします。職場や部活では、口より手で助けるので「困ったときに一番頼れる人」と思われやすいです。相性がいいのは、こちらのペースを尊重してくれて、無理に話を引き出そうとしない人。同じ趣味を一緒に楽しめると、自然と仲が深まります。", "love": "好きな人ができても、言葉で伝えるより行動で示すことが多いです。重い荷物を持つ、壊れたものを直す、行きたがっていた場所を調べておく。そうした小さな気づかいが愛情表現です。パートナーには、お互いの自由を大切にできる関係を望みます。すれ違いやすいのは、相手が「好き」の言葉を求めているとき。たまには思っていることを口に出すと、気持ちがまっすぐ届きます。", "work": "自分の裁量で動ける現場や、目に見える成果が出る仕事で力を発揮します。トラブル対応や、手順の改善を任されると評価されやすいでしょう。機械やデータ、道具を扱う役割とも相性がいいです。反対に、目的の見えない会議が多い環境や、細かいルールで手順をすべて決められている職場では疲れやすくなります。「なぜそうするのか」が分かると、ぐっと動きやすくなります。", "jobs": ["エンジニア（機械・設備）", "システム保守・インフラ担当", "整備士・技術職", "映像編集・音響スタッフ", "救急・防災の仕事"], "growth": "あなたの考えは、口に出してはじめてまわりの力になります。今日からできることは、会議や話し合いで一つだけ意見を言ってみることです。また、手伝ってもらったら「助かった」と言葉で返してみましょう。短い一言でも、相手との信頼はしっかり積み重なっていきます。", "A": "自己主張型のISTPは、自分の判断に迷いが少なく、思い立ったらすぐに動きます。失敗してもあまり引きずらず、「次はこうしよう」と切り替えが早いのが特徴です。新しいことにも気軽に挑戦できます。", "T": "慎重型のISTPは、動く前に細かいところまで確かめる丁寧さがあります。うまくいかなかった点をよく振り返るので、同じミスをくり返しません。仕上がりの質にこだわる、職人肌の一面が光ります。"}, "ISFP": {"catch": "心が「好き」と言ったほうへ、そっと進む人", "overview": "服を選ぶとき、カフェに入るとき、進路を決めるとき。ISFPは、理由よりも先に「これが好き」という感覚で選ぶ人です。その感覚はとても正直で、自分に合うものをちゃんと知っています。普段はおだやかで控えめに見えますが、心の中には自分なりのこだわりと美意識がしっかりあります。人の気持ちの変化にもよく気づき、困っている人にはさりげなく寄り添います。争いごとは好まず、まわりと穏やかに過ごしたいと考えるタイプです。ただ、大切にしているものを否定されると、静かに、でも強く守ろうとします。季節の空気や音楽、手ざわりなど、日々の小さな心地よさを味わう力にも長けています。", "strengths": ["センスで場を心地よくする｜色や音、置き方などの小さな違いに気づきます。部屋や資料を、見ていて気持ちいい形に整えるのが得意です。", "そっと寄り添えるやさしさ｜相手の表情や声の変化に早く気づきます。押しつけずに隣にいるので、相手は安心して本音を話せます。", "自分らしさを大切にできる｜流行やまわりの声に流されすぎず、自分に合うものを選べます。その姿が、まわりにも「自分でいい」と思わせます。", "目の前のことに集中できる｜好きな作業に入ると、時間を忘れて没頭します。手をかけた分だけ、仕上がりにあたたかさが出ます。"], "pitfalls": ["「いや」と言えずに抱える｜相手を傷つけたくない気持ちが強いからです。すぐ返事をせず「少し考えさせて」と時間をもらうと、自分の本音を確かめられます。", "先の予定が苦手になりがち｜今の気持ちを大事にする分、遠い計画は実感がわきにくいのです。大きな予定は小さく分けて、一つずつカレンダーに入れると楽になります。", "批判を深く受け止めすぎる｜作ったものに自分の気持ちがこもっているからです。意見は「作品へのもの」と「自分へのもの」を分けて聞くと、心が軽くなります。"], "relationships": "大人数でにぎやかに過ごすより、気の合う少人数とゆったり過ごすのが好きです。友だちの好みや体調の変化を覚えていて、さりげない気づかいができます。職場や学校では、場の空気をやわらげる存在として大切にされやすいでしょう。相性がいいのは、こちらの感じ方を否定せず、ペースを合わせてくれる人。ゆっくり打ち解けるので、時間をかけた関係ほど深い信頼が育ちます。", "love": "好きになるときは、言葉よりも雰囲気や一緒にいるときの居心地で惹かれていきます。相手のために手紙を書いたり、好みに合うプレゼントを選んだりと、気持ちを形にするのが得意です。大切にしたいのは、お互いのペースや好きなものを尊重できること。すれ違いやすいのは、不満を言わずにため込んでしまうときです。小さなうちに「ちょっと寂しかった」と伝えると、関係がより心地よくなります。", "work": "自分の感性を生かせる仕事や、人の役に立っている手ごたえがある仕事で力が出ます。ものづくりやデザイン、人に直接寄り添う役割では、丁寧さとやさしさが評価されやすいでしょう。自分のペースで進められる環境だと、集中力がぐんと上がります。反対に、競争が激しい職場や、数字だけで評価される環境では疲れやすくなります。好きな部分が一つでもあると、長く続けやすくなります。", "jobs": ["デザイナー", "美容師・ネイリスト", "保育士", "パティシエ・料理人", "動物看護師・トリマー"], "growth": "あなたの「好き」は、まわりにとっても大切なヒントになります。今日からできることは、その日感じた「よかったこと」を一行だけメモしてみることです。自分の好みや大事にしたいことが、言葉ではっきり見えてきます。気が向いたら、そのうち一つを誰かに話してみましょう。", "A": "自己主張型のISFPは、自分の感覚をまっすぐ信じて行動できます。まわりの評価をあまり気にせず、好きなことに堂々と打ち込めるのが特徴です。気分の切り替えも早く、明るい印象を持たれやすいでしょう。", "T": "慎重型のISFPは、まわりの気持ちにとても敏感で、細やかな気配りができます。自分の作るものをより良くしたいという思いが強く、何度も手直しをします。その丁寧さが、深い魅力につながります。"}, "ESTP": {"catch": "考えるより先に一歩出て、その場の流れをつかむ人", "overview": "「とりあえず行ってみよう」が自然と口から出る。ESTPは、頭で考えるより体を動かしながら答えを見つける人です。新しいお店やイベント、初めての場所にもためらわず飛び込み、その場の空気をすばやく読み取ります。話が早くてテンポがよく、まわりからは「行動力があって頼もしい人」と見られやすいでしょう。机の上の理屈より、今ここで起きている現実を大切にします。予定外のことが起きても楽しめるタイプで、ピンチの場面ほど本領を発揮します。人と関わるのが好きで、初対面の人ともすぐに打ち解けられます。その明るさと身軽さが、まわりの人を動かすきっかけになっています。", "strengths": ["とっさの判断が速い｜状況が変わっても、すぐに「今何をすべきか」を見つけます。迷っている時間を減らし、チームを前に進めます。", "その場を盛り上げる力｜話のテンポがよく、自然と場を明るくします。初めて会う人とも、すぐに打ち解けられるのが強みです。", "現実に合わせて動ける｜理想論よりも「実際どうするか」を考えます。使える道具や人をうまく組み合わせて、形にしていきます。", "失敗をおそれず挑戦できる｜うまくいかなくても「次いこう」と切り替えられます。その身軽さが、新しいチャンスを引き寄せます。"], "pitfalls": ["先のことを後回しにしがち｜目の前のことに全力を注ぐ分、遠い予定は見えにくくなります。週に一度、スマホで来週の予定を眺める時間を作ると安心です。", "勢いで言いすぎてしまう｜話のテンポを大事にするため、言葉が先に出ることがあります。大事な話の前に一呼吸おくだけで、伝わり方が変わります。", "単調な作業で集中が切れる｜刺激がないと退屈を感じやすいからです。作業に時間制限をつけてゲームのようにすると、最後まで続けやすくなります。"], "relationships": "友だちが多く、誘われればフットワーク軽く出かけます。休日に急に「今から遊ぼう」と声をかけるのも得意です。職場や部活では、場の空気を動かすムードメーカーとして頼られやすいでしょう。サバサバしているので、こじれた空気を切り替えるのも上手です。相性がいいのは、一緒に新しいことを楽しめて、ときには落ち着いた視点もくれる人。お互いに遠慮のない関係が心地よく感じられます。", "love": "好きになると、行動で気持ちを示すタイプです。気になる人を思い切って誘い、一緒に出かけながら距離を縮めていきます。デートは、体験型のレジャーや旅行など、楽しい時間を共有できるものが好きです。大切にするのは、一緒にいて自然体でいられること。すれ違いやすいのは、相手がじっくり話したいときです。ときどき落ち着いて気持ちを聞く時間を作ると、絆がさらに深まります。", "work": "変化が多く、すぐに結果が見える仕事で力を発揮します。営業や現場の対応など、人と直接やりとりする役割では、交渉力と対応の速さが評価されやすいでしょう。トラブルが起きたときの「火消し役」としても頼りにされます。反対に、同じ作業をくり返すだけの仕事や、決まるまでに長い時間がかかる環境では疲れやすくなります。動きながら考えられる場所が、いちばん輝けます。", "jobs": ["営業職", "イベントプランナー", "スポーツトレーナー", "消防士・警察官", "独立開業・店舗経営"], "growth": "あなたの行動力は、少しの準備でさらに強くなります。今日からできることは、大事な決断の前に「10秒だけ待つ」ことです。その間に、ほかの選択肢や相手の気持ちを一つ思い浮かべてみましょう。また、寝る前に明日の予定を一つ確認する習慣も、あなたの勢いを支えてくれます。", "A": "自己主張型のESTPは、自信にあふれていて、迷わず行動に移せます。まわりの目をあまり気にせず、新しい場にもどんどん飛び込めるのが特徴です。リーダー役を自然と任されることも多いでしょう。", "T": "慎重型のESTPは、行動力に加えて、まわりの反応をよく見る冷静さがあります。動いたあとに振り返る習慣があり、次の挑戦に経験をしっかり生かせます。勢いと慎重さのバランスがとれた頼れる存在です。"}, "ESFP": {"catch": "今この瞬間を、まわりと一緒に楽しくする人", "overview": "楽しそうな予定には、迷う前に「行く！」と返事をしている。ESFPは、今この瞬間を全力で楽しみ、その楽しさをまわりにも広げる人です。表情が豊かで、話しているだけで場がぱっと明るくなります。初めての場所でもすぐになじみ、気づけば輪の中心にいることも多いでしょう。人の喜ぶ顔を見るのが好きで、友だちの誕生日やちょっとしたお祝いを大切にします。理屈よりも、その場の空気や人の気持ちを感じ取って動くタイプです。落ち込んでいる人がいれば、さりげなく笑わせて元気づけます。まわりからは「一緒にいると楽しい人」と思われ、自然と人が集まってきます。", "strengths": ["場の空気を明るくする｜笑顔とリアクションで、緊張した場もやわらげます。まわりが話しやすくなる雰囲気を自然と作れます。", "人の気持ちに早く気づく｜相手が楽しんでいるか、疲れていないかをすぐ感じ取ります。その場でさっと声をかけられるやさしさがあります。", "新しい環境にすぐなじむ｜転校や異動、旅行先でもすぐに打ち解けます。知らない人ともつながり、輪を広げていけるのが強みです。", "「楽しい」を形にできる｜集まりやイベントのアイデアがどんどん浮かびます。思いついたらすぐ動き、みんなの思い出を作ります。"], "pitfalls": ["予定を詰め込みすぎる｜誘いを断るのが苦手で、楽しそうなことに全部応えたくなるからです。週に一日は「何もしない日」を先に決めておくと、疲れをためずにすみます。", "お金や時間がつい流れる｜その場の楽しさを優先しやすいためです。買い物の前に「一晩おく」と決めると、本当にほしいものだけが手元に残ります。", "重い話を避けがちになる｜場を明るく保ちたい気持ちが強いからです。大事な話は、楽しい時間とは別に短く時間をとると、向き合いやすくなります。"], "relationships": "友だちが多く、グループのLINEでもよく発言する盛り上げ役です。誰とでも気さくに話せるので、職場や学校では人と人をつなぐ役割を担いやすいでしょう。相手の小さな変化にも気づき、「最近どう？」と声をかけられる温かさがあります。相性がいいのは、こちらの明るさを受け止めつつ、ときには落ち着いて話を聞いてくれる人。一緒に笑える時間が多いほど、関係が長続きします。", "love": "好きになると、気持ちがすぐに態度に出るタイプです。会いたい、話したいと思ったら、素直に連絡をします。デートでは、サプライズや楽しい計画で相手を喜ばせるのが得意です。大切にするのは、一緒にいて楽しく、気持ちを素直に出し合えること。すれ違いやすいのは、将来の話など先のことを相談されたときです。ときには真剣に考える時間をもつと、パートナーからの信頼がぐっと高まります。", "work": "人と関わりながら、反応がすぐに返ってくる仕事で力を発揮します。接客や販売、イベントなどでは、明るさと気配りが評価されやすいでしょう。チームの雰囲気をよくする存在としても大切にされます。反対に、一日中ひとりでパソコンに向かう仕事や、変化の少ないルーティン作業ばかりの環境では疲れやすくなります。人の笑顔が見える場所で、いちばん力が出ます。", "jobs": ["接客・販売スタッフ", "ツアーガイド・旅行プランナー", "イベントスタッフ", "保育士・幼稚園の先生", "エンターテインメントの仕事"], "growth": "あなたの明るさは、少しの見通しがあるともっと長く続きます。今日からできることは、月の初めに「楽しみな予定」と「やるべきこと」を一つずつ書き出すことです。どちらも目に見えると、気持ちよく両立できます。また、疲れたときは「今日は休むね」と素直に言ってみましょう。", "A": "自己主張型のESFPは、自分の魅力をのびのびと表現できます。まわりの評価を気にしすぎず、思い立ったらすぐ行動に移せるのが特徴です。人前に立つ場面でも、自然体で楽しめるでしょう。", "T": "慎重型のESFPは、明るさの中にまわりへの細やかな気づかいがあります。相手がどう感じたかをよく考えるので、人の心に寄り添う力が強いです。そのやさしさが、深い信頼関係を育てます。"}}, "HN": {"type": {"ISTJ": {"want": "決めたことをやり遂げる手応えと、信頼される安心感", "effort": "決まりや段取りを守り、ミスなく積み上げること", "work": "ルールと手順がはっきりしていて、正確さが評価される仕事", "jobs": ["経理・事務", "品質管理", "公務員", "システム運用"]}, "ISFJ": {"want": "人の役に立っている実感と、安心できる居場所", "effort": "先回りして気を配り、まわりを支えること", "work": "身近な人を支え、感謝が直接返ってくる仕事", "jobs": ["看護・介護", "保育", "総務", "医療事務"]}, "INFJ": {"want": "意味のあることに関わっている感覚と、深く分かり合える関係", "effort": "人の気持ちを読み、言葉にならない思いをくみ取ること", "work": "人の成長や心に、長く関われる仕事", "jobs": ["カウンセラー", "教育・研修", "編集・ライター", "人事"]}, "INTJ": {"want": "自分で考えた計画で物事を動かす手応えと、ひとりで深く考える時間", "effort": "先を読み、筋道を立てて最短ルートを示すこと", "work": "長い目で見た戦略や仕組みづくりを任される仕事", "jobs": ["企画・戦略", "研究", "エンジニア", "コンサルタント"]}, "ISTP": {"want": "自分の手と頭で問題を解く自由と、干渉されない時間", "effort": "起きたトラブルを冷静に、手早く片づけること", "work": "手を動かした結果が、目に見えて分かる仕事", "jobs": ["技術職・整備", "エンジニア", "職人", "現場の専門職"]}, "ISFP": {"want": "自分の「好き」に正直でいられることと、穏やかな人間関係", "effort": "空気を乱さず、自分の感性で場をやわらげること", "work": "感性が生かせて、自分のペースで進められる仕事", "jobs": ["デザイン", "美容", "ものづくり", "動物・自然に関わる仕事"]}, "INFP": {"want": "自分の価値観を大切にできることと、心から共感できる目的", "effort": "人の気持ちに寄り添い、理想を言葉や形にすること", "work": "自分の信じることを、表現できる仕事", "jobs": ["ライター・創作", "福祉", "カウンセリング", "社会貢献の仕事"]}, "INTP": {"want": "気になることをとことん考え抜ける自由と、知的な刺激", "effort": "物事の仕組みを分析し、矛盾を見つけて正すこと", "work": "考えること自体が仕事になる場所", "jobs": ["研究・開発", "プログラマー", "データ分析", "専門職"]}, "ESTP": {"want": "体を動かしてすぐ結果が出る刺激と、その場の勝負", "effort": "迷わず行動し、目の前のチャンスをつかむこと", "work": "スピードと行動力が、そのまま成果になる仕事", "jobs": ["営業", "イベント", "スポーツ関係", "起業"]}, "ESFP": {"want": "人と楽しさを分かち合うことと、今この瞬間を味わうこと", "effort": "場を明るくして、みんなを楽しませること", "work": "人と直接関わり、喜ぶ顔が見られる仕事", "jobs": ["接客・販売", "エンタメ", "保育", "美容"]}, "ENFP": {"want": "ワクワクする可能性と、人とつながる喜び", "effort": "アイデアを出し、人を巻き込んで新しいことを始めること", "work": "新しい企画や、人との出会いが多い仕事", "jobs": ["企画・広報", "マーケティング", "教育", "クリエイティブ"]}, "ENTP": {"want": "新しいアイデアを試す自由と、知的な議論", "effort": "常識を疑い、別の角度から突破口を見つけること", "work": "変化が多く、アイデアで勝負できる仕事", "jobs": ["新規事業", "コンサルタント", "企画", "起業"]}, "ESTJ": {"want": "物事を整理して前に進める手応えと、責任ある役割", "effort": "段取りを組み、人をまとめて結果を出すこと", "work": "組織を動かし、成果が数字で見える仕事", "jobs": ["管理職", "プロジェクト管理", "営業マネージャー", "行政"]}, "ESFJ": {"want": "みんなが仲よく過ごせる場と、感謝される喜び", "effort": "人と人をつなぎ、場の調和を保つこと", "work": "チームや地域の人と関わり、まとめ役になれる仕事", "jobs": ["人事・総務", "教育", "医療・福祉", "接客リーダー"]}, "ENFJ": {"want": "人の可能性を引き出すことと、信頼でつながる関係", "effort": "人を励まし、チームを目標に向けてまとめること", "work": "人を育て、導く役割の仕事", "jobs": ["教師・講師", "人事・研修", "コーチ", "広報"]}, "ENTJ": {"want": "大きな目標に向けて人と物事を動かすことと、任される裁量", "effort": "決断し、効率よく人を動かして成果を出すこと", "work": "決定権があり、大きな成果を目指せる仕事", "jobs": ["経営・管理職", "コンサルタント", "起業", "プロジェクトリーダー"]}}, "gap": {"IE": {"axis": "エネルギー", "from": "内向型", "to": "外向型", "worry": "人と会ったあと、楽しかったのにどっと疲れる。予定がないと落ち着かない気がして、休みの日まで埋めている。", "work": "人前に立つ役割や、ずっと人とやりとりする働き方で評価されているかもしれません。でも本当のあなたの力が出るのは、ひとりで集中できる時間がある仕事です。", "key": "週に一度は、誰とも話さない時間を先に予定に入れる。"}, "EI": {"axis": "エネルギー", "from": "外向型", "to": "内向型", "worry": "なんとなく元気が出ない、やる気がわかない。ひとりで考えこむ時間が増えている。", "work": "黙々と進める働き方に慣れたかもしれません。でも本当のあなたは、人とのやりとりで力が出る人。人と話す機会の多い役割で、本来の元気が戻るかもしれません。", "key": "気の合う人と会う予定を、ひとつだけ入れる。"}, "SN": {"axis": "ものの見方", "from": "現実型", "to": "直感型", "worry": "アイデアや将来の話は浮かぶのに、地に足がついていないような不安がある。", "work": "企画や構想を考える役割をこなしているかもしれません。でも本当のあなたは、事実や手順を積み上げるのが得意な人。具体的な成果が見える仕事のほうが、安心して力を出せます。", "key": "頭の中の計画を、今日できる一歩に書き出す。"}, "NS": {"axis": "ものの見方", "from": "直感型", "to": "現実型", "worry": "毎日が決まった作業のくり返しで、物足りなさや息苦しさを感じる。", "work": "正確さや手順を求められる仕事をこなせているかもしれません。でも本当のあなたは「この先どうなるか」を考える人。企画や新しい取り組みに関われると、生き生きします。", "key": "仕事と関係のない「もしも」の空想に、10分使う。"}, "TF": {"axis": "判断のしかた", "from": "思考型", "to": "感情型", "worry": "人に合わせたあとで「本当はこう言いたかった」とモヤモヤする。決めきれない自分に疲れている。", "work": "気配りや調整役で頼られているかもしれません。でも本当のあなたは、筋道を立てて判断する人。根拠をもとに決められる立場のほうが、迷わず働けます。", "key": "大事なことは、良い点と悪い点を紙に書いてから決める。"}, "FT": {"axis": "判断のしかた", "from": "感情型", "to": "思考型", "worry": "合理的にふるまうほど、心が置いてきぼりになっている気がする。", "work": "数字や効率で評価される働き方をしているかもしれません。でも本当のあなたは、人の気持ちを大切にする人。誰かの役に立つ実感がある仕事で、心が満たされます。", "key": "今日は「正しいか」より「好きか」で、ひとつ選ぶ。"}, "JP": {"axis": "行動のしかた", "from": "計画型", "to": "柔軟型", "worry": "自由に動いているのに、決まっていない不安や焦りがずっとある。", "work": "臨機応変さを求められる職場に慣れたかもしれません。でも本当のあなたは、見通しを立てて着実に進める人。先の予定が見える仕事のほうが、安心して力を出せます。", "key": "ざっくりでいいので、1週間の予定を先に決める。"}, "PJ": {"axis": "行動のしかた", "from": "柔軟型", "to": "計画型", "worry": "きっちりこなしているのに、ときどき全部投げ出したくなる。", "work": "段取りや管理を任されているかもしれません。でも本当のあなたは、状況を見て柔軟に動ける人。自分で進め方を決められる、変化のある仕事のほうが力を発揮できます。", "key": "予定のない日を、先にカレンダーに入れておく。"}, "AT": {"axis": "心の構え", "from": "自己主張型", "to": "慎重型", "worry": "本当は自分で決めて進みたいのに、人の目や評価が気になって動けなくなる。決めたあとも「これでよかったかな」と何度も考えてしまう。", "work": "まわりに合わせる慎重さで評価されているかもしれません。でも本当のあなたは、自分の判断で前に進める人。任せてもらえる範囲がある仕事のほうが、力を出せます。", "key": "今日は1つだけ、人に相談せずに自分で決めてみる。"}, "TA": {"axis": "心の構え", "from": "慎重型", "to": "自己主張型", "worry": "強気でいるのが当たり前になって、本当は不安なことも人に言えなくなっている。", "work": "決断力や押しの強さで頼られているかもしれません。でも本当のあなたは、まわりをよく見て慎重に進める人。準備や確認に時間をかけられる仕事のほうが、安心して力を出せます。", "key": "不安なことを1つだけ、信頼できる人に話してみる。"}}, "same": {"worry": "本当の自分と今の自分が一致しています。悩みがあるとしたら、性格のせいではなく、環境や人間関係のほうに原因があるかもしれません。", "work": "今の働き方が、本当のあなたに合っている可能性が高いです。迷ったときは、自分の感覚を信じて大丈夫。", "key": "「自分らしくない」と感じる場面を、ひとつだけ書き出してみる。"}, "letter": {"E": "人と関わって元気になる", "I": "ひとりの時間で元気になる", "S": "事実や経験を頼りにする", "N": "ひらめきや可能性を頼りにする", "T": "筋道を立てて決める", "F": "気持ちを大切にして決める", "J": "見通しを立てて進める", "P": "状況に合わせて柔軟に動く", "AT_A": "自分の判断を信じて進める", "AT_T": "まわりをよく見て慎重に動く"}}, "TD": {"themes": {"比肩": {"who": "born", "title": "自分らしさが強まる日", "lines": ["今日はきみの「生まれつきの {B}」がいちばん元気な日。人に合わせるより、自分のペースでいこう。", "まわりの意見より、きみの「なんとなくこっち」が当たる日だよ。", "今日は無理にキャラを作らなくていい日。素のままのきみが、いちばん話しやすいって思われてる。"], "tip": "ひとりで決めていいことは、ひとりで決める"}, "劫財": {"who": "born", "title": "負けず嫌いが顔を出す日", "lines": ["今日はちょっと張り合いたくなる日。そのやる気、勝負より自分の記録更新に使ってみて。", "誰かと比べてモヤっとしたら、それは生まれつきのきみの闘争心。悪いことじゃないよ。", "今日は「ゆずらない」が出やすい日。大事なところだけゆずらなければ、あとは笑ってゆずろう。"], "tip": "人と比べたくなったら、昨日の自分と比べる"}, "食神": {"who": "born", "title": "楽しむほど運がいい日", "lines": ["今日はゆるんでいい日。おいしいものを食べると、生まれつきのきみが元気になるよ。", "がんばるより、楽しんだほうがうまくいく日。予定にひとつ「ごほうび」を入れておこう。", "今日のきみは、いるだけで場がなごむ日。気の合う人に連絡してみて。"], "tip": "今日だけは、ごほうびを先に"}, "傷官": {"who": "born", "title": "感性が鋭くなる日", "lines": ["今日は勘がさえる日。ただし言葉も鋭くなりがち。言う前に、ひと呼吸ね。", "違和感に気づきやすい日。それ、たぶん当たってる。伝え方だけ、やわらかく。", "今日のきみはセンスが光る日。服でも文章でも、こだわったぶんだけ伝わるよ。"], "tip": "送信ボタンを押す前に、一回読み返す"}, "偏財": {"who": "now", "title": "人とのつながりが広がる日", "lines": ["今日は「今のきみ」が活躍する日。誘われたら、とりあえず乗ってみて。", "寄り道に当たりがある日。いつもと違う道、違うお店を選んでみよう。", "今日は人づきあいが楽しい日。久しぶりの人に、ひと言送ってみて。"], "tip": "誘いには、まず「いいね」と返す"}, "正財": {"who": "now", "title": "コツコツが実る日", "lines": ["今日は「今のきみ」の真面目さが報われる日。地味な作業ほど、あとで効いてくるよ。", "お金や時間の使い方が整う日。レシートや予定表、ちょっと見直してみて。", "今日は約束を守るきみが信頼される日。小さな約束ほど大事にしよう。"], "tip": "後回しにしていた小さな用事を、ひとつ片づける"}, "偏官": {"who": "now", "title": "急な展開に強い日", "lines": ["今日はバタバタしやすい日。でも「今のきみ」は、こういう日にこそ強いんだ。", "急な頼まれごとが来るかも。全部は引き受けなくていい。いちばん大事なひとつだけ。", "今日は行動力が上がる日。迷っていたことは、とりあえず一歩だけ進めてみて。"], "tip": "迷ったら、5分だけ手をつける"}, "正官": {"who": "now", "title": "きちんとさが評価される日", "lines": ["今日は「今のきみ」ががんばって身につけた力が、ちゃんと見てもらえる日。", "ルールや段取りを守るほど、うまくいく日。いつもより5分早めに動こう。", "今日は誰かに頼られる日。期待に応えたら、帰り道に自分もほめてあげてね。"], "tip": "いつもより5分早く動く"}, "偏印": {"who": "born", "title": "ひらめきが降りてくる日", "lines": ["今日は生まれつきのきみの「ひらめき」がさえる日。思いついたことはメモしておいて。", "ひとりの時間がいちばん充電になる日。予定を詰めすぎないでね。", "今日は人と違う考えが浮かぶ日。それ、たぶん面白いから、あとで誰かに話してみて。"], "tip": "思いつきを、スマホのメモに残す"}, "印綬": {"who": "now", "title": "学びと助けに恵まれる日", "lines": ["今日は「今のきみ」が人から助けてもらえる日。ひとりで抱えないで、頼っていいよ。", "新しいことが頭に入りやすい日。気になっていた本や動画、今日なら進むよ。", "今日は先輩や家族の言葉にヒントがある日。ちょっと聞いてみて。"], "tip": "わからないことを、ひとつ人に聞く"}}, "power": {"high": {"label": "パワー 強め", "stars": 3, "add": "エネルギーは満タン。今日やりたいことは、今日やろう。"}, "mid": {"label": "パワー ふつう", "stars": 2, "add": "エネルギーはほどほど。いつものペースでちょうどいい日。"}, "low": {"label": "パワー ひかえめ", "stars": 1, "add": "エネルギーは省エネモード。早めに寝るのが、今日いちばんの開運。"}}}, "I18N": {}}, "en": {"BODY": "<div class=\"page\">\n  <header class=\"bar\">\n    <div class=\"logo\"><span class=\"en\">16TYPE<em>+</em></span><span class=\"jp\">16 Type Plus</span></div>\n    <nav class=\"lang\" aria-label=\"Language\"><a href=\"#\">日本語</a><a href=\"#\" aria-current=\"true\">EN</a><a href=\"#\">한국어</a></nav>\n  </header>\n  <p class=\"note\">Design sample (the test really works)</p>\n\n  <section class=\"card invbar\" id=\"invBar\" hidden>\n    <img id=\"invImg\" alt=\"Buddy character of the person who sent this\">\n    <div><p class=\"eyebrow\">You've received a compatibility check</p><p class=\"invt\"><b id=\"invWho\"></b> (<span id=\"invPair\"></span>) sent you this. Once you finish your test, you'll see how well you two match.</p></div>\n  </section>\n\n  <section class=\"card intro\">\n    <p class=\"eyebrow\">Beyond your 16 type</p>\n    <h1>Is your 16 type<br>the one you were <em>born with</em>?</h1>\n    <p>Your 16-type result is \"your current self,\" which quietly changes with your surroundings and experiences. Your birth date shows \"your true self,\" which never changes. Knowing the gap between the two gives you hints that make work and relationships a little easier.</p>\n    <div class=\"eq\" aria-hidden=\"true\"><span>Your current self<small>16 type</small></span><b>+</b><span>Your true self<small>Birth date</small></span></div>\n  </section>\n\n  <section class=\"card how\">\n    <h2>What makes these questions different</h2>\n    <ol class=\"howl\">\n      <li><b>No vague questions</b><span>Instead of \"What kind of person are you?\", we ask about real moments: \"Did you do this lately?\" You get the you of today, not the you that you wish to be.</span></li>\n      <li><b>No \"neither\" option</b><span>You answer on a 6-point scale, so you always lean a little one way. No more getting stuck in the middle.</span></li>\n      <li><b>The same thing, asked from both sides</b><span>Like \"Being with people energizes me\" and \"Time alone calms me,\" half the questions point the opposite way. This cancels out the habit of just saying \"yes.\"</span></li>\n      <li><b>We also measure how much you \"waver\"</b><span>If your answers to opposite questions don't line up, that letter shows as \"tends to waver\" in your result. It explains why your 16 type keeps changing.</span></li>\n      <li><b>Clear answers finish early</b><span>You first answer 6 questions per scale. Only where your answers land near the middle do we ask more to make sure. If you're clear-cut, it's 30 questions; the more you waver, the more carefully we ask (up to 60).</span></li>\n      <li><b>Compared with the 5 letters you were born with</b><span>We line up your original 5 letters from your birth date and show what has changed.</span></li>\n    </ol>\n  </section>\n\n  <section class=\"card\" id=\"formCard\" aria-labelledby=\"formh\">\n    <h2 id=\"formh\">Start the test</h2>\n    <div class=\"field\">\n      <span class=\"lbl\">① Birth date</span>\n      <div class=\"date\">\n        <select id=\"y\" aria-label=\"Year\"></select><select id=\"m\" aria-label=\"Month\"></select><select id=\"d\" aria-label=\"Day\"></select>\n      </div>\n    </div>\n    <div class=\"field\">\n      <span class=\"lbl\">② Have you ever taken a 16-type test?</span>\n      <div class=\"fork\">\n        <button type=\"button\" class=\"opt\" id=\"hasType\" aria-pressed=\"false\"><b>Yes, I remember it</b><small><span>Just pick 4 letters</span><span>About 30 sec</span></small></button>\n        <button type=\"button\" class=\"opt\" id=\"quiz\"><b>No, or I forgot</b><small><span>Take 30–60 questions</span><span>About 5–10 min</span></small></button>\n      </div>\n    </div>\n    <div class=\"field\" id=\"pickField\" hidden>\n      <span class=\"lbl\">③ Pick the type you got</span>\n      <div class=\"slots\" id=\"slots\" aria-live=\"polite\"></div>\n      <p class=\"slotname\" id=\"slotName\"></p>\n      <div class=\"picker\" id=\"picker\"></div>\n      <div class=\"atpick\" id=\"atPick\" role=\"group\" aria-label=\"Last letter (A/T)\">\n        <span class=\"atl\">If you also got a last letter (A/T)</span>\n        <div class=\"atb\"><button type=\"button\" data-v=\"A\" aria-pressed=\"false\">A<small>Assertive</small></button><button type=\"button\" data-v=\"T\" aria-pressed=\"false\">T<small>Cautious</small></button><button type=\"button\" data-v=\"\" aria-pressed=\"true\" class=\"unk\">Not sure</button></div>\n      </div>\n      <p class=\"hint\">A result from any other site or app is fine. If you're unsure, use your most recent one.</p>\n      <button class=\"btn primary\" type=\"button\" id=\"go\">See results</button>\n    </div>\n  </section>\n\n  <section class=\"card quiz\" id=\"quizCard\" hidden aria-live=\"polite\">\n    <div class=\"qtop\"><span class=\"qcount\" id=\"qCount\">1 / 32</span><button type=\"button\" class=\"qlink\" id=\"qBack\">← Back</button></div>\n    <div class=\"qprog\"><span id=\"qProg\"></span></div>\n    <p class=\"qnote\" id=\"qNote\">Answer as <b>you've been over the last 3 months</b>, not as your ideal self. Some questions point the opposite way. Don't overthink it; go with your gut.</p>\n    <p class=\"qaxis\" id=\"qAxis\"></p>\n    <h2 class=\"qtext\" id=\"qText\"></h2>\n    <details class=\"qex\" id=\"qExW\"><summary>See an example</summary><p id=\"qEx\"></p></details>\n    <div class=\"qopts\" id=\"qOpts\"></div>\n    <button type=\"button\" class=\"qlink qquit\" id=\"qQuit\">Stop the test and pick a type</button>\n  </section>\n\n  <div id=\"result\" style=\"display:none\">\n  <section class=\"card hero\" aria-live=\"polite\">\n    <p class=\"eyebrow\" id=\"rSrc\">Your result</p>\n    <h2 class=\"story\" id=\"rStory\"></h2>\n    <div class=\"flip\" id=\"flip\" role=\"group\" aria-label=\"Tap the tiles to flip them\"></div>\n    <p class=\"fliphint\" id=\"flipHint\"></p>\n    <div class=\"revs\" id=\"revs\"></div>\n    <button class=\"btn flipall\" id=\"flipAll\" type=\"button\">Flip them all</button>\n    <div class=\"hgap pend\"><div class=\"hgtop\"><span class=\"hgl\">Gap score</span><span class=\"hgn\"><span id=\"gNum\">0</span>%</span><span class=\"hgw\" id=\"gLbl\"></span></div>\n      <div class=\"meter\" role=\"img\" id=\"gMeter\"><span id=\"gBar\"></span></div></div>\n    <p class=\"flipsum pend\" id=\"rSum\"></p>\n    <div class=\"nicks pend\">\n      <div class=\"nk born\"><span class=\"nl\">Born</span><span class=\"nn\" id=\"nkBorn\"></span><span class=\"p16\" id=\"p16Born\"></span></div>\n      <span class=\"nar\" aria-hidden=\"true\">→</span>\n      <div class=\"nk now\"><span class=\"nl\">Now</span><span class=\"nn\" id=\"nkNow\"></span><span class=\"p16\" id=\"p16Now\"></span></div>\n    </div>\n    <div class=\"karai hkarai pend\"><span class=\"kl\">A blunt one-liner</span><div id=\"ccKarai\"></div></div>\n    <div class=\"shr pend\"><button class=\"btn primary\" type=\"button\" id=\"shareBtn\">Share as an image</button></div>\n  </section>\n\n  <section class=\"card hcard\" id=\"hints\">\n    <p class=\"eyebrow\">Hints from your gap</p>\n    <div class=\"hcols cc\">\n      <div class=\"hc born\"><span class=\"hl\">Your true self <b id=\"hBornT\"></b></span><span class=\"hs\">What you're looking for</span><p id=\"hWant\"></p></div>\n      <div class=\"hc now\"><span class=\"hl\">You now <b id=\"hNowT\"></b></span><span class=\"hs\">What you're working hard at</span><p id=\"hEffort\"></p></div>\n    </div>\n    <h3 class=\"sech\"><span class=\"ico\" aria-hidden=\"true\">?</span>Hints for what's weighing on you</h3>\n    <p class=\"hq\" id=\"hWorryQ\">Has something like this been wearing you out lately?</p>\n    <div cla </div></div>\n    <p class=\"tddate\" id=\"tdDate\"></p>\n    <p class=\"tdtitle\" id=\"tdTitle\"></p>\n    <p class=\"bubble\" id=\"tdLine\"></p>\n    <div class=\"tdchips\"><span class=\"tdc\"><small>Side of you that shows today</small><b id=\"tdWho\"></b></span><span class=\"tdc\"><small id=\"tdPowL\"></small><b id=\"tdPow\"></b></span></div>\n    <p class=\"tdtip\"><span>Try this</span><b id=\"tdTip\"></b></p>\n    <p class=\"fine\" style=\"text-align:left\">Changes every day at midnight. It's based on the day you were born combined with today's date.</p>\n  </section>\n\n  <section class=\"card\" id=\"partner\">\n    <h2 id=\"partnerH\">You and that person</h2>\n    <div class=\"pres\" id=\"pRes\" hidden></div>\n    <div class=\"send\" id=\"send\">\n    <h3 class=\"sech\">Send it to someone and see your match</h3>\n    <p class=\"hint\" style=\"margin:-6px 0 14px\">When they open the link and take the test, you'll both see your match right away. Your birth date is not shared.</p>\n    <label class=\"lbl\" for=\"myName\">Your name (nickname)</label>\n    <input id=\"myName\" class=\"txt\" maxlength=\"12\" placeholder=\"e.g. Rie\" autocomplete=\"nickname\">\n    <button class=\"btn primary\" type=\"button\" id=\"mkLink\">Create a link to send</button>\n    <div id=\"lnkBox\" class=\"lnkbox\" hidden>\n      <input id=\"lnk\" class=\"txt\" readonly aria-label=\"Link to send\">\n      <div class=\"lnkacts\"><a class=\"btn line\" id=\"lnkLine\" href=\"#\" target=\"_blank\" rel=\"noopener\">Send on LINE</a><button class=\"btn\" type=\"button\" id=\"cpLink\">Copy link</button></div>\n    </div>\n    </div>\n    <details class=\"pmore\" id=\"pForm\"><summary>Know their birth date? Check it right here</summary>\n    <p class=\"hint\" style=\"margin:-6px 0 12px\">Just their birth date is enough. If you know their 16 type too, you'll also see your \"current match.\"</p>\n    <div class=\"pf\">\n      <div class=\"opt-mini\"><select id=\"py\" aria-label=\"Their birth year\"></select><select id=\"pm\" aria-label=\"Their birth month\"></select><select id=\"pd\" aria-label=\"Their birth day\"></select></div>\n      <div class=\"opt-mini\"><select id=\"pt\" aria-label=\"Their 16 type\"><option value=\"\">Their 16 type (leave blank if unsure)</option></select></div>\n      <button class=\"btn\" type=\"button\" id=\"pGo\">See your match</button>\n    </div>\n    </details>\n  </section>\n\n  <div class=\"cta\">\n    <button class=\"qlink\" type=\"button\" id=\"reset\">Clear my result and start over</button>\n    <p class=\"fine\">16TYPE+ is an independent personality test, not affiliated with MBTI® or 16Personalities. Names in parentheses after a type (such as \"Protagonist\") are the names used by 16Personalities, shown for reference.</p>\n  </div>\n  </div>\n</div>\n", "D": {"NICK": {"INTJ": "Has the answer before speaking", "INTP": "Lost down a search rabbit hole", "ENTJ": "\"Fine, I'll decide\"", "ENTP": "\"But what if...\" on repeat", "INFJ": "Notices without being told", "INFP": "A movie theater in their head", "ENFJ": "Can't help taking care of people", "ENFP": "Excitement comes first", "ISTJ": "Turns it in before the deadline", "ISFJ": "Already helping before anyone asks", "ESTJ": "Makes the schedule first", "ESFJ": "Somehow always the organizer", "ISTP": "Touches it before reading the manual", "ISFP": "Picks whatever they love", "ESTP": "Moving before thinking", "ESFP": "Decides on a whim"}, "ARUARU": {"INTJ": ["Already knows the answer in meetings, but stays quiet", "Gets quietly annoyed when plans fall apart", "Would rather skip small talk and get to the point", "Works fastest on tasks they can finish alone", "Can't understand people who decide \"just because\""], "INTP": ["Starts looking something up and ends up somewhere else entirely", "Wants to ask, \"But how do we define that?\"", "Things they don't care about just won't stick", "Thinks more clearly at night", "Explanations tend to run long"], "ENTJ": ["Can't stand meetings count on when it matters."}, "ISFP": {"m": "ESFJ", "why": "Warmly supports you as you go at your own pace."}, "ESFJ": {"m": "ISFP", "why": "Easygoing and real, their honest sense of things is soothing."}}, "GAP_USE": {"IE": {"h": "充電｜内向き → 外向き に変身", "t": "ほんとうは一人で充電する人が、人と関わる力を装備した状態。人前のあとにどっと疲れるのは、気のせいじゃなく装備の重さです。予定のあとに“ひとり時間”を確保すると、回復が一気に速くなります。"}, "EI": {"h": "充電｜外向き → 内向き に変身", "t": "ほんとうは人といて充電する人が、今はひとりモード。最近なんとなく元気が出ないなら、原因は“人との時間の不足”かも。気のおけない人と会う予定をひとつ入れるだけで、驚くほど復活します。"}, "SN": {"h": "見方｜現実派 → 直感派 に変身", "t": "地に足のついた現実派が、ひらめきで動く力を獲得。アイデアが浮かんでも「ほんとに大丈夫？」と不安になるのは、素の現実感覚が生きている証拠。ひらめきを素の現実力で検算すれば最強です。"}, "NS": {"h": "見方｜直感派 → 現実派 に変身", "t": "本来ひらめき型のあなたが、現実的にふるまう力を装備。ときどき無性に“夢の話”がしたくなるのは、素の顔の呼吸です。空想の時間はサボりじゃなく、あなたの充電です。"}, "TF": {"h": "決め方｜論理派 → 共感派 に変身", "t": "本来スジで決める人が、人に合わせて受け止める力を獲得。合わせたあとに「本音を言えばよかった」とモヤモヤしやすいタイプ。大事な決断だけは、素のロジックに戻って決めると後悔しません。"}, "FT": {"h": "決め方｜共感派 → 論理派 に変身", "t": "本来は気持ちで決める人が、冷静に判断する鎧を装備。クールに見えて、内側では感情がちゃんと動いています。ときどき“好きか嫌いか”だけで選ぶと、心の疲れがすっと取れます。"}, "JP": {"h": "動き方｜計画派 → 自由派 に変身", "t": "本来は計画派なのに、流れに乗る柔軟さを獲得。自由に見えて、心のどこかで“決まっていない不安”を感じやすい人です。ざっくりでも予定を置くと、安心して楽しめます。"}, "PJ": {"h": "動き方｜自由派 → 計画派 に変身", "t": "本来は自由派なのに、段取りの力を身につけた人。きっちりこなせるのに、たまに全部投げ出したくなるのはこのせい。“予定のない日”を先にカレンダーに入れておくのがコツです。"}}, "COLOR": {"INTJ": {"name": "深い藍", "hex": "#27406B", "line": "夜明け前の藍。静かに全体を見渡す色。"}, "INTP": {"name": "アイスブルー", "hex": "#79B6D9", "line": "澄んだ氷の青。思考が透きとおる色。"}, "ENTJ": {"name": "クリムゾン", "hex": "#C8102E", "line": "燃える深紅。目標へ突き進む色。"}, "ENTP": {"name": "エレクトリックオレンジ", "hex": "#FF6A2C", "line": "火花のオレンジ。刺激を生み出す色。"}, "INFJ": {"name": "アメジスト", "hex": "#6A4C93", "line": "神秘の紫。静かな理想を秘めた色。"}, "INFP": {"name": "ラベンダー", "hex": "#B79CE0", "line": "淡い藤色。やさしく夢みる色。"}, "ENFJ": {"name": "コーラル", "hex": "#FF8364", "line": "夕日のコーラル。人を照らすあたたかな色。"}, "ENFP": {"name": "ビビッドイエロー", "hex": "#FFD23F", "line": "弾ける黄色。その場を明るくする色。"}, "ISTJ": {"name": "ディープグリーン", "hex": "#2F6B5E", "line": "落ち着いた深緑。ぶれない芯の色。"}, "ISFJ": {"name": "ソフトピーチ", "hex": "#F4C9A8", "line": "やわらかな桃色。そっと包む色。"},
