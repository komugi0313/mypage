왔어요.당신의 검사가 끝나면 두 사람의 궁합을 알 수 있어요.</p></div>\n  </section>\n\n  <section class=\"card intro\">\n    <p class=\"eyebrow\">16타입, 그다음으로</p>\n    <h1>그 16타입,<br><em>타고난</em> 건가요?</h1>\n    <p>16타입 결과는 환경과 경험 속에서 어느새 바뀌어 가는 '지금의 나'예요. 생년월일로 알 수 있는 건 계속 변하지 않는 '본래의 나'예요. 둘의 차이를 알면 일과 인간관계가 조금 편해지는 힌트가 보여요.</p>\n    <div class=\"eq\" aria-hidden=\"true\"><span>지금의 나<small>16타입</small></span><b>+</b><span>본래의 나<small>생년월일</small></span></div>\n  </section>\n\n  <section class=\"card how\">\n    <h2>이 검사의 질문은 여기가 달라요</h2>\n    <ol class=\"howl\">\n      <li><b>애매한 질문을 하지 않아요</b><span>'당신은 어떤 사람인가요?'가 아니라 '최근에 이렇게 했나요?'처럼 구체적인 상황으로 물어요. 되고 싶은 내가 아니라 지금의 내가 나와요.</span></li>\n      <li><b>'보통이다'를 없앴어요</b><span>6단계로 답하기 때문에 반드시 어느 한쪽으로 조금은 기울어요. 가운데만 골라서 결과가 안 나오는 일이 없어요.</span></li>\n      <li><b>같은 걸 방향을 바꿔서 물어요</b><span>'사람들과 있으면 힘이 난다'와 '혼자만의 시간에 마음이 편해진다'처럼 반대 방향의 질문을 반씩 섞어서, 별생각 없이 '네'라고 답하는 습관을 상쇄해요.</span></li>\n      <li><b>답의 '흔들림'도 측정해요</b><span>방향을 바꾼 질문끼리 답이 엇갈리면, 그 글자는 '흔들리기 쉬움'으로 결과에 표시해요. 16타입이 매번 바뀌는 이유가 보여요.</span></li>\n      <li><b>뚜렷한 지표는 일찍 끝나요</b><span>먼저 지표마다 6문항씩 답하고, 답이 가운데에 가까운 지표만 문항을 더해서 확인해요. 뚜렷한 사람은 30문항, 망설이는 사람일수록 꼼꼼하게 물어봐요(최대 60문항).</span></li>\n      <li><b>타고난 5글자와 비교해요</b><span>생년월일로 구한 본래의 5글자와 나란히 놓고, 어디가 바뀌었는지 살펴봐요.</span></li>\n    </ol>\n  </section>\n\n  <section class=\"card\" id=\"formCard\" aria-labelledby=\"formh\">\n    <h2 id=\"formh\">검사 시작하기</h2>\n    <div class=\"field\">\n      <span class=\"lbl\">① 생년월일</span>\n      <div class=\"date\">\n        <select id=\"y\" aria-label=\"연도\"></select><select id=\"m\" aria-label=\"월\"></select><select id=\"d\" aria-label=\"일\"></select>\n      </div>\n    </div>\n    <div class=\"field\">\n      <span class=\"lbl\">② 16타입 검사를 해 본 적이 있나요?</span>\n      <div class=\"fork\">\n        <button type=\"button\" class=\"opt\" id=\"hasType\" aria-pressed=\"false\"><b>있어요 · 기억나요</b><small><span>4글자만 고르면 끝</span><span>약 30초</span></small></button>\n        <button type=\"button\" class=\"opt\" id=\"quiz\"><b>없어요 · 까먹었어요</b><small><span>30~60문항으로 검사</span><span>약 5~10분</span></small></button>\n      </div>\n    </div>\n    <div class=\"field\" id=\"pickField\" hidden>\n      <span class=\"lbl\">③ 그때 나온 타입을 골라 주세요</span>\n      <div class=\"slots\" id=\"slots\" aria-live=\"polite\"></div>\n      <p class=\"slotname\" id=\"slotName\"></p>\n      <div class=\"picker\" id=\"picker\"></div>\n      <div class=\"atpick\" id=\"atPick\" role=\"group\" aria-label=\"마지막 1글자 (A/T)\">\n        <span class=\"atl\">마지막 1글자(A/T)까지 나왔다면</span>\n        <div class=\"atb\"><button type=\"button\" data-v=\"A\" aria-pressed=\"false\">A<small>자기주장형</small></button><button type=\"button\" data-v=\"T\" aria-pressed=\"false\">T<small>신중형</small></button><button type=\"button\" data-v=\"\" aria-pressed=\"true\" class=\"unk\">몰라요</button></div>\n      </div>\n      <p class=\"hint\">다른 사이트나 앱에서 나온 결과도 괜찮아요. 헷갈리면 가장 최근 결과로 골라 주세요.</p>\n      <button class=\"btn primary\" type=\"button\" id=\"go\">결과 보기</button>\n    </div>\n  </section>\n\n  <section class=\"card quiz\" id=\"quizCard\" hidden aria-live=\"polite\">\n    <div class=\"qtop\"><span class=\"qcount\" id=\"qCount\">1 / 32</span><button type=\"button\" class=\"qlink\" id=\"qBack\">← 이전</button></div>\n    <div class=\"qprog\"><span id=\"qProg\"></span></div>\n    <p class=\"qnote\" id=\"qNote\">이상적인 내가 아니라 <b>최근 3개월의 나</b>를 기준으로 답해 주세요. 반대 방향의 질문도 섞여 있어요. 너무 고민하지 말고 직감으로 골라 주세요.</p>\n    <p class=\"qaxis\" id=\"qAxis\"></p>\n    <h2 class=\"qtext\" id=\"qText\"></h2>\n    <details class=\"qex\" id=\"qExW\"><summary>예시 보기</summary><p id=\"qEx\"></p></details>\n    <div class=\"qopts\" id=\"qOpts\"></div>\n    <button type=\"button\" class=\"qlink qquit\" id=\"qQuit\">검사를 그만두고 타입 고르기</button>\n  </section>\n\n  <div id=\"result\" style=\"display:none\">\n  <section class=\"card hero\" aria-live=\"polite\">\n    <p class=\"eyebrow\" id=\"rSrc\">당신의 검사 결과</p>\n    <h2 class=\"story\" id=\"rStory\"></h2>\n    <div class=\"flip\" id=\"flip\" role=\"group\" aria-label=\"타일을 탭해서 뒤집기\"></div>\n    <p class=\"fliphint\" id=\"flipHint\"></p>\n    <div class=\"revs\" id=\"revs\"></div>\n    <button class=\"btn flipall\" id=\"flipAll\" type=\"button\">한꺼번에 뒤집기</button>\n    <div class=\"hgap pend\"><div class=\"hgtop\"><span class=\"hgl\">갭 지수</span><span class=\"hgn\"><span id=\"gNum\">0</span>%</span><span class=\"hgw\" id=\"gLbl\"></span></div>\n      <div class=\"meter\" role=\"img\" id=\"gMeter\"><span id=\"gBar\"></span></div></div>\n    <p class=\"flipsum pend\" id=\"rSum\"></p>\n    <div class=\"nicks pend\">\n      <div class=\"nk born\"><span class=\"nl\">타고난</span><span class=\"nn\" id=\"nkBorn\"></span><span class=\"p16\" id=\"p16Born\"></span></div>\n      <span class=\"nar\" aria-hidden=\"true\">→</span>\n      <div class=\"nk now\"><span class=\"nl\">지금</span><span class=\"nn\" id=\"nkNow\"></span><span class=\"p16\" id=\"p16Now\"></span></div>\n    </div>\n    <div class=\"karai hkarai pend\"><span class=\"kl\">매운 한마디</span><div id=\"ccKarai\"></div></div>\n    <div class=\"shr pend\"><button class=\"btn primary\" type=\"button\" id=\"shareBtn\">이미지로 공유하기</button></div>\n  </section>\n\n  <section class=\"card hcard\" id=\"hints\">\n    <p class=\"eyebrow\">갭에서 보이는 힌트</p>\n    <div class=\"hcols cc\">\n      <div class=\"hc born\"><span class=\"hl\">본래의 당신 <b id=\"hBornT\"></b></span><span class=\"hs\">바라는 것</span><p id=\"hWant\"></p></div>\n      <div class=\"hc now\"><span class=\"hl\">지금의 당신 <b id=\"hNowT\"></b></span><span class=\"hs\">애쓰고 있는 것</span><p id=\"hEffort\"></p></div>\n    </div>\n    <h3 class=\"sech\"><span class=\"ico\" aria-hidden=\"true\">?</span>고민 힌트</h3>\n    <p class=\"hq\" id=\"hWorryQ\">요즘 이런 일로 지쳐 있진 않나요?</p>\n    <div class=\"hw\" id=\"hWorry\"></div>\n    <details class=\"pmore hwk\"><summary><span class=\"sech\"><span class=\"ico\" aria-hidden=\"true\">◆</span>일 힌트</span></summary>\n    <div class=\"hw\" id=\"hWork\"></div>\n    <div class=\"hjob\"><span class=\"hs\">본래의 당신이 만족을 느끼기 쉬운 건</span><p id=\"hJobW\"></p><ul class=\"tags\" id=\"hJobs\"></ul></div>\n    </details>\n  </section>\n\n  <section class=\"card persona\" id=\"persona\">\n    <div class=\"ptabs\" role=\"tablist\"><button type=\"button\" role=\"tab\" id=\"pNow\" aria-selected=\"true\"></button><button type=\"button\" role=\"tab\" id=\"pBorn\" aria-selected=\"false\"></button></div>\n    <p class=\"pcode\" id=\"psCode\"></p>\n    <h2 class=\"pcatch\" id=\"psCatch\"></h2>\n    <p class=\"pov\" id=\"psOv\"></p>\n    <h3 class=\"psh\" id=\"aruH\"></h3><ul class=\"tags aru\" id=\"aru\"></ul>\n    <details class=\"pmore\"><summary>강점</summary><ul class=\"plist good\" id=\"psStr\"></ul></details>\n    <details class=\"pmore\"><summary>걸려 넘어지기 쉬운 부분</summary><ul class=\"plist care\" id=\"psPit\"></ul><p class=\"pat\" id=\"psAT\"></p></details>\n    <details class=\"pmore\"><summary>인간관계</summary><p id=\"psRel\"></p></details>\n    <details class=\"pmore\"><summary>연애</summary><p id=\"psLove\"></p></details>\n    <details class=\"pmore\"><summary>일</summary><p id=\"psWork\"></p><ul class=\"tags\" id=\"psJobs\"></ul></details>\n    <details class=\"pmore\"><summary>잘 맞는 타입</summary><div class=\"compat\"><span class=\"t\" id=\"cT\"></span><p id=\"cW\"></p></div></details>\n    <details class=\"pmore\"><summary>성장 힌트</summary><p id=\"psGrow\"></p></details>\n  </section>\n\n  <section class=\"card today\" id=\"today\">\n    <div class=\"tdintro\"><img id=\"tdImg\" alt=\"당신의 단짝 캐릭터\"><div><p class=\"eyebrow\">당신의 단짝</p><p class=\"tdlead\">태어난 날로 정해지는 60명의 단짝. 매일 다른 한마디를 건네줘요.</p></div></div>\n    <p class=\"tddate\" id=\"tdDate\"></p>\n    <p class=\"tdtitle\" id=\"tdTitle\"></p>\n    <p class=\"bubble\" id=\"tdLine\"></p>\n    <div class=\"tdchips\"><span class=\"tdc\"><small>잘 드러나는 나</small><b id=\"tdWho\"></b></span><span class=\"tdc\"><small id=\"tdPowL\"></small><b id=\"tdPow\"></b></span></div>\n    <p class=\"tdtip\"><span>추천</span><b id=\"tdTip\"></b></p>\n    <p class=\"fine\" style=\"text-align:left\">매일 자정에 바뀌어요. 태어난 날과 그날의 달력 조합으로 정해져요.</p>\n  </section>\n\n  <section class=\"card\" id=\"partner\">\n    <h2 id=\"partnerH\">그 사람과의 궁합</h2>\n    <div class=\"pres\" id=\"pRes\" hidden></div>\n    <div class=\"send\" id=\"send\">\n    <h3 class=\"sech\">그 사람에게 보내서 궁합 보기</h3>\n    <p class=\"hint\" style=\"margin:-6px 0 14px\">상대가 링크를 열고 검사하면 두 사람의 궁합을 바로 알 수 있어요. 당신의 생년월일은 보내지 않아요.</p>\n    <label class=\"lbl\" for=\"myName\">당신의 이름 (닉네임)</label>\n    <input id=\"myName\" class=\"txt\" maxlength=\"12\" placeholder=\"예: 지수\" autocomplete=\"nickname\">\n    <button class=\"btn primary\" type=\"button\" id=\"mkLink\">보낼 링크 만들기</button>\n    <div id=\"lnkBox\" class=\"lnkbox\" hidden>\n      <input id=\"lnk\" class=\"txt\" readonly aria-label=\"보낼 링크\">\n      <div class=\"lnkacts\"><a class=\"btn line\" id=\"lnkLine\" href=\"#\" target=\"_blank\" rel=\"noopener\">LINE으로 보내기</a><button class=\"btn\" type=\"button\" id=\"cpLink\">링크 복사</button></div>\n    </div>\n    </div>\n    <details class=\"pmore\" id=\"pForm\"><summary>상대의 생년월일을 안다면 여기서 바로 보기</summary>\n    <p class=\"hint\" style=\"margin:-6px 0 12px\">생년월일만 있으면 OK. 16타입도 알면 '지금의 궁합'도 나와요.</p>\n    <div class=\"pf\">\n      <div class=\"opt-mini\"><select id=\"py\" aria-label=\"상대의 태어난 해\"></select><select id=\"pm\" aria-label=\"상대의 태어난 달\"></select><select id=\"pd\" aria-label=\"상대의 태어난 날\"></select></div>\n      <div class=\"opt-mini\"><select id=\"pt\" aria-label=\"상대의 16타입\"><option value=\"\">상대의 16타입 (모르면 비워 두세요)</option></select></div>\n      <button class=\"btn\" type=\"button\" id=\"pGo\">궁합 보기</button>\n    </div>\n    </details>\n  </section>\n\n  <div class=\"cta\">\n    <button class=\"qlink\" type=\"button\" id=\"reset\">결과를 지우고 처음부터 다시 하기</button>\n    <p class=\"fine\">16TYPE+ 는 독자적인 성격 검사예요. MBTI®, 16Personalities와는 관계가 없어요. 타입명 괄호 안의 이름('선도자' 등)은 16Personalities에서 쓰는 이름을 참고로 표시한 거예요.</p>\n  </div>\n  </div>\n</div>\n", "D": {"NICK": {"INTJ": "말하기 전에 결론 나 있는 타입", "INTP": "정신 차려 보면 검색 삼매경 타입", "ENTJ": "그럼 내가 정할게 타입", "ENTP": "'근데 반대로'가 입버릇인 타입", "INFJ": "말 안 해도 알아채는 타입", "INFP": "머릿속이 영화관인 타입", "ENFJ": "자꾸 챙겨 주게 되는 타입", "ENFP": "설렘이 최우선인 타입", "ISTJ": "마감보다 먼저 내는 타입", "ISFJ": "어느새 움직이고 있는 타입", "ESTJ": "일단 계획표부터 짜는 타입", "ESFJ": "어느새 총무 맡는 타입", "ISTP": "설명보다 먼저 만져 보는 타입", "ISFP": "좋아! 로 고르는 타입", "ESTP": "생각하기 전에 움직이는 타입", "ESFP": "분위기 타서 정해 버리는 타입"}, "ARUARU": {"INTJ": ["회의 중에 이미 결론은 나 있는데 말을 안 해요", "계획이 틀어지면 속으로 꽤 짜증 나요", "스몰토크보다 본론으로 들어가고 싶어요", "혼자서 끝낼 수 있는 일이 제일 빨라요", "'그냥'으로 정하는 사람이 이해가 안 돼요"], "INTP": ["검색하다 보면 전혀 다른 늪에 빠져 있어요", "'그거 정의가 뭔데?'라고 묻고 싶어져요", "관심 없는 건 놀랄 만큼 머리에 안 들어와요", "밤이 되면 머리가 더 잘 돌아가요", "설명이 자꾸 길어져요"], "ENTJ": ["결론 안 나는 회의를 못 견뎌요", "정신 차려 보면 진행을 맡고 있어요", "쓸데없는 시간이 제일 싫어요", "목표가 있을수록 불타올라요", "누가 기대면 거절을 못 해요"], "ENTP": ["떠오른 걸 일단 말하고 나서 생각해요", "'근데 반대로'로 이야기를 키워요", "금방 질려요", "토론은 싸움이 아니라 놀이예요", "새 앱은 일단 깔고 봐요"], "INFJ": ["말하기 전에 상대 컨디션이 안 좋은 걸 알아채요", "속마음은 좀처럼 안 보여 줘요", "사람 많은 곳에 다녀오면 혼자 있고 싶어요", "의미 없는 일에는 시간을 못 써요", "상담은 자주 받는데 정작 나는 상담 안 해요"], "INFP": ["머릿속으로 대화 리허설을 해요", "좋아하는 이야기가 나오면 갑자기 말이 많아져요", "현실적인 이야기를 하면 지쳐요", "예전에 들은 말을 몇 년이고 기억해요", "내 안의 정답은 절대 못 양보해요"], "ENFJ": ["모두의 표정을 살피면서 말해요", "부탁받으면 거절을 못 해요", "내 일은 늘 뒷전이에요", "분위기가 조용하면 화제를 꺼내요", "남이 성장하면 내 일처럼 기뻐요"], "ENFP": ["대화가 세 단계씩 점프해요", "하고 싶은 게 너무 많아서 정체 중이에요", "마감 직전에 방 청소를 하게 돼요", "처음 만난 사람과도 금방 친해져요", "질리면 한순간에 식어요"], "ISTJ": ["일정은 미리미리 끝내 둬요", "규칙 안 지키는 사람이 신경 쓰여요", "물건마다 제자리가 정해져 있어요", "갑작스러운 변경에 은근히 당황해요", "한번 정한 방식은 바꾸고 싶지 않아요"], "ISFJ": ["먼저 알아채고 먼저 움직여요", "'괜찮아'라고 하면서 참고 있어요", "사람들 취향을 기억해요", "눈에 띄는 역할은 하기 싫어요", "누가 기대 오면 기뻐요"], "ESTJ": ["일단 순서부터 정해요", "애매한 지시에 짜증 나요", "시간 약속에 엄격해요", "맡은 일은 끝까지 다 해내요", "가까운 사람한테는 말투가 세져요"], "ESFJ": ["정신 차려 보면 모임 총무를 하고 있어요", "모두의 컨디션이나 기분이 신경 쓰여요", "혼자 있는 시간이 길면 외로워요", "기념일을 잘 기억해요", "미움받고 있지 않은지 확인하고 싶어져요"], "ISTP": ["설명서보다 먼저 만져 봐요", "단톡방은 읽기만 해요", "쓸데없는 대화가 힘들어요", "고장 나면 일단 내가 고쳐요", "흥미가 떨어지면 갑자기 손이 멈춰요"], "ISFP": ["느낌이 안 오는 건 못 골라요", "유행보다 내가 좋아하는 게 우선", "재촉받는 게 힘들어요", "사진이나 배치에 신경 써요", "화는 안 내지만 속으로는 안 물러서요"], "ESTP": ["생각보다 몸이 먼저 움직여요", "지루한 게 제일 싫어요", "분위기를 금방 파악해요", "계획보다 현장 대응이 특기예요", "뒷정리는 나중으로 미뤄요"], "ESFP": ["분위기 따라 약속을 잡아요", "사진 찍는 걸 좋아해요", "우울해도 자고 나면 회복돼요", "분위기 메이커 담당이 되기 쉬워요", "단조로운 작업은 오래 못 해요"]}, "TCOMPAT": {"INTJ": {"m": "ENTP", "why": "전략에 새로운 바람을 불어넣어 주는 아이디어 뱅크예요."}, "ENTP": {"m": "INTJ", "why": "번뜩이는 생각을 탄탄한 계획으로 만들어 줘요."}, "INTP": {"m": "ENTJ", "why": "생각을 형태로 만들어 앞으로 밀고 나가 주는 실행가예요."}, "ENTJ": {"m": "INTP", "why": "참신한 시선으로 발상을 넓혀 주는 브레인이에요."}, "INFJ": {"m": "ENFP", "why": "속에 품은 마음을 밝게 끌어내 줘요."}, "ENFP": {"m": "INFJ", "why": "펼쳐 놓은 꿈을 조용히 깊게 만들어 주는 상대예요."}, "INFP": {"m": "ENFJ", "why": "이상을 진심으로 응원해 주는 든든한 길잡이예요."}, "ENFJ": {"m": "INFP", "why": "당신의 다정함을 필요로 해 주는 순수한 사람이에요."}, "ISTJ": {"m": "ESTP", "why": "착실한 당신에게 자극과 행동력을 줘요."}, "ESTP": {"m": "ISTJ", "why": "넘치는 기세를 단단한 토대로 받쳐 주는 상대예요."}, "ISFJ": {"m": "ESFP", "why": "성실함을 확 밝게 만들어 주는 분위기 메이커예요."}, "ESFP": {"m": "ISFJ", "why": "즐거움을 살며시 받쳐 주는 든든한 존재예요."}, "ISTP": {"m": "ESTJ", "why": "당신의 실력을 살릴 무대를 마련해 줘요."}, "ESTJ": {"m": "ISTP", "why": "결정적인 순간에 믿을 수 있는 냉정한 실력자예요."}, "ISFP": {"m": "ESFJ", "why": "마이페이스인 당신을 따뜻하게 받쳐 줘요."}, "ESFJ": {"m": "ISFP", "why": "꾸밈없는 감성으로 마음을 편하게 해 주는, 있는 그대로의 상대예요."}}, "GAP_USE": {"IE": {"h": "充電｜内向き → 外向き に変身", "t": "ほんとうは一人で充電する人が、人と関わる力を装備した状態。人前のあとにどっと疲れるのは、気のせいじゃなく装備の重さです。予定のあとに“ひとり時間”を確保すると、回復が一気に速くなります。"}, "EI": {"h": "充電｜外向き → 内向き に変身", "t": "ほんとうは人といて充電する人が、今はひとりモード。最近なんとなく元気が出ないなら、原因は“人との時間の不足”かも。気のおけない人と会う予定をひとつ入れるだけで、驚くほど復活します。"}, "SN": {"h": "見方｜現実派 → 直感派 に変身", "t": "地に足のついた現実派が、ひらめきで動く力を獲得。アイデアが浮かんでも「ほんとに大丈夫？」と不安になるのは、素の現実感覚が生きている証拠。ひらめきを素の現実力で検算すれば最強です。"}, "NS": {"h": "見方｜直感派 → 現実派 に変身", "t": "本来ひらめき型のあなたが、現実的にふるまう力を装備。ときどき無性に“夢の話”がしたくなるのは、素の顔の呼吸です。空想の時間はサボりじゃなく、あなたの充電です。"}, "TF": {"h": "決め方｜論理派 → 共感派 に変身", "t": "本来スジで決める人が、人に合わせて受け止める力を獲得。合わせたあとに「本音を言えばよかった」とモヤモヤしやすいタイプ。大事な決断だけは、素のロジックに戻って決めると後悔しません。"}, "FT": {"h": "決め方｜共感派 → 論理派 に変身", "t": "本来は気持ちで決める人が、冷静に判断する鎧を装備。クールに見えて、内側では感情がちゃんと動いています。ときどき“好きか嫌いか”だけで選ぶと、心の疲れがすっと取れます。"}, "JP": {"h": "動き方｜計画派 → 自由派 に変身", "t": "本来は計画派なのに、流れに乗る柔軟さを獲得。自由に見えて、心のどこかで“決まっていない不安”を感じやすい人です。ざっくりでも予定を置くと、安心して楽しめます。"}, "PJ": {"h": "動き方｜自由派 → 計画派 に変身", "t": "本来は自由派なのに、段取りの力を身につけた人。きっちりこなせるのに、たまに全部投げ出したくなるのはこのせい。“予定のない日”を先にカレンダーに入れておくのがコツです。"}}, "COLOR": {"INTJ": {"name": "深い藍", "hex": "#27406B", "line": "夜明け前の藍。静かに全体を見渡す色。"}, "INTP": {"name": "アイスブルー", "hex": "#79B6D9", "line": "澄んだ氷の青。思考が透きとおる色。"}, "ENTJ": {"name": "クリムゾン", "hex": "#C8102E", "line": "燃える深紅。目標へ突き進む色。"}, "ENTP": {"name": "エレクトリックオレンジ", "hex": "#FF6A2C", "line": "火花のオレンジ。刺激を生み出す色。"}, "INFJ": {"name": "アメジスト", "hex": "#6A4C93", "line": "神秘の紫。静かな理想を秘めた色。"}, "INFP": {"name": "ラベンダー", "hex": "#B79CE0", "line": "淡い藤色。やさしく夢みる色。"}, "ENFJ": {"name": "コーラル", "hex": "#FF8364", "line": "夕日のコーラル。人を照らすあたたかな色。"}, "ENFP": {"name": "ビビッドイエロー", "hex": "#FFD23F", "line": "弾ける黄色。その場を明るくする色。"}, "ISTJ": {"name": "ディープグリーン", "hex": "#2F6B5E", "line": "落ち着いた深緑。ぶれない芯の色。"}, "ISFJ": {"name": "ソフトピーチ", "hex": "#F4C9A8", "line": "やわらかな桃色。そっと包む色。"}, "ESTJ": {"name": "ロイヤルブルー", "hex": "#2457C5", "line": "堂々のブルー。頼れる芯の色。"}, "ESFJ": {"name": "ウォームローズ", "hex": "#F77FA1", "line": "あたたかな薔薇色。みんなを和ませる色。"}, "ISTP": {"name": "ガンメタル", "hex": "#8C97A0", "line": "クールな銀。無駄のない色。"}, "ISFP": {"name": "セージグリーン", "hex": "#8FBF9F", "line": "やさしい若草。自然体でいられる色。"}, "ESTP": {"name": "ネオンレッド", "hex": "#FF3B30", "line": "躍動の赤。動くほど光る色。"}, "ESFP": {"name": "ホットピンク", "hex": "#FF2E9A", "line": "華やぐマゼンタ。主役のオーラの色。"}}, "URA": {"INTJ": "じつは、頭の中では何手も先まで読んで、もう一人で完結している。", "INTP": "じつは、「なんで？」が止まらず、夜中に関係ない調べ物で時間が溶ける。", "ENTJ": "じつは、任されないとソワソワ。仕切りたくて手がうずうずしている。", "ENTP": "じつは、思いつきを口に出してから「どうしよう」と考えはじめる。", "INFJ": "じつは、ニコニコしながら相手の本音を静かに見抜いている。", "INFP": "じつは、頭の中で壮大なストーリーが毎日上映されている。", "ENFJ": "じつは、みんなを気づかうあまり、自分のことは後回しにしがち。", "ENFP": "じつは、やりたいこと多すぎて、半分は途中で次へ移っている。", "ISTJ": "じつは、段取りを乱す人に、心の中でこっそりイラッとしている。", "ISFJ": "じつは、「大丈夫」と言いながら、いちばん我慢している。", "ESTJ": "じつは、ゆるい計画を見ると、つい口を出したくてうずうず。", "ESFJ": "じつは、嫌われてないかな…と、こっそり空気を確認している。", "ISTP": "じつは、興味ないことには無関心。好きなことには無限に集中する。", "  걸 못 끊음."}, "ENFJ>INTP": {"karai": "인간관계 귀찮다지만, 사실 챙겨주고 싶은 상대가 없는 것뿐일 수 있음."}, "ENFJ>ENTJ": {"karai": "합리적인 리더를 연기하지만, 뒤에선 멤버들 반응 신경 쓰느라 꽤 지쳐 있음."}, "ENFJ>ENTP": {"karai": "삐딱한 척하지만, \"고마워\" 한마디에 1초 만에 순한 얼굴로 돌아옴."}, "ENFJ>INFJ": {"karai": "지켜보는 중이라더니, 상대가 내가 생각한 길을 고를 때까지 속으로 계속 조마조마함."}, "ENFJ>INFP": {"karai": "나답게 산다면서, '나다운지'를 주변 반응으로 확인하고 있음."}, "ENFJ>ENFJ": {"karai": "남을 위해 애쓰는 내가 너무 좋아서, 거절당하면 상대보다 내가 더 데미지 받음."}, "ENFJ>ENFP": {"karai": "자유인처럼 보여도, 다들 잘 따라오는지만큼은 몇 번이고 뒤돌아 확인함."}, "ENFJ>ISTJ": {"karai": "일에 감정 안 끌어들인다면서, 송별회 스피치에선 대개 제일 먼저 울고 있음."}, "ENFJ>ISFJ": {"karai": "조용히 서포트하는 줄 알아도, 상대 인생의 중요한 결정엔 확실히 훈수 둠."}, "ENFJ>ESTJ": {"karai": "규칙에 엄한 상사를 연기하지만, 누가 울며 매달리면 결국 규칙 굽혀줌."}, "ENFJ>ESFJ": {"karai": "모두를 돌보는 줄 알았는데, 돌봄받는 쪽의 자유는 꽤 뺏고 있음."}, "ENFJ>ISTP": {"karai": "건조하게 사는 줄 알아도, 감동 영상 보면 누구보다 빨리 울고 있음."}, "ENFJ>ISFP": {"karai": "아무한테도 간섭 안 한다면서, 좋아하는 사람 고민엔 전력으로 오지랖 부림."}, "ENFJ>ESTP": {"karai": "가벼운 척하지만, 진지한 상담 들어오면 아직도 아침까지 이야기함."}, "ENFJ>ESFP": {"karai": "재밌으면 그만이라고 웃지만, 사실 모두의 인생을 조금 더 낫게 만들고 싶은 야망이 있음."}, "ENTJ>INTJ": {"karai": "앞에 안 나서는 건 겸손해서가 아니라, 설명하는 수고를 생략하는 것뿐일 수 있음."}, "ENTJ>INTP": {"karai": "흐름에 맡긴다면서, 나 모르게 정해진 일엔 반드시 이유를 물음."}, "ENTJ>ENTJ": {"karai": "\"의견 있는 사람?\" 묻지만, 그건 내 안에 찬성하는 사람 세는 것뿐."}, "ENTJ>ENTP": {"karai": "유연해졌다고 스스로 생각하지만, 남들 눈엔 결정 속도가 예전 그대로임."}, "ENTJ>INFJ": {"karai": "온화한 사람인 줄 알지만, 앞뒤 안 맞는 사람과는 조용히 손절 중."}, "ENTJ>INFP": {"karai": "싸움은 싫다면서, 진 경기만은 몇 년이 지나도 디테일하게 기억함."}, "ENTJ>ENFJ": {"karai": "사랑 넘치는 리더를 지향하지만, 칭찬 뒤엔 늘 다음 할당량이 있음."}, "ENTJ>ENFP": {"karai": "자유롭게 사는 것처럼 보여도, 남들보다 뒤처졌다는 걸 안 순간 진심 모드 돌입."}, "ENTJ>ISTJ": {"karai": "현실파를 자처하지만, 승진 기회 오는 순간 누구보다 빠르게 손 듦."}, "ENTJ>ISFJ": {"karai": "서포트 역할이 체질이라면서, 서포트 방식엔 일절 참견 못 하게 함."}, "ENTJ>ESTJ": {"karai": "현실적이 됐다지만, 속으론 아직 천하 제패 계획 포기 안 함."}, "ENTJ>ESFJ": {"karai": "분위기를 소중히 한다면서, 최종 결정권만은 절대 안 놓음."}, "ENTJ>ISTP": {"karai": "독고다이인 척하지만, 무리 만들라 하면 하룻밤 만에 조직도 그릴 수 있음."}, "ENTJ>ISFP": {"karai": "다툼엔 관심 없다지만, 승부욕은 1밀리도 안 고쳐졌음."}, "ENTJ>ESTP": {"karai": "즉흥적으로 보여도, 본인 머릿속에선 전부 '예상 범위 내'로 처리됨."}, "ENTJ>ESFP": {"karai": "흥으로 사는 척하지만, 눈에 띄는 자리는 매번 확실히 챙기러 감."}}, "PS": {"INTJ": {"catch": "말하기 전에 이미 결론이 나 있는 타입. 조용히 앞을 내다보고 길을 그리는 사람이에요.", "overview": "당신은 주변 사람들이 이제 막 의논을 시작할 즈음, 이미 머릿속에 답의 윤곽이 보이는 사람이에요. 일을 '앞으로 어떻게 될까'라는 긴 안목으로 바라보고, 군더더기 없는 길을 짜는 데 능해요. 당신을 움직이는 건 납득할 수 있는 이유, 그리고 스스로 생각하고 정할 수 있는 자유예요. 누가 시켜서가 아니라 이치에 맞는다고 느낄 때 가장 큰 힘이 나요. 말수가 많지 않아서 주변에서는 '쿨하고 다가가기 어렵다'고 보기도 해요. 하지만 막막할 때 기대 보면 놀랄 만큼 정확한 답을 돌려주는 사람이에요. 그 조용한 든든함을 믿고 의지하는 사람이 적지 않답니다.", "strengths": ["앞을 내다보고 준비하는 힘｜눈앞의 일뿐 아니라 반년 뒤, 1년 뒤까지 그려 보며 움직일 수 있어요. 문제가 생기기 전에 미리 손을 쓰니 계획이 안정적이에요.", "혼자서 깊이 파고드는 힘｜답이 나올 때까지 끈질기게 생각을 이어 갈 수 있어요. 남의 의견에 휩쓸리지 않고 스스로 확인한 뒤에 정하니 판단이 잘 흔들리지 않아요.", "군더더기를 찾아 정리하는 눈｜'이 단계, 없어도 되지 않나?' 하고 금방 알아채는 사람이에요. 구조를 다시 짜서 모두의 수고를 덜어 줄 수 있어요.", "혼자서도 밀고 나가는 단단함｜주변의 찬성이 다 모이지 않아도, 옳다고 믿는 일은 조용히 끝까지 해내요. 그 모습이 결과적으로 사람들을 이끌기도 해요."], "pitfalls": ["설명을 건너뛰기 쉬워요｜머릿속에서는 답이 다 연결되어 있어서 중간 과정은 말하지 않고 결론만 전하기 쉬워요. 이유를 한마디만 덧붙여도 훨씬 잘 전달돼요.", "남의 비효율에 답답해해요｜군더더기가 너무 잘 보이다 보니, 감정으로 움직이는 사람이 돌아가는 것처럼 느껴질 때가 있어요. 상대에게는 상대 나름의 중요한 순서가 있다고 생각하면 마음이 가벼워져요.", "혼자 끌어안기 쉬워요｜내가 하는 게 더 빠르다고 느껴서 부탁하는 걸 미루기 쉬워요. 작은 일부터 맡겨 보면 부담이 나뉘고 여유가 생겨요."], "relationships": "친구가 많지 않아도 괜찮다고 생각하는 타입이에요. 대신 한번 믿은 사람과는 길고 깊게 지내요. 단톡방에서는 말이 별로 없어도, 따로 고민 상담을 받으면 진지하게 생각해서 답해 줘요. 회사나 동아리에서는 회의가 막혔을 때 핵심을 찌르는 한마디를 던지는 역할이에요. 잘 맞는 사람은 혼자만의 시간을 존중해 주고, 돌려 말하지 않고 솔직하게 이야기할 수 있는 사람이에요.", "love": "좋아하게 되기까지 시간이 걸리지만, 한번 '이 사람이다' 싶으면 아주 성실하게 마주해요. 화려한 말보다 상대의 고민을 함께 생각하거나 미래 이야기를 진지하게 나누는 걸로 마음을 표현해요. 소중히 여기는 건 서로의 생각을 존중할 수 있는 관계예요. 엇갈리기 쉬운 부분은 마음을 말로 잘 표현하지 않는 점이에요. '좋다', '고마워'를 소리 내어 말하는 것만으로도 상대가 느끼는 안정감이 크게 달라져요.", "work": "목표가 뚜렷하고 진행 방식을 어느 정도 맡겨 주는 환경에서 힘이 나요. 조사하고, 생각하고, 계획을 실제로 만들어 내는 역할에서 인정받기 쉽고, '저 사람한테 물어보면 길이 보인다'며 의지를 받는 존재가 되곤 해요. 반면 이유를 알 수 없는 규칙이 많은 직장이나 결론 없는 회의가 이어지는 환경에서는 쉽게 지쳐요. 집중할 수 있는 시간만 확보해도 성과가 확 올라가는 타입이에요.", "jobs": ["경영기획·사업전략", "시스템 설계·엔지니어", "연구직", "데이터 분석가", "건축·도시계획"], "growth": "생각한 결론을 전할 때 '왜 그렇게 생각했는지'를 한 문장만 덧붙여 보세요. 그것만으로도 주변의 납득도가 크게 달라져요. 또 하루 중 한 번은 누군가의 이야기를 끝까지 끊지 않고 듣는 시간을 만들어 보는 것도 추천해요. 나에게 없는 시각을 만나면 당신의 계획은 더 단단해져요.", "A": "자기주장형일 때는 자신의 판단에 망설임이 적고, 정하면 곧장 나아가요. 반대 의견에도 크게 흔들리지 않고 차분하게 계획을 밀고 나갈 수 있어요. 사람들 앞에서도 당당하게 생각을 전할 수 있는 게 강점이에요.", "T": "신중형일 때는 계획에 빈틈이 없는지 몇 번이고 다시 살피는 꼼꼼함이 빛나요. '더 잘할 수 있을 거야'라는 마음이 성장으로 이어져 세세한 부분까지 완성도를 높일 수 있어요. 불안할 때는 한번 종이에 적어 보면 마음이 편해져요."}, "INTP": {"catch": "정신 차려 보면 검색 삼매경인 타입. '왜 그럴까?'를 즐길 줄 아는 사람이에요.", "overview": "당신은 문득 궁금한 게 생기면 정신 차려 보니 몇 시간째 찾아보고 있는 사람이에요. '왜 그렇게 되지?', '진짜 그런가?' 하고 원리를 알고 싶어지는 마음이 가장 큰 원동력이에요. 답을 외우기보다 스스로 납득할 때까지 생각하는 데서 기쁨을 느껴요. 혼자 생각할 시간이 있으면 기운이 나고, 머릿속에서는 늘 여러 아이디어가 동시에 돌아가고 있어요. 주변에서는 '자기 페이스대로 사는 신기한 사람'으로 보기 쉽지만, 막상 이야기해 보면 아는 게 많고 뜻밖의 각도에서 재미있는 답을 내놓는 사람이에요. 그 자유로운 발상이 꽉 막힌 분위기를 바꾸기도 해요.", "strengths": ["원리를 꿰뚫어 보는 힘｜복잡한 이야기도 핵심이 되는 부분을 찾아 정리할 수 있어요. '그러니까 이런 거지?' 하고 뼈대를 보여 주는 데 능해요.", "고정관념에 갇히지 않아요｜'다들 그렇다니까'로 정하지 않고, 정말 맞는지 직접 확인해요. 덕분에 다들 놓친 문제를 알아챌 수 있어요.", "좋아하는 것에 깊이 몰입해요｜관심 있는 주제에는 놀랄 만큼 빠져들 수 있어요. 찾아본 것들이 이어져서 어느새 누구보다 잘 알게 되는 경우도 많아요.", "차분한 공정함｜의견이 부딪칠 때도 감정에 휩쓸리지 않고 각자의 주장을 냉정하게 비교할 수 있어요. 입장과 상관없이 이치에 맞는 생각을 소중히 해요."], "pitfalls": ["생각이 많아 못 움직여요｜가능성이 여러 개 떠오르다 보니 '더 좋은 방법이 있을지도' 하며 결정을 못 내리곤 해요. 스스로 임시 마감을 정해 두면 첫걸음을 떼기 쉬워져요.", "감정 이야기가 어려워요｜논리로 생각하는 게 자연스러워서, 상대가 그저 공감을 원할 때 해결책부터 내놓기 쉬워요. 먼저 '힘들었겠다' 하고 받아 주면 마음이 전해져요.", "관심이 금방 옮겨 가요｜새로운 궁금증에 마음이 끌려서 하다 만 일이 쌓이기 쉬워요. 하다 만 것 하나만 적어 두면 마무리하는 흐름을 만들 수 있어요."], "relationships": "여럿이 왁자지껄 노는 것보다 소수끼리 좋아하는 이야기를 깊게 나누는 게 더 즐거운 타입이에요. 친구들 사이에서는 사소한 궁금증을 던져 이야기를 넓혀 가는 존재예요. 회사나 학교에서는 곤란할 때 '찾아봤는데~' 하며 믿음직한 지식을 꺼내 주는 사람으로 신뢰받아요. 잘 맞는 사람은 갑자기 생각에 빠져도 신경 쓰지 않고, 당신 이야기에 '그거 재밌다' 하고 맞장구쳐 주는 사람이에요.", "love": "좋아하는 사람도 '더 알고 싶다'는 마음에서 연애가 시작돼요. 상대의 생각이나 좋아하는 것에 관심을 갖고, 이야기에 빠져들다 보면 거리가 좁혀지는 타입이에요. 소중히 여기는 건 서로 자유로울 수 있는 관계예요. 엇갈리기 쉬운 부분은 연락을 자꾸 미루거나 마음을 말로 표현하지 않는 점이에요. 짧게라도 '오늘 이런 일 있었어' 하고 보내기만 해도 상대는 안심할 수 있어요.", "work": "자기 페이스대로 생각할 수 있고 새로운 걸 시도할 수 있는 환경에서 힘이 나요. 원인을 파헤치고, 구조를 짜고, 새로운 방법을 고안하는 역할에서 인정받기 쉬워요. 반면 정해진 절차만 반복하는 일이나 의미가 보이지 않는 보고가 많은 환경에서는 쉽게 지쳐요. '이걸 왜 하는지'만 알면 놀랄 만큼 집중하는 타입이에요.", "jobs": ["프로그래머", "연구원", "데이터 사이언티스트", "게임 기획자", "테크니컬 라이터"], "growth": "생각하고 있는 걸 완성하기 전에 누군가에게 이야기해 보세요. 반쯤 됐을 때 보여 주면 뜻밖의 힌트를 얻을 수 있어요. 또 찾아보기 시작하기 전에 '30분만' 하고 타이머를 맞춰 두는 것도 추천해요. 깊이 파고드는 즐거움은 그대로 두면서, 해야 할 일로도 돌아올 수 있게 돼요.", "A": "자기주장형일 때는 자기 생각에 자신감이 있어서 떠오른 아이디어를 편하게 말로 꺼낼 수 있어요. 실패를 오래 끌지 않고, 시도하면서 생각을 깊게 만들어 가요. 새로운 일에도 가볍게 도전할 수 있는 게 강점이에요.", "T": "신중형일 때는 자기 생각에 빠진 부분이 없는지 몇 번이고 확인하는 꼼꼼함이 빛나요. 그만큼 내놓는 답의 정확도가 높아서 신뢰를 얻기 쉬워요. 망설여질 때는 완벽보다 '지금 아는 만큼'으로 내놓아 보면 마음이 편해져요."}, "ENTJ": {"catch": "그럼 내가 정할게 타입. 망설이는 자리를 앞으로 움직이는 든든한 사람이에요.", "overview": "당신은 모두가 망설이며 이야기가 멈췄을 때 '그럼 이렇게 하자' 하고 길을 제시할 수 있는 사람이에요. 목표를 찾으면 거기까지 가는 단계를 단숨에 짜고, 사람과 힘을 모아 실제로 만들어 내요. 당신을 움직이는 건 성장과 성과가 눈에 보이는 것이에요. 어제보다 오늘 조금이라도 앞으로 나아갔다는 손맛이 있으면 힘이 점점 솟아나요. 주변에서는 '야무진 사람', '믿음직한 리더'로 보는 경우가 많아서 자연스럽게 정리하는 역할을 맡곤 해요. 가끔 엄격해 보일 때도 있지만, 그건 진심으로 좋은 결과를 내고 싶다는 마음의 표현이에요. 뒷모습을 보며 '이 사람만 따라가면 괜찮겠다'고 느끼는 사람도 많을 거예요.", "strengths": ["결정해서 판을 움직이는 힘｜선택지가 많아 망설여지는 상황에서도 판단 기준을 제시하고 결정을 내릴 수 있어요. 멈춰 있던 이야기가 당신의 한마디로 단숨에 움직이기 시작해요.", "단계를 짜는 능력｜큰 목표를 오늘 할 일, 다음 주 할 일로 나누는 데 능해요. 누가 무엇을 하면 되는지 분명해져서 팀이 움직이기 쉬워져요.", "높은 목표를 즐길 줄 알아요｜어려운 과제일수록 불타오르는 타입이에요. '어차피 안 돼'라고 여겨지던 일도 궁리를 거듭해 실현에 가깝게 만들어 가요.", "분명하게 전하는 솔직함｜애매하게 넘기지 않고 필요한 말을 똑바로 할 수 있어요. 무엇을 기대하는지 알기 쉬워서 주변도 안심하고 움직일 수 있어요."], "pitfalls": ["남에게 내 속도를 요구하기 쉬워요｜내 속도가 기준이 되어 주변도 똑같이 움직일 수 있다고 생각하기 쉬워요. 상대의 상황을 한번 물어본 뒤에 부탁하면 협조를 얻기 쉬워져요.", "결과를 서두르느라 못 쉬어요｜앞으로 나아가는 걸 좋아하는 만큼 쉬는 데 죄책감을 느끼기 쉬워요. 휴식도 계획의 일부로 일정에 넣어 두면 오래 달릴 수 있어요.", "말이 세게 전달될 때가 있어요｜분명하게 말한다는 게 상대에게는 엄하게 들릴 때가 있어요. 지적하기 전에 잘한 점을 하나 먼저 말해 주면 받아들이기 쉬워져요."], "relationships": "친구들 사이에서는 여행 계획이나 모임 준비를 자연스럽게 맡는 존재예요. '어디 갈래?'에서 멈춰 있던 단톡방도 당신이 후보를 던지면 금방 정해져요. 회사나 동아리에서는 목표를 향해 모두를 이끄는 역할이에요. 잘 맞는 사람은 의견을 분명하게 돌려주는 사람이나, 당신의 추진력을 재미있어해 주는 사람이에요. 가끔 상대의 이야기를 차분히 들어 주는 시간을 가지면 신뢰가 더 깊어져요.", "love": "좋아하는 사람에게는 솔직하게 마음을 전하는 타입이에요. 데이트 계획을 세우거나 상대의 목표를 응원하는 등 행동으로 애정을 보여 줘요. 소중히 여기는 건 서로 함께 성장할 수 있는 관계예요. 엇갈리기 쉬운 부분은 상대의 고민에 바로 해결책을 내놓는 점이에요. 가끔은 답을 내지 않고 '그랬구나' 하고 들어 주기만 해도 상대는 진심으로 안심해요. 약한 모습을 보여 준다는 것도 소중한 신뢰의 증거예요.", "work": "목표가 분명하고 재량껏 움직일 수 있는 환경에서 큰 힘을 발휘해요. 프로젝트를 이끌고, 팀을 리드하고, 새로운 체계를 만드는 역할에서 인정받기 쉬워요. 반면 결정에 시간이 오래 걸리는 조직이나 성과가 잘 보이지 않는 일이 이어지면 쉽게 지쳐요. 결과를 낼수록 맡는 범위가 넓어지고, 그만큼 더 힘을 발휘하는 타입이에요.", "jobs": ["경영자·창업가", "프로젝트 매니저", "컨설턴트", "영업 관리자", "변호사"], "growth": "회의나 대화 마지막에 '다른 의견 있어요?' 하고 한마디 묻는 습관을 들여 보세요. 조용한 사람의 의견이 뜻밖의 돌파구가 될 때가 있어요. 또 일주일에 한 번은 아무 일정도 넣지 않는 시간을 만들어 보는 것도 추천해요. 잠시 멈추는 시간이 다음의 큰 한 걸음을 만들어 줘요.", "A": "자기주장형일 때는 결단이 빠르고, 압박이 큰 상황에서도 당당하게 사람들을 이끌 수 있어요. 실패해도 금방 털어 내고 바로 다음 수를 생각해요. 자신감 넘치는 모습이 주변에 용기를 줘요.", "T": "신중형일 때는 높은 목표를 세우면서도 세세한 위험까지 잘 알아채는 착실함이 빛나요. '더 잘할 수 있어'라는 마음이 팀의 수준을 끌어올려요. 완벽을 너무 바라게 될 때는 해낸 것들을 하나씩 세어 보면 마음이 편해져요."}, "ENTP": {"catch": "'근데 반대로~'가 입버릇인 타입. 당연한 걸 뒤집어 보는 발상의 사람이에요.", "overview": "당신은 모두가 '원래 그런 거지' 하고 넘기는 일에 '근데 반대로, 이렇게 해 보면 어때?' 하고 다른 각도를 가져올 수 있는 사람이에요. 새로운 아이디어를 떠올리거나 사람들과 의견을 주고받는 걸 아주 좋아해서, 이야기하다 보면 발상이 점점 넓어져요. 당신을 움직이는 건 '재밌겠다!' 하는 설렘이에요. 아직 아무도 안 해 본 일이나 정답이 정해지지 않은 문제일수록 불타오르는 타입이에요. 주변에서는 '머리 회전이 빠르다', '같이 얘기하면 지루할 틈이 없다'는 말을 자주 들을 거예요. 가끔 토론을 좋아하는 것처럼 보여도, 그건 상대를 이기고 싶어서가 아니라 함께 더 좋은 답을 찾고 싶어서예요. 분위기를 밝게 움직이는 존재예요.", "strengths": ["발상 전환이 빨라요｜하나의 문제에 대해 여러 시각과 해결책을 떠올릴 수 있어요. 꽉 막힌 상황에서도 새로운 길을 찾아내는 데 능해요.", "말하면서 생각을 넓히는 힘｜사람들과 대화하는 사이에 아이디어가 쑥쑥 자라나요. 수다에서 나온 아이디어가 큰 기획으로 이어지기도 해요.", "변화를 즐기는 유연함｜계획이 바뀌거나 예상 밖의 일이 생겨도 오히려 재미있어할 수 있어요. 새로운 환경에도 금방 적응하는 가벼움이 있어요.", "주눅 들지 않는 행동력｜윗사람이나 처음 보는 사람에게도 부담 없이 말을 걸 수 있어요. 사람과 사람을 이어서 새로운 흐름을 만들어 낼 수 있어요."], "pitfalls": ["시작은 잘하는데 이어 가기는 어려워요｜새로운 것에 대한 관심이 큰 만큼, 꾸준히 마무리하는 단계에서 질리기 쉬워요. 마무리를 잘하는 사람과 짝을 이루면 아이디어가 실제로 완성되기 쉬워져요.", "토론이 너무 뜨거워져요｜의견을 주고받는 게 즐거워서 상대가 지쳤다는 걸 잘 눈치채지 못할 때가 있어요. '넌 어떻게 생각해?' 하고 상대의 차례를 만들어 주면 대화가 기분 좋게 이어져요.", "일정을 너무 빽빽하게 채워요｜재밌어 보이는 제안에 연달아 응하다 보면 어느새 감당하기 벅차지기 쉬워요. 대답하기 전에 하룻밤 두고 생각하면 정말 하고 싶은 일을 고를 수 있어요."], "relationships": "친구가 많고 어떤 무리에도 쉽게 섞이는 타입이에요. 술자리나 주말 모임에서는 화제를 던져 분위기를 띄우는 존재예요. 카톡에서도 사소한 아이디어를 보내며 대화를 넓혀 가요. 회사나 학교에서는 새로운 기획이나 아이디어를 내는 역할로 기대를 받기 쉬워요. 잘 맞는 사람은 당신 이야기를 재미있어하면서도 가끔은 반박도 해 주는 사람이에요. 티격태격을 즐길 수 있는 관계일수록 오래가요.", "love": "이야기가 즐거운 사람, 모르는 세계를 보여 주는 사람에게 끌려요. 좋아하게 되면 재미있는 데이트를 기획하거나 새로운 곳에 가자고 하면서 둘만의 시간을 짜릿하게 만들려고 해요. 소중히 여기는 건 함께 성장할 수 있고 지루하지 않은 관계예요. 엇갈리기 쉬운 건 농담이나 논쟁이 상대에게 상처를 줄 때예요. 진지한 이야기를 할 때는 먼저 상대의 마음에 다가가는 한마디를 의식하면 신뢰가 깊어져요.", "work": "새로운 일에 도전할 수 있고 아이디어를 자유롭게 낼 수 있는 환경에서 힘이 나요. 기획을 시작하고, 문제의 새로운 해결책을 고민하고, 사람들을 끌어들여 움직이는 역할에서 인정받기 쉬워요. 반면 매일 같은 작업을 반복하는 일이나 세세한 규칙에 묶이는 환경에서는 쉽게 지쳐요. 변화가 많은 현장일수록 당신의 유연함이 살아나요.", "jobs": ["신사업·기획직", "창업가", "마케터", "광고 기획자", "기자"], "growth": "떠오른 아이디어는 바로 키우기 전에 '첫 한 걸음만' 정해서 적어 보세요. 실제로 만들어 가는 길이 보여서 실현하기 쉬워져요. 또 하루를 마칠 때 '오늘 끝까지 해낸 일'을 하나 돌아보는 것도 추천해요. 작은 완성을 쌓아 가면 당신의 발상은 더 멀리까지 닿아요.", "A": "자기주장형일 때는 아이디어가 떠오른 순간 바로 행동으로 옮기는 대담함이 있어요. 사람들 앞에서도 자기 생각을 즐겁게 이야기하며 주변을 끌어들이는 힘이 커져요. 실패해도 웃으며 다음으로 넘어가는 게 매력이에요.", "T": "신중형일 때는 번뜩임에 더해 '정말 잘될까?'를 확인하는 냉정함이 빛나요. 사람들의 반응에도 민감해서 상대에 맞춘 방식으로 전할 수 있어요. 신경 쓰이는 게 많아지면 하나씩 시도해 보면 마음이 편해져요."}, "INFJ": {"catch": "말 안 해도 알아채는 타입. 사람 마음의 작은 흔들림을 살며시 받아 주는 사람", "overview": "상대의 표정이나 목소리 톤, 카톡 답장 사이의 텀처럼 아주 작은 변화도 알아챌 수 있는 사람이에요. 말로 꺼내지 않은 마음을 자연스럽게 짐작할 수 있어서 '어떻게 알았어?' 하고 놀라는 말을 자주 들어요. 마음속에는 '이랬으면 좋겠다' 하는 조용한 이상이 있고, 거기에 가까워지는 데서 큰 보람을 느껴요. 사람들과 어울리는 건 좋아하지만, 많은 사람 속에 있으면 감정을 너무 많이 흡수해서 쉽게 지치기 때문에 혼자 생각을 정리하는 시간이 꼭 필요해요. 주변에서는 온화하고 잘 들어 주지만 심지가 굳은 사람으로 보여요. 겉으로 꺼내는 말은 적어도 머릿속으로는 한참 앞까지 생각하고 있는 경우가 많은 타입이에요.", "strengths": ["분위기 변화를 금방 알아채요｜그 자리의 분위기나 상대의 기운 없는 모습을 일찍 감지할 수 있어요. 힘든 사람이 먼저 말하기 전에 슬쩍 손을 내밀 수 있어요.", "이야기를 차분히 들어 줘요｜상대의 말을 끊지 않고 마음까지 받아 주며 들을 수 있어요. '이 사람한테는 말할 수 있겠다' 싶어서 깊은 고민 상담을 받기 쉬운 사람이에요.", "앞을 내다보며 생각해요｜눈앞의 일에서 앞으로 어떻게 될지 그려 보는 데 능해요. 작은 위화감에서 문제를 미리 막을 때가 있어요.", "소중한 것에 흔들리지 않아요｜자신이 지키고 싶은 가치관이 뚜렷해요. 휩쓸리기 쉬운 상황에서도 조용히 자기 생각을 지켜 낼 수 있어요."], "pitfalls": ["남의 마음을 너무 짊어져요｜상대의 마음을 잘 아는 만큼 내 일처럼 끌어안기 쉬워요. '이건 상대의 문제야' 하고 마음속으로 선을 그으면 조금 편해져요.", "한계까지 참아 버려요｜분란을 만들고 싶지 않아서 작은 불만을 계속 쌓아 두기 쉬워요. 너무 쌓이기 전에 '좀 신경 쓰이는 게 있어서' 하고 가볍게 말하는 연습을 하면 관계도 나도 지킬 수 있어요.", "이상이 높아지기 쉬워요｜머릿속 이상이 뚜렷한 만큼 현실과의 차이에 쉽게 처져요. '오늘은 60%만 해도 충분해' 하고 목표를 작게 나누면 꾸준히 이어 가기 쉬워져요."], "relationships": "친구가 많지 않아도 깊고 오래가는 관계를 소중히 해요. 무리 안에서는 들어 주는 사람이나 상담해 주는 사람이 되기 쉽고, '얘기하면 마음이 놓인다'며 의지를 받아요. 회사나 동아리에서는 전체 분위기를 살피면서 겉도는 사람이나 곤란해하는 사람을 살며시 챙기는 존재예요. 잘 맞는 사람은 천천히 속마음을 나눌 수 있는 사람, 그리고 이쪽의 침묵을 어색해하지 않는 사람이에요. 자주 만나는 것보다 만났을 때 나누는 이야기의 깊이로 채워지는 타입이라, 억지로 약속을 빽빽하게 잡지 않는 편이 관계가 오래가요.", "love": "금방 좋아하기보다는 이야기를 나누다가 '이 사람 생각하는 방식 좋다' 하고 마음이 움직이는 타입이에요. 한번 소중하게 여기면 상대의 작은 변화도 알아채고, 말보다 행동으로 깊은 애정을 보여 줘요. 소중히 여기고 싶은 건 진심으로 안심하고 속마음을 말할 수 있는 관계예요. 엇갈리기 쉬운 건 상대의 마음을 앞질러 너무 많이 짐작하다가, 정작 내 바람은 말하지 않고 삼켜 버릴 때예요. '알아줬으면 좋겠다'를 조금만 말로 꺼내도 두 사람의 거리가 확 가까워져요.", "work": "의미를 느낄 수 있는 일, 누군가에게 도움이 되고 있다는 실감이 있는 환경에서 힘이 나요. 혼자 집중해서 생각하는 시간과, 소수가 깊이 이야기할 수 있는 자리가 함께 있으면 이상적이에요. 상대의 필요를 읽어 내는 기획, 상담 업무, 글이나 자료 만들기 등에서 인정받기 쉬울 거예요. 반면 숫자만 쫓는 직장이나 잡담과 회의가 끊임없이 이어지는 환경에서는 나도 모르게 피로가 쌓여요. 일주일에 한 번이라도 조용히 돌아보는 시간을 확보하면 컨디션을 유지하기 쉬워져요.", "jobs": ["상담사·상담원", "편집자·작가", "인사·채용 담당", "UX 리서처", "보육교사·교사"], "growth": "주변을 먼저 챙기다 보니 내 마음은 뒤로 밀리기 쉬운 타입이에요. 자기 전에 '오늘 기뻤던 일'과 '조금 찜찜했던 일'을 한 줄씩 메모해 보세요. 내 감정에 이름이 붙으면 남에게 전하기도 편해져요. 또 부탁을 받으면 바로 대답하지 말고 '조금 생각해 보고 알려 줄게' 하고 한 박자 쉬기만 해도 무리하게 떠맡는 일이 줄어요.", "A": "자기주장형일 때는 자신의 판단을 믿고 차분하게 행동할 수 있어요. 사람들의 마음에 다가가면서도 필요한 순간에는 '나는 이렇게 생각해'라고 분명하게 말할 수 있어서, 상담해 주는 사람으로서도 든든한 존재예요.", "T": "신중형일 때는 상대의 반응이나 자신의 말과 행동을 꼼꼼히 돌아봐요. 다른 사람의 아픔에 특히 민감해서 말을 고르는 방식이 아주 다정한 게 매력이에요. 너무 신경이 쓰일 때는 '충분히 배려했어' 하고 스스로를 다독여 주세요."}, "INFP": {"catch": "머릿속이 영화관인 타입. 나다움과 다정한 상상력을 소중히 하는 사람", "overview": "등하굣길이나 출퇴근길 지하철 안, 문득 한가한 주말 오후에 머릿속에서 여러 이야기나 '만약에' 장면이 펼쳐지는 사람이에요. 좋아하는 음악이나 책, 풍경에 쉽게 마음이 움직이고, 느낀 것을 천천히 음미하는 데 능해요. 내 안에 '이것만큼은 지키고 싶다'는 마음이 있어서, 거기에 맞지 않는 일에는 주변이 다 하더라도 내키지 않아요. 사람들에게 무척 다정하고 상대의 입장이 되어 생각하려고 해요. 주변에서는 온화하고 조용한 사람으로 보지만, 이야기해 보면 독특한 감성과 유머가 있는 재미있는 사람이에요. 겉으로 잘 드러내지 않을 뿐, 속에는 아주 풍부하고 뜨거운 마음을 품고 있어요.", "strengths": ["느끼는 힘이 아주 풍부해요｜작은 일이나 말에도 마음이 움직이고 그 좋음을 음미할 수 있어요. 남들이 놓치기 쉬운 아름다움이나 재미를 알아채는 감성이 있어요.", "남의 아픔에 다가갈 수 있어요｜힘든 사람의 마음을 내 일처럼 상상할 수 있어요. 부정하지 않고 받아 주기 때문에 곁에 있기만 해도 상대가 안심해요.", "나만의 언어로 표현해요｜글이나 그림, 음악 등으로 마음을 형태로 만드는 데 능해요. 말하기 어려운 것도 나만의 표현으로 다정하게 전할 수 있어요.", "좋아하는 것에 깊이 몰입해요｜진심으로 좋다고 느끼는 일에는 시간 가는 줄 모르고 빠져들어요. 그 열정이 독창적인 작품이나 아이디어로 이어져요."], "pitfalls": ["생각이 많아 못 움직여요｜머릿속 상상이 너무 부풀어서 첫걸음이 무거워지기 쉬워요. '5분만 해 보자' 하고 작게 시작하면 마음이 자연스럽게 따라와요.", "속마음을 넣어 두기 쉬워요｜상대에게 상처 주기 싫어서 내 의견을 말하지 않고 끝날 때가 있어요. 메모나 카톡으로 먼저 마음을 정리한 뒤에 전하면 말하기 편해져요.", "자책하기 쉬워요｜이상이 높고 다정한 만큼, 일이 잘 안 풀리면 '내 탓이야'라고 단정하기 쉬워요. 친구에게 건넬 법한 말을 나에게도 건네 주면 마음이 가벼워져요."], "relationships": "여럿이 시끌벅적하게 노는 것보다 마음 맞는 사람과 소수로 천천히 이야기하는 게 편한 타입이에요. 처음엔 조용해도 친해지면 좋아하는 것 이야기로 신나게 떠들며 의외의 모습을 보여 줘요. 회사나 학교에서는 다툼을 싫어해서 어색한 분위기를 누그러뜨리는 역할을 맡기 쉬워요. 잘 맞는 사람은 이쪽의 페이스를 재촉하지 않고, 감성이나 가치관을 재미있어해 주는 사람이에요. 다름을 부정하지 않는 사람과는 깊고 오래가는 신뢰를 쌓을 수 있어요.", "love": "드라마 같은 특별한 연결을 동경하고, 마음 깊은 곳까지 통하는 상대를 원해요. 좋아하게 되면 상대가 좋아하는 노래를 듣거나 사소한 말을 소중히 기억해 두는 등 애정이 아주 섬세해요. 소중히 여기고 싶은 건 있는 그대로의 나를 받아 준다는 안정감이에요. 엇갈리기 쉬운 건 머릿속에서 상대를 너무 이상화하거나, 불만을 말하지 못하고 혼자 고민할 때예요. 작은 마음부터 말로 꺼내 가면 관계가 더 단단해져요.", "work": "내 가치관에 맞는 일, 누군가에게 도움이 되고 있다는 실감이 있는 환경에서 힘이 확 나요. 어느 정도 자유롭게 진행 방식을 고를 수 있고 혼자 집중할 시간이 있으면 이상적이에요. 글, 디자인, 기획처럼 감성과 상상력을 살릴 수 있는 역할에서 인정받기 쉬울 거예요. 반면 세세한 규칙에 계속 묶이는 환경이나 경쟁과 실적만 강조하는 직장에서는 의욕이 떨어지기 쉬워요. 일 속에서 '좋아하는 것'을 하나 찾으면 오래 이어 가기 쉬워져요.", "jobs": ["작가·소설가", "일러스트레이터·디자이너", "심리·복지 분야", "도서관 사서", "영상 크리에이터"], "growth": "풍부한 상상력을 조금씩 현실의 형태로 만들어 가는 게 성장의 열쇠예요. 떠오른 아이디어나 느낀 것을 휴대폰 메모에 하루 하나씩 모아 보세요. 나중에 다시 읽어 보면 내가 소중히 여기는 게 보이기 시작해요. 또 하고 싶은 일은 '이번 주는 알아보기만' 하는 식으로 작은 단계로 나누면 생각에 빠지지 않고 움직이기 시작할 수 있어요.", "A": "자기주장형일 때는 자신의 감성이나 선택에 자신감을 갖기 쉽고, 처지더라도 비교적 빨리 회복해요. 주변 말에 크게 휘둘리지 않고 '나는 이게 좋아'라고 당당히 표현할 수 있어서, 작품이나 생각이 사람들에게 잘 닿아요.", "T": "신중형일 때는 마음의 흔들림을 깊이 느끼고, 그것을 풍부한 표현으로 이어 갈 수 있어요. 다른 사람의 마음을 배려하는 것도 한층 섬세해요. 불안해질 때는 해낸 일들을 적어 보고, 나의 다정함을 인정해 주세요."}, "ENFJ": {"catch": "자꾸 챙겨 주게 되는 타입. 주변 사람의 좋은 점을 끌어내고 분위기를 따뜻하게 만드는 사람", "overview": "누군가 곤란해하면 부탁받기도 전에 '도와줄까?' 하고 말을 거는 사람이에요. 사람의 마음이나 분위기를 읽는 데 능해서, 무리에서 겉도는 사람이 있으면 자연스럽게 말을 걸어 어울리게 해 줘요. 사람이 성장하고 웃는 모습을 보는 게 무엇보다 큰 기쁨이고, 상대의 좋은 점을 찾아 말해 주는 것도 잘해요. 모두가 같은 방향을 보고 나아가는 데 가치를 느껴서, 학교 축제나 회사 프로젝트에서는 어느새 정리하는 역할을 맡고 있을 때가 많을 거예요. 주변에서는 밝고 잘 챙겨 주며, 함께 있으면 긍정적이 되는 사람으로 보여요. 그만큼 정작 자신의 피로는 잘 알아채지 못하는 면도 있어요.", "strengths": ["사람의 좋은 점을 찾아 전해요｜상대가 모르는 장점을 찾아 말로 전해 줄 수 있어요. 그 한마디가 누군가의 자신감과 한 걸음으로 이어져요.", "모두를 하나로 모으는 힘｜제각각인 의견을 들으면서 모두가 납득하기 쉬운 방향으로 이끌 수 있어요. 팀에 일체감을 만드는 데 능해요.", "마음이 담긴 말｜말투에 열정과 배려가 있어서 사람의 마음을 움직일 수 있어요. 발표나 설명하는 자리에서도 듣는 사람을 긍정적으로 만들어요.", "바로 손을 내밀어요｜곤란한 사람을 알아채면 망설이지 않고 행동으로 옮겨요. 그 다정함과 행동력이 주변의 두터운 신뢰로 이어지고 있어요."], "pitfalls": ["내 일은 뒤로 밀려요｜도움이 되고 싶은 마음이 커서 부탁을 연달아 떠맡기 쉬워요. 일정표에 '나를 위한 시간'을 먼저 넣어 두면 무리가 줄어요.", "기대에 너무 부응하려 해요｜상대의 기대를 잘 느끼는 만큼 실망시키기 싫어서 너무 애를 써요. '못 하는 건 못 해'라고 말해도 신뢰는 쉽게 무너지지 않아요.", "상대를 위한 마음이 지나칠 때가 있어요｜좋은 뜻으로 한 조언이 상대에게는 부담으로 느껴질 때가 있어요. 먼저 '어떻게 해 주면 좋겠어?' 하고 물어본 뒤에 움직이면 마음이 엇갈리지 않아요."], "relationships": "친구가 많고 여러 무리를 이어 주는 다리 역할을 하기 쉬운 타입이에요. 생일이나 기념일을 꼼꼼히 기억하고, 서프라이즈를 준비하는 것도 좋아할 거예요. 회사나 동아리에서는 새로 온 사람에게 말을 걸거나, 분위기가 무거울 때 풀어 주는 존재예요. 잘 맞는 사람은 고마움을 솔직하게 표현해 주는 사람, 그리고 내가 약한 소리를 할 때 받아 주는 사람이에요. 챙겨 주기만 하는 게 아니라 나도 기댈 수 있는 관계여야 오래 편안하게 이어져요.", "love": "좋아하는 사람이 생기면 상대를 열심히 생각하고, 기뻐하는 얼굴이 보고 싶어서 이것저것 정성을 쏟는 타입이에요. 상대의 꿈이나 고민에도 진지하게 마주하며 '함께 성장해 갈 수 있는 관계'를 소중히 해요. 소중히 여기고 싶은 건 마음을 말로 주고받을 수 있는 거예요. 엇갈리기 쉬운 건 너무 잘해 주다가 지쳐 버리거나, 상대의 반응이 미지근하면 불안해질 때예요. 가끔은 기대는 쪽이 되어 해 줬으면 하는 걸 솔직하게 말하면 관계가 더 대등하고 따뜻해져요.", "work": "사람들과 어울리면서 누군가의 성장이나 웃음에 기여할 수 있는 환경에서 힘이 나요. 팀이 목표를 공유하고 함께 나아가는 직장이 잘 맞아요. 리더나 교육 담당, 조율 역할처럼 사람을 잇고 움직이는 역할에서 인정받기 쉬울 거예요. 반면 혼자 묵묵히 작업만 이어지는 환경이나 인간관계가 삐걱거리는 직장에서는 에너지가 쉽게 소모돼요. 업무 성과와 함께 '고마워'를 느낄 수 있는 곳에서 가장 빛나는 타입이에요.", "jobs": ["교사·강사", "인사·교육 담당", "커리어 컨설턴트", "홍보·PR", "이벤트 플래너"], "growth": "사람을 받쳐 주는 힘이 큰 만큼, 내 마음의 남은 에너지를 의식하는 게 중요해요. 하루를 마칠 때 '오늘 나를 위해 뭘 했지?'를 하나 떠올려 보세요. 아무것도 없다면 내일은 차 한 잔을 천천히 마시는 것처럼 작은 일이라도 괜찮아요. 또 부탁을 받으면 일단 '확인해 보고 알려 줄게'라고 말하는 습관을 들이면 너무 많이 떠안는 걸 막을 수 있어요.", "A": "자기주장형일 때는 자기 생각에 자신감이 있어서 망설임 없이 사람들을 이끌 수 있어요. 실패해도 마음을 빨리 바꾸고, 밝은 에너지로 분위기를 앞으로 이끌어요. 사람들 앞에 서는 자리에서도 침착하게, 마음껏 힘을 발휘하는 타입이에요.", "T": "신중형일 때는 한 사람 한 사람의 반응에 한층 세심하게 신경 쓸 수 있어요. 상대가 상처받지 않도록 말을 고르는 배려가 매력이에요. 남의 평가가 신경 쓰일 때는 내가 해 온 좋은 일들을 떠올리며 마음을 쉬게 해 주세요."}, "ENFP": {"catch": "설렘이 최우선인 타입. 두근거림을 찾아내서 주변에도 퍼뜨리는 사람", "overview": "새로 생긴 가게, 처음 가 보는 곳, 아직 아무도 시도하지 않은 아이디어. 그런 '재밌겠다!'를 만나면 눈이 반짝 빛나는 사람이에요. 떠오른 걸 바로 말하고 싶어지고, 수다 속에서 아이디어가 줄줄이 부풀어 가요. 사람에 대한 관심도 커서 처음 만난 사람과도 자연스럽게 친해지고, 상대가 좋아하는 것이나 생각을 알아 가는 걸 즐겨요. 규칙이나 정해진 절차보다 '어떻게 하면 더 즐거워질까'를 중요하게 여기니 분위기를 확 밝게 만드는 힘이 있어요. 주변에서는 활기차고 붙임성 좋고, 함께 있으면 세상이 넓어지는 사람으로 보여요. 떠들썩한 인상과 달리 사실은 사람의 마음에 민감하고 섬세한 면도 지니고 있어요.", "strengths": ["아이디어가 샘솟아요｜하나의 화제에서 새로운 발상을 여러 개 이어 갈 수 있어요. 회의나 기획 자리에서 뜻밖의 관점을 내놓을 수 있는 게 강점이에요.", "누구와도 금방 친해져요｜처음 만나도 벽을 치지 않고 상대 이야기를 즐겁게 들어 줘요. 사람과 사람을 이어 주는 허브 같은 존재가 될 수 있어요.", "주변의 의욕을 끌어올려요｜즐겁게 이야기하는 모습이 자연스럽게 주변 사람들을 끌어들여요. '나도 해 볼까?' 하는 분위기를 만드는 데 능해요.", "사람의 가능성을 믿어요｜상대의 좋은 점과 성장 가능성을 알아보고 진심으로 응원할 수 있어요. 그 긍정적인 말이 누군가의 등을 살며시 밀어 줘요."], "pitfalls": ["관심이 계속 옮겨 가요｜새로운 것에 설레는 만큼 시작한 일이 중간에 멈추기 쉬워요. 끝내고 싶은 일을 하나만 골라 작은 목표를 정하면 끝까지 가기 쉬워져요.", "일정을 너무 빽빽하게 채워요｜약속도 하고 싶은 일도 거절을 못 해서 어느새 다이어리가 꽉 차요. 일주일에 하루는 '아무것도 안 넣는 날'을 먼저 정해 두면 마음에 여유가 돌아와요.", "세세한 작업에 쉽게 지쳐요｜같은 작업의 반복이나 서류 처리는 아무래도 미루기 쉬워요. 음악을 틀거나 시간을 나눠 두는 등 작은 궁리로 재미를 더하면 진행하기 편해져요."], "relationships": "친구 범위가 넓고 다양한 타입의 사람과 친해질 수 있어요. 생각나면 '지금 볼 수 있어?' 하고 카톡을 보내는 행동력도 있어서, 놀 계획을 짜는 역할을 맡을 때도 많을 거예요. 회사나 학교에서는 분위기 메이커로 자리를 밝히고, 의견이 잘 안 나올 때 대화의 물꼬를 터 줘요. 잘 맞는 사람은 당신의 아이디어를 재미있게 들어 주는 사람, 그리고 적당히 현실적인 시각을 보태 주는 사람이에요. 마음을 솔직하게 주고받는 관계에서 가장 나답게 있을 수 있어요.", "love": "설렘이나 '이 사람이랑 있으면 즐겁다'는 느낌에서 연애가 시작되기 쉬운 타입이에요. 좋아하게 되면 같이 가고 싶은 곳, 같이 하고 싶은 일이 줄줄이 떠올라서 상대와의 시간을 온 힘을 다해 즐겨요. 소중히 여기고 싶은 건 마음을 솔직하게 표현할 수 있는 것, 그리고 서로의 자유를 존중하는 거예요. 엇갈리기 쉬운 건 관계가 안정되면서 자극이 줄어들 때, 혹은 상대의 마음을 너무 읽으려다 불안해질 때예요. 일상 속에서 작은 즐거움을 함께 만들어 가면 관계가 오래 이어져요.", "work": "새로운 일에 도전할 수 있고 아이디어와 사람과의 연결을 살릴 수 있는 환경에서 힘이 나요. 자유도가 높고 여러 사람과 어울릴 수 있는 직장이 잘 맞아요. 기획이나 런칭, 콘텐츠 발신, 사람과 사람을 잇는 역할 등에서 인정받기 쉬울 거예요. 반면 매일 같은 절차의 반복이나 관리가 깐깐한 환경에서는 의욕이 쉽게 시들어요. 어려운 작업은 잘하는 사람과 나누거나 툴에 맡기면, 내 강점에 더 많은 시간을 쓸 수 있어요.", "jobs": ["기획·마케팅", "광고·카피라이터", "이벤트·여행 플래너", "창업가·신사업 담당", "인플루언서·스트리머"], "growth": "넘치는 아이디어를 실제 형태로 만드는 데까지 .", "jobs": ["경리·회계", "공무원(행정직)", "품질관리", "시스템 유지보수·운영", "약사"], "growth": "당신의 확실함은 큰 자산이에요. 거기에 더해 조금만 '평소와 다른 것'을 들여 보세요. 예를 들어 일주일에 한 번 가 본 적 없는 길로 돌아오거나, 처음 가는 식당에서 점심을 고르는 정도의 작은 변화면 충분해요. 또 하루를 마칠 때 누군가에게 고마움을 한마디 전해 보세요. 마음을 말로 꺼내는 연습이 인간관계를 훨씬 편하게 만들어 줘요.", "A": "자기주장형일 때는 자기 방식에 자신감이 있어서 망설임 없이 진행해요. 실수를 해도 필요 이상으로 처지지 않고 다음 단계를 담담하게 생각할 수 있어요. 주변에도 안정적인 인상을 줘서 정리하는 역할을 맡기 쉬워요.", "T": "신중형일 때는 돌다리도 두드려 보고 건너는 식으로 확인하기 때문에 자잘한 실수가 거의 없어요. '이걸로 정말 괜찮을까?' 고민하는 만큼 준비의 질이 아주 높아요. 가끔은 '이 정도면 충분해'라고 스스로에게 말해 주면 편해져요."}, "ISFJ": {"catch": "살며시 알아채고 먼저 움직이는, 다정한 숨은 조력자", "overview": "'정신 차려 보면 이미 움직이고 있는 타입'인 당신은 주변의 곤란한 일을 자연스럽게 알아채는 사람이에요. 음료가 모자라면 채워 두고, 기운 없는 사람이 있으면 말을 걸어요. 그걸 '해 줬다'고 생각하지 않고 당연한 일처럼 해내요. 소중히 여기는 건 가까운 사람들이 마음 편히 지낼 수 있는 거예요. 한번 기억한 상대의 취향이나 일정은 오래 기억해요. 조용하고 눈에 띄는 걸 좋아하지 않지만, 없으면 '그 사람 덕분이었구나' 하고 알게 되는 존재예요. 정해진 흐름 안에서 꼼꼼하게 일을 진행하는 데 능해요. 조용한 시간으로 마음을 정돈하면 다시 다정하게 움직일 수 있어요.", "strengths": ["한발 앞선 배려｜상대의 표정이나 목소리의 작은 변화를 알아채요. 말하기 전에 손을 내밀 수 있어서 깊은 고마움을 받아요.", "꼼꼼하고 확실한 일솜씨｜하나하나의 작업을 소홀히 하지 않고 끝까지 정성껏 마무리해요. 안심하고 맡길 수 있는 사람이에요.", "상대를 잘 기억해요｜생일이나 좋아하는 음식, 전에 나눈 이야기를 기억하고 있어요. 그 기억이 상대를 소중히 하는 힘이 돼요.", "분위기를 누그러뜨리는 온화함｜날 선 분위기 속에서도 부드러운 말로 긴장을 풀어 줘요. 곁에 있기만 해도 사람들이 안도해요."], "pitfalls": ["부탁받으면 거절을 못 해요｜상대를 실망시키고 싶지 않은 마음이 커서 무리한 일도 떠맡기 쉬워요. '확인해 보고 알려 줄게' 하고 한 박자 쉬면 나를 지킬 수 있어요.", "내 피로를 잘 못 알아채요｜다른 사람을 먼저 챙기다 보니 내 휴식은 뒤로 밀려요. 일정표에 '아무것도 안 하는 시간'을 먼저 적어 두면 편해져요.", "감정을 쌓아 두기 쉬워요｜분란을 만들기 싫어서 찜찜한 마음을 말하지 않고 참기 쉬워요. 믿을 수 있는 사람에게 조금씩 털어놓으면 마음이 가벼워져요."], "relationships": "친구에게는 티 나지 않는 배려로 곁을 지켜 줘요. 아픈 사람에게 메시지를 보내거나 여행 준비물 리스트를 챙기는 등 받쳐 주는 역할을 할 때가 많아요. 회사나 학교에서도 곤란한 사람을 그냥 두지 못해요. 잘 맞는 사람은 당신의 다정함에 '고마워'를 돌려주는 사람이에요. 일방적으로 기대기만 하는 관계보다 서로 챙겨 주는 관계가 오래 편안하게 이어져요.", "love": "좋아하는 사람은 세세한 부분까지 잘 보고 있어요. 컨디션을 챙기거나 좋아하는 간식을 챙겨 주는 등, 매일의 작은 행동으로 애정을 전해요. 소중히 여기는 건 안심하고 함께할 수 있는 잔잔한 관계예요. 엇갈리기 쉬운 건 상대에게 너무 맞추다가 속마음을 말하지 못하게 될 때예요. '나는 이렇게 하고 싶어' 하고 작은 바람부터 전해 보면 연인과의 거리가 더 가까워져요.", "work": "누군가에게 도움이 되고 있다는 실감이 있고, 절차가 어느 정도 정해져 있는 환경에서 힘을 발휘해요. 꼼꼼한 응대나 뒤에서 받쳐 주는 역할로 높이 평가받기 쉬워요. 곤란한 사람을 돕는 역할이나 정확성이 필요한 사무 일에도 잘 맞아요. 반대로 경쟁이 치열한 직장이나 차가운 말이 오가는 환경에서는 마음이 쉽게 닳아요. 고마움을 말로 주고받는 직장을 고르면 오래 기분 좋게 일할 수 있어요.", "jobs": ["간호사", "보육교사", "병원 사무", "도서관 사서", "총무·인사"], "growth": "당신의 다정함은 먼저 나 자신에게 향해도 괜찮은 거예요. 오늘부터 부탁을 받으면 바로 '응, 좋아'라고 하기 전에 한 박자 쉬고 내 일정과 마음을 확인해 보세요. 또 자기 전에 '오늘 내가 잘한 일'을 하나 적어 보세요. 남을 위해 움직인 나를 인정해 주면 마음에 여유가 생겨요.", "A": "자기주장형일 때는 사람을 받쳐 주면서도 내 페이스를 지킬 수 있어요. 부탁도 할 수 있는 범위를 가늠해서 맡을 수 있어요. 배려가 자연스러워서 주변도 부담 없이 기댈 수 있어요.", "T": "신중형일 때는 상대의 마음을 깊이 상상하는 만큼 배려가 아주 섬세해요. '폐가 되진 않을까?' 하고 생각하는 다정함이 신뢰로 이어져요. 나에게도 같은 만큼의 다정함을 돌려주면 훨씬 편해져요."}, "ESTJ": {"catch": "계획을 짜서 모두를 앞으로 이끄는, 든든한 진행자", "overview": "'일단 일정표부터 만드는 타입'인 당신은 일을 확실하게 형태로 만들어 가는 사람이에요. 여행이 정해지면 바로 일정과 예산을 짜고, 조별 과제에서는 역할 분담부터 정해요. 흐릿한 상태를 잘 못 견뎌서 '언제까지, 누가, 무엇을 할지'를 분명히 하고 싶어져요. 의지하는 건 확실한 사실과 지금까지의 실적이에요. 할 말은 분명하게 하니 주변에서는 믿음직한 리더로 보여요. 조금 엄하게 느껴질 때도 있지만, 그건 일을 잘 굴러가게 하고 싶다는 책임감의 표현이에요. 사람들과 협력하면서 눈에 보이는 성과를 낼 때 가장 빛나요.", "strengths": ["앞을 내다보는 계획력｜목표에서 거꾸로 계산해서 해야 할 일을 순서대로 늘어놓을 수 있어요. 주변이 헤매지 않고 움직일 수 있는 길을 만들어요.", "결정력과 실행력｜회의가 길어져도 요점을 정리해 결론을 내요. 정하면 바로 움직이니 일이 앞으로 나아가요.", "끝까지 해내는 책임감｜맡은 역할은 끝까지 해내요. 어려움이 있어도 내던지지 않는 자세가 주변의 신뢰를 모아요.", "알기 쉬운 전달력｜애매한 표현을 피하고 요점을 분명하게 전해요. 지시나 설명이 명확해서 상대가 움직이기 쉬워져요."], "pitfalls": ["말투가 세게 전달되기 쉬워요｜효율을 생각해 솔직하게 말하는 만큼 상대가 날카롭게 느낄 때가 있어요. 본론 전에 '고마워' 한마디를 붙이면 훨씬 잘 전달돼요.", "내 방식을 고집하기 쉬워요｜잘됐던 방법을 믿기 때문에 다른 안은 뒤로 미루기 쉬워요. 먼저 상대의 안을 끝까지 들어 보면 새로운 발견이 있어요.", "쉬는 건 뒤로 밀려요｜할 일이 보이면 자꾸 계속 움직이게 돼요. 휴일 일정에 '쉬기'를 하나의 일정으로 넣어 두면 피로를 쌓지 않을 수 있어요."], "relationships": "친구들 사이에서는 모임 날짜를 정하거나 가게를 예약하는 등 자연스럽게 총대를 메는 역할이에요. 잘 챙기는 편이라 곤란한 사람에게는 구체적인 해결책을 내서 도와줘요. 회사나 동아리에서도 규칙을 지키고 전체 흐름을 정돈하는 존재예요. 잘 맞는 사람은 약속을 지키고 분명하게 말해 주는 사람이에요. 감정을 중요하게 여기는 사람과는 상대의 이야기를 듣는 시간을 의식적으로 가지면 좋은 관계를 쌓을 수 있어요.", "love": "좋아하는 사람에게는 성실하고 믿음직한 모습을 보여요. 데이트 계획을 세우거나 고민을 함께 해결하는 등 행동으로 아껴 줘요. 연인과는 서로 약속을 지킬 수 있는, 믿을 수 있는 관계를 원해요. 엇갈리기 쉬운 건 상대는 그냥 들어 주길 바랄 뿐인데 자꾸 해결책을 말해 버릴 때예요. '그랬구나' 하고 먼저 받아 주면 마음이 훨씬 잘 통해요.", "work": "목표와 역할이 분명하고 성과가 눈에 보이는 환경에서 힘을 발휘해요. 팀을 이끄는 자리나 진행 상황을 관리하는 역할에서 높이 평가받기 쉬워요. 규칙을 정비하거나 체계를 개선하는 것도 잘해요. 반대로 방침이 애매한 채로 진행되는 직장이나 결정에 시간이 너무 오래 걸리는 환경에서는 스트레스가 쌓이기 쉬워요. 나에게 결정 권한이 조금이라도 있으면 마음껏 일할 수 있어요.", "jobs": ["영업 관리자", "프로젝트 관리", "점장", "은행원", "경찰관·소방관"], "growth": "당신의 추진력은 주변을 앞으로 데려가는 큰 힘이에요. 오늘부터 회의나 대화에서 내 의견을 말하기 전에 상대에게 '어떻게 생각해요?' 하고 한마디 물어보세요. 또 일주일에 한 번은 일정을 넣지 않는 시간을 만들어 보세요. 잠시 멈추는 시간이 다음 판단을 더 확실하게 만들어 줘요.", "A": "자기주장형일 때는 망설임이 적고 판단이 아주 빨라요. 압박이 큰 상황에서도 당당하게 행동할 수 있어서 주변을 이끄는 힘이 강하게 나와요. 실패해도 금방 털어 내는 것도 특징이에요.", "T": "신중형일 때는 계획의 빈틈이나 위험을 미리 확인해요. '정말 이대로 괜찮을까?' 하고 다시 보는 만큼 계획의 완성도가 높아요. 주변 반응에도 신경 쓸 수 있어서 부드러운 리더로 신뢰받아요."}, "ESFJ": {"catch": "모두의 웃음을 위해 움직이는, 사람을 잇는 분위기 담당", "overview": "'정신 차려 보면 총무 맡고 있는 타입'인 당신은 사람과 사람을 자연스럽게 이어 주는 사람이에요. 회식이나 생일 파티에서는 어느새 날짜 조율과 가게 고르기를 맡고 있어요. 소중히 여기는 건 그 자리에 있는 모두가 즐겁고 편하게 지내는 거예요. 무리에 못 끼는 사람이 있으면 말을 걸고, 화제를 던져 분위기를 데워요. 상대의 마음이나 그 자리의 공기에 민감하고, 예의와 배려를 중요하게 여겨요. 주변에서는 밝고 친근한 사람으로 보여서 고민 상담 상대로 의지를 받을 때도 많아요. 사람들에게 '고마워'라는 말을 듣는 게 무엇보다 큰 에너지가 되고, 다음에도 힘내야지 하는 마음이 들어요.", "strengths": ["사람과 사람을 잇는 힘｜처음 만난 사람들 사이에 들어가 공통 화제를 찾아 친해지게 해 줘요. 당신이 있으면 모임이 넓어져요.", "분위기를 읽는 힘｜누가 지쳤는지, 누가 말하고 싶어 하는지 알아채요. 모두가 편하게 지낼 수 있도록 자연스럽게 조율할 수 있어요.", "행동으로 이어지는 배려｜마음만으로 끝내지 않고, 간식을 챙기거나 연락을 하는 식으로 형태로 전해요. 그 다정함이 상대 마음에 오래 남아요.", "정리해서 진행하는 힘｜행사 준비나 맡은 일에서 역할과 일정을 정리해 끝까지 진행해요. 안심하고 맡길 수 있는 살림꾼이에요."], "pitfalls": ["남의 평가가 신경 쓰이기 쉬워요｜모두가 기뻐했으면 하는 마음이 커서 반응이 미지근하면 불안해지기 쉬워요. '나는 충분히 했어' 하고 스스로 마침표를 찍으면 편해져요.", "너무 애쓰게 돼요｜총무나 챙기는 역할을 거듭 떠맡다가 어느새 녹초가 될 때가 있어요. 가끔은 '이번엔 참석만 할게' 하고 역할을 넘겨 보세요.", "부딪치는 걸 피하기 쉬워요｜분위기를 지키고 싶어서 반대 의견을 삼키기 쉬워요. '나는 이렇게 생각해' 하고 부드럽게 전하면 관계는 오히려 깊어져요."], "relationships": "친구가 많고 단톡방에서도 자주 말을 거는 존재예요. 오랜만인 사람에게도 편하게 연락할 수 있어서, 사람들의 연결을 유지하는 역할을 자연스럽게 맡아요. 회사나 학교에서는 새로 온 사람에게 말을 걸거나 행사를 띄우는 역할을 해요. 잘 맞는 사람은 마음을 말로 돌려주는 사람이에요. 반응이 적은 타입의 사람과는, 그 사람 나름의 고마움을 표현하는 방식이 있다는 걸 알아 두면 엇갈림이 줄어요.", "love": "좋아하는 사람에게는 연락을 자주 하고, 상대가 기뻐할 일을 생각해서 행동해요. 기념일 서프라이즈나 직접 만든 요리로 대접하는 것도 잘해요. 소중히 여기는 건 마음을 주고받고 서로를 아껴 줄 수 있는 관계예요. 엇갈리기 쉬운 건 나만 애쓰고 있다고 느껴서 서운해질 때예요. 해 줬으면 하는 걸 솔직하게 말로 하면 연인도 응하기 쉬워지고 관계가 더 안정돼요.", "work": "사람들과 협력하며 진행하는 일이나, 누군가에게 도움이 되고 있다는 실감이 있는 환경에서 힘을 발휘해요. 팀 분위기를 만드는 일이나 고객을 세심하게 응대하는 일에서 높이 평가받기 쉬워요. 행사 운영이나 조율 역할도 자주 맡아요. 반대로 혼자 묵묵히 작업만 이어지는 환경이나 인간관계가 삐걱거리는 직장에서는 기운이 빠지기 쉬워요. 고마움을 서로 전하는 문화가 있는 직장을 고르면 오래 빛날 수 있어요.", "jobs": ["호텔·서비스직", "교사", "웨딩 플래너", "인사·채용 담당", "요양보호사"], "growth": "당신의 따뜻함은 주변 사람을 기운 나게 하는 힘이에요. 오늘부터 누군가의 부탁을 들어주기 전에 '나 지금 여유 있나?' 하고 속으로 확인해 보세요. 또 일주일에 한 번은 나만 즐기기 위한 일정을 넣어 보세요. 나를 채우는 시간이 있을수록 남을 향한 다정함도 오래가요.", "A": "자기주장형일 때는 남의 반응에 너무 휘둘리지 않고 내 판단으로 분위기를 이끌 수 있어요. 자신 있게 말을 걸 수 있어서 리더로서도 의지를 받아요. 밝음이 안정적이라 주변에 안정감을 줘요.", "T": "신중형일 때는 상대의 마음을 세세하게 상상해서 배려가 한층 더 구석구석 닿아요. '좋아해 줄까?' 하고 끝까지 고민하는 만큼 준비가 아주 꼼꼼해요. 완벽하지 않아도 충분히 전해진다는 걸 알면 마음이 가벼워져요."}, "ISTP": {"catch": "설명서보다 손이 먼저 가는, 조용한 원리 덕후", "overview": "새 가전이나 앱이 생기면 설명서를 읽기 전에 일단 만져 봐요. ISTP는 그런 '해 보면 안다'를 소중히 하는 사람이에요. 무언가가 어떻게 돌아가는지 아는 걸 좋아하고, 일이 잘 안 풀릴 때일수록 집중력이 올라가요. 말수가 많지 않은 경우가 많아서 주변에서는 '쿨하고 차분한 사람'으로 보기 쉬워요. 하지만 속으로는 눈앞의 일을 조용히 관찰하면서 어디를 고치면 나아질지 계속 생각하고 있어요. 세세한 규칙에 묶이기보다 내 방식대로 자유롭게 움직일 때 힘이 나요. 문제가 생겨도 당황하지 않고 척척 손을 움직여 해결하니, 결정적인 순간에 의지가 되는 존재예요. 혼자만의 시간으로 기운을 되찾고, 좋아하는 일에는 놀랄 만큼 깊이 빠져들어요.", "strengths": ["결정적인 순간에 흔들리지 않아요｜계획이 틀어져도 먼저 차분하게 상황을 봐요. 당황하지 않고 다음 수를 고를 수 있어서 주변도 안심할 수 있어요.", "손으로 익히는 게 빨라요｜도구나 프로그램 사용법을 만져 보면서 금방금방 익혀요. 직접 해 보면서 이해가 깊어지는 타입이에요.", "군더더기를 찾아 고칠 수 있어요｜'여기만 바꾸면 빨라지겠다'를 알아채는 데 능해요. 절차나 도구를 조금 손봐서 작업을 훨씬 편하게 만들어요.", "내 힘으로 어떻게든 해내요｜남에게 기대기 전에 먼저 스스로 찾아보고 시도해요. 혼자 맡겨져도 끝까지 끈기 있게 결과물을 만들어 낼 수 있어요."], "pitfalls": ["마음을 말로 꺼내기 어려워요｜생각이 머릿속에서 완결되기 쉬워서 주변에 전달이 안 될 때가 있어요. '지금 이렇게 생각해' 하고 한마디만 덧붙여도 오해가 확 줄어요.", "흥미가 떨어지면 손이 멈춰요｜원리를 알게 된 순간 만족하기 쉽기 때문이에요. 마지막 마무리만큼은 '여기까지는 한다'고 미리 정해 두면 손 놓는 일을 막을 수 있어요.", "갑자기 거리를 두게 돼요｜혼자만의 시간이 부족해지면 말없이 멀어지고 싶어져요. '잠깐 쉴게' 하고 말한 뒤에 떨어지면 상대도 안심하고 기다릴 수 있어요."], "relationships": "친구와는 끈적하지 않게 편한 거리에서 지내는 게 좋은 타입이에요. 매일 카톡을 주고받기보다 가끔 만나서 같이 뭔가를 하는 시간을 소중히 해요. 회사나 동아리에서는 말보다 손으로 도와주니 '곤란할 때 제일 믿음직한 사람'으로 여겨지기 쉬워요. 잘 맞는 사람은 이쪽의 페이스를 존중하고 억지로 이야기를 끌어내려 하지 않는 사람이에요. 같은 취미를 함께 즐길 수 있으면 자연스럽게 사이가 깊어져요.", "love": "좋아하는 사람이 생겨도 말로 전하기보다 행동으로 보여 줄 때가 많아요. 무거운 짐을 들어 주고, 고장 난 걸 고쳐 주고, 가고 싶다던 곳을 미리 알아봐 둬요. 그런 작은 배려가 당신의 애정 표현이에요. 연인과는 서로의 자유를 소중히 할 수 있는 관계를 원해요. 엇갈리기 쉬운 건 상대가 '좋아해'라는 말을 원할 때예요. 가끔은 생각하는 걸 입 밖으로 꺼내면 마음이 곧장 전해져요.", "work": "내 재량으로 움직일 수 있는 현장이나 눈에 보이는 성과가 나오는 일에서 힘을 발휘해요. 문제 대응이나 절차 개선을 맡으면 인정받기 쉬울 거예요. 기계나 데이터, 도구를 다루는 역할과도 잘 맞아요. 반대로 목적이 보이지 않는 회의가 많은 환경이나 세세한 규칙으로 절차가 전부 정해진 직장에서는 쉽게 지쳐요. '왜 그렇게 하는지'를 알면 훨씬 움직이기 쉬워져요.", "jobs": ["엔지니어(기계·설비)", "시스템 유지보수·인프라 담당", "정비사·기술직", "영상 편집·음향 스태프", "구급·재난 대응 분야"], "growth": "당신의 생각은 입 밖으로 꺼냈을 때 비로소 주변의 힘이 돼요. 오늘부터 할 수 있는 건 회의나 대화에서 의견을 딱 하나만 말해 보는 거예요. 또 도움을 받으면 '덕분에 살았어' 하고 말로 돌려줘 보세요. 짧은 한마디라도 상대와의 신뢰는 차곡차곡 쌓여 가요.", "A": "자기주장형 ISTP는 자신의 판단에 망설임이 적고, 마음먹으면 바로 움직여요. 실패해도 오래 끌지 않고 '다음엔 이렇게 하자' 하고 빨리 전환하는 게 특징이에요. 새로운 일에도 가볍게 도전할 수 있어요.", "T": "신중형 ISTP는 움직이기 전에 세세한 부분까지 확인하는 꼼꼼함이 있어요. 잘 안 된 부분을 잘 돌아보기 때문에 같은 실수를 반복하지 않아요. 완성도에 신경 쓰는 장인 기질이 빛나요."}, "ISFP": {"catch": "마음이 '좋아'라고 말하는 쪽으로 살며시 나아가는 사람", "overview": "옷을 고를 때, 카페에 들어갈 때, 진로를 정할 때. ISFP는 이유보다 먼저 '이게 좋아'라는 감각으로 고르는 사람이에요. 그 감각은 아주 솔직해서 나에게 맞는 게 무엇인지 제대로 알고 있어요. 평소에는 온화하고 조용해 보이지만, 마음속에는 나만의 고집과 미적 감각이 확실히 자리 잡고 있어요. 사람의 마음 변화도 잘 알아채고, 곤란한 사람에게는 티 나지 않게 곁을 내어 줘요. 다툼을 좋아하지 않고 주변과 평온하게 지내고 싶어 하는 타입이에요. 다만 소중히 여기는 걸 부정당하면 조용히, 하지만 단단하게 지키려고 해요. 계절의 공기나 음악, 손끝의 감촉처럼 일상의 작은 기분 좋음을 음미하는 힘도 뛰어나요.", "strengths": ["감각으로 공간을 편안하게 만들어요｜색이나 소리, 배치 같은 작은 차이를 알아채요. 방이나 자료를 보기 좋은 형태로 정돈하는 데 능해요.", "살며시 곁을 지키는 다정함｜상대의 표정이나 목소리 변화를 빨리 알아채요. 강요하지 않고 옆에 있어 주니 상대가 안심하고 속마음을 꺼낼 수 있어요.", "나다움을 소중히 할 수 있어요｜유행이나 주변 말에 너무 휩쓸리지 않고 나에게 맞는 걸 고를 수 있어요. 그 모습이 주변에도 '나답게 있어도 괜찮구나' 하는 마음을 줘요.", "눈앞의 일에 집중할 수 있어요｜좋아하는 작업에 들어가면 시간 가는 줄 모르고 몰입해요. 정성을 들인 만큼 결과물에 따뜻함이 묻어나요."], "pitfalls": ["'싫어'를 말 못 하고 끌어안아요｜상대에게 상처 주기 싫은 마음이 크기 때문이에요. 바로 대답하지 말고 '조금 생각해 볼게' 하고 시간을 받으면 내 진짜 마음을 확인할 수 있어요.", "먼 계획이 어려워지기 쉬워요｜지금의 마음을 소중히 하는 만큼 먼 계획은 실감이 잘 안 나요. 큰 계획은 작게 나눠서 하나씩 캘린더에 넣으면 편해져요.", "비판을 너무 깊이 받아들여요｜만든 것에 내 마음이 담겨 있기 때문이에요. 의견을 '작품에 대한 것'과 '나에 대한 것'으로 나눠서 들으면 마음이 가벼워져요."], "relationships": "여럿이 떠들썩하게 지내는 것보다 마음 맞는 소수와 느긋하게 보내는 걸 좋아해요. 친구의 취향이나 컨디션 변화를 기억해 두고, 티 나지 않는 배려를 할 수 있어요. 회사나 학교에서는 분위기를 부드럽게 만드는 존재로 소중히 여겨지기 쉬울 거예요. 잘 맞는 사람은 이쪽이 느끼는 방식을 부정하지 않고 페이스를 맞춰 주는 사람이에요. 천천히 마음을 여는 편이라 시간을 들인 관계일수록 깊은 신뢰가 자라나요.", "love": "좋아하게 될 때는 말보다 분위기나 함께 있을 때의 편안함에 끌려요. 상대를 위해 편지를 쓰거나 취향에 맞는 선물을 고르는 등 마음을 형태로 만드는 데 능해요. 소중히 여기고 싶은 건 서로의 페이스와 좋아하는 것을 존중할 수 있는 거예요. 엇갈리기 쉬운 건 불만을 말하지 않고 쌓아 둘 때예요. 작을 때 '조금 서운했어' 하고 전하면 관계가 더 편안해져요.", "work": "내 감성을 살릴 수 있는 일, 누군가에게 도움이 되고 있다는 손맛이 있는 일에서 힘이 나요. 만들기나 디자인, 사람 곁에서 직접 돕는 역할에서는 꼼꼼함과 다정함이 인정받기 쉬울 거예요. 내 페이스대로 진행할 수 있는 환경이면 집중력이 쑥 올라가요. 반대로 경쟁이 치열한 직장이나 숫자로만 평가받는 환경에서는 쉽게 지쳐요. 좋아하는 부분이 하나라도 있으면 오래 이어 가기 쉬워져요.", "jobs": ["디자이너", "헤어 디자이너·네일 아티스트", "보육교사", "파티시에·요리사", "동물 간호사·애견 미용사"], "growth": "당신의 '좋아'는 주변에도 소중한 힌트가 돼요. 오늘부터 할 수 있는 건 그날 느낀 '좋았던 일'을 한 줄만 메모해 보는 거예요. 내 취향과 소중히 하고 싶은 것이 말로 또렷하게 보이기 시작해요. 마음이 내키면 그중 하나를 누군가에게 이야기해 보세요.", "A": "자기주장형 ISFP는 자신의 감각을 곧게 믿고 행동할 수 있어요. 주변 평가를 크게 신경 쓰지 않고 좋아하는 일에 당당하게 몰두할 수 있는 게 특징이에요. 기분 전환도 빨라서 밝은 인상을 주기 쉬울 거예요.", "T": "신중형 ISFP는 주변 사람의 마음에 아주 민감해서 섬세한 배려를 할 수 있어요. 내가 만드는 걸 더 좋게 만들고 싶은 마음이 커서 몇 번이고 다듬어요. 그 꼼꼼함이 깊은 매력으로 이어져요."}, "ESTP": {"catch": "생각보다 한 걸음 먼저 나가서, 그 자리의 흐름을 잡는 사람", "overview": "'일단 가 보자'가 자연스럽게 입에서 나와요. ESTP는 머리로 생각하기보다 몸을 움직이면서 답을 찾는 사람이에요. 새로 생긴 가게나 이벤트, 처음 가는 곳에도 망설임 없이 뛰어들고, 그 자리의 분위기를 재빨리 읽어 내요. 말이 빠르고 템포가 좋아서 주변에서는 '행동력 있고 든든한 사람'으로 보기 쉬울 거예요. 책상 위의 이론보다 지금 여기서 일어나는 현실을 중요하게 여겨요. 예상 밖의 일이 생겨도 즐길 수 있는 타입이고, 위기 상황일수록 진가를 발휘해요. 사람들과 어울리는 걸 좋아해서 처음 만난 사람과도 금방 친해져요. 그 밝음과 가벼운 몸놀림이 주변 사람들을 움직이는 계기가 되고 있어요.", "strengths": ["순간 판단이 빨라요｜상황이 바뀌어도 금방 '지금 뭘 해야 하는지'를 찾아내요. 망설이는 시간을 줄여서 팀을 앞으로 나아가게 해요.", "분위기를 띄우는 힘｜대화 템포가 좋아서 자연스럽게 자리를 밝게 만들어요. 처음 만나는 사람과도 금방 친해질 수 있는 게 강점이에요.", "현실에 맞춰 움직일 수 있어요｜이상론보다 '실제로 어떻게 할지'를 생각해요. 쓸 수 있는 도구와 사람을 잘 조합해서 결과물로 만들어 가요.", "실패를 두려워하지 않고 도전해요｜잘 안 돼도 '다음 거 가자' 하고 전환할 수 있어요. 그 가벼움이 새로운 기회를 끌어당겨요."], "pitfalls": ["앞일은 뒤로 미루기 쉬워요｜눈앞의 일에 온 힘을 쏟는 만큼 먼 일정은 잘 안 보여요. 일주일에 한 번 휴대폰으로 다음 주 일정을 훑어보는 시간을 만들면 안심이에요.", "기세에 말이 지나칠 때가 있어요｜대화 템포를 중요하게 여기다 보니 말이 먼저 나갈 때가 있어요. 중요한 이야기 전에 한 박자만 쉬어도 전달되는 느낌이 달라져요.", "단조로운 작업에 집중이 끊겨요｜자극이 없으면 지루함을 느끼기 쉽기 때문이에요. 작업에 시간제한을 걸어서 게임처럼 하면 끝까지 이어 가기 쉬워져요."], "relationships": "친구가 많고 부르면 가볍게 나가는 타입이에요. 주말에 갑자기 '지금 놀자' 하고 연락하는 것도 잘해요. 회사나 동아리에서는 분위기를 움직이는 분위기 메이커로 의지를 받기 쉬울 거예요. 시원시원한 성격이라 꼬인 분위기를 전환하는 것도 잘해요. 잘 맞는 사람은 함께 새로운 걸 즐길 수 있고, 가끔은 차분한 시각도 보태 주는 사람이에요. 서로 눈치 보지 않는 관계가 편하게 느껴져요.", "love": "좋아하게 되면 행동으로 마음을 보여 주는 타입이에요. 신경 쓰이는 사람에게 과감하게 먼저 만나자고 하고, 함께 놀러 다니면서 거리를 좁혀 가요. 데이트는 액티비티나 여행처럼 즐거운 시간을 함께할 수 있는 걸 좋아해요. 소중히 여기는 건 함께 있을 때 있는 그대로의 나로 있을 수 있는 거예요. 엇갈리기 쉬운 건 상대가 차분하게 이야기하고 싶어 할 때예요. 가끔 마음을 가라앉히고 상대의 마음을 듣는 시간을 만들면 유대가 더 깊어져요.", "work": "변화가 많고 결과가 바로 보이는 일에서 힘을 발휘해요. 영업이나 현장 대응처럼 사람과 직접 주고받는 역할에서는 협상력과 대응 속도가 인정받기 쉬울 거예요. 문제가 생겼을 때 '해결사'로도 의지를 받아요. 반대로 같은 작업만 반복하는 일이나 결정되기까지 오래 걸리는 환경에서는 쉽게 지쳐요. 움직이면서 생각할 수 있는 곳에서 가장 빛나요.", "jobs": ["영업직", "이벤트 플래너", "스포츠 트레이너", "소방관·경찰관", "창업·매장 운영"], "growth": "당신의 행동력은 약간의 준비만 더해도 훨씬 강해져요. 오늘부터 할 수 있는 건 중요한 결정 전에 '10초만 기다리는' 거예요. 그사이에 다른 선택지나 상대의 마음을 하나 떠올려 보세요. 또 자기 전에 내일 일정을 하나 확인하는 습관도 당신의 기세를 받쳐 줘요.", "A": "자기주장형 ESTP는 자신감이 넘치고 망설임 없이 행동으로 옮길 수 있어요. 주변 시선을 크게 신경 쓰지 않고 새로운 자리에도 거침없이 뛰어드는 게 특징이에요. 자연스럽게 리더 역할을 맡게 되는 경우도 많을 거예요.", "T": "신중형 ESTP는 행동력에 더해 주변 반응을 잘 살피는 냉정함이 있어요. 움직인 뒤에 돌아보는 습관이 있어서 다음 도전에 경험을 제대로 살릴 수 있어요. 기세와 신중함의 균형이 잡힌 믿음직한 존재예요."}, "ESFP": {"catch": "지금 이 순간을 주변과 함께 즐겁게 만드는 사람", "overview": "재밌어 보이는 약속에는 고민하기도 전에 '갈래!'라고 답하고 있어요. ESFP는 지금 이 순간을 온 힘을 다해 즐기고, 그 즐거움을 주변에도 퍼뜨리는 사람이에요. 표정이 풍부해서 이야기하는 것만으로도 분위기가 확 밝아져요. 처음 가는 곳에서도 금방 적응하고, 어느새 무리의 중심에 있는 경우도 많을 거예요. 사람들이 기뻐하는 얼굴을 보는 걸 좋아해서 친구 생일이나 소소한 축하를 소중히 해요. 이론보다 그 자리의 분위기와 사람의 마음을 느끼며 움직이는 타입이에요. 처져 있는 사람이 있으면 슬쩍 웃게 만들어 기운을 북돋아 줘요. 주변에서는 '같이 있으면 즐거운 사람'으로 여겨져서 자연스럽게 사람들이 모여들어요.", "strengths": ["분위기를 밝게 만들어요｜웃는 얼굴과 리액션으로 긴장된 자리도 풀어 줘요. 주변이 말하기 편한 분위기를 자연스럽게 만들 수 있어요.", "사람의 마음을 빨리 알아채요｜상대가 즐거워하는지, 지치지는 않았는지 금방 느껴요. 그 자리에서 바로 말을 건넬 수 있는 다정함이 있어요.", "새로운 환경에 금방 적응해요｜전학이나 부서 이동, 여행지에서도 금방 친해져요. 모르는 사람과도 연결되며 인맥을 넓혀 갈 수 있는 게 강점이에요.", "'즐거움'을 실제로 만들어 내요｜모임이나 이벤트 아이디어가 술술 떠올라요. 생각나면 바로 움직여서 모두의 추억을 만들어요."], "pitfalls": ["일정을 너무 빽빽하게 채워요｜제안을 거절하는 게 어렵고, 재밌어 보이는 일에는 전부 응하고 싶어지기 때문이에요. 일주일에 하루는 '아무것도 안 하는 날'을 먼저 정해 두면 피로를 쌓지 않을 수 있어요.", "돈과 시간이 자꾸 새어 나가요｜그 순간의 즐거움을 먼저 챙기기 쉽기 때문이에요. 쇼핑 전에 '하룻밤 두고 보기'를 정해 두면 정말 갖고 싶은 것만 남아요.", "무거운 이야기를 피하기 쉬워요｜분위기를 밝게 유지하고 싶은 마음이 크기 때문이에요. 중요한 이야기는 즐거운 시간과는 따로 짧게 시간을 잡으면 마주하기 쉬워져요."], "relationships": "친구가 많고 단톡방에서도 자주 말하는 분위기 메이커예요. 누구와도 편하게 이야기할 수 있어서 회사나 학교에서는 사람과 사람을 잇는 역할을 맡기 쉬울 거예요. 상대의 작은 변화도 알아채고 '요즘 어때?' 하고 말을 건넬 수 있는 따뜻함이 있어요. 잘 맞는 사람은 이쪽의 밝음을 받아 주면서 가끔은 차분하게 이야기를 들어 주는 사람이에요. 함께 웃는 시간이 많을수록 관계가 오래가요.", "love": "좋아하게 되면 마음이 바로 태도에 드러나는 타입이에요. 보고 싶다, 이야기하고 싶다는 생각이 들면 솔직하게 연락해요. 데이트에서는 서프라이즈나 즐거운 계획으로 상대를 기쁘게 하는 데 능해요. 소중히 여기는 건 함께 있을 때 즐겁고 마음을 솔직하게 드러낼 수 있는 거예요. 엇갈리기 쉬운 건 미래 이야기처럼 먼 일을 상의할 때예요. 가끔은 진지하게 생각하는 시간을 가지면 연인의 신뢰가 확 높아져요.", "work": "사람들과 어울리면서 반응이 바로 돌아오는 일에서 힘을 발휘해요. 접객이나 판매, 이벤트 같은 일에서는 밝음과 배려가 인정받기 쉬울 거예요. 팀 분위기를 좋게 만드는 존재로도 소중히 여겨져요. 반대로 하루 종일 혼자 컴퓨터 앞에 있는 일이나 변화가 적은 반복 작업만 있는 환경에서는 쉽게 지쳐요. 사람들의 웃는 얼굴이 보이는 곳에서 가장 힘이 나요.", "jobs": ["접객·판매 스태프", "투어 가이드·여행 플래너", "이벤트 스태프", "보육교사·유치원 교사", "엔터테인먼트 분야"], "growth": "당신의 밝음은 약간의 계획이 있으면 더 오래 이어져요. 오늘부터 할 수 있는 건 매달 초에 '기대되는 일정'과 '해야 할 일'을 하나씩 적어 보는 거예요. 둘 다 눈에 보이면 기분 좋게 둘을 함께 챙길 수 있어요. 또 지쳤을 때는 '오늘은 쉴게' 하고 솔직하게 말해 보세요.", "A": "자기주장형 ESFP는 자신의 매력을 마음껏 표현할 수 있어요. 주변 평가를 너무 신경 쓰지 않고 마음먹으면 바로 행동으로 옮기는 게 특징이에요. 사람들 앞에 서는 자리에서도 자연스럽게 즐길 수 있을 거예요.", "T": "신중형 ESFP는 밝음 속에 주변을 향한 세심한 배려가 있어요. 상대가 어떻게 느꼈을지 잘 생각하기 때문에 사람의 마음에 다가가는 힘이 강해요. 그 다정함이 깊은 신뢰 관계를 키워 가요."}}, "HN": {"type": {"ISTJ": {"want": "정한 일을 끝까지 해내는 성취감과, 믿음을 얻는 안정감", "effort": "규칙과 순서를 지키며 실수 없이 쌓아 가는 것", "work": "규칙과 절차가 분명하고, 정확함을 인정받는 일", "jobs": ["회계·사무", "품질 관리", "공무원", "시스템 운영"]}, "ISFJ": {"want": "누군가에게 도움이 되고 있다는 실감과, 마음 놓을 수 있는 자리", "effort": "먼저 알아서 챙기며 주변을 받쳐 주는 것", "work": "가까운 사람을 돕고, 고마움이 바로 돌아오는 일", "jobs": ["간호·요양", "보육", "총무", "의료 사무"]}, "INFJ": {"want": "의미 있는 일에 함께하고 있다는 감각과, 깊이 서로 이해하는 관계", "effort": "사람의 마음을 읽고, 말로 하지 못하는 생   const av=x=>x.length?x.reduce((s,v)=>s+v,0)/x.length:2.5;sw[A.k]=Math.abs(av(a)-av(b))<1.5;});return sw;}

function wrapLines(ctx,text,maxW,maxLines){
 const units=LANG==="ja"&&typeof BX!=="undefined"?BX.seg(text.replace(/​/g,"")).split("​"):text.split(/(?<=\s)/);
 const lines=[];let cur="";
 const push=u=>{if(ctx.measureText(cur+u).width<=maxW||!cur){if(ctx.measureText(u).width>maxW&&!cur){for(const ch of u){if(ctx.measureText(cur+ch).width>maxW){lines.push(cur);cur="";}cur+=ch;}}else cur+=u;}else{lines.push(cur.trimEnd());cur=u.trimStart();}};
 units.forEach(push);if(cur)lines.push(cur);
 if(lines.length>maxLines){lines.length=maxLines;let l=lines[maxLines-1];while(l&&ctx.measureText(l+"…").width>maxW)l=l.slice(0,-1);lines[maxLines-1]=l+"…";}
 return lines;}
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

 ctx.fillStyle=SC.bg;ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#fff";rrect(ctx,48,48,W-96,H-96,36);ctx.fill();ctx.strokeStyle=SC.rule;ctx.lineWidth=2;ctx.stroke();
 ctx.textBaseline="alphabetic";ctx.textAlign="left";
 ctx.font="600 54px "+MONO;ctx.fillStyle=SC.ink;ctx.fillText("16TYPE",110,160);const lw=ctx.measureText("16TYPE").width;ctx.fillStyle=SC.plus;ctx.fillText("+",110+lw,160);
 ctx.font="500 26px "+SANS;ctx.fillStyle=SC.muted;ctx.textAlign="right";ctx.fillText(TR("生まれつきと、今のわたし"),W-110,156);ctx.textAlign="left";
 const NC=me.nAT?5:4,cols=[SC.ei,SC.sn,SC.tf,SC.jp,SC.plus],bl=me.born.split("").concat(me.nAT?[me.bAT||"–"]:[]),nl=me.now.split("").concat(me.nAT?[me.nAT]:[]);
 const tw=148,gap=22,x0=(W-(tw*5+gap*4))/2,xs=(W-(tw*NC+gap*(NC-1)))/2,y1=270,y2=y1+tw+120;
 ctx.font="700 28px "+SANS;ctx.fillStyle=SC.ink;ctx.fillText(TR("生まれつき"),xs,y1-22);ctx.fillText(TR("いま"),xs,y2-16);
 for(let i=0;i<NC;i++){const x=xs+i*(tw+gap),c=cols[i],ch=bl[i]!==nl[i]&&nl[i]!=="?"&&bl[i]!=="–";
  ctx.setLineDash([12,9]);ctx.lineWidth=5;ctx.strokeStyle=c;rrect(ctx,x+3,y1+3,tw-6,tw-6,22);ctx.stroke();ctx.setLineDash([]);
  ctx.font="600 84px "+MONO;ctx.textAlign="center";ctx.fillStyle=SC.ink;ctx.fillText(bl[i],x+tw/2,y1+tw/2+30);
  ctx.fillStyle=ch?c:SC.rule;ctx.font="700 44px "+SANS;ctx.fillText(ch?"↓":"｜",x+tw/2,y1+tw+64);
  if(nl[i]==="?"){ctx.strokeStyle=SC.rule;ctx.lineWidth=4;rrect(ctx,x+2,y2+2,tw-4,tw-4,22);ctx.stroke();ctx.fillStyle=SC.muted;}else{ctx.fillStyle=c;rrect(ctx,x,y2,tw,tw,22);ctx.fill();ctx.fillStyle="#fff";}
  ctx.font="600 84px "+MONO;ctx.fillText(nl[i],x+tw/2,y2+tw/2+30);ctx.textAlign="left";}
 let y=y2+tw+90;
 ctx.font="700 34px "+SANS;ctx.fillStyle=SC.ink;const g=TR("ギャップ度 ")+me.pct+"%";ctx.fillText(g,x0,y);

 y+=26;const kx=x0,kw=W-2*x0,room=H-200-y;let fs=38,kl,lh,kh;

 ctx.fillStyle=SC.soft;rrect(ctx,kx,y,kw,kh,24);ctx.fill();ctx.fillStyle=SC.plus;ctx.font="700 24px "+SANS;ctx.fillText(TR("辛口のひと言"),kx+36,y+50);
 ctx.fillStyle=SC.ink;ctx.font="700 "+fs+"px "+SANS;kl.forEach((l,i)=>ctx.fillText(l,kx+36,y+64+lh*0.9+i*lh));
 ctx.textAlign="center";ctx.font="500 28px "+SANS;ctx.fillStyle=SC.muted;ctx.fillText(TR("あなたのギャップも見てみる →"),W/2,H-138);
 ctx.font="600 34px "+MONO;ctx.fillStyle=SC.ink;ctx.fillText(SHARE_URL.replace("https://",""),W/2,H-90);
