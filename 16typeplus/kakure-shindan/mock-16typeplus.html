<title>16TYPE+ 新デザイン見本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one reading column. Entry form on top, the result report below it; the "+" (birth layer) is the brand mark. */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --ink:#1F2733; --muted:#5E6A7A; --rule:#E2E6EC; --soft:#EEF1F5;
  --born:#8A94A3; --plus:#C2553F;
  --ei:#3E7FA6; --sn:#C29A3A; --tf:#3F9A72; --jp:#7A5EA8;
  --back:#2B3442;--tint-at:#F6E3DE;--tint-b:#F6D5CC;--tint-n:#D6E4EE;--tint-ei:#E6F0F6; --tint-sn:#F7F0DE; --tint-tf:#E4F2EB; --tint-jp:#EEE9F6;
  --sans:"IBM Plex Sans JP","Noto Sans KR","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161C; --surface:#1A2028; --ink:#E7EBF0; --muted:#9AA5B4; --rule:#2B333E; --soft:#222934; --born:#8792A2; --plus:#E27B64;
  --ei:#6AA9CF; --sn:#DDB65A; --tf:#62BE94; --jp:#A68BD3;
  --back:#3A4556;--tint-at:#3A2622;--tint-b:#4A2A24;--tint-n:#20374A;--tint-ei:#1C2A35; --tint-sn:#2D2717; --tint-tf:#182B23; --tint-jp:#262033; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161C; --surface:#1A2028; --ink:#E7EBF0; --muted:#9AA5B4; --rule:#2B333E; --soft:#222934; --born:#8792A2; --plus:#E27B64;
  --ei:#6AA9CF; --sn:#DDB65A; --tf:#62BE94; --jp:#A68BD3;
  --back:#3A4556;--tint-at:#3A2622;--tint-b:#4A2A24;--tint-n:#20374A;--tint-ei:#1C2A35; --tint-sn:#2D2717; --tint-tf:#182B23; --tint-jp:#262033; color-scheme:dark}
[hidden]{display:none!important}
.compat .t,.phead .t,.hl b,.p16,.slotname b,.story .b,.story .n,.combo,.face .t,.cc .pair b,.invt span,.tile,.gt{white-space:nowrap;overflow-wrap:normal;word-break:normal}
.compat .t{flex:none}
.page *{text-wrap-style:pretty}
h1,h2,h3,.story{text-wrap-style:balance}
.story .ln{display:inline-block}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.8;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{word-break:keep-all;overflow-wrap:anywhere;line-break:strict;max-width:640px;margin:0 auto;padding-block:0 56px;display:flex;flex-direction:column;gap:20px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-bottom:1px solid var(--rule)}
.logo{display:flex;align-items:baseline;gap:10px;min-width:0}
.logo .en{font-family:var(--mono);font-weight:600;font-size:20px;letter-spacing:.02em;white-space:nowrap}
.logo .jp{font-size:11px;color:var(--muted);letter-spacing:.08em;border-left:1px solid var(--rule);padding-left:10px;white-space:nowrap}
.logo em{font-style:normal;color:var(--plus)}
.lang{display:flex;gap:2px;border:1px solid var(--rule);border-radius:999px;padding:2px;font-size:12px}
.lang{flex:none}
.lang a{white-space:nowrap;padding:3px 10px;border-radius:999px;color:var(--muted);text-decoration:none}
.lang a[aria-current]{background:var(--ink);color:var(--surface)}
.note{font-size:12px;color:var(--muted);text-align:center;margin:-6px 0 0}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:22px 20px}
h1{font-size:28px;line-height:1.35;margin:8px 0 10px;text-wrap:balance}
h1 em{font-style:normal;color:var(--plus)}
h2{font-size:17px;margin:0 0 14px;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0}
.intro p{margin:0;font-size:14.5px}
.eq{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0 4px;flex-wrap:wrap;font-size:13px}
.eq span{border:1px solid var(--rule);border-radius:10px;padding:6px 12px;background:var(--surface)}
.eq span{display:flex;flex-direction:column;align-items:center;line-height:1.4}
.eq small{font-size:11px;color:var(--muted)}
.eq b{font-family:var(--mono);color:var(--plus);font-size:18px}
/* form */
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.field>label,.field>.lbl{font-weight:700;font-size:14px}
.hint{font-size:12px;color:var(--muted);margin:0}
.date{display:flex;gap:8px}
.date select{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 8px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink)}
.picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.seg button{font-family:var(--mono);font-weight:600;font-size:20px;padding:8px 0 2px;border:0;background:var(--surface);color:var(--muted);cursor:pointer;line-height:1.2}
.seg button small{display:block;font-family:var(--sans);font-size:10.5px;font-weight:500;padding-bottom:6px}
.seg button+button{border-top:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--c);color:#fff}
.fork{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;font:inherit;padding:14px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--rule)}
.opt b{font-size:15px}
.opt small{font-size:12px;color:var(--muted);display:flex;flex-direction:column;line-height:1.6}
.opt b,.opt small span{white-space:nowrap}
.opt:hover{background:var(--soft)}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
#pickField .btn{margin-top:8px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 2px}
.slots span{font-family:var(--mono);font-weight:600;font-size:34px;line-height:1.3;text-align:center;border-bottom:3px solid var(--rule);color:var(--ink);transition:border-color .2s}
.slots span.empty{color:var(--rule)}
.slots span.fill{border-color:var(--c)}
.slots span.pop{animation:pop .25s ease}
@keyframes pop{0%{transform:scale(.6);opacity:.3}100%{transform:scale(1);opacity:1}}
.seg{box-shadow:0 2px 0 var(--rule)}
.seg button:not([aria-pressed="true"]){color:var(--ink)}
.seg button:not([aria-pressed="true"]):hover{background:var(--soft)}
.seg button:active{transform:translateY(1px)}
.seg.done button:not([aria-pressed="true"]){color:var(--muted)}
.btn:disabled{background:var(--soft);color:var(--muted);border-color:var(--rule);cursor:default}
.slotname{margin:0;text-align:center;font-size:13px;color:var(--muted);min-height:1.5em}
.slotname b{color:var(--ink)}
.p16{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.4;font-family:var(--mono)}
.p16 small{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap}
.atpick{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.atl{font-size:12.5px;color:var(--muted)}
.atb{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.atb button{font-family:var(--mono);font-weight:600;font-size:18px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink);padding:6px 0;cursor:pointer;box-shadow:0 2px 0 var(--rule);line-height:1.3}
.atb button small{display:block;font-family:var(--sans);font-weight:500;font-size:10.5px}
.atb button.unk{font-family:var(--sans);font-size:13px}
.atb button[aria-pressed="true"]{background:var(--plus);border-color:var(--plus);color:#fff}
.atb button.unk[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.alt{display:block;text-align:center;font-size:13.5px;color:var(--ink);background:var(--soft);border-radius:10px;padding:10px 12px;text-decoration:none}
.alt b{color:var(--plus)}
.btn{display:block;width:100%;text-align:center;padding:14px 16px;border-radius:10px;font-weight:700;font-family:inherit;font-size:16px;cursor:pointer;border:1px solid var(--rule);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--ei);outline-offset:2px}
/* result hero */
.hero{text-align:center;padding-block:26px 22px}
.combo{font-family:var(--mono);font-weight:600;font-size:40px;letter-spacing:.04em;line-height:1.15;margin:6px 0 4px;display:flex;justify-content:center;align-items:baseline;gap:10px;flex-wrap:wrap}
.combo .p{color:var(--plus)}
.combo .b{color:var(--born)}
.hero .nick{font-weight:700;font-size:18px;margin:0}
.chara{width:150px;height:150px;margin:10px auto 6px;border-radius:50%;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.chara img{width:134px;height:134px;object-fit:contain}
.kan{font-size:12px;color:var(--muted);margin:0}
.faces{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;text-align:left}
.face{border:1px solid var(--rule);border-radius:12px;padding:12px 14px;min-width:0}
.face .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.face .t{font-family:var(--mono);font-weight:600;font-size:22px;letter-spacing:.05em}
.face .n{font-size:13px;line-height:1.5}
.face.born .t{color:var(--born)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.now{background:var(--ink)} .dot.born{background:var(--surface);border:2px solid var(--born)}
/* hero story */
.story .b,.story .n,.nw{white-space:nowrap}
.story{font-size:clamp(18px,5.6vw,24px);line-height:1.6;margin:8px 0 18px;text-wrap:balance}
.story .b{font-family:var(--mono);color:var(--plus);letter-spacing:.04em}
.story .n{font-family:var(--mono);letter-spacing:.04em}
.flip{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr)) minmax(0,.9fr);gap:6px 7px;align-items:center;max-width:400px;margin:0 auto}
.flip .tile{font-size:clamp(20px,6.5vw,30px)}
.flip .tile.at{margin-left:6px}
.flip .axl{overflow:visible}
@media (max-width:480px){.flip{grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,.9fr);gap:4px 7px}
 .flip .rl{grid-column:1/-1;text-align:left;display:flex;gap:6px;align-items:baseline;padding:0}
 .flip .rl b{display:inline;font-size:12px}.flip .rl.e{display:none}}
.tile.n.none{background:none;border:2px dashed var(--rule);color:var(--muted)}
.atnote{font-size:11.5px;color:var(--muted)}
.flip .rl{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap;padding-right:2px;line-height:1.35}
.flip .rl b{display:block;color:var(--ink);font-size:12px}
.tile{font-family:var(--mono);font-weight:600;font-size:30px;line-height:1;aspect-ratio:1/1.05;display:grid;place-items:center;border-radius:10px}
.tile.b{border:2px dashed var(--rule);color:var(--ink)}
.tile.n{background:var(--soft);color:var(--ink)}
.tile.n.c{background:var(--c);color:#fff;box-shadow:0 4px 12px -4px var(--c)}
.tile.b.c{border-color:var(--c)}
.arw{text-align:center;font-size:14px;line-height:1;color:var(--rule)}
.arw.c{color:var(--c);font-size:18px;font-weight:700}
.axl{white-space:nowrap;letter-spacing:-.02em;font-size:10px;color:var(--muted);text-align:center;line-height:1.3}
.flipsum{font-size:14px;margin:16px 0 0}
.flipsum b{color:var(--plus)}
.nicks{display:flex;align-items:stretch;gap:8px;margin-top:18px;text-align:left}
.nk{flex:1;min-width:0;border:1px solid var(--rule);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.nk .nl{font-size:11px;color:var(--muted)}
.nk .nn{font-size:13.5px;font-weight:700;line-height:1.5}
.nk.born{border-color:var(--ink)}
.nar{align-self:center;color:var(--plus);font-weight:700}
@media (prefers-reduced-motion:no-preference){.tile.n.c{animation:flipin .6s ease both;animation-delay:calc(var(--i)*.12s + .2s)}}
@keyframes flipin{0%{transform:rotateX(90deg);opacity:0}100%{transform:none;opacity:1}}
/* combo card */
.cc .pair{font-family:var(--mono);font-size:13px;color:var(--muted);margin:0 0 4px;letter-spacing:.04em}
.cc .pair b{color:var(--ink)}
.cc h2{font-size:22px;margin:0 0 14px}
.cc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.cc li{display:flex;gap:10px;font-size:15px;line-height:1.7}
.cc li::before{content:"✓";color:var(--tf);font-weight:700;flex:none}
.karai{margin-top:16px;background:var(--soft);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.7}
.karai .kl{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--plus);border-radius:999px;padding:0 9px;margin-bottom:4px}
.cc .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.cc .pair b.pb{color:var(--plus)}
.cc .pair .x{margin:0 6px;color:var(--muted)}
.cclg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin:-6px 0 14px;color:var(--muted)}
.cclg span::before{content:"";display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
.cclg .mk-b::before{background:var(--tint-b)}
.cclg .mk-n::before{background:var(--tint-n)}
.hb{background:linear-gradient(transparent 55%,var(--tint-b) 55%);color:var(--ink)}
.hn{background:linear-gradient(transparent 55%,var(--tint-n) 55%);color:var(--ink)}
.hcard{display:flex;flex-direction:column;gap:12px}
.hcard .eyebrow{margin-bottom:-4px}
.hcols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hc{border:1px solid var(--rule);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.hc.born{border-color:var(--plus)}
.hl{font-size:12px;color:var(--muted)}
.hl b{font-family:var(--mono);color:var(--ink)}
.hc.born .hl b{color:var(--plus)}
.hs{font-size:11px;color:var(--muted)}
.hc p{margin:2px 0 0;font-size:14px;font-weight:700;line-height:1.6}
.hh{font-size:16px;margin:10px 0 -4px;padding-top:12px;border-top:1px solid var(--rule)}
.hq{margin:0;font-size:13px;color:var(--muted)}
.hw{display:flex;flex-direction:column;gap:12px}
.hw .it{display:flex;flex-direction:column;gap:4px}
.hw .ax{font-size:11px;font-weight:700;color:var(--c)}
.hw p{margin:0;font-size:14.5px;line-height:1.75}
.hw .key{font-size:13.5px;background:var(--soft);border-radius:8px;padding:6px 10px}
.hw .key b{color:var(--plus);margin-right:6px;font-size:12px}
.hjob{display:flex;flex-direction:column;gap:6px}
.hjob p{margin:0;font-weight:700;font-size:15px}
.gc{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-bottom:4px}
.gtiles{display:flex;align-items:center;gap:6px;flex:none}
.gtl{display:flex;flex-direction:column;align-items:center;gap:3px;width:46px}
.gt{font-family:var(--mono);font-weight:600;font-size:18px;width:34px;height:34px;display:grid;place-items:center;border-radius:8px}
.gt.b{border:2px dashed var(--c);color:var(--ink)}
.gt.n{background:var(--c);color:#fff}
.gtl b{font-size:11px;line-height:1.2;color:var(--c);white-space:nowrap}
.gar{color:var(--c);font-weight:700;margin-bottom:16px}
.gtx{box-sizing:border-box;min-width:0;width:100%;display:flex;flex-direction:column;background:var(--surface);border-radius:10px;padding:10px 12px}
.gtx small{font-size:11px;color:var(--muted);margin-bottom:2px}
.gtx .row{display:flex;gap:8px;font-size:14px;line-height:1.6;font-weight:700}
.gtx .row i{font-style:normal;font-weight:500;font-size:11px;color:var(--muted);width:3em;flex:none;padding-top:3px}
.gtx .row.n{color:var(--c)}
.hw .it{background:var(--t,var(--soft));border-radius:14px;padding:14px}
.hw .it>p:not(.key){font-size:15px;line-height:1.8;margin:2px 0}
.hw .key{background:var(--surface)!important;border-radius:10px!important;padding:10px 12px!important}
.hw .wk{border-left:4px solid var(--c)}
.sech{display:flex;align-items:center;gap:8px;font-size:18px;margin:0}
.sech .ico{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:12px;font-weight:700;flex:none}
.karaicard{padding:0;border:0;background:none}
.karaicard .karai{padding:16px 18px;border:1px solid var(--rule)}
.karaicard .karai{margin:0}
.hjob{background:var(--soft);border-radius:14px;padding:14px}
.hjob .tags li{background:var(--surface)}
.hcard .hq{margin-top:-4px}
.hjob .tags{flex-direction:row}
.hjob .tags li{display:block;font-size:13px;line-height:1.6}
.hjob .tags li::before{content:none}
.hmore summary{cursor:pointer;font-size:13px;color:var(--muted);padding:4px 0}
.hmore[open] summary{margin-bottom:10px}
@media (max-width:380px){.hcols{grid-template-columns:1fr}}
/* partner */
.pf{display:flex;flex-direction:column;gap:12px}
.pres{margin-top:4px;display:flex;flex-direction:column;gap:12px}
.phead{display:flex;gap:12px;align-items:center}
.phead img{width:72px;height:72px;border-radius:50%;background:var(--soft);object-fit:contain;flex:none}
.phead .t{font-family:var(--mono);font-weight:600;font-size:24px;letter-spacing:.04em;line-height:1.2}
.phead small{display:block;font-size:12px;color:var(--muted)}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mx>div{border:1px solid var(--rule);border-radius:12px;padding:10px 12px}
.mx .l{font-size:11px;color:var(--muted)}
.mx .v{font-weight:700;font-size:15px}
.verdict{font-size:15px;line-height:1.75;margin:0}
.verdict b{display:block;font-size:17px;margin-bottom:2px}
.opt-mini{display:flex;gap:6px}
.opt-mini select{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 6px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink)}
/* today */
.today{display:flex;flex-direction:column;gap:12px}
.tdhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tdtabs{display:flex;border:1px solid var(--rule);border-radius:999px;padding:2px}
.tdtabs button{font:inherit;font-size:12px;border:0;background:none;color:var(--muted);padding:3px 12px;border-radius:999px;cursor:pointer}
.tdtabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.tddate{margin:-6px 0 0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tdrow{display:flex;gap:12px;align-items:flex-start}
.tdrow img{width:68px;height:68px;border-radius:50%;background:var(--soft);object-fit:contain;flex:none}
.bubble{position:relative;margin:4px 0 0;background:var(--soft);border-radius:4px 14px 14px 14px;padding:12px 14px;font-size:15px;line-height:1.75;min-width:0}
.tdchips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tdc{border:1px solid var(--rule);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column}
.tdc small{font-size:11px;color:var(--muted)}
.tdc b{font-size:14px}
.tdc .st{color:var(--plus);letter-spacing:.1em}
.tdtitle{margin:-4px 0 0;font-weight:700;font-size:18px}
.pwadd{display:block;font-weight:400;font-size:11.5px !important;color:var(--muted);line-height:1.5;margin-top:2px}
.tdtip{margin:0;display:flex;flex-direction:column;border-left:3px solid var(--plus);padding-left:12px}
.tdtip span{font-size:11px;color:var(--muted)}
.tdtip b{font-size:15px}
/* invite */
.invbar{display:flex;gap:14px;align-items:center;border-color:var(--plus)}

<script>
var LD={"ja": {"BODY": "<div class=\"page\">\n  <header class=\"bar\">\n    <div class=\"logo\"><span class=\"en\">16TYPE<em>+</em></span><span class=\"jp\">16タイププラス</span></div>\n    <nav class=\"lang\" aria-label=\"言語\"><a href=\"#\" aria-current=\"true\">日本語</a><a href=\"#\">EN</a><a href=\"#\">한국어</a></nav>\n  </header>\n  <p class=\"note\">デザイン見本（実際に診断できます）</p>\n\n  <section class=\"card invbar\" id=\"invBar\" hidden>\n    <img id=\"invImg\" alt=\"送ってくれた人の相棒キャラクター\">\n    <div><p class=\"eyebrow\">相性診断が届きました</p><p class=\"invt\"><b id=\"invWho\"></b>（<span id=\"invPair\"></span>）から。あなたの診断が終わると、2人の相性がわかります。</p></div>\n  </section>\n\n  <section class=\"card intro\">\n    <p class=\"eyebrow\">16タイプの、その先へ</p>\n    <h1>その16タイプ、<br><em>生まれつき</em>ですか？</h1>\n    <p>16タイプの結果は、環境や経験の中でいつの間にか変わっていく「今の自分」。生年月日からわかるのは、ずっと変わらない「本当の自分」。2つの差を知ると、仕事や人間関係が少し楽になるヒントが見えてきます。</p>\n    <div class=\"eq\" aria-hidden=\"true\"><span>今の自分<small>16タイプ</small></span><b>+</b><span>本当の自分<small>生年月日</small></span></div>\n  </section>\n\n  <section class=\"card how\">\n    <h2>この診断の質問は、ここがちがいます</h2>\n    <ol class=\"howl\">\n      <li><b>あいまいな質問をしない</b><span>「あなたはどんな人？」ではなく、「最近こうした？」と具体的な場面で聞きます。なりたい自分ではなく、今の自分が出ます。</span></li>\n      <li><b>「どちらでもない」をなくした</b><span>6段階で答えるので、必ずどちらかに少し寄ります。真ん中ばかりで決まらない、がありません。</span></li>\n      <li><b>同じことを、向きを変えて聞く</b><span>「人といると元気になる」と「ひとりの時間で落ち着く」のように、反対向きの質問を半分ずつ混ぜて、なんとなく「はい」と答えるクセを打ち消します。</span></li>\n      <li><b>答えの「揺れ」も測る</b><span>向きを変えた質問どうしで答えが食い違うと、その文字は「揺れやすい」と結果に出します。16タイプが毎回変わる理由が見えます。</span></li>\n      <li><b>はっきりした指標は早めに終わる</b><span>まず各指標6問ずつ答えてもらい、答えが真ん中に近い指標だけ、質問を追加して確かめます。はっきりしている人は30問、迷いやすい人ほど丁寧に聞きます（最大60問）。</span></li>\n      <li><b>生まれつきの5文字とくらべる</b><span>生年月日から出す本来の5文字と並べて、どこが変わったのかを見ます。</span></li>\n    </ol>\n  </section>\n\n  <section class=\"card\" id=\"formCard\" aria-labelledby=\"formh\">\n    <h2 id=\"formh\">診断をはじめる</h2>\n    <div class=\"field\">\n      <span class=\"lbl\">① 生年月日</span>\n      <div class=\"date\">\n        <select id=\"y\" aria-label=\"年\"></select><select id=\"m\" aria-label=\"月\"></select><select id=\"d\" aria-label=\"日\"></select>\n      </div>\n    </div>\n    <div class=\"field\">\n      <span class=\"lbl\">② 16タイプ診断を受けたことはありますか？</span>\n      <div class=\"fork\">\n        <button type=\"button\" class=\"opt\" id=\"hasType\" aria-pressed=\"false\"><b>ある・覚えている</b><small><span>4文字を選ぶだけ</span><span>約30秒</span></small></button>\n        <button type=\"button\" class=\"opt\" id=\"quiz\"><b>ない・忘れた</b><small><span>30〜60問で診断</span><span>約5〜10分</span></small></button>\n      </div>\n    </div>\n    <div class=\"field\" id=\"pickField\" hidden>\n      <span class=\"lbl\">③ そのとき出たタイプを選んでください</span>\n      <div class=\"slots\" id=\"slots\" aria-live=\"polite\"></div>\n      <p class=\"slotname\" id=\"slotName\"></p>\n      <div class=\"picker\" id=\"picker\"></div>\n      <div class=\"atpick\" id=\"atPick\" role=\"group\" aria-label=\"最後の1文字（A/T）\">\n        <span class=\"atl\">最後の1文字（A/T）も出た人は</span>\n        <div class=\"atb\"><button type=\"button\" data-v=\"A\" aria-pressed=\"false\">A<small>自己主張型</small></button><button type=\"button\" data-v=\"T\" aria-pressed=\"false\">T<small>慎重型</small></button><button type=\"button\" data-v=\"\" aria-pressed=\"true\" class=\"unk\">わからない</button></div>\n      </div>\n      <p class=\"hint\">ほかのサイトやアプリで出た結果でOK。迷ったら、いちばん最近の結果を。</p>\n      <button class=\"btn primary\" type=\"button\" id=\"go\">結果を見る</button>\n    </div>\n  </section>\n\n  <section class=\"card quiz\" id=\"quizCard\" hidden aria-live=\"polite\">\n    <div class=\"qtop\"><span class=\"qcount\" id=\"qCount\">1 / 32</span><button type=\"button\" class=\"qlink\" id=\"qBack\">← 戻る</button></div>\n    <div class=\"qprog\"><span id=\"qProg\"></span></div>\n    <p class=\"qnote\" id=\"qNote\">理想の自分ではなく、<b>最近3か月のあなた</b>で答えてください。反対向きの質問も混ざっています。考えすぎず、直感で。</p>\n    <p class=\"qaxis\" id=\"qAxis\"></p>\n    <h2 class=\"qtext\" id=\"qText\"></h2>\n    <details class=\"qex\" id=\"qExW\"><summary>例を見る</summary><p id=\"qEx\"></p></details>\n    <div class=\"qopts\" id=\"qOpts\"></div>\n    <button type=\"button\" class=\"qlink qquit\" id=\"qQuit\">診断をやめて、タイプを選ぶ</button>\n  </section>\n\n  <div id=\"result\" style=\"display:none\">\n  <section class=\"card hero\" aria-live=\"polite\">\n    <p class=\"eyebrow\" id=\"rSrc\">あなたの診断結果</p>\n    <h2 class=\"story\" id=\"rStory\"></h2>\n    <div class=\"flip\" id=\"flip\" role=\"group\" aria-label=\"タイルをタップしてめくる\"></div>\n    <p class=\"fliphint\" id=\"flipHint\"></p>\n    <div class=\"revs\" id=\"revs\"></div>\n    <button class=\"btn flipall\" id=\"flipAll\" type=\"button\">まとめてめくる</button>\n    <div class=\"hgap pend\"><div class=\"hgtop\"><span class=\"hgl\">ギャップ度</span><span class=\"hgn\"><span id=\"gNum\">0</span>%</span><span class=\"hgw\" id=\"gLbl\"></span></div>\n      <div class=\"meter\" role=\"img\" id=\"gMeter\"><span id=\"gBar\"></span></div></div>\n    <p class=\"flipsum pend\" id=\"rSum\"></p>\n    <div class=\"nicks pend\">\n      <div class=\"nk born\"><span class=\"nl\">生まれつき</span><span class=\"nn\" id=\"nkBorn\"></span><span class=\"p16\" id=\"p16Born\"></span></div>\n      <span class=\"nar\" aria-hidden=\"true\">→</span>\n      <div class=\"nk now\"><span class=\"nl\">いま</span><span class=\"nn\" id=\"nkNow\"></span><span class=\"p16\" id=\"p16Now\"></span></div>\n    </div>\n    <div class=\"karai hkarai pend\"><span class=\"kl\">辛口のひと言</span><div id=\"ccKarai\"></div></div>\n    <div class=\"shr pend\"><button class=\"btn primary\" type=\"button\" id=\"shareBtn\">結果を画像でシェア</button></div>\n  </section>\n\n  <section class=\"card hcard\" id=\"hints\">\n    <p class=\"eyebrow\">ギャップから見えるヒント</p>\n    <div class=\"hcols cc\">\n      <div class=\"hc born\"><span class=\"hl\">本当のあなた <b id=\"hBornT\"></b></span><span class=\"hs\">求めているもの</span><p id=\"hWant\"></p></div>\n      <div class=\"hc now\"><span class=\"hl\">今のあなた <b id=\"hNowT\"></b></span><span class=\"hs\">がんばっていること</span><p id=\"hEffort\"></p></div>\n    </div>\n    <h3 class=\"sech\"><span class=\"ico\" aria-hidden=\"true\">?</span>悩みのヒント</h3>\n    <p class=\"hq\" id=\"hWorryQ\">最近、こんなことで疲れていませんか？</p>\n    <div class=\"hw\" id=\"hWorry\"></div>\n    <details class=\"pmore hwk\"><summary><span class=\"sech\"><span class=\"ico\" aria-hidden=\"true\">◆</span>仕事のヒント</span></summary>\n    <div class=\"hw\" id=\"hWork\"></div>\n    <div class=\"hjob\"><span class=\"hs\">本当のあなたが満たされやすいのは</span><p id=\"hJobW\"></p><ul class=\"tags\" id=\"hJobs\"></ul></div>\n    </details>\n  </section>\n\n  <section class=\"card persona\" id=\"persona\">\n    <div class=\"ptabs\" role=\"tablist\"><button type=\"button\" role=\"tab\" id=\"pNow\" aria-selected=\"true\"></button><button type=\"button\" role=\"tab\" id=\"pBorn\" aria-selected=\"false\"></button></div>\n    <p class=\"pcode\" id=\"psCode\"></p>\n    <h2 class=\"pcatch\" id=\"psCatch\"></h2>\n    <p class=\"pov\" id=\"psOv\"></p>\n    <h3 class=\"psh\" id=\"aruH\"></h3><ul class=\"tags aru\" id=\"aru\"></ul>\n    <details class=\"pmore\"><summary>強み</summary><ul class=\"plist good\" id=\"psStr\"></ul></details>\n    <details class=\"pmore\"><summary>つまずきやすいところ</summary><ul class=\"plist care\" id=\"psPit\"></ul><p class=\"pat\" id=\"psAT\"></p></details>\n    <details class=\"pmore\"><summary>人間関係</summary><p id=\"psRel\"></p></details>\n    <details class=\"pmore\"><summary>恋愛</summary><p id=\"psLove\"></p></details>\n    <details class=\"pmore\"><summary>仕事</summary><p id=\"psWork\"></p><ul class=\"tags\" id=\"psJobs\"></ul></details>\n    <details class=\"pmore\"><summary>相性のいいタイプ</summary><div class=\"compat\"><span class=\"t\" id=\"cT\"></span><p id=\"cW\"></p></div></details>\n    <details class=\"pmore\"><summary>成長のヒント</summary><p id=\"psGrow\"></p></details>\n  </section>\n\n  <section class=\"card today\" id=\"today\">\n    <div class=\"tdintro\"><img id=\"tdImg\" alt=\"あなたの相棒キャラクター\"><div><p class=\"eyebrow\">あなたの相棒</p><p class=\"tdlead\">生まれた日で決まる、60体の相棒。毎日ちがうひと言をくれます。</p></div></div>\n    <p class=\"tddate\" id=\"tdDate\"></p>\n    <p class=\"tdtitle\" id=\"tdTitle\"></p>\n    <p class=\"bubble\" id=\"tdLine\"></p>\n    <div class=\"tdchips\"><span class=\"tdc\"><small>出やすい自分</small><b id=\"tdWho\"></b></span><span class=\"tdc\"><small id=\"tdPowL\"></small><b id=\"tdPow\"></b></span></div>\n    <p class=\"tdtip\"><span>おすすめ</span><b id=\"tdTip\"></b></p>\n    <p class=\"fine\" style=\"text-align:left\">毎日0時に変わります。生まれた日と、その日の暦の組み合わせで決まります。</p>\n  </section>\n\n  <section class=\"card\" id=\"partner\">\n    <h2 id=\"partnerH\">あの人との相性</h2>\n    <div class=\"pres\" id=\"pRes\" hidden></div>\n    <div class=\"send\" id=\"send\">\n    <h3 class=\"sech\">あの人に送って、相性を見る</h3>\n    <p class=\"hint\" style=\"margin:-6px 0 14px\">相手がリンクを開いて診断すると、2人の相性がすぐにわかります。あなたの生年月日は送られません。</p>\n    <label class=\"lbl\" for=\"myName\">あなたの名前（ニックネーム）</label>\n    <input id=\"myName\" class=\"txt\" maxlength=\"12\" placeholder=\"例：りえ\" autocomplete=\"nickname\">\n    <button class=\"btn primary\" type=\"button\" id=\"mkLink\">送るリンクをつくる</button>\n    <div id=\"lnkBox\" class=\"lnkbox\" hidden>\n      <input id=\"lnk\" class=\"txt\" readonly aria-label=\"送るリンク\">\n      <div class=\"lnkacts\"><a class=\"btn line\" id=\"lnkLine\" href=\"#\" target=\"_blank\" rel=\"noopener\">LINEで送る</a><button class=\"btn\" type=\"button\" id=\"cpLink\">リンクをコピー</button></div>\n    </div>\n    </div>\n    <details class=\"pmore\" id=\"pForm\"><summary>相手の生年月日がわかるなら、ここで今すぐ見る</summary>\n    <p class=\"hint\" style=\"margin:-6px 0 12px\">生年月日だけでOK。16タイプもわかれば、「今の相性」も出ます。</p>\n    <div class=\"pf\">\n      <div class=\"opt-mini\"><select id=\"py\" aria-label=\"相手の生まれ年\"></select><select id=\"pm\" aria-label=\"相手の生まれ月\"></select><select id=\"pd\" aria-label=\"相手の生まれ日\"></select></div>\n      <div class=\"opt-mini\"><select id=\"pt\" aria-label=\"相手の16タイプ\"><option value=\"\">相手の16タイプ（わからなければ空欄）</option></select></div>\n      <button class=\"btn\" type=\"button\" id=\"pGo\">相性を見る</button>\n    </div>\n    </details>\n  </section>\n\n  <div class=\"cta\">\n    <button class=\"qlink\" type=\"button\" id=\"reset\">結果を消して、はじめからやり直す</button>\n    <p class=\"fine\">16TYPE+ は独自の性格診断です。MBTI®、16Personalities とは関係ありません。タイプ名のカッコ内（「主人公」など）は、16Personalities での呼び名を参考として表示しています。</p>\n  </div>\n  </div>\n</div>\n", "D": {"NICK": {"INTJ": "話す前に結論出てるタイプ", "INTP": "気づけば検索沼タイプ", "ENTJ": "じゃあ私が決めるタイプ", "ENTP": "逆にさ、が口ぐせタイプ", "INFJ": "言わなくても気づくタイプ", "INFP": "頭の中が映画館タイプ", "ENFJ": "つい世話やいちゃうタイプ", "ENFP": "ときめき最優先タイプ", "ISTJ": "締切より早く出すタイプ", "ISFJ": "気づいたら動いてるタイプ", "ESTJ": "まず予定表つくるタイプ", "ESFJ": "気づけば幹事タイプ", "ISTP": "説明より先に触るタイプ", "ISFP": "好き！で選ぶタイプ", "ESTP": "考える前に動いてるタイプ", "ESFP": "ノリで決めちゃうタイプ"}, "ARUARU": {"INTJ": ["会議中、もう結論は出てるのに黙っている", "計画が崩れると内心かなりイラッとする", "雑談より本題に入りたい", "一人で完結できる作業がいちばん速い", "「なんとなく」で決める人が理解できない"], "INTP": ["調べ物のはずが全然違う沼にいる", "「それって定義は？」と聞きたくなる", "興味ないことは驚くほど頭に入らない", "夜のほうが頭が冴える", "説明がつい長くなる"], "ENTJ": ["決まらない会議に耐えられない", "気づいたら仕切っている", "無駄な時間がいちばん嫌い", "目標があるほど燃える", "頼られると断れない"], "ENTP": ["思いつきを口に出してから考える", "「逆にさ」で話を広げる", "飽きるのが早い", "議論はケンカじゃなく遊び", "新しいアプリはとりあえず入れる"], "INFJ": ["言われる前に相手の不調に気づく", "本音はめったに見せない", "人混みのあとは一人になりたい", "意味のないことに時間を使えない", "相談されやすいのに自分は相談しない"], "INFP": ["脳内で会話のリハーサルをする", "好きなものの話になると急に饒舌", "現実的な話に疲れる", "過去のセリフを何年も覚えている", "自分の中の正解は譲れない"], "ENFJ": ["みんなの表情を確認しながら話す", "頼まれると断れない", "自分のことは後回し", "場が静かだと話題を出す", "人の成長が自分ごとみたいに嬉しい"], "ENFP": ["話が三段跳びする", "やりたいことが多すぎて渋滞", "締切前に部屋を掃除しがち", "初対面でもすぐ距離が縮まる", "飽きたら一気に熱が冷める"], "ISTJ": ["予定は前倒しで終わらせる", "ルールを破る人が気になる", "持ち物の定位置が決まっている", "急な変更に地味に動揺する", "一度決めたやり方を変えたくない"], "ISFJ": ["先に気づいて先に動いている", "「大丈夫」と言いながら我慢している", "人の好みを覚えている", "目立つ役はやりたくない", "頼られると嬉しい"], "ESTJ": ["まず段取りから決める", "曖昧な指示にイライラする", "時間に厳しい", "任されると全部やりきる", "身内には言い方がきつくなる"], "ESFJ": ["気づいたら幹事をしている", "みんなの体調や機嫌が気になる", "一人の時間が長いと寂しい", "記念日を覚えている", "嫌われてないか確認したくなる"], "ISTP": ["説明書より先に触る", "グループLINEは既読だけつける", "無駄な会話が苦手", "壊れたらまず自分で直す", "興味が切れると急に手が止まる"], "ISFP": ["ピンとこないものは選べない", "流行より自分の好き", "急かされるのが苦手", "写真や配置にこだわる", "怒らないけど内心は譲らない"], "ESTP": ["考えるより先に体が動く", "退屈がいちばん苦手", "場の空気をすぐ掴む", "計画より現場対応が得意", "後片づけは後回し"], "ESFP": ["ノリで予定を決める", "写真を撮るのが好き", "落ち込んでも寝たら回復", "場を明るくする係になりがち", "地味な作業が続かない"]}, "TCOMPAT": {"INTJ": {"m": "ENTP", "why": "戦略に新しい風を吹き込むアイデアマン。"}, "ENTP": {"m": "INTJ", "why": "ひらめきを着実な計画に落とし込んでくれる。"}, "INTP": {"m": "ENTJ", "why": "考えを形にして前へ進めてくれる実行役。"}, "ENTJ": {"m": "INTP", "why": "斬新な視点で発想を広げてくれるブレーン。"}, "INFJ": {"m": "ENFP", "why": "内に秘めた想いを、明るく引き出してくれる。"}, "ENFP": {"m": "INFJ", "why": "広げた夢を、静かに深めてくれる相手。"}, "INFP": {"m": "ENFJ", "why": "理想を本気で応援してくれる、心強い導き手。"}, "ENFJ": {"m": "INFP", "why": "あなたの優しさを必要としてくれる純粋な人。"}, "ISTJ": {"m": "ESTP", "why": "堅実なあなたに、刺激と行動力をくれる。"}, "ESTP": {"m": "ISTJ", "why": "勢いを、確かな土台で支えてくれる相手。"}, "ISFJ": {"m": "ESFP", "why": "真面目さを、ぱっと明るくしてくれるムード担当。"}, "ESFP": {"m": "ISFJ", "why": "楽しさを、そっと支えてくれる安心の存在。"}, "ISTP": {"m": "ESTJ", "why": "あなたの腕を活かす場を用意してくれる。"}, "ESTJ": {"m": "ISTP", "why": "いざという時に頼れる、冷静な実力者。"}, "ISFP": {"m": "ESFJ", "why": "マイペースなあなたを、温かく支えてくれる。"}, "ESFJ": {"m": "ISFP", "why": "飾らない感性に癒される、自然体の相手。"}}, "GAP_USE": {"IE": {"h": "充電｜内向き → 外向き に変身", "t": "ほんとうは一人で充電する人が、人と関わる力を装備した状態。人前のあとにどっと疲れるのは、気のせいじゃなく装備の重さです。予定のあとに“ひとり時間”を確保すると、回復が一気に速くなります。"}, "EI": {"h": "充電｜外向き → 内向き に変身", "t": "ほんとうは人といて充電する人が、今はひとりモード。最近なんとなく元気が出ないなら、原因は“人との時間の不足”かも。気のおけない人と会う予定をひとつ入れるだけで、驚くほど復活します。"}, "SN": {"h": "見方｜現実派 → 直感派 に変身", "t": "地に足のついた現実派が、ひらめきで動く力を獲得。アイデアが浮かんでも「ほんとに大丈夫？」と不安になるのは、素の現実感覚が生きている証拠。ひらめきを素の現実力で検算すれば最強です。"}, "NS": {"h": "見方｜直感派 → 現実派 に変身", "t": "本来ひらめき型のあなたが、現実的にふるまう力を装備。ときどき無性に“夢の話”がしたくなるのは、素の顔の呼吸です。空想の時間はサボりじゃなく、あなたの充電です。"}, "TF": {"h": "決め方｜論理派 → 共感派 に変身", "t": "本来スジで決める人が、人に合わせて受け止める力を獲得。合わせたあとに「本音を言えばよかった」とモヤモヤしやすいタイプ。大事な決断だけは、素のロジックに戻って決めると後悔しません。"}, "FT": {"h": "決め方｜共感派 → 論理派 に変身", "t": "本来は気持ちで決める人が、冷静に判断する鎧を装備。クールに見えて、内側では感情がちゃんと動いています。ときどき“好きか嫌いか”だけで選ぶと、心の疲れがすっと取れます。"}, "JP": {"h": "動き方｜計画派 → 自由派 に変身", "t": "本来は計画派なのに、流れに乗る柔軟さを獲得。自由に見えて、心のどこかで“決まっていない不安”を感じやすい人です。ざっくりでも予定を置くと、安心して楽しめます。"}, "PJ": {"h": "動き方｜自由派 → 計画派 に変身", "t": "本来は自由派なのに、段取りの力を身につけた人。きっちりこなせるのに、たまに全部投げ出したくなるのはこのせい。“予定のない日”を先にカレンダーに入れておくのがコツです。"}}, "COLOR": {"INTJ": {"name": "深い藍", "hex": "#27406B", "line": "夜明け前の藍。静かに全体を見渡す色。"}, "INTP": {"name": "アイスブルー", "hex": "#79B6D9", "line": "澄んだ氷の青。思考が透きとおる色。"}, "ENTJ": {"name": "クリムゾン", "hex": "#C8102E", "line": "燃える深紅。目標へ突き進む色。"}, "ENTP": {"name": "エレクトリックオレンジ", "hex": "#FF6A2C", "line": "火花のオレンジ。刺激を生み出す色。"}, "INFJ": {"name": "アメジスト", "hex": "#6A4C93", "line": "神秘の紫。静かな理想を秘めた色。"}, "INFP": {"name": "ラベンダー", "hex": "#B79CE0", "line": "淡い藤色。やさしく夢みる色。"}, "ENFJ": {"name": "コーラル", "hex": "#FF8364", "line": "夕日のコーラル。人を照らすあたたかな色。"}, "ENFP": {"name": "ビビッドイエロー", "hex": "#FFD23F", "line": "弾ける黄色。その場を明るくする色。"}, "ISTJ": {"name": "ディープグリーン", "hex": "#2F6B5E", "line": "落ち着いた深緑。ぶれない芯の色。"}, "ISFJ": {"name": "ソフトピーチ", "hex": "#F4C9A8", "line": "やわらかな桃色。そっと包む色。"}, "ESTJ": {"name": "ロイヤルブルー", "hex": "#2457C5", "line": "堂々のブルー。頼れる芯の色。"}, "ESFJ": {"name": "ウォームローズ", "hex": "#F77FA1", "line": "あたたかな薔薇色。みんなを和ませる色。"}, "ISTP": {"name": "ガンメタル", "hex": "#8C97A0", "line": "クールな銀。無駄のない色。"}, "ISFP": {"name": "セージグリーン", "hex": "#8FBF9F", "line": "やさしい若草。自然体でいられる色。"}, "ESTP": {"name": "ネオンレッド", "hex": "#FF3B30", "line": "躍動の赤。動くほど光る色。"}, "ESFP": {"name": "ホットピンク", "hex": "#FF2E9A", "line": "華やぐマゼンタ。主役のオーラの色。"}}, "URA": {"INTJ": "じつは、頭の中では何手も先まで読んで、もう一人で完結している。", "INTP": "じつは、「なんで？」が止まらず、夜中に関係ない調べ物で時間が溶ける。", "ENTJ": "じつは、任されないとソワソワ。仕切りたくて手がうずうずしている。", "ENTP": "じつは、思いつきを口に出してから「どうしよう」と考えはじめる。", "INFJ": "じつは、ニコニコしながら相手の本音を静かに見抜いている。", "INFP": "じつは、頭の中で壮大なストーリーが毎日上映されている。", "ENFJ": "じつは、みんなを気づかうあまり、自分のことは後回しにしがち。", "ENFP": "じつは、やりたいこと多すぎて、半分は途中で次へ移っている。", "ISTJ": "じつは、段取りを乱す人に、心の中でこっそりイラッとしている。", "ISFJ": "じつは、「大丈夫」と言いながら、いちばん我慢している。", "ESTJ": "じつは、ゆるい計画を見ると、つい口を出したくてうずうず。", "ESFJ": "じつは、嫌われてないかな…と、こっそり空気を確認している。", "ISTP": "じつは、興味ないことには無関心。好きなことには無限に集中する。", "ISFP": "じつは、マイペースに見えて、譲れない美学はかなり頑固。", "ESTP": "じつは、退屈がいちばん苦手。刺激がないと自分で作りにいく。", "ESFP": "じつは、楽しそうにしながら、場の空気をいちばん読んでいる。"}}, "QZ": {"Q
