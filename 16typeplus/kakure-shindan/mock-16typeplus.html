ry match you lost, in detail."}, "ENTJ>ENFJ": {"karai": "You aim to be a leader with heart, but behind every compliment is the next target."}, "ENTJ>ENFP": {"karai": "You look like you live freely, but the moment you realize you're falling behind, you go full throttle."}, "ENTJ>ISTJ": {"karai": "You call yourself steady, but when a promotion opens up, your hand shoots up first."}, "ENTJ>ISFJ": {"karai": "You say you're suited to supporting roles, but nobody gets a say in how you support."}, "ENTJ>ESTJ": {"karai": "You say you've become realistic, but inside you haven't given up on conquering the world."}, "ENTJ>ESFJ": {"karai": "You say you value the mood in the room, but you never let go of the final say."}, "ENTJ>ISTP": {"karai": "You pose as a lone wolf, but tell you to build a pack and you'd draw up an org chart overnight."}, "ENTJ>ISFP": {"karai": "You say you're not interested in competing, but your need to win hasn't faded one bit."}, "ENTJ>ESTP": {"karai": "You look like you're winging it, but in your mind, it was all part of the plan."}, "ENTJ>ESFP": {"karai": "You pretend to live on vibes, but you always go after the spotlight."}}, "PS": {"INTJ": {"catch": "The answer-before-you-speak type. You read ahead quietly and map out the path.", "overview": "By the time everyone else starts talking it over, you can already see the shape of the answer in your head. You look at things over the long run, asking “Where is this going?”, and you're good at building a route with little waste. What moves you is a reason that makes sense and the freedom to think things through and decide for yourself. You do your best work not because someone told you to, but when something feels logical. You don't talk a lot, so people sometimes see you as cool or hard to approach. But when they come to you for help, you give answers that are surprisingly on point. Plenty of people trust you for that quiet kind of reliability.", "strengths": ["You plan ahead｜You don't just look at what's in front of you. You picture six months or a year from now and act on it. You deal with trouble before it starts, so your plans hold steady.", "You think things all the way through｜You keep working on a problem until you reach an answer. You don't get swept along by other people's opinions. You check things in your own head first, so your decisions stay firm.", "You spot waste and clean it up｜You're quick to notice, “Do we even need this step?” You can rethink how things work and save everyone time and effort.", "You can keep going on your own｜Even without everyone on board, you quietly see through what you believe is right. That attitude often ends up leading others, too."], "pitfalls": ["You skip the explanation｜The answer is all connected in your head, so you tend to share only the conclusion and leave out the steps. Adding just one line about why makes you much easier to follow.", "Other people's inefficiency bugs you｜You see waste so clearly that people who go by feelings can seem to take the long way around. It helps to remember they have their own order of what matters.", "You carry it all yourself｜It feels faster to just do it yourself, so you put off asking for help. Try handing off small tasks first. Sharing the load gives you breathing room."], "relationships": "You're fine without a lot of friends. Instead, once you trust someone, the friendship tends to be long and deep. You may not say much in the group chat, but when someone asks you for advice one-on-one, you think hard and give a real answer. At work or in a club, you're the one who says the line that cuts to the heart of things when a discussion gets stuck. You get along best with people who respect your alone time and talk to you directly, without beating around the bush.", "love": "It takes you a while to fall for someone. But once you feel, “This is the one,” you're very sincere about it. Instead of flashy words, you show your feelings by working through your partner's worries with them and talking seriously about the future. You value a relationship where you both respect each other's way of thinking. Where things can go wrong: you don't put your feelings into words very often. Just saying “I'm happy” or “Thank you” out loud makes your partner feel much more secure.", "work": "You shine when the goal is clear and you're trusted to choose how to get there. You tend to be valued in roles where you research, think, and turn plans into reality. People often come to you because “talk to them and you'll see the way forward.” On the other hand, you wear out fast in workplaces full of rules no one can explain, or endless meetings that never decide anything. Just protecting time to focus can boost your results a lot.", "jobs": ["Corporate planning / business strategy", "Systems design / engineering", "Research", "Data analyst", "Architecture / urban planning"], "growth": "When you share a conclusion, try adding just one sentence about why you think so. That alone changes how much people buy in. It also helps to set aside some time each day to listen to someone all the way through without cutting in. Meeting views you don't have yourself makes your plans even stronger.", "A": "When you're Assertive, you rarely second-guess yourself, and once you decide, you go straight for it. Pushback doesn't shake you much, and you keep plans moving calmly. Your strength is sharing your ideas with confidence, even in front of others.", "T": "When you're Cautious, your thoroughness shines. You check your plans again and again for holes. The feeling that “this could be better” drives you to improve, and you raise the quality down to the small details. When you feel anxious, try writing it all down on paper. It helps."}, "INTP": {"catch": "The down-the-rabbit-hole type. You love asking “Why is that?”", "overview": "When a small question pops up, you look up and realize you've been researching it for hours. Your biggest driver is wanting to know how things work: “Why does this happen?” “Is that really true?” You'd rather think something through until it makes sense to you than just memorize the answer. Time alone recharges you, and there are always several ideas running in your head at once. People may see you as someone who moves at your own pace and is a bit of a mystery. But once they talk with you, they find you know a wide range of things and come up with interesting answers from unexpected angles. Your free-ranging ideas can change the mood when a group is stuck.", "strengths": ["You see how things work｜Even with a complicated topic, you can find the key part and sort it out. You're good at showing the skeleton of an idea: “So basically, it's this, right?”", "You don't take things for granted｜You don't decide something just because everyone says so. You check for yourself whether it's really right. That's how you catch problems others missed.", "You focus deeply on what you love｜You can get amazingly absorbed in topics that interest you. The things you look up start to connect, and often you end up knowing more than anyone.", "You stay calm and fair｜When opinions clash, you don't get carried away by emotion. You compare each side calmly. No matter who's speaking, you value the idea that makes the most sense."], "pitfalls": ["You overthink and get stuck｜You think of so many possibilities that you can't commit, in case there's a better way. Setting yourself a rough deadline makes the first step easier.", "Feelings talk is hard for you｜Logic comes naturally, so you may offer a fix when someone just wants you to understand. Starting with “That sounds really hard” helps you connect.", "Your interest jumps around｜New questions pull at you, and half-finished things pile up. Write down just one thing you've started. It helps you build a habit of finishing."], "relationships": "You'd rather go deep on a favorite topic with a few people than spend time in a big, noisy crowd. Among friends, you're the one who tosses out a small question and gets the conversation going. At work or school, people trust you as the one who says, “I looked it up,” and brings useful knowledge when they're stuck. You get along best with people who don't mind when you suddenly go quiet to think, and who say, “That's interesting!” when you share your ideas.", "love": "Love often starts with wanting to know more about someone. You get curious about how they think and what they like, and you grow closer through long talks. You value a relationship where you both stay free. Where things can go wrong: you tend to put off replying, or you don't put your feelings into words. Even a short message like “Here's what happened today” helps your partner feel secure.", "work": "You do your best where you can think at your own pace and try new things. You tend to be valued in roles like finding the cause of a problem, building systems, or coming up with new ways of doing things. On the other hand, you wear out fast with repetitive tasks that just follow set steps, or lots of reports that seem pointless. Once you know why something needs doing, you can focus amazingly well.", "jobs": ["Programmer", "Researcher", "Data scientist", "Game designer", "Technical writer"], "growth": "Try talking about what you're thinking before it's finished. Sharing it halfway can bring hints you'd never expect. It also helps to set a timer for “just 30 minutes” before you start researching something. You keep the fun of diving deep, and you can still come back to what you need to do.", "A": "When you're Assertive, you trust your ideas and say them out loud easily. You don't dwell on mistakes much, and you deepen your thinking as you try things. Your strength is jumping into new things lightly.", "T": "When you're Cautious, your care shines. You check your thinking again and again for gaps. Because of that, your answers are very precise, and people trust them. When you're unsure, try sharing what you know so far instead of waiting for perfect. It takes the pressure off."}, "ENTJ": {"catch": "The “Okay, I'll decide” type. You're the one people count on to get a stuck group moving.", "overview": "When everyone's unsure and the talk stalls, you're the one who says, “Okay, let's do this,” and points the way. Once you find a goal, you quickly lay out the steps to get there, then pull together people and resources to make it happen. What moves you is seeing growth and results. When you can feel you've moved forward, even a little, compared to yesterday, your energy keeps building. People often see you as dependable, a leader they can rely on, and you tend to end up in charge. You can sometimes seem strict, but that comes from truly wanting a good result. Many people likely watch you and think, “If I follow them, it'll be fine.”", "strengths": ["You decide and get things moving｜Even when there are too many options, you can set clear criteria and make the call. One word from you, and a stalled discussion starts moving again.", "You're great at planning steps｜You're good at breaking a big goal into what to do today and next week. Everyone knows who does what, so the team can move easily.", "You enjoy big goals｜The harder the challenge, the more fired up you get. Even things people thought were impossible, you can bring closer step by step.", "You say things clearly｜You don't leave things vague. You put what's needed into plain words. People know what's expected, so they can act with confidence."], "pitfalls": ["You expect others to keep your pace｜Your own speed becomes the standard, and you assume others can move just as fast. Asking about their situation before you ask for help gets you more support.", "You rush results and can't rest｜You love moving forward, so you tend to feel guilty about resting. Put rest into your schedule as part of the plan. That way you can keep going for the long run.", "Your words land harder than you mean｜You mean to be clear, but it can sound harsh to others. Mention one thing that went well before you point something out. It helps people take it in."], "relationships": "Among friends, you naturally take charge of planning trips and get-togethers. When the group chat stalls on “Where should we go?”, you suggest a few options and it's settled right away. At work or in a club, you're the one who brings everyone together toward a goal. You get along best with people who give you clear opinions back, or who enjoy your energy. Taking time now and then to really listen to others deepens their trust even more.", "love": "With someone you like, you tell them how you feel, straight out. You show love through action, like planning dates and cheering on your partner's goals. You value a relationship where you both help each other grow. Where things can go wrong: you jump to solutions when your partner shares a worry. Sometimes, skip the answer and just say, “I see.” That helps them feel truly at ease. When they show you their soft side, that's an important sign of trust, too.", "work": "You do great things when the goal is clear and you have room to make your own calls. You tend to be valued in roles like running projects, leading teams, and building new systems. On the other hand, you wear out fast in organizations that are slow to decide, or with long stretches of work where results are hard to see. The more results you deliver, the more you're trusted with, and the more you can do.", "jobs": ["Business owner / entrepreneur", "Project manager", "Consultant", "Sales manager", "Lawyer"], "growth": "Try making a habit of asking, “Any other thoughts?” at the end of meetings and discussions. A quiet person's idea can turn out to be the breakthrough. It also helps to keep one block of time each week free of plans. Time to pause sets up your next big step.", "A": "When you're Assertive, you decide fast and lead people with confidence, even under pressure. When something fails, you bounce back quickly and think about your next move. Your confidence gives the people around you courage.", "T": "When you're Cautious, you set high goals and still notice small risks. That steadiness shines. Your sense that “we can do better” lifts the quality of the whole team. When you're chasing perfect too hard, try counting what you've already done. It helps."}, "ENTP": {"catch": "The “But what if…” type. You love flipping the obvious on its head.", "overview": "When everyone thinks “that's just how it is,” you're the one who asks, “But what if we did it the other way?” and brings in a new angle. You love thinking up new ideas and trading opinions with people, and your ideas keep growing as you talk. What moves you is the thrill of “This could be fun.” The newer the idea, or the less clear the right answer, the more fired up you get. People often see you as quick-witted, someone they never get bored talking to. You may seem to love a good debate, but it's not about winning. You want to find a better answer together. You're the one who livens things up and gets them moving.", "strengths": ["You switch angles fast｜You can come up with many views and solutions for one problem. Even when things are stuck, you're good at finding a new path.", "Talking helps your ideas grow｜Your ideas keep growing as you talk with people. A thought that comes up in small talk can turn into a big project.", "You enjoy change｜When plans shift or something unexpected happens, you actually find it fun. You settle into new places easily and travel light.", "You're bold and quick to act｜You can talk to important people or strangers without feeling nervous. You connect people and start new things moving."], "pitfalls": ["Great at starting, not at finishing｜You're so drawn to new things that you get bored at the slow, finishing stage. Teaming up with someone who's good at wrapping up helps your ideas take shape.", "Debates get too heated｜Trading opinions is so fun that you may not notice the other person is getting tired. Asking “What do you think?” gives them a turn and keeps the talk pleasant.", "You overpack your schedule｜You say yes to one fun invitation after another, and before you know it, your hands are full. Sleep on it before you answer. It helps you choose what you really want to do."], "relationships": "You have lots of friends and can slip into any group easily. At parties and weekend hangouts, you're the one who brings up topics and gets everyone going. In group chats, too, you send random thoughts that spark more conversation. At work or school, people often count on you for new plans and ideas. You get along best with people who enjoy your ideas but also push back sometimes. The more you can enjoy a good back-and-forth, the longer the friendship lasts.", "love": "You're drawn to people who are fun to talk to and who show you worlds you don't know. When you fall for someone, you try to make your time together exciting, like planning fun dates and inviting them to new places. You value a relationship where you grow together and never get bored. Where things can go wrong: when your jokes or debates end up hurting your partner. In serious talks, try starting with a few words that show you understand how they feel. That builds trust.", "work": "You do your best where you can take on new challenges and share ideas freely. You tend to be valued in roles like launching projects, finding new solutions to problems, and getting people on board. On the other hand, you wear out fast with the same tasks every day or a place bound by lots of small rules. The more change a workplace has, the more your flexibility pays off.", "jobs": ["New business / planning roles", "Entrepreneur", "Marketer", "Advertising planner", "Journalist"], "growth": "When an idea comes to you, before you expand it, decide on just the first step and write it down. You'll see how to make it real, and it gets easier to pull off. It also helps to look back at the end of each day on one thing you finished. Small finishes add up, and they carry your ideas much further.", "A": "When you're Assertive, you're bold enough to act the moment an idea hits. You talk about your thoughts with obvious joy, even in front of others, and your power to pull people in gets stronger. Your charm is laughing off a failure and moving on.", "T": "When you're Cautious, along with your sparks of inspiration, you have the calm to check, “Will this really work?” You're tuned in to how people react, so you can adjust how you say things. When worries start piling up, try testing them one at a time. It eases your mind."}, "INFJ": {"catch": "The notices-without-being-told type. You gently catch the small shifts in people's hearts.", "overview": "You notice the tiniest changes: a look on someone's face, the tone of their voice, how long they took to text back. Imagining feelings that haven't been said out loud comes naturally to you, so people often ask, “How did you know?” Inside, you hold a quiet ideal of how things could be, and getting closer to it gives you a deep sense of purpose. You like being around people, but in a big crowd you soak up too many feelings and tire easily. That's why time alone to sort out your thoughts is a must. To others, you seem calm and a good listener, with a strong core. You may not say much, but in your head you're often thinking far ahead.", "strengths": ["You sense shifts in the mood right away｜You pick up early on the feel of a room or when someone's running low. You can quietly offer a hand before someone even asks for help.", "You really listen｜You don't cut people off. You take in what they say, feelings and all. People feel, “I can talk to this person,” and trust you with deep worries.", "You see what's coming｜You're good at picturing where things are headed from what's happening now. A small feeling that something's off can help you head off a problem early.", "You stay true to what matters｜You know clearly what values you want to protect. Even when it would be easy to go with the flow, you quietly hold on to your view."], "pitfalls": ["You carry other people's feelings too much｜Because you understand how others feel, you tend to take it on as your own. Drawing a line in your mind, like “This is their problem,” makes things a little lighter.", "You hold it in until you can't｜You don't want to make waves, so small frustrations tend to pile up. Practice saying lightly, “Something's been on my mind,” before it builds up. It protects both the relationship and you.", "Your ideals run high｜Your picture of the ideal is so clear that the gap with reality can bring you down. Make the goal smaller, like “Getting 60% done today is plenty.” It's easier to keep going."], "relationships": "You may not have many friends, but you value deep, long-lasting bonds. In a group, you often become the listener or the one people go to for advice, and they lean on you because “talking to you calms me down.” At work or in a club, you keep an eye on the overall mood and quietly support people who seem left out or are struggling. You get along best with people you can talk to honestly and slowly, and who don't find silence awkward. You feel fulfilled by how deep the talk goes, not how often you meet, so not cramming your schedule helps your friendships last.", "love": "You don't fall fast. Instead, your heart moves as you talk and think, “I like the way this person thinks.” Once someone matters to you, you notice their small changes and show deep love more through actions than words. What you want most is to feel safe enough to say what you really feel. Where things can go wrong: you imagine your partner's feelings so far ahead that you swallow your own wishes. Try putting a little of “I wish you'd pick up on this” into words. It brings you much closer.", "work": "You do your best in work that feels meaningful, where you can tell you're helping someone. The ideal is time to think alone plus a place to talk deeply with a few people. You tend to be valued for planning that meets people's needs, supporting people one-on-one, and writing or putting documents together. On the other hand, in workplaces that only chase numbers, or where chatter and meetings never stop, you can get worn out without noticing. Saving quiet time to look back, even once a week, helps you stay in good shape.", "jobs": ["Counselor / advisor", "Editor / writer", "HR / recruiting", "UX researcher", "Childcare worker / teacher"], "growth": "You tend to put others first, and your own feelings get pushed back. Before bed, try writing one line each for “something that made me happy today” and “something that bugged me a little.” Once you can name your feelings, it gets easier to share them. Also, when someone asks you for something, try pausing with “Let me think and get back to you.” That alone cuts down on taking on too much.", "A": "When you're Assertive, you trust your judgment and act calmly. You stay close to people's feelings, but when it counts, you can clearly say, “Here's what I think.” That makes you a strong person to turn to for advice.", "T": "When you're Cautious, you look back carefully at how people reacted and at what you said and did. You're especially sensitive to other people's pain, and your choice of words is very kind. If you start worrying too much, tell yourself, “I was considerate enough,” and give yourself credit."}, "INFP": {"catch": "The movie-theater-in-my-head type. You treasure being yourself and your gentle imagination.", "overview": "On the train to school or work, or on a lazy weekend afternoon, stories and “what if” scenes start playing in your head. Music, books, and scenery move you easily, and you're good at taking time to really feel what you feel. There are things inside you that you want to protect no matter what, and if something doesn't fit them, you can't get into it, even if everyone else is doing it. You're very kind to people and try to see things from their side. To others, you seem calm and modest, but once they talk with you, they find you funny, with a unique sense and humor. It's just hard for you to show it. Inside, you have rich, warm, passionate feelings.", "strengths": ["You feel things deeply｜Small moments and words move you, and you can really savor them. You notice beauty and fun that others tend to miss.", "You can stay close to someone in pain｜You can imagine how a hurting person feels as if it were your own. You accept them without judging, so just having you nearby puts people at ease.", "You express things in your own words｜You're good at giving shape to feelings, through writing, drawing, music, and more. Even hard things, you can say gently in your own way.", "You focus deeply on what you love｜When you truly love something, you lose track of time working on it. That passion turns into original work and ideas."], "pitfalls": ["You overthink and freeze｜Your imagination grows so big in your head that the first step feels heavy. Start small, like “I'll try it for just five minutes.” Your mood will naturally follow.", "You keep your real feelings tucked away｜You don't want to hurt anyone, so sometimes you never share your view. Sorting your feelings out first in a note or a text makes it easier to talk.", "You're quick to blame yourself｜Because your ideals are high and you're kind, when things go wrong you tend to think, “It's my fault.” Try saying to yourself what you'd say to a friend. It lightens your heart."], "relationships": "You'd rather have a slow, easy talk with a few people you click with than hang out in a big, loud group. You may be quiet when you first meet someone, but once you open up, you light up talking about your favorite things and show a side people don't expect. At work or school, you don't like conflict, and you often end up smoothing over tense moments. You get along best with people who don't rush you and who enjoy your sense of things and your values. With people who don't reject your differences, you can build deep trust that lasts.", "love": "You dream of a special bond like something out of a movie, and you look for someone who understands you all the way down. When you fall for someone, your love shows in small details, like listening to their favorite songs or remembering little things they said. What you want most is the comfort of being accepted as you are. Where things can go wrong: when you idealize your partner too much in your head, or worry alone because you can't say what's bothering you. Putting small feelings into words, little by little, makes the relationship more solid.", "work": "You really come alive in work that fits your values, where you can feel you're helping someone. The ideal is some freedom to choose how you work, plus time to focus alone. You tend to be valued in roles that use your sense and imagination, like writing, design, and planning. On the other hand, your motivation drops in places bound by lots of small rules, or workplaces that push competition and quotas above all. Finding one thing you love about your work makes it easier to keep going.", "jobs": ["Writer / novelist", "Illustrator / designer", "Psychology / social work roles", "Librarian", "Video creator / filmmaker"], "growth": "The key to growing is turning your rich imagination into something real, bit by bit. Try saving one idea or feeling a day in the notes app on your phone. When you read them back later, you'll see what matters to you. Also, break what you want to do into small stages, like “This week I'll just do research.” That way you can get moving without overthinking.", "A": "When you're Assertive, it's easier to trust your own sense and choices, and you bounce back fairly fast when you're down. You don't get swayed too much by what others say, and you can proudly say, “This is what I love.” That helps your work and ideas reach people.", "T": "When you're Cautious, you feel your ups and downs deeply and turn them into richer expression. You're even more thoughtful about other people's feelings. When you feel anxious, write down what you've done well and give your kindness the credit it deserves."}, "ENFJ": {"catch": "The can't-help-looking-after-you type. You bring out the best in people and warm up the room.", "overview": "When someone's in trouble, you find yourself asking, “Want some help?” before they even ask. You're good at reading people's feelings and the mood of the room. If someone in the group seems left out, you naturally talk to them and draw them in. Nothing makes you happier than seeing people grow and smile, and you're good at spotting what's great about someone and telling them. You value everyone moving in the same direction, and in school festivals or work projects, you often end up as the one pulling it together. To others, you seem bright and caring, someone who makes them feel more positive. On the flip side, you don't always notice when you're tired.", "strengths": ["You spot what's great in people and tell them｜You find strengths people haven't noticed in themselves and put them into words. That one comment can give someone confidence or a push forward.", "You bring people together｜You listen to scattered opinions and guide everyone toward a direction they can agree on. You're good at building a sense of team.", "Your words come from the heart｜You speak with passion and care, and you can move people. In speeches and explanations, too, you leave your listeners feeling more positive.", "You're quick to lend a hand｜When you notice someone struggling, you act without hesitating. That kindness and drive earn you deep trust from those around you."], "pitfalls": ["You come last｜You want so much to help that you take on one request after another. Put “time for me” on your calendar first. It keeps you from overdoing it.", "You try too hard to meet expectations｜You can sense what people expect, and you don't want to let them down, so you push yourself too far. Saying “I can't do that one” won't break their trust that easily.", "“For your own good” goes too far｜Advice you give with good intentions can feel heavy to the other person. Asking “What would help you?” first, before you act, keeps you on the same page."], "relationships": "You have lots of friends and often become the bridge between different groups. You remember birthdays and anniversaries, and you probably love planning surprises. At work or in a club, you're the one who says hi to newcomers and lightens the mood when things feel heavy. You get along best with people who thank you openly and who are there for you when you need to vent. When it's not just you supporting them, but them supporting you too, the relationship stays comfortable for a long time.", "love": "When you fall for someone, you think about them a lot and go out of your way to do things that make them smile. You take their dreams and worries seriously, and you value a relationship where you can grow together. What you want most is to share your feelings in words with each other. Where things can go wrong: when you give so much that you wear yourself out, or feel uneasy when your partner doesn't react much. Sometimes, let yourself be the one who's cared for and say openly what you'd like. It makes the relationship more equal and warm.", "work": "You do your best where you work with people and help them grow and smile. Workplaces where the team shares a goal and moves forward together suit you. You tend to be valued in roles that connect and move people, like leading, training, or coordinating. On the other hand, you burn energy fast when you're working alone and silently for long stretches, or when the people around you are at odds. You shine brightest where, along with results, you can feel the “thank you.”", "jobs": ["Teacher / instructor", "HR / training", "Career advisor", "PR / communications", "Event planner"], "growth": "Because you give so much support, it's important to keep track of how much you have left. At the end of each day, try to recall one thing you did for yourself. If there's nothing, small is fine for tomorrow, like slowly enjoying a cup of tea. Also, try making a habit of saying, “Let me check and get back to you,” when someone asks for something. It keeps you from taking on too much.", "A": "When you're Assertive, you trust your ideas and lead people without hesitating. When something goes wrong, you switch gears fast and keep things moving with your bright energy. Even in front of a crowd, you stay calm and can bring out your best freely.", "T": "When you're Cautious, you pay even closer attention to how each person reacts. Your care in choosing words so no one gets hurt is part of your charm. When you're worried about how others see you, think back on the good things you've done and let your heart rest."}, "ENFP": {"catch": "The heart-flutter-first type. You find what's exciting and spread it to everyone around you.", "overview": "A new shop, a place you've never been, an idea nobody's tried yet. When you run into something that seems fun, your eyes light up. You want to share your ideas right away, and new ones keep growing out of casual chats. You're really interested in people, too. You warm up to strangers naturally and enjoy learning what they like and how they think. You care more about “How can we make this more fun?” than about rules or set steps, so you have a way of brightening up the room. To others, you seem lively and friendly, someone who makes their world bigger. But beneath that bubbly side, you're actually sensitive to people's feelings and have a delicate side, too.", "strengths": ["Ideas pour out of you｜From one topic, you can link together lots of new ideas. Your strength is bringing unexpected angles to meetings and brainstorms.", "You hit it off with anyone｜Even with someone new, you don't put up walls, and you listen to them with real interest. You can be the hub that connects people.", "You get people fired up｜The way you light up when you talk naturally pulls others in. You're good at creating a “Maybe I'll give it a try” mood.", "You believe in people's potential｜You notice what's good in people and how they can grow, and you cheer them on from the heart. Your positive words give someone a gentle push."], "pitfalls": ["Your interest keeps jumping｜New things excite you so much that what you started tends to stall halfway. Pick just one thing you want to finish and set a small goal. It's easier to see it through.", "You overpack your schedule｜You can't say no to invitations or things you want to do, and before you know it, your calendar is full. Decide on one “nothing day” each week in advance. It gives you breathing room again.", "Detail work wears you out｜You tend to put off repetitive tasks and paperwork. Add a little fun with small tricks, like putting on music or working in short time blocks. It makes things easier to get through."], "relationships": "You have a wide circle of friends and get along with all kinds of people. You're the type to text “Want to meet up right now?” the moment the idea hits, and you're often the one planning the fun. At work or school, you're the mood-maker who brightens the room and gets the talk started when no one's speaking up. You get along best with people who enjoy hearing your ideas and who offer a healthy dose of realism. In relationships where you can share your feelings honestly, you feel most like yourself.", "love": "Love often starts with a spark, that feeling of “I have so much fun with this person.” When you fall for someone, ideas for places to go and things to do together keep popping up, and you enjoy your time with them to the fullest. What you want most is to express your feelings openly with each other and to respect each other's freedom. Where things can go wrong: when the relationship settles down and the excitement fades, or when you read too much into your partner's feelings and get anxious. Creating small joys together in everyday life helps the relationship last.", "work": "You do your best where you can try new things and use your ideas and connections. Workplaces with lots of freedom and lots of different people suit you. You tend to be valued in roles like planning, launching, sharing ideas with the world, and connecting people. On the other hand, your motivation fades with the same steps every day or strict micromanagement. Sharing tasks you find hard with people who are good at them, or handing them to tools, frees up more time for your strengths.", "jobs": ["Planning / marketing", "Advertising / copywriter", "Event / travel planner", "Entrepreneur / new business roles", "Influencer / streamer"], "growth": "The key to growing is building the power to carry your many ideas all the way to something real. When you think of something you want to do, first write the first step in one line, and start on just one thing that same day. Also, once a month, look back at what you've started and choose what to keep and what to let go. That helps you focus your energy on what matters.", "A": "When you're Assertive, you're a doer who acts on ideas without hesitating. When something fails, you switch gears fast with “Next!” and lead others with your bright energy. You fit into new places quickly and enjoy grabbing chances as they come.", "T": "When you're Cautious, under your brightness there's a careful attention to people. You watch how others react, so you can find the right words for each person. When you wear yourself out worrying, recharge with some alone time doing what you love."}, "ISTJ": {"catch": "A quiet, dependable pro who keeps every promise and follows every step.", "overview": "You're the “done-before-the-deadline” type. When you decide to do something, you see it through properly. You finish assignments the day before they're due, and you arrive a little early to meet people. You don't show off, but you never cut corners on what you're trusted with. Your decisions rest on past experience and solid facts. You trust “what worked before” over a sudden idea. You're not much of a talker, so at first you may seem a bit hard to approach. But the longer people know you, the more you become the one they think of as, “If I ask them, it'll be fine.” You do your best when you have time to focus alone.", "strengths": ["You always keep your word｜You do what you say, and you meet deadlines. All those small promises kept add up to deep trust from the people around you.", "You catch gaps and slips｜You spot right away when numbers in a document don't match or a step got skipped. You're the team's safety net, stopping mistakes before they happen.", "You keep at it, steadily｜You can calmly keep up quiet, everyday tasks like daily study or record-keeping. Before you know it, they've added up to something big.", "You stay calm when it counts｜When trouble hits, you don't panic. You check the facts first, then act. Your calm puts others at ease."], "pitfalls": ["Sudden changes wear you out｜You care a lot about plans, so last-minute changes can throw you off. Having a backup plan from the start, in case things change, makes it easier.", "Putting feelings into words is hard｜You tend to keep thanks and complaints to yourself, which can lead to misunderstandings. Just saying “That really helped,” even briefly, warms things up.", "You tend to carry it all alone｜You often feel it's more reliable to do things yourself than to ask. You don't have to shoulder everything. Handing off even part of it lightens the load a lot."], "relationships": "You may not have many friends, but you value relationships that last. You like steady friendships where nothing changes even when you haven't met in a while. At work or in a club, you follow the rules and do the job you're given properly. Lively settings wear you out if they go on too long, so you get along well with people you can talk to slowly in small groups. With people who value promises and don't rush you, trust grows naturally.", "love": "It takes you a while to fall for someone, but once your mind is made up, you're all in. Instead of saying it in words, you show love through actions, like remembering anniversaries or giving rides. You look for sincerity and a sense of safety in a partner. Where things can go wrong: not sharing your feelings can make your partner feel you're cold. Even if your texts are short, adding a quick “I had fun” makes sure your feelings get through.", "work": "You do your best where rules and steps are clear and your area of work is well defined. You're highly valued in jobs that need accuracy, or roles where things must be done right by the deadline. You feel at ease when you're trusted with checking documents or tracking progress. On the other hand, you tire easily in workplaces where the direction keeps changing, or when you're asked to improvise with no prep. When you get time to gather information in advance, your true strength comes out.", "jobs": ["Accounting / bookkeeping", "Civil servant (administration)", "Quality control", "IT systems maintenance / operations", "Pharmacist"], "growth": "Your reliability is a big asset. On top of that, try bringing in a little “something different.” For example, once a week, take a new route home or pick a place you've never tried for lunch. Small changes are plenty. Also, at the end of each day, try saying a quick thank-you to someone. Practicing putting feelings into words makes relationships a lot easier.", "A": "When you're Assertive, you trust your way of doing things and move forward without hesitating. Even when you make a mistake, you don't get more down than you need to, and you calmly think about the next step. You give others a steady impression, so you're often asked to lead.", "T": "When you're Cautious, you double- and triple-check, so you make almost no small mistakes. Because you keep asking, “Is this really okay?”, your prep is top quality. Now and then, tell yourself, “This is enough.” It takes the pressure off."}, "ISFJ": {"catch": "The caring one behind the scenes who quietly notices and acts first.", "overview": "You're the “already-on-it” type. You naturally notice when people around you need something. If drinks are running low, you refill them. If someone looks down, you check on them. You don't think of it as doing someone a favor. To you, it's just what you do. What matters to you is that the people close to you can feel safe and at ease. Once you learn someone's likes or plans, you remember them for a long time. You're modest and don't like the spotlight, but when you're gone, people realize, “That was all thanks to them.” You're good at moving things along carefully within a set routine. Quiet time to reset helps you go back to being kind and active.", "strengths": ["You think ahead for others｜You notice small changes in someone's face or voice. You offer help before anyone asks, and people are deeply grateful.", "Your work is careful and reliable｜You don't skimp on any step, and you finish things with care all the way to the end. You're someone people can trust with anything.", "You remember people｜You remember birthdays, favorite foods, and things people told you before. Those memories are how you show people they matter.", "Your calm softens the room｜Even when things are tense, your gentle words ease the strain. Just having you nearby helps people relax."], "pitfalls": ["You can't say no｜You hate letting people down, so you tend to take on too much. Pausing with “Let me check and get back to you” helps protect you.", "You don't notice when you're tired｜You put others first so much that your own rest gets pushed back. Writing “time to do nothing” into your calendar first makes it easier.", "You bottle things up｜You don't want to make waves, so you tend to hold in what's bothering you. Sharing it bit by bit with someone you trust lightens your heart."], "relationships": "With friends, you're there for them in quiet, thoughtful ways. You often end up as the supporter, like sending a message to a friend who's sick or making a packing list for a trip. At work or school, too, you can't leave someone who's struggling alone. You get along best with people who say “thank you” for your kindness. Relationships where you look out for each other last longer and feel better than ones where you're the only one being leaned on.", "love": "You pay close attention to the person you like, right down to the details. You show love through small everyday acts, like checking how they're feeling or bringing a snack they love. What you value is a calm relationship where you both feel safe together. Where things can go wrong: when you go along with your partner so much that you can't say what you really feel. Try starting with small wishes, like “Here's what I'd like.” It brings you and your partner even closer.", "work": "You do your best where you can feel you're helping people, and the steps are fairly set. Your careful service and behind-the-scenes support tend to be highly valued. You're also suited to roles helping people in need, and admin work that needs accuracy. On the other hand, highly competitive workplaces or places where harsh words fly can wear you down. Choosing a workplace where people say thank you out loud helps you work happily for a long time.", "jobs": ["Nurse", "Childcare worker", "Medical office staff", "Librarian", "General affairs / HR"], "growth": "Your kindness is something you're allowed to give yourself first. Starting today, before you say “Sure” to a request, take a breath and check your own schedule and feelings. Also, before bed, try writing down one thing you did well today. When you give yourself credit for helping others, you make room in your heart.", "A": "When you're Assertive, you support others while keeping your own pace. Even with requests, you can tell what's within your reach before you say yes. Your care comes so naturally that people feel free to lean on you without worrying.", "T": "When you're Cautious, you imagine others' feelings deeply, so your care is very fine-tuned. The kindness that makes you wonder, “Am I being a bother?” builds trust. Turning that same kindness toward yourself makes things much easier."}, "ESTJ": {"catch": "A dependable organizer who lays out the steps and moves everyone forward.", "overview": "You're the “let's-make-a-schedule-first” type. You're good at turning things into something solid. Once a trip is decided, you quickly work out the dates and budget. In group work, you assign roles. Fuzzy situations make you uneasy, and you want to make clear “who does what, by when.” You rely on solid facts and past results. You say what needs to be said, so people see you as a dependable leader. You may come across as a bit strict at times, but that comes from a sense of responsibility for making things go well. You shine brightest when you work with others and get results everyone can see.", "strengths": ["You plan ahead and set the steps｜You work backward from the goal and line up what needs doing in order. You make a clear path so others can move without getting lost.", "You decide and follow through｜Even when a discussion drags on, you sum up the key points and reach a conclusion. Once it's decided, you act right away, so things move forward.", "You see it through to the end｜You finish every job you're given. Your refusal to give up, even when it's hard, earns trust from those around you.", "You say things clearly｜You avoid vague words and get straight to the point. Your instructions and explanations are clear, so people can act easily."], "pitfalls": ["Your words can come across as harsh｜You speak frankly to save time, and some people find it blunt. Adding a quick “thanks” before you get to the point helps your message land.", "You stick to your own way｜You trust what's worked before, so you tend to push other ideas aside. Hearing someone's idea all the way through first can lead to something new.", "Rest gets pushed back｜When you can see what needs doing, you just keep going. Put “rest” on your weekend schedule as a real plan. It keeps you from wearing yourself out."], "relationships": "Among friends, you naturally take the lead, like setting dates for get-togethers and booking restaurants. You look out for people, and you help anyone in trouble with practical solutions. At work or in a club, you follow the rules and keep everything running smoothly. You get along best with people who keep their promises and speak plainly. With people who lead with their feelings, making a point of taking time to listen helps you build a good relationship.", "love": "With someone you like, you show a sincere, dependable side. You show you care through action, like planning dates and solving problems together. You want a relationship of trust, where you both keep your promises. Where things can go wrong: when your partner just wants you to listen, and you jump in with a solution. Starting with “Oh, I see” helps your feelings connect much better.", "work": "You do your best where goals and roles are clear and results are easy to see. You tend to be highly valued in roles leading a team or tracking progress. You're also good at setting up rules and improving systems. On the other hand, stress builds up in workplaces where things move forward with no clear direction, or decisions take far too long. Having even a little power to make calls lets you work freely.", "jobs": ["Sales manager", "Project management", "Store manager", "Banker", "Police officer / firefighter"], "growth": "Your drive is a big force that carries people forward. Starting today, before you share your view in a meeting or discussion, try asking the others, “What do you think?” Also, try setting aside one block of time each week with no plans. Time to pause makes your next decision even more solid.", "A": "When you're Assertive, you rarely hesitate and decide very fast. You stay confident even under pressure, so your ability to lead really comes through. You're also quick to bounce back from a failure.", "T": "When you're Cautious, you check for holes and risks in the plan ahead of time. Because you keep asking, “Is this really right?”, your plans are very polished. You also pay attention to how people react, so they trust you as a gentle leader."}, "ESFJ": {"catch": "The one who brings people together and works to keep everyone smiling.", "overview": "You're the “somehow-I'm-the-organizer-again” type. Connecting people comes naturally to you. For parties and birthday celebrations, you somehow end up handling the dates and picking the place. What matters to you is that everyone there has fun and feels comfortable. If someone's left out, you talk to them and bring up topics to warm up the room. You're sensitive to people's feelings and the mood, and you value manners and kindness. To others, you seem bright and easy to talk to, and people often come to you for advice. Hearing “thank you” is your biggest source of energy, and it makes you want to do your best again next time.", "strengths": ["You connect people｜You step in between people who've just met and find something they have in common so they can relax. When you're there, the circle grows.", "You read the room｜You notice who's tired and who wants to talk. You naturally adjust things so everyone feels comfortable.", "Your care turns into action｜You don't just feel it. You show it, with a little treat or a quick message. Your kindness stays with people.", "You pull things together and get them done｜For event prep or group duties, you sort out roles and schedules and see it through to the end. You're a caretaker people can count on."], "pitfalls": ["You worry about what people think｜You want so badly for everyone to be happy that a lukewarm reaction can make you anxious. Drawing your own line, like “I did enough,” makes it easier.", "You push yourself too hard｜You keep taking on organizer and helper roles, and sometimes you end up worn out. Now and then, try handing the role to someone else and just show up.", "You tend to avoid conflict｜You want to protect the mood, so you often swallow disagreements. Saying gently, “Here's what I think,” actually brings people closer."], "relationships": "You have lots of friends and you're often the one checking in on the group chat. You can easily reach out to people you haven't talked to in a while, and you naturally keep the circle together. At work or school, you say hi to newcomers and liven up events. You get along best with people who put their feelings into words back to you. With people who don't react much, knowing they have their own way of showing thanks helps avoid misunderstandings.", "love": "With someone you like, you stay in touch often and think about what will make them happy. You're great at anniversary surprises and home-cooked meals for them. What you value is a relationship where you share your feelings and look out for each other. Where things can go wrong: when you feel like you're the only one giving, and you get lonely. Saying openly what you'd like makes it easier for your partner to respond, and the relationship becomes more stable.", "work": "You do your best in work where you team up with others and can feel you're helping. You tend to be highly valued for building a good team mood and for thoughtful care with customers. You're often trusted with running events and coordinating, too. On the other hand, you lose energy when you work alone in silence for long stretches, or when the people at work are at odds. Choosing a workplace where people share thanks helps you shine for a long time.", "jobs": ["Hotel / hospitality staff", "Teacher", "Wedding planner", "HR / recruiting", "Care worker"], "growth": "Your warmth gives the people around you energy. Starting today, before you take on someone's request, check in with yourself: “Do I have room for this right now?” Also, try putting something on your schedule once a week that's just for your own fun. The more time you spend filling yourself up, the longer your kindness to others can last.", "A": "When you're Assertive, you don't get thrown around by people's reactions, and you can move things along by your own judgment. You can speak up with confidence, so people count on you as a leader. Your brightness stays steady and gives others a sense of security.", "T": "When you're Cautious, you imagine people's feelings in detail, and your care reaches even further. Because you think hard about “Will they like this?”, your prep is very thorough. Knowing that it comes across even when it's not perfect makes your heart lighter."}, "ISTP": {"catch": "A quiet lover of how things work, whose hands get there before the manual does.", "overview": "When you get a new gadget or app, you start poking at it before you read the manual. As an ISTP, you value learning by doing. You love knowing how things work, and your focus actually sharpens when something isn't going right. You often don't say much, so people tend to see you as cool and calm. But inside, you're quietly watching what's in front of you and always thinking about what to fix to make it better. You do your best when you're free to do things your own way, not tied down by lots of small rules. When trouble hits, you don't panic. You just get your hands moving and handle it, so people count on you when it matters. Alone time recharges you, and you can get amazingly deep into the things you love.", "strengths": ["You stay steady in a crisis｜Even when plans fall apart, you first calmly look at what's going on. You choose your next move without panicking, which puts others at ease, too.", "You learn fast with your hands｜You pick up how to use tools and software by trying them out as you go. Actually doing something is how you really understand it.", "You find waste and fix it｜You're good at noticing, “If we change this, it'll be faster.” With a small tweak to the steps or tools, you make the work a lot easier.", "You handle things on your own｜Before asking anyone, you look it up and try it yourself first. Even when you're left to work alone, you stick with it until it's done."], "pitfalls": ["Putting feelings into words is hard｜Your thinking tends to wrap up inside your head, so it may not reach the people around you. Adding just one line, like “Here's what I'm thinking,” cuts down on misunderstandings a lot.", "Once the interest fades, your hands stop｜That's because you tend to feel satisfied once you've figured out how something works. Decide in advance how far you'll take the final touches. It keeps things from being left undone.", "You suddenly pull away｜When you don't get enough alone time, you want to quietly step back. Saying “I need a little break” before you go lets the other person wait without worrying."], "relationships": "With friends, you like an easygoing distance, not too clingy. Rather than texting every day, you value getting together now and then to do something side by side. At work or in a club, you help with your hands more than your words, so people often see you as “the one to count on when things go wrong.” You get along best with people who respect your pace and don't push you to talk. When you can enjoy the same hobby together, you grow closer naturally.", "love": "Even when you like someone, you often show it through actions instead of words. Carrying something heavy, fixing something broken, looking up a place they wanted to go. Those small, thoughtful acts are how you show love. You want a relationship where you both value each other's freedom. Where things can go wrong: when your partner wants to hear “I like you” out loud. Saying what you feel now and then helps your feelings come through clearly.", "work": "You do your best in hands-on settings where you can make your own calls, and in work with results you can see. You're likely to be valued when you're trusted with troubleshooting or improving how things are done. Roles working with machines, data, or tools are a good fit, too. On the other hand, you tire easily with lots of meetings that seem pointless, or workplaces where every step is fixed by detailed rules. Once you know why something is done a certain way, it gets much easier for you to move.", "jobs": ["Engineer (mechanical / facilities)", "IT systems maintenance / infrastructure", "Mechanic / technician", "Video editor / sound crew", "Emergency response / disaster prevention"], "growth": "Your thoughts only start helping others once you say them out loud. Something you can do starting today: share just one opinion in a meeting or discussion. Also, when someone helps you, try saying, “That helped, thanks.” Even a short line steadily builds trust with people.", "A": "As an Assertive ISTP, you rarely second-guess yourself and act as soon as an idea strikes. You don't dwell much on failures and quickly switch to “Next time, I'll do it this way.” You can try new things without a second thought.", "T": "As a Cautious ISTP, you're careful to check the fine details before you act. You look back closely at what didn't work, so you don't repeat the same mistakes. Your craftsman side, with its eye for quality, really shines."}, "ISFP": {"catch": "You quietly move toward whatever your heart says it loves.", "overview": "Picking clothes, choosing a café, deciding your path in life. As an ISFP, you choose by the feeling of “I love this” before any reason. That feeling is very honest, and it truly knows what suits you. Day to day, you seem calm and modest, but inside you have a strong sense of style and things you care about. You notice changes in how people feel, and you quietly stay close to anyone who's struggling. You don't like conflict and want to get along peacefully with those around you. But when someone dismisses what you hold dear, you defend it quietly, yet firmly. You're also gifted at savoring the small comforts of everyday life, like the feel of the season, music, and textures.", "strengths": ["Your sense of style makes spaces feel good｜You notice small differences in color, sound, and how things are arranged. You're good at shaping a room or a document into something that feels nice to look at.", "Your kindness stays gently close｜You quickly notice changes in someone's face or voice. You stay by their side without pushing, so they feel safe sharing what's really on their mind.", "You stay true to yourself｜You don't get swept up by trends or what others say. You choose what fits you. Seeing you do that helps others feel it's okay to be themselves.", "You can focus on what's in front of you｜Once you start on something you love, you lose track of time. The more care you put in, the more warmth shows in the result."], "pitfalls": ["You can't say no and end up carrying it｜That's because you really don't want to hurt anyone. Instead of answering right away, ask, “Can I think about it?” The extra time lets you check what you really feel.", "Long-range plans can be hard for you｜You value how you feel right now, so faraway plans don't feel real. Breaking big plans into small pieces and putting them on your calendar one at a time makes it easier.", "You take criticism too much to heart｜That's because your feelings go into what you make. Try sorting feedback into “about the work” and “about me.” It lightens your heart."], "relationships": "You'd rather spend relaxed time with a few people you click with than hang out in a big, noisy group. You remember your friends' tastes and when they're feeling off, and you can look out for them without fuss. At work or school, you're likely to be valued as someone who softens the mood. You get along best with people who don't dismiss how you feel and who match your pace. You open up slowly, so the more time you put into a relationship, the deeper the trust grows.", "love": "When you fall for someone, it's less about words and more about the vibe and how comfortable you feel together. You're good at giving your feelings a form, like writing a letter or picking a gift that suits their taste. What you want most is to respect each other's pace and the things you each love. Where things can go wrong: when you hold in your frustrations without saying them. Saying “I felt a little lonely” while it's still small makes the relationship feel even better.", "work": "You do your best in work that uses your sense of style, or where you can feel you're helping people. In making things, design, or roles where you support people directly, your care and kindness tend to be valued. In a setting where you can work at your own pace, your focus really takes off. On the other hand, you tire easily in highly competitive workplaces or places that judge you only by numbers. If there's even one part you love, it's easier to keep going for the long run.", "jobs": ["Designer", "Hairstylist / nail artist", "Childcare worker", "Pastry chef / cook", "Veterinary nurse / pet groomer"], "growth": "What you love can be a valuable hint for the people around you, too. Something you can do starting today: jot down just one line about something good you felt that day. Your tastes and what you want to protect will start to show up clearly in words. When you feel like it, try telling someone about one of them.", "A": "As an Assertive ISFP, you trust your own sense and act on it directly. You don't worry much about what others think, and you throw yourself into what you love with confidence. You bounce back from moods quickly, and people often see you as bright.", "T": "As a Cautious ISFP, you're very sensitive to how others feel, and your care is fine-tuned. You want to make what you create even better, so you rework it again and again. That care becomes part of your deep charm."}, "ESTP": {"catch": "You step out before you overthink it and catch the flow of the moment.", "overview": "“Let's just go and see” comes out of your mouth naturally. As an ESTP, you find answers by moving, not by thinking it all through first. You jump right into new shops, events, and places you've never been, and you read the mood quickly. You talk fast with a good rhythm, and people tend to see you as someone with get-up-and-go they can rely on. You care more about what's really happening right here than about theories on paper. You enjoy the unexpected, and you're at your best in a pinch. You love being with people and hit it off with strangers right away. Your brightness and easy energy are often what gets others moving.", "strengths": ["You make split-second calls｜Even when things change, you find “what to do now” right away. You cut down on time lost to hesitation and move the team forward.", "You liven things up｜You talk with a good rhythm and naturally brighten the room. Your strength is hitting it off right away, even with people you've just met.", "You move with what's real｜You think about “how we'll actually do it” over ideal theories. You combine the tools and people you have and make things happen.", "You try without fear of failing｜Even when something doesn't work, you switch to “Next!” That lightness draws in new chances."], "pitfalls": ["You tend to put off what's ahead｜You throw yourself into what's in front of you, so far-off plans are harder to see. Taking a few minutes once a week to look over next week's schedule on your phone gives you peace of mind.", "In the moment, you say too much｜You care about keeping the talk moving, so words sometimes come out first. Just taking a breath before an important talk changes how it comes across.", "Repetitive work breaks your focus｜That's because without some stimulation, you get bored easily. Setting a time limit and turning it into a game makes it easier to finish."], "relationships": "You have lots of friends, and when someone invites you, you're quick to go. You're also great at suddenly saying, “Want to hang out now?” on a day off. At work or in a club, people count on you as the mood-maker who gets things moving. You're easygoing and straightforward, so you're good at resetting the mood when things get tangled. You get along best with people who enjoy new things with you and sometimes offer a calmer view. Relationships where neither of you holds back feel most comfortable.", "love": "When you fall for someone, you show it through action. You take the leap and ask them out, and you grow closer by going places together. You love dates where you share fun experiences, like activities or trips. What you value is being able to be yourself together. Where things can go wrong: when your partner wants a long, deep talk. Taking time now and then to calmly hear how they feel makes your bond even stronger.", "work": "You do your best in work with lots of change and quick results. In roles where you deal with people directly, like sales or on-site work, your negotiating skills and fast response tend to be valued. People also count on you to put out fires when trouble hits. On the other hand, you tire easily in jobs that just repeat the same tasks, or places where decisions take a long time. You shine brightest where you can think on the move.", "jobs": ["Sales", "Event planner", "Sports trainer", "Firefighter / police officer", "Running your own business / shop"], "growth": "Your drive gets even stronger with a little prep. Something you can do starting today: wait just 10 seconds before an important decision. In that time, think of one other option or how the other person might feel. A habit of checking one thing on tomorrow's schedule before bed also helps back up your momentum.", "A": "As an Assertive ESTP, you're full of confidence and act without hesitating. You don't worry much about how others see you, and you dive into new places one after another. You'll often find yourself naturally put in the leader's role.", "T": "As a Cautious ESTP, on top of your drive, you have the calm to watch how people react. You have a habit of looking back after you act, so you put your experience to good use in the next challenge. You're someone people can count on, with a good balance of momentum and care."}, "ESFP": {"catch": "You make right now more fun for everyone around you.", "overview": "When something fun comes up, you've already replied “I'm in!” before you even think about it. As an ESFP, you enjoy the moment to the fullest and spread that fun to everyone around you. Your face is so expressive that just talking with you lights up the room. You fit in quickly even in new places, and you often end up at the center of the group. You love seeing people happy, and you make a point of celebrating friends' birthdays and little wins. Rather than logic, you act by sensing the mood and how people feel. If someone's feeling down, you lightly get them laughing and cheer them up. People think of you as “so fun to be around,” and they naturally gather around you.", "strengths": ["You brighten the mood｜Your smiles and reactions ease even a tense room. You naturally create a feel where others find it easy to talk.", "You quickly sense how people feel｜You can tell right away whether someone's having fun or getting tired. You have the kindness to check in with them on the spot.", "You fit into new places fast｜Whether it's a new school, a new team, or a trip, you warm up to people right away. Your strength is connecting with strangers and growing the circle.", "You turn “fun” into something real｜Ideas for get-togethers and events keep popping up. When you think of one, you act right away and make memories for everyone."], "pitfalls": ["You overpack your schedule｜That's because you find it hard to say no, and you want to say yes to everything that sounds fun. Deciding on one “nothing day” each week in advance keeps you from wearing yourself out.", "Money and time slip away｜That's because you tend to put the fun of the moment first. Make a rule to sleep on it before you buy. Then only the things you really want end up in your hands.", "You tend to avoid heavy talks｜That's because you really want to keep the mood bright. Setting aside a short, separate time for important talks, apart from fun times, makes them easier to face."], "relationships": "You have lots of friends, and you're the one keeping the group chat lively. You can talk easily with anyone, so at work or school you often end up connecting people. You notice small changes in others and have the warmth to ask, “How have you been?” You get along best with people who enjoy your brightness and also listen calmly now and then. The more time you spend laughing together, the longer the relationship lasts.", "love": "When you fall for someone, it shows right away. When you want to see them or talk to them, you reach out honestly. On dates, you're great at delighting your partner with surprises and fun plans. What you value is having fun together and openly sharing your feelings. Where things can go wrong: when your partner wants to talk about the future or other things down the road. Taking time now and then to think seriously about it builds a lot of trust with your partner.", "work": "You do your best in work where you deal with people and get reactions right away. In customer service, sales, or events, your brightness and thoughtfulness tend to be valued. You're also treasured as someone who makes the team's mood better. On the other hand, you tire easily in jobs where you're alone at a computer all day, or settings full of routine tasks with little change. You do your best where you can see people smile.", "jobs": ["Customer service / sales staff", "Tour guide / travel planner", "Event staff", "Childcare worker / preschool teacher", "Entertainment industry"], "growth": "Your brightness lasts longer with a little planning ahead. Something you can do starting today: at the start of each month, write down one “thing to look forward to” and one “thing I need to do.” When you can see both, it's easy to balance them happily. Also, when you're tired, try saying honestly, “I'm going to rest today.”", "A": "As an Assertive ESFP, you express your charm freely. You don't worry too much about what others think, and you act as soon as an idea strike
