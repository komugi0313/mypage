<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@500;700&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#999;display:flex;flex-direction:column;gap:20px;padding:20px}
*{box-sizing:border-box}
:root{--ink:#1F2733;--muted:#5E6A7A;--brick:#C2553F;--paper:#F8F3EA;--bg:#F6F7F9;--bl:#3E7FA6}
.b{font-family:"IBM Plex Sans JP",sans-serif;color:var(--ink);position:relative;overflow:hidden;background:var(--bg)}
.mono{font-family:"IBM Plex Mono",monospace}
.top{position:absolute;left:0;right:0;top:0;background:var(--brick)}
.card{position:absolute;border-radius:8%;background:var(--paper);border:2px solid #E2E6EC;overflow:hidden;box-shadow:0 6px 16px rgba(31,39,51,.18)}
.card img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.back{position:absolute;border-radius:8%;background:var(--brick);box-shadow:0 6px 16px rgba(31,39,51,.22);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.back::before{content:"";position:absolute;inset:7%;border:2px dashed rgba(255,255,255,.55);border-radius:6%}
.cta{position:absolute;background:var(--brick);color:#fff;font-weight:700;border-radius:99px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
#b300{width:300px;height:250px}
#b320{width:320px;height:100px}
#b728{width:728px;height:90px}
</style></head><body>

<div class="b" id="b300">
 <div class="top" style="height:6px"></div>

 <div style="position:absolute;left:16px;top:122px;font-size:12px;color:var(--muted);line-height:1.5">生年月日の「気質」と、<br>30問の「性格」をくらべる</div>
 <div class="back" style="left:166px;top:46px;width:70px;height:100px;transform:rotate(-10deg);font-size:46px">?</div>
 <div class="card" style="left:220px;top:58px;width:70px;height:100px;transform:rotate(8deg)"><img src="../characters/web/ENFP.webp"></div>
 <div class="cta" style="left:16px;right:16px;bottom:16px;height:44px;font-size:16px">無料で診断する　→</div>
</div>

<div class="b" id="b728">
 <div class="top" style="height:4px"></div>

 <div style="position:absolute;left:122px;top:52px;font-size:12.5px;color:var(--muted)">生年月日の「気質」と、30問の「性格」をくらべる無料診断</div>

</div>
</body></html>
