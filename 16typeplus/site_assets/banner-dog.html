<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#8a8a8a;display:grid;grid-template-columns:repeat(2,300px);gap:44px 30px;padding:44px 24px 24px}*{box-sizing:border-box}
.w{position:relative}.tag{position:absolute;left:0;top:-28px;color:#fff;font:700 15px sans-serif}
.b{width:300px;height:250px;position:relative;overflow:hidden;font-family:"Zen Maru Gothic",sans-serif;color:#2E5C67}
.dots{background-color:#A8D5DB;background-image:radial-gradient(rgba(255,255,255,.55) 1.6px,transparent 1.8px);background-size:14px 14px}
.panel{position:absolute;left:12px;right:12px;top:12px;bottom:12px;background:#fff;border-radius:22px;box-shadow:0 5px 0 #7DB8C1}
.lg{position:absolute;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;letter-spacing:.02em}
.lg i{font-style:normal;color:#E0806A}
.h{position:absolute;font-weight:900;line-height:1.5}
.h em{font-style:normal;color:#3E93A5}
.s{position:absolute;font-weight:500;color:#5E7F87}
.card{position:absolute;border-radius:12px;background:#fff;box-shadow:0 3px 10px rgba(46,92,103,.18)}
.card .im{position:absolute;left:5px;right:5px;top:5px;bottom:18px;border-radius:8px;overflow:hidden;background:#F7F1E8}
.card .im img{width:100%;height:100%;object-fit:cover;object-position:center 28%}
.card .q{position:absolute;left:5px;right:5px;top:5px;bottom:18px;border-radius:8px;background:#EAF5F7;display:flex;align-items:center;justify-content:center;color:#3E93A5;font:900 26px "Zen Maru Gothic"}
.card .cl{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-weight:700;font-size:9px;color:#2E5C67}
.cta{position:absolute;border-radius:99px;background:#2E5C67;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #1E3F47}
.paw{position:absolute;font-size:16px}
</style></head><body>

 <div class="card" style="left:84px;top:100px;width:56px;height:78px;transform:rotate(-7deg)"><div class="q">?</div><div class="cl">気質</div></div>
 <div class="card" style="left:150px;top:96px;width:56px;height:78px;transform:rotate(6deg)"><div class="im"><img src="../characters/web/ENFP.webp"></div><div class="cl">性格</div></div>

</body></html>
