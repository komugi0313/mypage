<title>四柱推命 命式表</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    /* 白ベース・モノクロ（印刷しやすい） */
    --paper:#FFFFFF; --paper2:#FFFFFF;
    --ink:#1E1B17; --ink2:#565049; --faint:#8E877D;
    --rule:#B9B4AA; --rule2:#DAD6CD; --shade:#F0EFEB;
    --gold:#6E695F; --gold-soft:#A9A499;   /* 枠・装飾＝墨グレー */
    --now:#333029; --focus:#8A9A7B;
    --el-moku:#2E7D52; --el-ka:#C0392B; --el-do:#B07E1E; --el-kin:#6E6A62; --el-sui:#2F5A8F;
    --mincho:"Shippori Mincho","Yu Mincho","Hiragino Mincho ProN",serif;
    --gothic:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;
    --stage:#E9E7E1; --stage2:#DBD8D0;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --stage:#20201d; --stage2:#15150f; } }
  :root[data-theme="dark"]{ --stage:#20201d; --stage2:#15150f; }

  *{box-sizing:border-box}
  body{ margin:0; background:radial-gradient(120% 100% at 50% 0%, var(--stage) 0%, var(--stage2) 100%);
    color:var(--ink); font-family:var(--gothic); -webkit-text-size-adjust:100%; font-feature-settings:"palt"; }
  .stage{ padding:22px 16px 56px; }

  /* ============ コントロール（印刷されない） ============ */
  .bar{ max-width:1100px; margin:0 auto 16px; background:rgba(251,247,238,.72); border:1px solid var(--rule);
    border-radius:14px; padding:14px 16px; backdrop-filter:blur(4px); }
  .bar-row{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; }
  .bar-row + .bar-row{ margin-top:12px; padding-top:12px; border-top:1px dashed var(--rule2); }
  .bar .grp{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .bar .glabel{ font-family:var(--mincho); font-weight:700; font-size:12.5px; letter-spacing:.1em; color:var(--ink2); }
  .seg{ display:inline-flex; border:1px solid var(--rule); border-radius:999px; overflow:hidden; background:var(--paper); }
  .seg button{ font-family:var(--gothic); font-size:12.5px; font-weight:700; letter-spacing:.03em; color:var(--ink2);
    background:transparent; border:0; padding:7px 15px; cursor:pointer; transition:.15s; }
  .seg button + button{ border-left:1px solid var(--rule); }
  .seg button[aria-pressed="true"]{ background:var(--gold); color:#fff; }
  .seg button:focus-visible{ outline:2px solid var(--focus); outline-offset:-2px; }
  .bar .act{ margin-left:auto; display:flex; gap:10px; }
  .bar .act button{ font-family:var(--gothic); font-size:13px; font-weight:700; letter-spacing:.03em; color:var(--ink);
    background:var(--paper); border:1px solid var(--rule); border-radius:999px; padding:8px 16px; cursor:pointer; transition:.15s; }
  .bar .act button:hover{ background:var(--shade); border-color:var(--gold-soft); }
  .bar .act .primary{ background:var(--gold); color:#fff; border-color:var(--gold); }
  .bar .act .primary:hover{ background:#96793c; }

  .calcbox{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px 12px; }
  .calcbox .f{ display:flex; flex-direction:column; gap:3px; }
  .calcbox label{ font-size:10.5px; letter-spacing:.1em; color:var(--ink2); font-weight:700; }
  .calcbox input, .calcbox select{ font-family:var(--gothic); font-size:14px; color:var(--ink);
    background:var(--paper); border:1px solid var(--rule); border-radius:8px; padding:7px 9px; }
  .calcbox input{ width:74px; text-align:right; font-variant-numeric:tabular-nums; }
  .calcbox input.yr{ width:82px; }
  .calcbox :focus-visible{ outline:2px solid var(--focus); outline-offset:1px; }
  .calc-msg{ font-size:12px; color:var(--now); font-weight:700; }
  body[data-mode="blank"] #calcRow{ display:none; }

  /* ============ 用紙 ============ */
  .sheet{ position:relative; max-width:1100px; margin:0 auto;
    background:var(--paper); color:var(--ink);
    padding:clamp(24px,3.8vw,48px); border-radius:2px;
    display:flex; flex-direction:column;
    box-shadow:0 1px 0 rgba(0,0,0,.05), 0 20px 50px -30px rgba(30,27,23,.5); }
  .sheet::before,.sheet::after{ content:""; position:absolute; pointer-events:none; border-radius:10px; }
  .sheet::before{ inset:13px; border:1.4px solid var(--gold); opacity:.75; }
  .sheet::after{ inset:20px; border:1px dashed var(--faint); opacity:.7; }

  .corner{ position:absolute; width:clamp(54px,6.4vw,86px); height:clamp(54px,6.4vw,86px); color:var(--gold); opacity:.72; z-index:2; }
  .corner svg{ width:100%; height:100%; display:block; }
  .corner.tl{ top:18px; left:18px; }
  .corner.tr{ top:18px; right:18px; transform:scaleX(-1); }
  .corner.bl{ bottom:18px; left:18px; transform:scaleY(-1); }
  .corner.br{ bottom:18px; right:18px; transform:scale(-1,-1); }
  .inner{ position:relative; z-index:3; flex:1; display:flex; flex-direction:column; min-height:0; }

  /* ============ 見出し ============ */
  .head{ text-align:center; margin:4px 0 12px; }
  .crest{ width:126px; height:32px; margin:0 auto 5px; color:var(--gold); display:block; }
  .title{ font-family:var(--mincho); font-weight:700; color:var(--ink); font-size:clamp(18px,2.4vw,26px);
    letter-spacing:.42em; margin:0; text-indent:.42em; text-wrap:balance; }
  .subrule{ width:min(340px,68%); height:0; border-top:1px solid var(--rule); margin:9px auto 0; position:relative; }
  .subrule::after{ content:"✦"; position:absolute; top:-.72em; left:50%; transform:translateX(-50%);
    background:var(--paper2); padding:0 10px; color:var(--gold); font-size:12px; }
  .meta{ margin:12px auto 2px; display:flex; justify-content:center; flex-wrap:wrap; gap:6px 22px;
    font-family:var(--mincho); color:var(--ink); font-size:15px; letter-spacing:.03em; }
  .meta .field{ display:inline-flex; align-items:baseline; gap:8px; }
  .meta .lbl{ font-size:11.5px; color:var(--ink2); font-family:var(--gothic); letter-spacing:.14em; }

  .ed{ cursor:text; border-radius:3px; transition:background .12s, box-shadow .12s; min-width:1em; }
  .ed:hover{ background:rgba(168,138,70,.10); }
  .ed:focus{ outline:none; background:rgba(138,154,123,.16); box-shadow:0 0 0 2px var(--focus); }

  .body{ display:grid; grid-template-columns:1.42fr 1fr; gap:clamp(15px,2vw,28px); margin-top:18px; flex:1 1 auto; min-height:0; align-items:stretch; }
  .col{ display:flex; flex-direction:column; gap:16px; min-width:0; min-height:0; }
  /* 命式・年運の表を用紙の縦いっぱいに伸ばして全面を埋める */
  .col > section{ flex:1 1 auto; display:flex; flex-direction:column; min-height:0; }
  .col > section > .scroll{ flex:1 1 auto; min-height:0; }
  .col > section > .scroll > table{ height:100%; }
  .pillars td, .pillars th, .bio td, .bio th{ vertical-align:middle; }
  .kubo-chip{ margin-left:12px; font-family:var(--gothic); font-size:11px; color:var(--ink2); font-weight:700; letter-spacing:.04em; }
  .kubo-chip #kuboChip{ color:var(--now); }
  .ori-toggle.seg{ margin-left:auto; }
  .ori-toggle.seg button{ padding:3px 12px; font-size:11.5px; }
  #meishikiMount{ height:100%; }
  #meishikiMount > table.pillars{ height:100%; }
  .pillars .v{ text-align:center; font-size:14px; }
  .pillars .kanchar{ font-family:var(--mincho); font-size:24px; line-height:1.12; }
  .pillars .p-day{ background:rgba(180,72,60,.05); }
  .pillars thead th.p-day{ background:rgba(180,72,60,.10); }
  .block-title{ font-family:var(--mincho); font-weight:700; color:var(--ink); font-size:14px; letter-spacing:.16em;
    margin:0 0 6px; padding-bottom:5px; border-bottom:1.4px solid var(--rule); display:flex; align-items:baseline; gap:8px; }
  .block-title small{ font-family:var(--gothic); font-weight:500; font-size:11px; color:var(--ink2); letter-spacing:.08em; }

  table{ width:100%; border-collapse:collapse; }
  .scroll{ overflow-x:auto; }

  .pillars{ font-family:var(--mincho); table-layout:fixed; }
  .pillars .rowlbl{ width:70px; }  /* 見出し列を固定し、四柱を等幅に */
  .pillars th,.pillars td{ border:1px solid var(--rule); text-align:center; padding:6px 4px; }
  .pillars thead th{ background:var(--shade); font-weight:700; color:var(--ink); font-size:13px; letter-spacing:.1em; padding:7px 4px; }
  .pillars .rowlbl{ background:var(--paper2); color:var(--ink2); font-size:12px; letter-spacing:.08em; white-space:nowrap; width:70px; }
  .pillars .govern td{ background:var(--paper2); color:var(--ink2); font-size:12px; letter-spacing:.06em; font-family:var(--gothic); padding:5px 4px; }
  .pillars .tenchu{ background:var(--paper2); width:56px; color:var(--ink2); }
  .pillars .tenchu .val{ font-size:14px; line-height:1.35; font-family:var(--mincho); }
  .pillars .sum{ background:var(--shade); font-family:var(--gothic); font-weight:700; font-size:15px; font-variant-numeric:tabular-nums; }
  .pillars .num{ font-size:16px; font-variant-numeric:tabular-nums; }
  .pillars .zokan{ font-size:19px; }
  .pillars .star{ font-size:15px; letter-spacing:.02em; }

  .kanshi-cell{ padding:4px 2px 5px !important; }
  .kanshi-cell .k5{ font-family:var(--gothic); font-size:10.5px; letter-spacing:.02em; line-height:1.2; display:block; min-height:1.2em; }
  .kanshi-cell .kanshi{ font-size:27px; line-height:1.16; letter-spacing:.04em; display:block; margin:1px 0; color:var(--ink); min-height:1.16em; }
  /* 五行カラー — トグルONのときだけ着色（既定はモノクロ＝印刷向け） */
  body[data-color="on"] .el-moku{ color:var(--el-moku); } body[data-color="on"] .el-ka{ color:var(--el-ka); }
  body[data-color="on"] .el-do{ color:var(--el-do); } body[data-color="on"] .el-kin{ color:var(--el-kin); }
  body[data-color="on"] .el-sui{ color:var(--el-sui); }

  .bio{ font-size:12.5px; }
  .bio th,.bio td{ border-bottom:1px solid var(--rule2); padding:6px 5px; text-align:left; vertical-align:top; }
  .bio thead th{ border-bottom:1.4px solid var(--rule); color:var(--ink2); font-family:var(--gothic); font-weight:700; font-size:10.5px; letter-spacing:.08em; }
  .bio .yr{ font-family:var(--mincho); font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums; width:52px; }
  .bio .nm{ font-family:var(--mincho); font-weight:600; white-space:nowrap; color:var(--ink); width:46px; }
  .bio .ds{ color:var(--ink2); line-height:1.5; }
  .bio .n{ text-align:center; font-variant-numeric:tabular-nums; color:var(--faint); width:20px; }
  .bio .cv{ font-family:var(--mincho); text-align:center; white-space:nowrap; width:32px; font-size:13px; }
  .bio tr.tc .yr, .bio tr.tc .nm{ color:var(--now); }
  .bio td.ds:empty::before{ content:"（毎年のテーマを記入）"; color:var(--faint); }
  .bio tr.kubo .nm::after{ content:"空亡"; display:block; font-size:9px; letter-spacing:.12em; color:var(--now); font-weight:700; margin-top:1px; }

  .daiun{ font-size:13px; font-family:var(--mincho); }
  .daiun th,.daiun td{ border-bottom:1px solid var(--rule2); padding:5px 6px; text-align:center; white-space:nowrap; }
  .daiun thead th{ border-bottom:1.4px solid var(--rule); font-family:var(--gothic); font-weight:700; font-size:10.5px; color:var(--ink2); letter-spacing:.06em; }
  .daiun .age{ text-align:left; font-variant-numeric:tabular-nums; }
  .daiun .n{ font-variant-numeric:tabular-nums; color:var(--faint); }
  .daiun tr.now td{ background:var(--shade); color:var(--now); font-weight:600; }

  .gogyo{ font-size:13px; }
  .gogyo th,.gogyo td{ border-bottom:1px solid var(--rule2); padding:6px 6px; text-align:center; }
  .gogyo thead th{ border-bottom:1.4px solid var(--rule); font-family:var(--gothic); font-weight:700; font-size:10.5px; color:var(--ink2); letter-spacing:.06em; }
  .gogyo .g{ font-family:var(--mincho); font-size:17px; font-weight:600; }
  .gogyo .c{ font-variant-numeric:tabular-nums; font-weight:700; }
  .gogyo .mk{ font-size:14px; }
  .gogyo .cd{ text-align:left; color:var(--ink2); font-family:var(--gothic); font-size:11.5px; letter-spacing:.02em; }
  body[data-color="on"] .g-moku{color:var(--el-moku)} body[data-color="on"] .g-ka{color:var(--el-ka)}
  body[data-color="on"] .g-do{color:var(--el-do)} body[data-color="on"] .g-kin{color:var(--el-kin)} body[data-color="on"] .g-sui{color:var(--el-sui)}

  /* 行運（3年） */
  .unsei-sec{ margin-bottom:14px; }
  .unsei{ font-size:13px; font-family:var(--mincho); }
  .unsei th,.unsei td{ border:1px solid var(--rule); text-align:center; padding:5px 6px; white-space:nowrap; }
  .unsei thead th{ background:var(--shade); font-family:var(--gothic); font-weight:700; font-size:11px; color:var(--ink); letter-spacing:.08em; padding:6px; }
  .unsei .yc{ font-family:var(--gothic); font-weight:700; font-size:11.5px; color:var(--ink2); width:64px; white-space:nowrap; }
  .unsei .kan{ font-size:16px; letter-spacing:.04em; }
  .unsei tr.now td{ background:var(--shade); }
  .unsei tr.now .yc{ color:var(--now); }

  /* 五行バランス＋五角形 */
  .gogyo-wrap{ display:flex; gap:14px; align-items:flex-start; }
  .gogyo-wrap .gogyo{ flex:1 1 auto; min-width:0; }
  .pent{ flex:0 0 auto; width:150px; text-align:center; }
  .pent svg{ width:150px; height:140px; display:block; }
  .pent .pcap{ font-family:var(--gothic); font-size:10px; color:var(--faint); letter-spacing:.1em; margin-top:2px; }
  .pent text.lbl{ font-family:var(--mincho); font-size:13px; fill:var(--ink); }
  .pent text.cnt{ font-family:var(--gothic); font-size:11px; font-weight:700; fill:var(--ink2); }
  .pent .edge{ stroke:var(--rule); stroke-width:1; fill:none; }
  .pent .sei{ stroke:var(--rule2); stroke-width:.8; fill:none; }
  .pent .node{ fill:var(--paper); stroke:var(--rule); stroke-width:1; }
  body[data-color="on"] .pent .n-moku{ stroke:var(--el-moku); } body[data-color="on"] .pent text.l-moku{ fill:var(--el-moku); }
  body[data-color="on"] .pent .n-ka{ stroke:var(--el-ka); } body[data-color="on"] .pent text.l-ka{ fill:var(--el-ka); }
  body[data-color="on"] .pent .n-do{ stroke:var(--el-do); } body[data-color="on"] .pent text.l-do{ fill:var(--el-do); }
  body[data-color="on"] .pent .n-kin{ stroke:var(--el-kin); } body[data-color="on"] .pent text.l-kin{ fill:var(--el-kin); }
  body[data-color="on"] .pent .n-sui{ stroke:var(--el-sui); } body[data-color="on"] .pent text.l-sui{ fill:var(--el-sui); }

  .note{ border:1px solid var(--rule); border-radius:6px; background:var(--paper2); padding:11px 14px; font-size:12.5px; color:var(--ink2); line-height:1.75; }
  .note b{ color:var(--ink); font-family:var(--mincho); font-weight:600; }
  .footline{ margin-top:20px; text-align:center; font-family:var(--gothic); font-size:10.5px; color:var(--faint); letter-spacing:.2em; }
  .footrow{ display:grid; grid-template-columns:1fr auto 1fr; align-items:baseline; gap:8px; margin-top:16px; }
  .footrow .footline{ margin:0; grid-column:2; }
  .kantei{ grid-column:3; justify-self:end; font-family:var(--gothic); font-size:11px; color:var(--ink2); letter-spacing:.05em; white-space:nowrap; }
  #schoolName{ color:var(--ink2); font-weight:700; letter-spacing:.08em; }
  .subgrid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .bottom{ display:grid; grid-template-columns:1.15fr 1fr; gap:clamp(15px,2vw,28px); margin-top:16px; align-items:start; flex:0 0 auto; }
  .bottom > section{ min-width:0; }
  /* 大運：年齢の期間を主役に。空欄は「才 〜 才」を薄く表示（記入ガイド） */
  .daiun td.age:empty::before{ content:"才 〜 才"; color:var(--faint); }
  .daiun td.age{ min-width:92px; }
  .daiun .yr2{ white-space:nowrap; font-variant-numeric:tabular-nums; min-width:96px; }
  .daiun td.yr2:empty::before{ content:"年 〜 年"; color:var(--faint); }

  /* ===== 画面はA4横に近い自然な高さで表示（はみ出さない） ===== */
  .sheet{ max-width:1180px; }
  .head{ margin:2px 0 8px; } .crest{ height:26px; margin-bottom:3px; }
  .title{ font-size:clamp(17px,2.1vw,23px); }
  .meta{ margin:8px auto 0; font-size:13.5px; gap:5px 20px; }
  .body{ margin-top:12px; gap:22px; } .col{ gap:11px; } .bottom{ margin-top:11px; gap:22px; }
  .block-title{ font-size:15px; margin-bottom:5px; padding-bottom:4px; }
  .pillars th,.pillars td{ padding:4px 4px; } .pillars thead th{ padding:6px 3px; font-size:15px; }
  .pillars .rowlbl{ font-size:13px; } .pillars .govern td{ font-size:13px; padding:5px; }
  .kanshi-cell .kanshi{ font-size:30px; } .pillars .zokan{ font-size:23px; }
  .pillars .star{ font-size:17px; } .pillars .num{ font-size:18px; } .pillars .sum{ font-size:17px; }
  .kanshi-cell .k5{ font-size:11px; }
  .pillars .tenchu .val{ font-size:16px; }
  .bio{ font-size:11.5px; } .bio th,.bio td{ padding:2.5px 4px; line-height:1.28; } .bio thead th{ font-size:11px; }
  .bio .cv{ font-size:12.5px; } .bio .yr,.bio .nm{ font-size:12.5px; } .bio .n{ font-size:11px; }
  .daiun{ font-size:13.5px; } .daiun th,.daiun td{ padding:3.5px 6px; } .daiun thead th{ font-size:12px; }
  .gogyo{ font-size:13.5px; } .gogyo th,.gogyo td{ padding:3.5px 6px; } .gogyo .g{ font-size:19px; } .gogyo .cd{ font-size:12px; } .gogyo thead th{ font-size:12px; }
  .pent{ width:150px; } .pent svg{ width:150px; height:140px; }
  .note{ font-size:12.5px; padding:9px 13px; }

  @media (max-width:760px){
    .body{ grid-template-columns:1fr; } .subgrid{ grid-template-columns:1fr; }
    .meta{ font-size:13.5px; gap:6px 14px; } .title{ letter-spacing:.28em; text-indent:.28em; }
    .bar .act{ margin-left:0; }
  }

  /* ============ 印刷（A4横1枚に収める） ============ */
  @media print{
    html,body{ width:287mm; }
    body{ background:#fff; } .stage{ padding:0; width:287mm; } .bar{ display:none; }
    .sheet{ box-shadow:none; max-width:none; width:287mm; height:200mm; aspect-ratio:auto; margin:0; padding:7mm 8mm;
      transform-origin:top left; font-size:9.4px; }
    .sheet::before{ inset:3mm; } .sheet::after{ inset:5mm; }
    .corner{ width:16mm; height:16mm; top:5mm; left:5mm; }
    .corner.tr{ left:auto; right:5mm; } .corner.bl{ top:auto; bottom:5mm; } .corner.br{ top:auto; bottom:5mm; left:auto; right:5mm; }
    .body{ margin-top:3mm; gap:5mm; } .col{ gap:3mm; } .subgrid{ gap:4mm; }
    .head{ margin:0 0 2mm; } .crest{ height:7mm; margin-bottom:1mm; } .meta{ margin:2mm 0 0; }
    .kanshi-cell .kanshi{ font-size:17px; margin:0; } .pillars .zokan{ font-size:13px; }
    .kanshi-cell .k5{ font-size:8.5px; line-height:1.05; }
    .pillars th,.pillars td{ padding:1.4px 3px; } .pillars thead th{ padding:2px 3px; }
    .bio th,.bio td{ padding:1.3px 4px; line-height:1.32; } .bio thead th{ padding:2px 4px; }
    .daiun th,.daiun td,.gogyo th,.gogyo td{ padding:1.5px 5px; }
    .block-title{ margin-bottom:1.5mm; padding-bottom:1mm; }
    .footline{ margin-top:1.5mm; }
    /* A4横1枚に確実に収める微調整 */
    .sheet{ padding:5mm 7mm; }
    .body{ margin-top:2mm; gap:4mm; } .col{ gap:2.4mm; } .subgrid{ gap:3mm; }
    .head{ margin:0 0 1mm; } .crest{ height:6mm; } .meta{ margin:1mm 0 0; }
    .note{ padding:4px 9px; line-height:1.45; }
    section:has(.note){ margin-top:0; }
    /* 行運・五角形の圧縮 */
    .unsei-sec{ margin-bottom:2.5mm; }
    .unsei th,.unsei td{ padding:1.6px 5px; } .unsei thead th{ padding:2px 5px; }
    .unsei .kan{ font-size:14px; }
    .pent{ width:120px; } .pent svg{ width:120px; height:112px; }

<script id="meishiki-engine">
/* ============================================================
 *  自動計算エンジンの接続口（ご自身のエンジンをここに差し込みます）
 *  ------------------------------------------------------------
 *  ※他流派のエンジンは一切含みません。空のスタブです。
 *  下記シグネチャの関数 window.computeMeishiki を定義すると、
 *  「自動計算」モードの［鑑定する］で命式表へ自動反映されます。
 *  未定義の場合はエラーにならず、手入力（記入用）で使えます。
 *
 *  【入力】computeMeishiki({ year, month, day, hour, minute, sex })
 *    year,month,day,hour,minute : 数値（西暦・24時間）
 *    sex : "male" | "female"
 *
 *  【返り値】以下の形のオブジェクト（要素は "木/火/土/金/水"、陰陽は "陽/陰"）
 *  {
 *    pillars: {
 *      year:  { kanshi, gan, shi,
 *               ganElement, ganYinYang, shiElement, shiYinYang,
 *               zokan, zokanElement(任意),
 *               tsuhen, zokanTsuhen, junishi },
 *      month: { …同じ形… },
 *      day:   { …同じ形。tsuhen は日主のため null 可… },
 *      hour:  { …同じ形。時刻不使用なら省略/空でも可… }
 *    },
 *    tenchusatsu: "戌亥",                 // 空亡（天中殺）
 *    shugojin: ["丁","癸","丙"],           // 守護神（命式から。可変長。守護神欄へ自動表示）
 *    gogyoCount:  { 木:0, 火:0, 土:0, 金:0, 水:0 },   // 五行の数（五行バランス＋五角形へ）
 *    gogyoStrength:{ 木:"◎", 火:"○", … }(任意),        // 強弱。無ければ数から自動（0✕/1△/2○/3+◎）
 *    direction:   "順行" | "逆行",         // 大運の進行
 *    daiun: [ { ageFrom, ageTo, kanshi, tsuhen, junishi,
 *               num(任意),
 *               startYear(任意), endYear(任意) }, … ],
 *              // 西暦は startYear/endYear があれば使用、無ければ
 *              //  birthYear + ageFrom〜ageTo で自動計算（入力の year を使用）
 *    nenun: [ { year, tsuhen, junishi, kubo }, … 12件 ],
 *              // 年運（12年）に西暦・通変・十二運を反映（時期名/テーマ/数は固定）
 *              // kubo:true の年は「空亡」と自動表示（空亡＝2年。日柱の空亡支に当たる年）
 *    birthYear: 1990,                      // 任意。無ければ入力 year を使用
 *    nowAge: 45                            // 任意。現在の大運行をハイライト
 *  }
 *  ※干支セルは gan と shi を ganElement / shiElement で色分けします
 *    （五行カラー「あり」時のみ着色）。
 *
 *  例）
 *  // window.computeMeishiki = function(input){ ...ご自身の計算... ; return result; };
 * ============================================================ */
</script>

<script id="meishiki-render">
/* 命式レンダラ：教科書式（天干/地支ほか）＋縦横切替。エンジン出力(computeMeishiki)を写すだけ */
window.MEISHIKI=(function(){
  var PKEYS=['year','month','day','hour'];
  var PLABEL={year:'年柱',month:'月柱',day:'日柱',hour:'時柱'};
  var ATTRS=[
    {k:'tenkan',label:'天干',big:true},
    {k:'chishi',label:'地支',big:true},
    {k:'zct',label:'蔵干'},
    {k:'tenTsu',label:'天干通変'},
    {k:'chiTsu',label:'地支通変'},
    {k:'juni',label:'十二運'},
    {k:'kichi',label:'吉凶星'}
  ];
  var ELC={'木':'el-moku','火':'el-ka','土':'el-do','金':'el-kin','水':'el-sui'};
  var model={orient:'yoko',kubo:'',p:{}};
  function blank(){ return {tenkan:'',chishi:'',tenkanEl:'',chishiEl:'',zct:'',tenTsu:'',chiTsu:'',juni:'',kichi:''}; }
  PKEYS.forEach(function(k){ model.p[k]=blank(); });
  function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function cellHTML(pk,a){
    var d=model.p[pk], v=d[a.k]||'';
    if(a.k==='tenkan'||a.k==='chishi'){
      var el=(a.k==='tenkan'?d.tenkanEl:d.chishiEl);
      return '<span class="kanchar '+(ELC[el]||'')+'">'+esc(v)+'</span>';
    }
    return esc(v);
  }
  function render(){
    var m=document.getElementById('meishikiMount'); if(!m) return;
    var t='<table class="pillars ori-'+model.orient+'">';
    if(model.orient==='yoko'){
      t+='<thead><tr><th class="rowlbl">　</th>'+PKEYS.map(function(pk){return '<th'+(pk==='day'?' class="p-day"':'')+'>'+PLABEL[pk]+'</th>';}).join('')+'</tr></thead><tbody>';
      ATTRS.forEach(function(a){
        t+='<tr><td class="rowlbl">'+a.label+'</td>'+PKEYS.map(function(pk){
          return '<td class="v'+(a.big?' kbig':'')+(pk==='day'?' p-day':'')+'" data-p="'+pk+'" data-a="'+a.k+'" contenteditable="true">'+cellHTML(pk,a)+'</td>';
        }).join('')+'</tr>';
      });
      t+='</tbody>';
    }else{
      t+='<thead><tr><th class="rowlbl">　</th>'+ATTRS.map(function(a){return '<th>'+a.label+'</th>';}).join('')+'</tr></thead><tbody>';
      PKEYS.forEach(function(pk){
        t+='<tr'+(pk==='day'?' class="p-day"':'')+'><td class="rowlbl">'+PLABEL[pk]+'</td>'+ATTRS.map(function(a){
          return '<td class="v'+(a.big?' kbig':'')+'" data-p="'+pk+'" data-a="'+a.k+'" contenteditable="true">'+cellHTML(pk,a)+'</td>';
        }).join('')+'</tr>';
      });
      t+='</tbody>';
    }
    t+='</table>';
    m.innerHTML=t;
    m.querySelectorAll('td.v').forEach(function(td){
      td.addEventListener('input',function(){
        var pk=td.dataset.p,a=td.dataset.a,txt=td.textContent.trim();
        model.p[pk][a]=txt;
        if(a==='tenkan') model.p[pk].tenkanEl='';
        if(a==='chishi') model.p[pk].chishiEl='';
      });
    });
  }
  function setKubo(v){ model.kubo=v||''; var c=document.getElementById('kuboChip'); if(c) c.textContent=(v&&v!=='')?v:'　'; }
  function setOriBtns(){ var y=document.getElementById('oYoko'),t=document.getElementById('oTate'); if(y)y.setAttribute('aria-pressed',String(model.orient==='yoko')); if(t)t.setAttribute('aria-pressed',String(model.orient==='tate')); }
  return {
    init:function(){
      var y=document.getElementById('oYoko'),t=document.getElementById('oTate');
      if(y)y.addEventListener('click',function(){model.orient='yoko';setOriBtns();render();});
      if(t)t.addEventListener('click',function(){model.orient='tate';setOriBtns();render();});
      setOriBtns(); setKubo(''); render();
    },
    fill:function(r){
      PKEYS.forEach(function(pk){
        var p=(r.pillars&&r.pillars[pk])||{},d=model.p[pk];
        d.tenkan=p.gan||''; d.chishi=p.shi||'';
        d.tenkanEl=p.ganElement||''; d.chishiEl=p.shiElement||'';
        d.zct=p.zokan||'';   // 鑑定で使う代表の蔵干1つのみ（通変なし）
        d.tenTsu=(p.tsuhen==null?'—':p.tsuhen);
        d.chiTsu=p.zokanTsuhen||'';
        d.juni=p.junishi||'';
        d.kichi=p.kichi||'';   // 吉凶星(神殺)。エンジンが出力すれば自動表示、なければ記入用のまま
      });
      setKubo(r.tenchusatsu); render();
    },
    clear:function(){ PKEYS.forEach(function(pk){ model.p[pk]=blank(); }); setKubo(''); render(); }
  };
})();
</script>

<script>
(function(){
  var body = document.body;
  if(window.MEISHIKI) window.MEISHIKI.init();

  // ---- モチーフ ----
  function setMotif(name){
    var tpl = document.getElementById('m-'+name);
    if(!tpl) return;
    document.querySelectorAll('.corner').forEach(function(c){
      c.innerHTML=''; c.appendChild(tpl.content.cloneNode(true));
    });
    document.querySelectorAll('.motif').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.dataset.motif===name));
    });
  }
  document.querySelectorAll('.motif').forEach(function(b){
    b.addEventListener('click', function(){ setMotif(b.dataset.motif); });
  });
  setMotif('botanical');

  // ---- モード ----
  function setMode(mode){
    body.setAttribute('data-mode', mode);
    document.getElementById('mAuto').setAttribute('aria-pressed', String(mode==='auto'));
    document.getElementById('mBlank').setAttribute('aria-pressed', String(mode==='blank'));
    if(mode==='blank') clearSheet();
  }
  document.getElementById('mAuto').addEventListener('click', function(){ setMode('auto'); });
  document.getElementById('mBlank').addEventListener('click', function(){ setMode('blank'); });

  // ---- 五行カラー切替（既定：なし＝白黒） ----
  function setColor(on){
    body.setAttribute('data-color', on?'on':'off');
    document.getElementById('cOn').setAttribute('aria-pressed', String(on));
    document.getElementById('cOff').setAttribute('aria-pressed', String(!on));
  }
  document.getElementById('cOn').addEventListener('click', function(){ setColor(true); });
  document.getElementById('cOff').addEventListener('click', function(){ setColor(false); });
  setColor(false);

  // ---- 印刷 ----
  document.getElementById('printBtn').addEventListener('click', function(){ try{ window.print(); }catch(e){} });

  // ---- 命式セルの塗り分け・クリア ----
  var COLS = ['hour','day','month','year'];
  var ELMAP = {'木':'el-moku','火':'el-ka','土':'el-do','金':'el-kin','水':'el-sui'};
  var STEM_EL = {'甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水'};
  function setEl(id, text){ var e=document.getElementById(id); if(e) e.textContent = text==null?'':text; }
  function yy(v){ return v==='陽'||v==='+'||v==='＋' ? '＋' : (v==='陰'||v==='-'||v==='−'||v==='－' ? '－' : (v||'')); }

  function clearSheet(){
    if(window.MEISHIKI) window.MEISHIKI.clear();
    ['go-moku','go-ka','go-do','go-kin','go-sui','mk-moku','mk-ka','mk-do','mk-kin','mk-sui'].forEach(function(id){ setEl(id,''); });
    // 年運（12年）の 西暦・通変・十二運 をクリア
    var biob=document.getElementById('bioBody');
    if(biob){ Array.prototype.forEach.call(biob.rows, function(row){
      row.classList.remove('kubo');
      var yr=row.querySelector('.yr'); if(yr) yr.textContent='';
      var cvs=row.querySelectorAll('.cv'); if(cvs[0]) cvs[0].textContent=''; if(cvs[1]) cvs[1].textContent='';
    }); }
    document.getElementById('daiunBody').innerHTML = blankDaiunRows();
    document.getElementById('daiunDir').textContent = '順行';
    setEl('mName','　　　　　　様'); setEl('mBirth','　年　月　日　時　分 生'); setEl('mSex','　');
    renderShugo(null);
    setEl('kanteiDate','　年　月　日');
    updatePentagon();
  }

  // 五行の強弱（◎○△✕）を数から自動判定：0→✕ 1→△ 2→○ 3以上→◎
  function strFromCount(n){ n=+n; if(isNaN(n)) return ''; if(n<=0) return '✕'; if(n===1) return '△'; if(n===2) return '○'; return '◎'; }

  // 守護神を命式（エンジン出力）から自動表示。arr 無しなら空欄3つ（記入用）
  function renderShugo(arr){
    var wrap=document.getElementById('shugoWrap'); if(!wrap) return;
    var items=(arr && arr.length)?arr:['　','　','　'];
    wrap.innerHTML=items.map(function(v){ return '<span class="ed" contenteditable="true">'+(v==null||v===''?'　':v)+'</span>'; }).join(' ／ ');
  }

  // 五角形（五行）の数値を 五行バランス表から同期
  function updatePentagon(){
    [['go-moku','pent-moku'],['go-ka','pent-ka'],['go-do','pent-do'],['go-kin','pent-kin'],['go-sui','pent-sui']].forEach(function(pair){
      var src=document.getElementById(pair[0]), dst=document.getElementById(pair[1]);
      if(src&&dst){ dst.textContent = (src.textContent||'').trim(); }  // 表を鏡写し（記入用は空欄のまま）
    });
  }

  function blankDaiunRows(){
    var h='';
    for(var i=0;i<8;i++){ h+='<tr><td class="age ed" contenteditable="true"></td><td class="yr2 ed" contenteditable="true"></td><td class="ed" contenteditable="true"></td><td class="ed" contenteditable="true"></td><td class="ed" contenteditable="true"></td><td class="n ed" contenteditable="true"></td></tr>'; }
    return h;
  }

  function colorKanshi(id, gan, shi, ganEl, shiEl){
    var e=document.getElementById(id); if(!e) return;
    e.innerHTML='';
    var s1=document.createElement('span'); s1.textContent=gan||''; if(ELMAP[ganEl]) s1.className=ELMAP[ganEl];
    var s2=document.createElement('span'); s2.textContent=shi||''; if(ELMAP[shiEl]) s2.className=ELMAP[shiEl];
    e.appendChild(s1); e.appendChild(s2);
  }
  function elClass(id, elName){ var e=document.getElementById(id); if(!e) return; e.className=e.className.replace(/\bel-\w+\b/g,'').trim(); if(ELMAP[elName]) e.classList.add(ELMAP[elName]); }

  // ---- 自動計算 → 反映 ----
  function fillFromResult(r){
    if(window.MEISHIKI) window.MEISHIKI.fill(r);
    (function(){ var d=new Date(); setEl('kanteiDate', d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'); })();
    // 守護神（命式から自動）：r.shugojin = ["丁","癸","丙"] など
    renderShugo(r.shugojin);
    // 五行バランス（数＋強弱を命式から）
    if(r.gogyoCount){
      var gs = r.gogyoStrength||{};
      [['木','moku'],['火','ka'],['土','do'],['金','kin'],['水','sui']].forEach(function(pr){
        var el=pr[0], key=pr[1], cnt=r.gogyoCount[el];
        setEl('go-'+key, cnt);
        setEl('mk-'+key, gs[el]!=null ? gs[el] : strFromCount(cnt));
      });
    }
    updatePentagon();
    // 年運（12年）— r.nenun = [{year, tsuhen, junishi}, … 12件]（エンジンから西暦を反映）
    if(Array.isArray(r.nenun)){
      var biob=document.getElementById('bioBody');
      if(biob){ Array.prototype.forEach.call(biob.rows, function(row,i){
        var u=r.nenun[i];
        row.classList.toggle('kubo', !!(u && u.kubo));
        if(!u) return;
        var yr=row.querySelector('.yr'); if(yr && u.year!=null) yr.textContent=u.year;
        var cvs=row.querySelectorAll('.cv');
        if(cvs[0] && u.tsuhen!=null) cvs[0].textContent=u.tsuhen;
        if(cvs[1] && u.junishi!=null) cvs[1].textContent=u.junishi;
      }); }
    }
    // 大運（年齢＋西暦）
    if(r.direction) document.getElementById('daiunDir').textContent = r.direction;
    if(Array.isArray(r.daiun)){
      var tb=document.getElementById('daiunBody'); tb.innerHTML='';
      var nowAge = r.nowAge, by = r.birthYear;
      r.daiun.forEach(function(d){
        var tr=document.createElement('tr');
        if(nowAge!=null && nowAge>=d.ageFrom && nowAge<d.ageTo) tr.className='now';
        var sy = d.startYear!=null ? d.startYear : (by!=null ? by + d.ageFrom : null);
        var ey = d.endYear!=null ? d.endYear : (by!=null ? by + d.ageTo : null);
        var seireki = (sy!=null && ey!=null) ? (sy+'〜'+ey) : '';
        tr.innerHTML='<td class="age ed" contenteditable="true">'+d.ageFrom+'才〜'+d.ageTo+'才</td>'+
          '<td class="yr2 ed" contenteditable="true">'+seireki+'</td>'+
          '<td class="ed" contenteditable="true">'+(d.kanshi||'')+'</td>'+
          '<td class="ed" contenteditable="true">'+(d.tsuhen||'')+'</td>'+
          '<td class="ed" contenteditable="true">'+(d.junishi||'')+'</td>'+
          '<td class="n ed" contenteditable="true">'+(d.num!=null?d.num:'')+'</td>';
        tb.appendChild(tr);
      });
    }
  }

  // ---- フォーム ----
  document.getElementById('calcForm').addEventListener('submit', function(ev){
    ev.preventDefault();
    var msg=document.getElementById('calcMsg'); msg.textContent='';
    if(typeof window.computeMeishiki!=='function'){
      msg.textContent='自動計算にはご自身の計算エンジン（window.computeMeishiki）の接続が必要です。未接続の場合は「記入用」でご入力ください。'; return;
    }
    var y=+document.getElementById('iY').value, m=+document.getElementById('iM').value, d=+document.getElementById('iD').value;
    var h=+document.getElementById('iH').value, mn=+document.getElementById('iMin').value;
    var sex=document.getElementById('iSex').value;
    try{
      var r=window.computeMeishiki({year:y,month:m,day:d,hour:h,minute:mn,sex:sex});
      r.nowAge = (new Date()).getFullYear() - y;
      if(r.birthYear==null) r.birthYear = y;   // 大運の西暦計算に使用
      fillFromResult(r);
      setEl('mBirth','西暦'+y+'年'+m+'月'+d+'日 '+h+'時'+mn+'分 生');
      setEl('mSex', sex==='female'?'女性':'男性');
      setMode('auto');
    }catch(e){ msg.textContent='計算エラー：入力値をご確認ください。'; console.error(e); }
  });

  // 五行バランスを手入力したら五角形も更新
  ['go-moku','go-ka','go-do','go-kin','go-sui'].forEach(function(id){
    var e=document.getElementById(id); if(e) e.addEventListener('input', updatePentagon);
  });

  // 初期表示：記入用（空欄）。自前エンジンを接続後、「自動計算」で［鑑定する］。
  setMode('blank');
})();
</script>
