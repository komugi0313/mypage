<!doctype html><html lang="ja"><head><meta charset="utf-8">
<!-- アイ・シンクのアイコンの元（1024×1024）。角まで絵で埋めた正方形（iPhone・Android が自分で丸く切る）。
     作り直すときは、この画面を 1024×1024 で撮って icon-1024.png にし、512・192・180（apple-touch-icon）・32（favicon）に縮める。index.html のアイコンの ?v= を1つ上げる -->
<style>
html,body{margin:0;width:1024px;height:1024px;overflow:hidden}
body{background:linear-gradient(180deg,#5E5FA8 0%,#9A86C4 40%,#E3B3C8 75%,#F7D9C9 100%);display:grid;place-items:center}
.ring{width:620px;height:620px;border-radius:50%;background:conic-gradient(from 200deg,#8FE3CF,#A9B2F5,#F4B6D6,#8FE3CF);
  -webkit-mask:radial-gradient(circle closest-side,transparent 61%,#000 62%);mask:radial-gradient(circle closest-side,transparent 61%,#000 62%);filter:drop-shadow(0 0 40px rgba(255,255,255,.7))}
</style></head><body><div class="ring"></div></body></html>
