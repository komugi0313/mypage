<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>アイ・シンク（I-Sync）｜わたしとあなたの、重なるところ。2択で答え合わせ（無料・みんなで遊べる）</title>
<meta name="description" content="2択に答えて、恋人・友だち・家族と答え合わせ。LINEは毎日ほしい？ 朝ごはんはごはん？パン？ ゆずれないことと、合わせられることがわかる。ひとりでも、その場のみんなでも、離れていても遊べる無料ゲーム。婚活パーティー・街コンでも、QRを読むだけで2〜10人がその場で遊べます（アプリ不要）。">
<link rel="canonical" href="https://i-sync.jp/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="アイ・シンク（I-Sync）">
<meta property="og:title" content="アイ・シンク（I-Sync）｜わたしとあなたの、重なるところ">
<meta property="og:description" content="2択に答えて、恋人・友だち・家族と答え合わせ。LINEは毎日ほしい？ 朝ごはんはごはん？パン？ ゆずれないことと、合わせられることがわかる。ひとりでも、その場のみんなでも、離れていても遊べる無料ゲーム。婚活パーティー・街コンでも、QRを読むだけで2〜10人がその場で遊べます（アプリ不要）。">
<meta property="og:url" content="https://i-sync.jp/">
<meta property="og:image" content="https://i-sync.jp/og-image.png?v=5">

<link rel="apple-touch-icon" href="apple-touch-icon.png?v=5">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="アイ・シンク">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 夕暮れの空（マジックアワー：紫→ラベンダー→ピンク→ピーチ）。白いカードに濃い紫の文字で読みやすく。題名は丸い英字「I-Sync」＋小さなカタカナ、帯は上下の線、ロゴはオーロラ色の輪 */
:root{
  --sky1:#5E5FA8; --sky2:#9A86C4; --sky3:#E3B3C8; --sky4:#F7D9C9; --sky5:#FBEFEA;
  --paper:#FFFFFF; --paper2:#FBFAFF; --field:#F6F4FD;
  --ink:#2A2559; --sub:#4E4878; --line:#E2DDF5; --deep:#4B3C8F;
  --a:#8FE3CF; --b:#F4B6D6; --gold:#FFF1C9; --lav:#A9B2F5;
  --a-soft:#E3F7F2; --b-soft:#FCE7F1; --gold-soft:#FFF6DC;
  --on-light:#2A2559;
  --aurora:linear-gradient(90deg,#8FE3CF,#A9B2F5 50%,#F4B6D6);
  --f-title:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --f-logo:"Quicksand","Hiragino Maru Gothic ProN","Zen Maru Gothic",sans-serif;
  --f-round:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--sky5)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;min-height:100vh;
  background:linear-gradient(180deg,var(--sky1) 0px,var(--sky2) 260px,var(--sky3) 560px,var(--sky4) 860px,var(--sky5) 1200px);
  background-repeat:no-repeat;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.scr{display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.35}
p{margin:0}
/* 題名（夕暮れの空の上なので文字は白） */
.brand{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding-top:10px}
.orb{width:84px;height:84px;border-radius:50%;background:conic-gradient(from 200deg,#8FE3CF,#A9B2F5,#F4B6D6,#8FE3CF);
  -webkit-mask:radial-gradient(circle closest-side,transparent 61%,#000 62%);mask:radial-gradient(circle closest-side,transparent 61%,#000 62%);filter:drop-shadow(0 0 12px rgba(255,255,255,.5))}
/* キャラクター（アイ＝ミント・ユウ＝ピンク） */
.chara{display:block;height:auto;max-width:100%;pointer-events:none;user-select:none;-webkit-user-drag:none}
.chara.c-mid{width:200px;margin:0 auto}
.chara.c-lobby{width:180px;margin:0 auto -8px}
.chara.c-solo{width:120px;margin:0 auto 4px}
.ask{position:relative;margin-top:44px}
.chara.c-ask{position:absolute;right:8px;top:-62px;width:124px}
.ask .qhead{padding-right:100px}
/* トップの、ふわふわ浮かぶシャボン玉（キャラクターと同じミント・ピンク・ラベンダー） */
.brand{position:relative}
.brand>*:not(.bubbles){position:relative;z-index:1}
.bubbles{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden;margin:0 -16px}
.bubbles i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;
  background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.12) 0,rgba(var(--c),.10) 60%,rgba(var(--c),.32) 100%);
  box-shadow:0 0 calc(var(--s)*.25) rgba(var(--c),.22),inset 0 0 calc(var(--s)*.12) rgba(255,255,255,.3);opacity:.75;
  animation:bub var(--t) ease-in-out var(--d) infinite alternate}
/* 虹色のふち（キャラクターと同じオーロラ色） */
.bubbles i::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 210deg,#8FE3CF,#A9B2F5,#F4B6D6,#FFF1C9,#8FE3CF);
  -webkit-mask:radial-gradient(circle closest-side,transparent 90%,#000 94%);mask:radial-gradient(circle closest-side,transparent 90%,#000 94%);opacity:.55}
/* 左上の白い光（キャラクターと同じ、細長い反射と小さな点） */
.bubbles i::after{content:"";position:absolute;left:18%;top:14%;width:42%;height:20%;border-radius:50%;
  background:rgba(255,255,255,.8);transform:rotate(-32deg);
  box-shadow:calc(var(--s)*-.06) calc(var(--s)*.2) 0 calc(var(--s)*-.06) rgba(255,255,255,.7)}
.bubbles i.m{--c:143,227,207}.bubbles i.p{--c:244,182,214}.bubbles i.l{--c:169,178,245}
@keyframes bub{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6px,-14px) scale(1.04)}100%{transform:translate(-4px,-26px) scale(.97)}}
@media (prefers-reduced-motion:reduce){.bubbles i{animation:none}}
.brand .logo{font-family:var(--f-logo);font-weight:700;font-size:56px;line-height:1.05;letter-spacing:.02em;color:#FFFFFF;text-shadow:0 3px 14px rgba(75,60,143,.45);white-space:nowrap}
.brand .kana{font-family:var(--f-round);font-weight:700;font-size:14px;letter-spacing:.3em;color:#FFFFFF;margin-top:-4px;white-space:nowrap}
.brand .tl{font-family:var(--f-round);font-weight:700;font-size:15px;color:#FFFFFF;border-top:1.5px solid rgba(255,255,255,.75);border-bottom:1.5px solid rgba(255,255,255,.75);padding:4px 12px;white-space:nowrap;text-shadow:0 1px 6px rgba(42,37,89,.3)}
.brand .lead{color:#FFFFFF;font-size:15px;font-weight:700;text-shadow:0 1px 6px rgba(42,37,89,.35)}
/* カード・文字 */
.card{background:var(--paper);border:none;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 24px rgba(60,40,110,.16)}
.label{font-family:var(--f-round);font-weight:900;font-size:18px;color:var(--ink)}
.hint{color:var(--sub);font-size:14px}
/* トップの「どんな診断？」 */
.intro{gap:10px}
.intro .ex{background:#F6F4FC;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.intro .exq{font-family:var(--f-round);font-weight:900;font-size:18px;color:var(--ink)}
.intro .exo{display:flex;flex-direction:column;gap:6px}
.intro .exo span{border-radius:12px;padding:6px 12px;font-weight:700;font-size:15px;color:var(--ink);border:2px solid}
.intro .exo .o0{background:#E6F8F2;border-color:#3FA98F}.intro .exo .o1{background:#FDEBF4;border-color:#D46FA3}.intro .exo .o2{background:#F1EEFA;border-color:#9C93C8;text-align:center}
.know{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.know li{display:flex;flex-direction:column;padding-left:14px;border-left:4px solid #A9B2F5}
.know b{font-family:var(--f-round);font-weight:900;font-size:16px;color:var(--deep)}
.know span{font-size:14px;color:var(--sub)}
.note{font-size:13px;color:var(--sub);text-align:center}
.sub{font-family:var(--f-round);font-weight:900;font-size:16px;color:var(--deep);margin-top:6px}
.stack{display:flex;flex-direction:column;gap:12px}
/* 選ぶボタン */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips.c2{grid-template-columns:1fr 1fr}
.chip{min-height:52px;border:2px solid #BFB6E2;background:#FFFFFF;border-radius:14px;color:var(--ink);border-radius:12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:6px 4px;line-height:1.35}
.chip small{display:block;font-size:12px;font-weight:700;color:var(--sub)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#FFFFFF}
.chip[aria-pressed="true"] small{color:#E9E4FF}
/* 入力 */
.one-name,.join label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--sub)}
.join{display:flex;flex-direction:column;gap:4px}
.join-row{display:flex;gap:8px}
.join-row input{flex:1;min-width:0}
#code{font-variant-numeric:tabular-nums}
#code:not(:placeholder-shown){letter-spacing:.2em}
.join-row .btn{flex:0 0 auto}
input[type=text]{font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid #BFB6E2;background:var(--field);color:var(--ink);min-height:46px;width:100%}
input[type=text]::placeholder{color:#8A83AE}
.err{color:#B0336F;font-weight:700;font-size:14px}
.err:empty{display:none}
/* ボタン */
.btn{min-height:52px;border:none;border-radius:99px;font-family:var(--f-round);font-weight:900;font-size:17px;cursor:pointer;padding:10px 18px;background:var(--ink);color:var(--gold)}
.btn.ghost{background:#FFFFFF;color:var(--ink);border:2px solid #BFB6E2}
.btn.small{min-height:44px;font-size:15px}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,.star:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}
/* 札 */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;align-self:flex-start;background:#EDE8FB;color:var(--deep)}
.catg{color:var(--on-light)}
.catg.c0{background:#FAD0E4}.catg.c1{background:#D9DEFF}.catg.c2{background:#FFDDC4}.catg.c3{background:#FFF0C2}.catg.c4{background:#CDF3E8}.catg.c5{background:#E6DBFF}.catg.c6{background:#FFC9DD}
.if{align-self:flex-start;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:#F3EEFF;color:var(--deep)}
/* 問題の画面 */
.prog{display:flex;gap:4px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--deep)}
.timer{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--aurora);transition:width .25s linear}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.qn{font-size:13px;color:var(--sub);font-weight:700;flex:1}
.sec{font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right;line-height:1;color:var(--ink)}
.sec.hurry{color:#B0336F}
.q{font-family:var(--f-round);font-size:23px;font-weight:900;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:72px;border-radius:18px;border:2.5px solid #BFB6E2;background:#FFFFFF;color:var(--ink);font:inherit;font-size:19px;font-weight:700;box-shadow:0 3px 0 rgba(75,60,143,.18);cursor:pointer;padding:12px 16px;text-align:left;display:flex;align-items:center;gap:12px}
.opt .k{flex:0 0 38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:900;color:var(--on-light);border:2px solid var(--ink)}
.opt[data-v="0"]{border-color:#3FA98F;background:#E6F8F2}.opt[data-v="0"] .k{background:var(--a)}
.opt[data-v="1"]{border-color:#D46FA3;background:#FDEBF4}.opt[data-v="1"] .k{background:var(--b)}
.opt.mid{min-height:54px;font-size:16px;justify-content:center;border-color:#9C93C8;color:var(--ink);background:#F1EEFA;box-shadow:none}
.star{align-self:flex-start;min-height:44px;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--sub);font:inherit;font-weight:700;font-size:14px;padding:6px 14px;cursor:pointer}
.star[aria-pressed="true"]{background:#FFE8A3;border-color:#D9AE2E;color:#5A4300}
.match{background:var(--a-soft);color:#1F6E5B;border-radius:12px;padding:10px 12px;font-weight:700;text-align:center}
/* 渡す・待つ・部屋 */
.hand{text-align:center;align-items:center;padding:30px 18px}
.hand .big{font-size:26px;font-weight:700}
.cap{font-size:13px;color:var(--sub);font-weight:700}
.code{font-family:var(--f-title);font-size:46px;letter-spacing:.15em;font-variant-numeric:tabular-nums;line-height:1;color:var(--deep)}
.qr{background:#FFFFFF;padding:10px;border-radius:12px;line-height:0}
.qr:empty{display:none}
.who{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.lobby-head{display:flex;justify-content:space-between;align-items:baseline}
.cnt{font-weight:700;font-variant-numeric:tabular-nums;color:var(--deep)}
.members{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.members li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--paper2);min-height:44px}
.members li b{font-size:13px;color:var(--sub);white-space:nowrap}
.members li.ok{background:var(--a-soft)}
.members li.ok b{color:#1F6E5B}
.status{font-weight:700;text-align:center;color:var(--sub)}
.status.go{color:#1F6E5B;font-size:18px}
.cd{font-family:var(--f-title);font-size:96px;line-height:1;font-variant-numeric:tabular-nums;color:var(--deep)}
@media (prefers-reduced-motion: no-preference){.cd{animation:pop .8s ease-out}@keyframes pop{from{transform:scale(1.4);opacity:.4}to{transform:none;opacity:1}}}
/* 結果 */
.score{text-align:center;align-items:center;gap:4px;padding:24px 18px}
.ring{width:170px;height:170px;border-radius:50%;display:grid;place-items:center}
.ring .in{width:136px;height:136px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.ring .num{font-weight:700;font-size:44px;font-variant-numeric:tabular-nums;line-height:1;color:var(--ink)}
.ring .num small{font-size:20px}
.score .cap{font-size:15px;color:var(--ink)}
.score .hint{color:var(--ink);font-size:15px}
.score .msg{font-family:var(--f-round);font-weight:900;font-size:20px;margin-top:6px;color:var(--deep)}
.titles,.pairs,.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.titles li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;padding:12px 14px;border-radius:14px;background:#F3F0FC;border:1.5px solid #DDD6F3}
.titles span{font-weight:700;font-size:16px}
.titles b{font-family:var(--f-round);font-weight:900;font-size:18px;color:var(--deep)}
.titles small{grid-column:1/-1;color:var(--sub);font-size:14px}
.pair{padding:14px;border-radius:14px;background:#F3F0FC;border:1.5px solid #DDD6F3;display:flex;flex-direction:column;gap:8px}
.pair .hint{color:var(--ink)}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ph b{font-size:17px}
.ph em{font-style:normal;font-weight:900;font-size:26px;font-family:var(--f-round);color:var(--deep);font-variant-numeric:tabular-nums}
.nos{display:flex;flex-wrap:wrap;gap:6px}
.nos span{background:#F1EEFA;border:1.5px solid #C9C0EA;border-radius:999px;padding:2px 10px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.rvbox{display:flex;flex-direction:column;gap:8px}
.bar{height:12px;border-radius:6px;background:#E2DDF5;overflow:hidden;border:1.5px solid #CFC7EC}
.bar i{display:block;height:100%;background:var(--aurora)}
/* ★ゆずれないところ（2人のぴったり度の中） */
.starbox{background:#FFFFFF;border:2px solid #E2B93B;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.starbox .sh{font-family:var(--f-round);font-weight:900;font-size:16px;color:#6B4E00}
.starbox .sc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.starbox .sc span{border-radius:10px;padding:4px 2px;font-size:13px;white-space:nowrap;letter-spacing:-.02em;font-weight:700;color:var(--ink);border:2px solid}
.starbox .sc b{display:block;font-size:20px;line-height:1.2}
.starbox .s0{background:#E6F8F2;border-color:#3FA98F}.starbox .s2{background:#F1EEFA;border-color:#9C93C8}.starbox .s1{background:#FDEBF4;border-color:#D46FA3}
.slist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.slist li{border-left:5px solid;border-radius:6px;padding:4px 10px;display:flex;flex-direction:column;font-size:14px;color:var(--ink);background:#FAF9FE}
.slist li b{font-size:15px}
.slist .who{display:flex;gap:8px;align-items:baseline;justify-content:flex-start;text-align:left;width:100%}
.slist .who em{font-style:normal;font-weight:700;font-size:13px;color:var(--sub);white-space:nowrap;flex:0 0 auto;min-width:3.5em}
.sfold summary{cursor:pointer;font-weight:700;font-size:14px;color:#1F6E5B;padding:6px 0;min-height:44px;display:flex;align-items:center}
.sfold[open] summary{margin-bottom:6px}
.slist li.d{border-color:#D46FA3}.slist li.m{border-color:#9C93C8}.slist li.s{border-color:#3FA98F}
.good{color:#1F6E5B;font-weight:700;font-size:15px;background:var(--a-soft);border-radius:10px;padding:6px 10px}
.warn{color:#9C2A61;font-weight:700;font-size:15px;background:var(--b-soft);border-radius:10px;padding:6px 10px}
.list li{padding:12px 14px;border-radius:14px;background:#F6F4FC;border:1.5px solid #E2DDF5;font-size:16px;font-weight:700;display:flex;flex-direction:column;gap:4px}
.list li b{display:block;font-size:14px;color:var(--sub);font-weight:700}
.ponder{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:14px;background:var(--b-soft);border:1.5px solid #EBB0CF}
.ponder b{font-size:17px}
.ponder em{font-style:normal;font-weight:700;font-size:24px;color:#B0336F;font-variant-numeric:tabular-nums}
.ansrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700}
.ansrow i{font-style:normal;font-size:14px;font-weight:700;padding:2px 12px;border-radius:99px;border:1.5px solid transparent}
.ansrow i.o0{background:var(--a);color:var(--on-light)}.ansrow i.o1{background:var(--b);color:var(--on-light)}.ansrow i.o0{border-color:#3FA98F}.ansrow i.o1{border-color:#D46FA3}.ansrow i.o2{border:1.5px solid #9C93C8;background:#F1EEFA;color:var(--ink)}
details summary{cursor:pointer;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:8px;list-style:none;border:2px solid #BFB6E2;border-radius:16px;padding:10px 16px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"開く ▾";font-family:var(--f-body);font-size:14px;font-weight:700;color:var(--deep)}
details[open] summary::after{content:"閉じる ▴"}
details[open] summary{margin-bottom:12px}
.tori{display:flex;flex-direction:column;gap:6px}
.tori ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:16px;font-weight:700}
/* メインサービスの紹介（外へ出るリンクとわかるように） */

      '<div style="margin-top:6px;background:#F4F5FF;border-radius:10px;padding:8px 10px">'+(ios?'<b>iPhone</b>：画面の右下か右上の <b>共有ボタン</b>（□に↑）や <b>「…」</b> →「<b>Safariで開く</b>」<br><span style="font-weight:700;color:#4A4458">共有ボタンの中の「プリント」からも印刷・PDF保存できます</span>':'<b>Android</b>：右上の <b>「︙」</b> →「<b>ブラウザで開く</b>」（Chromeで開く）')+'</div>'+
      (karte?'<div style="margin-top:6px;font-size:13px;color:#4A4458">鑑定は顧客カルテに保存されています。ブラウザで開いたあと、顧客カルテから開けます。</div>':'')+
      '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">'+(u?'<button type="button" data-a="copy" style="flex:1 1 160px;min-height:44px;border:0;border-radius:12px;background:#4F46E5;color:#fff;font:inherit;font-weight:900;cursor:pointer">このページのリンクをコピー</button>':'')+'<button type="button" data-a="close" style="flex:0 0 auto;min-height:44px;padding:0 16px;border:1.5px solid #C9CDF5;border-radius:12px;background:#fff;color:#3730A3;font:inherit;font-weight:900;cursor:pointer">閉じる</button></div>';
    d.addEventListener('click',function(e){ var b=e.target.closest&&e.target.closest('button'); if(!b) return; if(b.dataset.a==='close'){ d.remove(); return; }

    (document.body||document.documentElement).appendChild(d); }catch(e){} }
