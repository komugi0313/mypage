<!doctype html><html lang="ja"><head><meta charset="utf-8">
<!-- シェアしたときの画像の元（1200×630）。作り直すときはこの画面を撮って og-image.png にし、index.html の og:image の ?v= を1つ上げる -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&family=Zen+Maru+Gothic:wght@700;900&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:"Zen Kaku Gothic New",sans-serif;color:#2A2559;display:grid;grid-template-columns:1fr 510px;align-items:center;gap:30px;padding:0 60px;box-sizing:border-box;
 background:linear-gradient(160deg,#5E5FA8 0%,#9A86C4 40%,#E3B3C8 75%,#F7D9C9 100%)}
.l{display:flex;flex-direction:column;align-items:center;gap:16px}
.ring{width:110px;height:110px;border-radius:50%;background:conic-gradient(from 200deg,#8FE3CF,#A9B2F5,#F4B6D6,#8FE3CF);-webkit-mask:radial-gradient(circle closest-side,transparent 61%,#000 62%);mask:radial-gradient(circle closest-side,transparent 61%,#000 62%);filter:drop-shadow(0 0 14px rgba(255,255,255,.7))}
h1{font-family:"Quicksand",sans-serif;font-weight:700;font-size:124px;letter-spacing:.02em;line-height:1;margin:0;color:#fff;text-shadow:0 6px 24px rgba(75,60,143,.5)}
.kana{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:28px;letter-spacing:.3em;color:#fff;margin-top:-6px}
.rb{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:30px;color:#fff;border-top:3px solid rgba(255,255,255,.8);border-bottom:3px solid rgba(255,255,255,.8);padding:8px 20px;white-space:nowrap;text-shadow:0 1px 8px rgba(42,37,89,.3)}
p{font-size:26px;font-weight:700;margin:0;color:#fff;text-shadow:0 1px 8px rgba(42,37,89,.4)}
.card{background:#fff;border-radius:30px;padding:30px;display:flex;flex-direction:column;gap:14px;box-shadow:0 14px 40px rgba(60,40,110,.25)}
.tag{align-self:flex-start;background:#FAD0E4;color:#2A2559;font-weight:700;font-size:22px;padding:4px 16px;border-radius:99px}
.q{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:40px}
.o{border:3px solid #BFB6E2;background:#fff;border-radius:22px;padding:14px 18px;font-size:27px;font-weight:700;display:flex;gap:14px;align-items:center;white-space:nowrap}
.o b{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:#2A2559;border:2.5px solid #2A2559}
.o.a{border-color:#3FA98F;background:#E6F8F2}.o.a b{background:#8FE3CF}.o.b{border-color:#D46FA3;background:#FDEBF4}.o.b b{background:#F4B6D6}
.o.m{border-color:#9C93C8;background:#F1EEFA;justify-content:center;color:#2A2559;font-size:24px}
</style></head><body>
<div class="l"><div class="ring"></div><h1>I-Sync</h1><div class="kana">アイ・シンク</div><div class="rb">わたしとあなたの、重なるところ</div><p>2択に答えて、答え合わせ。</p></div>
<div class="card"><span class="tag">恋愛・連絡</span><div class="q">LINEは？</div>
<div class="o a"><b>A</b>毎日やりとりしたい</div><div class="o b"><b>B</b>用があるときだけでいい</div><div class="o m">こだわらない</div></div>
</body></html>
