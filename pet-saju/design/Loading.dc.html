<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
  <style>
    body{margin:0;background:#efe9df;color:#2b2723;font-family:"Zen Maru Gothic",system-ui,"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;-webkit-font-smoothing:antialiased;}
    *{box-sizing:border-box;}
    .phone{width:390px;min-height:640px;margin:0 auto;background:linear-gradient(180deg,#faf3e9,#f3e6d4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:30px;}
    .wf-label{position:absolute;top:16px;left:18px;font-size:11px;font-weight:700;letter-spacing:.06em;color:#c2ab8c;text-transform:uppercase;}
    @keyframes spin{to{transform:rotate(360deg);}}
    @keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}
  </style>
</helmet>
<div class="phone" style="position:relative;">
  <div class="wf-label">⑤ 診断中</div>

  <div style="position:relative;width:130px;height:130px;display:flex;align-items:center;justify-content:center;">
    <svg width="130" height="130" viewBox="0 0 50 50" style="animation:spin 1.6s linear infinite;"><circle cx="25" cy="25" r="21" fill="none" stroke="#e6d3ba" stroke-width="4"/><path d="M25 4a21 21 0 0 1 21 21" fill="none" stroke="#c8763b" stroke-width="4" stroke-linecap="round"/></svg>
    <svg width="48" height="48" viewBox="0 0 24 24" fill="#c8763b" style="position:absolute;"><circle cx="7" cy="8" r="2.1"/><circle cx="12" cy="6.4" r="2.2"/><circle cx="17" cy="8" r="2.1"/><ellipse cx="12" cy="16" rx="5" ry="4.2"/></svg>
  </div>

  <div style="text-align:center;display:flex;flex-direction:column;gap:8px;">
    <div style="font-size:20px;font-weight:900;">命式を読み解いています…</div>
    <div style="font-size:13px;color:#8a7f72;line-height:1.7;">日干・通変星・五行バランスから<br>その子の16タイプを計算中</div>
  </div>

  <div style="display:flex;gap:8px;">
    <span style="width:9px;height:9px;border-radius:50%;background:#c8763b;animation:pulse 1.2s infinite;"></span>
    <span style="width:9px;height:9px;border-radius:50%;background:#c8763b;animation:pulse 1.2s infinite .2s;"></span>
    <span style="width:9px;height:9px;border-radius:50%;background:#c8763b;animation:pulse 1.2s infinite .4s;"></span>
  </div>
</div>
</x-dc>
</body>
</html>
