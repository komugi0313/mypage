<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
  <style>
    body{margin:0;background:#efe9df;color:#2b2723;font-family:"Zen Maru Gothic",system-ui,"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:#c8763b;} a:hover{color:#a85d29;}
    *{box-sizing:border-box;}
    .phone{width:390px;min-height:940px;margin:0 auto;background:#faf8f4;display:flex;flex-direction:column;}
    .wf-label{font-size:11px;font-weight:700;letter-spacing:.06em;color:#b4a894;text-transform:uppercase;}
    .field{display:flex;flex-direction:column;gap:7px;}
    .flabel{font-size:12.5px;font-weight:700;color:#5a5149;}
    .input{height:48px;border:1.5px solid #e0d6c6;border-radius:12px;background:#fff;display:flex;align-items:center;padding:0 14px;color:#b2a695;font-size:13px;}
    .seg{display:flex;gap:8px;}
    .chip{flex-grow:1;height:44px;border-radius:11px;border:1.5px solid #e0d6c6;background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#8a7f72;}
    .chip.on{background:#c8763b;color:#fff;border-color:#c8763b;}
    .btn-primary{height:54px;border-radius:14px;background:#c8763b;color:#fff;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;}
    .dash{border:1.5px dashed #c3b8a6;background:#ece7de;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#9b8f7d;font-size:12px;font-weight:700;}
  </style>
</helmet>
<div class="phone">
  <div style="display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #eadfce;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a7f72" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
    <span style="font-weight:900;font-size:14px;">もどる</span>
  </div>

  <div style="padding:22px 18px;display:flex;flex-direction:column;gap:18px;flex-grow:1;">
    <div class="wf-label">③ 入力A（誕生日あり）</div>
    <div style="font-size:19px;font-weight:900;">その子のことを教えてね</div>

    <!-- 写真 -->
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="dash" style="width:74px;height:74px;border-radius:50%;flex-shrink:0;flex-direction:column;">＋<span style="font-size:9px;">写真</span></div>
      <div style="font-size:11.5px;color:#8a7f72;line-height:1.6;">写真は任意。結果カードに使われます（SNSでシェアするときに映えます）</div>
    </div>

    <div class="field">
      <div class="flabel">お名前</div>
      <div class="input">例）むぎ</div>
    </div>

    <div class="field">
      <div class="flabel">動物の種類</div>
      <div class="seg"><div class="chip on">犬</div><div class="chip">猫</div><div class="chip">その他</div></div>
    </div>

    <div class="field">
      <div class="flabel">生年月日</div>
      <div class="seg">
        <div class="input" style="flex-grow:1;">2022年</div>
        <div class="input" style="width:80px;">5月</div>
        <div class="input" style="width:80px;">14日</div>
      </div>
    </div>

    <div class="field">
      <div class="flabel">生まれた時刻（任意）</div>
      <div class="input">わからない場合は空欄でOK（3柱で鑑定）</div>
      <div style="font-size:10.5px;color:#a89c8c;">※ 既存の四柱推命エンジンと同じく、時刻不明なら時柱を使わず年月日の3柱で判定します。</div>
    </div>

    <div style="margin-top:8px;"><div class="btn-primary">この子を占う</div></div>
  </div>
</div>
</x-dc>
</body>
</html>
