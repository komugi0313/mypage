<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
  <style>
    body{margin:0;background:#efe9df;color:#2b2723;font-family:"Zen Maru Gothic",system-ui,"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:#c8763b;} a:hover{color:#a85d29;}
    *{box-sizing:border-box;}
    .phone{width:390px;min-height:760px;margin:0 auto;background:#faf8f4;display:flex;flex-direction:column;}
    .wf-label{font-size:11px;font-weight:700;letter-spacing:.06em;color:#b4a894;text-transform:uppercase;}
    .choice{background:#fff;border:1.5px solid #e6ddcf;border-radius:16px;padding:18px;display:flex;align-items:center;gap:14px;}
    .ico{width:46px;height:46px;border-radius:12px;background:#f1e3d5;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  </style>
</helmet>
<div class="phone">
  <div style="display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #eadfce;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a7f72" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
    <span style="font-weight:900;font-size:14px;">もどる</span>
  </div>

  <div style="padding:24px 18px;display:flex;flex-direction:column;gap:20px;flex-grow:1;">
    <div class="wf-label">② 入口分岐</div>

    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="font-size:21px;font-weight:900;line-height:1.4;">その子のお誕生日、<br>わかりますか？</div>
      <div style="font-size:13px;color:#6f655a;line-height:1.7;">わかる日を選んでください。<br>どれを選んでも、同じ16タイプで診断できます。</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:13px;">
      <!-- A -->
      <div class="choice">
        <div class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#c8763b" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg></div>
        <div style="flex-grow:1;">
          <div style="font-weight:900;font-size:15px;">正確な誕生日がわかる</div>
          <div style="font-size:11.5px;color:#8a7f72;margin-top:3px;">年月日（＋時刻は任意）で四柱推命を立てます</div>
        </div>
        <span style="color:#c3b8a6;font-size:20px;">›</span>
      </div>

      <!-- B -->
      <div class="choice">
        <div class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#c8763b" stroke-width="1.8"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="5"/></svg></div>
        <div style="flex-grow:1;">
          <div style="font-weight:900;font-size:15px;">お迎えした日で占う</div>
          <div style="font-size:11.5px;color:#8a7f72;margin-top:3px;">“家族になった日”を運命の起点に（保護っ子に◎）</div>
        </div>
        <span style="color:#c3b8a6;font-size:20px;">›</span>
      </div>

      <!-- C -->
      <div class="choice" style="border-color:#e4cdb4;background:#fdf6ee;">
        <div class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#c8763b" stroke-width="1.8"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg></div>
        <div style="flex-grow:1;">
          <div style="font-weight:900;font-size:15px;">誕生日はわからない</div>
          <div style="font-size:11.5px;color:#8a7f72;margin-top:3px;">10の質問（行動アンケート）で性格を診断します</div>
        </div>
        <span style="color:#c3b8a6;font-size:20px;">›</span>
      </div>
    </div>

    <div style="margin-top:auto;background:#f3eee4;border-radius:12px;padding:13px 14px;font-size:11.5px;color:#7a6f62;line-height:1.7;">
      <b>ポイント：</b>「わからない」を選んでも、観察した行動から同じ4軸を測るので、結果は同じ16タイプに着地します。
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
