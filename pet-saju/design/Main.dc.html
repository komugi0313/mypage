<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
  <style>
    body{margin:0;background:#efe9df;color:#2b2723;font-family:"Zen Maru Gothic",system-ui,"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:#c8763b;} a:hover{color:#a85d29;}
    *{box-sizing:border-box;}
    .phone{width:390px;min-height:860px;margin:0 auto;background:#faf8f4;display:flex;flex-direction:column;}
    .wf-label{font-size:11px;font-weight:700;letter-spacing:.06em;color:#b4a894;text-transform:uppercase;}
    .dash{border:1.5px dashed #c3b8a6;background:#ece7de;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#9b8f7d;font-size:12px;font-weight:700;}
    .btn{display:flex;align-items:center;justify-content:center;height:54px;border-radius:14px;font-weight:900;font-size:16px;}
    .btn-primary{background:#c8763b;color:#fff;}
    .btn-ghost{background:#f1e3d5;color:#a85d29;border:1.5px solid #e4cdb4;}
    .card{background:#fff;border:1.5px solid #e6ddcf;border-radius:14px;}
  </style>
</helmet>
<div class="phone">
  <!-- ヘッダー -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #eadfce;">
    <div style="display:flex;align-items:center;gap:8px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#c8763b"><circle cx="7" cy="8" r="2.1"/><circle cx="12" cy="6.4" r="2.2"/><circle cx="17" cy="8" r="2.1"/><ellipse cx="12" cy="16" rx="5" ry="4.2"/></svg>
      <span style="font-weight:900;font-size:15px;">わんにゃん四柱推命<span style="font-size:11px;color:#b4a894;">（仮）</span></span>
    </div>
    <div style="width:22px;height:16px;display:flex;flex-direction:column;justify-content:space-between;"><span style="height:2px;background:#b4a894;border-radius:2px;"></span><span style="height:2px;background:#b4a894;border-radius:2px;"></span><span style="height:2px;background:#b4a894;border-radius:2px;"></span></div>
  </div>

  <div style="padding:22px 18px;display:flex;flex-direction:column;gap:18px;flex-grow:1;">
    <div class="wf-label">① トップ / LP</div>

    <!-- ヒーロー -->
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div style="font-size:26px;font-weight:900;line-height:1.35;text-wrap:pretty;">うちの子、<br>ほんとはどんな性格？</div>
      <div style="font-size:14px;color:#6f655a;line-height:1.7;">生まれた日から占う、ペットの四柱推命。<br>犬・猫を<b style="color:#c8763b;">16タイプ</b>で診断します。</div>
    </div>

    <div class="dash" style="height:190px;flex-direction:column;gap:6px;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#b3a892" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="M4 18l5-5 4 3 3-3 4 4"/></svg>
      <span>ヒーロー画像／ペットのイラスト</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;">
      <div class="btn btn-primary">診断をはじめる</div>
      <div style="text-align:center;font-size:12.5px;color:#8a7f72;">🐾 誕生日がわからなくても診断できます</div>
    </div>

    <!-- 特徴3点 -->
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;">
      <div class="card" style="padding:12px 8px;text-align:center;">
        <div class="dash" style="height:36px;width:36px;border-radius:50%;margin:0 auto 8px;">◎</div>
        <div style="font-size:11.5px;font-weight:700;line-height:1.5;">16タイプ<br>性格診断</div>
      </div>
      <div class="card" style="padding:12px 8px;text-align:center;">
        <div class="dash" style="height:36px;width:36px;border-radius:50%;margin:0 auto 8px;">♡</div>
        <div style="font-size:11.5px;font-weight:700;line-height:1.5;">飼い主との<br>相性診断</div>
      </div>
      <div class="card" style="padding:12px 8px;text-align:center;">
        <div class="dash" style="height:36px;width:36px;border-radius:50%;margin:0 auto 8px;">☾</div>
        <div style="font-size:11.5px;font-weight:700;line-height:1.5;">今月の<br>運気予報</div>
      </div>
    </div>

    <!-- 実績 -->
    <div class="card" style="padding:14px;display:flex;align-items:center;justify-content:space-between;">
      <div style="font-size:12px;color:#8a7f72;">これまでの診断数</div>
      <div style="font-size:20px;font-weight:900;color:#c8763b;">[ XX,XXX ] 件</div>
    </div>

    <div style="margin-top:auto;font-size:10.5px;color:#a89c8c;line-height:1.6;padding-top:8px;border-top:1px dashed #e0d6c6;">
      ※ 本診断は楽しむためのエンタメです。健康・病気・しつけの判断には使えません。気になる症状は獣医師へご相談ください。
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
