<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
  <style>
    body{margin:0;background:#efe9df;color:#2b2723;font-family:"Zen Maru Gothic",system-ui,"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:#c8763b;} a:hover{color:#a85d29;}
    *{box-sizing:border-box;}
    .phone{width:390px;min-height:980px;margin:0 auto;background:#faf8f4;display:flex;flex-direction:column;}
    .wf-label{font-size:11px;font-weight:700;letter-spacing:.06em;color:#b4a894;text-transform:uppercase;}
    .dash{border:1.5px dashed #c3b8a6;background:#ece7de;display:flex;align-items:center;justify-content:center;color:#9b8f7d;font-size:11px;font-weight:700;}
    .card{background:#fff;border:1.5px solid #e6ddcf;border-radius:16px;}
    .tab{flex-grow:1;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
  </style>
</helmet>
<div class="phone">
  <div style="display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #eadfce;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a7f72" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
    <span style="font-weight:900;font-size:14px;">もどる</span>
  </div>

  <div style="padding:22px 18px;display:flex;flex-direction:column;gap:18px;flex-grow:1;">
    <div class="wf-label">⑦ 相性診断</div>

    <div style="display:flex;gap:8px;background:#f3eee4;padding:5px;border-radius:13px;">
      <div class="tab" style="background:#c8763b;color:#fff;">飼い主 × ペット</div>
      <div class="tab" style="color:#8a7f72;">ペット × ペット（多頭）</div>
    </div>

    <!-- 2者 -->
    <div class="card" style="padding:18px;display:flex;align-items:center;justify-content:center;gap:14px;">
      <div style="text-align:center;display:flex;flex-direction:column;gap:6px;"><div class="dash" style="width:72px;height:72px;border-radius:50%;">飼い主</div><div style="font-size:11px;font-weight:700;">あなた</div></div>
      <svg width="30" height="30" viewBox="0 0 24 24" fill="#c8763b"><path d="M12 21s-7-4.3-7-9.4C5 8.4 7 7 9 7c1.6 0 2.5.9 3 1.8C12.5 7.9 13.4 7 15 7c2 0 4 1.4 4 4.6C19 16.7 12 21 12 21z"/></svg>
      <div style="text-align:center;display:flex;flex-direction:column;gap:6px;"><div class="dash" style="width:72px;height:72px;border-radius:50%;">むぎ</div><div style="font-size:11px;font-weight:700;">ペット</div></div>
    </div>

    <!-- スコア -->
    <div class="card" style="padding:18px;text-align:center;display:flex;flex-direction:column;gap:8px;">
      <div style="font-size:13px;color:#8a7f72;">2人の相性は…</div>
      <div style="font-size:44px;font-weight:900;color:#c8763b;line-height:1;">88<span style="font-size:18px;">点</span></div>
      <div style="font-size:15px;font-weight:900;">ベストパートナー型</div>
      <div style="font-size:12px;color:#5a5149;line-height:1.8;">あなたの日干とむぎの日干は“相生”の関係。<br>甘えたいタイミングがぴったり合う名コンビ。</div>
    </div>

    <!-- 読み解きの根拠 -->
    <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px;">
      <div style="font-size:13px;font-weight:900;">相性の理由（四柱推命）</div>
      <div style="display:flex;gap:10px;"><div class="dash" style="width:40px;height:40px;border-radius:10px;flex-shrink:0;">生</div><div style="font-size:12px;color:#5a5149;line-height:1.7;"><b>五行の相生</b>：あなたの「木」がむぎの「火」を育てる関係。</div></div>
      <div style="display:flex;gap:10px;"><div class="dash" style="width:40px;height:40px;border-radius:10px;flex-shrink:0;">星</div><div style="font-size:12px;color:#5a5149;line-height:1.7;"><b>通変星</b>：お世話する側・甘える側の役割が自然に決まる。</div></div>
      <div style="font-size:11px;color:#a89c8c;">※ 既存の相性診断エンジン（日干の関係・通変星・五行の補い合い）を転用。</div>
    </div>

    <div style="margin-top:auto;height:50px;border-radius:12px;background:#c8763b;color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;">相性結果をシェア</div>
  </div>
</div>
</x-dc>
</body>
</html>
