<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
  <style>
    body{margin:0;background:#efe9df;color:#2b2723;font-family:"Zen Maru Gothic",system-ui,"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:#c8763b;} a:hover{color:#a85d29;}
    *{box-sizing:border-box;}
    .phone{width:390px;min-height:1020px;margin:0 auto;background:#faf8f4;display:flex;flex-direction:column;}
    .wf-label{font-size:11px;font-weight:700;letter-spacing:.06em;color:#b4a894;text-transform:uppercase;}
    .opt{border:1.5px solid #e0d6c6;background:#fff;border-radius:13px;padding:14px 15px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:700;color:#3b342d;}
    .opt .r{width:20px;height:20px;border-radius:50%;border:2px solid #d3c6b3;flex-shrink:0;}
    .opt.on{border-color:#c8763b;background:#fdf6ee;}
    .opt.on .r{border-color:#c8763b;background:#c8763b;box-shadow:inset 0 0 0 3px #fff;}
    .btn-primary{height:54px;border-radius:14px;background:#c8763b;color:#fff;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;}
  </style>
</helmet>
<div class="phone">
  <div style="display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #eadfce;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a7f72" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
    <span style="font-weight:900;font-size:14px;">もどる</span>
    <span style="margin-left:auto;font-size:11px;color:#b4a894;">Q3 / 10</span>
  </div>

  <!-- 進捗バー -->
  <div style="height:6px;background:#eadfce;"><div style="width:30%;height:100%;background:#c8763b;"></div></div>

  <div style="padding:22px 18px;display:flex;flex-direction:column;gap:18px;flex-grow:1;">
    <div class="wf-label">④ 入力B（行動アンケート・誕生日不要）</div>

    <div style="background:#f3eee4;border-radius:10px;padding:6px 12px;font-size:11px;font-weight:700;color:#a85d29;align-self:flex-start;">軸③ 動 ⇄ 静 をはかる質問</div>

    <div style="font-size:20px;font-weight:900;line-height:1.45;">知らない人が来たとき、<br>その子はどうする？</div>

    <div style="display:flex;flex-direction:column;gap:11px;">
      <div class="opt on"><span class="r"></span>まっさきに飛んでいって歓迎する</div>
      <div class="opt"><span class="r"></span>とりあえず吠える・鳴く、様子を見る</div>
      <div class="opt"><span class="r"></span>遠くからじーっと観察している</div>
      <div class="opt"><span class="r"></span>知らんぷり。自分のペースを崩さない</div>
    </div>

    <div style="font-size:11.5px;color:#8a7f72;line-height:1.7;background:#fff;border:1px dashed #e0d6c6;border-radius:10px;padding:12px;">
      全10問で <b>①陽⇄陰 / ②強⇄柔 / ③動⇄静 / ④社交⇄甘え</b> の4軸を各2〜3問ずつ測定 → 16タイプを判定。<br>観察した“行動”が根拠なので「当たってる感」が出やすいのが狙い。
    </div>

    <div style="margin-top:auto;display:flex;gap:10px;">
      <div style="flex-grow:1;" class="btn-primary">つぎへ</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
