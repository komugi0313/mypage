<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Pocket 本格鑑定 | Pocket Kantei</title>
<meta name="description" content="登録は一度だけ。あとはチャットで、いつでもプロの四柱推命に相談できる。多言語対応・アプリ対応。">
<meta property="og:title" content="Pocket鑑定">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#4E8060">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket鑑定">
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FBFAF6;--soft:#F1EEE2;--card:#ffffff;
  --text:#15181F;--muted:#3E434F;--line:#DDD7C6;
  --accent:#4f46e5;--accent-d:#4338ca;--accent-soft:#eef1fe;
  --chat-bg:#F3F1E9;
  --el-mok:#2f9e5b;--el-ka:#e0556a;--el-do:#c99a3f;--el-kin:#7a8194;--el-sui:#3d84c6;
}
body[data-theme="green"]{ --accent:#4E8060;--accent-d:#345C42;--accent-soft:#E8F0EB; }
html{-webkit-text-size-adjust:100%}
/* LPヒーローと同じマーブル光（ピーチ×セージ）を全画面の背景に */
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(320px 320px at 88% 4%, rgba(232,180,151,.28), transparent 70%),
    radial-gradient(300px 300px at 2% 34%, rgba(91,140,107,.14), transparent 70%),
    radial-gradient(340px 340px at 96% 78%, rgba(248,239,216,.55), transparent 72%),
    linear-gradient(180deg,#FBEEE2 0%, #FBFAF6 42%, #FBFAF6 100%);}
body{font-family:'Zen Kaku Gothic New',system-ui,sans-serif;color:var(--text);background:transparent;font-weight:500;
  line-height:1.8;word-break:normal;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
.screen{display:none}
.screen.on{display:block}
.nw{white-space:nowrap}
.wrap{max-width:440px;margin:0 auto;padding:14px 20px 56px;min-height:100vh}

/* トップバー（LP） */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 0 2px}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;font-weight:900;font-size:19px;letter-spacing:.02em;color:var(--text)}
.brand .mark{flex:none;width:31px;height:31px;border-radius:9px;background:linear-gradient(145deg,var(--accent),var(--accent-d));display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 3px 9px rgba(0,0,0,.18)}
.brand .mark img{width:25px;height:25px;display:block}
.brand .ax{color:var(--accent)}
.switchers{display:flex;align-items:center;gap:8px}
.lang-sel{font-family:inherit;font-size:12.5px;color:var(--text);border:1px solid var(--line);border-radius:999px;
  padding:6px 26px 6px 12px;background:#fff;-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%23697386' fill='none' stroke-width='1.5'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;outline:none;cursor:pointer}
.theme-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--accent);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;white-space:nowrap}
.theme-btn .dot{width:12px;height:12px;border-radius:999px;background:var(--accent);display:inline-block}

/* ボタン */
.btn{display:block;width:100%;padding:15px;border:0;border-radius:12px;cursor:pointer;
  font-weight:700;font-size:16px;color:#fff;background:var(--accent);transition:.15s;margin-top:14px;letter-spacing:.02em}
.btn:hover{background:var(--accent-d)}.btn:active{transform:scale(.995)}
.btn.mini{padding:12px;font-size:15px}

/* LP */
.lp-hero{padding:26px 2px 6px}
.lp-badge{display:inline-block;font-size:12px;font-weight:700;color:var(--accent-d);background:var(--accent-soft);border-radius:999px;padding:6px 14px;margin-bottom:16px}
.lp-hero h1{font-weight:900;font-size:clamp(26px,7.2vw,33px);line-height:1.4;letter-spacing:.01em}
.lp-hero h1 .hl{color:var(--accent)}
.lp-hero .sub{font-size:15px;color:var(--muted);line-height:1.95;margin-top:16px}
.price-tag{display:inline-flex;align-items:center;gap:8px;margin:22px 0 4px;padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;color:var(--accent-d);background:var(--accent-soft)}
.compare{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.85}
.compare b{color:var(--text);font-weight:700}
.preview{margin:26px 0 4px;border:0;border-radius:20px;overflow:hidden;background:var(--chat-bg);box-shadow:0 12px 34px rgba(31,36,48,.08)}
.preview .pv-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line)}
.preview .pv-msgs{padding:16px 14px;display:flex;flex-direction:column;gap:10px}
.pv-b{max-width:82%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.8}
.pv-b.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.pv-cap{margin-left:auto;font-size:10px;color:var(--muted);background:var(--soft);padding:3px 9px;border-radius:999px;white-space:nowrap}
.pv-more{display:block;margin:12px auto 2px;border:0;background:none;color:var(--accent);font-weight:800;font-size:12.5px;font-family:inherit;cursor:pointer}
.logic-row{margin:-4px 0 14px 43px}
.logic-row button{border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.lp-legal{text-align:center;font-size:11.5px;margin-top:12px;color:var(--muted)}
.lp-legal a{color:var(--muted);text-decoration:underline}
.pv-b.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
.steps{margin:34px 0 6px}
.steps h2{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;text-align:left;margin-bottom:14px}
.step{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.step .no{flex:none;width:30px;height:30px;border-radius:10px;background:var(--accent);color:#fff;font-weight:900;font-size:14px;display:grid;place-items:center}
.step .st{font-weight:700;font-size:15px}
.step .sd{font-size:13px;color:var(--muted);line-height:1.8;margin-top:2px}
.feat{margin:30px 0 6px}
.feat .f{border:0;background:var(--soft);border-radius:14px;padding:16px;margin-bottom:10px}
.feat .ft{font-weight:900;font-size:15px}
.feat .fd{font-size:13px;color:var(--muted);line-height:1.85;margin-top:5px}
.plans{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.plan{border:0;background:var(--soft);border-radius:14px;padding:18px}
.plan.best{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.plan .pn{font-weight:900;font-size:15px}
.plan .pp{font-weight:900;font-size:28px;margin:4px 0}
.plan .pp small{font-size:13px;color:var(--muted);font-weight:400}
.plan .pd{font-size:13px;color:var(--muted);line-height:1.8}
.plan .badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:3px 11px;margin-bottom:8px}
.free-hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.9}
.free-hint b{color:var(--accent)}
.about{margin-top:30px;border-radius:14px;background:var(--soft);padding:2px 4px}
.about summary{list-style:none;cursor:pointer;padding:15px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:space-between}
.about summary::-webkit-details-marker{display:none}
.about summary::after{content:'＋';color:var(--muted);font-weight:400;font-size:18px}
.about[open] summary::after{content:'－'}
.about-body{padding:0 14px 16px;font-size:13px;color:var(--muted);line-height:1.95}
.lp-foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:34px;line-height:1.9}

/* 登録カード */
.card{background:var(--soft);border:0;border-radius:16px;padding:22px 18px;margin-top:16px}
.card h2{font-weight:900;font-size:17px;margin-bottom:8px}
.lead{font-size:13.5px;color:var(--muted);line-height:1.9}
.field{margin-top:16px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px;font-weight:500}
.dates{display:flex;gap:8px}.dates .sel{flex:1}
select,input[type=text],input[type=email]{width:100%;padding:12px 11px;border-radius:10px;border:1px solid var(--line);
  background:#fff;color:var(--text);font-size:15px;font-family:inherit;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%23697386' fill='none' stroke-width='1.5'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;padding-right:28px}
select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--muted);font-family:inherit;font-size:14px;cursor:pointer}
.seg button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:700}
.chk{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13.5px;color:var(--muted);cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--accent)}
.note{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.7}
.priv{font-size:11.5px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.8}
.back{display:inline-flex;align-items:center;gap:6px;margin-top:18px;font-size:13.5px;font-weight:700;color:var(--muted);text-decoration:none;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 20px;font-family:inherit}
.pill-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:10px 22px;font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer}
.pill-btn:active{transform:scale(.98)}
.sheet-close{display:flex;justify-content:center;margin-top:18px;padding-bottom:4px}
.chat-back{flex:none;width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:17px;font-weight:700;display:grid;place-items:center;cursor:pointer;margin-right:2px;font-family:inherit;line-height:1}
.mp-card{background:var(--soft);border-radius:14px;padding:12px 16px;margin-bottom:12px}
.mp-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;font-size:14px}
.mp-row span{color:var(--muted);flex:none}
.mp-row b{font-weight:700;text-align:right;word-break:break-all}
.mp-quit{display:block;width:100%;margin-top:12px;padding:13px;border-radius:12px;border:1.5px solid #e0556a;background:#fff;color:#d63c53;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer}
.lc-table{background:var(--soft);border-radius:14px;padding:6px 12px;margin-top:8px}
.lc-row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
.lc-row:last-child{border-bottom:0}
.lc-row.cur{background:var(--accent-soft);border-radius:10px;padding-left:8px;padding-right:8px;border-bottom:0}
.lc-age{color:var(--muted);width:64px;flex:none}
.lc-yrs{color:var(--muted);width:86px;flex:none}
.lc-gz{font-weight:900;width:44px;flex:none}
.lc-star{color:var(--muted)}
.lc-now{margin-left:auto;background:var(--accent);color:#fff;font-size:10.5px;font-weight:800;border-radius:999px;padding:3px 10px;white-space:nowrap}
.lc-chips{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:10px}
.lc-lbl{font-size:12px;color:var(--muted);font-weight:700;margin-right:2px}
.lc-chip{font-size:12px;font-weight:800;border-radius:999px;padding:4px 11px}
.lc-chip.t{background:#fdf1e2;color:#b06e12}
.lc-chip.l{background:#fdeaee;color:#d63c53}
.nayin-line{font-size:13px;color:var(--muted);margin:14px 2px 2px}
.nayin-line b{color:var(--text);font-weight:800}

/* チャット本体 */
#scChat.on{display:flex}
#scChat{flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;background:transparent;position:relative}
.c-head{flex:none;display:flex;align-items:center;gap:11px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);padding-top:max(10px,env(safe-area-inset-top))}
.avatar{flex:none;width:40px;height:40px;border-radius:999px;overflow:hidden;background:var(--accent-soft) url('owl.png') center/82% no-repeat}
.c-head .who{flex:1;min-width:0}
.c-head .nm{font-weight:900;font-size:15px;line-height:1.3}
.c-head .rl{font-size:11px;color:var(--muted)}
.c-head .st-on{font-size:11px;color:#d63c53;font-weight:700;display:flex;align-items:center;gap:5px}
.c-head .st-on::before{content:'';flex:none;width:8px;height:8px;border-radius:999px;background:#e8404f;animation:onblink 1.1s ease-in-out infinite}
@keyframes onblink{0%,100%{opacity:1}50%{opacity:.2}}
.c-head .acts{display:flex;gap:6px}
.icobtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:700;color:var(--accent);cursor:pointer;font-family:inherit;white-space:nowrap}
.icobtn:hover{background:var(--accent-soft)}
.icobtn.only{padding:7px 9px}
.mode-bar{flex:none;display:none;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--accent-d)}
.mode-bar.on{display:flex}
.mode-bar button{border:0;background:none;color:var(--accent);font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;text-decoration:underline}
.c-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 14px 8px;-webkit-overflow-scrolling:touch}
.day-sep{text-align:center;margin:6px 0 14px}
.day-sep span{font-size:11px;color:var(--muted);background:rgba(105,115,134,.12);border-radius:999px;padding:3px 12px}
.row{display:flex;gap:9px;margin-bottom:14px;align-items:flex-end}
.row.ai{align-items:flex-start}
.row.ai .av{margin-top:2px}
.row.me{justify-content:flex-end}
.row .av{flex:none;width:34px;height:34px;border-radius:999px;overflow:hidden;background:var(--accent-soft) url('owl.png') center/82% no-repeat}
.bub{max-width:76%;padding:11px 14px;font-size:15.5px;font-weight:500;line-height:1.62;letter-spacing:0;white-space:pre-wrap;border-radius:16px}
.row.ai .bub{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px;color:var(--text)}
.row.me .bub{background:var(--accent);color:#fff;border-bottom-right-radius:5px}
.typing{display:inline-flex;gap:4px;padding:13px 15px;background:#fff;border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:5px}
.typing i{width:7px;height:7px;border-radius:999px;background:var(--muted);opacity:.5;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:.9;transform:translateY(-3px)}}
.sugg{display:flex;flex-wrap:wrap;gap:8px;padding:2px 2px 12px}
.sugg button{font-size:13px;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:#fff;cursor:pointer;font-family:inherit}
.sugg button:hover{background:var(--accent-soft);border-color:var(--accent)}
/* 流れの中（メッセージ欄と入力欄の間）に置く：表示時はスクロール領域が縮むだけで、本文に重ならない */
.new-pill{flex:none;align-self:center;margin:6px auto 2px;z-index:40;border:1px solid var(--line);background:#fff;color:var(--accent-d);border-radius:999px;padding:8px 16px;font-size:12.5px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.14);cursor:pointer;display:none;font-family:inherit;white-space:nowrap}
.new-pill.on{display:block;animation:pillin .25s ease}
@keyframes pillin{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.c-input{flex:none;display:flex;gap:8px;align-items:flex-end;padding:10px 12px;background:#fff;border-top:1px solid var(--line);padding-bottom:max(10px,env(safe-area-inset-bottom))}
.c-input textarea{flex:1;resize:none;max-height:120px;padding:12px 16px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--text);font-size:16px;font-weight:500;font-family:inherit;outline:none;line-height:1.6}
.c-input textarea::placeholder{color:#9aa2ad;font-weight:500}
.c-input textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.c-input .send{flex:none;width:44px;height:44px;border-radius:999px;border:0;background:var(--accent);color:#fff;font-size:18px;cursor:pointer}
.c-input .send:hover{background:var(--accent-d)}
.demo-flag{position:absolute;left:0;right:0;bottom:64px;text-align:center;font-size:10.5px;color:var(--muted);pointer-events:none}

/* シート */
.ov{position:fixed;inset:0;background:rgba(20,24,35,.42);opacity:0;visibility:hidden;transition:.22s;z-index:40}
.ov.on{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;max-height:88dvh;overflow-y:auto;transform:translateY(100%);transition:.28s cubic-bezier(.22,1,.36,1);z-index:41;padding:8px 18px calc(24px + env(safe-area-inset-bottom))}
.sheet.on{transform:translateY(0)}
.sheet .grip{width:40px;height:4px;border-radius:999px;background:var(--line);margin:8px auto 12px}
.sheet h3{font-size:17px;font-weight:900;margin-bottom:4px}
.sheet .sh-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.8}
#shMenu{background:var(--soft)}
.menu-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:2px 14px;margin-top:12px}
.menu-card.accent{border:1.5px solid var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.05)}
.menu-card.accent .mi-ic{background:var(--accent);color:#fff}
.menu-card .menu-row{border-bottom:1px solid var(--line);padding:13px 0}
.menu-card .menu-row:last-child{border-bottom:0}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 4px;border:0;border-bottom:1px solid var(--line);background:none;font-family:inherit;font-size:15px;font-weight:700;color:var(--text);cursor:pointer}
.menu-card .menu-item:last-child,.menu-item:last-child{border-bottom:0}
.menu-item .mi-ic{flex:none;width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:16px;font-weight:900}
.menu-item .mi-d{font-size:12px;color:var(--muted);font-weight:400;margin-top:1px}
.menu-item .mi-arrow{margin-left:auto;color:var(--muted)}
/* 「登録情報を変更」を目立たせる：ブランドのテラコッタで強調 */
.menu-item.hot{background:linear-gradient(180deg,rgba(231,169,129,.16),rgba(231,169,129,.10));border-radius:12px;border-bottom:0;padding-left:8px;padding-right:8px}
.menu-item.hot .mi-ic{background:linear-gradient(180deg,#E7A981,#C26340);color:#fff}
.menu-item.hot > span:nth-child(2) > span:first-child{color:#B25E3B;font-weight:800}
.menu-item.hot .mi-d{color:#C07A54}
.menu-item.hot .mi-arrow{color:#C26340}
.devbox{margin-top:12px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:16px}

var EL_ORDER=['木','火','土','金','水'];
/* 相性：関係キーだけ返す（文言は言語辞書へ） */
function elRelationKey(a,b){
  var sei={木:'火',火:'土',土:'金',金:'水',水:'木'};
  var koku={木:'土',土:'水',水:'火',火:'金',金:'木'};
  if(a===b) return {k:'same',good:true};
  if(sei[a]===b) return {k:'ivalue',good:true};
  if(sei[b]===a) return {k:'valued',good:true};
  if(koku[a]===b) return {k:'temper',good:false};
  if(koku[b]===a) return {k:'tempered',good:false};
  return {k:'fate',good:true};
}

var LS_PROF='pk_profile', LS_MSGS='pk_msgs', LS_LANG='pk_lang', LS_THEME='pk_theme';
var state={ lang:'ja', theme:'indigo', profile:null, sex:'female', esex:'female', chart:null, chartB:null, mode:'self', useCount:0, msgs:[] };
var FREE_LIMIT=5;
/* ---- プラン枠（内部値・画面には出さない）。鑑定はGeminiのみ：枠を使い切ったら止めて正直に案内する ---- */
var PLAN_BUDGET={light:100,std:500}; /* 月間の詳細鑑定枠 */
var UNL_DAILY=150;                   /* 使い放題の適正利用の範囲（規約記載） */
/* ---- 無料お試し：3日間・合計15通（1日5通は既存FREE_LIMITが担当）。体験モード(直キー)は対象外 ---- */
var TRIAL_DAYS=3, TRIAL_TOTAL=15;
function _dser(){var d=new Date();return Math.floor((d-new Date(d.getFullYear(),0,0))/864e5)+d.getFullYear()*1000;} /* ローカル暦日 */
function trialStart(){try{var v=localStorage.getItem('pk_tr0');if(!v){v=String(_dser());localStorage.setItem('pk_tr0',v);}return parseInt(v,10);}catch(e){return _dser();}}
function trialUsed(){try{return parseInt(localStorage.getItem('pk_tru')||'0',10)||0;}catch(e){return 0;}}
function bumpTrial(){try{localStorage.setItem('pk_tru',String(trialUsed()+1));}catch(e){}}
function trialDaysLeft(){return Math.max(0,TRIAL_DAYS-(_dser()-trialStart()));}
function trialLeftTotal(){return Math.max(0,TRIAL_TOTAL-trialUsed());}
function trialOver(){return curPlan()==='free'&&capEnforced()&&(trialDaysLeft()<=0||trialLeftTotal()<=0);}
function updateTrialPill(){var el=document.getElementById('trialPill');if(!el)return;if(curPlan()!=='free'||!capEnforced()||trialOver()){el.style.display='none';return;}var t=pick(TRI_PILL).replace('{n}','<b>'+trialLeftTotal()+'</b>').replace('{d}','<b>'+trialDaysLeft()+'</b>');el.innerHTML=t;el.style.display='';}
function _ym(){var d=new Date();return ''+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2);}
function _ymd(){var d=new Date();return _ym()+('0'+d.getDate()).slice(-2);}
function curPlan(){return (state.profile&&state.profile.plan)||'free';}
function useKey(){var p=curPlan();return (p==='light'||p==='std')?('pk_use_'+_ym()):('pk_use_'+_ymd());}
function usedNow(){try{return parseInt(localStorage.getItem(useKey())||'0',10)||0;}catch(e){return 0;}}
function bumpUse(){try{localStorage.setItem(useKey(),String(usedNow()+1));}catch(e){}}
function planCap(){var p=curPlan();if(p==='unl')return UNL_DAILY;if(PLAN_BUDGET[p])return PLAN_BUDGET[p];return FREE_LIMIT;}
function capEnforced(){return curPlan()!=='free'||!directKey();}
function needNudge(){var p=curPlan();if(p!=='light'&&p!=='std')return false;if(usedNow()<Math.floor(planCap()*0.8))return false;var k='pk_upg_'+_ym();try{if(localStorage.getItem(k))return false;localStorage.setItem(k,'1');}catch(e){}return true;}
function $(id){return document.getElementById(id);}
function T(){ return I18N[state.lang]||I18N.ja; }
function pick(m){ return (m[state.lang]!=null)?m[state.lang]:m.en; }

var PV_SAMPLES={"ja":[{"q":"元彼とまたやり直せるかな？","a":"あなたの持ち前の芯の強さと誠実さがあれば、時間はかかっても関係を再構築する力は十分にあるよ。今は焦って動くよりも、自分のスキルを磨いたり新しい知識を身につけたりして、内面から魅力を高めることに集中してみて。その落ち着きが、きっと相手の心に再び響くはずだよ。"},{"q":"最近転職しようか迷ってるんだけど、いつ動くのがベストかな？","a":"あなたは本来とても真面目でしっかりした方ですが、今は少し勇気を持って新しいことに挑戦したくなる時期ですね。来年以降に学びの機会が増えて視界がクリアになるので、今は焦らずに情報収集をしながら準備を整えるのが一番ですよ。まずは興味のある分野について詳しく調べて、自分の中で知識を蓄えておくことから始めてみてくださいね。"},{"q":"最近なんだかお金が貯まらなくて悩んでるんだけど、どうしたらいいかな？","a":"今は新しいことに挑戦したくなる時期だから、つい自分磨きや自己投資にお金を使いたくなっちゃうみたいね。まずは家計の整理をして、なんとなく使っている固定費を一度見直してみると運気が整ってくるはずよ。来年からは少しずつ落ち着いてくるから、今は焦らずに計画的な貯蓄を心がけてみてね。"},{"q":"苦手な上司とどうやってうまく付き合っていけばいいかな？","a":"あなたは本来、真面目で責任感が強いから、つい相手の顔色をうかがって疲れてしまうことがあるかもしれませんね。今は少し変化の時期ですが、焦らずに相手のペースに巻き込まれないよう一歩引いて接するのが一番の近道ですよ。まずは、仕事は完璧にこなしつつ、自分のプライベートな時間はしっかり切り離して心を休めることを意識してみてくださいね。"},{"q":"今年はどんな一年になりそうかな？","a":"今年のあなたは、これまで積み重ねてきたことが形になりやすく、責任ある役割を任される場面が増えていきそうです。忙しく感じる時もあるかもしれませんが、持ち前の粘り強さを信じて一歩ずつ進んでみてください。今は新しいことを始めるよりも、今ある環境で丁寧に足元を固めていくのが開運の秘訣ですよ。"}],"en":[{"q":"Do you think I'll be able to get back together with my ex?","a":"You have a really strong, independent spirit that naturally draws people toward you, but right now you might be feeling a bit restless and prone to overthinking things. Instead of rushing to fix the past, focus on building up your own confidence and wisdom over the next year. Try taking a short trip or starting a new hobby by yourself, as stepping away from the situation will actually help clear the path for what is meant to come back to you."},{"q":"I'm really torn about whether I should switch jobs or not, and I'm wondering when the right time to make a move would be.","a":"You are currently in a phase where your natural drive and inner courage are very high, making this a great season to start looking for new opportunities. Since things might feel a bit stagnant if you rush into the wrong role right now, wait until next year when your intuition will be much sharper to guide your decision. Focus on gathering information and networking over the next few months so you are perfectly prepared to leap when the timing feels just right."},{"q":"I feel like I just can't seem to save any money lately, what should I do?","a":"You are naturally very driven and talented at creating your own path, but right now you might be feeling the pressure to prove yourself which leads to impulsive spending. Since you are in a phase that rewards courage and bold action, try setting up an automated transfer to a savings account before you even see your paycheck to remove the temptation. Focus on building a structured routine for your finances instead of trying to force a major change all at once."},{"q":"How can I get along better with my difficult boss?","a":"You have a natural gift for staying steady and composed even when things get heated, which is your biggest strength in this situation. Try to channel that quiet wisdom into structured, professional communication rather than taking their personality clashes to heart. Focus on being the most reliable person in the room, as your sense of order will eventually earn you the respect you deserve."},{"q":"Hey, I’m wondering what this year has in store for me! Any insights?","a":"You have a lot of steady energy right now, which is going to help you finally find your footing after some recent bumps in the road. Even though things might feel a bit intense, this is a great time to lean into your natural wisdom and trust your instincts. Focus on staying organized and patient, as that will bring you the most success in your career."}],"zh":[{"q":"我和他还有机会复合吗？","a":"你现在的直觉非常敏锐，虽然过去你们之间有些磕磕绊绊的小插曲，但这反而让你看清了自己真正想要的生活。与其执着于过去，不如把精力放在提升个人素养和学习新事物上，这会让你整个人变得更有魅力。建议你暂时放下这段关系，多去陌生的地方走走看看，新的机遇很快就会在这些变动中向你招手。"},{"q":"我正在考虑要不要换工作，你觉得什么时候行动比较好呢？","a":"你内心其实很有主见且具备很强的抗压能力，现在的运势正鼓励你勇敢面对挑战，而不是在原地徘徊。建议你在接下来的两年里多利用时间充实专业知识或是学习新的技能，这样到了后年时机成熟，你的才华会更容易被赏识，从而迎来理想的职场转折。"},{"q":"最近怎么总觉得存不下钱呢，我该怎么办？","a":"你天生非常有主见且具备很强的执行力，但性格中追求完美和偶尔的敏感会让你在生活中有一些不必要的开支。你现在正处于一段需要勇气去面对挑战的时期，建议尝试制定一个明确且细致的存钱计划，通过严格的条理来约束自己，这样能帮你更好地守住财富。"},{"q":"跟那个难搞的上司到底该怎么相处才好啊？","a":"你其实很有自己的想法和才华，只要在工作中多展现这种独特的见解，那个上司反倒会因为认可你的能力而对你另眼相看。最近你可以试着把情绪放一边，用更专业和有条理的方式去沟通，你会发现阻碍反而成了你展示个人魅力的机会。"},{"q":"我今年运势怎么样呀？","a":"你今年会感到动力很足，很多事情只要愿意去尝试挑战，往往都能看到不错的进展。不过由于近期变动比较多，建议你在做决定前多给自己留出一点沉淀思考的时间，不要急着赶进度。"}],"zt":[{"q":"我跟他還有機會復合嗎？","a":"你內心其實很渴望穩定，但最近總覺得溝通上有些卡卡的，好像怎麼努力都沒辦法回到過去。建議你這陣子先把重心放回自己身上，多去進修或嘗試新的興趣，當你變得更自信從容時，緣分自然會以最好的方式回到你身邊。"},{"q":"我在考慮要不要換工作，請問什麼時候行動比較好呢？","a":"你骨子裡有種追求秩序與自我實現的特質，雖然現在心裡有些猶豫，但這其實是渴望突破自我的一種訊號。建議你在兩年後，也就是二零二六年期間開始規劃轉職，那時候你的學習運勢正旺，會更有把握做出穩定的選擇。在此之前，請先沉住氣累積專業實力，這對你未來的發展會更有幫助。"},{"q":"最近好像總存不到錢，我該怎麼做比較好呢？","a":"你天生擁有很強的執行力與規劃能力，這份務實的特質其實是你守財的利器。只是因為生活節奏中偶爾會出現些意料之外的小波動，讓你容易在不經意間流失資源，建議你試著將財務交給自動化的系統管理，減少憑直覺花錢的機會。只要能保持穩定的秩序感，你會發現積累財富其實比想像中更加順利。"},{"q":"要怎麼做才能和難相處的上司順利溝通呢？","a":"你天生具備穩重與講求紀律的特質，面對壓力時其實很有韌性，這份穩定感就是你與他人相處時最大的優勢。雖然目前遇到的人際摩擦讓你感到有些煩心，但試著將重心放在展現你的專業與可靠度上，對方自然會對你產生敬重。建議你在接下來的一段時間裡，多展現傾聽與學習的態度，以柔克剛會比直接衝突更能為你帶來轉機。"},{"q":"今年我會過得怎麼樣呢？","a":"你今年正處於一個需要展現勇氣與魄力的時期，雖然生活中難免會遇到一些細微的阻礙或變動，但這些其實都是為了讓你更穩健成長的過程。建議你將心力放在學習新知識或規劃未來的專業方向上，多閱讀與思考能幫助你補足運勢中較為缺乏的柔軟智慧，讓前行的腳步更加從容順遂。"}],"ko":[{"q":"그 사람하고 다시 잘해볼 수 있을까?","a":"당신은 생각이 깊고 마음이 참 따뜻한 분이라 관계를 신중하게 이끌어가는 힘이 있어요. 지금은 억지로 붙잡기보다 스스로를 돌보며 지혜를 쌓는 시간이 필요한데, 다가올 시기에 자연스럽게 인연의 흐름이 좋아질 거예요. 우선은 본인의 일상에 집중하면서 차분하게 마음의 여유를 먼저 가져보세요."},{"q":"요즘 이직할지 말지 고민인데, 언제 움직이는 게 좋을까?","a":"지금은 성급하게 결정하기보다 실력을 쌓으며 내실을 다지는 시기예요. 내년부터는 자연스럽게 좋은 제안이 들어오거나 뜻밖의 기회가 찾아올 테니, 올해까지는 지금 자리에서 차분히 역량을 키우는 데 집중해보세요. 서두르지 말고 준비를 마쳤을 때 자신 있게 움직이는 것이 가장 좋은 결과를 가져올 거예요."},{"q":"요즘 들어 자꾸 돈이 새는 것 같은데, 어떻게 하면 좋을까?","a":"지금은 에너지가 외부로 많이 뻗어 나가는 시기라 꼼꼼하게 관리하지 않으면 돈이 머물기 조금 어려울 거예요. 대신 내년에 새로운 것을 배우거나 공부를 시작하면 자연스럽게 재물운도 안정될 테니, 지금은 큰 투자보다는 자신을 가꾸는 데 집중해 보세요."},{"q":"직장 상사 때문에 너무 스트레스 받는데, 이럴 땐 어떻게 하면 좋을까요?","a":"지금은 윗사람과의 관계에서 내 뜻대로 되지 않아 고민이 많겠지만, 정해진 원칙을 차분히 지켜나가다 보면 결국 당신의 성실함이 인정받는 시기가 올 거예요. 혼자 모든 걸 해결하려 애쓰기보다는 가끔은 주변에 적당히 도움을 청하며 마음의 여유를 가져보세요. 상황이 금방 나아질 테니 너무 걱정하지 말고 지금처럼 묵묵히 본인의 일을 챙기는 것이 가장 좋은 방법이에요."},{"q":"올해는 나한테 어떤 한 해가 될까?","a":"올해는 그동안 차곡차곡 쌓아온 노력이 빛을 발하면서 주변으로부터 인정받을 기회가 많아질 거예요. 다만 변화가 잦아 마음이 조금 바쁠 수 있으니, 너무 조급해하지 말고 하나씩 차근차근 매듭을 지어보세요. 익숙한 일상에서 벗어나 새로운 것을 배우거나 공부를 시작해보는 것이 좋은 운을 불러오는 열쇠가 될 거예요."}],"vi":[{"q":"Liệu mình với người cũ có cơ hội quay lại với nhau không nhỉ?","a":"Bạn là người có nội tâm sâu sắc và luôn biết cách tự đứng vững, nên dù chuyện tình cảm hiện tại có chút chông chênh thì bạn vẫn sẽ sớm tìm lại được sự bình yên thôi. Đừng quá cưỡng cầu hay nóng vội vì mọi thứ cần thời gian để tự sắp xếp vào đúng vị trí của nó. Thay vì suy nghĩ về quá khứ, hãy dành thời gian này để chăm chút cho bản thân và thử bắt đầu một sở thích mới xem sao nhé."},{"q":"Mình đang phân vân không biết có nên chuyển việc không. Theo bạn thì khi nào thì nên bắt đầu thay đổi nhỉ?","a":"Bạn là người có khả năng tự lập rất tốt và làm việc gì cũng chỉn chu, nên dù môi trường mới có thử thách đến đâu bạn cũng sẽ sớm tìm được chỗ đứng vững chắc thôi. Thời điểm tới rất thuận lợi để bạn khẳng định giá trị bản thân, vậy nên đừng ngần ngại nắm bắt cơ hội vào năm sau khi có quý nhân hỗ trợ nhé. Hãy cứ tự tin chuẩn bị kỹ lưỡng vì mọi nỗ lực của bạn lúc này chắc chắn sẽ gặt hái được kết quả xứng đáng."},{"q":"Dạo này tiền cứ không cánh mà bay, làm sao để giữ tiền đây Nico ơi?","a":"Bạn đang có xu hướng muốn làm nhiều thứ cùng lúc nên tiền bạc dễ bị phân tán đấy. Hãy thử tập trung vào những kế hoạch chắc chắn và tránh các quyết định chi tiêu ngẫu hứng trong lúc này nhé. Bạn nên lập một cuốn sổ ghi chép nhỏ để kiểm soát dòng tiền, sự ngăn nắp sẽ giúp tài lộc của bạn ổn định hơn nhiều."},{"q":"Sếp khó tính quá, làm sao để em làm việc với họ cho trôi chảy bây giờ chị ơi?","a":"Tính cách của em vốn rất cẩn thận và có nguyên tắc, nên khi gặp người quản lý không hợp ý thường sẽ dễ gây ra chút căng thẳng không đáng có. Thời gian tới, em cứ tập trung làm tốt phần việc của mình một cách kỷ luật và chuyên nghiệp nhất, họ sẽ dần thay đổi thái độ thôi. Lời khuyên cho em là hãy cứ nhẫn nại và giữ khoảng cách lịch sự thay vì cố gắng lấy lòng họ nhé."},{"q":"Năm nay của em sẽ như thế nào hả anh?","a":"Năm nay em sẽ có nhiều cơ hội để khẳng định bản thân và gặt hái thành quả nhờ sự chăm chỉ trước đây. Em hãy mạnh dạn đón nhận những thử thách mới thay vì lo lắng quá nhiều nhé, vì đây là lúc để em bước ra khỏi vùng an toàn của mình đấy."}],"es":[{"q":"¿Crees que podré volver con él?","a":"Siento que tu corazón necesita un poco más de calma y reflexión antes de buscar respuestas afuera. Aunque ahora mismo todo se siente un poco inestable, los próximos meses te traerán una claridad especial para entender qué es lo mejor para tu crecimiento personal. Por ahora, intenta enfocarte en aprender algo nuevo que te apasione y deja que el tiempo acomode las cosas por sí solo."},{"q":"Estoy pensando en cambiar de trabajo, ¿cuándo crees que sería el mejor momento para dar el paso?","a":"Tienes una energía muy fuerte para organizar tu camino y lograr estabilidad, así que ahora mismo es un periodo ideal para demostrar tu valía y dar ese salto con confianza. Te sugiero que aproveches los próximos meses para planearlo con calma, ya que el año que viene será excelente para adquirir nuevos conocimientos que te abrirán puertas importantes. Confía en tu intuición y asegúrate de elegir un lugar que valore tu capacidad para poner orden y estructura en todo lo que haces."},{"q":"Últimamente no me rinde el dinero, ¿qué puedo hacer para ahorrar más?","a":"Tienes una energía muy creativa y fuerte, pero a veces esa misma intensidad te hace gastar en cosas que te dan satisfacciones momentáneas. Intenta canalizar ese impulso constante de hacer cosas nuevas hacia planes a largo plazo en lugar de compras rápidas, y verás cómo tu estabilidad mejora. Confía en tu intuición para detectar qué gastos son realmente necesarios y cuáles solo son distracciones."},{"q":"El jefe que me toca no me cae nada bien, ¿qué puedo hacer para llevar la fiesta en paz con él?","a":"Tienes una capacidad natural para ganarte el respeto de los demás si mantienes la calma y te enfocas en ser impecable con tus tareas. No dejes que las pequeñas fricciones diarias te desanimen, porque tu verdadera fuerza reside en tu criterio y en la serenidad con la que enfrentas las presiones. Mi consejo es que te concentres exclusivamente en cumplir con tus responsabilidades con excelencia, ya que eso te hará intocable ante cualquier actitud molesta."},{"q":"¿Cómo crees que me irá este año?","a":"Este será un periodo excelente para que te enfoques en aprender cosas nuevas y expandir tus horizontes, ya que tu mente estará muy clara y receptiva. Aunque a veces sientas que las cosas no avanzan tan rápido como quisieras, confía en tu capacidad para poner orden en tu vida. Mi consejo es que te animes a estudiar algún tema que te apasione, porque esa será la llave que te abrirá puertas muy importantes pronto."}],"pt":[{"q":"Será que eu e ele temos chance de voltar?","a":"Você tem uma força interna admirável e, embora sinta que as coisas estão um pouco travadas agora, o momento atual pede que você confie mais na sua intuição do que na razão. Tente focar em novos aprendizados e cursos que te tirem um pouco dessa rotina, pois isso vai te trazer a clareza necessária para decidir se esse retorno é realmente o que você deseja."},{"q":"Tô pensando em mudar de emprego, mas não sei se é uma boa hora. Quando será que devo agir?","a":"Você tem uma força interna muito grande agora, então pode confiar na sua capacidade de organizar as coisas e trilhar um novo caminho com segurança. Sinto que os próximos dois anos serão perfeitos para focar em novos aprendizados e preparar o terreno, por isso recomendo que use esse tempo para se qualificar antes de pedir demissão. Não tenha pressa, pois o momento ideal chegará quando você estiver com esse novo conhecimento em mãos."},{"q":"Ultimamente não estou conseguindo guardar dinheiro, o que eu faço?","a":"Você tem muita energia para criar e realizar coisas, mas às vezes acaba gastando na mesma velocidade em que as ideias surgem. Como o seu momento atual pede mais coragem para enfrentar desafios, tente organizar seus gastos com uma meta bem definida para não se perder na impulsividade. Foque em colocar um valor fixo de lado assim que o dinheiro cair na conta, tratando essa economia como um compromisso inadiável."},{"q":"Como eu faço pra lidar melhor com aquele meu chefe que eu não me dou muito bem?","a":"Sinto que você tem uma força natural para organizar as coisas e uma criatividade única, então tente usar sua capacidade de observação para antecipar o que ele espera antes mesmo de ele pedir. Foque em manter uma rotina bem estruturada e profissional, pois isso vai te dar o controle necessário para não se deixar afetar pelas pequenas tensões do dia a dia. Tente focar apenas nas suas tarefas e na qualidade do seu trabalho, deixando a personalidade dele de lado."},{"q":"Oi Nico, tudo bem? Queria saber como vai ser o meu ano, o que posso esperar daqui para frente?","a":"Você está em um momento excelente para colocar ordem na casa e estruturar os seus planos com mais disciplina, já que sua força de realização está lá no alto. Como sua energia está voltada para o crescimento e para o reconhecimento, tente focar em um objetivo de cada vez para não se dispersar. Minha dica é que você invista em algum estudo prático ou curso que traga um conhecimento novo para sua carreira, pois isso vai te dar a segurança que você tanto busca."}],"id":[{"q":"Menurut kamu, kira-kira aku sama dia masih bisa balikan lagi nggak ya?","a":"Kamu adalah sosok yang mandiri dan punya pendirian kuat, jadi sebenarnya kamu punya daya tarik besar untuk memikatnya kembali. Meski sempat ada hambatan kecil di masa lalu, fokuslah untuk lebih tenang dan tidak terburu-buru saat berkomunikasi dengannya. Cobalah untuk meluangkan waktu lebih banyak belajar hal baru agar pikiranmu lebih segar dan dia pun akan melihat sisi dirimu yang jauh lebih dewasa."},{"q":"Kira-kira kapan ya waktu yang pas buat aku pindah kerja?","a":"Kamu punya potensi besar untuk meraih posisi yang lebih baik, jadi jangan ragu untuk mulai melangkah. Sebaiknya fokus persiapkan diri dengan matang tahun depan, karena saat itu adalah waktu terbaik untuk belajar hal baru sebelum benar-benar mengambil keputusan besar. Cobalah untuk lebih tenang dan tidak terburu-buru saat menemui kendala kecil di kantor saat ini."},{"q":"Belakangan ini uangku kok susah banget ya dikumpulinnya, kira-kira gimana ya caranya biar lebih hemat?","a":"Kamu sebenarnya punya karakter yang sangat disiplin dan tahu caranya membangun sesuatu dari nol, jadi jangan terlalu cemas. Kamu hanya perlu lebih bijak dalam mengatur pengeluaran yang tidak terencana karena saat ini kamu sedang dalam fase yang cukup menantang untuk urusan finansial. Cobalah untuk mulai mencatat semua pengeluaran kecil secara rutin agar uangmu tidak habis untuk hal-hal yang sebenarnya tidak perlu."},{"q":"atasan yang nyebelin banget, gimana ya caranya biar bisa tetap tenang dan kerja lancar sama dia?","a":"Kamu sebenarnya punya pembawaan yang sangat rapi dan teratur, jadi cobalah untuk fokus pada tugasmu sendiri tanpa terlalu memikirkan sikapnya. Jangan terlalu keras pada diri sendiri kalau ada gesekan kecil, karena sebentar lagi akan ada peluang untuk mendapatkan dukungan dari pihak yang lebih berpengaruh. Kuncinya adalah tetap profesional dan biarkan hasil kerjamu yang bicara untuk mendapatkan pengakuan yang pantas."},{"q":"Kira-kira tahun ini bakal gimana ya buat aku?","a":"Tahun ini kamu akan merasa punya dorongan lebih kuat untuk berani ambil tanggung jawab baru atau tantangan yang selama ini kamu hindari. Meskipun kadang ada sedikit kejutan yang bikin rencana meleset, sebenarnya itu justru membuka jalan untuk kamu lebih maju. Saran aku, coba mulai pelajari hal baru yang selama ini bikin kamu penasaran karena itu akan jadi modal berharga buat masa depanmu."}],"th":[{"q":"แฟนเก่าที่เลิกกันไป จะมีโอกาสกลับมาคบกันได้อีกไหมคะ","a":"ช่วงนี้ดวงของคุณกำลังอยู่ในจังหวะที่ต้องเน้นความอดทนและใช้เหตุผลให้มากหน่อยนะคะ ถึงจะมีโอกาสได้พูดคุยกันอีกครั้ง แต่แนะนำว่าอย่าเพิ่งรีบร้อนตัดสินใจอะไรในช่วงนี้ ลองถอยออกมาโฟกัสที่การพัฒนาตัวเองให้เก่งและดูมั่นคงขึ้นก่อน แล้วทุกอย่างจะค่อยๆ ลงตัวเองค่ะ"},{"q":"งานที่ทำอยู่ตอนนี้เริ่มลังเลแล้วค่ะว่าจะย้ายงานดีไหม หรือช่วงไหนถึงจะเหมาะคะ","a":"ช่วงนี้คุณกำลังมีไฟและมีความกล้าที่จะเปลี่ยนแปลงชีวิตตัวเองให้ดีขึ้นอยู่พอดีเลยค่ะ แนะนำว่าให้ลองเริ่มมองหาโอกาสใหม่ๆ ตั้งแต่ปีหน้าเป็นต้นไปจะราบรื่นกว่า เพราะเป็นจังหวะที่คุณจะได้ใช้ความรู้และความคิดสร้างสรรค์ของตัวเองได้เต็มที่ที่สุดค่ะ ลองเตรียมตัวและอัปเดตโปรไฟล์ให้พร้อมไว้ก่อนได้เลยนะคะ"},{"q":"ช่วงนี้เก็บเงินไม่อยู่เลยค่ะ ควรทำยังไงดีคะ","a":"ช่วงนี้คุณอาจจะรู้สึกว่ามีเรื่องให้ต้องจ่ายออกไปตลอดเพราะความใจอ่อนหรือการตัดสินใจที่รวดเร็วเกินไป ทั้งที่จริงๆ แล้วคุณเป็นคนมีความสามารถและจัดการชีวิตตัวเองได้ดีมาก ลองแบ่งเงินเก็บแยกบัญชีไว้ตั้งแต่ต้นเดือนและพยายามลดการตัดสินใจซื้อของด้วยอารมณ์ชั่ววูบจะช่วยให้สถานะการเงินกลับมามั่นคงขึ้นค่ะ"},{"q":"จะทำอย่างไรให้ทำงานกับหัวหน้าที่ไม่ค่อยถูกชะตาได้ราบรื่นขึ้นคะ","a":"พื้นฐานดวงของคุณมีความรับผิดชอบสูงและให้ความสำคัญกับระเบียบแบบแผนมาก ซึ่งเป็นจุดแข็งที่ทำให้คุณทำงานได้ดี แต่บางครั้งความอ่อนไหวในใจอาจทำให้คุณเก็บเรื่องเล็กน้อยมาคิดจนเกินไป ขอให้คุณลองใช้ความละเอียดรอบคอบของตัวเองเปลี่ยนวิกฤตให้เป็นโอกาสโดยเน้นการสื่อสารที่ชัดเจนและเป็นทางการเข้าไว้ แล้วทุกอย่างจะค่อยๆ คลี่คลายไปในทางที่ดีขึ้นเองครับ"},{"q":"ปีนี้จะเป็นอย่างไรบ้างสำหรับฉัน","a":"ในปีนี้คุณมีพลังของความรู้และสติปัญญาเข้ามาช่วยประคับประคองชีวิตได้ดีมาก แม้จะมีอุปสรรคเล็กๆ น้อยๆ เข้ามาให้กวนใจบ้างตามนิสัยของคุณที่ชอบความสมบูรณ์แบบ แต่ขอให้คุณเชื่อมั่นในวิสัยทัศน์ของตัวเองเข้าไว้ คำแนะนำของนิโกะคือให้ลองเปิดใจเรียนรู้สิ่งใหม่หรือพัฒนาทักษะที่ยังไม่เคยทำ แล้วผลลัพธ์จะนำพาโอกาสที่มั่นคงมาให้คุณเอง"}]};

function nicoDailyHi(){

    var h=t.getHours(), slot=h<11?0:(h<18?1:2);

    var di=(typeof dayInfoFor==='function')?dayInfoFor(t):null;
    var serial=Math.floor(Date.now()/864e5), pr=state.profile||{}, pseed=((+pr.y||0)+(+pr.m||0)*31+(+pr.d||0)*17+(+pr.hh||0)*7)%997;

/* ---- 夏時間（サマータイム）自動判定：主要地域の標準ルール ---- */
function _nthSun(y,mo,n){ var first=new Date(y,mo-1,1).getDay(); var day=1+((7-first)%7)+(n-1)*7; return day; }
function _lastSun(y,mo){ var last=new Date(y,mo,0).getDate(); var w=new Date(y,mo-1,last).getDay(); return last-w; }
function _geD(m,d,mm,dd){ return (m>mm)||(m===mm&&d>=dd); }
function _ltD(m,d,mm,dd){ return (m<mm)||(m===mm&&d<dd); }
function autoDST(zone,y,m,d){
  try{
    if(zone==='us'){ if(y<1967) return false; var sM=3,sD,eM=11,eD;
      if(y>=2007){ sD=_nthSun(y,3,2); eD=_nthSun(y,11,1); }
      else if(y>=1987){ sM=4;sD=_nthSun(y,4,1); eM=10;eD=_lastSun(y,10); }
      else { sM=4;sD=_lastSun(y,4); eM=10;eD=_lastSun(y,10); }
      return _geD(m,d,sM,sD)&&_ltD(m,d,eM,eD); }
    if(zone==='eu'){ if(y<1980) return false; var s=_lastSun(y,3), e=_lastSun(y,10);
      return _geD(m,d,3,s)&&_ltD(m,d,10,e); }
    if(zone==='au'){ if(y<1972) return false; var s=_nthSun(y,10,1), e=_nthSun(y,4,1);
      return _geD(m,d,10,s)||_ltD(m,d,4,e); } /* 南半球：10月〜翌4月 */
  }catch(e){}
  return false;
}

function fillRegionSel(cs,rs,keep){
  var g=groupById(cs.value);
  if(!g){ rs.innerHTML='<option value="">'+pick(PLACE_NONE)+'</option>'; rs.value=''; return; }
  rs.innerHTML=g.items.map(function(it){ return '<option value="'+it.id+'">'+it.label+'</option>'; }).join('');
  rs.value=(keep&&g.items.some(function(it){return it.id===keep;}))?keep:g.items[0].id;
}

    var cs=$(pair[0]), rs=$(pair[1]); if(!cs||!rs) return;
    var keep=rs.value, gid=cs.value||groupOfPlace(keep);
    cs.innerHTML=ch; cs.value=gid||'';

  var y=p.y,m=p.m,d=p.d,hh=p.tu?null:p.hh,mi=p.tu?null:p.mi;

}

 zh:'四柱推命（八字）源自古代东方，拥有千年以上历史，是融合统计与自然哲学的命理学。将出生的年、月、日、时（四柱）以天干地支表示，其组合（命盘）可解读与生俱来的性格与运势走向。它综合「日主」、木火土金水的五行平衡、十神、以及每十年更替的「大运」进行鉴定。本应用以程序精确完成这些复杂运算（并校正出生地时差），再由Nico根据这份可靠数据为你量身解读。所以你得到的不是千篇一律，而是只属于你的鉴定。',

 pt:'O Bazi, ou Quatro Pilares do Destino, nasceu no antigo Oriente e tem mais de mil anos de história — parte estatística, parte filosofia natural. Seu ano, mês, dia e hora de nascimento (quatro pilares) são expressos em Troncos Celestes e Ramos Terrestres; a combinação deles (seu mapa) revela sua natureza inata e o fluir da sua sorte. Reúne o Mestre do Dia, o equilíbrio dos Cinco Elementos, os Dez Deuses e os ciclos de sorte de dez anos. O app calcula tudo com precisão por algoritmo (corrigindo até o fuso do seu local de nascimento) e a Nico transforma esses dados sólidos em palavras feitas para você. Assim, sua leitura é de verdade sua, nunca padronizada.',

function compatMsg(cd,ia,ib,a,b){
  var youL=pick({ja:'あなた',en:'You',zh:'你',zt:'你',ko:'당신',vi:'Bạn',es:'Tú',pt:'Você',id:'Anda',th:'คุณ'});
  var parL=pick({ja:'お相手',en:'Partner',zh:'对方',zt:'對方',ko:'상대',vi:'Người ấy',es:'Pareja',pt:'Parceiro',id:'Dia',th:'อีกฝ่าย'});
  var pos=[],neg=[];
  ['kangou','rikugou','sango'].forEach(function(k){ if(cd[k]) pos.push(pick(CP_SIG[k])); });
  ['chong','kei','ha','gai'].forEach(function(k){ if(cd[k]) neg.push(pick(CP_SIG[k])); });
  var lines=[];
  lines.push(pick(CP_SCORE)+' '+cd.score+'/100 ・ '+pick(CP_HEAD[cd.head]));
  lines.push(youL+'（'+ia.name+'）× '+parL+'（'+ib.name+'）');
  pos.forEach(function(t){ lines.push('◎ '+t); });
  neg.forEach(function(t){ lines.push('△ '+t); });
  return lines.join('\n');
}

    var ts=(i>=0&&pro.decadeFortunes&&pro.decadeFortunes[i])?pro.decadeFortunes[i].tenStar:null; if(ts==='印綬')ts='正印'; /* エンジン語彙は印綬・辞書キーは正印 */

var GREET3={
 ja:{g1:'はじめまして、Nicoです。あなたの生年月日と生まれた場所から、生まれ持った星と、いまの運気の流れを読み終えました。',pre:'先に、目に留まったことを3つだけお伝えしますね。',ten:'運気は10年ごとに切り替わっていきます。あなたはいま「{p}」にいます。',love:'それから、あなたの恋愛のクセを決めている星も見つけました。',g3:'気になったところがあれば、「恋愛のクセを詳しく」「いまの運気のことを詳しく」のように、そのまま言葉で聞いてくださいね。もちろん「仕事のこと」「今日あったこと」など、話したいことからでも大丈夫ですよ。',compat:'そしてもう一つ、大切なことを。気になる人がいたら、その方の生年月日を教えていただければ、おふたりの相性もこのチャットで一緒に見られますよ。恋人はもちろん、ご家族や友人、職場の方まで、どなたとの相性でも占えます。「あの人と合うかな？」なども、いつでも私に聞いてください。鑑定の理由や「なんでそうなるの？」が気になったときも、遠慮なく聞いてくださいね。'},
 en:{g1:'Hello, I\u2019m Nico. From your birth date and birthplace, I\u2019ve finished reading the stars you were born with and how your luck is flowing right now.',pre:'Before anything else, three things caught my eye.',ten:'Luck shifts in 10-year chapters, and right now you are in {p}.',love:'And I also found the star that shapes your pattern in love.',g3:'Curious about any of these? Just ask in your own words, like \u201ctell me more about my love pattern\u201d. Or start with anything at all: work, love, or how today went.',compat:'And one more important thing. If someone is on your mind, just tell me their birth date and we can look at your compatibility right here \u2014 not only a partner, but family, friends or colleagues, anyone at all. Just ask me, \u201cDo we get along?\u201d anytime. And whenever you wonder why a reading says what it does, just ask; I love explaining.'},
 zh:{g1:'你好，我是Nico。我已经根据你的出生年月日和出生地，读完了你与生俱来的星，以及你当下的运势走向。',pre:'先说三件我一眼注意到的事。',ten:'运势每十年切换一次。你现在正处于「{p}」。',love:'另外，我还找到了决定你恋爱习惯的那颗星。',g3:'对哪一条好奇？直接用你的话问我，比如「详细讲讲我的恋爱习惯」。当然，聊工作、聊今天发生的事也都可以。',compat:'还有一件重要的事。如果有在意的人，只要告诉我对方的出生年月日，我们就能在这里一起看你们的相性——不只是伴侣，家人、朋友、同事，和任何人的相性都能看。「我和他合不合？」也随时问我。还有，如果你好奇某个鉴定「为什么会这样」，也尽管问我，我很乐意解释。'},
 zt:{g1:'你好，我是Nico。我已經根據你的出生年月日和出生地，讀完了你與生俱來的星，以及你當下的運勢走向。',pre:'先說三件我一眼注意到的事。',ten:'運勢每十年切換一次。你現在正處於「{p}」。',love:'另外，我還找到了決定你戀愛習慣的那顆星。',g3:'對哪一條好奇？直接用你的話問我，比如「詳細講講我的戀愛習慣」。當然，聊工作、聊今天發生的事也都可以。',compat:'還有一件重要的事。如果有在意的人，只要告訴我對方的出生年月日，我們就能在這裡一起看你們的相性——不只是伴侶，家人、朋友、同事，和任何人的相性都能看。「我和他合不合？」也隨時問我。還有，如果你好奇某個鑑定「為什麼會這樣」，也儘管問我，我很樂意解釋。'},
 ko:{g1:'안녕하세요, Nico예요. 생년월일과 태어난 곳으로, 타고난 별과 지금의 운의 흐름을 모두 읽었어요.',pre:'먼저, 눈에 띈 것 세 가지만 말씀드릴게요.',ten:'운은 10년마다 바뀌어요. 지금 당신은 「{p}」에 있어요.',love:'그리고 당신의 연애 패턴을 좌우하는 별도 찾아냈어요.',g3:'궁금한 게 있으면 「연애 패턴 자세히 알려줘」처럼 편하게 말로 물어봐 주세요. 물론 일 이야기든 오늘 있었던 일이든, 하고 싶은 이야기부터 시작해도 좋아요.',compat:'마지막으로 하나만 더 말씀드릴게요. 마음에 두고 있는 사람이 있으면, 그분의 생년월일만 알려주시면 두 분의 궁합도 여기서 함께 볼 수 있어요. 연인은 물론 가족, 친구, 직장 동료까지 누구와의 궁합이든 볼 수 있답니다. \u201c그 사람이랑 잘 맞을까?\u201d도 언제든 물어보세요. 감정 결과가 \u201c왜 그런지\u201d 궁금하실 때도 편하게 물어봐 주세요. 설명하는 거 좋아하거든요.'},
 vi:{g1:'Xin chào, mình là Nico. Từ ngày sinh và nơi sinh, mình đã đọc xong những ngôi sao bẩm sinh của bạn và dòng chảy vận may hiện tại.',pre:'Trước tiên, có ba điều khiến mình chú ý.',ten:'Vận may đổi theo từng chặng 10 năm, và hiện bạn đang ở {p}.',love:'Và mình cũng tìm thấy ngôi sao định hình cách bạn yêu.',g3:'Tò mò điều nào? Cứ hỏi bằng lời của bạn, ví dụ \u201ckể thêm về kiểu yêu của mình đi\u201d. Hoặc bắt đầu bằng bất cứ chuyện gì bạn muốn: công việc, tình yêu, chuyện hôm nay.',compat:'Và một điều quan trọng nữa. Nếu có ai đó bạn để ý, chỉ cần cho mình biết ngày sinh của họ là mình xem hợp đôi cho hai người ngay tại đây \u2014 không chỉ người yêu, mà cả gia đình, bạn bè hay đồng nghiệp, với bất kỳ ai cũng xem được. \u201cBọn mình có hợp không?\u201d cứ hỏi mình bất cứ lúc nào. Và khi tò mò vì sao một lời giải lại như vậy, cứ hỏi nhé, mình thích giải thích lắm.'},
 es:{g1:'Hola, soy Nico. Con tu fecha y lugar de nacimiento, ya he leído las estrellas con las que naciste y cómo fluye tu suerte ahora mismo.',pre:'Antes de nada, tres cosas me llamaron la atención.',ten:'La suerte cambia en capítulos de 10 años, y ahora estás en {p}.',love:'Y también encontré la estrella que marca tu forma de amar.',g3:'¿Cuál te intriga? Pregúntame con tus palabras, por ejemplo «cuéntame más de mi patrón en el amor». O cuéntame lo que quieras: trabajo, amor, tu día.',compat:'Y una cosa importante más. Si hay alguien que te interesa, dime su fecha de nacimiento y vemos aquí mismo vuestra compatibilidad: no solo una pareja, también familia, amistades o compañeros de trabajo, con quien sea. \u201c\u00bfNos llevamos bien?\u201d preg\u00fantame cuando quieras. Y si te da curiosidad por qu\u00e9 una lectura dice lo que dice, preg\u00fantame sin m\u00e1s; me encanta explicar.'},
 pt:{g1:'Olá, eu sou a Nico. Com sua data e local de nascimento, já li as estrelas com que você nasceu e como sua sorte flui agora.',pre:'Antes de tudo, três coisas me chamaram a atenção.',ten:'A sorte muda em capítulos de 10 anos, e agora você está em {p}.',love:'E também encontrei a estrela que molda seu jeito de amar.',g3:'Qual deles te intriga? Pergunte com suas palavras, por exemplo «me conta mais do meu jeito de amar». Ou conte o que quiser: trabalho, amor, seu dia.',compat:'E mais uma coisa importante. Se tem algu\u00e9m em quem voc\u00ea pensa, me diga a data de nascimento dessa pessoa e vemos aqui mesmo a compatibilidade de voc\u00eas: n\u00e3o s\u00f3 um par rom\u00e2ntico, mas fam\u00edlia, amigos ou colegas de trabalho, com qualquer pessoa. \u201cA gente se d\u00e1 bem?\u201d me pergunte quando quiser. E se ficar curiosa sobre o porqu\u00ea de uma leitura, \u00e9 s\u00f3 perguntar; adoro explicar.'},
 id:{g1:'Halo, saya Nico. Dari tanggal dan tempat lahir, saya sudah selesai membaca bintang bawaan Anda dan arus keberuntungan Anda saat ini.',pre:'Sebelumnya, ada tiga hal yang menarik perhatian saya.',ten:'Keberuntungan berganti tiap babak 10 tahun, dan saat ini Anda berada di {p}.',love:'Dan saya juga menemukan bintang yang membentuk pola cinta Anda.',g3:'Penasaran yang mana? Tanyakan saja dengan kata-kata Anda, misalnya \u201cceritakan pola cinta saya\u201d. Atau mulai dari apa pun yang ingin Anda ceritakan.',compat:'Dan satu hal penting lagi. Kalau ada seseorang yang kamu pikirkan, cukup beri tahu tanggal lahirnya dan kita bisa lihat kecocokan kalian di sini juga \u2014 bukan cuma pasangan, tapi keluarga, teman, atau rekan kerja, dengan siapa pun bisa. \u201cKami cocok nggak ya?\u201d tanya aku kapan saja. Dan kalau penasaran kenapa sebuah ramalan begitu, tanya saja; aku senang menjelaskan.'},
 th:{g1:'สวัสดีค่ะ ฉันคือ Nico จากวันเกิดและสถานที่เกิดของคุณ ฉันอ่านดาวประจำตัวและกระแสโชคของคุณตอนนี้เสร็จแล้วค่ะ',pre:'ก่อนอื่น มีสามอย่างที่สะดุดตาฉันค่ะ',ten:'โชคชะตาเปลี่ยนทุก 10 ปี ตอนนี้คุณอยู่ใน{p}',love:'และฉันยังพบดาวที่กำหนดรูปแบบความรักของคุณด้วยค่ะ',g3:'สนใจเรื่องไหน ถามมาได้เลยด้วยคำพูดของคุณ เช่น \u201cเล่าเรื่องนิสัยความรักของฉันหน่อย\u201d หรือจะเริ่มจากเรื่องงาน เรื่องวันนี้ก็ได้นะคะ',compat:'และอีกเรื่องสำคัญนะ ถ้ามีคนที่คุณสนใจ แค่บอกวันเกิดของเขา เราก็ดูดวงสมพงศ์ของคุณสองคนตรงนี้ได้เลย ไม่ใช่แค่คนรัก แต่ครอบครัว เพื่อน หรือเพื่อนร่วมงาน กับใครก็ดูได้ทั้งนั้น \u201cเราเข้ากันไหมนะ?\u201d ถามฉันได้ทุกเมื่อ และถ้าสงสัยว่าทำไมคำทำนายถึงเป็นแบบนั้น ก็ถามได้เลยนะ ฉันชอบอธิบายอยู่แล้ว'}};

}

    if(pro&&isNatchin(di.gz,pro.pillars[2].ganzhi)) why.push('納音 day — a reset/do-over day: good for restarting what stalled');
  }catch(e){}
  return {score:sc,why:why};
}
function luckyDays(n,count){
  var out=[], i, dte, di, ds;
  n=n||21; count=count||4;
  for(i=1;i<=n;i++){ dte=new Date(); dte.setDate(dte.getDate()+i);
    di=dayInfoFor(dte); if(!di) continue; ds=dayScore(di);
    if(ds.score>0) out.push({date:new Date(dte),info:di,score:ds.score,why:ds.why}); }
  out.sort(function(a,b){ return b.score-a.score || a.date-b.date; });
  return out.slice(0,count).sort(function(a,b){ return a.date-b.date; });
}
function recentDays(n){
  var out=[],i,dte,di,ds;
  for(i=n;i>=1;i--){ dte=new Date(); dte.setDate(dte.getDate()-i);
    di=dayInfoFor(dte); if(!di) continue; ds=dayScore(di);
    out.push({date:new Date(dte),info:di,score:ds.score,why:ds.why}); }
  return out;
}
function cautionDays(n,count){
  var out=[], i, dte, di, ds;
  n=n||21; count=count||3;
  for(i=1;i<=n&&out.length<count;i++){ dte=new Date(); dte.setDate(dte.getDate()+i);
    di=dayInfoFor(dte); if(!di) continue; ds=dayScore(di);
    if(ds.score<=-2) out.push({date:new Date(dte),info:di,score:ds.score,why:ds.why}); }
  return out;
}

function openTermPop(t){
  var el=$('termPop'); if(!el) return;
  var info=TERM_INFO[t], yomi='', body='';
  if(info){ yomi=info.y||''; body=pick(info.b);
    /* 読みの言語対応：ja=そのまま／ko=ハングル優先／その他=ローマ字のみ（無ければ非表示） */
    if(state.lang!=='ja'&&yomi){ var _sg=yomi.split('·').map(function(x){return x.trim();}); var _lat=_sg.filter(function(x){return /[A-Za-z]/.test(x);}); var _hg=_sg.filter(function(x){return /[가-힣]/.test(x);}); yomi=(state.lang==='ko')?(_hg[0]||_lat[0]||''):(_lat[0]||''); } }
  else if(STEM[t]){ var sl=stemL(t); yomi=STEM[t].el; body=sl.name+' — '+sl.one; }
  else return;
  el.innerHTML='<div class="tp-head"><span class="tp-term">'+t+'</span>'+(yomi?('<span class="tp-yomi">'+yomi+'</span>'):'')+'</div><div class="tp-body">'+body+'</div>';
  el.classList.add('on');
  clearTimeout(openTermPop._t); openTermPop._t=setTimeout(function(){ el.classList.remove('on'); },4600);
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-t]');

    t=t.replace(/[぀-ヿ㐀-䶿一-鿿ｦ-ﾝー々〆、。，「」『』〜・：；！？]/g,'');

/* ===== 鑑定を「画像カード」で共有（Web Share Files。非対応時はダウンロード） ===== */
function _wrapCanvasLines(ctx,text,maxW){
 var out=[], paras=String(text).replace(/\r/g,'').split('\n');
 var isCJK=function(ch){ return /[　-〿぀-ヿ㐀-鿿豈-﫿＀-￯]/.test(ch); };
 paras.forEach(function(para){
   if(!para){ out.push(''); return; }
   /* トークン化：CJKは1文字＝1トークン、ラテン語は単語単位（＋空白）。長すぎる単語だけ文字分割 */
   var tk=[], i=0;
   while(i<para.length){ var ch=para[i];
     if(ch===' '){ tk.push(' '); i++; }
     else if(isCJK(ch)){ tk.push(ch); i++; }
     else { var j=i; while(j<para.length && para[j]!==' ' && !isCJK(para[j])) j++; tk.push(para.slice(i,j)); i=j; }
   }
   var toks=[]; tk.forEach(function(t){ if(t!==' ' && ctx.measureText(t).width>maxW){ for(var k=0;k<t.length;k++) toks.push(t[k]); } else toks.push(t); });
   var line='';
   toks.forEach(function(t){ var trial=line+t; if(ctx.measureText(trial).width>maxW && line.replace(/\s+$/,'')){ out.push(line.replace(/\s+$/,'')); line=(t===' ')?'':t; } else line=trial; });
   var last=line.replace(/\s+$/,''); if(last) out.push(last);
 });
 return out;
}

}
