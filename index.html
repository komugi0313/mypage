<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易経 AIカウンセラー</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0e0e14;
  --surface:#16161f;
  --surface2:#1e1e2a;
  --border:#32324a;
  --purple:#7c6af5;
  --purple-light:#a89cf7;
  --purple-dark:#4a3fa0;
  --gold:#c9a84c;
  --text:#e8e6f0;
  --text2:#c8c6d8;
  --text3:#8a8899;
  --green:#4caf82;
  --red:#e05b5b;
  --radius:10px;
}
body{
  font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:0;
}
.app{max-width:520px;margin:0 auto;padding:0 0 60px;}

/* ヘッダー */
.header{
  text-align:center;
  padding:40px 20px 24px;
  border-bottom:0.5px solid var(--border);
  background:linear-gradient(180deg,#12101e 0%,var(--bg) 100%);
}
.header-symbol{font-size:36px;margin-bottom:8px;letter-spacing:6px;color:var(--gold);}
.header h1{font-size:13px;font-weight:400;letter-spacing:.3em;color:var(--text2);text-transform:uppercase;}
.header p{font-size:16px;color:var(--text2);margin-top:8px;letter-spacing:.08em;line-height:1.8;}

/* APIキー入力 */
.api-section{
  margin:20px 16px;
  background:var(--surface);
  border:0.5px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
}
.api-label{font-size:11px;color:var(--text2);letter-spacing:.1em;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.api-label span{background:var(--purple-dark);color:var(--purple-light);font-size:10px;padding:2px 8px;border-radius:20px;}
.api-input-row{display:flex;gap:8px;}
.api-input{
  flex:1;background:var(--bg);border:0.5px solid var(--border);border-radius:6px;
  padding:9px 12px;font-size:13px;color:var(--text);font-family:monospace;
  outline:none;
}
.api-input:focus{border-color:var(--purple);}
.api-input::placeholder{color:var(--text3);}
.api-save-btn{
  background:var(--purple);color:#fff;border:none;border-radius:6px;
  padding:9px 16px;font-size:13px;cursor:pointer;white-space:nowrap;
}
.api-save-btn:hover{background:var(--purple-light);}
.api-status{font-size:11px;margin-top:6px;height:16px;}
.api-ok{color:var(--green);}
.api-ng{color:var(--red);}

/* セクション */
.section{margin:0 16px 16px;}
.section-label{
  font-size:13px;letter-spacing:.1em;color:var(--text);
  margin-bottom:10px;
  display:flex;align-items:center;gap:8px;font-weight:500;
}
.section-label::before{
  content:'';display:inline-block;width:16px;height:0.5px;background:var(--text2);
}
.step-num{
  background:var(--purple-dark);color:var(--purple-light);
  font-size:10px;padding:2px 7px;border-radius:20px;letter-spacing:.1em;
}

/* テキストエリア */
textarea{
  width:100%;background:var(--surface);border:0.5px solid var(--border);
  border-radius:var(--radius);padding:14px;font-size:14px;color:var(--text);
  font-family:inherit;line-height:1.7;resize:none;outline:none;
  transition:border-color .2s;
}
textarea:focus{border-color:var(--purple);}
textarea::placeholder{color:var(--text3);}
.q-hint{font-size:13px;color:var(--text);text-align:right;margin-top:6px;font-weight:500;letter-spacing:.1em;}

/* メソッド選択 */
.method-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.method-btn{
  background:var(--surface);border:0.5px solid var(--border);
  border-radius:var(--radius);padding:12px;text-align:center;cursor:pointer;
  transition:all .2s;
}
.method-btn.active{border-color:var(--purple);background:rgba(124,106,245,.12);}
.method-btn .mb-icon{font-size:20px;margin-bottom:4px;}
.method-btn .mb-title{font-size:13px;font-weight:500;color:var(--text);}
.method-btn .mb-sub{font-size:11px;color:var(--text3);margin-top:2px;}

/* ダイスエリア */
.dice-area{
  background:var(--surface);border:0.5px solid var(--border);
  border-radius:var(--radius);padding:16px;
}
canvas#diceCV{display:block;margin:0 auto;cursor:pointer;}
.dice-label{text-align:center;font-size:13px;font-weight:500;color:var(--text);margin:8px 0 2px;}
.dice-hint{text-align:center;font-size:11px;color:var(--text3);margin-bottom:10px;}
.roll-btn{
  width:100%;padding:12px;border-radius:8px;font-size:14px;font-weight:500;
  cursor:pointer;background:rgba(124,106,245,.15);color:var(--purple-light);
  border:0.5px solid var(--purple-dark);letter-spacing:.05em;transition:all .2s;
}
.roll-btn:hover{background:rgba(124,106,245,.25);}

/* 手入力グリッド */
.manual-grid-title{font-size:12px;color:var(--text2);text-align:center;margin-bottom:8px;}
.grid8{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.pick-btn{
  padding:10px 4px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;
  background:var(--surface2);color:var(--text2);border:0.5px solid var(--border);
  text-align:center;line-height:1.4;transition:all .15s;
}
.pick-btn:hover{border-color:var(--purple);color:var(--purple-light);}
.pick-btn:active{background:rgba(124,106,245,.2);}
/* 第1投：赤枠・赤文字 */
.pick-btn-red{border:2px solid #c04828;color:#e06040;}
.pick-btn-red:hover{border-color:#e05030;color:#ff7050;background:rgba(192,72,40,.15);}
/* 第2投：黒枠・赤文字 */
.pick-btn-black{border:2px solid #555570;color:#4a7fc0;}
.pick-btn-black:hover{border-color:#7777aa;color:#6aa0e0;background:rgba(80,80,120,.2);}

/* ロールログ */
.roll-log{display:flex;flex-direction:column;gap:6px;}
.log-row{
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:var(--surface);border-radius:8px;font-size:13px;
  border:0.5px solid var(--border);
}
.log-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

/* 鑑定ボタン行 */
.go-row{display:flex;align-items:center;gap:10px;}
.go-row-wrap{
  background:rgba(124,106,245,.08);
  border:1.5px solid var(--purple-light);
  border-radius:12px;
  padding:14px;
  margin-bottom:8px;
}
.go-btn{
  flex:1;padding:15px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;
  background:linear-gradient(135deg,var(--purple),var(--purple-dark));
  color:#fff;border:2px solid rgba(255,255,255,0.35);letter-spacing:.1em;transition:all .2s;
}
.go-btn:hover:not(:disabled){opacity:.9;transform:translateY(-1px);}
.go-btn:disabled{background:var(--surface2);color:#7a78a0;cursor:not-allowed;transform:none;border:2px solid rgba(255,255,255,0.1);font-weight:700;letter-spacing:.15em;}

/* 吉凶バッジ（ボタン横） */
.kk-main{
  display:none;flex-shrink:0;width:48px;height:48px;border-radius:10px;
  font-size:22px;font-weight:700;align-items:center;justify-content:center;
}
.kk-A{background:#0a2a1e;color:#4caf82;}
.kk-B{background:#0a1830;color:#5b9fd4;}
.kk-C{background:#1a1040;color:#a89cf7;}
.kk-D{background:#2a1a00;color:#c9a84c;}
.kk-E{background:#2a0a0a;color:#e05b5b;}

/* ローディング */
.loading-area{
  background:var(--surface);border:0.5px solid var(--border);
  border-radius:var(--radius);padding:40px 20px;text-align:center;
}
.loading-symbol{font-size:40px;color:var(--gold);animation:spin 3s linear infinite;}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--text2);margin-top:12px;letter-spacing:.1em;}

/* 結果カード */
.result-card{
  background:var(--surface);border:0.5px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
}
.result-head{
  background:linear-gradient(135deg,#1a1630,#0e0e14);
  padding:16px;display:flex;align-items:center;gap:14px;
  border-bottom:0.5px solid var(--border);
}
.hex-lines{display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
.hl{height:5px;border-radius:2px;background:var(--gold);width:44px;}
.hlb{display:flex;gap:5px;width:44px;}
.hlb span{flex:1;height:5px;border-radius:2px;background:var(--gold);}
.hex-info{flex:1;}
.hex-no-label{font-size:15px;color:var(--text2);letter-spacing:.1em;margin-bottom:4px;}
.hex-nm-row{display:flex;align-items:center;gap:8px;margin:4px 0;}
.hex-nm{font-size:22px;font-weight:600;color:var(--gold);}
.kk-sm{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:6px;font-size:13px;font-weight:700;
}
.hex-rd{font-size:14px;color:var(--text2);margin-top:2px;}

.ai-response{
  font-size:15px;color:var(--text);line-height:2;
  word-break:break-word;
}
.ai-section{padding:16px 20px;border-bottom:0.5px solid var(--border);}
.ai-section:last-child{border-bottom:none;}
.ai-empathy{background:rgba(124,106,245,.06);}
.ai-hexmeaning{background:var(--surface);}
.ai-koteaching{background:rgba(78,180,180,.08);border-left:3px solid #4eccc0;}
.ai-advice{background:rgba(61,184,122,.05);}
.ai-message{background:rgba(201,168,76,.08);}
.ai-sec-label{
  font-size:11px;font-weight:600;letter-spacing:.12em;
  color:var(--text2);margin-bottom:10px;
  font-family:'Helvetica Neue',sans-serif;text-transform:uppercase;
}
.ai-sec-body{
  font-size:15px;color:var(--text);line-height:2;
  word-break:break-word;letter-spacing:.03em;
}
.ai-sec-body ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;}
.ai-sec-body li{
  padding:10px 14px 10px 38px;background:var(--surface2);border-radius:8px;
  font-size:15px;color:var(--text);line-height:1.8;position:relative;
}
.ai-sec-body li::before{
  content:'✓';position:absolute;left:12px;top:10px;
  color:var(--green);font-weight:bold;font-size:14px;
}
.quote-strip{
  border-left:2px solid var(--gold);padding:12px 16px;
  background:rgba(201,168,76,.07);margin:0 16px 16px;border-radius:0 8px 8px 0;
}
.quote-strip p{font-size:12px;color:var(--gold);font-style:italic;line-height:1.7;}
.quote-strip span{font-size:11px;color:var(--text3);display:block;margin-top:4px;}

/* リセットボタン */
.reset-btn{
  width:100%;padding:13px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;
  background:transparent;color:var(--text2);border:0.5px solid var(--border);
  letter-spacing:.05em;transition:all .2s;
}
.reset-btn:hover{border-color:var(--purple);color:var(--purple-light);}

/* エラー */
.error-box{
  background:rgba(224,91,91,.1);border:0.5px solid var(--red);
  border-radius:8px;padding:12px 14px;font-size:13px;color:var(--red);margin-top:12px;
}

.hidden{display:none!important;}
</style>
</head>
<body>
<div class="app">

  <!-- ヘッダー -->
  <div class="header">
    <div class="header-symbol">☯ 易 ☯</div>
    <h1>I Ching AI Counselor</h1>
    <p>天地は何を語るのか。易経は3000年、その問いに答え続けている——</p>
  </div>

  <!-- APIキー -->
  <div class="api-section">
    <div class="api-label">
      Gemini API Key
      <span>Gemini 1.5 Flash</span>
    </div>
    <div class="api-input-row">
      <input type="password" class="api-input" id="apiKeyInput" placeholder="AIza...">
      <button class="api-save-btn" onclick="saveApiKey()">保存</button>
    </div>
    <div class="api-status" id="apiStatus"></div>
  </div>

  <!-- Phase: 入力 -->
  <div id="phaseInput">

    <!-- Step1 -->
    <div class="section">
      <div class="section-label"><span class="step-num">STEP 1</span> 悩みを書いてください</div>
      <textarea id="qinput" rows="4" placeholder="例：転職すべきか迷っています。今の職場に不満があるのですが…"></textarea>
      <div class="q-hint">どんな悩みでも構いません</div>
    </div>

    <!-- Step2 -->
    <div class="section">
      <div class="section-label"><span class="step-num">STEP 2</span> 卦の求め方を選ぶ</div>
      <div class="method-row">
        <div class="method-btn active" id="btnShake" onclick="setMethod('shake')">
          <div class="mb-icon">🎲</div>
          <div class="mb-title">シェイク</div>
          <div class="mb-sub">スマホを振る</div>
        </div>
        <div class="method-btn" id="btnManual" onclick="setMethod('manual')">
          <div class="mb-icon">✋</div>
          <div class="mb-title">手入力</div>
          <div class="mb-sub">実物サイコロ</div>
        </div>
      </div>
    </div>

    <!-- Step3 -->
    <div class="section">
      <div class="section-label"><span class="step-num">STEP 3</span> <span id="step3txt">第1投 — 赤いダイス（上卦）</span></div>
      <div class="dice-area">
        <div id="shakeUI">
          <canvas id="diceCV" width="180" height="190"></canvas>
          <div class="dice-label" id="diceLabel">タップして振る</div>
          <div class="dice-hint">スマホをシェイクしても振れます</div>
          <button class="roll-btn" onclick="doRoll()">🔄 想いを念じて振ってください</button>
        </div>
        <div id="manualUI" class="hidden">
          <div class="manual-grid-title" id="manualTitle">第1投（赤・上卦）— 出た目を選んでください</div>
          <div id="manualGrid"></div>
        </div>
      </div>
    </div>

    <!-- ロールログ -->
    <div class="section">
      <div class="roll-log" id="rollLog"></div>
    </div>

    <!-- Step4 -->
    <div class="section">
      <div class="section-label"><span class="step-num">STEP 4</span> 鑑定する</div>
      <div class="go-row-wrap">
        <div class="go-row">
          <button class="go-btn" id="goBtn" onclick="startReading()" disabled>✦ 鑑定する（3投完了後）</button>
          <div class="kk-main" id="kkMain"></div>
        </div>
      </div>
      <div id="errorBox" class="error-box hidden"></div>
    </div>

  </div><!-- /phaseInput -->

  <!-- Phase: ローディング -->
  <div id="phaseLoading" class="section hidden">
    <div class="loading-area">
      <div class="loading-symbol">☯</div>
      <div class="loading-text" id="loadingText">卦を読み解いています…</div>
    </div>
  </div>

  <!-- Phase: 結果 -->
  <div id="phaseResult" class="section hidden">
    <div class="result-card">
      <div class="result-head">
        <div class="hex-lines" id="resLines"></div>
        <div class="hex-info">
          <div class="hex-no-label" id="resNo"></div>
          <div class="hex-nm-row">
            <div class="hex-nm" id="resNm"></div>
            <div class="kk-sm" id="kkSm"></div>
          </div>
          <div class="hex-rd" id="resRd"></div>
        </div>
      </div>
      <div class="ai-response" id="aiResponse"></div>
      <div class="quote-strip">
        <p id="quoteP"></p>
        <span id="quoteSrc"></span>
      </div>
    </div>
    <div style="margin-top:12px;">
      <button class="reset-btn" onclick="resetAll()">🔄 別の問いで鑑定する</button>
    </div>
  </div>

</div><!-- /app -->

<script>
// ===== 八卦データ =====
const TG=[
  {n:1,k:"天",r:"テン",l:[1,1,1]},{n:2,k:"沢",r:"タク",l:[0,1,1]},
  {n:3,k:"火",r:"カ",  l:[1,0,1]},{n:4,k:"雷",r:"ライ",l:[0,0,1]},
  {n:5,k:"風",r:"フウ",l:[1,1,0]},{n:6,k:"水",r:"スイ",l:[0,1,0]},
  {n:7,k:"山",r:"サン",l:[1,0,0]},{n:8,k:"地",r:"チ",  l:[0,0,0]},
];

// ===== 吉凶ランク =====
const HEXKK={
  "1-1":"B","8-8":"B","6-4":"E","7-6":"E","6-1":"C","1-6":"D","8-6":"B","6-8":"B",
  "5-1":"C","1-2":"C","8-1":"B","1-8":"E","1-3":"A","3-1":"A","8-7":"C","4-8":"B",
  "2-4":"C","7-5":"E","8-2":"A","5-8":"B","3-4":"C","7-3":"B","7-8":"E","8-4":"B",
  "1-4":"D","7-1":"A","7-4":"C","2-5":"D","6-6":"E","3-3":"C","2-7":"B","4-5":"B",
  "1-7":"C","4-1":"C","8-3":"A","3-8":"D","5-3":"B","3-2":"D","6-7":"E","4-6":"B",
  "7-2":"B","5-4":"A","2-1":"D","1-5":"D","2-8":"A","8-5":"A","2-6":"E","6-5":"B",
  "2-3":"B","3-5":"A","4-4":"C","7-7":"C","5-7":"B","4-2":"C","4-3":"B","3-7":"D",
  "5-5":"B","2-2":"C","5-6":"C","6-2":"C","5-2":"A","4-7":"C","6-3":"C","3-6":"C"
};
const KK_CLASS={A:"kk-A",B:"kk-B",C:"kk-C",D:"kk-D",E:"kk-E"};

// ===== 64卦データ（全卦） =====
const HEXDB={
"1-1":{no:1,nm:"乾為天",rd:"けんいてん",theme:"前向きに一所懸命頑張る時",qt:"乾。元亨利貞。",src:"乾卦",unsei_txt:"天高く大宇宙の元気が満ち満ちており、活気と勢いがあります。万事に前向きに高い目標を持って人生を邁進しましょう。驕らず周囲の人の意見を聞いて余裕を持ち、バランスを取って進んでいきましょう。",ko:{1:{jd:"潜龍勿用",tai:"今は自分の力をひけらかしてはならない。じっと我慢して力を蓄えましょう。"},2:{jd:"見龍在田。利見大人",tai:"上司や見識ある人の指導を謙虚に受けましょう。◎良い時です。"},3:{jd:"君子終日乾乾",tai:"本業に専念して頑張りましょう。粘りと気配りが大切です。"},4:{jd:"或躍在淵",tai:"焦らず分限を守って慎重に行動しましょう。目標はもう一歩。"},5:{jd:"飛龍在天。利見大人",tai:"時と所を得てまさに絶好調の時です。◎大変良い時です。"},6:{jd:"亢龍有悔",tai:"昇りすぎた龍は必ず後悔する。これ以上進めばバランスを失います。"}}},
"8-8":{no:2,nm:"坤為地",rd:"こんいち",theme:"一歩下がって進む時",qt:"坤。元亨。利牝馬之貞。",src:"坤卦",unsei_txt:"坤地の時は大いに通じる。牝馬のように貞正であれば良い。裏方や女房役でも夫婦として協力し合うことが成功しやすい時。一歩下がって人の意見に従った方が成功しやすいです。",ko:{1:{jd:"履霜堅氷至",tai:"薄い霜も思いもよらず厚い氷になる。早期発見、早期治療がポイント。"},2:{jd:"直方大。不習无利",tai:"今後も坤地の精神でまっすぐ素直に進みましょう。◎良い時です。"},3:{jd:"含章可貞",tai:"才能をひけらかさず貞正にしておくことだ。くさらず本分を全うすること。"},4:{jd:"括嚢。无咎无誉",tai:"袋の口をくくるように、発言に注意し、散財を控え、平々凡々と過ごすことだ。"},5:{jd:"黄裳元吉",tai:"坤地の精神を見事に実践している姿。◎大変良い時です。"},6:{jd:"龍戦于野",tai:"坤地の精神を忘れ、上へ上へと突き進み、戦い傷ついた姿です。"}}},
"6-4":{no:3,nm:"水雷屯",rd:"すいらいちゅん",theme:"生みの苦しみに耐え忍ぶ時",qt:"屯。元亨利貞。",src:"屯卦",unsei_txt:"屯は伸び悩むこと。春先に厚く積もった雪の下から若芽が必死に芽を出そうとしている姿です。今はタイミングが悪いのです。動かずじっと我慢の時です。",ko:{1:{jd:"磐桓。利貞。利建侯",tai:"大きな石のようにどっしりと動かずに貞正を守るのが良い。現状で努力することです。"},2:{jd:"屯如邅如",tai:"いろいろ文句も出るが問題はない。苦しくも安定方向を選ばないこと。"},3:{jd:"即鹿无虞",tai:"深い所には行かないことです。◎あなたの考え方、進み方に問題点があります。"},4:{jd:"乗馬班如。求婚媾",tai:"協力が大切な時に、人に求められて行なうことぐらいは良い。"},5:{jd:"屯其膏。小貞吉。大貞凶",tai:"小さい事は吉、大きな事は凶。大きな事に手を出さないこと。"},6:{jd:"乗馬班如。泣血漣如",tai:"孤立無援の状態でしかし、悲しみのどん底の今を耐え抜けば道が開けてきます。"}}},
"7-6":{no:4,nm:"山水蒙",rd:"さんすいもう",theme:"先が朦朧として見えない時",qt:"蒙。亨。匪我求童蒙。童蒙求我。",src:"蒙卦",unsei_txt:"蒙とは文字どおり朦朧としていること。良い先生を求めて、学問や稽古ごとに励んで教養を高めることです。あなたは未知数の子どもの状態です。",ko:{1:{jd:"発蒙。利用刑人",tai:"物事の始めに対して厳しい態度が良い。限度は知っておくことを。"},2:{jd:"包蒙吉。納婦吉",tai:"包容して理解のわからない者を包容し、良い指導者の態度です。◎良い時です。"},3:{jd:"勿用取女",tai:"金銭のトラブルに巻き込まれないよう注意することです。"},4:{jd:"困蒙。吝",tai:"人の忠告もろくに聞かないからです。教養を高めることです。"},5:{jd:"童蒙吉",tai:"何事も学び取ろうとする素直な態度があなたをぐんぐん成長させます。◎良い時です。"},6:{jd:"撃蒙",tai:"この者が他人に対して迷惑とならないように言動に注意する時です。今は守りの姿勢で過ごすこと。"}}},
"6-1":{no:5,nm:"水天需",rd:"すいてんじゅ",theme:"今はとにかく待つ時",qt:"需。有孚光亨。貞吉。",src:"需卦",unsei_txt:"需は待つこと。水天需の時は、待てば必ず来る。焦ったり、急進してはなりません。静観しつつ、常日頃実力や知識を磨き、将来大川を渡るための準備をする時なのです。",ko:{1:{jd:"需于郊",tai:"今までのやり方を守って、心を動かさない時です。今は中心から遠く離れて待つことです。"},2:{jd:"需于沙。小有言。終吉",tai:"少々ゴタゴタがあっても、最終的には吉。口論は避け動揺しないことです。"},3:{jd:"需于泥。致寇至",tai:"じたばたせず、息を殺して待つことです。◎あなたの考え方、進み方に問題点があります。"},4:{jd:"需于血。出自穴",tai:"困難の真っただ中、力強い援助がある時です。脱出の時までじっと待ちましょう。"},5:{jd:"需于酒食。貞吉",tai:"間もなく、待望の渡し舟が到着します。英気を養って、心安らかに悠々と待つことです。◎大変良い時です。"},6:{jd:"入于穴。有不速之客三人来",tai:"思わぬ人から思わぬ援助が得られます。受身に徹すること。"}}},
"1-6":{no:6,nm:"天水訟",rd:"てんすいしょう",theme:"訴え争いごとの多い時",qt:"訟。有孚窒惕中吉。終凶。",src:"訟卦",unsei_txt:"天水訟の時は激しい対立や争いごとのある時です。あなたのほうから折れて和解策に転じる心構えが賢明です。強引なやり方は改めること。",ko:{1:{jd:"不永所事。小有言。終吉",tai:"争いを早めに避けるほうが利口です。小さな事にはこだわらないこと。"},2:{jd:"不克訟。帰而逋",tai:"勝ち目もないのに勢いに任せて強引に主張することを慎むこと。"},3:{jd:"食旧徳。貞厉吉",tai:"今まで行なってきた事が平凡でも一番良い時です。移り気は良くありません。"},4:{jd:"不克訟。復即命",tai:"目上の人に従おう。"},5:{jd:"訟元吉",tai:"正義のために堂々と戦って勝利を収める時です。◎良い時です。"},6:{jd:"或錫之鞶帯。終朝三褫之",tai:"労して功無しの時です。◎あなたの考え方、進み方に問題点があります。"}}},
"8-6":{no:7,nm:"地水師",rd:"ちすいし",theme:"良き指導者と戦争に向かう時",qt:"師。貞。丈人吉。无咎。",src:"師卦",unsei_txt:"地水師の時は、職場でも家庭でも争い事が多く苦労の絶えない時です。大義名分と集団をまとめるしっかりした指導者が必要です。",ko:{1:{jd:"師出以律",tai:"規律が守られなければ凶。まず、規律を正すことです。"},2:{jd:"在師中吉",tai:"大いに能力を発揮できる時です。◎良い時です。"},3:{jd:"師或輿尸。凶",tai:"負け戦は見えています。◎あなたの考え方、進み方に問題点があります。"},4:{jd:"師左次",tai:"退却も立派な戦の道です。今は一歩退いて静観すること。"},5:{jd:"田有禽。利執言",tai:"優れた人物はよく軍を率いる。妨害の多い時です。"},6:{jd:"大君有命",tai:"功労があっても責任ある立場につける人物は、良く選ぶことです。"}}},
"6-8":{no:8,nm:"水地比",rd:"すいちひ",theme:"仲良く和気あいあいと進む時",qt:"比。吉。原筮元永貞。无咎。",src:"比卦",unsei_txt:"水地比の時は吉。人との関係の良い時ですから、交際する人の選択には注意しましょう。機先を制して友人を選んでいくことのほうが大切です。",ko:{1:{jd:"有孚比之无咎",tai:"あなたの飾らぬ真心、努力が人を動かし、予想外の喜びが訪れる時です。◎良い時です。"},2:{jd:"比之内。貞吉",tai:"あなたの方から誠意を尽くして親交を求めるなら、良い援助の得られる時です。◎良い時です。"},3:{jd:"比之匪人",tai:"得体の知れない者ばかりと親しくする。◎あなたの考え方、進み方に問題点があります。"},4:{jd:"外比之。貞吉",tai:"目上の助力を求めよ。◎良い時です。"},5:{jd:"顕比",tai:"寛大な気持ちで接することが大切です。腹八分目を心がけましょう。"},6:{jd:"比之无首。凶",tai:"◎あなたの考え方、進み方に問題点があります。"}}},
"5-1":{no:9,nm:"風天小畜",rd:"ふうてんしょうちく",theme:"渋滞に巻き込まれたような時",qt:"小畜。亨。密雲不雨。",src:"小畜卦",unsei_txt:"周囲の状況が悪く、うまくいかず、目標目的地の手前で車の渋滞に遭ったような時。しばらく学問などに打ち込み、コツコツと実力を蓄えて機が熟する日を待つことです。",ko:{1:{jd:"復自道",tai:"途中で引き返す。吉。手を出しかけてハッと我に返る時です。"},2:{jd:"牽復吉",tai:"友人に引かれて帰る。吉。◎良い時です。"},3:{jd:"輿説輹。夫妻反目",tai:"夫婦でケンカするようなもの。◎あなたの考え方、進み方に問題点があります。"},4:{jd:"有孚。血去惕出",tai:"誠がある。誠意を尽くせば、難問が解決する時です。"},5:{jd:"有孚攣如。富以其隣",tai:"誠があって、手を取り合うようにしっかり心を合わせて相親しむ。◎大変良い時です。"},6:{jd:"既雨既処",tai:"有終の美を飾りましょう。◎あなたの考え方、進み方に問題点があります。"}}},
"1-2":{no:10,nm:"天沢履",rd:"てんたくり",theme:"虎の尾を履むような危険な時",qt:"履虎尾。不咥人。亨。",src:"履卦",unsei_txt:"天沢履の時は、虎の尾を履むような危険はあるが、人に噛みつくことはない。先輩や上司の意見に従って進むことです。礼儀を失わず、人の道を履み実践することが大切です。",ko:{1:{jd:"素履。往无咎",tai:"飾り気なく素直に進めば問題はない。あるがまま、あなたらしさを大切にする時です。"},2:{jd:"履道坦坦。幽人貞吉",tai:"周囲の雑音に惑わされず、我が道を行く時です。本業を守ること。"},3:{jd:"眇能視。跛能履。虎尾。凶",tai:"自信過剰で中身がない、失敗必至。◎あなたの考え方、進み方に問題点があります。"},4:{jd:"履虎尾。愬愬終吉",tai:"気持ちを引き締めて臨めば最終的に吉。◎良い時です。"},5:{jd:"夬履。貞厉",tai:"礼義正しく進む時です。独断専行は危険です。"},6:{jd:"視履考祥。其旋元吉",tai:"これまでやってきたことを振り返り、じっくり反省する。◎大変良い時です。"}}},
"8-1":{no:11,nm:"地天泰",rd:"ちてんたい",theme:"天下泰平、万事順調の時",qt:"泰。小往大来。吉亨。",src:"泰卦",unsei_txt:"地天泰の時は、万事が好調でスムーズに進みます。しかし、盛れば食けるのが世の常です。謙虚な気持ちで現状維持を心がけ、現在の安泰の時をできるだけ永続させるようにしましょう。",ko:{1:{jd:"抜茅茹。以其彙。征吉",tai:"仲間と協力して前進すれば吉。チームワークをフルに活用する時です。◎良い時です。"},2:{jd:"包荒用馮河",tai:"遠くの人を忘れずに、私情にとらわれない中道の精神で実行に踏み切って良い時です。"},3:{jd:"无平不陂",tai:"治に居て乱を忘れぬ態度で日々精進すれば、見ている人はちゃんといる。"},4:{jd:"翩々不富",tai:"謙虚さが大切。"},5:{jd:"帝乙帰妹。以祉元吉",tai:"人の力を借りて目的が果たせる時。◎大変良い時です。"},6:{jd:"城復于隍",tai:"◎あなたの考え方、進み方に大きな問題点があります。よく反省し、改めましょう。"}}},
"1-8":{no:12,nm:"天地否",rd:"てんちひ",theme:"世はまさに闇の時",qt:"否之匪人。不利君子貞。",src:"否卦",unsei_txt:"天地否の時には人の道がまともに行われない。天地否の時は、正論は控え、つまらない者とは極力関わらないことが肝要です。",ko:{1:{jd:"抜茅茹。以其彙。貞吉。亨",tai:"仲間と協力することが大切です。天地否の時こそチームワーク。"},2:{jd:"包承。小人吉。大人否亨",tai:"能ある鷹は爪を隠すべき時です。自分の信ずる道を守りましょう。"},3:{jd:"包羞",tai:"恥ずかしいことを包み隠している。◎あなたの考え方、進み方に問題点があります。"},4:{jd:"有命无咎",tai:"天命に従っていけば問題はない。志をおなじくする者と協力することでお互いに幸せになれる。"},5:{jd:"休否。大人吉",tai:"台風の目に入ったような時。ゆめゆめ油断することなく警戒を緩めないことです。"},6:{jd:"傾否。先否後喜",tai:"苦しみ転じて喜びとなる時です。◎良い時です。"}}},
"1-3":{no:13,nm:"天火同人",rd:"てんかどうじん",theme:"一致団結して進む時",qt:"同人。干野亨。利渉大川。",src:"同人卦",unsei_txt:"天火同人の時は、仲間で志を持った者同志が広々と公明正大に仲良しで進める時です。私利私欲が絡むと成功しやすいでしょう。",ko:{1:{jd:"同人于門。无咎",tai:"交際を積極的に広げる時です。◎良い時です。"},2:{jd:"同人于宗。吝",tai:"身内・親族ばかりと交際するようではよろしくない。視野を広く持ちましょう。"},3:{jd:"伏戎于莽",tai:"身の程知らずの野心は失敗の元です。◎あなたの考え方、進み方に問題点があります。"},4:{jd:"乗其墉。弗克攻。吉",tai:"高望みというものです。深追いせず諦めるのが賢い時です。"},5:{jd:"同人先号咷後笑",tai:"溜っていた難問がやっと解決する時です。積極的に動きましょう。◎大変良い時です。"},6:{jd:"同人于郊。无悔",tai:"会社勤めの人は、地方の支店で満足すべき時です。"}}},
"3-1":{no:14,nm:"火天大有",rd:"かてんたいゆう",theme:"我が世の春の時",qt:"大有。元亨。",src:"大有卦",unsei_txt:"大有は大いに所有するということ。願いも大いに叶う時ですが、現在の盛運はあなたの実力のみでなく、天の助けがあってのことと自覚し、謙虚な気持ちを忘れないことが大切です。",ko:{1:{jd:"无交害。匪咎",tai:"有害なものとは交わらないので災いはない。土台をしっかり固めましょう。"},2:{jd:"大車以載",tai:"大いに実力を発揮しましょう。◎良い時です。"},3:{jd:"公用亨于天子",tai:"大腹のあなたの上司の引き立てを得られる時です。"},4:{jd:"匪其彭。无咎",tai:"勢い足ばかりをしなければ問題はない。"},5:{jd:"厥孚交如。威如。吉",tai:"誠があり、堂々と威厳がある。◎大変良い時です。"},6:{jd:"自天祐之。吉无不利",tai:"天の助けがある。◎大変良い時です。"}}},
"8-7":{no:15,nm:"地山謙",rd:"ちざんけん",theme:"低姿勢で謙虚に進む時",qt:"謙。亨。君子有終。",src:"謙卦",unsei_txt:"謙は謙虚のこと。地山謙の時、通じる。実るほど頭を垂れる稲穂のようです。謙虚な精神が大切です。",ko:{1:{jd:"謙謙君子",tai:"謙虚に謙虚に努めるならば、大川を渡っても吉。◎良い時です。"},2:{jd:"鳴謙。貞吉",tai:"あなたの謙虚さが自然に態度に出ています。◎良い時です。"},3:{jd:"労謙。君子有終吉",tai:"苦労はあっても必ず報われます。◎大変良い時です。"},4:{jd:"无不利。撝謙",tai:"謙虚の美徳を大いに発揮する時です。"},5:{jd:"不富。以其鄰",tai:"謙虚立派な姿勢を保ちましょう。"},6:{jd:"鳴謙",tai:"内部にしっかり目を向けましょう。"}}},
"4-8":{no:16,nm:"雷地予",rd:"らいちよ",theme:"楽しく嬉しい準備の時",qt:"予。利建侯行師。",src:"予卦",unsei_txt:"予は喜び楽しむこと。雷地予の時は、春が訪れた時のように喜びあふれる時です。しかし、怠惰になったり、慢心しやすい時でもあります。油断大敵です。",ko:{1:{jd:"鳴予。凶",tai:"実力がないのに慢心したり、遊び呆けるようではいけません。"},2:{jd:"介于石。不終日。貞吉",tai:"石にかじりついてでも一日中頑張る。貞正にして吉。"},3:{jd:"盱予。悔遅有悔",tai:"上ばかり見てへつらい喜ぶ。早く気づかないと後悔することになる。"},4:{jd:"由予。大有得",tai:"信頼が厚くなり和気あいあいと喜び集まる時です。◎大変良い時です。"},5:{jd:"貞疾恒不死",tai:"持病のある人は、どれだけ体を労わるのでかえって長生きする。"},6:{jd:"冥予。成有渝",tai:"快楽に溺れて冥土行きになりそうだ。心を入れ替えれば問題はない。"}}},
"2-4":{no:17,nm:"沢雷随",rd:"たくらいずい",theme:"立派な人に従う時",qt:"随。元亨利貞。无咎。",src:"随卦",unsei_txt:"随は従う、随行すること。沢雷随の時は大いに通じる。ゆっくりと力を蓄える時です。今はあくせく進まないで無理をせず、一服する時でもあります。",ko:{1:{jd:"官有渝。貞吉",tai:"自分の殻に閉じこまらないで時の流れに順応していよい時です。◎良い時です。"},2:{jd:"係小子。失丈夫",tai:"つまらない人に関わっていると立派な人を失う時です。"},3:{jd:"係丈夫。随有求得",tai:"立派な人と随えば、求めるものが得られる。◎良い時です。"},4:{jd:"随有獲。貞凶",tai:"謙虚に社長に従いましょう。"},5:{jd:"孚于嘉。吉",tai:"誠をもって善に従う。吉。◎大変良い時です。"},6:{jd:"拘係之。乃従維之",tai:"人心をつなぎ留める。◎大変良い時です。"}}},
"7-5":{no:18,nm:"山風蠱",rd:"さんぷうこ",theme:"空気がよどんで物が腐ったような時",qt:"蠱。元亨。利渉大川。",src:"蠱卦",unsei_txt:"蠱は腐敗のこと。どんなに表面はよく見えても、その内部はどろどろした難問が山積の時です。大胆に新風を吹き込んで再出発すべきです。",ko:{1:{jd:"幹父之蠱。有子考",tai:"父の失敗の後始末をする。今なら手の施しようがあります。"},2:{jd:"幹母之蠱。不可貞",tai:"あまり厳しい荒治療はするべきではない。融通性をもって穏やかに後始末をするべき時です。"},3:{jd:"幹父之蠱。小有悔",tai:"父の失敗の後始末をする。最後までやり遂げることです。"},4:{jd:"裕父之蠱。往見吝",tai:"このまま進めば恥の上塗りになる。◎あなたの考え方、進み方に問題点があります。"},5:{jd:"幹父之蠱。用誉",tai:"破産会社に乗り込んで再建に成功するような時です。◎良い時です。"},6:{jd:"不事王侯。高尚其事",tai:"退職の好機かもしれません。"}}},
"8-2":{no:19,nm:"地沢臨",rd:"ちたくりん",theme:"希望に燃えて出発する時",qt:"臨。元亨利貞。",src:"臨卦",unsei_txt:"地沢臨の時は大いに通じる。これは春爛漫の時、希望に燃えて進みましょう。新規の計画も良し。",ko:{1:{jd:"咸臨。貞吉",tai:"互いに感じて臨む。貞正にして吉。◎良い時です。"},2:{jd:"咸臨。吉。无不利",tai:"信頼が厚く、すべて順調に進みます。◎良い時です。"},3:{jd:"甘臨。无攸利",tai:"あなたが口は上手に人に接するが失敗の元です。"},4:{jd:"至臨。无咎",tai:"あなたの真心あふれる態度が幸せを招きます。◎大変良い時です。"},5:{jd:"知臨。大君之宜。吉",tai:"知恵ある人を選び、うまく用いることによって成功するでしょう。◎大変良い時です。"},6:{jd:"敦臨。吉",tai:"人情たっぷり、誠の心で進みましょう。◎大変良い時です。"}}},
"5-8":{no:20,nm:"風地観",rd:"ふうちかん",theme:"人生を深く洞察する時",qt:"観。盥而不薦。有孚顒若。",src:"観卦",unsei_txt:"風地観の時は、万事に厳粛に行われる。おおよそのことは現状維持を心がけることです。",ko:{1:{jd:"童観。小人无咎",tai:"大事な事を行うのは到底無理な時です。"},2:{jd:"闚観。利幽人貞",tai:"大局的に物事を捉えることを心がけること。"},3:{jd:"観我生進退",tai:"自分のことを振り返って、分相応に努めましょう。"},4:{jd:"観国之光",tai:"充分に観察して、充分に考えてから行動することです。◎良い時です。"},5:{jd:"観我生。君子无咎",tai:"責任ある立場に立たされて自分を省みる。◎良い時です。"},6:{jd:"観其生。君子无咎",tai:"超然と構えて、些細なことには関わらないことです。◎良い時です。"}}},
"3-4":{no:21,nm:"火雷噬嗑",rd:"からいぜいごう",theme:"障害物を断固として除去する時",qt:"噬嗑。亨。利用獄。",src:"噬嗑卦",unsei_txt:"噬嗑は噛み砕くこと。障害となるものを厳しく取り除くことが要求されます。優柔不断な態度ではとても希望は叶いません。",ko:{1:{jd:"履校滅趾",tai:"相手は小物ですから、少し懲らしめてやれば効果てきめんの時です。"},2:{jd:"噬膚滅鼻",tai:"ソフトムードで粘る時です。"},3:{jd:"噬腊肉遇毒",tai:"意外と難しく、力量不足の感があります。再考しましょう。"},4:{jd:"噬乾肉得金矢。吉",tai:"苦労の甲斐があって、なかなか成果が得られます。◎良い時です。"},5:{jd:"噬乾肉得黄金",tai:"多少の危険は何のその、やり抜くことで予期せぬ利益が得られる時です。◎良い時です。"},6:{jd:"何校滅耳。凶",tai:"すべて身から出たサビだといえましょう。"}}},
"7-3":{no:22,nm:"山火賁",rd:"さんかひ",theme:"見栄を捨て内面充実の時",qt:"賁。亨。小利有攸往。",src:"賁卦",unsei_txt:"賁は飾ること。外見にとらわれず、内容を充実させましょう。",ko:{1:{jd:"賁其趾。舎車而徒",tai:"本来持っているものを活かして進みましょう。"},2:{jd:"賁其須",tai:"体裁だけで中身のない時です。"},3:{jd:"賁如。濡如。永貞吉",tai:"このままいつまでも貞正にしていれば吉。◎良い時です。"},4:{jd:"賁如。皤如。白馬翰如",tai:"飾らない態度、控えめな態度で臨むべきです。◎良い時です。"},5:{jd:"賁于丘園",tai:"ケチケチぐらいが最終的には吉です。"},6:{jd:"白賁。无咎",tai:"行き着くところは素質で飾らない自然のままの姿になるでしょう。"}}},
"7-8":{no:23,nm:"山地剥",rd:"さんちはく",theme:"崩壊寸前の危機の時",qt:"剥。不利有攸往。",src:"剥卦",unsei_txt:"山地剥の時には進んで事を行ってはならない。不安定な上に、動けばとんでもないことになりがちです。身を守り、何もの至るのをじっと待つことです。",ko:{1:{jd:"剥牀以足。蔑貞凶",tai:"◎あなたの考え方、進み方に問題点があります。"},2:{jd:"剥牀以弁。蔑貞凶",tai:"早く災難を避ける方法を考え、ガードを固めること。"},3:{jd:"剥之。无咎",tai:"ベッド本体が崩れるが問題はない。正道を守るべき時です。"},4:{jd:"剥牀以膚。凶",tai:"あなたの身にこの上なく危険が迫っている。"},5:{jd:"貫魚。以宮人寵",tai:"上司の引き立てを受けられる時です。"},6:{jd:"碩果不食。君子得車",tai:"今は無理をせず、再起に備えることです。"}}},
"8-4":{no:24,nm:"地雷復",rd:"ちらいふく",theme:"一陽来復の時",qt:"復。亨。出入无疾。朋来无咎。",src:"復卦",unsei_txt:"地雷復の時は、永冬が去って、やっと春が立ち帰ってきた時です。エンジン始動の最初の、開運の入り口に立ったところです。",ko:{1:{jd:"不遠復。无祇悔。元吉",tai:"今は実力を蓄える準備をする段階です。◎良い時です。"},2:{jd:"休復。吉",tai:"もう一度チャレンジする時です。◎良い時です。"},3:{jd:"頻復。厲无咎",tai:"じっくりと先を見通して動くこと。"},4:{jd:"中行独復",tai:"悪い仲間と手を切って、独立独歩でわが道に立ち帰る時です。"},5:{jd:"敦復。无悔",tai:"真面目さがあなたの取り柄なのです。◎良い時です。"},6:{jd:"迷復。凶",tai:"◎あなたの考え方、進み方に問題点があります。"}}},
"1-4":{no:25,nm:"天雷无妄",rd:"てんらいむもう",theme:"成り行き任せが良いとき",qt:"无妄。元亨利貞。",src:"无妄卦",unsei_txt:"天雷无妄の時はすべて自然の成り行きに任せ、受身に徹することです。天意に逆って人為的なことをすると、天はそっぽを向きます。",ko:{1:{jd:"无妄往吉",tai:"天に従い、小細工をしないで无心に進むなら吉。あるがままの姿でいきましょう。"},2:{jd:"不耕穫。不菑畲",tai:"成り行きに任せてさえいれば良い時です。"},3:{jd:"无妄之災",tai:"とんでもない災難に巻き込まれやすい時です。"},4:{jd:"可貞。无咎",tai:"貞正にしていれば問題はない。現状維持に徹する時です。"},5:{jd:"无妄之疾。勿薬有喜",tai:"放っておけば、自然に問題が解決する時です。◎良い時です。"},6:{jd:"无妄行有眚",tai:"むやみに動かず、人の意見に素直に従うことです。"}}},
"7-1":{no:26,nm:"山天大畜",rd:"さんてんたいちく",theme:"大いに蓄積ができた時",qt:"大畜。利貞。不家食吉。",src:"大畜卦",unsei_txt:"大畜は大いに蓄えること。山天大畜の時は、文字通り大いに蓄積基盤のできた時ですが、さらに実力や知識を内部に蓄えることが大切です。",ko:{1:{jd:"有厲利已",tai:"まだ危なかしいところがあるので、まず内面の充実を図ることです。"},2:{jd:"輿説輹",tai:"止まって現状を維持することです。"},3:{jd:"良馬逐。利艱貞",tai:"今の頑張りが後で実となり、花となるのです。◎良い時です。"},4:{jd:"童牛之梏。元吉",tai:"大いに吉。◎大変良い時です。"},5:{jd:"豶豕之牙。吉",tai:"多少の束縛はありますが、無理なく従えうる時です。◎大変良い時です。"},6:{jd:"何天之衢。亨",tai:"長い間希望してきたことが叶う時です。◎大変良い時です。"}}},
"7-4":{no:27,nm:"山雷頤",rd:"さんらいい",theme:"食うために正しい努力をする時",qt:"頤。貞吉。観頤。自求口実。",src:"頤卦",unsei_txt:"頤はあご、口のことで養うという意味。山雷頤の時は、言葉を慎むとともに、自分の生活態度を振り返って、腹八分の正しい生活を心がけ、健康に気配りをすることが大切です。",ko:{1:{jd:"舎爾霊亀。観我朵頤。凶",tai:"上ばかりを見て、他人からうらやましく思うことはきっぱりやめましょう。"},2:{jd:"顛頤。拂経",tai:"まず自立を試みることです。"},3:{jd:"拂頤。貞凶",tai:"◎あなたの考え方、進み方に問題点があります。"},4:{jd:"顛頤。吉。虎視眈眈",tai:"今に見ておれと虎視眈々と構える時です。◎良い時です。"},5:{jd:"拂経。居貞吉",tai:"力のない時ですから、野心は起こさずに、上司などに従うことです。"},6:{jd:"由頤。厲吉。利渉大川",tai:"誠意をもって圧迫をはねのけて成功に至ることができます。◎大変良い時です。"}}},
"2-5":{no:28,nm:"沢風大過",rd:"たくふうたいか",theme:"家の棟が傾いたような時",qt:"大過。棟橈。利有攸往。亨。",src:"大過卦",unsei_txt:"沢風大過の時は、棟がたわんで家が傾くような大変な時です。当たって砕けるの不屈の精神で立ち向かうということです。大きなことや新規のことは行なわないことです。",ko:{1:{jd:"藉用白茅",tai:"柔よく剛を制する時です。受身に慎重に行動すれば意外とうまくいきます。"},2:{jd:"枯楊生稊",tai:"挽回のチャンスです。"},3:{jd:"棟橈。凶",tai:"◎あなたの考え方、進み方に問題点があります。"},4:{jd:"棟隆。吉",tai:"一心に頑張ることが進む道を進みましょう。◎良い時です。"},5:{jd:"枯楊生華",tai:"行いに細心の注意を払って、色情などで身を落とさぬことです。"},6:{jd:"過渉滅頂。凶",tai:"自分の実力をわきまえずに突進して窮地に追い込まれてしまう時です。まず身を守ることです。"}}},
"6-6":{no:29,nm:"坎為水",rd:"かんいすい",theme:"一難去ってまた一難の時",qt:"習坎。有孚。維心亨。行有尚。",src:"坎卦",unsei_txt:"坎為水の時は、アップアップと溺れかけて、四苦八苦の時です。赤字経営、倒産などには注意を要する時です。◎易の中で三大難卦の一つです。",ko:{1:{jd:"習坎入于坎窞。凶",tai:"非常に困難な状況、深い穴の底に落ち込んだ。"},2:{jd:"坎有険。求小得",tai:"困難の中にあっても、少しはどうにか打開策の見出せる時です。"},3:{jd:"来之坎坎。険且枕",tai:"危険極まりないので行動を起こしてはならない。"},4:{jd:"樽酒簋貳用缶",tai:"質素に内輪に事を運び、誠意をもって行なうことです。"},5:{jd:"坎不盈。祇既平",tai:"困難が底をつき、前途に希望の光が見え始めた時です。"},6:{jd:"係用徽纆。三歳不得。凶",tai:"天意に背き続けた報いです。"}}},
"3-3":{no:30,nm:"離為火",rd:"りいか",theme:"灼熱の太陽を浴びたような時",qt:"離。利貞。亨。畜牝牛吉。",src:"離卦",unsei_txt:"離為火の時は、才能を発揮するチャンスに恵まれますが、自分の付くべき立場を見定め謙虚に従うべきです。火が飛び移るような変わりやすい気持ちや短気を抑えて行動することです。",ko:{1:{jd:"履錯然。敬之无咎",tai:"とにかく最初が肝腎ですから、丁寧に丁寧に行くことです。◎良い時です。"},2:{jd:"黄離元吉",tai:"まさに時を得た知性が冴えまくり、実力を発揮して波に乗る時です。◎大変良い時です。"},3:{jd:"日昃之離",tai:"見切りを付けるべき時です。"},4:{jd:"突如其来如。焚如",tai:"守りに徹した上で、細心の注意が必要。"},5:{jd:"出涕沱若",tai:"苦労多い時ですが、謙虚になるまえは通じます。"},6:{jd:"王用出征。有嘉折首",tai:"目的達成のあかつきには寛大な処置をお忘れなく。◎良い時です。"}}},
"2-7":{no:31,nm:"沢山咸",rd:"たくざんかん",theme:"フィーリングを大切にする時",qt:"咸。亨。利貞。取女吉。",src:"咸卦",unsei_txt:"咸は感じるということ。沢山咸の時は、直感に任せてすみやかに事を運ぶことがポイントです。",ko:{1:{jd:"咸其拇",tai:"気持ちがくすぐられても、まだまだ動くときではありません。"},2:{jd:"咸其腓。凶。居吉",tai:"誘惑があっても心を動かさず、じっとしているのが一番の時です。"},3:{jd:"咸其股。執其随",tai:"後がこわい時です。甘い話に乗ることなく、自分をしっかり保ちましょう。"},4:{jd:"貞吉。悔亡。憧憧往来",tai:"自分を固くガードすることが大切です。"},5:{jd:"咸其脢。无悔",tai:"鈍感といわれようとも、無関心を守っていうといったところです。"},6:{jd:"咸其輔頬舌",tai:"口先だけのうまい話に注意するときです。"}}},
"4-5":{no:32,nm:"雷風恒",rd:"らいふうこう",theme:"方針を変えてはいけない時",qt:"恒。亨。无咎。利貞。利有攸往。",src:"恒卦",unsei_txt:"恒は常ということ。久しく変わらないこと。雷風恒の時には、何事も方針を変えることなく貞くことで本当の力が発揮できる。ですから、転職するなど、むやみに現状を変えることはしないことです。",ko:{1:{jd:"浚恒。貞凶",tai:"最初から飛ばしすぎ、求めすぎで無理があるのではありませんか。自分の力量をわきまえることです。"},2:{jd:"悔亡",tai:"継続は力なりの時です。今までの方針どおりに根気よく進みましょう。"},3:{jd:"不恒其徳",tai:"方針を変えてはならない雷風恒の時に、ふらふらと方が定まらず。"},4:{jd:"田无禽",tai:"とんだ見込み違いで利益のあがらない時です。"},5:{jd:"恒其徳。貞",tai:"自発性、臨機応変を旨とすべき立場の人には良くありません。"},6:{jd:"振恒。凶",tai:"不動心とはほど遠く、確固とした目的もないのに、目移りばかりしている時です。"}}},
"1-7":{no:33,nm:"天山遯",rd:"てんざんとん",theme:"逃げるが勝ちの時",qt:"遯。亨。小利貞。",src:"遯卦",unsei_txt:"遯は遁走、退くこと。衰えつつある時の流れに逆らわず、中央から逃れ退いてじっと再起のチャンスを待つべき時です。逃げるが勝ち、執着心を捨て去ることです。",ko:{1:{jd:"遯尾。厲",tai:"逃げ送れてしまい危うい。止まって時を待つことです。"},2:{jd:"執之用黄牛之革",tai:"しっかりした意志を持って腹を据えて行動すべき。"},3:{jd:"係遯。有疾厲",tai:"未練があって逃げようとして後ろ髪引かれて止まる。私情に縛られないことが肝腎です。"},4:{jd:"好遯。君子吉",tai:"私利私欲に凝り固まっている小人には難しい時です。"},5:{jd:"嘉遯。貞吉",tai:"喜んで立派に遯げる。花道を飾ることができます。◎良い時です。"},6:{jd:"肥遯。无不利",tai:"豊かに遯げる。◎大変良い時です。"}}},
"4-1":{no:34,nm:"雷天大壮",rd:"らいてんたいそう",theme:"今すぐスピードを落とす時",qt:"大壮。利貞。",src:"大壮卦",unsei_txt:"大壮は大いに盛んということ。雷天大壮の時は、気持ちばかりはやって中身が伴わない時です。強引に突っ走り、果てにはブレーキの効かない車の暴走に例えられる失敗に注意が必要です。",ko:{1:{jd:"壮于趾。征凶",tai:"実力もないのに気持ちばかり焦っている。急いで進めば凶。短気を慎むべきです。"},2:{jd:"貞吉",tai:"野心も抱かず、誠実に現状を守れば良い時です。◎良い時です。"},3:{jd:"小人用壮。君子用罔",tai:"牡羊が突進して垣根に角をひっかけて苦しむような状態になる。"},4:{jd:"貞吉。悔亡",tai:"障害が取り払われ、仕事に打ち込みましょう。◎大変良い時です。"},5:{jd:"喪羊于易。无悔",tai:"去る者は追わず、何事にも関わらないのが一番の時です。"},6:{jd:"羝羊触藩",tai:"スピードを落とすべき時に暴走して進退に窮する時です。"}}},
"8-3":{no:35,nm:"火地晋",rd:"かちしん",theme:"出世階段を勢いよく昇る時",qt:"晋。康侯用錫馬蕃庶。昼日三接。",src:"晋卦",unsei_txt:"晋は進むこと。太陽が地上に火が昇ってますます勢いよく上昇する時です。前途が明るく、大いに飛躍できる時ですが、地位に対して謙虚な気持ちを失わないことです。",ko:{1:{jd:"晋如摧如。貞吉",tai:"進もうとしても進めないこと。信頼される存在になること。"},2:{jd:"晋如愁如。貞吉",tai:"進もうとして心配が湧く。貞正にして吉。上の人や上司に気に入られることが鍵。◎良い時です。"},3:{jd:"衆允。悔亡",tai:"周囲の人々からの支持と信頼が大切。◎良い時です。"},4:{jd:"晋如鼫鼠。貞厲",tai:"欲を捨てて退くのが賢明な時。"},5:{jd:"悔亡。失得勿恤。往吉无不利",tai:"前途は明るく、運気上昇。目先の損得より大局を見よ。◎大変良い時です。"},6:{jd:"晋其角。維用伐邑",tai:"やりすぎに注意が必要。◎良い時です。"}}},
"3-8":{no:36,nm:"地火明夷",rd:"ちかめいい",theme:"無能をよそおい引き下がる時",qt:"明夷。利艱貞。",src:"明夷卦",unsei_txt:"地火明夷の時は、日の目を見ない時です。才能を隠し、無能のふりをして難を逃れ、後日に備えて実力をたっぷりと蓄えるべきです。万事表面に立つべからず。",ko:{1:{jd:"明夷于飛翼。君子于行",tai:"今は何をやってもうまくいかず、障害の多い時です。まず、身を大切にしましょう。"},2:{jd:"明夷夷于左股。用拯馬壮吉",tai:"大急ぎで身を引けば、小さな傷で済む時です。強力な助っ人を得ること。"},3:{jd:"明夷于南狩",tai:"断固した手段で決断をつけるべき時ですが、性急は禁物です。"},4:{jd:"入于左腹。獲明夷之心",tai:"うまい話には裏がある時。"},5:{jd:"箕子之明夷。利貞",tai:"徹底して暗愚をよそおい、難を逃れる時です。"},6:{jd:"不明晦。初登于天。後入于地",tai:"◎あなたの考え方、進み方に大きな欠陥があります。よく反省し、方針の転換をしましょう。"}}},
"5-3":{no:37,nm:"風火家人",rd:"ふうかかじん",theme:"家内安全第一の時",qt:"家人。利女貞。",src:"家人卦",unsei_txt:"風火家人の時は、家庭を大切にし、内部に目を向けた内業を守ること、新規の事よりも本業を守り、協調性や結束力を大切にすることです。",ko:{1:{jd:"閑有家。悔亡",tai:"門を閉じて家を守れば、悔いはなくなる。物事は最初に締めることが肝腎です。"},2:{jd:"无攸遂。在中饋。貞吉",tai:"役割を分担しましょう。"},3:{jd:"家人嗃嗃。悔厉吉",tai:"上手に締めて、雰囲気づくりに気を配りましょう。"},4:{jd:"富家。大吉",tai:"家業に専念して大利を得る時です。◎大変良い時です。"},5:{jd:"王仮有家。勿恤吉",tai:"家庭の中も安定し、円満で心が通じ合い、運気も好調な時です。◎良い時です。"},6:{jd:"有孚威如。終吉",tai:"常に反省しつつ締めていけば、家の繁栄は継続することでしょう。◎良い時です。"}}},
"3-2":{no:38,nm:"火沢睽",rd:"かたくけい",theme:"不和反目の多い時",qt:"睽。小事吉。",src:"睽卦",unsei_txt:"火沢睽の時は、統一がなされずに内輪もめありとなしでしょう。大きな事は行なわずに内部に目を向け、反目が小さなうちに対処し、調和を図るための和解策を続けることです。",ko:{1:{jd:"悔亡。喪馬勿逐",tai:"一度背いた者は心を広くして接すれば戻ってくる。去る者は追わず。"},2:{jd:"遇主于巷。无咎",tai:"裏工作が功を奏する時、相談して行うこと。◎良い時です。"},3:{jd:"見輿曳。其牛掣",tai:"周囲の人に誤解されたり、溝が深まることも。"},4:{jd:"睽孤。遇元夫。交孚",tai:"正しくしていれば必ず素晴らしい理解者が得られます。"},5:{jd:"悔亡。厥宗噬膚",tai:"仲間と親しみ協力しつつ、解決に当たること。"},6:{jd:"睽孤。見豕負塗。往遇雨則吉",tai:"見方を変えれば解決もとけ、すんなりと解決する時です。"}}},
"6-7":{no:39,nm:"水山蹇",rd:"すいざんけん",theme:"冬山で遭難したような時",qt:"蹇。利西南。不利東北。利見大人。貞吉。",src:"蹇卦",unsei_txt:"水山蹇の時は動けば危険に遭遇し、どうにも進むことのできない時です。今は止まって反省し、物事をよく考えることです。◎易の中で三大難卦の一つです。",ko:{1:{jd:"往蹇来誉",tai:"進めば困難に遭い、退けば誉を受ける。退いて時を待つ時です。"},2:{jd:"王臣蹇蹣",tai:"人のために身を粉にして働く時です。腹を据えて献身の精神に徹することです。"},3:{jd:"往蹇来反",tai:"本分を守って内部を固める時です。"},4:{jd:"往蹇来連",tai:"退いて友人と協力する時です。"},5:{jd:"大蹇朋来",tai:"有力な助っ人の現れる時です。もうじきゆきなやむ状態から脱出できます。"},6:{jd:"往蹇来碩。吉",tai:"◎水山蹇の中では良い時です。"}}},
"4-6":{no:40,nm:"雷水解",rd:"らいすいかい",theme:"春が来て厚い氷が解ける時",qt:"解。利西南。无所往其来復。",src:"解卦",unsei_txt:"解はゆるむ意。解消、解放のこと。グズグズしていたらせっかくのチャンスを逃してしまう。困難の中にあった人は今までの状態から解放される時です。",ko:{1:{jd:"无咎",tai:"力不足ゆえ目上に従い、援助を求める時です。"},2:{jd:"田獲三狐。得黄矢。貞吉",tai:"積極的に動いて自らチャンスをつくりましょう。◎良い時です。"},3:{jd:"負且乗。致寇至",tai:"実力をわきまえなさい。"},4:{jd:"解而拇。朋至斯孚",tai:"くだらない者とは即刻、手を切りましょう。"},5:{jd:"君子維有解。吉",tai:"私情に流されずにやるべき時はやることです。"},6:{jd:"公用射隼于高墉",tai:"強攻手段を用いてでも敵に対抗することです。しかし、油断は禁物。"}}},
"7-2":{no:41,nm:"山沢損",rd:"さんたくそん",theme:"損して得取る時",qt:"損。有孚。元吉。无咎。",src:"損卦",unsei_txt:"損は滅らす、損失、奉仕などの意味。目先の利益に惑わされず、誠意をもって行えば、後には必ず大きな利益となって戻ってきます。「損して得取る」大きな心で投資しましょう。",ko:{1:{jd:"已事遄往。无咎",tai:"実情を見て適正に行うことも大切。限度を知るべし。"},2:{jd:"利貞。征凶",tai:"見守って自立を促すことも人助けのうち。"},3:{jd:"三人行則損一人",tai:"多くを望まず目標を一つに絞ること。"},4:{jd:"損其疾。使遄有喜",tai:"障害を速やかに取り除くべき時です。◎良い時です。"},5:{jd:"或益之。十朋之亀弗克違",tai:"思わぬ助力を得て、難なく利益の得られる時です。◎大変良い時です。"},6:{jd:"弗損益之。无咎",tai:"誠意をもって行動すれば必要な人材が得られ、盛んに信望を集める時です。"}}},
"5-4":{no:42,nm:"風雷益",rd:"ふうらいえき",theme:"ビッグチャンス到来の時",qt:"益。利有攸往。利渉大川。",src:"益卦",unsei_txt:"益は増す、利益が上がること。風雷益の時は、あなたの株が上がり名誉も名声を得られる時です。大いに見運に乗って大きな事業を行なうことを心がけましょう。",ko:{1:{jd:"利用為大作。元吉",tai:"大仕事を行っても良い。大いに吉。◎大変良い時です。"},2:{jd:"或益之。永貞吉",tai:"思わぬ助力が得られ、意外な幸運が舞い込む時。◎大変良い時です。"},3:{jd:"益之用凶事",tai:"困難に立面して、それが上から認められることにつながる。"},4:{jd:"中行告従",tai:"目上の絶大な信頼を受け、大仕事を行なうべき時です。◎大変良い時です。"},5:{jd:"有孚恵心。勿問元吉",tai:"誠意を尽くせば大いに希望が叶う時です。◎大変良い時です。"},6:{jd:"莫益之。或撃之",tai:"人の恨みを買い、非難ごうごうの時です。"}}},
"2-1":{no:43,nm:"沢天夬",rd:"たくてんかい",theme:"堤防が決壊するような時",qt:"夬。揚于王庭。孚号。有厲。",src:"夬卦",unsei_txt:"沢天夬の形は、万事が勢い余って決壊寸前の状態にあります。直接的な行動は危ない。進めば良い。",ko:{1:{jd:"壮于前趾。往不勝為咎",tai:"実力不足の時、勝算なく、万事控えること。"},2:{jd:"惕号。莫夜有戎",tai:"闘いに備えてガードを固める時です。"},3:{jd:"壮于頄。有凶",tai:""},4:{jd:"臀无膚。其次且跛",tai:"柔軟不断で不安定な立場の時に、忠言を素直にきくことが大事。"},5:{jd:"莫陵夬夬。中行无咎",tai:"責任をとる時が来た。思いきって決行。ただし用心を重ねるべし。"},6:{jd:"无号。終有凶",tai:"独裁者の最後ともいうべき場面です。"}}},
"1-5":{no:44,nm:"天風姤",rd:"てんぷうこう",theme:"天下の美女と出会うような時",qt:"姤。女壮。勿用取女。",src:"姤卦",unsei_txt:"天風姤は、思いも懸けない女性との問題から関係があります。男性には女難の時であっても、女性にとっては仕事面で才能を発揮するよい時です。",ko:{1:{jd:"繋金柅。貞吉",tai:"油断していたら手に負えなくなる。しっかりとした心を持っていること。"},2:{jd:"包有魚。无咎",tai:"公私混同を避け、内々で処理すべき時です。"},3:{jd:"臀无膚。其行次且",tai:""},4:{jd:"包无魚。起凶",tai:""},5:{jd:"以杞包瓜。含章",tai:"内部を充実させましょう。今はすべてを包み隠して時を待つべきです。"},6:{jd:"姤其角。吝",tai:"争い事などのトラブルが生じる時です。孤立を避けたいのなら関わるべからず。"}}},
"2-8":{no:45,nm:"沢地萃",rd:"たくちすい",theme:"人や物が集まり繁盛する時",qt:"萃。亨。王仮有廟。",src:"萃卦",unsei_txt:"萃は集まること。沢地萃の時は通じる。あなたの株が上がり、地位も異常、人気もなぎ登りでしょう。就職や試験、商売ごとには難関であっても突破できる活気溢れる時です。",ko:{1:{jd:"有孚不終",tai:"進んで問題はない。"},2:{jd:"引吉。无咎",tai:"誠の心で進む時です。◎良い時です。"},3:{jd:"萃如。嗟如",tai:"あれこれ迷う気持ちが力を削いでいるのです。"},4:{jd:"大吉。无咎",tai:"強欲で高慢なのは小人の態度です。◎大変良い時です。"},5:{jd:"萃有位。无咎",tai:"努力を継続すること。◎大変良い時です。"},6:{jd:"齎咨涕洟。无咎",tai:"進めることは、泣きの涙に至るので控えること。"}}},
"8-5":{no:46,nm:"地風升",rd:"ちふうしょう",theme:"一歩一歩昇る時",qt:"升。元亨。用見大人。",src:"升卦",unsei_txt:"升は昇り進むこと。地風升の時は大いに通じる。新しいことに着手して良いことは、何よりも土台を固めて環境を整え、生命力を蓄え、その上でゆっくり大木に育てていく心構えを持って。",ko:{1:{jd:"允升。大吉",tai:"誠の心をもって昇り進む。大吉。◎大変良い時です。"},2:{jd:"孚乃利用禴",tai:"信任された名誉を得る時です。◎良い時です。"},3:{jd:"升虚邑",tai:"何の妨げもなく勢いよく進める時です。◎良い時です。"},4:{jd:"王用亨于岐山",tai:"自分の立場をわきまえ、控え目に、かつ誠意をもって労めることです。◎良い時です。"},5:{jd:"貞吉。升階",tai:"確実に、またたやすく目標に近づける時です。◎大変良い時です。"},6:{jd:"冥升",tai:"今が退き時です。"}}},
"2-6":{no:47,nm:"沢水困",rd:"たくすいこん",theme:"困難極まりなく八方塞がりの時",qt:"困。亨。貞大人吉。有言不信。",src:"困卦",unsei_txt:"沢水困の時は、池が干上がって困窮する時、心身ともに困窮する時です。いくら訴えても信じてもらえない。◎易の中で三大難卦の一つです。",ko:{1:{jd:"臀困于株木",tai:"腹をくくって踏み止まるしかない。"},2:{jd:"困于酒食。朱紱方来",tai:"時を持ち堪え忍び相手の出方を見て対処すること。"},3:{jd:"困于石。拠于蒺藜",tai:""},4:{jd:"来徐徐。困于金車",tai:"焦らないことです。"},5:{jd:"劓刖。困于赤紱",tai:"天の助けや援助者を得て、前途に光明。部下に人材を求めること。"},6:{jd:"困于葛藟",tai:"不安な気持ちで一杯だが、用心に用心を重ねて出直す時です。"}}},
"6-5":{no:48,nm:"水風井",rd:"すいふうせい",theme:"陰日向なく仕事を続ける時",qt:"井。改邑不改井。",src:"井卦",unsei_txt:"水風井の時は、あなたの才能や智恵が大いに人の役に立つ時で、世のため人のため、ボランティアの精神で進みましょう。",ko:{1:{jd:"井泥不食",tai:"人から相手にされないこと。"},2:{jd:"井谷射鮒。甕敝漏",tai:"骨折り損のくたびれもうけの時です。"},3:{jd:"井渫不食",tai:"今日の目の見えることも、わかってくれる人は必ずいる。"},4:{jd:"井甃。无咎",tai:"いよいよあなたの才能を発揮する時が近づいてきた。今はその準備の時に当たります。"},5:{jd:"井洌。寒泉食",tai:"世間の信用が得られる時です。私利私欲は禁物。◎良い時です。"},6:{jd:"井收勿幕。有孚元吉",tai:"万人に役立とうとする気持ちを忘れず、さらに努力を続けること。◎大変良い時です。"}}},
"2-3":{no:49,nm:"沢火革",rd:"たくかかく",theme:"改革、改新の時",qt:"革。己日乃孚。元亨利貞。悔亡。",src:"革卦",unsei_txt:"革は革命、改めること。沢火革の時は、万事改革を求め、大きな変化、あるいは争いが起こりうる時です。大胆さと根気強さがポイントです。",ko:{1:{jd:"巩用黄牛之革",tai:"改革に着手するには時期尚早です。今は様子を見ることに徹して動かないことです。"},2:{jd:"己日乃革之。征吉",tai:"内々に準備を進めて機が熟せば果断に行動することです。◎良い時です。"},3:{jd:"征凶。貞厲。革言三就",tai:""},4:{jd:"悔亡。有孚改命。吉",tai:"誠意をもって実行に移せば成功します。◎良い時です。"},5:{jd:"大人虎変",tai:"絶大な支持と賞賛のもと、すべてを一新して希望の果たせる時です。◎大変良い時です。"},6:{jd:"君子豹変",tai:"改革の仕上げを丁寧に行なう時です。◎良い時です。"}}},
"3-5":{no:50,nm:"火風鼎",rd:"かふうてい",theme:"天下に堂々と存在する時",qt:"鼎。元吉。亨。",src:"鼎卦",unsei_txt:"火風鼎の時は、バランスのよい安定した三点支持、三者の協力が成功のためのポイントとなる時です。",ko:{1:{jd:"鼎顛趾。利出否",tai:"役に立たないものは一掃し、新しいものを取り入れる前に内部を整えることが大切です。"},2:{jd:"鼎有実。我仇有疾",tai:"足手まといとなる者や事柄が身近に存在する時です。タカをくくらず、行動を慎むこと。"},3:{jd:"鼎耳革。其行塞",tai:"穏和なやり方に変更すること。"},4:{jd:"鼎折足。覆公餗。凶",tai:"実力をわきまえるべきです。"},5:{jd:"鼎黄耳金鉉",tai:"今までの努力が報われる時です。◎大変良い時です。"},6:{jd:"鼎玉鉉。大吉",tai:"人との協力を忘れず堅実路線で進んでいきましょう。◎大変良い時です。"}}},
"4-4":{no:51,nm:"震為雷",rd:"しんいらい",theme:"雷のような大騒動の時",qt:"震。亨。震来虩虩。笑言啞啞。",src:"震卦",unsei_txt:"震為雷の時には、何か問題が起きても、自分を見失わずに冷静沈着に対応することです。時がたてば笑い話になるというものです。",ko:{1:{jd:"震来虩虩。後笑言啞啞。吉",tai:"初めはびっくりしても後に喜びを得ます。力を蓄えることです。◎良い時です。"},2:{jd:"震来厲。億喪貝",tai:"危険がすぐそこまで、身一つであれば何とかなるもの。"},3:{jd:"震蘇々。震行无眚",tai:"自分の力の範囲以上のことは控えるべきですが、もう少気持ちを強く持ちましょう。"},4:{jd:"震遂泥",tai:"何事も控えるべし。"},5:{jd:"震往来厲。億无喪有事",tai:"動かず現状維持の時、有事の備えは確実に。"},6:{jd:"震索索。視矍矍。征凶",tai:"まわりの人から小言をいわれる。災いが及ぶ前に早めに対策をたてる時です。"}}},
"7-7":{no:52,nm:"艮為山",rd:"ごんいざん",theme:"山のように動かないが一番の時",qt:"艮其背。不獲其身。行其庭。不見其人。",src:"艮卦",unsei_txt:"艮為山の時は、山は不動の象徴です。心静かに「動かざること山の如し」をモットーとすることが大切です。",ko:{1:{jd:"艮其趾。无咎",tai:"足を止め、動かない。現状維持に徹する時です。転職などはもってのほかです。"},2:{jd:"艮其腓。不拯其随",tai:"思うようにならない時です。我慢するしかないでしょう。"},3:{jd:"艮其限。列其寅",tai:"労苦して功少なく、中途で挫折しやすい時です。"},4:{jd:"艮其身。无咎",tai:"自分の分を守り、時の来るのを待つことです。"},5:{jd:"艮其輔。言有序",tai:"沈黙は金の時です。風格のある人は言葉を選ぶもの。"},6:{jd:"敦艮。吉",tai:"止まるところに見事に止まり終えて。仕上げは入念に。◎良い時です。"}}},
"5-7":{no:53,nm:"風山漸",rd:"ふうざんぜん",theme:"順序正しく進む時",qt:"漸。女帰吉。利貞。",src:"漸卦",unsei_txt:"漸は徐々に進むこと。基礎から着実に積み上げていく。インスタント仕立てではなく、順序正しく着実に進めていくことで、揺るぎない自信が培われ、最後は大きな喜びが花開くことになります。",ko:{1:{jd:"鴻漸于干。小子厲",tai:"出足が肝腎です。まだだいぶ、慎重に行動しましょう。"},2:{jd:"鴻漸于磐。飲食衎々。吉",tai:"収入も増え、ゆとりのある時です。◎良い時です。"},3:{jd:"鴻漸于陸",tai:"自分勝手な行動は災いの元になります。"},4:{jd:"鴻漸于木。或得其桷",tai:"まだまだ不安定な時です。これからが正念場、慎重に行動すること。"},5:{jd:"鴻漸于陵。終莫之勝。吉",tai:"長い間悩んでいたことが解決する時です。根気が大切。◎良い時です。"},6:{jd:"鴻漸于逵。其羽可用為儀。吉",tai:"順序や手本として仰ぎ見られるほど有終の美を飾れる時です。◎大変良い時です。"}}},
"4-2":{no:54,nm:"雷沢帰妹",rd:"らいたくきまい",theme:"順序が逆でチグハグな時",qt:"帰妹。征凶。无攸利。",src:"帰妹卦",unsei_txt:"雷沢帰妹の時は、とかく順序を無視して目先の欲望に走りやすい時です。その結果、手違いや間違いを起こし、終わりを全うすることが困難になりがちです。",ko:{1:{jd:"帰妹以娣。跛能履",tai:"実力のない時ですから控え目な態度で陰の力を発揮するほうが良い。二番目を選ぶ目を持つべし。"},2:{jd:"眇能視。利幽人之貞",tai:"まあまりに主張しすぎず、静かに自分の道を守ることを。"},3:{jd:"帰妹以須。反帰以娣",tai:"欲のままに動いて失敗しやすい時です。"},4:{jd:"帰妹愆期。遅帰有時",tai:"今は引き潮の時です。満ち潮の時まで焦らず待ち、機会を待つことです。"},5:{jd:"帝乙帰妹。月幾望。吉",tai:"名よりも実を選ぶべき時です。あなたの心の美しさが大いに人の心を打ちます。◎良い時です。"},6:{jd:"女承筐无実。士刲羊无血",tai:"形ばかりにチグハグな関係が成就できしない時です。"}}},
"4-3":{no:55,nm:"雷火豊",rd:"らいかほう",theme:"豊かで盛大な時",qt:"豊。亨。王仮之。勿憂。宜日中。",src:"豊卦",unsei_txt:"豊は豊かなこと、大なこと。雷火豊の時は、運気盛大な時こそ「盛れば食ける」という自然の法則を常に念頭に置き、心して進んでいくことを易経は教えています。",ko:{1:{jd:"遇其配主。雖旬无咎",tai:"信頼される存在になること。謙虚な気持ちを忘れず、相互に必ず協力しましょう。"},2:{jd:"豊其蔀。日中見斗",tai:"今は誤解されても下手に動かず、誠意を尽くして全力投球することです。"},3:{jd:"豊其沛。日中見沫",tai:"安全第一を考える時。"},4:{jd:"豊其蔀。日中見斗。遇其夷主。吉",tai:"力のある仲間に遭う。吉。協力、相談して行くことが必要です。"},5:{jd:"来章有慶。吉",tai:"文書、学問、文化面で名誉の得られる盛運の時です。◎大変良い時です。"},6:{jd:"豊其屋。蔀其家。凶",tai:"◎あなたの考え方、進み方に大きな欠陥があります。"}}},
"3-7":{no:56,nm:"火山旅",rd:"かざんりょ",theme:"移りゆく旅で人生の孤独を感じる時",qt:"旅。小亨。旅貞吉。",src:"旅卦",unsei_txt:"火山旅の時は、人生の旅の道中における孤独、不安、苦労、そして移り変わっていくことから不安定などを意味します。",ko:{1:{jd:"旅瑣瑣。斯其所取災",tai:"小さな利を見ることなく、大きなことを見さぬよう視野を広く持つこと。"},2:{jd:"旅即次。懐其資",tai:"まず欲張らないことです。"},3:{jd:"旅焚其次。喪其僮貞",tai:""},4:{jd:"旅于処。得其資斧",tai:"不安や苦労は一時的なものと心得、ほど良く止まることです。"},5:{jd:"射雉一矢亡。終以誉命",tai:"小さな投資で大きな収穫のある時です。◎火山旅の中では良い時です。"},6:{jd:"鳥焚其巣。旅人先笑後号啕。凶",tai:"旅の目的を忘れ、旅人の分限を忘れた末路でしょう。"}}},
"5-5":{no:57,nm:"巽為風",rd:"そんいふう",theme:"優柔不断は禁物の時",qt:"巽。小亨。利有攸往。利見大人。",src:"巽卦",unsei_txt:"巽為風の時は、信頼できる上司、先輩の意見をよく聞いて従うことで。自己を持たない人間は謙虚の美徳どころか、ただのイエスマン、あるいは薄情で信頼のおけぬ者とみなされ嫌われる。",ko:{1:{jd:"進退。利武人之貞",tai:"ぐずぐずと迷って、結局は何もできない時です。一度決めたのなら強い意志を持って腹を据えて行動すべき。"},2:{jd:"巽在牀下。用史巫紛若",tai:"情報不足で、疑いの多い時です。上下との交流を密にし、情報を集めること。"},3:{jd:"頻巽。吝",tai:"見境なくペコペコ頭を下げずに、分別とプライドを持って自分を取り戻すことです。"},4:{jd:"悔亡。田獲三品",tai:"幅広い情報を得て大いに働き、大いに利益の上がる時です。◎良い時です。"},5:{jd:"貞吉。悔亡。无不利",tai:"少多時間がかかっても臨機応変にしてかつ断固やり遂げるべき時です。◎良い時です。"},6:{jd:"巽在牀下。喪其資斧",tai:"完全に自分を見失っているイエスマンです。"}}},
"2-2":{no:58,nm:"兌為沢",rd:"だいたく",theme:"おしゃべりに注意の時",qt:"兌。亨。利貞。",src:"兌卦",unsei_txt:"兌は喜ぶこと。兌為沢の時には、小さいことには良くても、大きなことを行うにはパワー不足です。また何事も口先ばかりの時ですので、他人の口車に乗らないよう注意することです。",ko:{1:{jd:"和兌。吉",tai:"現状を守って、平和な時です。◎良い時です。"},2:{jd:"孚兌。吉。悔亡",tai:"誠実さが開運を招く時です。◎良い時です。"},3:{jd:"来兌。凶",tai:"うまい話は破滅のもとです。"},4:{jd:"商兌未寧。介疾有喜",tai:"邪悪なものから身を守って喜びがある。"},5:{jd:"孚于剥。有厲",tai:"詐欺に用心する時です。足をすくわれないよう気を許さず、身を守ることです。"},6:{jd:"引兌",tai:"志の低さを反省すべきです。"}}},
"5-6":{no:59,nm:"風水渙",rd:"ふうすいかん",theme:"良いことも悪いことも離散する時",qt:"渙。亨。王仮有廟。利渉大川。",src:"渙卦",unsei_txt:"風水渙の時は、苦難の中にあった人は今までの状態から解放されます。しかし、悩みがなかった人は逆に、職を追われたり一家離散など、安定していたものが散らされてしまう場合があります。",ko:{1:{jd:"用拯馬壮吉",tai:"力強き人の援助を急いで求めましょう。"},2:{jd:"渙奔其机。悔亡",tai:"有力者の援助を大急ぎで求める時です。基礎を固めて安定させること。"},3:{jd:"渙其躬。无悔",tai:"利己心を放とし、自分の身を粉にして全力投球する時です。"},4:{jd:"渙其群。元吉",tai:"いったん解散してこそ立派な大同団結ができる。◎大変良い時です。"},5:{jd:"渙汗其大号",tai:"大きなことを行って人のために骨折ることを惜しまなければ自らも利を得ることができます。◎良い時です。"},6:{jd:"渙其血。去逖出",tai:"面倒なことから速やかに退き、安全を図る時です。"}}},
"6-2":{no:60,nm:"水沢節",rd:"すいたくせつ",theme:"節度を正しく守る時",qt:"節。亨。苦節不可貞。",src:"節卦",unsei_txt:"節は節度、節制のこと。水沢節の時は、浪費や飲食の摂りすぎを戒め、身分不相応な願望を求めないということが大切です。",ko:{1:{jd:"不出戸庭。无咎",tai:"庭から外に出ない。完全防備で内部を固める時です。"},2:{jd:"不出門庭。凶",tai:"動くべき時に動かず、チャンスを逃して失敗する時です。"},3:{jd:"不節若則嗟若",tai:"節度を守らないと、やがて嘆き悲しむことになる。"},4:{jd:"安節。亨",tai:"節度を守って安泰を得る。◎良い時です。"},5:{jd:"甘節。吉",tai:"節度を保てる時です。◎良い時です。"},6:{jd:"苦節貞凶",tai:"◎あなたの考え方、進み方に問題点があります。"}}},
"5-2":{no:61,nm:"風沢中孚",rd:"ふうたくちゅうふ",theme:"真心が人を動かす時",qt:"中孚。豚魚吉。利渉大川。利貞。",src:"中孚卦",unsei_txt:"中孚は誠、真心ということ。風沢中孚の時は、誠があれば、万事順調に進みます。真心が人を動かします。",ko:{1:{jd:"虞吉。有它不燕",tai:"よく考えれば吉。本業を固くする時です。◎良い時です。"},2:{jd:"鳴鶴在陰。其子和之",tai:"以心伝心の時です。喜びも利益も分かち合うことが大切。◎大変良い時です。"},3:{jd:"得敵。或鼓或罷",tai:"何事も中途半端に終わるので、進んで事を行なわないことです。"},4:{jd:"月幾望。馬匹亡",tai:"良くない仲間とは縁を切る時です。◎良い時です。"},5:{jd:"有孚攣如。无咎",tai:"良きパートナーを得て心を一つにする時です。◎大変良い時です。"},6:{jd:"翰音登天。貞凶",tai:"長続きしない時です。"}}},
"4-7":{no:62,nm:"雷山小過",rd:"らいざんしょうか",theme:"身の程を知って進む時",qt:"小過。亨。利貞。可小事。不可大事。",src:"小過卦",unsei_txt:"雷山小過の時は、小事は積極的に取り組むが、大事は行うべきでない。こうした謙虚な気持ちがないと思わぬ災難を招きがちです。",ko:{1:{jd:"飛鳥以凶",tai:"強欲にも限度があります。"},2:{jd:"過其祖。遇其妣",tai:"直接当たるより代理人に当たったほうがうまくいく時。"},3:{jd:"弗過防之。従或戕之。凶",tai:""},4:{jd:"无咎。弗過遇之",tai:"むやみに人を信用したり、進んで事を起こすべからず。"},5:{jd:"密雲不雨。自我西郊",tai:"隠れた人材を探し出して協力を求めることです。"},6:{jd:"弗遇過之。飛鳥離之。凶",tai:""}}},
"6-3":{no:63,nm:"水火既済",rd:"すいかきせい",theme:"勝って兜の緒をしめる時",qt:"既済。亨小。利貞。初吉終乱。",src:"既済卦",unsei_txt:"既済は完成、すでに済（ととのう）の意味。水火既済の時は、完成した状態をどうすれば維持できるのかを心すべきです。新規に始めることは避け、今以上のものを求めないことが大切です。治に居て乱を忘れぬよう、気持ちを引き締め備えることです。",ko:{1:{jd:"曳其輪。濡其尾。无咎",tai:"車輪を縄で縛りつける。今は何事も前進するときではありません。しばらく心身を休めましょう。"},2:{jd:"婦喪其茀。勿逐。七日得",tai:"放任主義が一番の時です。トラブルが起こっても自然に解決しますので、ゆったりと構えて待つことです。"},3:{jd:"高宗伐鬼方。三年克之。小人勿用",tai:"冒険心が首をもたげる時ですが、一般人のあなたはぐっと我慢して、独立、転職などは思い止まるべきです。"},4:{jd:"繻有衣袽。終日戒",tai:"いざという場合に備えて、細心の注意を払うことです。"},5:{jd:"東隣殺牛。不如西隣之禴祭実其福",tai:"派手に振る舞って外見や見栄にこだわるよりも、内容の充実を第一に図るべき時です。"},6:{jd:"濡其首。厲",tai:"才能も経験も不足しているのに欲しかなぐり捨て即刻退くことです。"}}},
"3-6":{no:64,nm:"火水未済",rd:"かすいびせい",theme:"大きな人生目標に向かって進む時",qt:"未済。亨。小狐汔済。濡其尾。",src:"未済卦",unsei_txt:"未済はまだ事が成就していないという意味。火水未済の時、努力すれば通じる。これからのあなたの人生に素晴らしい未来と可能性が含まれているのですから。",ko:{1:{jd:"濡其尾。吝",tai:"あなたは焦っていないか。こういう状態で突進すれば必ず失敗する。まず実力をつけよ。"},2:{jd:"曳其輪。貞吉",tai:"焦らず動かず、現状維持といったところです。"},3:{jd:"未済征凶。利渉大川",tai:"大きな人生目標の計画と準備に取りかかる時です。"},4:{jd:"貞吉。悔亡",tai:"多少時間がかかっても苦労が実り、大いに実績も上がる。放り出さずに頑張り抜くこと。"},5:{jd:"貞吉。无悔。君子之光",tai:"輝くほどの誠実さをもって進みましょう。◎良い時です。"},6:{jd:"有孚于飲酒。无咎",tai:"節制を心がけ、有終の美を飾るべく気を引き締めましょう。"}}}

// ===== ダイス描画 =====
function getCurrentCI(){return step<2?step:2;}
function drawOctahedron(face,ci,by){
  const s=64,y=by||0;const[br,bg,bb]=DICE_RGB[ci];const tc=DICE_TC[ci];
  const cos=Math.cos(rotA),sin=Math.sin(rotA);
  const vRaw=[[0,s,0],[0,-s,0],[-s,0,0],[s,0,0],[0,0,s],[0,0,-s]];
  const verts=vRaw.map(([x,yy,z])=>{const nx=x*cos+z*sin,nz=-x*sin+z*cos;const sc=200/(nz+270);return{px:nx*sc+CX,py:-yy*sc+CY-10+y,z:nz};});
  const faces=[[0,3,4],[0,4,2],[0,2,5],[0,5,3],[1,4,3],[1,2,4],[1,5,2],[1,3,5]];
  const fd=faces.map(f=>{const p=f.map(vi=>verts[vi]);const avgZ=(p[0].z+p[1].z+p[2].z)/3;const ax=p[1].px-p[0].px,ay=p[1].py-p[0].py,bx=p[2].px-p[0].px,by2=p[2].py-p[0].py;return{p,avgZ,cross:ax*by2-ay*bx,cx:(p[0].px+p[1].px+p[2].px)/3,cy:(p[0].py+p[1].py+p[2].py)/3};});
  fd.sort((a,b)=>b.avgZ-a.avgZ);
  const vis=fd.filter(f=>f.cross<0);const minZ=vis.length?Math.min(...vis.map(f=>f.avgZ)):0;
  vis.forEach(f=>{
    const bright=Math.max(0.35,Math.min(1,0.65+(-f.avgZ/165)));
    ctx.beginPath();ctx.moveTo(f.p[0].px,f.p[0].py);ctx.lineTo(f.p[1].px,f.p[1].py);ctx.lineTo(f.p[2].px,f.p[2].py);ctx.closePath();
    ctx.fillStyle=`rgb(${Math.round(br*bright)},${Math.round(bg*bright)},${Math.round(bb*bright)})`;ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=0.8;ctx.stroke();
    if(f.avgZ===minZ&&face){const lbl=TG[(face-1)%8];ctx.save();ctx.fillStyle=tc;ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(lbl.n),f.cx,f.cy-9);ctx.font='12px sans-serif';ctx.fillText(lbl.k,f.cx,f.cy+9);ctx.restore();}
  });
  ctx.beginPath();ctx.ellipse(CX,CY+s+y+4,s*0.5,7,0,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fill();
}
function drawCube(face,by){
  const s=48,y=by||0;const[br,bg,bb]=DICE_RGB[2];const tc=DICE_TC[2];
  const cos=Math.cos(rotA),sin=Math.sin(rotA);
  const vRaw=[[-s,-s,-s],[s,-s,-s],[s,s,-s],[-s,s,-s],[-s,-s,s],[s,-s,s],[s,s,s],[-s,s,s]];
  const verts=vRaw.map(([x,yy,z])=>{const nx=x*cos+z*sin,nz=-x*sin+z*cos;const sc=200/(nz+270);return{px:nx*sc+CX,py:-yy*sc+CY-8+y,z:nz};});
  const faces=[[0,1,2,3],[4,7,6,5],[0,4,5,1],[3,2,6,7],[0,3,7,4],[1,5,6,2]];
  const fd=faces.map(f=>{const pts=f.map(vi=>verts[vi]);const avgZ=pts.reduce((s2,p)=>s2+p.z,0)/4;const ax=pts[1].px-pts[0].px,ay=pts[1].py-pts[0].py,bx=pts[2].px-pts[0].px,by2=pts[2].py-pts[0].py;return{pts,avgZ,cross:ax*by2-ay*bx,cx:pts.reduce((s2,p)=>s2+p.px,0)/4,cy:pts.reduce((s2,p)=>s2+p.py,0)/4};});
  fd.sort((a,b)=>b.avgZ-a.avgZ);
  const vis=fd.filter(f=>f.cross<0);const minZ=vis.length?Math.min(...vis.map(f=>f.avgZ)):0;
  vis.forEach(f=>{
    const bright=Math.max(0.45,Math.min(1,0.7+(-f.avgZ/165)));
    ctx.beginPath();ctx.moveTo(f.pts[0].px,f.pts[0].py);f.pts.slice(1).forEach(p=>ctx.lineTo(p.px,p.py));ctx.closePath();
    ctx.fillStyle=`rgb(${Math.round(br*bright)},${Math.round(bg*bright)},${Math.round(bb*bright)})`;ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=0.8;ctx.stroke();
    if(f.avgZ===minZ&&face){ctx.save();ctx.fillStyle=tc;ctx.font='bold 44px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(face),f.cx,f.cy);ctx.restore();}
  });
  ctx.beginPath();ctx.ellipse(CX,CY+s+y+6,s*0.55,7,0,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fill();
}
function redraw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  const ci=getCurrentCI();
  const df=faceShown?curFace:idleFace;
  if(ci<2)drawOctahedron(df,ci,bounceY);else drawCube(df,bounceY);
}
function frame(){
  rotA+=spinV;spinV*=0.965;
  if(bouncing){bounceY+=bounceV;bounceV+=2.8;if(bounceY>=0){bounceY=0;bounceV*=-0.38;if(Math.abs(bounceV)<2.5){bouncing=false;bounceV=0;bounceY=0;}}}
  redraw();
  if(Math.abs(spinV)>0.001||bouncing)rafId=requestAnimationFrame(frame);else{rafId=null;spinV=0;}
}
function doRoll(){
  if(rolling||diceDisabled)return;
  rolling=true;faceShown=false;curFace=null;
  spinV=0.22+Math.random()*0.16;bounceY=-90;bounceV=0;bouncing=true;
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}frame();
  setTimeout(()=>{
    const max=step<2?8:6;curFace=Math.floor(Math.random()*max)+1;idleFace=curFace;spinV=0.015;
    setTimeout(()=>{faceShown=true;bouncing=false;bounceY=0;spinV=0;redraw();rolling=false;setTimeout(()=>recordRoll(curFace),500);},300);
  },950);
}
cv.addEventListener('click',doRoll);
let lastShake=0;
window.addEventListener('devicemotion',e=>{
  const a=e.acceleration;if(!a)return;
  const f=Math.abs(a.x)+Math.abs(a.y)+Math.abs(a.z);
  const now=Date.now();
  if(f>20&&now-lastShake>1000&&step<3&&method==='shake'&&!diceDisabled){lastShake=now;doRoll();}
});

// ===== 手入力グリッド =====
function buildManualGrid(){
  const isKo=(step===2);const max=isKo?6:8;
  document.getElementById('manualTitle').textContent=MANUAL_TITLES[step];
  const g=document.getElementById('manualGrid');g.innerHTML='';
  const grid=document.createElement('div');grid.className=isKo?'grid6':'grid8';
  for(let i=1;i<=max;i++){
    const b=document.createElement('button');
    const btnClass=isKo?'pick-btn pick-btn-ko':step===0?'pick-btn pick-btn-red':'pick-btn pick-btn-black';
    b.className=btnClass;
    if(!isKo){const t=TG[i-1];b.innerHTML=`<strong style="font-size:15px">${i}</strong><br><span style="font-size:12px">${t.k}</span><br><span style="font-size:10px;color:#5a5870">${t.r}</span>`;}
    else b.innerHTML=`<strong style="font-size:18px">${i}</strong><br><span style="font-size:11px;color:#5a5870">第${i}爻</span>`;
    b.onclick=(v=>()=>recordRoll(v))(i);grid.appendChild(b);
  }
  g.appendChild(grid);
}

// ===== メソッド切替 =====
function setMethod(m){
  method=m;
  document.getElementById('btnShake').classList.toggle('active',m==='shake');
  document.getElementById('btnManual').classList.toggle('active',m==='manual');
  document.getElementById('shakeUI').classList.toggle('hidden',m!=='shake');
  document.getElementById('manualUI').classList.toggle('hidden',m!=='manual');
  if(m==='manual')buildManualGrid();
  else{faceShown=false;idleFace=Math.floor(Math.random()*8)+1;redraw();}
}

// ===== ロール記録 =====
function recordRoll(val){
  if(step>=3)return;
  faceShown=true;curFace=val;idleFace=val;redraw();
  const log=document.getElementById('rollLog');
  const row=document.createElement('div');row.className='log-row';
  const dot=document.createElement('span');dot.className='log-dot';dot.style.background=DOT_COLORS[step];
  const txt=document.createElement('span');
  if(step===0){upper=val;txt.textContent=`赤（上卦） → ${val}（${TG[val-1].k}・${TG[val-1].r}）`;}
  else if(step===1){lower=val;txt.textContent=`黒（下卦） → ${val}（${TG[val-1].k}・${TG[val-1].r}）`;}
  else{koNum=val;txt.textContent=`白（爻） → ${koLabel(val)}`;}
  row.appendChild(dot);row.appendChild(txt);log.appendChild(row);
  step++;
  if(step<3){
    document.getElementById('step3txt').textContent=STEP_LABELS[step];
    faceShown=false;curFace=null;idleFace=Math.floor(Math.random()*(step<2?8:6))+1;
    bouncing=false;bounceY=0;spinV=0.04;rotA=0.5;
    if(rafId){cancelAnimationFrame(rafId);rafId=null;}frame();
    if(method==='manual')buildManualGrid();
    else document.getElementById('diceLabel').textContent='タップして振る';
  } else {
    diceDisabled=true;
    const rank=HEXKK[`${upper}-${lower}`]||'C';
    showKkBadge(rank);
    document.getElementById('goBtn').disabled=false;
    document.getElementById('goBtn').textContent='✦ 鑑定する';
    if(method==='manual'){document.getElementById('manualTitle').textContent='3投完了！「鑑定する」を押してください';document.getElementById('manualGrid').innerHTML='';}
    else document.getElementById('diceLabel').textContent='3投完了！「鑑定する」を押してください';
  }
}

// ===== Gemini API呼び出し =====
function formatResponse(text){
  // ** ** の強調を除去
  text=text.replace(/\*\*([^*]+)\*\*/g,'$1');
  // * で始まる行も除去
  text=text.replace(/^\*\s+/gm,'');

  // セクションタグで分割
  const sections=[];
  const tags=['[共感]','[卦の意味]','[爻の教え]','[アドバイス]','[メッセージ]'];
  const labels={'[卦の意味]':'📖 この卦が伝えること','[爻の教え]':'⚡ 爻の教え','[アドバイス]':'✦ アドバイス','[メッセージ]':''};
  const classes={'[共感]':'ai-empathy','[卦の意味]':'ai-hexmeaning','[爻の教え]':'ai-koteaching','[アドバイス]':'ai-advice','[メッセージ]':'ai-message'};

  let remaining=text;
  let order=['[共感]'];
  // テキスト内のタグを順番に探す
  tags.forEach(t=>{if(text.includes(t)&&!order.includes(t))order.push(t);});

  // タグがない場合はそのまま表示
  if(order.length===1&&!text.includes('[共感]')){
    return `<div class="ai-section ai-empathy"><div class="ai-sec-body">${text.replace(/\n/g,'<br>')}</div></div>`;
  }

  let html='';
  for(let i=0;i<order.length;i++){
    const tag=order[i];
    const nextTag=order[i+1];
    const start=text.indexOf(tag);
    if(start===-1)continue;
    const contentStart=start+tag.length;
    const end=nextTag?text.indexOf(nextTag):text.length;
    let body=text.slice(contentStart,end).trim();
    const cls=classes[tag]||'ai-empathy';
    const label=labels[tag]!==undefined?labels[tag]:'';

    if(tag==='[アドバイス]'){
      // 箇条書きをliに変換
      const items=body.split(/\n/).filter(l=>l.trim().match(/^[・•1-9]/));
      if(items.length>0){
        const liHtml=items.map(l=>l.replace(/^[・•\d.]\s*/,'')).map(l=>`<li>${l}</li>`).join('');
        html+=`<div class="ai-section ${cls}"><div class="ai-sec-label">${label}</div><div class="ai-sec-body"><ul>${liHtml}</ul></div></div>`;
      }else{
        // 箇条書きなしの場合も通常テキストで表示
        html+=`<div class="ai-section ${cls}"><div class="ai-sec-label">${label}</div><div class="ai-sec-body">${body.replace(/\n/g,'<br>')}</div></div>`;
      }
    }else{
      html+=`<div class="ai-section ${cls}">${label?`<div class="ai-sec-label">${label}</div>`:''}<div class="ai-sec-body">${body.replace(/\n/g,'<br>')}</div></div>`;
    }
  }
  return html||`<div class="ai-section ai-empathy"><div class="ai-sec-body">${text.replace(/\n/g,'<br>')}</div></div>`;
}

async function callGemini(systemPrompt,userPrompt){
  if(!apiKey)throw new Error('APIキーが設定されていません');
  const endpoint=`https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
  const body={
    contents:[{parts:[{text:`${systemPrompt}\n\n${userPrompt}`}]}],
    generationConfig:{maxOutputTokens:8000,temperature:0.8}
  };
  const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!res.ok){const e=await res.json();throw new Error(e.error?.message||`HTTP ${res.status}`);}
  const data=await res.json();
  const text=data.candidates?.[0]?.content?.parts?.[0]?.text;
  if(!text)throw new Error('Geminiからの応答が空でした');
  return text;
}

// ===== 鑑定開始 =====

    ?`■ 今回引いた卦と爻

    :`上卦：${upper}番 ${uT.k}（${uT.r}）\n下卦：${lower}番 ${lT.k}（${lT.r}）\n爻：${koLabelStr}`;

  const systemPrompt=`あなたは易経（I Ching）の智慧に精通した、その人だけのパーソナルカウンセラーです。

相談者の悩みに深く寄り添い、引いた「爻」の教えを中心に、その人だけへのメッセージを届けてください。
読み終えたとき、背中をそっと押されたように感じる鑑定文を書いてください。

【出力フォーマット】
以下のフォーマットで出力してください：

[共感]
（相談者の気持ちに寄り添う。2文）

[爻の教え]
（引いた爻辞を引用し、今の状況への意味を2〜3文で。短く鋭く）

[アドバイス]
・（今日できる具体的な行動1）
・（今日できる具体的な行動2）
・（今日できる具体的な行動3）

[メッセージ]
（背中を押す一言。1〜2文）`;

  const userPrompt=`【相談者の悩み】
「${question}」

この悩み「${question}」に直接答える鑑定文を書いてください。
鑑定文のすべての部分で、この悩みの具体的な内容を必ず使うこと。抽象論禁止。

【易経データ】
${hexInfo}`;

  let text='';
  try{
    text=await callGemini(systemPrompt,userPrompt);
  }catch(err){
    clearInterval(lt);
    document.getElementById('phaseLoading').classList.add('hidden');
    document.getElementById('phaseInput').classList.remove('hidden');
    document.getElementById('errorBox').textContent=`エラー：${err.message}`;
    document.getElementById('errorBox').classList.remove('hidden');
    return;
  }

  clearInterval(lt);

  // 結果表示
  // 卦の爻表示：下卦の下爻から上卦の上爻へ（画面上は上から下に表示するので逆順）
  const ln=[...[...lT.l].reverse(),...[...uT.l].reverse()].reverse();
  const ll=document.getElementById('resLines');ll.innerHTML='';
  ln.forEach(l=>{const d=document.createElement('div');if(l===1){d.className='hl';}else{d.className='hlb';d.innerHTML='<span></span><span></span>';}ll.appendChild(d);});

  document.getElementById('resNo').textContent=`第${h?h.no:'?'}卦　${koLabel(koNum)}`;

  step=0;upper=null;lower=null;koNum=null;
  rolling=false;diceDisabled=false;
  faceShown=false;curFace=null;idleFace=Math.floor(Math.random()*8)+1;
  bouncing=false;bounceY=0;bounceV=0;spinV=0;rotA=0.5;
  document.getElementById('rollLog').innerHTML='';
  document.getElementById('qinput').value='';
  document.getElementById('goBtn').disabled=true;
