<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon-crystal.png" type="image/png">
<meta name="theme-color" content="#EDF0F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>マイページ｜四柱推命占い自動鑑定</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#F7F1E4;--card:#fff;--ink:#241C12;--ink2:#4A4030;--muted:#8B7E68;--line:#E7DCC4;--line2:#D8C9A8;
        --ka:#E8392B;--ka-d:#C0452F;--ka-w:#FCE7E5;--gold:#E2A12B;--mok:#1FA463;--sui:#2A6FD0;--shadow:0 10px 30px rgba(60,40,10,.10)}
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;color:var(--ink);
    background:radial-gradient(1000px 460px at 82% -10%,rgba(226,161,43,.16),transparent 60%),
      radial-gradient(900px 520px at -8% 4%,rgba(232,93,158,.16),transparent 58%),
      linear-gradient(180deg,#FBF6EA,#F7F1E4);min-height:100vh;-webkit-font-smoothing:antialiased}
  .topbar{background:rgba(251,246,234,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .tb-in{max-width:640px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:11px}
  .tb-logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(160deg,#F2A03A,#EE5B48,#E8508E);display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
  .tb-title{font-weight:900;font-size:15px}.tb-title span{color:var(--ka-d)}.tb-spacer{flex:1}
  .tb-link{font-size:12.5px;font-weight:800;color:var(--sui);text-decoration:none}
  main{max-width:640px;margin:0 auto;padding:28px 20px 56px}
  h1{font-size:22px;font-weight:900;margin:0 0 4px}
  .lead{color:var(--muted);font-size:13px;font-weight:700;margin:0 0 22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px 20px;margin-bottom:16px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .row .k{font-size:13px;font-weight:900;color:var(--ink2)}
  .row .v{font-size:14px;font-weight:800;color:var(--ink);text-align:right}
  .pill{display:inline-block;font-size:12px;font-weight:900;border-radius:999px;padding:4px 12px}
  .pill.trial{background:#E7F7EE;color:#127a45;border:1px solid #B7E6CC}
  .cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    background:linear-gradient(135deg,#F0533F,#E8392B 60%,#C0452F);color:#fff;font-weight:900;font-size:17px;
    padding:15px 22px;border:0;border-radius:999px;cursor:pointer;text-decoration:none;box-shadow:0 10px 24px rgba(232,57,43,.34);font-family:inherit;margin-top:4px}
  .cta:active{transform:translateY(1px)}
  .ghost{display:block;width:100%;text-align:center;margin-top:11px;background:#fff;color:var(--ink2);border:2px solid var(--line2);
    border-radius:999px;padding:12px;font-weight:900;font-size:13.5px;cursor:pointer;text-decoration:none;font-family:inherit}
  .sec-t{font-size:12.5px;font-weight:900;color:var(--muted);margin:22px 4px 8px}
  .demo-note{background:#FBF1DC;border:1px solid #EBD3B4;border-radius:14px;padding:14px 16px;font-size:12px;color:#8A6A2E;font-weight:700;line-height:1.85;margin-top:18px}
  .demo-note b{color:#7A551C}
  #msg{margin-top:12px;padding:12px 14px;border-radius:10px;font-weight:800;font-size:13px;line-height:1.7;display:none}
  #msg.ok{background:#E7F7EE;color:#127a45;border:1px solid #B7E6CC;display:block}
  footer{border-top:1px solid var(--line);margin-top:30px;padding:20px;text-align:center;font-size:12px;color:var(--muted);line-height:1.9}
  footer a{color:var(--sui);text-decoration:none}
</style>
</head>
<body>
<header class="topbar"><div class="tb-in">
  <div class="tb-logo"><img src="icon-crystal.png" alt="" style="height:1.2em;width:auto;vertical-align:-0.26em;"></div><div class="tb-title">四柱推命 <span>自動鑑定</span></div>
  <div class="tb-spacer"></div><a class="tb-link" href="pricing-pro.html">料金プラン</a>
</div></header>

<main>
  <h1>マイページ</h1>
  <p class="lead">ご契約状況の確認と、解約のお手続きができます。</p>

  <div class="sec-t">ご契約状況</div>
  <div class="card">
    <div class="row"><span class="k">ログイン中</span><span class="v" id="v-email">—</span></div>
    <div class="row"><span class="k">ご契約プラン</span><span class="v" id="v-plan">—</span></div>
    <div class="row"><span class="k">お支払い方法</span><span class="v" id="v-card">—</span></div>
    <div class="row"><span class="k">ステータス</span><span class="v"><span class="pill trial" id="v-status">無料トライアル中</span></span></div>
    <div class="row"><span class="k">無料期間</span><span class="v">一週間（この期間中の解約は費用0円）</span></div>
    <div class="row"><span class="k">次回のお支払い予定</span><span class="v" id="v-next">無料期間の終了後</span></div>
  </div>

  <div class="sec-t">鑑定をつづける</div>
  <a class="cta" href="app-pro.html">▶ 鑑定ツールをひらく</a>

  <div class="sec-t">解約のお手続き</div>
  <div class="card">
    <div class="row"><span class="k">プランの解約</span><span class="v"><button class="ghost" style="margin:0;width:auto;padding:9px 16px" id="cancelBtn">解約する</button></span></div>
  </div>
  <div id="msg"></div>
  <!-- ※ この画面はフロントのみ。ご契約状況の取得と解約処理はバックエンド（エンジニア担当）に接続してください。
       接続点は下の CONFIG（auth-verify と同じ Netlify Functions 想定）。CONFIG.STUB=false で本番接続。 -->

  <div class="demo-note">
    ※ ご登録のプラン・お支払い方法・ご契約状況を表示します。解約はこの画面からいつでもお手続きいただけます（無料期間中の解約は費用0円）。
  </div>
</main>

<footer>
  <div>
    <a href="index.html">本格版の紹介</a>・<a href="pricing-pro.html">料金</a>・
    <a href="terms-pro.html">利用規約</a>・<a href="tokushoho-pro.html">特定商取引法に基づく表記</a>・<a href="privacy-pro.html">プライバシーポリシー</a>
  </div>
  <div style="margin-top:8px;color:#8B7E68">© 四柱推命占い自動鑑定（72k株式会社）</div>
</footer>

<script>
(function(){
  "use strict";

  /* ============================================================
     ★エンジニア接続ポイント（CONFIG）
     ご契約状況の取得と解約処理はバックエンド（エンジニア担当）で実装してください。
     STUB=true の間はネットワークを叩かず、登録時に保存したブラウザ内の値で表示します（画面確認用）。
     バックエンド接続時は STUB=false にしてください。
     ============================================================ */
  var CONFIG = {
    STUB: true,                          // ← バックエンド未接続の間は true
    API:  '/.netlify/functions',
    STATUS: '/check-subscription',       // POST {email} → {status, plan, cardLast4, nextChargeAt} 契約状況の取得
    CANCEL: '/cancel-subscription'       // POST {email} → {ok:true} 解約処理（次回更新分から停止）
  };

  function g(k){ try{return localStorage.getItem(k)||'';}catch(e){return '';} }
  var email=g('member_email');
  var PLAN={month:'月額プラン（9,800円／月・税込）',year:'年間プラン（98,000円／年・税込）',half:'半年プラン（52,800円／半年・税込）'};
  var STATUS_JA={active:'課金中',trialing:'無料トライアル中',past_due:'支払い遅延',canceled:'解約手続き済み',unpaid:'未払い',none:'未契約'};
  var msg=document.getElementById('msg');

  // 画面にご契約状況を反映（STUB=ブラウザ内の値／本番=STATUSエンドポイントの返り値）
  function render(s){
    document.getElementById('v-email').textContent = email || '未ログイン';
    document.getElementById('v-plan').textContent  = PLAN[s.plan] || PLAN[g('selected_plan')] || '年間プラン（98,000円／年・税込）';
    document.getElementById('v-card').textContent  = s.cardLast4 ? ('クレジットカード（**** '+s.cardLast4+'）') : 'クレジットカード（登録済み）';
    if(s.status){ document.getElementById('v-status').textContent = STATUS_JA[s.status]||s.status; }
    if(s.nextChargeAt){ document.getElementById('v-next').textContent = s.nextChargeAt; }
  }

  /* ★エンジニア接続ポイント：ご契約状況の取得 */
  async function loadStatus(){
    if(CONFIG.STUB){ render({ plan:g('selected_plan'), cardLast4:g('card_last4') }); return; }
    try{
      var r=await fetch(CONFIG.API+CONFIG.STATUS,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})});
      render(await r.json());
    }catch(e){ render({ plan:g('selected_plan'), cardLast4:g('card_last4') }); }
  }
  loadStatus();

  /* ★エンジニア接続ポイント：解約処理 */
  async function doCancel(){
    if(CONFIG.STUB){ return {ok:true}; }
    var r=await fetch(CONFIG.API+CONFIG.CANCEL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})});
    if(!r.ok) throw new Error('cancel failed '+r.status);
    return r.json();
  }
  var btn=document.getElementById('cancelBtn');
  btn.onclick=function(){
    if(!confirm('本当に解約しますか？\n（無料期間中の解約は費用0円です）')) return;
    btn.disabled=true;
    doCancel().then(function(){
      document.getElementById('v-status').textContent='解約手続き済み';
      document.getElementById('v-status').style.cssText='background:#FCE7E5;color:#b32a20;border:1px solid #f3c2bd';
      msg.className='ok';
      msg.innerHTML='解約のお手続きを受け付けました。無料期間中のため、料金は一切かかりません。ご利用ありがとうございました。';
      window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    }).catch(function(){
      btn.disabled=false;
      msg.className='ok'; msg.style.cssText='background:#FCE7E5;color:#b32a20;border:1px solid #f3c2bd;display:block';
      msg.textContent='ただいま解約手続きができませんでした。時間をおいて再度お試しください。';
    });
  };
})();
</script>
</body>
</html>
