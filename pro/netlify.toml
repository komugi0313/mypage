# 四柱推命PRO版：サーバーレス関数の場所。AI鑑定(Gemini)はサーバー中継でキーをブラウザに出さない。
# ※既存の会員・マイページ関数（check-subscription / mypage-get / mypage-put）も同じ functions ディレクトリに配置してください。
[build]
  functions = "functions"

# AI鑑定：/api/gemini でも /.netlify/functions/gemini でも到達できるように別名を用意（クライアントは後者を直接呼ぶ）
[[redirects]]
  from = "/api/gemini"
  to = "/.netlify/functions/gemini"
  status = 200
