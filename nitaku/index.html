<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>究極の二択診断｜選ぶだけで本音がバレる（無料）</title>
<meta name="description" content="恋愛編・ふつう編の究極の二択に答えるだけで、小悪魔度や心の中がちょっと見える無料の診断。みんなで遊べるモードつき。">
<meta property="og:title" content="究極の二択診断｜選ぶだけで本音がバレる（無料）">
<meta property="og:description" content="年収2000万の好きじゃない人 vs 貯金ゼロの大好きな人。あなたはどっち？ 小悪魔度がわかる無料診断。みんなで遊べるモードつき。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F3ECFF">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF4F0; --card:#FFFFFF; --ink:#2A1F2D; --sub:#5E5164; --line:#EADFE3;
  --a:#B0174F; --b:#3341A0; --accent:#B0174F; --soft:#FCE4EC;
  --ok:#1B6E4F;
}
body[data-mode="normal"]{ --a:#00695C; --b:#AD3A0B; --accent:#00695C; --soft:#E0F2F1; --bg:#F3F7F4; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.7;min-height:100vh;transition:background .3s}
button{font:inherit;color:inherit;cursor:pointer;min-height:44px;-webkit-tap-highlight-color:transparent}
input{font:inherit;min-height:44px}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 48px}
.scr{display:none;animation:fade .25s ease}
.scr.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:40px;line-height:1.2;margin:4px 0 6px;font-weight:900;letter-spacing:.02em;text-align:center}
h1 .vs{display:inline-block;font-size:22px;background:var(--ink);color:#fff;border-radius:999px;padding:2px 12px;vertical-align:middle;margin:0 4px}
.lead{text-align:center;color:var(--sub);margin:0 0 12px;font-size:16px;font-weight:700;line-height:1.6}
.kicker{text-align:center;margin:14px 0 0;font-size:14px;font-weight:900;color:var(--accent);letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:0 0 14px}
.chips span{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:900;color:var(--ink)}
.teaser{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 12px 14px;text-align:center}
.teaser .tq{font-size:14px;font-weight:900;color:var(--sub);margin-bottom:8px}
.teaser .tab{border-radius:14px;padding:10px 12px;color:#fff;font-weight:700;font-size:15px;line-height:1.5}
.teaser .tab.A{background:var(--a)} .teaser .tab.B{background:var(--b)}
.teaser .tvs{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:0 12px;font-weight:900;font-size:14px;margin:6px 0}
h2{font-size:20px;margin:22px 0 10px;font-weight:900}
.label{font-size:14px;color:var(--sub);font-weight:700;margin:18px 0 8px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border:3px solid var(--line);background:var(--card);border-radius:20px;padding:16px 10px;text-align:center}
.mode .ic{font-size:34px;line-height:1.2}
.mode b{display:block;font-size:19px;margin-top:4px}
.mode small{display:block;color:var(--sub);font-size:12px;line-height:1.5;margin-top:4px}
.mode[aria-pressed="true"][data-m="love"]{border-color:#B0174F;background:#FCE4EC}
.mode[aria-pressed="true"][data-m="normal"]{border-color:#00695C;background:#E0F2F1}
.seg{display:flex;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;font-weight:700;font-size:15px;padding:8px 4px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg2 button{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.3;padding:8px 2px}
.seg2 button b{font-size:16px;font-weight:900}
.seg2 button small{font-size:12px;font-weight:700;opacity:.85;margin-top:2px}
.field{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.field input[type=date],.field input[type=text]{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink)}
.hint{font-size:13px;color:var(--sub);margin:6px 0 0;line-height:1.6}
.big{display:block;width:100%;border:0;border-radius:18px;padding:16px;font-size:19px;font-weight:900;background:var(--ink);color:#fff;margin-top:22px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.big.alt{background:var(--card);color:var(--ink);border:2px solid var(--ink);box-shadow:none;margin-top:12px}
.link{background:none;border:0;color:var(--sub);text-decoration:underline;font-size:14px;padding:8px}
.note{font-size:12px;color:var(--sub);text-align:center;margin-top:24px;line-height:1.7}

/* 名前入力（飲み会） */
.prow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;margin-bottom:10px}
.prow .pf{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px}
.prow .pf input{width:100%;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff;color:var(--ink)}
.prow .pf input+input{margin-top:6px}
.prow .pf label{display:block;font-size:12px;color:var(--sub);margin-top:6px}
.del{border:2px solid var(--line);background:var(--card);border-radius:12px;width:44px;font-size:18px}
.add{width:100%;border:2px dashed var(--sub);background:transparent;border-radius:14px;padding:10px;font-weight:700;color:var(--sub)}

/* 問題 */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back{border:0;background:transparent;color:var(--sub);font-weight:700;padding:0 6px}
.prog{flex:1;height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.count{font-weight:900;font-size:15px;min-width:52px;text-align:right}
.turn{text-align:center;margin:14px 0 0;font-weight:900;font-size:16px}
.turn span{background:var(--ink);color:#fff;border-radius:999px;padding:4px 14px}
.qhead{text-align:center;font-size:22px;font-weight:900;margin:18px 0 12px}
.choice{display:block;width:100%;border:0;border-radius:22px;padding:22px 18px 22px 58px;text-align:left;font-size:19px;font-weight:700;line-height:1.6;color:#fff;position:relative;min-height:110px;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .12s}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.choice .tag{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:17px}
.choice.A{background:var(--a)} .choice.A .tag{color:var(--a)}
.choice.B{background:var(--b)} .choice.B .tag{color:var(--b)}
.choice.picked{outline:4px solid var(--ink);outline-offset:3px}
.vsmark{display:flex;align-items:center;justify-content:center;margin:-8px 0;position:relative;z-index:2}
.vsmark b{background:var(--ink);color:#fff;border:4px solid var(--bg);border-radius:50%;width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900}

/* 見せ合う（その場で全員） */
.orow{display:grid;grid-template-columns:1fr 64px 64px;gap:8px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 8px 6px 14px;margin-bottom:8px}
.orow b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow button{border:2px solid var(--line);background:#fff;border-radius:12px;font-weight:900;font-size:18px}
.orow button.onA{background:var(--a);color:#fff;border-color:var(--a)}
.orow button.onB{background:var(--b);color:#fff;border-color:var(--b)}
.mini{font-size:14px;line-height:1.5;padding:14px 14px 14px 52px;min-height:0}
.mini .tag{width:26px;height:26px;font-size:14px;left:14px}

/* 渡す画面 */
.pass{text-align:center;padding-top:60px}
.pass .who{font-size:34px;font-weight:900;margin:12px 0}
.pass p{color:var(--sub)}
.pass .eye{font-size:56px}

/* 発表 */
.rev{background:var(--card);border-radius:20px;padding:16px;border:2px solid var(--line)}
.rev .side{border-radius:14px;padding:12px 14px;margin-bottom:10px;color:#fff}
.rev .side.A{background:var(--a)} .rev .side.B{background:var(--b)}
.rev .side .t{font-weight:700;font-size:15px;line-height:1.5}
.rev .side .n{margin-top:6px;font-size:15px}
.rev .side .n span{display:inline-block;background:rgba(255,255,255,.95);color:var(--ink);border-radius:999px;padding:2px 10px;margin:3px 4px 0 0;font-weight:700}
.rev .side .pct{float:right;font-weight:900;font-size:22px;margin-left:8px}
.comment{text-align:center;font-weight:900;font-size:19px;margin:12px 0 0}

/* 結果 */
.res-hero{background:var(--card);border-radius:24px;padding:22px 18px;text-align:center;border:3px solid var(--accent);position:relative}
.res-hero .pre{font-size:14px;color:var(--sub);font-weight:700}
.res-hero .type{font-size:32px;font-weight:900;line-height:1.3;margin:6px 0;color:var(--accent)}
.res-hero .catch{font-size:16px;font-weight:700}
.res-hero .subt{display:inline-block;margin-top:10px;background:var(--soft);border-radius:999px;padding:4px 14px;font-size:14px;font-weight:700}
.meter{margin:18px 0 4px}
.meter .num{font-size:54px;font-weight:900;line-height:1;color:var(--accent)}
.meter .num small{font-size:22px}
.meter .cap{font-size:15px;font-weight:700}
.card{background:var(--card);border-radius:20px;padding:16px;border:2px solid var(--line);margin-top:14px}
.card h3{margin:0 0 10px;font-size:17px;font-weight:900}
.card p{margin:0 0 8px;font-size:15px}
.axis{margin:12px 0 4px}
.axis .ends{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--sub)}
.axis .bar{position:relative;height:14px;border-radius:999px;background:linear-gradient(90deg,#D6D9EE,#F2DCE4);margin-top:4px}
.axis .dot{position:absolute;top:50%;width:24px;height:24px;margin-left:-12px;margin-top:-12px;border-radius:50%;background:var(--ink);border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.axis .dot.born{background:#fff;border:3px dashed var(--ink);width:22px;height:22px;margin-left:-11px;margin-top:-11px;box-shadow:none}
.axis .val{font-size:13px;margin-top:4px;text-align:center;font-weight:700}
.legend{font-size:13px;color:var(--sub);display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:4px;background:var(--ink)}
.legend i.born{background:#fff;border:2px dashed var(--ink)}
.tsukkomi{background:var(--soft);border-radius:14px;padding:12px 14px;font-weight:700;font-size:15px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat div{background:var(--soft);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:900}
.stat small{font-size:13px;color:var(--sub);font-weight:700}
.rank{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.rank:last-child{border-bottom:0}
.rank .k{font-size:14px;color:var(--sub);font-weight:700}
.rank .v{font-weight:900;font-size:16px;text-align:right}
.ppl{border-top:1px solid var(--line);padding:12px 0}
.ppl:first-of-type{border-top:0}
.ppl .nm{font-weight:900;font-size:17px}
.ppl .ty{color:var(--accent);font-weight:900}
.ppl .ds{font-size:14px;color:var(--sub)}
.promo{background:#2A1F2D;color:#fff;border-radius:20px;padding:18px;margin-top:18px}
.promo h3{margin:0 0 6px;font-size:17px}
.promo p{margin:0 0 12px;font-size:14px;color:#F1E9F3}
.promo a{display:block;text-align:center;background:#fff;color:#2A1F2D;border-radius:14px;padding:12px;font-weight:900;text-decoration:none;min-height:44px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
@media (max-width:360px){h1{font-size:34px}.choice{font-size:17px}}

/* ───── パステル・ステッカー（色はこの組み合わせにそろえる） ───── */
:root{
  --bg:#F3ECFF; --card:#FFFFFF; --ink:#2E1A47; --sub:#584870; --line:#2E1A47;
  --a:#FFD6E8; --b:#D7E6FF; --accent:#B8285F; --soft:#FFE3EF; --shadow:#B9A3EE;
}
body[data-mode="normal"]{ --a:#FFE68A; --b:#CFEFE2; --accent:#B8285F; --soft:#FFF3C4; --bg:#F3ECFF; }
body{background-color:var(--bg);background-image:radial-gradient(#D9C8FA 1.5px,transparent 1.6px);background-size:16px 16px}
.pop,.ht,.hk,.hpill,.seal,.qhead,.res-hero .type,.big,.mode b{font-family:"Mochiy Pop One","Zen Maru Gothic",sans-serif;font-weight:400}
.hero{position:relative;background:#fff;border:3px solid var(--ink);border-radius:24px;padding:30px 16px 20px;text-align:center;box-shadow:6px 6px 0 var(--shadow);margin:18px 4px 0}
.tape{position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(-3deg);background:#FFD6E8;border:2px solid var(--ink);padding:2px 14px;font-size:13px;font-weight:900;white-space:nowrap}
.seal{position:absolute;top:14px;right:14px;width:54px;height:54px;border-radius:50%;background:#FFE68A;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1.1;transform:rotate(12deg)}
.hk{margin:0;font-size:15px;color:#5B2A86}
.ht{font-size:70px;line-height:1.08;color:#E0457B;text-shadow:3px 3px 0 var(--ink);margin:6px 0 0;letter-spacing:0}
.gauge{position:absolute;right:10px;top:150px;width:96px;height:96px;border-radius:50%;background:conic-gradient(#E0457B 0 82%,#E7DDF8 82% 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--ink)}
.gauge::before{content:"";position:absolute;inset:9px;border-radius:50%;background:#fff}
.gauge b,.gauge span{position:relative;line-height:1.1}
.gauge b{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:26px;color:var(--accent)}
.gauge b small{font-size:13px}
.gauge span{font-size:10px;font-weight:900;color:var(--ink)}
.hpill{display:inline-block;margin-top:10px;background:var(--ink);color:#fff;font-size:15px;padding:4px 16px;border-radius:999px}
.cloud{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:2px 12px;margin:16px 6px 14px;line-height:1.25}
.cloud span{font-weight:900}
.cloud .ws{font-size:12px;color:#5E4E78}
.cloud .wm{font-size:14px;color:#8A2257}
.cloud .wM{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:17px;color:#5B2A86}
.cloud .wL{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:22px;color:var(--accent)}
.teaser{border:3px solid var(--ink);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:none}
.teaser .tq{font-family:"Mochiy Pop One",sans-serif;font-size:16px;color:var(--ink);margin:0}
.teaser .tab{color:var(--ink);border:2px solid var(--ink);border-radius:16px;font-weight:900;padding:14px 12px}
.label{color:var(--ink)}
.mode,.seg,.field,.card,.rev,.prow .pf,.orow{border:3px solid var(--ink);box-shadow:4px 4px 0 var(--shadow)}
.seg{box-shadow:none}
.mode[aria-pressed="true"][data-m="love"]{border-color:var(--ink);background:#FFD6E8}
.mode[aria-pressed="true"][data-m="normal"]{border-color:var(--ink);background:#CFEFE2}
.mode small,.hint,.note,.ds{color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.field input[type=date],.field input[type=text],.prow .pf input{border:2px solid var(--ink)}
.big{background:#2B1022;border-radius:999px;font-size:18px;box-shadow:none}
.big.alt{background:#fff;color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--shadow)}
.choice{color:var(--ink);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);border-radius:20px}
.choice .tag{background:var(--ink);color:#fff !important}
.choice.picked{outline:4px solid #E0457B}
.vsmark b{background:#E0457B;color:#fff;border-color:var(--bg);font-family:"Dela Gothic One",sans-serif;font-weight:400}
.prog{background:#E7DDF8;border:2px solid var(--ink);height:14px}
.prog i{background:#E0457B}
.turn span{background:var(--ink)}
.rev .side{color:var(--ink);border:2px solid var(--ink)}
.rev .side .n span{border:2px solid var(--ink)}
.orow button{border:2px solid var(--ink)}
.orow button.onA{background:var(--a);color:var(--ink);border-color:var(--ink)}
.orow button.onB{background:var(--b);color:var(--ink);border-color:var(--ink)}
.res-hero{border:3px solid var(--ink);box-shadow:6px 6px 0 var(--shadow)}
.res-hero .type{color:#E0457B;text-shadow:2px 2px 0 var(--ink)}
.meter .num{color:var(--accent)}
.axis .bar{background:#E7DDF8;border:2px solid var(--ink)}
.axis .dot{background:#E0457B;border-color:var(--ink)}
.legend i{background:#E0457B}
.tsukkomi,.stat div{background:var(--soft);border:2px solid var(--ink)}
.promo{background:var(--ink)}
.add{border-color:var(--ink);color:var(--ink)}
.del{border:2px solid var(--ink)}
.gauge{width:82px;height:82px;right:8px;top:152px}
.gauge b{font-size:22px}
.ht{transform:none}
.vsmark b{color:var(--ink)}
body{word-break:auto-phrase}
@media (max-width:360px){.ht{font-size:58px;transform:none}.gauge{width:72px;height:72px;top:130px}.gauge b{font-size:19px}}
.nav{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}
.navb{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:4px 16px;font-weight:900;font-size:15px;color:var(--ink);box-shadow:3px 3px 0 var(--shadow)}
.navb:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.choice{overflow:hidden}
.choice .wpct{display:block;margin-top:6px;font-size:15px;font-weight:900;color:var(--ink)}
.choice .wbar{position:absolute;left:0;bottom:0;height:8px;background:#E0457B;transition:width .6s ease}
.wnote{text-align:center;font-weight:900;font-size:14px;color:var(--sub);margin:14px 0 0}
.world{border-top:2px dashed var(--ink);margin-top:6px;padding-top:10px}
.world b{font-size:15px}
.wrow{display:grid;grid-template-columns:20px 1fr 48px;gap:8px;align-items:center;margin-top:6px;font-weight:900}
.wtrack{height:12px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.wtrack i{display:block;height:100%;background:#F08BB0}
.wtrack.b i{background:#8FB0EA}
body[data-mode="normal"] .wtrack i{background:#F2C94C}
body[data-mode="normal"] .wtrack.b i{background:#7FCFAF}
.wrow em{font-style:normal;text-align:right}
.world small{display:block;margin-top:6px;color:var(--sub);font-weight:700}
</style>
</head>
<body data-mode="love">
<div class="wrap">

<!-- ホーム -->
<section class="scr on" id="s-home">
  <div class="hero">
    <div class="tape">本音バレ注意</div>
    <div class="seal">無料<br>3分</div>
    <p class="hk">ねえ、どっち派？</p>
    <h1 class="ht">究極の<br>二択</h1>
    <div class="hpill" id="lead">心の中がちょっと見える診断</div>
  </div>
  <div class="cloud" id="cloud" aria-hidden="true"></div>
  <div class="teaser" aria-label="問題の例">

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function store(k,v){ try{ if(v===undefined){ return JSON.parse(localStorage.getItem(k)); } localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }

/* ───── 物差し ───── */
var AXES = {
  love:   [ {k:'K',lo:'一途',hi:'小悪魔'}, {k:'R',lo:'現実派',hi:'ロマン派'}, {k:'S',lo:'安定',hi:'刺激'}, {k:'A',lo:'尽くしたい',hi:'甘えたい'} ],
  normal: [ {k:'B',lo:'慎重',hi:'冒険'}, {k:'Y',lo:'無欲',hi:'欲ばり'}, {k:'M',lo:'本音',hi:'見栄'}, {k:'N',lo:'冷静',hi:'ノリ'} ]
};
var MODE_NAME = { love:'恋愛編', normal:'ふつう編' };
var LV_NAME = { easy:'イージー', normal:'ノーマル', hard:'ハード' };
function playName(mode){ return MODE_NAME[mode]+'・'+LV_NAME[S.lv]; }

/* ───── 問題をまとめる（こちらの問題＋あなたの問題） ───── */
function hashStr(s){ var h=5381; for(var i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return (h>>>0).toString(36); }
var POOL = { love:[], normal:[] };
['love','normal'].forEach(function(m){
  var seen = {};
  var src = ((window.NITAKU_BASE||{})[m]||[]).concat(((window.NITAKU_MINE||{})[m])||[]);
  src.forEach(function(q){
    if(!q || !q[0] || !q[1]) return;
    var id = hashStr(q[0]+'｜'+q[1]);
    if(seen[id]) return; seen[id]=1;
    POOL[m].push({ id:id, a:String(q[0]), b:String(q[1]), ta:parseTags(q[2]), tb:parseTags(q[3]), lv:(+q[4]||2) });
  });
});
function parseTags(t){
  var o = {};
  String(t||'').split(/\s+/).forEach(function(tok){
    var m = /^([A-Z])(\+\+|--|\+|-)$/.exec(tok); if(!m) return;
    o[m[1]] = (o[m[1]]||0) + ({'++':2,'+':1,'-':-1,'--':-2})[m[2]];
  });
  return o;
}
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* 難しさごとに出す問題（足りないときは「次に近い難しさ」から足す） */
var LEVELS = { easy:[[1],[2]], normal:[[1,2,3]], hard:[[3],[2]] };
/* 一度出た問題はこの端末が覚えておき、出しきるまで同じ問題は出さない */
function pickQuestions(mode, n, level){
  var key = 'nitaku_seen_'+mode;
  var seen = store(key) || [];
  var seenSet = {}; seen.forEach(function(id){ seenSet[id]=1; });
  var groups = (LEVELS[level]||LEVELS.normal).map(function(lvs){
    return POOL[mode].filter(function(q){ return lvs.indexOf(q.lv)>=0; });
  });
  var pick = [], used = {};
  function take(list){
    shuffle(list.slice()).forEach(function(q){ if(pick.length<n && !used[q.id]){ used[q.id]=1; pick.push(q); } });
  }
  groups.forEach(function(g){ take(g.filter(function(q){ return !seenSet[q.id]; })); });
  if(pick.length < n){
    // この難しさの問題を出しきったので、まぜ直してもう一度
    var again = {};
    groups.forEach(function(g){ g.forEach(function(q){ again[q.id]=1; }); });
    seen = seen.filter(function(id){ return !again[id]; });
    groups.forEach(function(g){ take(g); });
  }
  pick.forEach(function(q){ if(seen.indexOf(q.id)<0) seen.push(q.id); });
  store(key, seen);
  // A/B の左右もランダムに入れかえる
  return pick.map(function(q){
    return Math.random()<0.5 ? { id:q.id, a:q.a, b:q.b, ta:q.ta, tb:q.tb, sw:false } : { id:q.id, a:q.b, b:q.a, ta:q.tb, tb:q.ta, sw:true };
  });
}
function remaining(mode){
  var seen = store('nitaku_seen_'+mode) || [];
  var s = {}; seen.forEach(function(id){ s[id]=1; });
  return POOL[mode].filter(function(q){ return !s[q.id]; }).length;
}

/* ───── 生まれた日の星（日干） ─────
   日柱は日付だけで決まる（2000-01-01＝戊午）。正午で計算するので日付の変わり目の影響はない。 */
var STEMS = '甲乙丙丁戊己庚辛壬癸';
var BRANCHES = '子丑寅卯辰巳午未申酉戌亥';
function dayPillar(y,m,d){
  var a = Math.floor((14-m)/12), yy = y+4800-a, mm = m+12*a-3;
  var jdn = d + Math.floor((153*mm+2)/5) + 365*yy + Math.floor(yy/4) - Math.floor(yy/100) + Math.floor(yy/400) - 32045;
  var i = ((jdn + 49) % 60 + 60) % 60;
  return { stem: STEMS[i%10], branch: BRANCHES[i%12], gz: STEMS[i%10]+BRANCHES[i%12] };
}
var BORN = {
  '甲':{yomi:'きのえ', img:'まっすぐ伸びる大きな木', love:{K:-.6,R:.4,S:.1,A:-.4}, normal:{B:.5,Y:.2,M:.6,N:.1},
        txt:'決めたら一直線。曲がったことがきらいで、好きになったら守りたくなる人。'},
  '乙':{yomi:'きのと', img:'しなやかな草花', love:{K:.5,R:.3,S:-.3,A:.6}, normal:{B:-.3,Y:.1,M:.1,N:.3},
        txt:'やわらかく見えて、じつはしぶとい。まわりにうまく寄りそいながら、気づけば愛されている人。'},
  '丙':{yomi:'ひのえ', img:'空に輝く太陽', love:{K:.2,R:.6,S:.7,A:-.2}, normal:{B:.7,Y:.3,M:.3,N:.9},
        txt:'いるだけで場が明るくなる。好きな気持ちは顔に全部出る、裏表のない人。'},
  '丁':{yomi:'ひのと', img:'夜をてらす灯火', love:{K:.3,R:.8,S:.1,A:.3}, normal:{B:-.1,Y:-.1,M:-.2,N:-.1},
        txt:'静かな情熱家。表には出さないけれど、心の中でずっと思いを燃やしつづける人。'},
  '戊':{yomi:'つちのえ', img:'どっしりした山', love:{K:-.8,R:-.3,S:-.6,A:-.6}, normal:{B:-.4,Y:.2,M:.3,N:-.2},
        txt:'動じない安心感のかたまり。一度信じた人のことは、ずっと受けとめつづける人。'},
  '己':{yomi:'つちのと', img:'作物を育てる畑', love:{K:-.3,R:-.4,S:-.5,A:-.8}, normal:{B:-.6,Y:-.2,M:-.4,N:.2},
        txt:'面倒見のよさは天下一品。相手を育てて、いつのまにか手放せない存在になる人。'},
  '庚':{yomi:'かのえ', img:'きたえられた鋼', love:{K:-.2,R:-.2,S:.8,A:-.1}, normal:{B:.9,Y:.4,M:.4,N:.2},
        txt:'白黒はっきり、行動が早い。恋も勝負。ダラダラした関係はがまんできない人。'},
  '辛':{yomi:'かのと', img:'みがかれた宝石', love:{K:.8,R:.2,S:.2,A:.7}, normal:{B:-.2,Y:.5,M:.9,N:-.3},
        txt:'繊細で美意識が高い。大切にされてこそ輝く、天性のお姫さま（王子さま）気質。'},
  '壬':{yomi:'みずのえ', img:'ひろい大海', love:{K:.6,R:.1,S:.9,A:.1}, normal:{B:.8,Y:.6,M:-.3,N:.7},
        txt:'自由で器が大きい。ひとつの場所におさまらない、つかまえたくなる人。'},
  '癸':{yomi:'みずのと', img:'しとしと降る雨', love:{K:.4,R:.7,S:-.2,A:.5}, normal:{B:-.5,Y:-.4,M:-.5,N:-.4},
        txt:'やさしくて感受性ゆたか。相手の気持ちにしみこむように寄りそう、いやし系の人。'}
};
function bornInfo(dateStr){
  if(!dateStr) return null;
  var p = dateStr.split('-').map(Number);
  if(p.length!==3 || !p[0] || !p[1] || !p[2]) return null;
  var dp = dayPillar(p[0],p[1],p[2]);
  var b = BORN[dp.stem];
  return { stem:dp.stem, gz:dp.gz, yomi:b.yomi, img:b.img, txt:b.txt, love:b.love, normal:b.normal };
}

/* ───── タイプ ───── */
var TYPES = {
  love: {
    '111':{n:'恋の花火師', c:'会うたびに心をさらっていく、ロマンと刺激のかたまり。', d:'ドキドキがないと恋じゃない派。燃えるような恋を何度でもできるけど、相手が慣れてきた瞬間にちょっと寂しくなる。', t:'花火は一瞬。でもあなたは毎晩あげたい派。'},
    '110':{n:'沼らせ職人', c:'気づけば相手は沼の底。本人は涼しい顔。', d:'追われるほど燃えないのに、離れそうになると引きもどす天才。本気になるのは、自分を振り回してくれる人だけ。', t:'既読スルーの間合いが、もはや芸術。'},
    '101':{n:'天然小悪魔', c:'計算してないのに、なぜか相手が勝手に落ちていく。', d:'本人はいたってまじめ。でも、ふとしたひと言やしぐさで相手の心をわしづかみ。罪の意識はゼロ。', t:'「え、そんなつもりじゃなかった」で何人泣かせた？'},
    '100':{n:'したたか参謀', c:'恋も人生も、戦略で勝ちにいく。', d:'好きの気持ちと条件を冷静に天びんにかけられる人。かけひきも上手で、最後にちゃっかりいいところを持っていく。', t:'恋愛にもエクセル表がありそう。'},
    '011':{n:'全力片思いランナー', c:'好きになったら一直線。ブレーキはついてない。', d:'一途で情熱的。好きな人のためなら遠くても会いに行くし、何度フラれても立ち上がる。そのまっすぐさが最大の武器。', t:'その熱量、たまに相手が追いつけてない。'},
    '010':{n:'肉食リアリスト', c:'好きなら即行動。ダメなら即撤退。', d:'刺激は欲しいけど、夢は見すぎない。気になったら自分から動いて、合わないとわかったら引きずらない。', t:'恋の損切りが早すぎて、もはや投資家。'},
    '001':{n:'純愛ひとすじ', c:'たったひとりを、ずっと大切にしたい。', d:'安心できる関係の中で、じっくり愛を育てたい人。記念日も思い出も大事にする、ドラマの主人公タイプ。', t:'元恋人からもらった手紙、まだ持ってない？'},
    '000':{n:'将来設計の鬼', c:'恋は人生のパートナー選び。', d:'ときめきより、10年後に笑っていられるかを大事にする人。結婚向きの安定感はナンバーワン。', t:'初デートで年金の話をしたことがあるはず。'}
  },
  normal: {
    '111':{n:'人生ジェットコースター', c:'楽しいことも、ほしいものも、全部とりにいく。', d:'思いついたらすぐ行動、しかも欲ばり。毎日がイベントだけど、まわりもいつのまにか巻きこまれて楽しくなっている。', t:'あなたの1週間は、ふつうの人の1年ぶん。'},
    '110':{n:'野望のハンター', c:'ほしいものは、自分の手でつかみとる。', d:'リスクをとってでも大きいものをねらう人。ノリより結果。静かに燃えるタイプの野心家。', t:'寝る前にひとりで作戦会議してる。'},
    '101':{n:'自由すぎる旅人', c:'お金より、おもしろいほうへ。', d:'物より体験、計画より勢い。ほしいものは少ないのに、行ってみたい場所は無限にある人。', t:'「ちょっとコンビニ」と言って海外にいそう。'},
    '100':{n:'孤高の冒険家', c:'人に合わせない。自分の道を行く。', d:'まわりのノリに流されず、ひとりでも新しいことに飛びこめる人。欲は少ないけど、こだわりは強い。', t:'グループLINEの既読が、だいたい最後。'},
    '011':{n:'宴会部長', c:'楽しいことと、おいしいものが大好き。', d:'危ない橋はわたらないけど、楽しむことには全力。あなたがいるだけで飲み会の満足度が2倍になる。', t:'しめのラーメン、断ったことある？'},
    '010':{n:'ちゃっかり堅実家', c:'ほしいものは、確実に手に入れる。', d:'冒険はしないけど、損もしない。ポイントもクーポンも逃さない、生活の達人。', t:'財布の中のポイントカード、何枚ある？'},
    '001':{n:'平和なムードメーカー', c:'みんなが笑っていれば、それでいい。', d:'欲は少なく、ノリはいい。争いごとがきらいで、その場を明るくする天才。いちばん人に好かれるタイプ。', t:'割り勘で端数をはらうのは、たいていあなた。'},
    '000':{n:'悟りをひらいた人', c:'足るを知る。人生、これでいい。', d:'冒険も欲も少なめで、自分のペースをくずさない人。まわりがバタバタしても、ひとりだけお茶をすすっている。', t:'前世はたぶん、山の上のお坊さん。'}
  }
};
function subtitle(mode, sc){
  if(mode==='love'){ var a=sc.A; return a>=60?'甘えたい派':(a<=40?'尽くしたい派':'甘えも尽くしもバランス派'); }
  var m=sc.M; return m>=60?'ちょっと見栄っぱり':(m<=40?'本音で生きる派':'見栄と本音のバランス派');
}
function headline(mode){ return mode==='love' ? {k:'K', cap:'小悪魔度'} : {k:'M', cap:'見栄っぱり度'}; }

/* ───── 点数 ───── */
function score(mode, qs, answers){
  var out = {};
  AXES[mode].forEach(function(ax){
    var sum=0, den=0;
    qs.forEach(function(q,i){
      var wa=q.ta[ax.k]||0, wb=q.tb[ax.k]||0, mx=Math.max(Math.abs(wa),Math.abs(wb));
      if(!mx) return;
      den += mx;
      if(answers[i]==='A') sum+=wa; else if(answers[i]==='B') sum+=wb;
    });
    out[ax.k] = den ? Math.round(Math.max(0,Math.min(100, 50 + 50*sum/den))) : 50;
  });
  return out;
}
function typeOf(mode, sc){
  var ks = mode==='love' ? ['K','S','R'] : ['B','Y','N'];
  var code = ks.map(function(k){ return sc[k]>=50?'1':'0'; }).join('');
  return TYPES[mode][code];
}
function bornScore(mode, born){
  var o={}; AXES[mode].forEach(function(ax){ o[ax.k]=Math.round(50+40*(born[mode][ax.k]||0)); }); return o;
}

/* ───── 状態 ───── */

    : ['過去に戻れる。でも1回だけ、3分だけ', '未来に行ける。でも1回だけ、3分だけ', '欲ばり度も、見栄っぱり度も。<br>真剣に選ぶほど、バレていく。'];
  $('t-a').textContent = T[0]; $('t-b').textContent = T[1];
  $('lead').textContent = m==='love' ? '小悪魔度がバレる診断' : '心の中がちょっと見える診断';
  var W = m==='love'
    ? [['秒で決めて','s'],['恋愛編','L'],['沼らせ注意','m'],['キュン死','s'],['小悪魔度','M'],['年収か愛か','m'],['地獄の二択','s'],['元恋人問題','M']]
    : [['秒で決めて','s'],['ふつう編','L'],['欲ばり度','m'],['ノリで選べ','s'],['見栄っぱり度','M'],['超能力','m'],['地獄の二択','s'],['人生の分かれ道','M']];
  $('cloud').innerHTML = W.map(function(w){ return '<span class="w'+w[1]+'">'+w[0]+'</span>'; }).join('');
  document.querySelectorAll('.mode').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.m===m?'true':'false'); });
  updatePoolNote();
}
function updatePoolNote(){
  var r = remaining(S.mode), t = POOL[S.mode].length;

var busy=false;
function answer(c, el){
  if(busy) return; busy=true;
  el.classList.add('picked');
  S.ans[S.pi][S.qi]=c;
  S.times[S.pi][S.qi]=Date.now()-S.t0;
  var wait=260;
  if(S.who==='solo'){
    var q=S.qs[S.qi];
    if(!S.sent[q.id]){ S.sent[q.id]=1; Votes.send([{ id:q.id, c:canon(q,c) }]); }
    if(showPctOnCards(q, [c])) wait=1500;
  }
  setTimeout(function(){
    busy=false;
    if(S.who==='group'){
      if(S.pi < S.players.length-1){ S.pi++; showPass(); }
      else showReveal();
    } else {
      if(S.qi < S.qs.length-1){ S.qi++; showQ(); } else showResult();
    }

/* ───── みんなの回答％ ─────
   公開先のサーバー（functions/nitaku-vote.mjs）で数える。確認用ページ（claude.ai）ではページのデータ保存を使う。
   どちらも使えないときは％を出さないだけで、遊ぶのには困らない。数えるのは「どちらを選んだか」だけ。 */
var VOTE_API='/.netlify/functions/nitaku-vote';
var Votes=(function(){
  var mode=null, db=null, uid=null, mine={}, chain=Promise.resolve(), ready=null;
  function init(){
    if(ready) return ready;
    ready=(async function(){
      try{
        if(window.claude && typeof claude.use==='function'){
          var d=await claude.use('db'), u=await claude.use('user');
          var id=u ? await u.id() : null;
          if(d && id){
            db=d; uid=id; mode='db';
            try{ var me=await db.doc('ballots/'+uid).get(); if(me.exists){ var v=(me.data()||{}).v; if(v && typeof v==='object') mine=Object.assign({},v); } }catch(e){}
            return;
          }
        }
      }catch(e){}
      try{
        var r=await fetch(VOTE_API+'?ids=0');
        if(r.ok && (r.headers.get('content-type')||'').indexOf('json')>=0){ mode='api'; return; }
      }catch(e){}
      mode='off';
    })();
    return ready;
  }
  async function get(ids){
    await init();
    try{
      if(mode==='api'){
        var r=await fetch(VOTE_API+'?ids='+ids.join(','));
        return r.ok ? await r.json() : null;
      }
      if(mode==='db'){
        var snap=await db.collection('ballots').get(), want={}, out={};
        ids.forEach(function(id){ want[id]=1; out[id]={a:0,b:0}; });
        snap.docs.forEach(function(d){
          if(d.id===uid) return;   // 自分の分は画面で足す
          var v=(d.data()||{}).v||{};
          Object.keys(v).forEach(function(id){ if(want[id] && (v[id]==='a'||v[id]==='b')) out[id][v[id]]++; });
        });
        return out;
      }
    }catch(e){}
    return null;
  }
  function send(list){
    chain=chain.then(async function(){
      await init();
      try{
        if(mode==='api'){
          await fetch(VOTE_API,{ method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({votes:list}) });
        } else if(mode==='db'){
          list.forEach(function(v){ mine[v.id]=v.c; });   // 確認用ページでは1人1票（同じ問題は上書き）
          await db.doc('ballots/'+uid).set({ v:mine });
        }
      }catch(e){}
    });
    return chain;
  }
  return { init:init, get:get, send:send };
})();
Votes.init();
function canon(q, c){ return (c==='A') !== !!q.sw ? 'a' : 'b'; }
/* 表示の A/B に合わせた、みんなの数（今の答えも足す） */
function worldCounts(q, picks){
  var c = S.counts && S.counts[q.id];
  if(!c) return null;
  var a=c.a||0, b=c.b||0, before=a+b;
  picks.forEach(function(p){ if(!p) return; if(canon(q,p)==='a') a++; else b++; });
  var A = q.sw ? b : a, B = q.sw ? a : b, t=A+B;
  return { A:A, B:B, t:t, before:before, pa: t?Math.round(100*A/t):0, pb: t?100-Math.round(100*A/t):0 };
}
function showPctOnCards(q, picks){
  var w=worldCounts(q, picks);
  if(!w) return false;
  document.querySelectorAll('#q-body .choice').forEach(function(el){
    var k=el.dataset.c, pct = k==='A'?w.pa:w.pb;
    var tag=document.createElement('span'); tag.className='wpct'; tag.textContent='みんなの'+pct+'%';
    var bar=document.createElement('i'); bar.className='wbar'; bar.style.width=pct+'%';
    el.appendChild(tag); el.appendChild(bar);
  });
  var note=document.createElement('p'); note.className='wnote';
  note.textContent = w.before===0 ? 'あなたが最初の回答者！' : (w.t.toLocaleString()+'人が回答');
  $('q-body').appendChild(note);
  return true;
}
function worldLine(q, picks){
  var w=worldCounts(q, picks);
  if(!w) return '';
  return '<div class="world"><b>みんなの回答</b><div class="wrow"><span>A</span><div class="wtrack"><i style="width:'+w.pa+'%"></i></div><em>'+w.pa+'%</em></div>'+
         '<div class="wrow"><span>B</span><div class="wtrack b"><i style="width:'+w.pb+'%"></i></div><em>'+w.pb+'%</em></div>'+
         '<small>'+(w.before===0?'この問題に答えたのは、ここにいる人だけ！':w.t.toLocaleString()+'人が回答')+'</small></div>';
}
/* みんなと同じ答えだった数（多数派度） */
function majorityStats(qs, ans){
  if(!S.counts) return '';
  var n=0, same=0;
  qs.forEach(function(q,i){
    var c=S.counts[q.id]; if(!c || (c.a+c.b)<3 || c.a===c.b || !ans[i]) return;
    n++; if(canon(q,ans[i]) === (c.a>c.b?'a':'b')) same++;
  });
  if(n<5) return '<div class="card"><h3>みんなと同じ答え？</h3><p>まだ回答が少ない問題が多いので、くらべられません。回答が集まると「多数派度」が出ます。</p></div>';
  var r=Math.round(100*same/n);
  var cm = r>=70 ? '王道タイプ。みんなの気持ちがわかる人。' : (r<=35 ? '少数派タイプ。あなたの答えは、個性そのもの。' : '王道と個性のバランス型。');
  return '<div class="card"><h3>みんなと同じ答え？</h3><div class="stat"><div><b>'+same+' / '+n+'</b><small>みんなと同じ答え</small></div><div><b>'+r+'%</b><small>多数派度</small></div></div><p style="margin-top:10px;font-size:15px;font-weight:700">'+cm+'</p></div>';
}
/* もどる・TOP（どの画面からでも） */
function curScr(){ var e=document.querySelector('.scr.on'); return e ? e.id : 's-home'; }
function goTop(ask){
  var mid = ['s-pass','s-q','s-rev'].indexOf(curScr())>=0;
  if(ask && mid && !confirm('途中の答えは消えます。TOPにもどりますか？')) return;
  updatePoolNote(); show('s-home');
}
function goBack(){
  var c=curScr(), n=S.players.length;
  if(c==='s-setup' || c==='s-res' || c==='s-gres'){ goTop(false); return; }
  if(S.who==='solo'){
    if(S.qi>0){ S.qi--; showQ(); } else goTop(true);
    return;
  }
  if(S.style==='open'){
    if(c==='s-rev'){ showQ(); return; }
    if(S.qi>0){ S.qi--; showQ(); } else goTop(true);
    return;
  }
  // こっそり回す
  if(c==='s-rev'){ S.pi=n-1; showPass(); return; }
  if(c==='s-q'){ showPass(); return; }
  if(S.pi>0){ S.pi--; showPass(); return; }
  if(S.qi>0){ S.qi--; S.pi=n-1; showReveal(); return; }
  goTop(true);
}
document.querySelectorAll('[data-nav]').forEach(function(b){

/* 発表（1問ごと） */
function showReveal(){
  var q=S.qs[S.qi], n=S.players.length;
  var A=[], B=[];
  S.players.forEach(function(p,i){ (S.ans[i][S.qi]==='A'?A:B).push(p.name); });
  function side(cls, txt, names){

  if(!S.sent[q.id]){ S.sent[q.id]=1; Votes.send(S.players.map(function(p,i){ return { id:q.id, c:canon(q,S.ans[i][S.qi]) }; })); }
  var cm;
  if(!A.length || !B.length) cm = pickOne(['全員一致！ 気が合いすぎ','満場一致！ 迷う人ゼロ','全員同じ！ この問題、究極じゃなかった？']);
  else if(A.length===1 || B.length===1){ var lone=(A.length===1?A:B)[0]; cm = esc(lone)+'さんだけ…！ 理由を聞いてみよう'; if(n===2) cm='2人の意見がまっぷたつ！ どっちが正しい？'; }

/* ───── 結果（ひとり） ───── */
function axisHTML(mode, sc, bsc){
  return AXES[mode].map(function(ax){
    var v=sc[ax.k];
    var side = v>=50 ? ax.hi+' '+v+'%' : ax.lo+' '+(100-v)+'%';
    return '<div class="axis"><div class="ends"><span>'+ax.lo+'</span><span>'+ax.hi+'</span></div>'+
      '<div class="bar">'+(bsc?'<i class="dot born" style="left:'+bsc[ax.k]+'%"></i>':'')+'<i class="dot" style="left:'+v+'%"></i></div>'+
      '<div class="val">'+side+'</div></div>';
  }).join('');
}
function bigGap(mode, sc, bsc){
  var best=null;
  AXES[mode].forEach(function(ax){ var g=sc[ax.k]-bsc[ax.k]; if(!best || Math.abs(g)>Math.abs(best.g)) best={ax:ax,g:g}; });
  return best;
}
function gapText(mode, sc, bsc){
  var b=bigGap(mode, sc, bsc), g=Math.abs(b.g);
  if(g<15) return '生まれ持ったあなたと、今日のあなたはほぼ同じ。自分らしく生きている証拠です。';
  var dir = b.g>0 ? b.ax.hi : b.ax.lo, base = b.g>0 ? b.ax.lo : b.ax.hi;
  var tail = mode==='love'
    ? (g>=35 ? 'いまの恋や環境が、あなたを大きく変えているのかも。' : '最近ちょっと、いつもとちがう気分なのかも。')
    : (g>=35 ? 'いまのまわりの環境に、かなり合わせているのかも。' : '最近ちょっと、背のびしているのかも。');
  return '生まれつきは「'+base+'」寄りなのに、今日の答えは「'+dir+'」寄り（差 '+g+'）。'+tail;
}
function speedStats(qs, times){
  var arr = times.map(function(t,i){ return {t:t||0, q:qs[i]}; }).filter(function(x){ return x.t>0; });
  if(!arr.length) return null;
  var fast = arr.filter(function(x){ return x.t<3000; }).length;
  var slow = arr.slice().sort(function(a,b){ return b.t-a.t; })[0];
  return { rate: Math.round(100*fast/arr.length), slow: slow };
}
function shareText(mode, ty, hd, val){

  else prompt('コピーしてください', full);
}

function showResult(){

  h+='<div class="card"><h3>どんな人？</h3><p>'+esc(ty.d)+'</p><div class="tsukkomi">'+esc(ty.t)+'</div></div>';

     (bsc?'<div class="legend"><span><i></i>今日のあなた</span><span><i class="born"></i>生まれ持ったあなた</span></div>':'')+'</div>';
  if(born){
    h+='<div class="card"><h3>生まれ持ったあなた（生まれた日の星）</h3>'+
       '<p><b>'+born.stem+'（'+born.yomi+'）＝'+esc(born.img)+'</b></p><p>'+esc(born.txt)+'</p>'+
       '<div class="tsukkomi">'+esc(gapText(mode,sc,bsc))+'</div></div>';
  }
  var maj=majorityStats(S.qs, S.ans[0]);
  if(maj) h+=maj;
  if(sp){
    h+='<div class="card"><h3>選び方のくせ</h3><div class="stat">'+
       '<div><b>'+sp.rate+'%</b><small>3秒以内の即決</small></div>'+
       '<div><b>'+(Math.round(sp.slow.t/100)/10)+'秒</b><small>いちばん悩んだ時間</small></div></div>'+
       '<p style="margin-top:10px;font-size:14px">いちばん悩んだのは<br><b>「'+esc(sp.slow.q.a)+'」<br>vs「'+esc(sp.slow.q.b)+'」</b></p>'+
       '<p style="font-size:14px;color:var(--sub)">'+(sp.rate>=70?'迷いのなさがすごい。自分の気持ちがはっきりしている人。':(sp.rate<=30?'どっちも本気で考えてしまう、やさしい人。':'ここぞという問題で、ちゃんと悩める人。'))+'</p></div>';
  }
  h+='<button class="big" id="share">結果をシェアする</button>'+endButtons()+promoHTML();
  $('gres-body').innerHTML='';
  $('res-body').innerHTML=h;
  $('share').onclick=function(){ doShare(shareText(mode,ty,hd,val)); };

/* ───── 結果（みんな） ───── */
function showGroupResult(){
  var mode=S.mode, hd=headline(mode), n=S.players.length;
  var R = S.players.map(function(p,i){
    var sc=score(mode,S.qs,S.ans[i]);
    var born=bornInfo(p.born);
    return { p:p, sc:sc, ty:typeOf(mode,sc), born:born, bsc:born?bornScore(mode,born):null, i:i };
  });
  var h='<div class="res-hero"><div class="pre">'+playName(mode)+'　'+n+'人の結果</div><div class="type">みんなの本音、発表</div>'+
        '<div class="catch">いちばん'+hd.cap.replace('度','')+'なのは…</div>';
  var top = R.slice().sort(function(a,b){ return b.sc[hd.k]-a.sc[hd.k]; })[0];
  h+='<div class="meter"><div class="num" style="font-size:40px">'+esc(top.p.name)+'</div><div class="cap">'+hd.cap+' '+top.sc[hd.k]+'%</div></div></div>';

  // 物差しごとのランキング
  h+='<div class="card"><h3>ランキング</h3>';
  AXES[mode].forEach(function(ax){
    var s=R.slice().sort(function(a,b){ return b.sc[ax.k]-a.sc[ax.k]; });
    h+='<div class="rank"><span class="k">いちばん'+ax.hi+'</span><span class="v">'+esc(s[0].p.name)+'（'+s[0].sc[ax.k]+'%）</span></div>';
    h+='<div class="rank"><span class="k">いちばん'+ax.lo+'</span><span class="v">'+esc(s[s.length-1].p.name)+'（'+(100-s[s.length-1].sc[ax.k])+'%）</span></div>';
  });
  // 少数派の回数
  var minority=R.map(function(){return 0;});
  S.qs.forEach(function(q,qi){
    var a=0; R.forEach(function(r){ if(S.ans[r.i][qi]==='A') a++; });
    var b=n-a; if(a===b) return;
    var minor = a<b?'A':'B';
    R.forEach(function(r,k){ if(S.ans[r.i][qi]===minor) minority[k]++; });
  });
  var mi = minority.indexOf(Math.max.apply(null,minority));
  if(minority[mi]>0) h+='<div class="rank"><span class="k">いちばんの少数派（変わり者）</span><span class="v">'+esc(R[mi].p.name)+'（'+minority[mi]+'回）</span></div>';
  // 即決王（こっそり回すときだけ時間をはかっている）
  if(S.style==='secret'){
    var avg=R.map(function(r){ var t=S.times[r.i].filter(Boolean); return t.length? t.reduce(function(x,y){return x+y;},0)/t.length : 1e9; });
    var fi=avg.indexOf(Math.min.apply(null,avg)), si=avg.indexOf(Math.max.apply(null,avg));
    h+='<div class="rank"><span class="k">即決王</span><span class="v">'+esc(R[fi].p.name)+'（平均'+(Math.round(avg[fi]/100)/10)+'秒）</span></div>';
    h+='<div class="rank"><span class="k">いちばん悩んだ人</span><span class="v">'+esc(R[si].p.name)+'（平均'+(Math.round(avg[si]/100)/10)+'秒）</span></div>';
  }
  // 生まれ持ったものとのギャップ
  var gaps=R.filter(function(r){ return r.bsc; }).map(function(r){ var g=bigGap(mode,r.sc,r.bsc); return {r:r,g:g}; });
  if(gaps.length){
    gaps.sort(function(a,b){ return Math.abs(b.g.g)-Math.abs(a.g.g); });
    var gg=gaps[0];
    h+='<div class="rank"><span class="k">生まれつきとのギャップ王</span><span class="v">'+esc(gg.r.p.name)+'（'+(gg.g.g>0?gg.g.ax.hi:gg.g.ax.lo)+'寄りに '+Math.abs(gg.g.g)+'）</span></div>';
  }
  h+='</div>';

  // 2人ずつの一致率
  var pairs=[];
  for(var x=0;x<n;x++) for(var y=x+1;y<n;y++){
    var same=0; S.qs.forEach(function(q,qi){ if(S.ans[x][qi]===S.ans[y][qi]) same++; });
    pairs.push({x:x,y:y,r:Math.round(100*same/S.qs.length)});
  }
  pairs.sort(function(a,b){ return b.r-a.r; });
  h+='<div class="card"><h3>答えの一致率</h3>';
  var pb=pairs[0], pw=pairs[pairs.length-1];
  h+='<div class="rank"><span class="k">いちばん気が合う2人</span><span class="v">'+esc(S.players[pb.x].name)+' × '+esc(S.players[pb.y].name)+'（'+pb.r+'%）</span></div>';
  if(pairs.length>1) h+='<div class="rank"><span class="k">永遠に平行線の2人</span><span class="v">'+esc(S.players[pw.x].name)+' × '+esc(S.players[pw.y].name)+'（'+pw.r+'%）</span></div>';
  h+='</div>';

  // ひとりずつ
  h+='<div class="card"><h3>ひとりずつの診断</h3>';
  R.forEach(function(r){
    h+='<div class="ppl"><div class="nm">'+esc(r.p.name)+'　<span class="ty">'+esc(r.ty.n)+'</span></div>'+
       '<div class="ds">'+hd.cap+' '+r.sc[hd.k]+'%　／　'+subtitle(mode,r.sc)+'</div>'+
       '<div class="ds">'+esc(r.ty.c)+'</div>'+
       (r.born?'<div class="ds">生まれた日の星：'+r.born.stem+'（'+r.born.yomi+'）＝'+esc(r.born.img)+'</div>':'')+
       '<details style="margin-top:6px"><summary style="font-size:14px;font-weight:700;min-height:44px;display:flex;align-items:center;cursor:pointer">心の中を見る</summary>'+axisHTML(mode,r.sc,r.bsc)+
       (r.bsc?'<p class="hint">'+esc(gapText(mode,r.sc,r.bsc))+'</p>':'')+'</details></div>';
  });
  h+='</div>';

  h+='<button class="big" id="gshare">結果をシェアする</button>'+endButtons()+promoHTML();
  $('res-body').innerHTML='';
  $('gres-body').innerHTML=h;
  $('gshare').onclick=function(){
    var t='究極の二択【'+playName(mode)+'】'+n+'人で遊んだ結果\n'+
      R.map(function(r){ return r.p.name+'＝'+r.ty.n+'（'+hd.cap+r.sc[hd.k]+'%）'; }).join('\n')+
      '\nいちばん気が合う2人：'+S.players[pb.x].name+'×'+S.players[pb.y].name+'\n#究極の二択';
    doShare(t);
  };
  bindEnd();
  show('s-gres');
}

setMode('love');
})();

<script id="pk-contrast-guard">

      e.style.textWrap=''; tail(e);
    }); }
  let t=null; const sch=()=>{ clearTimeout(t); t=setTimeout(()=>{ try{run();}catch(_e){} },220); };
  try{ new MutationObserver(sch).observe(document.body,{childList:true,subtree:true}); }catch(e){}
  document.addEventListener('toggle',sch,true); document.addEventListener('click',sch,true);

})();
/* 印刷が開かないときの案内（鑑定者本人の指摘 2026-10-29「印刷ボタンを押しても何の動きもない」）：
   Gmail・LINE・Instagram などアプリの中の画面では、ブラウザの印刷（window.print）が止められていて、押しても何も起きない。
   印刷を頼んで1.5秒たっても印刷の画面が開かなければ、「Safari・Chromeで開いてから」の案内を出す。3サイトの全ページ（鑑定書・アプリの鑑定書の画面も）で同じ。 */
(function(){
  if(window.__pkPrintHelp) return; window.__pkPrintHelp=true;
  var orig=window.print; if(typeof orig!=='function') return;
  var opened=false; function mark(){ opened=true; }
  try{ window.addEventListener('beforeprint',mark); window.addEventListener('afterprint',mark); var mq=window.matchMedia&&window.matchMedia('print'); if(mq){ if(mq.addEventListener) mq.addEventListener('change',function(e){ if(e.matches) mark(); }); else if(mq.addListener) mq.addListener(function(e){ if(e.matches) mark(); }); } }catch(e){}
  function link(){ try{ var u=(window.top&&window.top.location&&window.top.location.href)||location.href; return /^https?:/.test(u)?u:''; }catch(e){ return /^https?:/.test(location.href)?location.href:''; } }
  function show(){ try{ var old=document.getElementById('pk-print-help'); if(old) old.remove();
    var karte=false; try{ karte=!!((window.top&&window.top.document||document).getElementById('mypageToggle')); }catch(_e){ karte=!!document.getElementById('mypageToggle'); }
    var ua=navigator.userAgent||'', ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&'ontouchend' in document), u=link();
    var d=document.createElement('div'); d.id='pk-print-help'; d.className='no-print'; d.setAttribute('role','dialog'); d.setAttribute('aria-label','印刷の画面が開かないとき');
    d.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:2147483647;max-width:560px;margin:0 auto;background:#fff;color:#1b1b1b;border:2px solid #4F46E5;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.22);padding:14px 14px 12px;font:700 14.5px/1.7 system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif';
    d.innerHTML='<div style="font-size:16px;font-weight:900;color:#3730A3;margin-bottom:4px">🖨 印刷の画面が開かないときは</div>'+
      '<div>Gmail・LINE などのアプリの中で開いていると、印刷・PDF保存が使えません。ブラウザで開き直してから、もう一度押してください。</div>'+
      '<div style="margin-top:6px;background:#F4F5FF;border-radius:10px;padding:8px 10px">'+(ios?'<b>iPhone</b>：画面の右下か右上の <b>共有ボタン</b>（□に↑）や <b>「…」</b> →「<b>Safariで開く</b>」<br><span style="font-weight:700;color:#4A4458">共有ボタンの中の「プリント」からも印刷・PDF保存できます</span>':'<b>Android</b>：右上の <b>「︙」</b> →「<b>ブラウザで開く</b>」（Chromeで開く）')+'</div>'+
      (karte?'<div style="margin-top:6px;font-size:13px;color:#4A4458">鑑定は顧客カルテに保存されています。ブラウザで開いたあと、顧客カルテから開けます。</div>':'')+
      '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">'+(u?'<button type="button" data-a="copy" style="flex:1 1 160px;min-height:44px;border:0;border-radius:12px;background:#4F46E5;color:#fff;font:inherit;font-weight:900;cursor:pointer">このページのリンクをコピー</button>':'')+'<button type="button" data-a="close" style="flex:0 0 auto;min-height:44px;padding:0 16px;border:1.5px solid #C9CDF5;border-radius:12px;background:#fff;color:#3730A3;font:inherit;font-weight:900;cursor:pointer">閉じる</button></div>';
    d.addEventListener('click',function(e){ var b=e.target.closest&&e.target.closest('button'); if(!b) return; if(b.dataset.a==='close'){ d.remove(); return; }
      if(b.dataset.a==='copy'){ var ok=function(){ b.textContent='コピーしました。Safari・Chromeに貼りつけて開いてください'; }; try{ navigator.clipboard.writeText(u).then(ok,function(){ window.prompt('このリンクをコピーしてください',u); }); }catch(_e){ try{ window.prompt('このリンクをコピーしてください',u); }catch(__e){} } } });
    (document.body||document.documentElement).appendChild(d); }catch(e){} }
  window.print=function(){ opened=false; var r; try{ r=orig.apply(window,arguments); }catch(e){} setTimeout(function(){ if(!opened&&!document.hidden) show(); },1500); return r; };
})();
