<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>究極の二択 アイコンの元</title>
<!-- アイコンの元（1024×1024）。tools なしで作り直すときは、この画面を 1024×1024 で撮影して縮める -->
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0}
.ic{width:1024px;height:1024px;position:relative;overflow:hidden;
  background:#F3ECFF;background-image:radial-gradient(#D9C8FA 9px,transparent 10px);background-size:96px 96px;background-position:24px 24px;
  font-family:"Mochiy Pop One",sans-serif}
.card{position:absolute;left:150px;top:190px;width:724px;height:644px;background:#fff;border:22px solid #2E1A47;border-radius:120px;box-shadow:36px 36px 0 #B9A3EE;box-sizing:border-box}
.t{position:absolute;left:0;right:0;top:262px;text-align:center;font-size:280px;line-height:1;color:#E0457B;text-shadow:14px 14px 0 #2E1A47;letter-spacing:0;padding-right:14px}
.a,.b{position:absolute;top:610px;width:170px;height:170px;border:16px solid #2E1A47;border-radius:50%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:100px;color:#2E1A47}
.a{left:250px;background:#FFD6E8;transform:rotate(-8deg)}
.b{right:250px;background:#D7E6FF;transform:rotate(8deg)}
</style>
</head>
<body>
<div class="ic" id="ic">
  <div class="card"></div>
  <div class="t">二択</div>
  <div class="a">A</div>
  <div class="b">B</div>
</div>
</body>
</html>
