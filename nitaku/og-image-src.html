<!doctype html><html lang="ja"><head><meta charset="utf-8">
<!-- シェアしたときの画像 og-image.png の元（1200×630）。直したらブラウザで開いて1200×630で撮り直す。 -->
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0}
.c{width:1200px;height:630px;background:#F3ECFF;background-image:radial-gradient(#D9C8FA 3px,transparent 3.2px);background-size:30px 30px;display:flex;align-items:center;justify-content:center;font-family:"Zen Maru Gothic",sans-serif;color:#2E1A47}
.card{position:relative;width:1060px;height:500px;background:#fff;border:6px solid #2E1A47;border-radius:44px;box-shadow:14px 14px 0 #B9A3EE;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:20px}
.tape{position:absolute;top:-30px;left:50%;transform:translateX(-50%) rotate(-3deg);background:#FFD6E8;border:4px solid #2E1A47;padding:6px 34px;font-size:30px;font-weight:900}
.seal{position:absolute;top:-40px;right:30px;width:130px;height:130px;border-radius:50%;background:#FFE68A;border:4px solid #2E1A47;display:flex;align-items:center;justify-content:center;text-align:center;font-family:"Mochiy Pop One";font-size:32px;line-height:1.15;transform:rotate(12deg)}
.hk{font-family:"Mochiy Pop One";font-size:34px;color:#5B2A86}
.t{font-family:"Mochiy Pop One";font-size:150px;line-height:1.1;color:#E0457B;text-shadow:7px 7px 0 #2E1A47;margin:6px 0 14px}
.pill{background:#2E1A47;color:#fff;font-family:"Mochiy Pop One";font-size:34px;padding:8px 34px;border-radius:999px}
.row{display:flex;align-items:center;gap:18px;margin-top:28px}
.ch{border:4px solid #2E1A47;border-radius:24px;padding:12px 24px;font-size:28px;font-weight:900}
.a{background:#FFD6E8}.b{background:#D7E6FF}
.vs{font-family:"Dela Gothic One";font-size:34px;background:#E0457B;color:#2E1A47;border-radius:999px;padding:4px 18px;border:4px solid #2E1A47}
</style></head><body><div class="c"><div class="card">
<div class="tape">本音バレ注意</div><div class="seal">無料<br>3分</div>
<div class="hk">ねえ、どっち派？</div><div class="t">究極の二択</div>
<div class="pill">小悪魔度も、本音も、％でバレる</div>
<div class="row"><div class="ch a">年収2000万の好きじゃない人</div><div class="vs">VS</div><div class="ch b">貯金ゼロの大好きな人</div></div>
</div></div></body></html>
