<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>究極の二択 統計</title>
<link rel="icon" href="favicon-32.png?v=3">
<style>
/* 究極の二択の統計（鑑定者本人だけが見るページ。2026-11-17「遊んだ人数を統計取り、一問一問統計を取りたい」）
   データは公開の Firestore（nitaku_stats・nitaku_hist・nitaku_votes）から読むだけ。書きこみはしない */
:root{--bg:#FFF8E1;--ink:#1E1E2A;--sub:#4A4A5A;--shadow:#F2C94C;--pink:#FF3D7F;--deep:#C2185B;--a:#FFD3E2;--b:#CFE3FF;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Zen Maru Gothic","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6;
  padding:16px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px));word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.lead{margin:0 0 14px;color:var(--sub);font-size:14px}
.card{background:#fff;border:2.5px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--shadow);padding:14px 16px;margin:0 0 16px}
h2{font-size:17px;margin:0 0 10px}
.big{font-size:34px;font-weight:900;line-height:1.1}
.big small{font-size:15px;margin-left:4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid #E8DDB8;padding:6px 6px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:13px;color:var(--sub)}
.tw{overflow-x:auto}
.hist{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.hx{border:2px solid #E8DDB8;border-radius:12px;padding:10px}
.hx h3{font-size:15px;margin:0 0 4px}
.hx p{margin:0 0 6px;font-size:13px;color:var(--sub)}
.bars{display:flex;align-items:flex-end;gap:2px;height:80px}
.bars i{flex:1;background:var(--pink);border-radius:2px 2px 0 0;min-height:1px}
.axl{display:flex;justify-content:space-between;font-size:11px;color:var(--sub)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.ctl button{min-height:44px;border:2px solid var(--ink);border-radius:999px;background:#fff;padding:0 14px;font:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
.ctl button[aria-pressed="true"]{background:#FFE071}
.q{border-top:1px solid #E8DDB8;padding:10px 0}
.q:first-child{border-top:0}
.qh{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--sub)}
.tg{display:inline-block;border:1.5px solid var(--ink);border-radius:999px;padding:0 8px;margin-left:4px;font-weight:700;color:var(--ink);background:#fff}
.tg.w{background:#FFE071}.tg.s{background:#CFF0E0}
.ab{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-size:14px;margin-top:4px}
.ab .n{font-weight:900;text-align:right}
.bar{grid-column:1/-1;display:flex;height:10px;border-radius:999px;overflow:hidden;border:1.5px solid var(--ink)}
.bar .x{background:#FFA8C6}.bar .y{background:#A6C8FF}
.pt{font-size:12px;color:var(--sub)}
.note{font-size:13px;color:var(--sub);margin:8px 0 0}
.err{color:var(--deep);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <h1>究極の二択 統計</h1>
  <p class="lead">遊んだ回数・4つの％の分布・1問ずつの答え。このページは検索に出ない設定です（リンクを知っている人は見られます）。</p>
  <div id="out"><p>読みこんでいます…</p></div>
</div>
<script src="firebase-config.js"></script>
<script src="questions.js"></script>
<script src="questions-mine.js"></script>
<script src="questions-hon.js"></script>
<script>
(function(){
'use strict';
var cfg=window.NITAKU_FB||{}, BASE='https://firestore.googleapis.com/v1/projects/'+cfg.projectId+'/databases/(default)/documents/';
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function hashStr(s){ var h=5381; for(var i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return (h>>>0).toString(36); }
function num(f){ return f ? +(f.integerValue||f.doubleValue||0) : 0; }
function fields(doc){ var o={}, f=(doc&&doc.fields)||{}; Object.keys(f).forEach(function(k){ o[k]=num(f[k]); }); return o; }
async function getDoc(path){ var r=await fetch(BASE+path+'?key='+cfg.apiKey); if(r.status===404) return {}; if(!r.ok) throw new Error(path+' '+r.status); return fields(await r.json()); }
async function listCol(path){ var out=[], tok=''; do{ var r=await fetch(BASE+path+'?pageSize=300&key='+cfg.apiKey+(tok?'&pageToken='+tok:'')); if(!r.ok) throw new Error(path+' '+r.status); var d=await r.json(); (d.documents||[]).forEach(function(x){ out.push({ id:x.name.split('/').pop(), f:fields(x) }); }); tok=d.nextPageToken||''; }while(tok); return out; }

var MODE={love:'恋愛編',normal:'まぜまぜ編（前のふつう編）',hon:'本能モード'}, LVN={easy:'イージー',normal:'ノーマル',hard:'ハード',mix:'ノーマル→ハード（8問）',x:'—'}, WHO={solo:'ひとりで',room:'みんなで（部屋）'};
var AX={love:[['K','小悪魔度'],['R','ロマン度'],['S','刺激好き度'],['A','甘えたい度']],normal:[['B','冒険度'],['Y','こだわり度'],['M','見栄っぱり度'],['N','ノリ度']]};
// 問題（サイトと同じ目印）
var Q={};
['love','normal'].forEach(function(m){
  ((window.NITAKU_BASE||{})[m]||[]).concat(((window.NITAKU_MINE||{})[m])||[]).forEach(function(q){ if(!q||!q[0]||!q[1]) return; var id=hashStr(q[0]+'｜'+q[1]); if(!Q[id]) Q[id]={ m:m, a:q[0], b:q[1], ta:q[2]||'', tb:q[3]||'', lv:+q[4]||2 }; });
  ((window.NITAKU_HON||{})[m]||[]).forEach(function(q){ if(!q||!q[0]||!q[1]) return; var id=hashStr(q[0]+'｜'+q[1]); if(!Q[id]) Q[id]={ m:'hon', sub:m, a:q[0], b:q[1], ta:'', tb:'', lv:0 }; });
});

var st={ mode:'love', sort:'n' }, V=[];
function playsHTML(P){
  var tot=0; Object.keys(P).forEach(function(k){ tot+=P[k]; });
  var h='<div class="card"><h2>遊んだ回数</h2><div class="big">'+tot.toLocaleString()+'<small>回</small></div><p class="note">遊び終わって結果が出た回数（部屋は1人ずつ数える）。2026-11-17 から数えはじめた。</p>';
  if(tot){
    var rows=Object.keys(P).sort(function(a,b){ return P[b]-P[a]; });
    h+='<div class="tw"><table><tr><th>遊び方</th><th>編</th><th>難しさ</th><th>回数</th><th>割合</th></tr>'+rows.map(function(k){ var p=k.split('_'); return '<tr><td>'+WHO[p[0]]+'</td><td>'+MODE[p[1]]+'</td><td>'+(LVN[p[2]]||p[2])+'</td><td>'+P[k].toLocaleString()+'</td><td>'+Math.round(100*P[k]/tot)+'%</td></tr>'; }).join('')+'</table></div>';
  }
  return h+'</div>';
}
function histHTML(H){
  var any=0; Object.keys(H).forEach(function(k){ Object.keys(H[k]).forEach(function(b){ any+=H[k][b]; }); });
  if(!any) return '<div class="card"><h2>4つの％の分布</h2><p class="note">まだ数えていません（遊んだ人の％がたまると、ここにグラフが出ます）。</p></div>';
  var h='<div class="card"><h2>4つの％の分布</h2><p class="note">遊んだ人の％を5%きざみで数えたもの（その％を見る問題に2問以上答えた人だけ）。結果の「○人中、あなたより○○度が高い人は○%」は、ここが100人をこえたら出る。</p><div class="hist">';
  ['love','normal'].forEach(function(m){ AX[m].forEach(function(ax){
    var d=H[m+'_'+ax[0]]||{}, a=[], tot=0, sum=0; for(var i=0;i<=20;i++){ var v=d['b'+i]||0; a.push(v); tot+=v; sum+=v*i*5; }
    var mx=Math.max.apply(null,a)||1;
    h+='<div class="hx"><h3>'+MODE[m]+'・'+ax[1]+'</h3><p>'+tot.toLocaleString()+'人'+(tot?'・平均'+Math.round(sum/tot)+'%':'')+'</p><div class="bars">'+a.map(function(v,i){ return '<i title="'+(i*5)+'%：'+v+'人" style="height:'+Math.round(100*v/mx)+'%"></i>'; }).join('')+'</div><div class="axl"><span>0%</span><span>50%</span><span>100%</span></div></div>';
  }); });
  return h+'</div></div>';
}
function qsHTML(){
  var L=V.filter(function(x){ return x.q.m===st.mode; });
  var key={ n:function(x){ return -x.n; }, split:function(x){ return (x.n<5?1e6:0)+Math.abs(x.pa-50); }, lean:function(x){ return (x.n<5?1e6:0)-Math.abs(x.pa-50); } }[st.sort];
  L.sort(function(a,b){ return key(a)-key(b); });
  var all=Object.keys(Q).filter(function(id){ return Q[id].m===st.mode; }).length, got=L.length, votes=L.reduce(function(s,x){ return s+x.n; },0);
  var h='<div class="card"><h2>1問ずつの答え</h2>'+
    '<div class="ctl">'+['love','normal','hon'].map(function(m){ return '<button type="button" data-m="'+m+'" aria-pressed="'+(st.mode===m)+'">'+MODE[m]+'</button>'; }).join('')+'</div>'+
    '<div class="ctl">'+[['n','答えた人が多い順'],['split','意見が分かれた順'],['lean','かたよった順']].map(function(x){ return '<button type="button" data-s="'+x[0]+'" aria-pressed="'+(st.sort===x[0])+'">'+x[1]+'</button>'; }).join('')+'</div>'+
    '<p class="note">'+all+'問のうち、答えがあるのは'+got+'問・'+votes.toLocaleString()+'票。「かたよった」＝20人以上答えて、9割が同じ答え（％がほとんど動かない問題。点数の見直し候補）。「意見が分かれた順」「かたよった順」は、5人以上答えた問題を先に並べる。</p>';
  L.slice(0,200).forEach(function(x){
    var q=x.q, lean=x.n>=20 && Math.max(x.pa,100-x.pa)>=90, split=x.n>=20 && Math.abs(x.pa-50)<=5;
    h+='<div class="q"><div class="qh"><span>'+(q.lv?['','イージー','ノーマル','ハード'][q.lv]:'本能')+(lean?'<span class="tg w">かたよった</span>':'')+(split?'<span class="tg s">まっぷたつ</span>':'')+'</span><span>'+x.n+'人</span></div>'+
      '<div class="ab"><span>A：'+esc(q.a)+'</span><span class="n">'+x.pa+'%（'+x.a+'）</span><span>B：'+esc(q.b)+'</span><span class="n">'+(100-x.pa)+'%（'+x.b+'）</span>'+
      '<div class="bar"><span class="x" style="width:'+x.pa+'%"></span><span class="y" style="width:'+(100-x.pa)+'%"></span></div></div>'+
      ((q.ta||q.tb)?'<div class="pt">点数　A：'+esc(q.ta||'なし')+'　B：'+esc(q.tb||'なし')+'</div>':'')+'</div>';
  });
  if(L.length>200) h+='<p class="note">ほかに'+(L.length-200)+'問（多い順の200問まで出しています）</p>';
  return h+'</div>';
}
var P={}, H={};
function mineCard(){ var M=window.__mine; if(!M) return ''; var n=function(k){ return (+M[k]||0).toLocaleString(); }; return '<div class="card"><h2>わたしの結果を開いた回数</h2><p>トップの一覧：'+n('list')+'回／部屋の「さっきの結果」：'+n('last')+'回／一覧から1つ開いた：'+n('entry')+'回</p></div>'; }
function render(){ var m=window.__miss||[]; document.getElementById('out').innerHTML=mineCard()+(m.length?'<div class="card"><p class="err">'+m.join('・')+'は、まだ読めません。Firebase の決まり（firestore.rules）に nitaku_stats と nitaku_hist を足すと出ます。</p></div>':'')+playsHTML(P)+histHTML(H)+qsHTML(); }
document.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; if(b.dataset.m){ st.mode=b.dataset.m; render(); } else if(b.dataset.s){ st.sort=b.dataset.s; render(); } });
(async function(){
  try{
    if(!cfg.projectId) throw new Error('firebase-config.js がありません');
    // 遊んだ回数・分布は、Firebase の決まりに nitaku_stats・nitaku_hist を足すまで読めない（読めなくても1問ずつの答えは出す）
    var miss=[], soft=function(pr, name, empty){ return pr.catch(function(){ miss.push(name); return empty; }); };
    var r=await Promise.all([soft(getDoc('nitaku_stats/plays'),'遊んだ回数',{}), soft(listCol('nitaku_hist'),'4つの％の分布',[]), listCol('nitaku_votes')]);
    window.__mine=await getDoc('nitaku_stats/mine').catch(function(){ return null; });
    window.__miss=miss;
    P=r[0]; r[1].forEach(function(d){ H[d.id]=d.f; });
    r[2].forEach(function(d){ var q=Q[d.id]; if(!q) return; var a=d.f.a||0, b=d.f.b||0, n=a+b; if(!n) return; V.push({ id:d.id, q:q, a:a, b:b, n:n, pa:Math.round(100*a/n) }); });
    render();
  }catch(e){ document.getElementById('out').innerHTML='<p class="err">読みこめませんでした（'+esc(e.message)+'）</p>'; }
})();
})();
</script>
<script id="pk-contrast-guard">
/* 文字の見えやすさの安全装置（tools/add_contrast_guard.py が3サイトの全ページに埋め込む。直すときはこのファイルを直して再実行）
   文字の色と、その後ろの背景の色を比べて、読みにくい組み合わせ（薄い背景に薄い文字／濃い背景に濃い文字）を見つけたら、
   その文字だけ色を自動で調整する（明るい背景→同じ色みのまま濃く、暗い背景→白く）。計算・鑑定の中身には一切さわらない。
   目安：明るい背景の上の文字はコントラスト比7以上（大きい文字＝24px以上、または18.66px以上の太字は4.5以上）。濃い色の上の白い文字は4.5以上（大きい文字は3以上）。 */
(function(){
  if(window.__pkContrast) return; window.__pkContrast=true;
  function P(c){ var m=c&&c.match(/[\d.]+/g); return m?[+m[0],+m[1],+m[2],m.length>3?+m[3]:1]:null; }
  function L(c){ function f(v){ v/=255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4); } return 0.2126*f(c[0])+0.7152*f(c[1])+0.0722*f(c[2]); }
  function CR(a,b){ var x=L(a),y=L(b); return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05); }
  function mix(a,b,t){ return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]; }
  function over(f,b){ var a=f[3]==null?1:f[3]; return [f[0]*a+b[0]*(1-a),f[1]*a+b[1]*(1-a),f[2]*a+b[2]*(1-a)]; }
  // 文字の後ろの背景：背景色のある祖先を上へたどる。グラデーションは色の幅を見る。写真などの画像背景は判定しない
  var BG=null, OP=null;   // 1回の点検の中だけ使う覚え書き（同じ祖先を何度も調べない）
  function bgOf(n){
    if(!n||n.nodeType!==1) return {lo:1,hi:1,rgb:[255,255,255]};
    if(BG&&BG.has(n)) return BG.get(n);
    var cs=getComputedStyle(n), bi=cs.backgroundImage, r;
    // 飾りの層（::before／::after に背景がある）が文字の後ろにあるときは、正しく判定できないので触らない
    var deco=false; ['::before','::after'].forEach(function(ps){ try{ var pc=getComputedStyle(n,ps); if(pc.content&&pc.content!=='none'&&(pc.position==='absolute'||pc.position==='fixed')){ var pb=P(pc.backgroundColor); if((pb&&pb[3]>0.3)||(pc.backgroundImage&&pc.backgroundImage!=='none')){ var pw=parseFloat(pc.width)||0, ph=parseFloat(pc.height)||0, nr=n.getBoundingClientRect(); /* 端の細い帯・小さな飾りは文字の後ろにかからないので測ってよい */ var thin=(pw>0&&pw<=12)||(ph>0&&ph<=12)||(nr.width>0&&pw>0&&pw<nr.width*0.2)||(nr.height>0&&ph>0&&ph<nr.height*0.2); if(!thin) deco=true; } } }catch(_e){} });
    if(deco||(bi&&bi!=='none'&&/url\(/.test(bi))) r=null;
    else{
      var parent=bgOf(n.parentElement);
      if(parent===null) r=null;
      else{
        var bc=P(cs.backgroundColor), base=parent.rgb;
        if(bc&&bc[3]>0) base=over(bc,base);
        var cols=(bi&&bi!=='none')?(bi.match(/rgba?\([^)]*\)/g)||[]).map(P).filter(Boolean):[];
        if(cols.length){ var lo=1,hi=0,acc=[0,0,0]; cols.forEach(function(c){ var m=over(c,base), l=L(m); if(l<lo)lo=l; if(l>hi)hi=l; acc[0]+=m[0];acc[1]+=m[1];acc[2]+=m[2]; });
          r={lo:lo,hi:hi,rgb:[acc[0]/cols.length,acc[1]/cols.length,acc[2]/cols.length]}; }
        else if(bc&&bc[3]>0){ var l2=L(base); r={lo:l2,hi:l2,rgb:base}; }
        else r=parent;
      }
    }
    if(BG) BG.set(n,r); return r;
  }
  function opac(n){ if(!n||n.nodeType!==1) return 1; if(OP&&OP.has(n)) return OP.get(n); var o=(+getComputedStyle(n).opacity)*opac(n.parentElement); if(OP) OP.set(n,o); return o; }
  function fix(e,cs){
    var own=''; for(var c=e.firstChild;c;c=c.nextSibling) if(c.nodeType===3) own+=c.nodeValue; if(!own.trim()) return;
    cs=cs||getComputedStyle(e); if(cs.display==='none'||cs.visibility==='hidden') return;
    var fill=cs.webkitTextFillColor; if(fill&&/rgba\(0, 0, 0, 0\)|transparent/.test(fill)) return;   // 文字そのものがグラデーションのもの
    var fixed=e.hasAttribute('data-pkcg'), fg=P(fixed?(e.getAttribute('data-pkco')||cs.color):cs.color); if(!fg) return;   // 前に直した文字は、元の色で測り直す（背景が変わったら戻す・直し直す）
    var undo=function(){ if(!fixed) return; var o=e.getAttribute('data-pkcg'); if(o) e.style.setProperty('color',o); else e.style.removeProperty('color'); e.removeAttribute('data-pkcg'); e.removeAttribute('data-pkco'); };
    var bg=bgOf(e); if(!bg){ undo(); return; }
    if(bg.hi-bg.lo>0.35){ undo(); return; }                       // 明暗が大きく混ざった背景は判定しない
    var fs=parseFloat(cs.fontSize)||14, bold=(+cs.fontWeight||400)>=700;
    var big=(fs>=24||(fs>=18.66&&bold)), need=big?3:4.5;
    var op=opac(e); if(op<0.6) return;                 // 透明・半透明で隠している途中のもの（通知・ふわっと出る表示など）は触らない
    var a=(fg[3]==null?1:fg[3])*op;
    var light=((bg.lo+bg.hi)/2)>0.4, to=light?[0,0,0]:[255,255,255], c2=null;
    if(light) need=big?4.5:7;
    if(printing&&!light) return;   // 印刷中は、濃い背景の上の文字を白っぽくしない（紙では背景の色が出ないことがあるため）   // 明るい背景の上の文字は一段きびしく（ふつうの文字7以上・大きい文字4.5以上）。濃い色の上の白い文字は4.5のまま（発注者指示 2026-10-21）
    var base=bg.rgb, seen=over([fg[0],fg[1],fg[2],a],base);
    if(CR(seen,base)>=need){ undo(); return; }
    for(var t=0.1;t<=1.0001;t+=0.1){ var cand=mix([fg[0],fg[1],fg[2]],to,t); if(CR(over([cand[0],cand[1],cand[2],a],base),base)>=need){ c2=cand; break; } }
    if(!c2){   // 中くらいの明るさの色の上（白い文字＋黄土色の札など）：白くしても足りないときは、濃い文字にする
      var to2=light?[255,255,255]:[0,0,0];
      for(var t2=0.1;t2<=1.0001;t2+=0.1){ var cand2=mix([fg[0],fg[1],fg[2]],to2,t2); if(CR(over([cand2[0],cand2[1],cand2[2],a],base),base)>=need){ c2=cand2; break; } }
    }

    var over=function(p){ var cs=getComputedStyle(p), r=p.getBoundingClientRect(), inl=/^inline/.test(cs.display); if((!tf(p)&&r.right>vw+1)||(!inl&&/visible/.test(cs.overflowX)&&p.scrollWidth>p.clientWidth+2)) return true; var pa=p.parentElement, pc=pa&&getComputedStyle(pa); if(pa&&/flex|grid/.test(pc.display)){ if(pa.scrollWidth>pa.clientWidth+2) return true; for(var k=pa.firstElementChild;k;k=k.nextElementSibling){ var kr=k.getBoundingClientRect(); if(kr.width>0&&!tf(k)&&kr.right>vw+1&&getComputedStyle(k).position!=='fixed') return true; } } return false; };   /* 横並びの中では、となりの札が押し出されていないかも見る */
    touched.forEach(function(p){ if(!p.isConnected) return;
      for(var a=p.parentElement;a&&a!==document.body;a=a.parentElement){ if(/(auto|scroll)/.test(getComputedStyle(a).overflowX)) return; }   // 横にすべらせる入れ物の中は、はみ出してよい
      var t=p.closest('table'); if(t){ tbls.add(t); return; }
      if(over(p)){ p.classList.add('pk-ph-any'); redo.push(p); } });
    tbls.forEach(function(t){ if(!tf(t)&&t.getBoundingClientRect().right>vw+1) t.querySelectorAll('.pk-ph,.pk-nw').forEach(function(x){ x.classList.add('pk-ph-off'); }); });
    if(redo.length) requestAnimationFrame(function(){ redo.forEach(function(p){ if(p.isConnected&&over(p)) p.classList.add('pk-ph-off'); }); });   // まとまりを保ったまま折ってもはみ出すときだけ、元の改行に
    touched=[]; }
  var busy=false;
  function run(root){ if(busy) return; busy=true; try{ var w=document.createTreeWalker(root||document.body,NodeFilter.SHOW_TEXT,null), a=[], n; while((n=w.nextNode())) if(!done.has(n)) a.push(n); a.forEach(doNode); if(touched.length){ var tt=touched; touched=[]; setTimeout(function(){ requestAnimationFrame(function(){ touched=tt.concat(touched); fixOver(); }); },400); } }catch(e){} busy=false; }   /* 幅が落ち着いてから測る（読み込みの途中で測ると、はみ出していないのに元にもどしていた） */
  var tm=null, q=[];
  function later(){ if(tm) return; tm=setTimeout(function(){ tm=null; var r=q; q=[]; if(r.length>40) run(document.body); else r.forEach(function(x){ if(x.isConnected) run(x); }); },120); }
  function start(){ if(!document.body) return; run(document.body);
    try{ new MutationObserver(function(ms){ if(busy) return; ms.forEach(function(m){ m.addedNodes.forEach(function(x){ if(x.nodeType===1) q.push(x); else if(x.nodeType===3&&x.parentElement) q.push(x.parentElement); }); }); if(q.length) later(); }).observe(document.body,{childList:true,subtree:true}); }catch(e){} }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
