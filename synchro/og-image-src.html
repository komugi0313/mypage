<!doctype html><html lang="ja"><head><meta charset="utf-8">
<!-- シェアしたときの画像の元（1200×630）。作り直すときはこの画面を撮って og-image.png にし、index.html の og:image の ?v= を1つ上げる -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:"Zen Kaku Gothic New",sans-serif;color:#2A2559;display:grid;grid-template-columns:1fr 510px;align-items:center;gap:30px;padding:0 60px;box-sizing:border-box;
 background:linear-gradient(160deg,#5E5FA8 0%,#9A86C4 40%,#E3B3C8 75%,#F7D9C9 100%)}
.l{display:flex;flex-direction:column;align-items:center;gap:16px}
.ring{width:110px;height:110px;border-radius:50%;background:conic-gradient(from 200deg,#8FE3CF,#A9B2F5,#F4B6D6,#8FE3CF);-webkit-mask:radial-gradient(circle closest-side,transparent 61%,#000 62%);mask:radial-gradient(circle closest-side,transparent 61%,#000 62%);filter:drop-shadow(0 0 14px rgba(255,255,255,.7))}
h1{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:112px;letter-spacing:.06em;line-height:1;margin:0;color:#fff;-webkit-text-stroke:14px #4B3C8F;paint-order:stroke fill;text-shadow:0 9px 0 #4B3C8F}
.rb{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:32px;letter-spacing:.14em;color:#4B3C8F;background:#fff;padding:8px 48px;clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%,5% 50%)}
p{font-size:26px;font-weight:700;margin:0;color:#fff;text-shadow:0 1px 8px rgba(42,37,89,.4)}
.card{background:#fff;border-radius:30px;padding:30px;display:flex;flex-direction:column;gap:14px;box-shadow:0 14px 40px rgba(60,40,110,.25)}
.tag{align-self:flex-start;background:#FAD0E4;color:#2A2559;font-weight:700;font-size:22px;padding:4px 16px;border-radius:99px}
.q{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:40px}
.o{border:2px solid #E2DDF5;background:#FBFAFF;border-radius:22px;padding:14px 18px;font-size:27px;font-weight:700;display:flex;gap:14px;align-items:center;white-space:nowrap}
.o b{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:#2A2559}
.o.a{border-color:#9ADCCB}.o.a b{background:#8FE3CF}.o.b{border-color:#EBB0CF}.o.b b{background:#F4B6D6}
.o.m{border-style:dashed;background:transparent;justify-content:center;color:#5E5785;font-size:24px}
</style></head><body>
<div class="l"><div class="ring"></div><h1>シンクロ</h1><div class="rb">こころが重なる2択</div><p>恋人・友だち・家族と答え合わせ。</p></div>
<div class="card"><span class="tag">恋愛・連絡</span><div class="q">LINEは？</div>
<div class="o a"><b>A</b>毎日やりとりしたい</div><div class="o b"><b>B</b>用があるときだけでいい</div><div class="o m">こだわらない</div></div>
</body></html>
