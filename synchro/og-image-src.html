<!doctype html><html lang="ja"><head><meta charset="utf-8">
<!-- シェアしたときの画像の元（1200×630）。作り直すときはこの画面を撮って og-image.png にし、index.html の og:image の ?v= を1つ上げる -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:"Zen Kaku Gothic New",sans-serif;color:#F3F5FF;display:grid;grid-template-columns:1fr 520px;align-items:center;gap:30px;padding:0 60px;box-sizing:border-box;
 background:radial-gradient(2px 2px at 10% 12%,#F4D98A 50%,transparent 51%),radial-gradient(2px 2px at 44% 8%,#fff 50%,transparent 51%),radial-gradient(3px 3px at 52% 88%,#F4D98A 50%,transparent 51%),radial-gradient(2px 2px at 95% 6%,#fff 50%,transparent 51%),radial-gradient(2.5px 2.5px at 30% 92%,#F4D98A 50%,transparent 51%),
 radial-gradient(110% 90% at 25% 0%,#2C3D88 0%,#141D47 60%,#0C1230 100%)}
.orb{width:110px;height:110px;border-radius:50%;position:relative;background:conic-gradient(from 200deg,#8FF0DA,#9EA8FF,#F6B5E0,#8FF0DA);box-shadow:0 0 50px rgba(158,168,255,.5);margin-bottom:26px}
.orb::after{content:"";position:absolute;inset:22px;border-radius:50%;background:#141D47;box-shadow:inset 0 0 0 3px #F4D98A}
h1{font-family:"Zen Old Mincho",serif;font-weight:700;font-size:118px;letter-spacing:.06em;line-height:1;margin:0;background:linear-gradient(90deg,#8FF0DA,#9EA8FF 50%,#F6B5E0);-webkit-background-clip:text;background-clip:text;color:transparent}
.tl{font-size:38px;font-weight:700;color:#F4D98A;letter-spacing:.12em;margin:18px 0 0}
p{font-size:28px;font-weight:500;margin:18px 0 0;color:#C5CAEE;line-height:1.5}
.card{background:#1C2656;border:1px solid #3A4785;border-radius:28px;padding:30px;display:flex;flex-direction:column;gap:14px}
.tag{align-self:flex-start;background:#F6B5E0;color:#141B45;font-weight:700;font-size:22px;padding:4px 16px;border-radius:99px}
.q{font-weight:700;font-size:40px}
.o{border:2px solid #3A4785;background:#243068;border-radius:18px;padding:14px 18px;font-size:27px;font-weight:700;display:flex;gap:14px;align-items:center;white-space:nowrap}
.o b{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:#141B45}
.o.a{border-color:rgba(143,240,218,.6)}.o.a b{background:#8FF0DA}.o.b{border-color:rgba(246,181,224,.6)}.o.b b{background:#F6B5E0}
.o.m{border-style:dashed;background:transparent;justify-content:center;color:#C5CAEE;font-size:24px}
</style></head><body>
<div><div class="orb"></div><h1>シンクロ</h1><div class="tl">こころが重なる2択</div><p>恋人・友だち・家族と答え合わせ。</p></div>
<div class="card"><span class="tag">恋愛・連絡</span><div class="q">LINEは？</div>
<div class="o a"><b>A</b>毎日やりとりしたい</div><div class="o b"><b>B</b>用があるときだけでいい</div><div class="o m">こだわらない</div></div>
</body></html>
