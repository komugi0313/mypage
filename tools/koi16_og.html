<!doctype html><html lang="ja"><head><meta charset="utf-8">
<!-- 恋のかたち診断のシェア画像（1200×630）。見た目A「表紙のように」（鑑定者本人 2026-11-16）。
     作り直し：node tools/koi16_og.cjs → koi16/og-image.png -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Shippori+Mincho+B1:wght@800&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#FBF6F1;font-family:"Noto Sans JP",sans-serif;color:#2A1A12;position:relative}
.frame{position:absolute;inset:28px;border:1.5px solid #EADDD3;border-radius:28px;background:linear-gradient(120deg,#FFFFFF 0%,#FDF3EE 100%)}
.txt{position:absolute;left:90px;top:150px;width:640px}
.eye{font-size:20px;letter-spacing:.3em;color:#A07A6A;margin:0 0 22px}
h1{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:72px;line-height:1.15;margin:0 0 22px;letter-spacing:.03em;white-space:nowrap}
.sub{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:34px;margin:0 0 34px;color:#5A3A2A}
.spec{display:flex;font-size:22px;color:#6E5A50;margin:0;padding:0;list-style:none}
.spec li{padding:0 22px;border-left:1.5px solid #E2D2C8}.spec li:first-child{padding-left:0;border-left:0}
.spec b{font-size:32px;color:#2A1A12;margin:0 3px}
.free{display:inline-block;margin-top:30px;font-size:20px;font-weight:700;color:#8A1246;border:1.5px solid #D9A8BC;border-radius:999px;padding:6px 20px;background:#fff}
.stage{position:absolute;right:56px;top:100px;width:420px;height:420px}
.stage::before{content:"";position:absolute;left:50%;top:56%;width:440px;height:300px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,#F6E2D2,rgba(253,243,238,0))}
.stage img{position:absolute;filter:drop-shadow(0 12px 16px rgba(90,50,30,.16))}
.c{width:250px;left:50%;top:40px;transform:translateX(-50%);z-index:2}
.l{width:150px;left:0;top:170px;transform:rotate(-8deg)}
.r{width:150px;right:0;top:165px;transform:rotate(7deg)}
.url{position:absolute;right:70px;bottom:52px;font-size:20px;letter-spacing:.12em;color:#A07A6A}
</style></head><body>
<div class="frame"></div>
<div class="txt">
  <p class="eye">LOVE TYPE · 16 TYPES</p>
  <h1>恋のかたち診断</h1>
  <p class="sub">あなたの恋は、どんなかたち？</p>
  <ul class="spec"><li><b>40</b>問</li><li>約<b>7</b>分</li><li><b>16</b>タイプ</li></ul>
  <span class="free">無料・登録不要</span>
</div>
<div class="stage">
  <img class="l" src="../koi16/img/LVTC.png" alt="">
  <img class="r" src="../koi16/img/RVTC.png" alt="">
  <img class="c" src="../koi16/img/LATC.png" alt="">
</div>
<div class="url">koikata.jp</div>
</body></html>
