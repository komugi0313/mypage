<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Shippori+Mincho+B1:wght@800&display=swap"><style>html,body{margin:0;width:1200px;height:630px;overflow:hidden}body{background:#FBF6F1;font-family:"Noto Sans JP",sans-serif;color:#2A1A12;position:relative}.min{font-family:"Shippori Mincho B1",serif;font-weight:800}img{filter:drop-shadow(0 8px 12px rgba(90,50,30,.15))}
.l{position:absolute;left:70px;top:70px;width:560px}
.eye{display:inline-block;background:#B01A5A;color:#fff;font-weight:900;font-size:24px;padding:8px 20px;border-radius:999px}
h1{font-size:76px;line-height:1.2;margin:26px 0 18px}
h1 em{font-style:normal;color:#B01A5A}
.sub{font-size:28px;font-weight:700;margin:0 0 26px;color:#4A362B}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:26px;font-weight:700}
.chk li::before{content:"✓";display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#1F6B4F;color:#fff;font-size:20px;margin-right:12px;vertical-align:2px}
.g{position:absolute;right:50px;top:50px;width:470px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.g div{border-radius:18px;height:120px;display:grid;place-items:center}
.g img{width:96px;height:96px;object-fit:contain}
.TP{background:#FCE6EE}.TC{background:#E1F1E8}.SP{background:#E8E7FB}.SC{background:#DDEEF4}
.url{position:absolute;right:56px;bottom:30px;font-size:22px;color:#A07A6A;letter-spacing:.1em}
.br{position:absolute;left:70px;bottom:34px;font-size:22px;font-weight:700;color:#5A3A2A}
</style></head><body>
<div class="l"><span class="eye">48問でわかる 16の恋愛タイプ</span>

<ul class="chk"><li>好きになり方・恋のくせ</li><li>あなたの脈ありサイン</li><li>好きな人との相性</li></ul></div>
<div class="g"><div class="TP"><img src="../koi16/img/LVTP.png"></div>
<div class="TP"><img src="../koi16/img/LATP.png"></div>
<div class="TP"><img src="../koi16/img/RVTP.png"></div>
<div class="TP"><img src="../koi16/img/RATP.png"></div>
<div class="TC"><img src="../koi16/img/LVTC.png"></div>
<div class="TC"><img src="../koi16/img/LATC.png"></div>
<div class="TC"><img src="../koi16/img/RVTC.png"></div>
<div class="TC"><img src="../koi16/img/RATC.png"></div>
<div class="SP"><img src="../koi16/img/LVSP.png"></div>
<div class="SP"><img src="../koi16/img/LASP.png"></div>
<div class="SP"><img src="../koi16/img/RVSP.png"></div>
<div class="SP"><img src="../koi16/img/RASP.png"></div>
<div class="SC"><img src="../koi16/img/LVSC.png"></div>
<div class="SC"><img src="../koi16/img/LASC.png"></div>
