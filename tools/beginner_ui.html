<script id="beginner-ui">
/* ===== ビギナー専用の見せ方（初心者モード・既定ON）。tools/sync_beginner_from_pro.py が付与 =====
   ・結果の先頭に、専門用語を使わない「やさしい結果画面」を出す（判定・数字はPROと同じ計算値をそのまま使う）
   ・PROの専門的な結果（表・用語つきの解説）は、全部「くわしい内容を見る（上級者向け）」に折りたたむ
   ・詳細鑑定・相性の文章は「専門用語を一切使わない」書き方を指示（材料のデータはPROと同じ）
   ・左下で上級者モードに切り替えると、PROと同じ画面になる */
(function(){
  "use strict";
  var KEY='bazi_beginner_mode';
  function on(){ try{ return localStorage.getItem(KEY)!=='0'; }catch(e){ return true; } }
  function safe(fn,dflt){ try{ return fn(); }catch(e){ return dflt; } }
  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch];}); }
  function col(e){ return (typeof ec==='function')?ec(e):'#666'; }
  // 長い文章は2文ずつの段落に分けて読みやすくする
  function paras(t,n){ var ss=String(t||'').match(/[^。！？]+[。！？]?/g)||[], o=[]; n=n||2;
    for(var i=0;i<ss.length;i+=n) o.push('<p>'+esc(ss.slice(i,i+n).join(''))+'</p>'); return o.join(''); }
  function ageLab(a,m){ a=Math.floor(a||0); return a+'歳'+(m?m+'ヶ月':''); }

  /* ---------- ① あなたはこんな人 ---------- */
  function secMe(c){
    var dp=c.pillars[2], det=(typeof KANSHI60_DETAIL!=='undefined')?KANSHI60_DETAIL[dp.ganzhi]:null;
    var phrase=safe(function(){ var d=document.createElement('div'); d.innerHTML=heroHTML(c); var p=d.querySelector('.phrase'); return p?p.textContent.trim():''; },'');
    var h='<div class="bgc" id="bg-me"><div class="bgh"><span class="ic">🌟</span>あなたはこんな人</div>';
    if(phrase) h+='<div class="phrase">'+esc(phrase)+'</div>';
    if(det){
      var tags=String(det.一言||'').split('・').filter(Boolean);
      if(tags.length) h+='<div class="tags">'+tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('')+'</div>';
      var base=String(det.基本||'').replace(/^[^。]*?が合わさ(り|った)、/,'');
      if(base) h+=paras(base);
      var sx=(c.birth&&c.birth.sex==='male')?'男':'女';
      if(det[sx]) h+='<div class="sub">'+(sx==='男'?'男性':'女性')+'としてのあなた</div>'+paras(det[sx]);
    }
    return h+'</div>';
  }

  /* ---------- ② 5つの力のバランス ---------- */
  var MEAN={
    木:{n:'木（成長・やさしさ）',w:'のびのび伸びる力。やる気・思いやり・人とのご縁。'},
    火:{n:'火（情熱・人気）',w:'明るさと情熱。表現・人前に出る力・行動力。'},
    土:{n:'土（安定・信頼）',w:'どっしり安定。まじめさ・信頼・面倒見のよさ。'},
    金:{n:'金（決断・けじめ）',w:'きっぱり決める力。ルール・技術・けじめ。'},
    水:{n:'水（知恵・ご縁）',w:'やわらかい知恵。考える力・柔軟さ・人脈。'}
  };
  var ORD=['木','火','土','金','水'];
  function secPower(c){
    var fe=c.fiveElements||{}, dayEl=c.dayMaster&&c.dayMaster.element;
    var max=Math.max.apply(null,ORD.map(function(e){return fe[e]||0;}).concat([1]));
    var sorted=ORD.slice().sort(function(a,b){return (fe[b]||0)-(fe[a]||0);});
    var strong=sorted[0], weak=sorted[sorted.length-1], short=function(e){return MEAN[e].n.split('（')[0];};
    var hi=ORD.filter(function(e){return (fe[e]||0)===(fe[strong]||0);}), lo=ORD.filter(function(e){return (fe[e]||0)===(fe[weak]||0);});
    var nm=function(L){return L.map(function(e){return '<b style="color:'+col(e)+'">'+short(e)+'</b>';}).join('・');};
    var ws=function(L){return L.map(function(e){return MEAN[e].w.split('。')[0].split('・')[0];}).join('・');};
    var bars=ORD.map(function(e){var n=fe[e]||0,pct=Math.round(n/max*100),k=col(e),isDay=e===dayEl;
      return '<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span style="font-weight:900;font-size:13.5px;color:'+k+'">'+MEAN[e].n+(isDay?' <span class="nobr" style="font-size:10.5px;background:'+k+';color:#fff;border-radius:4px;padding:1px 6px;vertical-align:1px">あなたの中心</span>':'')+'</span><span style="font-weight:900;font-size:13px;color:var(--muted)">'+n+'</span></div><div style="height:9px;background:#EFEADD;border-radius:6px;overflow:hidden;margin-top:4px"><div style="height:100%;width:'+pct+'%;background:'+k+';border-radius:6px"></div></div><div class="bw" style="font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.7">'+MEAN[e].w+'</div></div>';}).join('');
    var same=hi.length===ORD.length;
    var msg=same?'あなたは5つの力をバランスよく持っています。どの場面でも力を発揮しやすいタイプです。'
      :('あなたは'+nm(hi)+'の力が強めで、'+ws(hi)+'が持ち味です。'+
        ((fe[weak]||0)===0?('いっぽう、'+nm(lo)+'の力は持っていません。'+ws(lo)+'を意識すると、バランスが整います。')
                          :('少なめなのは'+nm(lo)+'の力。'+ws(lo)+'を少し意識すると◎。')));
    return '<div class="bgc" id="bg-gogyo"><div class="bgh"><span class="ic">🌿</span>あなたの中にある5つの力</div>'+
      '<div class="bgl">人は生まれた日から、木・火・土・金・水という5つの自然の力を持っています。どの力が多いか少ないかが、あなたの性格や運のクセになります。</div>'+
      bars+'<p style="margin-top:10px;background:#FBF6EA;border-radius:10px;padding:10px 12px;font-size:14px">'+msg+'</p></div>';
  }

  /* ---------- 運気の判定（PROと同じ計算） ---------- */
  function pctOf(c,o){ return unkiPct(o.tenStar, tenStarOf(c.dayMaster.stem,HONKI[o.branch]), strengthType(c)); }
  var SIGN={'◎':'とても良い時期','○':'良い時期','◦':'ふつうの時期','△':'静かに整える時期'};
  function sig(c,o){ var s=unkiSignal(pctOf(c,o)); return {mk:s.mk,lab:SIGN[s.mk]||s.lab,col:s.col}; }
  function meanOf(o){ var f=(typeof TS_FORTUNE!=='undefined')?TS_FORTUNE[o.tenStar]:null; return f||{意:'',助:''}; }
  function first(t){ t=String(t||''); var i=t.indexOf('。'); return i>0?t.slice(0,i+1):t; }
  function duLab(d){ return d.isMonth? ('0歳〜'+ageLab(d.endAge,d.endMonths)) : (ageLab(d.startAge,d.months)+'〜'+ageLab(d.startAge+10,d.months)); }

  /* ---------- ③ いまの運気 ---------- */
  function secNow(c){
    var dd=safe(function(){return curDu(c);},null), y=c.now&&c.now.year;
    var ay=(c.annualFortunes||[]).filter(function(a){return a.year===y;})[0];
    var h='<div class="bgc" id="bg-now"><div class="bgh"><span class="ic">☀️</span>いまの運気</div>';
    var al=safe(function(){ var age=c.now.age,o=[];
      var sb=(typeof Setsuboku!=='undefined')?Setsuboku.analyze({decadeFortunes:c.decadeFortunes,nowAge:age,birthYear:(c.now.year-age)}):null;
      var sAge=(sb&&sb.next&&typeof sb.next.startAge==='number')?sb.next.startAge:null;
      var dEnd=(dd&&typeof dd.endAge==='number')?dd.endAge:(dd&&!dd.isMonth?dd.startAge+10:null);
      var yt=function(n){n=Math.round(n);return n<=1?'あと約1年':'あと約'+n+'年';};
      var sSoon=sAge!=null&&sAge>age&&sAge-age<=2, dSoon=dEnd!=null&&dEnd>age&&dEnd-age<=2;
      if(sSoon) o.push('🔔 もうすぐ、人生の大きな節目をむかえます（'+yt(sAge-age)+'）');
      if(dSoon&&!(sSoon&&Math.abs(sAge-dEnd)<0.6)) o.push('🔔 もうすぐ、10年ごとの運の流れが切り替わります（'+yt(dEnd-age)+'）');
      return o; },[]);
    if(al&&al.length) h+='<div class="alert">'+al.join('<br>')+'</div>';
    h+='<div class="now">';
    if(ay){ var s=sig(c,ay),m=meanOf(ay);
      h+='<div class="nowi" style="--sc:'+s.col+'"><div class="k">今年（'+ay.year+'年'+(c.now?'・'+(ay.year-(c.now.year-c.now.age))+'歳':'')+'）</div><div class="v">'+s.mk+' '+s.lab+'</div><div class="d">'+esc(m.意)+'</div>'+(m.助?'<div class="tip">💡 過ごし方のコツ：'+esc(m.助)+'</div>':'')+'</div>'; }
    if(dd){ var s2=sig(c,dd),m2=meanOf(dd);
      h+='<div class="nowi" style="--sc:'+s2.col+'"><div class="k">いまの10年（'+duLab(dd)+'）</div><div class="v">'+s2.mk+' '+s2.lab+'</div><div class="d">'+esc(m2.意)+'</div>'+(m2.助?'<div class="tip">💡 過ごし方のコツ：'+esc(m2.助)+'</div>':'')+'</div>'; }
    return h+'</div></div>';
  }

  /* ---------- ④ これからの流れ（1年ごと・10年ごと） ---------- */
  function secFlow(c){
    if(!c.now) return '';
    var y0=c.now.year, by=c.now.year-c.now.age;
    var ys=(c.annualFortunes||[]).filter(function(a){return a.year>=y0&&a.year<y0+10;});
    var rows=ys.map(function(a){var s=sig(c,a);return '<div class="yr'+(a.year===y0?' cur':'')+'" style="--sc:'+s.col+'"><div class="hd"><div class="w">'+a.year+'年<small>'+(a.year-by)+'歳'+(a.year===y0?'・今年':'')+'</small></div><div class="s">'+s.mk+' '+s.lab+'</div></div><div class="m">'+esc(first(meanOf(a).意))+'</div></div>';}).join('');
    var dl=safe(function(){return duListWithMonth(c);},[])||[], cur=safe(function(){return curDu(c);},null), age=c.now.age;
    var drows=dl.filter(function(d){var end=d.isMonth?d.endAge:d.startAge+10;return end>age;}).slice(0,5).map(function(d){var s=sig(c,d),isCur=(cur&&d.startAge===cur.startAge&&!!d.isMonth===!!cur.isMonth);
      return '<div class="yr'+(isCur?' cur':'')+'" style="--sc:'+s.col+'"><div class="hd"><div class="w">'+duLab(d)+(isCur?'<small>いま</small>':'')+'</div><div class="s">'+s.mk+' '+s.lab+'</div></div><div class="m">'+esc(first(meanOf(d).意))+'</div></div>';}).join('');
    return '<div class="bgc" id="bg-flow"><div class="bgh"><span class="ic">📅</span>これからの運の流れ</div>'+
      '<div class="bgl">◎とても良い時期・○良い時期・◦ふつう・△静かに整える時期。良い時期は動き出すチャンス、△の時期は準備やお休みに向いています。</div>'+
      '<div class="sub">これからの10年（1年ごと）</div><div class="yl">'+rows+'</div>'+
      (drows?'<div class="sub" style="margin-top:14px">10年ごとの大きな流れ</div><div class="yl">'+drows+'</div>':'')+'</div>';
  }

  /* ---------- ⑤ とくに大きく揺れやすい時期（判定はPROと同じ） ---------- */
  function clean(lab){ return String(lab).replace(/^[甲乙丙丁戊己庚辛壬癸][子丑寅卯辰巳午未申酉戌亥]（(.+)）$/,'$1').replace(/（[甲乙丙丁戊己庚辛壬癸][子丑寅卯辰巳午未申酉戌亥]）$/,''); }
  // 10年の区切りは、上の「10年ごとの大きな流れ」と同じ表記（○歳○ヶ月〜）にそろえる
  function duOfLab(c,lab){ var gz=String(lab).slice(0,2), d=(c.decadeFortunes||[]).filter(function(x){return x.ganzhi===gz&&lab.indexOf('（'+x.startAge+'〜')===2;})[0]; return d?duLab(d):clean(lab); }
  function whenList(x,side,c){ var o=[];
    if(x['d'+side].length) o.push('10年の流れ：'+x['d'+side].map(function(l){return duOfLab(c,l);}).join('・'));
    if(x['y'+side].length) o.push(x['y'+side].map(clean).join('・'));
    if(x['m'+side]&&x['m'+side].length) o.push(x['m'+side].map(clean).join('・'));
    return o.join('<br>'); }
  function block(title,x,c){
    var h='';
    if(x.pressured) h+='<div class="when">'+whenList(x,'U',c)+'</div><div class="how">→ まわりの出来事や人から、思いがけず崩されやすい形。自分を責めすぎず、ひとりで抱え込まないことが大切です。</div>';
    if(x.attack) h+='<div class="when" style="margin-top:6px">'+whenList(x,'A',c)+'</div><div class="how">→ 自分の言動がきっかけで崩しやすい形。勢いで決めたり押し切ったりせず、ひと呼吸おきましょう。</div>';
    return '<div class="warn"><div class="wt">'+title+'</div>'+h+'</div>';
  }
  function secShake(c){
    var ts=safe(function(){return detectTensen(c);},null), tn=safe(function(){return detectTensenNatal(c);},null);
    if((!ts||!ts.any)&&(!tn||!tn.any)) return '';
    var h='<div class="bgc" id="bg-shake"><div class="bgh"><span class="ic">⚡</span>とくに大きく揺れやすい時期</div>';
    if(ts&&ts.any){
      h+='<div class="bgl">生まれ持った力と、めぐってくる運が、正面から強くぶつかる時期です。暮らしや仕事が大きく入れ替わりやすく、基本的には注意が必要な時期として、早めに備えておきましょう。</div>';

        det.addEventListener('toggle',function(){ foldOpen=det.open; document.documentElement.classList.toggle('bg-fold-open',foldOpen); });
        (body||res).appendChild(det);
      }
      relabelAi(); relabelWorry(); navOn();
    });
  }
  // 折りたたみの中へ移動する操作は、先に開いてから移動する
  document.addEventListener('click',function(e){
    var t=e.target&&e.target.closest&&e.target.closest('button[data-t],.feat-link'); if(!t) return;
    if(t.hasAttribute('data-t')){ var el=document.getElementById(t.getAttribute('data-t')); var d=el&&el.closest('.beginner-pro-collapse'); if(d) d.open=true; }
    else { document.querySelectorAll('.beginner-pro-collapse').forEach(function(d){ d.open=true; }); }
  },true);
  addEventListener('beforeprint',function(){ document.querySelectorAll('.beginner-pro-collapse').forEach(function(d){ d.dataset.was=d.open?'1':''; d.open=true; }); });
  addEventListener('afterprint',function(){ document.querySelectorAll('.beginner-pro-collapse').forEach(function(d){ d.open=d.dataset.was==='1'; }); });
  if(typeof window.renderResult==='function' && !window.renderResult._bgui){
    var orig=window.renderResult;
    window.renderResult=function(){ var r=orig.apply(this,arguments); apply(); return r; };
    window.renderResult._bgui=1;
  }

  /* ---------- 詳細鑑定・相性の文章：専門用語を一切使わない（初心者モードのみ・材料データはPROと同じ） ---------- */
  var PLAIN='\n【書き方＝最重要・絶対厳守（ビギナー版）】この鑑定は、四柱推命をまったく知らない超初心者が読みます。占いの専門用語は一切書かないこと。'+
    '書いてはいけない言葉の例：命式・四柱・干支・十干・十二支・天干・地支・五行・陰陽・通変星（比肩・劫財・食神・傷官・偏財・正財・偏官・正官・偏印・印綬）・十二運（長生・沐浴・冠帯・建禄・帝旺・衰・病・死・墓・絶・胎・養）・大運・年運・月運・日運・立運・会局・三合・方合・半合・冲・刑・害・破・干合・支合・空亡・天中殺・宿命中殺・天戦地冲・律音・納音・節木運・月支元命・蔵干・身旺・身弱・喜神・忌神・用神・日主・日柱・月柱・年柱・時柱・吉凶星や神殺の名前（天乙貴人・咸池・駅馬など）。'+
    '「甲」「子」のような干支の字も書かない。大運は「10年ごとの運の流れ」、年運は「その年の運」、五行は「5つの自然の力（木・火・土・金・水）」のように、ふつうの言葉に言い換える。'+
    '用語の言い換えをカッコで添える書き方もしない（用語そのものを出さない）。内容の深さ・根拠・具体的な年や年齢は削らず、日常の場面がイメージできる言葉で、一文は短く、段落を分けて読みやすく書く。';
  // 上の指示と食い違う「専門用語は使ってよい」「名指しで挙げる」部分は、初心者モードでは外す
  function plainUser(u){
    return String(u).replace(/専門用語[^。\n]*使ってよい[^。\n]*。/g,'')
      .replace(/【書き方】四柱推命の専門用語[^\n]*/g,'')+PLAIN+
      '\n上の指示の中で「星名・干支・五行の数などを名指しで挙げる」とある部分は、名前を出さず、その意味だけを日常の言葉で書くこと（根拠の説明は残す）。';
  }
  if(typeof window.generateReading==='function' && !window.generateReading._bgplain){
    var g0=window.generateReading;
    window.generateReading=async function(user,localText,system,deep){
      if(!on()) return g0.apply(this,arguments);
      document.querySelectorAll('.loading').forEach(function(l){ var t=l.lastChild; if(t&&t.nodeType===3) t.nodeValue=t.nodeValue.replace(/命式/g,'運勢').replace(/専門用語そのままの本格鑑定/g,'鑑定'); });
      var res=await g0.call(this,typeof user==='string'?plainUser(user):user,localText,system,deep);
      // 通信できないときの端末内の鑑定（オフライン）も、専門用語を使わない文章に差し替える
      if(res&&res.fallback){ var t=safe(function(){ return plainOffline(user); },''); if(t) res.text=t; }
      return res;
    };
    window.generateReading._bgplain=1;
  }
  if(typeof window.appendPro==='function' && !window.appendPro._bgplain){
    var p0=window.appendPro;
    window.appendPro=function(){ if(on()) return; return p0.apply(this,arguments); };  // 初心者モードでは「本格版（専門用語あり）」を追加しない
    window.appendPro._bgplain=1;
  }

  /* ---------- 入力欄の上の案内（①②③）：最初だけ表示。✕で閉じられ、1回占ったら次からは出さない ---------- */
  var IKEY='bazi_beginner_intro_done';
  function introDone(){ try{ return localStorage.getItem(IKEY)==='1'; }catch(e){ return false; } }
  function markIntro(){ try{ localStorage.setItem(IKEY,'1'); }catch(e){} }
  if(introDone()) document.documentElement.classList.add('bg-intro-done');
  document.addEventListener('click',function(e){
    if(e.target&&e.target.closest&&e.target.closest('#bg-intro-x')){ markIntro(); document.documentElement.classList.add('bg-intro-done'); }
  });
  if(typeof window.renderResult==='function' && !window.renderResult._bgintro){
    var r1=window.renderResult;
    window.renderResult=function(){ var r=r1.apply(this,arguments); markIntro(); return r; };  // 今回は表示したまま、次に開いたときから非表示
    window.renderResult._bgintro=1;
  }

  /* ---------- 切替ボタン ---------- */
  function label(){ var b=document.getElementById('bg-mode'); if(b) b.textContent=on()?'⚙ 上級者モードに切替':'🔰 初心者モードに切替'; }
  function setMode(v){
    try{ localStorage.setItem(KEY,v?'1':'0'); }catch(e){}
    label(); document.documentElement.classList.toggle('bg-on',v);
    safe(function(){ if(typeof chart!=='undefined' && chart) window.renderResult(); else apply(); });
    safe(function(){ if(v) compatOn(); else compatOff(); });
  }
  function init(){
    if(!document.getElementById('bg-mode')){
      var b=document.createElement('button'); b.id='bg-mode'; b.type='button';
      b.onclick=function(){ setMode(!on()); };
      document.body.appendChild(b);
    }
    label(); apply();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>
