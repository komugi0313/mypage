<style id="tb-read-css">
/* 読みやすさ（tools/add_textbook_read.py が付与）：行末の泣き別れ防止。文言・内容は変えない */
p,li,dd,h1,h2,h3,h4,figcaption{line-break:strict}
.tb-nb{white-space:nowrap}
</style>
<script id="tb-read">
/* 段落の最後の4文字を1かたまりにして、最終行が1〜2文字だけになる「泣き別れ」を防ぐ（行数は増えない） */
(function(){
  function fix(){
    document.querySelectorAll('p,li,dd,dt,h1,h2,h3,h4,figcaption,.point,.b,.h,.lead,.sub,.ex').forEach(function(el){
      if(el.dataset.tbno||el.closest('table')) return; el.dataset.tbno='1';  // 表の中は列幅が変わるので触らない
      var len=el.textContent.trim().length;
      var t=el.lastChild;
      while(t&&t.nodeType===1&&t.lastChild&&/^(inline|inline-block)$/.test(getComputedStyle(t).display)) t=t.lastChild;
      if(!t||t.nodeType!==3) return;
      var v=t.nodeValue.replace(/\s+$/,''); if(v.length<6||len<10) return;
      var k=4, W=/[ァ-ヶーA-Za-z0-9]/; while(k<9&&k<v.length&&W.test(v.charAt(v.length-k))&&W.test(v.charAt(v.length-k-1))) k++;  // カタカナ語・英数字の途中では切らない
      var sp=document.createElement('span'); sp.className='tb-nb'; sp.textContent=v.slice(-k);
      t.nodeValue=v.slice(0,-k); t.parentNode.insertBefore(sp,t.nextSibling);
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fix); else fix();
})();
</script>
